chapter: 0
title: The Night of the Fireworks
format: SCRIPT_FORMAT_v2.md
side_story: true      # a trial side story (S37), not part of the chapter count: the chapter-length rules do not apply
when: "One month after the Busan breakwater (after chapter 40): the night of the Busan fireworks festival, then the next morning."
story_beats: "codex/S37_ROMANCE_TRIAL.md (the owner's request of 29 October: the closest romance the series can show, a trial mini comic)"
cast:
  kang_jaeha: coat          # the black field coat (from ch 41), dark grey shirt; turnaround_coat.png
  moon_ahin: summer         # the white summer dress (S33), no hat at night; front_summer.png, turnaround_summer.png
  lyra: default
  pim: default
  borro: default            # the white husk face tied on (in public)
  nib: mask                 # seal 3/5 armour and the cracked husk mask (in public)
locations: [busan_beach_night, hotel_busan]
continuity:
  - "Both are adults: Kang Jaeha is 24 (178 cm), Moon Ahin is 22 (170 cm; her head top at his eyebrows). Romance only as far as regular (not adult-rated) manhwa go: kisses, embraces, silhouettes, a fade to black. No nudity, nothing explicit, no sexual poses."
  - "Jaeha, look coat: the knee-length black field coat with its orange lining, a dark grey shirt, the navy cargo trousers with grey knee patches, black boots, black fingerless gloves; the pencil behind his RIGHT ear, the fringe over his LEFT eye. His RIGHT forearm has healed (no splint). From P03 to P16 she wears his coat over her shoulders; he is in his grey shirt."
  - "Moon Ahin, look summer: the white summer dress (thin straps, airy off-shoulder chiffon sleeves, the deep V, the silver ribbon under the bust, the flared knee-length ruffled skirt with the high slit on her LEFT side), white lace gloves, strappy white sandals, long loose black hair with the silver ribbon bow at the back of her head; the baton in its slim white holster at her RIGHT hip. No sun hat at night. From P05 her RIGHT glove is off. From P13 her hair is loose and the ribbon is gone; at P17 it is tied round Jaeha's RIGHT wrist."
  - "Seating on the sea-wall steps (P03-P10): Ahin sits on Jaeha's LEFT (picture right when they face the camera). Her RIGHT hand is the one next to him."
  - "The beach (location busan_beach_night, no key; draw it generic): a wide sandy beach at night, a sea wall of broad concrete steps down to the sand, a promenade above with food carts and strings of warm bulbs, the festival crowd far off down the sand, and across the bay a long suspension bridge lit in slowly changing colours; fireworks over the water. Never copy a real photograph."
  - "The hotel (location hotel_busan, no key; draw it generic): a tall glass hotel tower on the bay; a lift with mirrored walls and a brass rail; a carpeted corridor with a window at the far end; a room with a floor-to-ceiling window over the bay."
  - "Lyra, Pim, Borro and Nib appear only in the gags at P09 and P15 (Nib also at P17). Pim: 1.4 m, the black gaming headset round his neck. Scale: Borro 2.4 m, Lyra 182 cm, Nib 105 cm."
plants: []
hook_type: arrival

