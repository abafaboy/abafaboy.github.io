chapter: 31
title: Two Pulses
format: SCRIPT_FORMAT_v2.md
when: "Friday, about 2:45 AM, the rim sealing from 01:58 to 00:00: the husk bridge, the rim ledge, the closing rim; then outside, under pier 7."
story_beats: ARC3_4_BEATS.md#31-two-pulses
cast:
  kang_jaeha: crew
  nib: mask
  borro: default
  lyra: default
  moon_ahin: default
  ahin_husks: default        # 29, then 28 (P31)
  crew_pyo: default
  crew_dami: default
  crew_woo: default
  crew_ho: default
  han_sora: crop             # with the harness; the charcoal Kanghan jacket tied round her waist by its sleeves
locations: [farm_canyon, hanriver_gate]
continuity:
  - "Positions at P01: Sora stands on the far end of the husk bridge with one boot on No. 1's back, facing along the bridge toward Jaeha and Moon Ahin, who are three-quarters of the way across; behind Sora, on the rim ledge, Nib (field form) to her LEFT, Borro (rest form: released at ch 30 P43, his one-minute cooldown nearly over) and Lyra (field form) to her RIGHT, the crew behind them by the narrowing rim."
  - "Sora's crossbow is a compact repeating crossbow with a short box magazine; she reloads it with one flick. She also carries one heavy bolt with a violet core tip, which she loads at P20. The brass compass on its short wrist chain: its needle, a sliver of boss core, swings toward the nearest summon in field form; summons in rest form don't move it."
  - "Jaeha: the crew kit, bruised and bleeding, still carrying the husks (the white threads) until P33; LINK lets him give his summons silent orders (shown as thin coloured threads and small inner lines)."
  - "Borrowed Thunder II (P22-P26): Sora's heavy bolt hits Borro's shield; Jaeha PASSes the force through his own body into Lyra (minus 30%); Lyra's arrow carries it and shoots the compass off Sora's wrist."
  - "The rim (P35-P47): the tall ellipse of white light is down to a slit 1 m wide inside the closing steel iris; Borro, in field form, braces the iris plates apart with his back and his shield while everyone squeezes through."
  - "Outside (P48 onward, location hanriver_gate): under the bridge at night, inside the Kanghan enclosure; the gate slit in pier 7's shadow is now covered by the outer half of the steel frame, closed, its light gone; wet riverbank mud, the orange sodium lights, the flickering lamp above the faded 7."
plants:
  - "PLANT P27-P29: Sora: 'Director Baek is going to love you' (ch 32)."
  - "PLANT P55-P60: Jaeha's hands won't stop shaking (ch 33)."
hook_type: personal

