chapter: 39
title: The Wall of Busan
format: SCRIPT_FORMAT_v2.md
when: "Friday, 7:00 to 8:10 PM, Busan: the fish market and the harbour, the neck of the breakwater, and Kanghan's barge."
story_beats: ARC5_BEATS.md#39-the-wall-of-busan-hook-decision
cast:
  kang_jaeha: training       # the tracksuit; bandage on the LEFT forearm; the splinted RIGHT index finger
  geum_okran: default
  nib: mask                  # field form from P17
  borro: default             # field form from P17; no husk face in the fight
  lyra: default              # field form from P17
  pim: default               # field form from P17 (wings open, the headset round his neck)
  kang_seoa: default         # school uniform; NEVER any fan service
  market_aunties: default
  evacuees: default          # new generic (2.20)
  yoo_bomi: default
  choi_dongmin: default
  song_yerin: default
  assoc_yang: default
  fishermen: default
  brine_crawler: default
  moon_ahin: default         # her white coat-dress again for the break (2.11)
  ahin_husks: default        # Saebyeok and the other 27
  kanghan_engineer: default
  kanghan_tactical: default
  han_sora: tank
  deep_lantern: default      # hushed (4d.3)
locations: [busan_fish_market, assoc_busan, geum_stall, busan_breakwater, kanghan_barge]
continuity:
  - "Geography: the fight is at the NECK of the breakwater, where it leaves the harbour, the same place Geum held ten years ago (ch 35): the fish market and Geum's orange tent are 200 m behind it along the harbour's edge, with a concrete pier and the sea wall in front of the market. The breakwater runs 1 km out to the red lighthouse; the sea gate is 2 km out."
  - "Jaeha: look `training` (the purple tracksuit, the towel, the bandaged LEFT forearm, the RIGHT index finger splinted with a chopstick and white tape). He bleeds from the nose from P31, and from the nose and ears from P61. The LINK lines from him are thin threads in each summon's colour; the husks' LINK lines are cyan."
  - "The summons in field form from P17 to the end: Nib amber eyes and outline (the white bandage still round his RIGHT upper arm, ch 35); Borro moss green; Lyra river blue; Pim lilac with his wings open 2.6 m and the headset round his neck. In a break, field form comes back after a minute, so nobody's timer matters this chapter."
  - "Geum: the checked apron, the purple tracksuit, the floral headscarf, pink slippers, the steel LEFT arm, the ladle in her RIGHT hand. Her strikes ring like a bell and throw rings of white force; when she holds, the ladle's bowl glows white."
  - "Kang Seoa (15): her school uniform (2.6), round glasses, the calculator keychain on her backpack; the market's battered red megaphone from P04. A child: never any fan service. The camera stays at her eye level or above, never below. In P52 she is lured (her eyes glazed with violet light) and walks toward the pier's edge; in P55 Pim's signal wakes her and her first move is to haul a lured little boy back from the edge; nothing worse. Never a damsel."
  - "Song Yerin: her oversized off-white healer's jacket with the mint trim, the pink first-aid bag, black leggings; covered, as always. Choi: his navy and hi-vis rescue jacket; his white van with the orange light bar."
  - "Moon Ahin (from P26): her white coat-dress (2.11) with the deep V and the high slit up her LEFT side, sheer white stockings, white heeled boots, white gloves, the silver baton in her RIGHT hand, the silver ribbon bow. Fan service (adult) in battle; the camera never below her waist level. Her 28 husks are polished porcelain white with silver seams; Saebyeok (No. 1) is no different to look at."
  - "Han Sora (P44): on the barge's tilted deck in her tank-top look (the charcoal Kanghan jacket tied round her waist by its sleeves, the fitted black tank top with the low scoop neckline, her shoulders and toned arms bare), her crossbow, the bandaged RIGHT wrist, the slim silver compass on her LEFT wrist."
  - "The Deep Lantern (4d.3), hushed, from P34: a whale-like leviathan about 150 m long, grey-blue hide crusted with coral, barnacles and kelp, rusted steel plates of the old lid stuck in the hide of her back like scales; two webbed hands, each 15 m across; a curved crest-spine 30 m tall on her head with the great lantern at its tip, a cage of pale coral 12 m tall round a core burning violet and pulsing; a Hush crack down her brow between small, ancient, dull-violet eyes, leaking violet ash. Scale: Jaeha is smaller than one of her fingers."
  - "Kanghan's anchors (6): black steel harpoon anchors 2 m long on chains as thick as an arm, the farm's stamped mark on the links; each anchor's chain joins its shank with a big steel shackle and pin."
plants:
  - "PLANT P02: Yang evacuates against Seoul's orders (ch 40, Part Two: Hwang)."
  - "PLANT P49: the Lantern takes Jaeha for her old Operator: 'You stopped' (Operator #1; ch 40)."
  - "PLANT P72: [STORE: READY] (ch 40: RELEASE I)."
hook_type: decision

panels:

