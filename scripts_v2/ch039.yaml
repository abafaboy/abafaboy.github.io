    light: "night; violet from the sea; red siren lights"
    art: >
      High and wide over Busan's harbour at night: siren horns on poles along the waterfront blare; beyond the breakwater the sea bubbles
      and glows violet in a widening ring two kilometres out, where Kanghan's barge lists, its crane tilted; the fish market's lights
      burn at the harbour's edge. Scale: the breakwater is a 1 km thread; the barge a black chip.
