chapter: 32
title: Buried
format: SCRIPT_FORMAT_v2.md
when: "Friday: under the bridge from 2:55 AM to dawn; the Hunter Association at 9 AM; Kanghan Tower at about 2 PM; the 4 PM news in the Gate Rescue break room; the columbarium at 5:40 PM; Baek's call at dusk; the rooftop at 6:58 PM."
story_beats: ARC3_4_BEATS.md#32-buried
cast:
  kang_jaeha: crew           # P01-P20; from P29 the grey hoodie (hoodie)
  nib: mask
  borro: default
  lyra: default
  song_yerin: default
  yoo_bomi: default
  choi_dongmin: default
  kang_seoa: default         # voice on the phone only (P07)
  moon_ahin: default         # muddy (P01-P15); a fresh white coat-dress, hair loose, from P38
  ahin_husks: default        # 28 in all, No. 1 (Saebyeok) among them
  crew_pyo: default
  crew_dami: default
  crew_woo: default
  crew_ho: default
  kanghan_guard: default
  gate_rescue: default       # generic Gate Rescue Corps responders, see continuity
  police: default
  inspector_ryu: default
  deputy_hwang: default      # generic, new: the Association's deputy director, see continuity
  baek_taegun: default
  han_sora: crop             # on the phone (P53-P58), in her car, no harness; the jacket thrown on the back seat
locations: [hanriver_gate, assoc_lobby, gate_rescue_room, kanghan_office, columbarium, sora_car]
continuity:
  - "Kang Seoa (15): her outfit as each panel says; glasses, the calculator keychain. Never any fan service. The camera stays at her eye level or above, never below."
  - "Jaeha: the crew kit, filthy with mud and blood, until P20; Yerin's healing closes the cuts and the bruises fade, but his hands go on shaking all chapter (show a faint tremor line on his fingers in every panel where his hands are visible). From P29 the grey hoodie, clean, the plaster on his cheek."
  - "Gate Rescue Corps responders (generic): Choi's navy and hi-vis yellow-green rescue jackets, gold foil blankets, white vans with orange light bars. Police: navy uniforms, fluorescent yellow-green vests."
  - "Moon Ahin: mud-caked white coat-dress, the silver ribbon lost, hair loose and tangled, until P15. From P33: a fresh white coat-dress of the same cut, white gloves (the LEFT one off, tucked into her belt), the baton, but no ribbon, her long black hair loose, a small bandage on the back of her bare LEFT hand."
  - "No. 1 is named Saebyeok ('dawn') at P16; it looks no different."
  - "Deputy Director Hwang (generic, new): the Association's deputy director, 60, silver hair, a soft smiling face, rimless glasses, an Association grey suit; on the underside of his lapel, seen only when it flips over, a small silver hexagon-in-a-hexagon pin."
  - "The Gate Rescue break room (new location gate_rescue_room): a cramped room in the Gate Rescue Corps station, vending machine, folding chairs, a wall TV, foil blankets everywhere."
  - "Baek's office (kanghan_office) in the afternoon: the glass wall over Seoul in hard daylight, the blinds up, the violet core in its case."
  - "Sora's car (new location sora_car): the driver's seat of a black sports car parked on a dark Han River overpass at dusk, the river and the bridges below; Sora in her crop-top look off duty (outfit `crop`: the fitted black crop top with the low scoop neckline, ending above her navel, her shoulders, arms and toned midriff bare (no harness off duty)), the charcoal jacket thrown on the back seat, a fresh bandage round her RIGHT wrist."
plants:
  - "PLANT P11-P13: Choi's USB copy hidden in a kimbap box (Arc 5)."
  - "PLANT P19, P25-P26: Deputy Director Hwang wears Kanghan's pin under his lapel (Arc 5)."
  - "PLANT P27-P29: the video is held back from going public until it can stick (Arc 5)."
  - "PLANT P05, P31-P32, P55: Jaeha's hands won't stop shaking (ch 33)."
  - "PLANT P36-P42: 'Do you want the hospitals dark, Ahin?' Not yet a break (Arc 5)."
  - "PLANT P57-P59: 'Make him come to us.' (Arc 5)"
hook_type: threat

