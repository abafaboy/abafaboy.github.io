chapter: 12
title: His Summons Go First
format: SCRIPT_FORMAT_v2.md
when: "Tuesday about 6:20 PM, the end of the Market Break (the market's edge and the fish market's freezer lane); the next three days (the clip goes viral); Kanghan Tower and the Kanghan guild hall on Thursday night; the rooftop on Friday night."
story_beats: STORY_BIBLE_v4.md#arc-2-chapters-612-the-trap-rats-chapter-by-chapter
cast:
  kang_jaeha: vest
  nib: mask
  borro: default
  kang_seoa: default
  song_yerin: default
  yoo_bomi: default
  choi_dongmin: default
  granny_kimchi: default    # generic, from ch 11
  bomi_parents: default     # generic, see continuity
  marsh_serpent: default
  baek_taegun: default      # name card in this chapter (P50)
  moon_ahin: default        # glamour panel, no name card until ch 24
  ahin_husks: default       # her forty polished husks
locations: [mangwon_market, fish_market, rooftop_room, kanghan_office, kanghan_guild_hall]
continuity:
  - "Jaeha in the break (P01–P34): the torn, bloody vest over the shoulder bandage, the forearm bandage, blood under his nose; from P05 his hands are burned (he carries Borro's burns): the fingerless gloves stay on, their palms scorched, red blisters on his bare fingers. From P35 (days later) a clean vest with Seoa's red stitches, plasters on his bare fingers (more on his palms under the fingerless gloves, their edges showing at the glove's edge), the forearm bandage."
  - "Nib: seal 2/5 look with the cracked husk mask in public; field form (amber) P01–P29, on the call from ch 11 P61 (its clock runs out at P30); rest form after. At home (P61–P72) no mask."
  - "Borro: husk face in public; field form (moss green) P01–P34, on the call from ch 11 P71; his shield glows dull red where the serpent's steam hits it (P04–P14). At home no husk face."
  - "Kang Seoa (15): school uniform in the break and at school, a hoodie and jeans at home; glasses; never any fan service. The camera stays at her eye level or above, never below."
  - "Yoo Bomi: her full design; no drone in the break (it broke in ch 11); from P44 a brand-new white drone with a pink ribbon tied on it."
  - "Bomi's parents (generic, no name cards): a round, cheerful man in his fifties in a white cook's jacket, and a small woman in her fifties in an apron, outside their little restaurant (location bomi_room, outside)."
  - "The marsh serpent (CHARACTER_DESIGNS_v2.md 4b.4): 20 m long, as thick as a small car, jade-green scales banded with dull gold, a hooded head with two backswept bone-white horns, yellow slit eyes, steam and heat shimmer pouring off it, a small Hush crack leaking violet ash on its brow. It spits scalding steam. In the cold, frost spreads over its scales and it slows: frost means it is failing."
  - "The freezer lane (location fish_market): the back lane of the market's fish section, 4 m wide and 40 m long, a dead end at a loading wall: walk-in freezer doors along both sides, stacks of ice crates, two refrigerated trucks with their back doors open, frost on the walls, cold white mist along the ground, white fluorescent light."
  - "Director Baek Taegun (CHARACTER_DESIGNS_v2.md 2.13, characters_v2/baek_taegun/): his face is shown for the first time (P50), with his name card. Charcoal three-piece suit, silver rectangular glasses, salt-and-pepper hair combed back, the cane with a smoky violet core in silver claws; both hands folded on the cane; he smiles with his mouth only."
  - "Moon Ahin (CHARACTER_DESIGNS_v2.md 2.11, characters_v2/moon_ahin/): her full design: the fitted white coat-dress with the deep V neckline and the high slit up her LEFT side, sheer white thigh-high stockings with lace tops showing at the slit, white heeled knee boots, white gloves, long black hair with the silver ribbon bow, the silver baton in her RIGHT hand. Fan service per CHARACTER_DESIGNS_v2.md: a beautiful face, a confident full-figure pose, never a low angle up the slit. Her forty husks are polished porcelain white with silver seams and move in perfect unison."
  - "The Kanghan guild hall (location kanghan_guild_hall, new): a vast white training hall with a polished pale floor, tall windows over the night city, rows of white pillars; forty polished husks standing in eight perfect rows."
plants:
  - "PLANT P34: the serpent's window offers only HARVEST (ch 50)."
  - "PLANT P51: [OPERATOR PROBABILITY 91%]; Baek wants Black Hound to invite him and to watch his husks (Arc 3, ch 16)."
  - "PLANT P55–P57: Moon Ahin has seen the clip (Arc 4)."
hook_type: decision

