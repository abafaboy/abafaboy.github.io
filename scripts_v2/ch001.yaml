    calm: top
    lines:
      - {who: kang_jaeha, type: inner, text: "WHO PUTS A BOSS IN FACTORY CHAINS?"}
    notes: "PLANT P34 (Arc 4)."

  - id: P35
    recipe: insert
    shape: strip
    gap: short
    bg: black
    camera: "low, close on Jaeha's boot stepping onto the hall floor"
    light: "green-dusk light; his boot's hard shadow"
    art: >
      Jaeha's black work boot takes one step onto the dusty stone floor of the hall.
    calm: none
    sfx:
      - {text: "TAK", style: quiet, at: [0.55, 0.45], size: M, rot: 0}

  - id: P36
    recipe: tone-flip
    shape: strip
    gap: black
    bg: black
    camera: "extreme close-up of the dark hole in the knight's helm"
    light: "black and red only"
    art: >
      Extreme close-up: the dark hole in the knight's helm, its cracked rim leaking violet ash. Deep inside,
