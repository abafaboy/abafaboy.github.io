    calm: top
    lines:
      - {who: mok_hangyu, type: speech, text: "SO YOU WALK IN, IT COMES FOR YOU, AND WE KILL IT FROM BEHIND.", side: l}
      - {who: mok_hangyu, type: speech, text: "SUMMONS GO FIRST. THEN SUMMONERS.", side: l}

  - id: P29
    recipe: reaction
    shape: inset-l
    gap: short
    bg: white
    camera: "close, Jaeha glancing up"
    light: "red light from above on his face; a flat dark gradient behind"
    face: public
    art: >
      Jaeha (kang_jaeha, vest) keeps his polite smile, but a sweat drop runs down his temple and his eyes have gone
      up to the lamp.
    calm: right
    lines:
      - {who: kang_jaeha, type: speech, text: "SIR, THAT LAMP ABOVE THE DOOR IS RED.", side: l}

  - id: P30
    recipe: insert
    shape: strip
    gap: short
    bg: black
    camera: "close on the lamp"
    light: "the lamp is the only light"
    art: >
      The iron lamp above the door: an old cage of iron around a burning red glow, cracked glass, rust.
    calm: none
    lines:
      - {who: offpanel:kang_jaeha, type: speech, text: "ON EVERY SURVEY I'VE SEEN, RED MEANS THE GRADE IS WRONG."}

  - id: P31
    recipe: talk
    shape: wide
    gap: short
    bg: white
    camera: "low, Mok shoving Jaeha forward with the shield"
    light: "red lamp light; Mok's face half in hard shadow"
    art: >
      Mok's camera smile drops: flat dead eyes. He shoves Jaeha (kang_jaeha, vest) toward the door with the edge
      of his tower shield. Jaeha stumbles a step.
    calm: top
    lines:
      - {who: mok_hangyu, type: speech, text: "THEN YOU'D BETTER RUN FAST.", side: l}
    sfx:
      - {text: "THUD", style: impact, at: [0.60, 0.70], size: M, rot: 0}

  - id: P32
    recipe: eyes
    shape: strip
    gap: short
    bg: black
    camera: "extreme close-up, Jaeha's eyes in profile, turned toward the door"
    light: "red light across the eyes only"
    face: private
    art: >
      Extreme close-up: Jaeha's narrowed eyes (kang_jaeha), the polite mask gone, measuring the door.
    calm: none
    lines:
      - {who: kang_jaeha, type: inner, text: "IF THEY CLOSE THAT DOOR, THERE'S ONE WAY OUT. THROUGH THE BOSS."}

  - id: P33
    recipe: monster-reveal
    shape: tall
    gap: long
    bg: black
    camera: "low from behind Jaeha in the doorway, the hall stretching away to a kneeling giant"
    light: "back light: green-dusk shafts from a broken roof onto the far end; Jaeha a dark silhouette"
    art: >
      Through the open door (location boss_room): a vast pillared hall, green-dusk light falling in shafts from
      a broken roof. At the far end kneels a giant armoured knight (knight_commander), head bowed, wrapped in
