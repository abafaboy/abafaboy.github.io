    calm: top
    silent: true
    sfx:
      - {text: "GRRRNNK", style: quiet, at: [0.12, 0.80], size: M, rot: 0}

  - id: P34
    recipe: insert
    shape: wide
    gap: short
    bg: black
    camera: "close on a chain cuff at the knight's wrist"
    light: "green-dusk light from above; cold hard highlights on the steel"
    art: >
      A heavy chain cuff on the knight's armoured wrist. The chain is modern factory steel: matte black, uniform
