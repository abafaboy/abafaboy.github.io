    light: "a work lamp clipped to the lighthouse rail; black sea"
    art: >
      Friday before dawn, from high on the lighthouse (location busan_breakwater): at the end of the breakwater, under a work lamp clipped
      to the rail, stand Geum (geum_okran), Jaeha (kang_jaeha, training), Borro (borro), Lyra (lyra), Nib (nib, mask) and Pim (pim,
      headset), small; far out, the barge's floodlights burn on the black sea. Scale: the walkway is 6 m wide.
    acting:
      geum_okran: "small, the ladle on her shoulder, facing Borro"
      kang_jaeha: "small, rubbing his hands against the cold"
      borro: "small, the shield on his arm"
      lyra: "small, wrapped in a towel held closed at her chest, mid-yawn, swaying sleepily on her feet"
      nib: "small, crouched on the parapet"
      pim: "small, beside Nib, headset on"
    hands:
      geum_okran: "small: RIGHT hand holds the ladle on her shoulder; steel LEFT arm (three metal fingers and a thumb) at her side"
      kang_jaeha: "bare hands: small: rubbing his hands together in front of his chest"
      borro: "small: LEFT forearm through the shield's strap, the shield's foot on the ground; RIGHT arm hanging (four fingers and a thumb)"
      lyra: "small: both hands hold the towel closed at her chest"
      nib: "small, crouched on the parapet: hands (four fingers and a thumb) hanging between his knees"
      pim: "small: arms at his sides (three fingers and a thumb)"
