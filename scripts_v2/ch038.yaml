chapter: 38
title: Store
format: SCRIPT_FORMAT_v2.md
when: "Friday, Busan: 4:00 AM, 8:00 AM, noon and 4:00 PM on the breakwater (Borro's field form comes back every four hours); 1:30 PM on an old fishing boat near Kanghan's barge; 6:40 to 6:59 PM at Geum's stall."
story_beats: ARC5_BEATS.md#38-store-hook-countdown
cast:
  kang_jaeha: training       # the tracksuit; bandage on the LEFT forearm; RIGHT index finger splinted from P17
  geum_okran: default
  borro: default             # field form at 4:00, 8:00, 12:00 and 16:00
  lyra: default              # her own outfit; look `swimsuit` for the dive (P28-P41)
  nib: mask
  pim: default               # the headset; field form on the boat (P33-P39)
  fishermen: default         # the old fisherman Jaeha saved on Tuesday night (ch 34-35)
  han_sora: shorts           # on the barge's rail; the jacket tied round her waist
  kanghan_tactical: default
  kanghan_engineer: default  # at the drill console (P55)
  moon_ahin: summer
  ahin_husks: default        # Saebyeok with the parasol
  baek_taegun: default       # his voice on the phone only
  kang_seoa: default         # school uniform; NEVER any fan service
  deep_lantern: default      # never shown whole (4c.5)
locations: [busan_breakwater, fishing_boat, kanghan_barge, geum_stall]
continuity:
  - "Jaeha: look `training`: the purple tracksuit, a towel round his neck, a clean bandage on his LEFT forearm; notebook in the LEFT chest pocket, pencil behind the RIGHT ear, fringe over the LEFT eye. From P17 his RIGHT index finger is splinted with a chopstick and white tape. When he holds force (STORE), his RIGHT arm and then his chest glow faintly white-gold, and his bones creak."
  - "Borro: field form (moss-green glow) only in the four training sessions: P03-P06 and P14-P16 (4:00 AM), P21-P24 (8:00 AM), P25 (noon), P45 (4:00 PM); rest form otherwise. The white husk face in public (the stall, the harbour), not on the empty breakwater before dawn."
  - "Lyra: her own outfit (2.10), except the dive, P28-P41: look `swimsuit` (2.20: the river-blue halter bikini with engraved silver filigree cups, the jewelled silver hip girdle, the silver filigree arm cuffs, bangles and lace choker, the gemmed band on her LEFT thigh, the braid over her LEFT shoulder; no wrap). Field form for the dive, P31-P39 (river-blue glow and outline). Fan service (adult); the camera never below her waist level."
  - "Nib: seal 3/5 armour; the cracked husk mask in public, none inside Geum's tent (P53-P60); a clean white bandage round his RIGHT upper arm (the cut from ch 35); rest form."
  - "The LINK leash (600 m, ch 8): the rest-form summons must stay near Jaeha, so everyone goes out on the fishing boat (P28-P41), Borro included."
  - "Pim: the black gaming headset; field form on the boat, P33-P39 (wings open, eye-spots and antennae glowing lilac, the headset round his neck)."
  - "Geum: the checked apron, the purple tracksuit, the floral headscarf, pink slippers, the steel LEFT arm, the ladle in her RIGHT hand. When she holds force, the ladle's bowl hums and glows faintly white and her steel arm's plates vibrate; when she lets it out, a ring of white force bursts from it."
  - "The old fisherman (fishermen): in his sixties, weathered, grey stubble, a navy knit cap, orange waterproofs and rubber boots; his small blue-and-white wooden fishing boat (new location fishing_boat, 5d) has a little wheelhouse, tyres hung along its sides and a smoky diesel engine."
  - "Han Sora (P30, P39-P40) on the barge's rail: look `shorts`: a black crop top under a low black plate-carrier chest rig with bolt magazines on the front panel, ending above her navel so her midriff shows; tight black shorts to mid-thigh; a drop-leg holster of bolts strapped round her bare RIGHT thigh with two straps; black fingerless tactical gloves; black combat boots, the charcoal Kanghan jacket tied round her waist by its sleeves, the black bob, red lips, the bandaged RIGHT wrist, the slim silver compass on her LEFT wrist; binoculars."
  - "The lid (LINK view, P34-P37): 30 m down on the seabed, a disc 300 m across of huge carved grey stone slabs with rusted steel plates bolted over them, crusted with weed; Kanghan's black anchor bolts newly drilled into it, chains rising from them; a crack spreading out from the drill holes, violet light seeping through. Below it, never shown whole: a violet glow like a lantern and a curve of vast dark hide (deep_lantern)."
  - "Moon Ahin (P42-P44, P53): look `summer`; Saebyeok holds the white parasol."
  - "Kang Seoa (15), from P47: her school uniform (2.6: navy blazer, white shirt, dark red tie, grey plaid skirt to the top of the knee, navy socks), round glasses, a school backpack with the calculator keychain. A child: never any fan service. The camera stays at her eye level or above, never below."
plants:
  - "PLANT P12-P13: PASS clause three, force in transit may be held by the Operator (STORE; RELEASE in ch 40)."
  - "PLANT P37: the violet light lures (ch 39: people walk toward the water; Pim's signal breaks it)."
  - "PLANT P34: Kanghan's anchor bolts in the lid (ch 39: the chains; Nib cuts them)."
hook_type: countdown

