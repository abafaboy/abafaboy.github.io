chapter: 11
title: Market Break
format: SCRIPT_FORMAT_v2.md
when: "Tuesday, 5:47 PM to about 6:05 PM: Mangwon Market during a dungeon break, from its covered main street and narrow alleys to the pedestrian footbridge at its edge."
story_beats: STORY_BIBLE_v4.md#arc-2-chapters-612-the-trap-rats-chapter-by-chapter
cast:
  kang_jaeha: vest          # straight from the tower: torn, bloody vest; bandaged shoulder and forearm
  nib: mask
  borro: default            # husk face tied on
  kang_seoa: default
  song_yerin: default
  yoo_bomi: default
  choi_dongmin: default
  granny_tteok: default     # generic market granny, see continuity
  granny_kimchi: default    # generic market granny, see continuity
  ash_hound: default
  marsh_serpent: default
locations: [mangwon_market]
continuity:
  - "Jaeha comes straight from the tower: the vest torn and bloody at the RIGHT shoulder over a white bandage, the bandage on his LEFT forearm, dried blood under his nose; fringe over the LEFT eye, pencil behind the RIGHT ear, notebook in the LEFT chest pocket. He gets steadily worse: nosebleeds from P33, on one knee from P49."
  - "Nib: seal 2/5 look with the cracked husk mask; field form (amber eyes, thin amber outline) P15–P53, rest form P54–P60 (cooldown), field form again from P61."
  - "Borro: the white oval husk face tied on with cord; field form (moss-green eyes, thin moss-green outline) from P22, when Jaeha calls him in the square, to P64; rest form P65–P70 (cooldown); called again at P71. 2.4 m: the market's alleys are only 1.5–2 m wide, so his shield fills an alley wall to wall."
  - "Kang Seoa (15): her school uniform (knee-length skirt), glasses, calculator keychain, her school bag, and a plastic bag of rice cakes she never lets go of. Never any fan service. She is in charge, never rescued. The camera stays at her eye level or above, never below."
  - "Yoo Bomi: her full design; she streams from the drone until P57, when she rams the drone into a hound and it breaks; after that she films on her phone. Never a low angle up her shorts: the camera stays at chest height or above."
  - "The market grannies (generic, no name cards): granny_tteok, a tiny round woman in her seventies in a flowered apron and arm sleeves, permed white hair; granny_kimchi, a tall bony woman in her seventies in a red rubber apron and rubber gloves, a headscarf, who fights with a huge white daikon radish."
  - "Mangwon Market (location mangwon_market, key.png and footbridge.png): a covered traditional market street under a translucent arcade roof, 6 m wide, with narrow side alleys 1.5–2 m wide running off it like ribs; stalls of vegetables, fish, tteok and kimchi; hanging bulbs; plastic tubs. The break's gate is in the cold-storage basement under the fish lane: violet light and heat shimmer rise from its stairwell. At the market's edge, a steel-and-concrete pedestrian footbridge 30 m long crosses a four-lane side road 5 m below, with stairs at each end and one central pier."
  - "Ash hounds (CHARACTER_DESIGNS_v2.md 4b.3): wolf-sized, eyeless and noseless, long split bone jaws, violet ash leaking from cracks along their backs; they hunt in packs of five to ten. Dozens of them tonight."
  - "The marsh serpent (CHARACTER_DESIGNS_v2.md 4b.4), only at the very end (P72–P73): 20 m long, as thick as a small car, jade-green scales with dull gold bands, a hooded head with two backswept bone-white horns, yellow slit eyes, steam and heat shimmer pouring off it, a small Hush crack on its brow."
plants:
  - "PLANT P11: Black Hound held this gate's contract and postponed it twice (Arc 3)."
  - "PLANT P35, P69: heat pours out of the break (the serpent loves heat; ch 12 uses cold)."
  - "PLANT P34, P58: Bomi's stream at 48,000–52,000 viewers (ch 12 viral clip)."
hook_type: arrival

