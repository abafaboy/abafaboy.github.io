chapter: 18
title: Lyra
format: SCRIPT_FORMAT_v2.md
when: "Saturday, a few seconds after the last chapter: the sealed boss chamber of the drowned cathedral, the Call, and the nave and the spillway outside."
story_beats: ARC3_4_BEATS.md#18-lyra
cast:
  kang_jaeha: vest
  nib: mask                 # field form until P45 (time runs out), rest form after
  borro: default            # husk face; field form (called again at P01, five minutes that last into ch 20); buried to the waist from P05
  lyra: default             # summon no. 3; arrives P38
  song_yerin: default
  mok_hangyu: default
  han_sora: default
  yoo_bomi: default
  choi_dongmin: default
  bell_ringer: default
locations: [boss_chamber_bells, call_void, drowned_cathedral, dam_gate]
continuity:
  - "Jaeha: the orange vest with Seoa's red stitches, the grey hoodie, the forearm bandage, the earpiece in his RIGHT ear; blood from his nose and his LEFT ear. Fringe over the LEFT eye, pencil behind the RIGHT ear. In the Call (P14–P32) he looks the same, bleeding."
  - "Nib: seal 2/5 look, the cracked husk mask; field form until P45, then rest form. Borro: the white husk face; field form; from P05 buried to the waist in fallen stone, still holding his shield up over the others; Bomi's drone in the moss on his shell."
  - "Mok: soaked, his black tower shield cracked down the middle through the red hound."
  - "Lyra (CHARACTER_DESIGNS_v2.md 2.10, characters_v2/lyra/, the approved front.png): 182 cm, very pale blue-grey skin with silver freckles, river-blue eyes, small pointed ears with silver cuffs, long silver-white hair with a thick beaded braid over her LEFT shoulder to her thigh; the cropped river-blue halter top with the plunging silver-trimmed neckline, bare shoulders, arms and midriff; the navy leather chest guard on the LEFT; the silver bracer on her LEFT forearm and the glove on her RIGHT hand; the white sash with the wooden flute; the short split river-blue skirt over fitted dark shorts; white thigh-high boots; the white longbow as tall as she is; the white quiver at her RIGHT hip. Field form: a thin river-blue outline and glowing eyes. Fan service per CHARACTER_DESIGNS_v2.md: a beautiful face, a curvy athletic figure, confident poses, never a camera aimed up her skirt, nothing explicit."
  - "The Call (location call_void): the endless black water under a starless sky; this time only one rift is open: a wide river under a silver sky, a riverbank of pale stones, reeds, a stilt house far off."
  - "The countdown: the boss's enrage timer runs on from ch 17 (00:24) and keeps running during the Call, which takes about ten seconds of the real world."
plants:
  - "PLANT P26: Lyra's little brother Ilan (Part One thread)."
  - "PLANT P41: [SEAL 1/5]: her arrows are too light to crack the bell (ch 19: Borrowed Thunder)."
hook_type: power

