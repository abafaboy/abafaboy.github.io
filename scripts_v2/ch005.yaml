chapter: 5
title: A Few Words at My Memorial
format: SCRIPT_FORMAT_v2.md
when: "Friday: the Black Hound memorial press event at 10 AM in Yeouido, the rooftop room in Mangwon-dong that evening, and Kanghan Tower that night."
story_beats: STORY_BIBLE_v4.md#chapter-5-a-few-words-at-my-memorial-about-65-panels
cast:
  kang_jaeha: vest          # straight from the hospital: bandages (see continuity)
  song_yerin: default
  nib: mask                 # seal 2/5 look; rest form all chapter (dull eyes, no glow)
  yoo_bomi: default
  mok_hangyu: default       # a black suit for the memorial (see continuity)
  bh_crossbow: default
  bh_shield: default
  kang_seoa: default
  baek_taegun: default      # back view, silhouette and reflection only; no name card until ch 12
locations: [memorial_hall, rooftop_room, kanghan_monitor]
continuity:
  - "Jaeha comes straight from a night at the Gate Rescue station: the same orange vest (dirty, a torn hem corner), a white bandage round his forehead under the fringe, a square of gauze taped on his right cheekbone, and his left hand wrapped in a bandage. Fringe over his LEFT eye, pencil behind his RIGHT ear, notebook in his LEFT chest pocket, his phone in his right chest pocket."
  - "Nib: his seal 2/5 look (wall-blue cloak lining, bronze trim, sigil clasp; characters_v2/nib/turnaround_seal2.png), the cracked husk mask over the upper LEFT of his face, rest form all chapter (dull eyes, no glow, no outline). In public he stands perfectly still like a doll."
  - "Mok at the memorial wears a black suit and black tie with the small red hound's-head pin, not his guild jacket; the shield is not with him."
  - "Yoo Bomi: her design exactly (cropped neon-yellow bomber worn open over a black crop top, high-waisted denim shorts, black thigh-high socks, plain black trainers, the 90 cm recurve bow on her back, the small white camera drone with a red light hovering by her). Fan service per CHARACTER_DESIGNS_v2.md: a beautiful face, a confident pose, never a low angle up her shorts."
  - "Kang Seoa (15): her school uniform with the skirt to the top of the knee, glasses, calculator keychain. Never any fan service. The camera stays at her eye level or above, never below."
  - "Baek is only ever seen from behind, in silhouette, or as a reflection in dark glass; his face is never fully shown before ch 12."
plants:
  - "PLANT P24: the crossbow hunter studies Nib with interest and turns a small brass compass in her fingers (she is Kanghan's eyes inside Black Hound, Arc 3)."
  - "PLANT P22: Jaeha's phone records Mok's offer (used in Arc 3)."
  - "PLANT P50: the chain link in his pocket (Arc 4)."
  - "PLANT P55–P59: Kanghan knows the protocol woke at Gate 0912 but not who carries it."
hook_type: threat

panels:

  # ================= THE MEMORIAL (P01–P10) =================
  - id: P01
    recipe: establish
    shape: full
    gap: none
    bg: black
    camera: "high, from the back of a guild hall lobby: rows of press cameras facing a memorial stage"
    light: "key: cold white studio lights on the stage; camera flashes"
    art: >
      The Black Hound guild hall lobby set up for a memorial press event (location memorial_hall): a black backdrop (no
      text), a large framed portrait on an easel with black ribbons and white chrysanthemums (the portrait is a plain grey
      placeholder), a podium, and three rows of reporters with cameras on tripods. Scale: people 1.6–1.9 m; the backdrop is
      about 4 m tall.
    calm: top
    lines:
      - {who: offpanel:crowd, type: tag, text: "BLACK HOUND GUILD HALL, YEOUIDO. FRIDAY, 10 AM."}
      - {who: offpanel:mok_hangyu, type: speech, text: "KANG JAEHA WAS A BRAVE TRAP-TESTER. HE ALWAYS WALKED IN FIRST."}
    sfx:
      - {text: "KSHK KSHK", style: quiet, at: [0.80, 0.70], size: S, rot: 0}

  - id: P02
    recipe: talk
    shape: wide
    gap: short
    bg: white
    camera: "eye level, slightly low: Mok at the podium in a black suit, solemn for the cameras"
    light: "studio light, flat and bright; camera flashes"
    art: >
      Mok (mok_hangyu, black suit and tie, the red hound pin) at the podium beside the grey memorial portrait and its white
      chrysanthemums, solemn, one hand pressed to his chest. Reporters' heads in the foreground.
    acting:
      mok_hangyu: "gripping the podium with his left hand, right hand pressed flat to his chest, head bowed, eyes lowered, a grave camera face, mouth open mid-line"
    eyeline: "Mok → the cameras (down)"
    foreground: "the backs of two reporters' heads and a camera on a tripod, cropped, along the bottom"
    calm: top
    lines:
      - {who: mok_hangyu, type: speech, text: "HE GAVE HIS LIFE SO MY HUNTERS COULD COME HOME. WE WILL NEVER FORGET HIM.", side: l}

  - id: P03
