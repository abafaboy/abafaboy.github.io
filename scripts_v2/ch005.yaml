    gap: long
    bg: white
    camera: "full figure, camera level at chest height, three-quarter: a streamer on the hall's front steps"
    light: "key: bright late-morning sun from the right; back light: the glass doors' reflection rimming her hair"
    intro: "YOO BOMI (21) · E-RANK RANGER · STREAMER, \"BOMBOM TV\""
    art: >
