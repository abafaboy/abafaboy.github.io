    shape: wide
    gap: short
    bg: white
    camera: "the drone's point of view: Bomi talking into the camera on the steps, the guild hall doors behind her"
    light: "bright sun; a little lens-free glare off the glass doors"
    art: >
      The drone's point of view: Bomi (yoo_bomi) leans into the camera on the steps, talking fast, the guild hall's glass
