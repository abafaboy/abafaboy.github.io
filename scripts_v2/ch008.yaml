chapter: 8
title: Eyes
format: SCRIPT_FORMAT_v2.md
when: "Thursday at dusk: Mangwon's rooftops and the Han River bank under a bridge; Saturday afternoon: a D-grade gate in a flooded basement car park in Mangwon; Saturday night: the rooftop."
story_beats: STORY_BIBLE_v4.md#arc-2-chapters-612-the-trap-rats-chapter-by-chapter
cast:
  kang_jaeha: vest          # hoodie only at home (P01–P24); the vest mended with red stitches (see continuity)
  nib: mask                 # rest form except P42–P55 (field form, LINKED); seal 2/5 look
  kang_seoa: default
  song_yerin: default
  yoo_bomi: default
  gomi: default             # the street cat, see continuity
  kanghan_guard: default    # generic Kanghan security at the river (CHARACTER_DESIGNS_v2.md 2.14)
  drowned_hound: default
  landlady: default         # generic, from ch 6
locations: [rooftop_room, hanriver_gate, carpark_gate]
continuity:
  - "Jaeha: the plaster on his cheekbone is gone. Fringe over the LEFT eye, pencil behind the RIGHT ear, notebook in the LEFT chest pocket. At home (P01–P24) the grey hoodie only. The vest from P25: Seoa has mended the slash through the white T patch on the back with a visible line of neat red stitches. From P47 a white bandage round his LEFT forearm (the bite), showing below the pushed-up hoodie sleeve."
  - "Nib: seal 2/5 look (nib/turnaround_seal2.png) with the cracked husk mask over his upper LEFT face whenever anyone outside the family could see him; rest form (dull eyes, no glow) except P42–P55, field form and LINKED (amber eyes, thin amber outline). Rest form means he is no stronger or faster than an ordinary person his size, which is why the cat is a real problem."
  - "Gomi, the street cat: a huge, fat orange tabby with a torn ear and a smug face, about the size of a small dog (body 60 cm long), next to Nib's 105 cm that is big. She owns the neighbourhood."
  - "Kang Seoa (15): her school uniform (knee-length skirt), glasses, calculator keychain; a laptop on her knees. Never any fan service. The camera stays at her eye level or above, never below."
  - "Yoo Bomi: her design exactly (cropped neon-yellow bomber over a black crop top, high-waisted denim shorts, black thigh-high socks, plain black trainers, the 90 cm recurve bow, the white drone with its red light). Fan service per CHARACTER_DESIGNS_v2.md: a beautiful face and confident poses, never a low angle up her shorts."
  - "The Han River enclosure (location hanriver_gate, P14–P21): under a bridge span at the blue hour, the bridge's orange sodium lights coming on; a fence hung with black tarps, two shipping containers, a humming generator, thick cables running into a gate slit in the shadow of the bridge pier; the pier carries a big faded yellow stencilled number 7, and one sodium lamp on the span above it has a cracked cover and flickers; NO Association tape, cones or grade sign. Two Kanghan guards in black tactical vests over black suits, torches and batons, the silver hexagon pin on their lapels."
  - "The car park gate (location carpark_gate, P29–P58): the lower level under 1–2 m of still black water among square concrete pillars (6 m apart) and half-sunk cars; a long, wide dry vehicle ramp up to the upper level, its lower third wet and slick; thick pipes along the 2.6 m ceiling; white-blue caged dungeon lamps; drips everywhere."
  - "The drowned hound (CHARACTER_DESIGNS_v2.md 4b.2): a hound the size of a horse, 1.7 m at the shoulder, about 3 m long from nose to tail tip, gaunt and heavy-boned; waterlogged black fur in clumps, river weed and barnacles; a long jaw of crooked yellow teeth; pale clouded eyes (nearly blind; it hunts by ripples and sound); water streaming off it; a small Hush crack leaking violet ash on its brow. Fast in water, clumsy on dry ground."
plants:
  - "PLANT P16–P21: the unregistered gate under the bridge, guarded by Kanghan (ch 22, Arc 4)."
  - "PLANT P13–P14: pier 7 and its flickering lamp, which Jaeha recognizes in the last seconds of Minseok's video (ch 22)."
  - "PLANT P58: the window offers only HARVEST (ch 50)."
  - "PLANT P60: ROUTE ALIGNMENT syncing, finished at the end (ch 9 CALL)."
hook_type: system

panels:

  # ================= THE CAT (P01–P12) =================
  - id: P01
    recipe: establish
    shape: full
    gap: none
    bg: white
    camera: "high (25 m), looking down across Mangwon's rooftops at dusk: a tiny cloaked figure sprinting, a huge cat bounding after it"
    light: "key: orange dusk from the west; long blue shadows across the roofs"
    art: >
      High above Mangwon-dong at dusk: a patchwork of flat villa rooftops, green-painted roofs, water tanks, laundry lines,
      satellite dishes and potted chillies, the Han River glinting at the edge. Across one roof a tiny cloaked figure (Nib,
      mask; rest form) sprints flat out, red scarf streaming, and a huge fat orange tabby cat (gomi) bounds after him. Scale:
      each rooftop is about 12 m across; the gaps between buildings are 1.5–2 m; the figures are tiny.
    acting:
      nib: "sprinting flat out, arms pumping, scarf streaming, glancing back over his shoulder"
      gomi: "bounding after him in full gallop, ears flat, tail up"
    calm: top
    lines:
      - {who: offpanel:crowd, type: tag, text: "MANGWON-DONG. THURSDAY, 6 PM."}
    sfx:
      - {text: "TAP TAP TAP TAP", style: quiet, at: [0.40, 0.70], size: S, rot: 0}

  - id: P02
    recipe: insert
    shape: wide
    gap: short
    bg: white
    camera: "Nib's point of view, glancing back over his shoulder: the cat's face in mid-pounce, filling the frame"
    light: "orange dusk; a thin amber vignette at the edges (Nib's view)"
    art: >
      Nib's point of view in a thin amber vignette, looking back over his shoulder: the huge orange tabby (gomi) in mid-
      pounce, a torn ear, whiskers forward, yellow eyes huge, claws out, filling most of the frame.
    acting:
      gomi: "mid-leap, front paws spread with claws out, mouth open, eyes wide and gleeful"
    calm: top
    silent: true
    sfx:
      - {text: "MRRROWW", style: comic, at: [0.70, 0.24], size: L, rot: 8}

  - id: P03
