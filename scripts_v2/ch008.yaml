      - {who: kang_seoa, type: speech, text: "THAT'S GOMI. SHE OWNS THE NEIGHBOURHOOD.", side: r}

  - id: P05
    recipe: insert
    shape: inset-r
    gap: short
    bg: white
    camera: "close on the laptop screen on Seoa's knees, the screen green"
    light: "dusk; the screen glow"
