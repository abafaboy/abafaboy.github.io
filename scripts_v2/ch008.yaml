    sfx:
      - {text: "HUP", style: impact, at: [0.36, 0.30], size: L, rot: -10}

  - id: P04
    recipe: talk
    shape: wide
    gap: short
    bg: white
    camera: "eye level on Jaeha's green rooftop: Jaeha cross-legged on a plastic chair with his eyes closed, Seoa beside him with a laptop"
    light: "orange dusk"
    face: private
    art: >
      On the green rooftop (location rooftop_room, key_day at dusk): Jaeha (kang_jaeha, grey hoodie) sits cross-legged on a
      plastic chair with his eyes closed and two fingers at his temple, a thin amber thread of light running from him off
