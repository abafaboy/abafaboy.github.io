    art: >
      From low between two buildings, looking up at the orange sky: Nib leaps the 2 m gap between two rooftops, cloak flaring
      and scarf whipping, arms flung forward; a beat behind him the fat cat sails across the same gap, legs stretched out.
      Laundry flaps on a line. Speed lines.
    acting:
