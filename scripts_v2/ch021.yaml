      Hound's outside squad, every one of them looking down at a phone; police cars and Gate Rescue vans arriving with lights on;
      at the bottom of the concrete chute, the gate slit has shrunk to a sliver and is closing. Scale: the crowd is hundreds of
      people; the slit is a thread of light.
    calm: top
    lines:
      - {who: offpanel:crowd, type: tag, text: "DAM SPILLWAY, GATE 2207. SATURDAY, 12:41 PM."}
