chapter: 21
title: Ask Him
format: SCRIPT_FORMAT_v2.md
when: "Saturday, about 12:40 PM: inside the gate as it closes, then the foot of the dam spillway; the rooftop in Mangwon and Kanghan Tower at the same moment."
story_beats: ARC3_4_BEATS.md#21-ask-him
cast:
  kang_jaeha: vest
  nib: mask                 # seal 3/5 scout-captain armour; rest form
  borro: default            # husk face; rest form; the drone in his moss until P17
  lyra: default             # rest form; no mask (see continuity)
  song_yerin: default
  yoo_bomi: default
  choi_dongmin: default
  mok_hangyu: default
  han_sora: default
  bh_second: default
  kang_seoa: default
  landlady: default
  gomi: default
  oh_minseok: default       # on the phone's video only (P46–P52)
  baek_taegun: default
  police: default           # generic: Korean police officers, see continuity
  bh_lawyer: default        # generic: Black Hound's lawyer (ch 13)
locations: [boss_chamber_bells, drowned_cathedral, dam_gate, rooftop_room, kanghan_office]
continuity:
  - "Kang Seoa (15): her outfit as each panel says; glasses, the calculator keychain. Never any fan service. The camera stays at her eye level or above, never below."
  - "Jaeha: the torn orange vest, the grey hoodie; bandaged by Yerin in the gate: his LEFT upper arm, RIGHT thigh, RIGHT forearm and a plaster on his LEFT cheek; he limps on Yerin's shoulder; the head-sized violet core in a cloth sling across his chest; Minseok's phone in his hand."
  - "Jaeha also has dried blood from his nose and LEFT ear (ch 20). He cannot climb: Yerin carries him on her back up the rope, through the passage and out (P03–P05)."
  - "Nib: SEAL 3/5, the scout-captain armour (CHARACTER_DESIGNS_v2.md 2.2) over the cloak, the cracked husk mask, rest form. Borro: the husk face, rest form, three unconscious hunters on his shell, then over his shoulders. Lyra: rest form, no glow, her full design (2.10); she has never worn a husk mask. The camera is never aimed up her skirt or down her top."
  - "The six hunters of Mok's second team all come out alive: three unconscious on Borro, one unconscious dragged by Lyra, two walking with their hands on their heads."
  - "Mok: no shield, no sword; soaked; his gold chain; his hands bound in front of him with Nib's spare cord until the police cuff him at P60."
  - "Oh Minseok on the video (P46–P52): close on his face lit by the phone's own light, the orange vest (older, patched), short greying hair, the scar through one eyebrow, sweat, a nervous crooked laugh; behind him only darkness. A faint cold light falls on one side of his face from the gate's rim, which stays out of frame: the rim and what lies beyond it are shown only in ch 22."
  - "Police (generic): Korean police officers in navy uniforms with fluorescent yellow-green vests and caps; white-and-blue police cars. Black Hound's lawyer (ch 13): a sleek man in his forties, expensive grey suit, silver tie, slicked hair."
  - "The spillway (location dam_gate): the press tents, cameras, the rope line, police cars arriving, Gate Rescue vans, the closing gate slit at the foot of the concrete chute."
  - "The rooftop room (P64): midday; Seoa in her uniform shirt and tie with the blazer off (Saturday at home). Kanghan (P65–P67): Baek's office (location kanghan_office) at midday, the blinds half down over the city, the violet core in its case."
plants:
  - "PLANT P34–P39: Mok names Kanghan on stream: the paid survey and the order to seal the Han River door (Arc 4)."
  - "PLANT P52: the phone dies right after Minseok's line; its last seconds are unseen (ch 22)."
  - "PLANT P63: Sora walks away (Arc 4)."
  - "PLANT P67: 'Find out what else that phone recorded.' (ch 22, Arc 4)"
hook_type: threat

