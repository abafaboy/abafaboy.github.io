chapter: 10
title: A Roof, Not a Garden
format: SCRIPT_FORMAT_v2.md
when: "Saturday night, the last three seconds of the Call; Monday morning on the rooftop; Tuesday afternoon, a D-grade gate on the sixth floor of a half-built tower in Mapo; Tuesday at dusk, the street outside."
story_beats: STORY_BIBLE_v4.md#arc-2-chapters-612-the-trap-rats-chapter-by-chapter
cast:
  kang_jaeha: vest          # hoodie only in the Call, the room and the morning (P01–P24)
  nib: mask                 # rest form except P37–P57 (field form, LINKED); no mask at home
  borro: default            # rest form except P37–P57; husk mask in public (see continuity)
  kang_seoa: default
  song_yerin: default
  landlady: default         # generic, from ch 6
  site_manager: default     # generic, see continuity
  ash_hound: default
locations: [call_void, rooftop_room, tower_gate]
continuity:
  - "Kang Seoa (15): her outfit as each panel says; glasses, the calculator keychain. Never any fan service. The camera stays at her eye level or above, never below."
  - "Jaeha: fringe over the LEFT eye, pencil behind the RIGHT ear, notebook in the LEFT chest pocket; the white bandage round his LEFT forearm (the ch 8 bite). New: a black-violet bruise round his RIGHT ankle shaped like long fingers (the Hush's grip in ch 9), seen when his trouser leg rides up (P20, P21). The vest (with Seoa's red stitches on the back patch) from P25."
  - "Nib: seal 2/5 look; no mask at home, the cracked husk mask in public; rest form except P37–P57 (field form, LINKED: amber eyes, thin amber outline)."
  - "Borro (CHARACTER_DESIGNS_v2.md 2.12, characters_v2/borro/): 2.4 m, about 7 heads, slate-grey skin, the humped slate-plate shell with moss and tiny white and yellow flowers, the linen tunic and rope belt, the gardener's satchel, bare feet, the door-sized iron shield (2 m tall). Slow, careful, gentle. Next to him Jaeha reaches his chest and Nib reaches his knee-and-a-bit (his hip). In public (from P25) a featureless white oval husk face tied over his face with cord, with two small round eye-holes. Field form: moss-green eyes and a thin moss-green outline. He is too tall for the rooftop room (ceiling 2.2 m) and must stoop or kneel inside."
  - "The rooftop room's bed is a cheap metal-frame single bed; Borro lands on it in P12 and folds it flat. From P14 the mattress is on the floor, and the bed frame leans bent against the wall."
  - "The site manager (generic, no name card): a nervous man in his forties in a white hard hat, a hi-vis vest over a shirt and tie, a clipboard and a thick envelope of cash."
  - "The tower gate (location tower_gate): outside, an unfinished 11-storey concrete tower at dusk wrapped in scaffolding and flapping green safety mesh; the gate slit on the bare sixth floor. Inside, the same floors as a Far Side ruin: cracked, sagging concrete slabs and hanging rebar held up by a few load-bearing beams; one long beam (60 cm wide) runs across the main floor from a core wall to a perimeter column, and the slabs on either side of it are cracking away. Dusty orange dusk light through the missing walls; the floors below are dark."
  - "Ash hounds (CHARACTER_DESIGNS_v2.md 4b.3): wolf-sized (90 cm at the shoulder), lean and long-legged, smooth black bodies with no eyes and no nose, a long split jaw of white bone teeth, ribs pressing through, cracks along the back leaking violet ash. The alpha (P36–P56) is the same creature at 1.6 m at the shoulder, with a ridge of deep cracks down its neck and back that vent violet ash when it howls."
plants:
  - "PLANT P20–P21: the black-violet finger bruise on his ankle (Part One mystery)."
  - "PLANT P23: Seoa will go to Mangwon Market after school on Tuesday (the hook; ch 11)."
  - "PLANT P58: the alpha's window offers only HARVEST again (ch 50)."
hook_type: threat

panels:

