      Inside the mossy green rift, under a soft green sky, the long low hill of moss and flowers rises: it is a back, a
      humped shell of slate plates laid like a roof, and under it a giant slowly sits up out of the field, slate-grey, broad
      and calm, moss and tiny white and yellow flowers growing in the cracks of the shell (borro, rest form). Earth and
      petals fall from his shoulders. Jaeha (kang_jaeha, hoodie) stands chest-deep in the black water of the Call in the
      foreground, tiny, looking up. Scale: the giant sitting is as tall as a one-storey house; Jaeha is a head and shoulders.
    acting:
      borro: "sitting up slowly from the field, one huge hand on the ground, the other brushing earth from his shoulder, eyes heavy-lidded"
      kang_jaeha: "chest-deep in the black water, face tilted up, breath fogging"
