chapter: 9
title: Not Yet, Operator
format: SCRIPT_FORMAT_v2.md
when: "The same Saturday night, a little before midnight: the rooftop room, and the Call (a place between the worlds) for sixty seconds."
story_beats: STORY_BIBLE_v4.md#arc-2-chapters-612-the-trap-rats-chapter-by-chapter
cast:
  kang_jaeha: vest          # the grey hoodie only tonight; bandaged left forearm (see continuity)
  nib: mask                 # NO mask at home all chapter; rest form; seal 2/5 look
  kang_seoa: default
  gomi: default             # the street cat, at the window
  bell_silhouette: default  # the caller who refuses: a silhouette only, never named (he is Caldric, ch 68)
locations: [rooftop_room, call_void]
continuity:
  - "Jaeha: the grey hoodie and work trousers, no vest; a white bandage round his LEFT forearm. Fringe over the LEFT eye, pencil behind the RIGHT ear. In the Call he looks exactly as he does on the bed (hoodie, bandage), and he holds his notebook. While he is in the Call his body sits rigid on the bed with his eyes glowing faint cyan."
  - "Nib: seal 2/5 look, NO mask (nib/front_seal2_nomask.png) all chapter, at home; rest form."
  - "Kang Seoa (15): a baggy T-shirt and pyjama trousers for the night, glasses; never any fan service. The camera stays at her eye level or above, never below."
  - "The rooftop room at night (location rooftop_room, interior): one room, about 9 square metres, a cheap metal-frame single bed against the wall under the window, Seoa's desk, the fold-out table; a warm ceiling light."
  - "The Call (location call_void): an endless plane of still black water under a starless black sky; tall vertical rifts like doorways stand round Jaeha at a distance of 30–60 m, each 8 m tall, each showing a different Far Side place; thin Operator-cyan lines run from each rift to him. The rifts: a burning fortress with a great bell; a mossy green sky over a field where something huge sleeps; a wide river under a silver sky; a white stone ward with rows of empty beds; a frozen forest; the rest dark."
  - "The bell silhouette: seen only as a black silhouette against fire, a broad figure about 2.1 m tall in armour shaped like a great bell, holding a bell-headed mace, standing on a burning wall beside a huge hanging bell. Never a face, never a name."
  - "The Hush in the Call (P38–P54): the black water itself. Something under it grips Jaeha's RIGHT ankle: a long black hand with too many joints, leaking violet ash. Frost spreads from the same ankle across the real bed and floor."
plants:
  - "PLANT P19–P21: the river under a silver sky (Lyra, ch 18) and the white ward (Maud, ch 48) among the rifts."
  - "PLANT P26–P30: 'Not yet, Operator. My wall still stands.' (ch 68: Caldric). P32: Nib knows that bell (it rang the retreat in the ch 3 flashback)."
  - "PLANT P40: [OPERATOR #1 — STATUS: HUSHED], a glitch (series villain)."
  - "PLANT P39–P54: the Hush's grip on his right ankle leaves a black-violet bruise shaped like long fingers (ch 10 continuity; Part One mystery)."
hook_type: countdown

