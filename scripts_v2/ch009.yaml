    recipe: establish
    shape: full
    gap: none
    bg: black
    camera: "high in the corner of a small room at night (2.4 m): frost spreading across the floor from a bed where a young man sits rigid with glowing eyes"
    light: "key: a cold cyan glow from a window floating in the air; the ceiling light flickering"
    art: >
      Night, inside the rooftop room (location rooftop_room, interior), seen from high in a corner: white frost spreads in
      feathery lines across the old floor from the metal-frame bed, where Jaeha (kang_jaeha, hoodie, bandaged left forearm)
      sits rigid and upright, eyes glowing cyan, a thin nosebleed running down to his lip. A small cyan window floats in the
      air before him. Seoa (kang_seoa, pyjamas) grips his shoulder; Nib (nib, no mask) grabs her wrist. The window glass is
      fogged with frost. Scale: the room is 3 m by 3 m; the bed is under the window.
    acting:
      kang_jaeha: "sitting bolt upright on the edge of the bed, hands on his knees, eyes wide and glowing, not blinking"
      kang_seoa: "leaning over him, both hands on his shoulder, shaking him, mouth open in a shout"
      nib: "gripping Seoa's wrist with one long hand, ears flat, staring at Jaeha's eyes"
    calm: top
    sfx:
      - {text: "KRRK... KRRK...", style: quiet, at: [0.30, 0.86], size: S, rot: 0}

