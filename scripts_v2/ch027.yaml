chapter: 27
title: Alarm
format: SCRIPT_FORMAT_v2.md
when: "Friday, about 2:10 AM: the stone balcony, the great drain pipe along the pit wall, the flooded catwalk section, and the ledge beside the Warden's chained arm."
story_beats: ARC3_4_BEATS.md#27-alarm
cast:
  kang_jaeha: crew
  nib: mask
  borro: default
  lyra: default
  moon_ahin: default
  ahin_husks: default        # 36, then 30 after holding the passage (P34)
  crew_pyo: default
  crew_dami: default
  crew_woo: default
  crew_ho: default
  han_sora: kanghan          # new outfit, see continuity
  kanghan_tactical: default  # generic, new, see continuity
  kanghan_guard: default
  tide_warden: default
locations: [farm_pit]
continuity:
  - "Han Sora in Kanghan colours (new outfit key kanghan, from ch 27): the same face and hair (sleek black chin-length bob, winged eyeliner, red lips); a fitted charcoal-grey Kanghan tactical jacket cropped at the waist with the silver hexagon on the LEFT shoulder, worn open over the fitted black tank top with the low scoop neck; black tactical trousers with a thigh holster of bolts; black boots; the compact crossbow; the brass core compass on its wrist chain. Fan service per CHARACTER_DESIGNS_v2.md: a beautiful face and confident poses, nothing explicit, no camera aimed at her chest. Soaked from P32: wet hair slicked back."
  - "Kanghan tactical squad (generic, new): black tactical armour, full helmets with smoky visors, the silver hexagon on the chest, small round shields, shock batons, and stubby core carbines that fire violet stun bolts; a captain with a red stripe on his helmet. Twelve of them with Sora."
  - "The great drain pipe (P05 onward): an open-topped steel half-pipe 3 m wide bolted along the pit wall on brackets, carrying a fast stream of seawater ankle-deep from the Warden's body down and round the pit toward a round steel drain hatch in the east wall. It runs past the Warden's chained LEFT arm. Lower down the wall, parallel to it, a steel catwalk (section 4-C) with racks of core tanks behind it."
  - "The fire system: red sprinkler heads over every catwalk section; steel bulkhead doors at each section's ends; a pillar-mounted panel with a flame pictogram, a wave pictogram and a big red lever (no text)."
  - "Core tanks burn: a cracked tank's light catches as a violet fire that crawls up the rack."
  - "Field forms from P16: Borro and Lyra (CARRY on both); Nib from P20 (not carried: Jaeha can only carry two)."
  - "The Warden (P46 onward): his LEFT eye opens: deep sea-green, enormous, ancient, aware. His voice reaches the summons through the water in the drain pipes as words in their own language (lettered in angle brackets); to Jaeha, Moon Ahin and the crew it is only a deep hum."
plants:
  - "PLANT P14-P16: Director Baek has told security that Moon Ahin is not here (ch 32)."
  - "PLANT P13: Baek wants Lyra too (Arc 5)."
  - "PLANT P22-P27: Sora and Lyra, two archers (ch 31)."
  - "PLANT P39-P42: Moon Ahin calls her husks back, and is proud of them for the first time (ch 30)."
  - "PLANT P49-P60: the Warden speaks to the summons and asks to be ended or freed (ch 28)."
hook_type: decision

panels:

  # ================= TWO MINUTES (P01-P10) (P01–P10) =================
  - id: P01
    recipe: plan
    shape: wide
    gap: none
    bg: paper
    camera: "top-down on the notebook page under red light: a fast pencil map of the pit, the balcony, a long pipe along the wall to a round hatch, a catwalk below it, a small flame and a wave"
    light: "red light on paper"
    art: >
      Top-down on the notebook page under sweeping red light: a fast pencil map: the pit as a circle, the balcony, a long half-pipe
      running along the wall to a round hatch on the far side, a catwalk below it with tank racks, a small drawn flame on the racks
      with an arrow to a drawn wave, and a row of tiny squares plugging the balcony passage.
    calm: top
    lines:
      - {who: kang_jaeha, type: note, text: "HUSKS PLUG THE PASSAGE. DRAIN PIPE TO THE EAST HATCH. FIRE MEANS FLOOD."}
    sfx:
      - {text: "WEEOOO", style: alert, at: [0.80, 0.20], size: M, rot: 0}

  - id: P02
    recipe: talk
    shape: wide
    gap: short
    bg: black
    camera: "low, close two-shot in red light: Jaeha turning the notebook to Moon Ahin, torch beams flickering in the passage behind her"
    light: "red; torch beams"
    face: private
    art: >
      Close and low in red light: Jaeha (kang_jaeha) turns the notebook to Moon Ahin (moon_ahin); torch beams flicker in the passage
      behind her where her husks stand in rows.
    acting:
      kang_jaeha: "holding the notebook up to her, pencil pointing at the plugged passage"
      moon_ahin: "reading fast, jaw tight"
    eyeline: "Jaeha → Moon Ahin; Moon Ahin → the page"
    foreground: "the notebook, cropped, bottom"
    calm: top
    lines:
      - {who: kang_jaeha, type: speech, text: "YOUR HUSKS HOLD THAT PASSAGE FOR NINETY SECONDS. THEN THEY FOLLOW US ALONG THE PIPE.", side: r}
      - {who: moon_ahin, type: speech, text: "MY HUSKS DON'T RETREAT.", side: l}
      - {who: kang_jaeha, type: speech, text: "THEN TONIGHT THEY LEARN. I'D LIKE THEM BACK, MA'AM.", side: r}

