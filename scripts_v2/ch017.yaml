chapter: 17
title: Thirty Seconds
format: SCRIPT_FORMAT_v2.md
when: "Saturday, just after noon: the boss chamber of the drowned cathedral (sealed), the nave outside its doors, and the flooded crypt."
story_beats: ARC3_4_BEATS.md#17-thirty-seconds
cast:
  kang_jaeha: vest
  nib: mask                 # field form from P24
  borro: default            # husk face; field form P24–P51, released to rest form in the chalk ring at P52 (called again at ch 18 P01); Bomi's drone in his moss
  song_yerin: default
  mok_hangyu: default
  han_sora: default
  bh_raid: default
  bh_sealers: default
  bell_ringer: default      # the Drowned Bell-Ringer, B-grade boss (new design)
  yoo_bomi: default         # voice on the earpiece and on the stream outside
locations: [drowned_cathedral, boss_chamber_bells]
continuity:
  - "Jaeha: the orange vest with Seoa's red stitches, the grey hoodie, the forearm bandage, a tiny earpiece in his RIGHT ear; fringe over the LEFT eye, pencil behind the RIGHT ear, notebook in the LEFT chest pocket. The tiny cyan [CALL · HELD] mark still sits at the edge of his point-of-view panels."
  - "Nib: seal 2/5 look, the cracked husk mask; field form (amber) from P24. Borro: the white husk face; field form (moss green) from P24; Bomi's white drone with the pink ribbon nested in the moss on his shell, its lens peeking out between the flowers."
  - "Mok: the black guild jacket, the gold chain, the black tower shield with the red hound, the short sword. Inside the chamber from P03, soaked."
  - "The seal (P04–P08): the sealer drives the black steel stake into the floor outside the bronze doors and a web of violet light spreads over the doors from it; a small timer glows on the stake's head. From inside, the doors are cold and humming and will not move."
  - "The boss chamber (new location boss_chamber_bells): a round chamber 30 m across and 25 m high under a dome, flooded knee-deep, ringed with pillars; bronze bells of every size hang from the dome on chains; a narrow stone stair winds up the back wall to a small dark door 6 m above the floor (the bell-ringer's door: the second exit Nib found. It opens on a flooded service passage that runs down through the crypt to the gate's rim; behind the chapel altar there is only a scout-sized crack into that passage, too tight for armoured men with a stake and a cable pack, though a slim woman can squeeze through). The front is the sealed bronze double doors."
  - "The Drowned Bell-Ringer (new design, see ARC3_4_BEATS.md): a hushed giant 6 m tall, its body like drowned grey stone wrapped in rotting dark-blue robes and rusted chains, long arms, huge hands; in place of a head, a cracked bronze cathedral bell green with age, with a violet Hush crack down the bell's LEFT side leaking ash, and darkness inside its mouth. It carries a bell clapper the size of a tree trunk as a hammer, in its RIGHT hand. When it tolls, a ring of force bursts out from it a step beyond its own reach; inside its arm's length, the force passes over you. B-grade; a hushed hero. Scale: Borro reaches its mid-thigh; Jaeha reaches just above its knee."
  - "The flooded crypt (P13–P14): a low-vaulted stone crypt filling with black water, the two sealers chest-deep and climbing onto a tomb."
plants:
  - "PLANT P09–P14: the wrong-way arrow strands the sealers in the crypt (ch 20: Mok's second team comes through the flooded passage)."
  - "PLANT P44–P47: Borro shares Mok's shield and Jaeha carries it (ch 19: Mok puts his shield beside Borro's)."
  - "PLANT P62: the window offers HARVEST only (ch 50)."
hook_type: countdown

