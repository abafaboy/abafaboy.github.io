chapter: 37
title: Make Him Come to Us
format: SCRIPT_FORMAT_v2.md
when: "Thursday, Busan: 8:30 AM at the Association's Busan branch; 11:00 AM at a hotel rooftop pool; 1:00 PM on the beach; 2:30 PM on Kanghan's barge; 5:00 PM, golden hour, on the breakwater."
story_beats: ARC5_BEATS.md#37-make-him-come-to-us-hook-threat
cast:
  kang_jaeha: training       # the tracksuit; white bandage on the LEFT forearm
  geum_okran: default
  pim: default               # the headset; no mask (like Lyra, he won't wear one)
  nib: mask
  borro: default             # husk face in public
  lyra: swimsuit             # P28-P49 (2.20); her own outfit (2.10) on the breakwater from P51
  assoc_yang: default
  deputy_hwang: default      # on the video-call screen only
  han_sora: pool             # 2.20
  yoo_bomi: default
  kanghan_pr: default        # new generic (2.20)
  beachgoers: default        # new generic (2.20)
  moon_ahin: summer          # 2.20
  ahin_husks: default        # Saebyeok (No. 1) and the rest of her 28
  kanghan_engineer: default  # on the barge, with orange life vests (2.20)
  kanghan_tactical: default
locations: [assoc_busan, kanghan_barge, hotel_pool, busan_beach, busan_breakwater]
continuity:
  - "Jaeha: look `training` all chapter: Geum's spare purple tracksuit, too short at the wrists and ankles, his own trainers, a towel round his neck, a clean white bandage on his LEFT forearm. Notebook and the stamped chain link (6) in the LEFT chest pocket of the tracksuit top, pencil behind the RIGHT ear, fringe over the LEFT eye. He looks badly underdressed at the hotel."
  - "Pim (2.19): the black gaming headset over the base of his antennae all chapter except his field form (P53-P60: wings open 2.6 m, eye-spots and antennae glowing lilac, the headset round his neck). No mask: strangers take him for a mascot costume."
  - "The LINK leash (600 m, ch 8): the rest-form summons stay near Jaeha. At the Association branch they wait outside on the pier. The Grand Harbour hotel stands on the beachfront, so while Jaeha and Nib are up at the rooftop pool, Lyra, Borro and Bomi are on the sand right below it."
  - "Nib: the cracked husk mask in public; rest form; a clean white bandage round his RIGHT upper arm (the cut from ch 35). Borro: the white husk face in public; rest form; he holds a big striped beach umbrella at the beach."
  - "Lyra, P28-P49: look `swimsuit` (2.20): the river-blue halter bikini with engraved silver filigree cups and thin silver straps crossing over her bare back, a jewelled silver hip girdle with dangling river-blue teardrop gems and fine chains, ornate silver filigree cuffs on both upper arms, stacked silver bangles, a high silver filigree lace choker with her river pearl, silver ear cuffs and small hoops, a silver band on her LEFT thigh with a river-blue gem pendant, silver leaf clips in the braid over her LEFT shoulder; no wrap (her body stays visible); barefoot; no bracer or glove. Her best glamour angle (2.20): side-on at her shoulder height, body in profile, head turned to the viewer, framed from the hips up, backlit. From P51 on the breakwater: her own outfit (2.10). Fan service (adult): confident and beautiful; the camera never below her waist level."
  - "Han Sora, P16-P27: look `pool` (2.20): the black one-piece swimsuit with a deep plunging neckline, high-cut legs and crimson piping; big sunglasses pushed up into her black bob; red lips; the bandage on her RIGHT wrist; the slim silver compass on her LEFT wrist. A cocktail in her LEFT hand. Fan service (adult); the camera never below her waist level."
  - "Moon Ahin, from P41: look `summer` (2.20): the fitted white sundress (thin spaghetti straps and airy off-the-shoulder chiffon sleeves, a deep plunging V neckline over a push-up bodice, a thin silver ribbon under the bust, a flared skirt to the knee with a soft ruffle and her high slit up the LEFT leg), the wide-brimmed white sun hat with a silver ribbon, white strappy sandals, white lace gloves, the silver baton in a slim holster at her RIGHT hip; long black hair with the silver ribbon bow. Saebyeok (ahin_husks, No. 1, a polished porcelain husk, no different from the rest) holds a white parasol over her; other husks carry her luggage. Fan service (adult); the camera never below her waist level."
  - "Yoo Bomi (2.7): the cropped neon-yellow bomber worn open, the black crop top, high-waisted denim shorts, black thigh-high socks, black trainers, the ponytail with bleached ends; her white drone with its red light always near her. Fan service is fine (adult); the camera never below her waist level."
  - "Branch Chief Yang (assoc_yang, 2.20): 63, thin, bald with a grey fringe, round glasses, a brown cardigan over the grey Association shirt with the star-and-shield badge."
  - "Deputy Director Hwang (2.18), only on the video-call screen: 60, silver hair, a soft smiling face, rimless glasses, a grey Association suit; the small silver hexagon pin on the UNDERSIDE of his LEFT lapel shows for an instant at P09."
  - "Kanghan Marine's barge (kanghan_barge, 5d): black hull, a tall crane, drill rigs hanging ready on cables (they only go down on Friday at 6:00), floodlights, containers, the silver hexagon on the hull (an emblem, no letters). Engineers in grey coveralls with the hexagon emblem and orange life vests; troopers in black armour with smoky visors and core carbines."
  - "Kanghan's anchors (6): black steel harpoon anchors 2 m long on chains as thick as an arm, each link stamped with the same small mark as the farm's chains (a shape, never letters)."
plants:
  - "PLANT P11: the barge over the lid (ch 38-40)."
  - "PLANT P20-P22: the anchors' chains carry the farm's stamped mark: Busan is meant to be a second farm (ch 39: Nib cuts them)."
  - "PLANT P25: 'He said you'd come to us anyway' (Baek's long game; ch 40, Part Two)."
  - "PLANT P54-P59: they drill at six tomorrow; if the lid breaks, they chain the boss (ch 38-39)."
hook_type: threat

panels:

