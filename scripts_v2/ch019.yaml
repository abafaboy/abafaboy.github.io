chapter: 19
title: Borrowed Thunder
format: SCRIPT_FORMAT_v2.md
when: "Saturday, the last three seconds of the Bell-Ringer's rage and the minutes after it: the sealed boss chamber of the drowned cathedral."
story_beats: ARC3_4_BEATS.md#19-borrowed-thunder
cast:
  kang_jaeha: vest
  nib: mask                 # rest form until P24, field form P24–P40
  borro: default            # husk face; field form; buried to the waist until P46
  lyra: default             # field form
  song_yerin: default
  mok_hangyu: default
  han_sora: default         # only at the very end, in the high doorway
  bh_sealers: default       # voice on Mok's radio
  yoo_bomi: default         # outside, on the stream
  bell_ringer: default
locations: [boss_chamber_bells, dam_gate]
continuity:
  - "Jaeha: the orange vest with Seoa's red stitches (now torn at the shoulder again), the grey hoodie, the forearm bandage, the earpiece; blood from his nose and his LEFT ear. From P31 his legs give out: Mok holds him up."
  - "Nib: seal 2/5 look, the cracked husk mask; rest form (cooldown) until P24, field form (amber) P24–P40. Borro: the husk face; field form (moss green); buried to the waist in rubble until Lyra and Nib dig him out (P46); Bomi's drone in his moss. Lyra: field form (river-blue outline); her full design (CHARACTER_DESIGNS_v2.md 2.10); the camera is never aimed up her skirt."
  - "Mok: soaked, his cracked black tower shield; from P31 he drops it to hold Jaeha up from behind."
  - "The Bell-Ringer: as in ch 17–18; Lyra's first wedged arrow sticks out of the violet crack in its bell-head from P07."
  - "The chamber: rubble everywhere after the great toll (P10), half the dome fallen, daylight-coloured light falling through the holes in shafts; the stair to the small door high on the back wall is gone, the doorway 6 m up the wall."
  - "Borrowed Thunder (P34): the white-gold force of the clapper's blow runs from Borro's shield through his shell, through Jaeha's hand, through his body and up through his other hand into Lyra's heel and up her body into the arrow; the arrow leaves the bow with the deep ring of the bell itself, trailing white-gold lightning."
plants:
  - "PLANT P44: [HARVEST CORE · EST. ₩900,000,000 · NO OTHER OPTION] (ch 50)."
  - "PLANT P58–P59: Jaeha names Oh Minseok to Mok (ch 20–21)."
  - "PLANT P62–P64: Mok's second team is behind the back door; Sora in the high doorway, her compass on Lyra, then Jaeha (ch 20)."
hook_type: threat

