chapter: 28
title: Not Equipment
format: SCRIPT_FORMAT_v2.md
when: "Friday, about 2:20 AM: the end of the great drain pipe beside the Warden's chained arm, then the drain tunnel."
story_beats: ARC3_4_BEATS.md#28-not-equipment
cast:
  kang_jaeha: crew
  nib: mask
  borro: default
  lyra: default
  moon_ahin: default
  ahin_husks: default        # 30
  crew_pyo: default
  crew_dami: default
  crew_woo: default
  crew_ho: default
  tide_warden: default
  kanghan_engineer: default
  kanghan_tactical: default
  han_sora: kanghan          # voice on the radio only (P56)
locations: [farm_pit, farm_drains]
continuity:
  - "Jaeha: the crew kit, the respirator off and hanging at his belt beside Minseok's rusted lamp; Dami's scarf on his LEFT shoulder, bleeding through again from P37; a fresh nosebleed from P37 (the 60% Carry)."
  - "The setting (P01-P50): the end of the great drain pipe on the pit wall, beside the Warden's chained LEFT arm; the round hatch open behind the team onto the drain tunnel; seawater running in the pipe and spilling over the hatch's lip; red warning lights; the Warden's open sea-green eye above them; guards' torch beams coming along the pipe from P30."
  - "The Warden's words (lettered in angle brackets) reach only the summons; Nib translates for Jaeha. The machines pour seawater back into the Warden to keep him alive and take the rest."
  - "Moon Ahin's video (P22-P30): her own phone held up in her RIGHT hand, the camera app's recording screen drawn plainly (a red dot, no other interface text); what the phone shows is drawn inside its frame."
  - "Borro in field form from P35 (moss-green outline): he tears a drain pipe as thick as a tree trunk out of the Warden's arm with his bare hands. Jaeha carries it."
  - "The drain tunnels (new location farm_drains, P52 onward): old Far Side tide channels repurposed by the engineers: round stone tunnels 5 m across climbing through the canyon wall in long switchbacks, a channel of black water pumped uphill along the floor, a narrow steel maintenance walkway beside it, caged lamps, pump housings thumping. They lead up toward the rim."
plants:
  - "PLANT P06-P08: HARVEST would pay ₩40,000,000,000 and close the gate on everyone inside; no other option is offered (ch 50)."
  - "PLANT P15-P19: Minseok spent three days in the pit with the Warden (Arc 5)."
  - "PLANT P13-P14, P20: Jaeha swears to come back for the Warden (Arc 5)."
  - "PLANT P22-P31: the proof: Moon Ahin's video with her own face, and the crew's (ch 32)."
  - "PLANT P56: Sora takes the top of the drains (ch 29)."
hook_type: threat

