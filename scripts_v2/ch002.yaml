chapter: 2
title: Who's in Charge
format: SCRIPT_FORMAT_v2.md
when: "The same Thursday night, about 11:05 PM, inside the boss room of Gate 0912: the seconds right after chapter 1 ends, then Nib's five minutes of field form."
story_beats: STORY_BIBLE_v4.md#chapter-2-whos-in-charge-about-65-panels
cast:
  kang_jaeha: vest
  song_yerin: default
  nib: mask                 # hood down; the cracked husk mask over the upper LEFT of his face
  knight_commander: default
locations: [boss_room]
continuity:
  - "Field form: Nib's eyes glow faintly amber the whole chapter."
  - "LINK is active from P27 to the end: a thin amber outline flickers along Nib in every panel where he appears, and Jaeha's irises carry a faint amber glint. No beams, no aura."
  - "Jaeha starts with a thin nosebleed (the emergency call cost him). After the CARRY hit (P42) it bleeds again; Yerin's healing (P50–P51) stops it, but the dried blood stays on his lip and chin."
  - "The notebook lives in Jaeha's LEFT chest pocket until P25, then in his hands or under his left arm. When he holds it, the pocket is empty. It never flies away."
  - "The knight's tell: his cracked, loose LEFT pauldron (picture-right when he faces us) dips before every sweep."
  - "The pillar Jaeha and Yerin shelter behind stays the same pillar from P05 to the end, with the knight's side at picture-left."
plants:
  - "PLANT P47: nobody has ever taken a hit for Nib; his silence pays off in ch 3 ('Nobody came back for me')."
  - "PLANT P57–P60: the Ninth Wall sigil on the knight's chest (ch 3 flashback; ch 4 release)."
  - "PLANT P26: LINK RANGE 50 M (trained in ch 8)."
  - "PLANT P39: CARRY overload means bleeding, then collapse (pays off in ch 4 and ch 33)."
hook_type: mystery

panels:

  # ================= BACK IN (P01–P05) =================
  - id: P01
    recipe: talk
    shape: wide
    gap: none
    bg: black
    camera: "low and wide from the floor beside Yerin: the giant blade held up by the small goblin, the knight towering behind, the pillar at picture-right"
    light: "key: faint cyan glow from the husk's broken shards on the floor, under-lighting Nib; back light: the knight's red face-hole high above, a red rim along the blade"
    art: >
      The exact moment chapter 1 ended. The knight's (knight_commander) huge sword presses down on Nib (nib, mask),
      who holds it off with one short knife, the blade's spine against his left forearm, his other knife loose in a
      reverse grip. White husk shards with a faint cyan glow lie scattered round his bare feet. Yerin (song_yerin) is
      on the floor behind him. Nib looks back over his shoulder toward the pillar at picture-right, where Jaeha is
      (off-panel). Sparks where steel grinds on steel. Scale: the knight is 4.5 m tall standing, so bent over the
      sword he still towers; Nib (105 cm, a lanky 6 heads) reaches no higher than the knight's shin.
    acting:
      nib: "braced under the blade with his weight low, the blade's spine on his left forearm and that knife holding it off; the right knife loose in a reverse grip at his hip; head turned back over his shoulder toward the pillar, unhurried, eyelids half-lowered, mouth a flat line moving on the line"
      song_yerin: "on the floor behind him, propped on her elbows, staring up at the blade"
    eyeline: "Nib → Jaeha (off-panel right); Yerin → the blade"
    calm: top
    lines:
      - {who: nib, type: speech, text: "YOU'RE IN CHARGE? THEN WHY ARE YOU THE ONE BLEEDING?", side: l}
    sfx:
      - {text: "GRRRIIND", style: impact, at: [0.32, 0.22], size: L, rot: -8}

