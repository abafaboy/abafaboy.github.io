    art: >
      Jaeha (kang_jaeha, vest), on one knee behind the pillar, touches his upper lip with two gloved fingers. A thin
      line of blood runs from his nose; the fingertips come away red. He blinks at them.
    acting:
      kang_jaeha: "on one knee, head tipped down a little, two fingers of his right hand lifted away from under his nose so he can look at them; eyes wide, brows up, mouth slightly open; a thin trickle of blood from one nostril"
    eyeline: "Jaeha → his own fingertips"
    calm: left
    lines:
      - {who: kang_jaeha, type: speech, text: "OH. I DIDN'T EVEN NOTICE THAT.", side: r}
      - {who: kang_jaeha, type: inner, text: "THAT CALL TOOK A LOT MORE OUT OF ME THAN A HUSK."}
    sfx:
      - {text: "DRIP", style: quiet, at: [0.30, 0.80], size: S, rot: 0}

