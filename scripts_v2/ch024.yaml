chapter: 24
title: The Puppeteer
format: SCRIPT_FORMAT_v2.md
when: "Thursday night, about 11:40 PM to 1 AM: down the walkways of the Han River gate, from the first landing to the locked gate above level four."
story_beats: ARC3_4_BEATS.md#24-the-puppeteer
cast:
  kang_jaeha: crew           # grey coveralls, orange T-4 tabard, respirator (off P38-P40), hard hat
  nib: mask                  # seal 3/5 scout-captain armour; rest form, field form P25-P38
  borro: default             # in the river (P47)
  lyra: default              # in the river (P47)
  moon_ahin: default         # name card P02
  ahin_husks: default
  foreman_gu: default
  crew_pyo: default
  crew_dami: default
  crew_woo: default
  crew_ho: default
  canyon_wyvern: default     # new monster, see continuity
locations: [farm_canyon]
continuity:
  - "Jaeha: the crew kit (ch 23): grey coveralls, the orange tabard with the stencilled 4, the full-face respirator with the smoky visor, a yellow hard hat with a lamp; healing wounds under the coveralls. From P32 a fresh claw gash on his LEFT shoulder (carried for Nib), a red stain spreading through the coverall."
  - "Moon Ahin: her full design (2.11). Her name card in P02 (a tall full-figure glamour panel). She conducts with small flicks of the baton and never raises her voice; her rare crack is one eyebrow twitching. Her forty husks (ahin_husks) are numbered in silver on the back of the neck (the art shows small silver numerals); three are lost in P22, leaving 37."
  - "Canyon wyverns (new monster, CHARACTER_DESIGNS_v2.md 4c, to be added): small cliff-dwelling wyverns; a body the size of a large dog (1.2 m long without the tail), a wingspan of about 2.5 m; slate-grey leathery skin streaked with rust; a long whip tail ending in a hooked barb; a narrow skull with a beaky snout full of needle teeth; pale clouded eyes; Hush cracks leaking violet ash along the wing bones. They nest in crevices in the canyon wall and dive in flocks of ten to twenty. A shriek like tearing metal."
  - "Nib's field form (P25-P38): amber eyes and a thin amber outline. Every hit he takes opens on Jaeha's body (CARRY)."
  - "The trap stones (ch 23): square carved plates in the rock ledges with worn spiral marks; on a live plate the spiral opens to the left. Where the steel walkway ends, short stretches of old Far Side stone ledge carry the path (P20-P33)."
  - "The carved gallery (P48): a stretch of canyon wall carved by the Far Side: huge weathered reliefs of a giant in coral armour holding back a wave with a trident, and rows of sea-people kneeling; wave-patterned borders. No legible script."
  - "The locked gate above level four (P50-P56): a steel grille gate across the walkway where it enters a narrow cleft; beyond it the pipes plunge into the cleft, and a faint violet glow pulses at the bottom."
  - "The river (P47): the canyon floor; black water over pale stones; Borro stands waist-deep with Lyra sitting on his shell."
plants:
  - "PLANT P14: her forty husks move as one body, and one trap can catch them all (ch 30)."
  - "PLANT P38-P43: Moon Ahin knows who he is and says nothing to the foreman (ch 25)."
  - "PLANT P48: sea-people's markings this far inland: the Tide Warden (ch 26)."
  - "PLANT P51: level four is Director Baek's (ch 26)."
hook_type: mystery

