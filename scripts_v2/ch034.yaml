chapter: 34
title: Just One More
format: SCRIPT_FORMAT_v2.md
when: "Monday 4:00 AM to Tuesday night, Busan: the breakwater, the harbour fish market, Auntie Geum's stall, the stony shore under the breakwater, and a black car on the harbour road."
story_beats: ARC5_BEATS.md#34-just-one-more-hook-threat
cast:
  kang_jaeha: training       # Geum's spare purple tracksuit (CHARACTER_DESIGNS_v2.md 2.20)
  nib: mask                  # seal 3/5 armour; the cracked husk mask in public, none in Geum's tent; rest form except P50 (field form)
  borro: default             # husk face in public; rest form all chapter
  lyra: default              # no mask; rest form except P50 (field form)
  geum_okran: default
  market_aunties: default    # generic, three stallholders (2.20)
  fishermen: default         # generic
  kang_seoa: default         # on a video call only (P30); 15: never any fan service
  yoo_bomi: default          # on the phone only (P31)
  han_sora: kanghan          # in a parked car (P35-P37)
  baek_taegun: default       # on the phone only (P36)
  brine_crawler: default     # the hook (P56-P62)
locations: [busan_breakwater, busan_fish_market, geum_stall]
continuity:
  - "Kang Seoa (15): her outfit as each panel says; glasses, the calculator keychain. Never any fan service. The camera stays at her eye level or above, never below."
  - "Jaeha: Geum's spare tracksuit, faded purple like hers and too short at the wrists and ankles, a towel round his neck, his own trainers; his hands still shake a little (a faint tremor line on the fingers), a little less by Tuesday. Notebook in the LEFT chest pocket of the tracksuit top, pencil behind the RIGHT ear, fringe over the LEFT eye."
  - "Nib: seal 3/5, the scout-captain armour (CHARACTER_DESIGNS_v2.md 2.2) over the cloak; the cracked husk mask over the upper LEFT of his face in public; no mask inside Geum's tent. Rest form (dull eyes, no outline) except the sparring on the shore, P50 (field form: amber eyes, thin amber outline)."
  - "Borro: 2.4 m, the slate shell with moss and tiny flowers, the door-sized iron shield; the white husk face tied on with cord in public. Rest form all chapter."
  - "Lyra: her design exactly (2.10), no mask; rest form except P50 (field form: river-blue glow). Fan service: confident and beautiful, never a camera below her waist level."
  - "Auntie Geum Okran (2.17): apron over the purple tracksuit, headscarf, pink slippers, the steel LEFT arm, the ladle in her RIGHT hand; in P01-P09 she rides a battered red moped and shouts through a rolled-up newspaper."
  - "The market aunties (generic, 2.20): one tall and thin in a sun visor, one round in a floral headscarf, one tiny with a gold necklace; rubber aprons, boots and arm sleeves."
  - "Han Sora (2.16): the charcoal Kanghan jacket over a black top, her black bob, red lips; a fresh bandage round her RIGHT wrist; a new slim silver compass on a fine chain round her LEFT wrist (section 6), its needle a violet sliver of core."
  - "The breakwater (new location busan_breakwater): a concrete breakwater running 1 km out from the harbour, a walkway 6 m wide with a low parapet, grey tetrapods piled on the seaward side, a red lighthouse 12 m tall at its end; Geum's orange tent glows at the edge of the market behind."
  - "The fish market (new location busan_fish_market): a big covered market by the harbour: rows of tanks with live fish, crabs and octopus, ice trays, red plastic tubs, wet concrete, fluorescent tubes; at the back the cold store's insulated steel door."
  - "A brine crawler (4d.1): a dog-sized crab-and-eel thing, black-grey carapace 80 cm long, two serrated claws, six spiny legs, a 1 m eel's tail, a round needle-toothed mouth, no eyes, violet cracks leaking ash."
plants:
  - "PLANT P20-P25: the window's small print: CARRY CAPACITY grows with sustained load, not peak load (Arc 5 training; STORE in ch 38)."
  - "PLANT P35-P37: Sora watches from the harbour road with a new compass on her LEFT wrist (ch 37)."
  - "PLANT P38-P42: dead fish with violet-tinged scales; Geum's steel arm twitches; the failing seal (ch 36: 72 hours)."
  - "PLANT P43-P45: Geum won't talk about the man ten years ago (ch 35)."
  - "PLANT P51: Nib hears the sea sound like a wall before it falls."
hook_type: threat

panels:

