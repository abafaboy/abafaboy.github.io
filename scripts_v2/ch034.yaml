      out into the black sea toward the red lighthouse at its end, its beam sweeping. Halfway along it, one moped headlight crawls
      beside one small staggering figure. The city's towers glitter far behind the harbour. Scale: the breakwater is 1 km long; the
      figures are specks.
    calm: top
    silent: true
    lines:
      - {who: offpanel:crowd, type: tag, text: "BUSAN. MONDAY, 4:00 AM."}
    sfx:
      - {text: "putt putt putt", style: quiet, at: [0.46, 0.66], size: S, rot: 0}

