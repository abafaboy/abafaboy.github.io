    gap: none
    bg: black
    camera: "high and wide over the harbour in the dark: the long breakwater running out to the red lighthouse, one moped headlight crawling along it beside one staggering figure"
    light: "no daylight: the lighthouse beam and one moped headlight; the city's lights far behind"
    art: >
