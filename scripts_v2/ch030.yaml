chapter: 30
title: The Rim
format: SCRIPT_FORMAT_v2.md
when: "Friday, about 2:40 AM, the rim sealing from 06:00 to 01:58: the shaft, the sludge mouth on the canyon face, and the gap to the rim ledge."
story_beats: ARC3_4_BEATS.md#30-the-rim
cast:
  kang_jaeha: crew
  nib: mask
  borro: default
  lyra: default
  moon_ahin: default
  ahin_husks: default        # 30, then 29 (P27); No. 1 anchors the far end
  crew_pyo: default
  crew_dami: default
  crew_woo: default
  crew_ho: default
  han_sora: kanghan
  kanghan_tactical: default
locations: [farm_drains, farm_canyon]
continuity:
  - "Jaeha: the crew kit, the bloody scarf, Minseok's lamp; still in overload from ch 29 (a nosebleed, grey at the edges of his sight). From P34 thin white threads run from him to every husk in the bridge, and dark bruises bloom across his forearms and neck as the husks crack."
  - "The shaft (P01-P13): as ch 29: 120 m long, 30 degrees steep, the walkway up one side, the water up the other; Sora's barricade of shields at the top. Halfway up, in the side wall, a round dark sludge mouth 2 m across."
  - "The canyon face (P14 onward): the sludge mouth opens onto a lip of stone on the sheer canyon wall near its top, 300 m above the river. Across a 40 m gap: the rim ledge, a broad stone shelf at the top of the wall, with the gate's inner rim set into the rock behind it: a tall ellipse of white light 8 m high inside Kanghan's steel iris frame, whose plates are closing in sparks, the white getting narrower. The stumps of an old collapsed walkway stick out from both sides of the gap. A side door from the pump room opens onto the rim ledge."
  - "The husk bridge (P24 onward): Moon Ahin's thirty husks leap out one after another and lock wrists to ankles and arms to shoulders into a lattice that spans the gap, sagging in the middle, its top a walkable line of polished backs and shoulders; No. 1 holds the far end on the old walkway stump at the rim ledge. Each husk keeps its silver numeral on the back of its neck."
  - "Field forms: Borro from P05 (CARRY), Lyra from P07 (CARRY); from P33 Jaeha drops their CARRY to carry the husks; Nib in field form from P41, not carried."
  - "Sora in Kanghan colours, wet hair slicked back."
plants:
  - "PLANT P20-P22: Moon Ahin speaks to No. 1 (ch 32: she names it)."
  - "PLANT P31-P36: Jaeha can LINK and CARRY husks: they are summons too, only empty (Arc 5)."
  - "PLANT P54-P58: Sora on the far end of the bridge (ch 31)."
hook_type: threat

