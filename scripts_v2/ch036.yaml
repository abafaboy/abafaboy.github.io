chapter: 36
title: Pim
format: SCRIPT_FORMAT_v2.md
when: "Wednesday, 11:42 PM: inside the Call, and Jaeha's body on the breakwater; then the breakwater at midnight. Thursday 5:20 AM at the fish market; Thursday 6:40 AM, sunrise, at the end of the breakwater."
story_beats: ARC5_BEATS.md#36-pim-hook-mystery
cast:
  kang_jaeha: training       # the tracksuit; white bandage on the LEFT forearm
  pim: default               # 2.19; Geum's headscarf over his antennae P30-P35; the headset from P37; field form P48-P59
  nib: mask
  borro: default             # husk face in public
  lyra: default
  geum_okran: default        # no headscarf P30-P39 (Pim has it); hers again from P41
  han_sora: shorts           # in the car: the chest rig and the jacket on the back seat
  baek_taegun: default       # his voice on the phone only
  pc_bang_owner: default
  market_aunties: default
  deep_lantern: default      # the voice only; never seen whole (4c.5)
locations: [call_void, pim_tower, busan_breakwater, busan_fish_market]
continuity:
  - "Jaeha: look `training`: Geum's spare purple tracksuit, too short at the wrists and ankles, his own trainers, a towel round his neck; a clean white bandage on his LEFT forearm. Notebook in the LEFT chest pocket of the tracksuit top, pencil behind the RIGHT ear, fringe over the LEFT eye. Inside the Call he looks the same. While he is in the Call (P01-P24), his body stands rigid at the end of the breakwater with its eyes glowing cyan."
  - "Pim (2.19) exactly: 140 cm to the top of his head, the feathery cream-and-lilac antennae 30 cm more; moon-cream fur with a fluffy ruff; enormous glossy black eyes with no whites and one soft highlight; a tiny mouth that opens very wide; no nose; thin grey-lilac limbs, long fingers (three and a thumb); the lilac signal-keeper's vest with brass buttons and the round brass mirror badge; brass wire coiled round both wrists; the satchel of brass tuning forks; wings folded down his back to the backs of his knees like a soft cape. An adult officer, never a plush mascot or a baby."
  - "Pim's head: P30-P35 Geum's faded floral headscarf tied over his antennae like a bonnet, knotted under his chin, the antenna tips poking out at the top; from P37 the black over-ear gaming headset with a cracked band and a dead light ring, a little too big, his antennae poking up through the gap in the band. He carries the headscarf in his fist in P37-P38 and hands it back to Geum in P40."
  - "Pim's field form (P48-P59): the wings open to a 2.6 m span, their eye-spots glowing lilac; the antennae blaze lilac; rings of faint lilac signal ripple out from them; the headset pushed down round his neck."
  - "Nib: seal 3/5 armour, the cracked husk mask in public; rest form; the strip of towel still tied round the cut on his RIGHT upper arm (ch 35). Borro: the white husk face tied on in public (the breakwater, the market); rest form. Lyra: no mask; rest form."
  - "Auntie Geum: the checked apron over the purple tracksuit, pink slippers, the steel LEFT arm, the ladle in her RIGHT hand. Her floral headscarf comes off at P29 (she ties it on Pim): short permed grey hair bare P30-P40; she wears it again from P41."
  - "Han Sora (P34-P35, in the black car on the harbour road as in ch 34): her Busan summer look (outfit `shorts`): the black sports-bra-style crop top under a black tactical chest rig (bolt magazines and small pouches on the front panel, open at the sides so her waist shows), black tactical shorts to mid-thigh with the thigh holster strapped round her bare thigh, black combat boots; in the car the chest rig and the charcoal Kanghan jacket lie on the back seat, so the black crop top shows, her black bob, red lips; the bandage round her RIGHT wrist; the slim silver compass on a fine chain round her LEFT wrist. Lit by the dashboard. Fan service is fine (an adult); the camera stays at or above her shoulder level in the car."
  - "The PC bang owner (pc_bang_owner, 2.20): a sleepy man in his thirties in a grey hoodie and slippers, an unlit cigarette behind his ear; he chases Pim with a broom."
  - "The Call (call_void): endless still black water under a starless sky; tall rifts like doors stand round Jaeha, most of them dark, thin Operator-cyan lines running from them to him. Pim's rift (pim_tower) is the lit one: a dark silent plain under a violet-black sky, a broken signal tower of brass and stone with cracked mirrors and trailing wires; other towers dark and toppled on the horizon."
  - "The thing under the lid (deep_lantern, 4c.5): never shown whole. In Pim's hearing (P56) it is only a faint violet glow like a lantern far down in the black under the lid, and one vast curve of dark hide turning past it."
plants:
  - "PLANT P12-P13: something cold listens in the Call too (the Hush; ch 9's [WARNING · UNREGISTERED LISTENER]; Operator #1)."
  - "PLANT P51-P53: 72 hours means Sunday morning; Kanghan's drilling makes it Friday night (ch 38)."
  - "PLANT P55-P62: the thing under the lid knows what an Operator is, and the window names Operator #1 (the Deep Lantern was his fighter: ch 39-40, Part Two)."
hook_type: mystery

