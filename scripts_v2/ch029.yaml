chapter: 29
title: Sandbags
format: SCRIPT_FORMAT_v2.md
when: "Friday, about 2:30 AM, with the rim sealing: climbing the drain tunnels from 08:31 down to 06:00."
story_beats: ARC3_4_BEATS.md#29-sandbags
cast:
  kang_jaeha: crew
  nib: mask
  borro: default
  lyra: default
  moon_ahin: default
  ahin_husks: default        # 30
  crew_pyo: default
  crew_dami: default
  crew_woo: default
  crew_ho: default
  han_sora: crop             # P58-P60, with the harness; the charcoal Kanghan jacket tied round her waist by its sleeves
  kanghan_tactical: default  # P58-P60
locations: [farm_drains]
continuity:
  - "Jaeha: the crew kit, the scarf on his LEFT shoulder dark with blood, Minseok's lamp at his belt. From P17 he is in overload: blood running from his nose, the edges of his sight going grey (draw a soft grey vignette on panels from his point of view), his hands shaking; he climbs on Moon Ahin's arm from P47."
  - "The drain tunnel (location farm_drains): the round old stone tide-channel, 5 m across, climbing steeply; the black water channel along the floor, pumped uphill; the narrow steel walkway; caged lamps; pump housings. Its roof is a run of stone arches; each arch has a carved keystone at its crown, and the cracks run out from the keystones."
  - "Field forms: Borro's field form from ch 28 is still running with 00:50 left at P02 and ends at P20; Nib and Lyra are called into field form at P13. Jaeha carries all three at once from P15: one more than his limit."
  - "The last tunnel (P55-P60): a long straight steep shaft of stone, 120 m long, with the walkway running up one side; at the top, a round chamber where the pumps push the water out through a steel grate toward the rim; the white light of the rim beyond it, narrowing. Sora and twelve troopers have set up a barricade of round shields across the top."
plants:
  - "PLANT P14-P17: CARRY three at once, past the limit: the overload that ch 33 pays for."
  - "PLANT P26-P34: the crew go back for a summon (ch 32: their testimony)."
  - "PLANT P38-P42: Moon Ahin gives Jaeha her hand and her arm (ch 30)."
hook_type: countdown

