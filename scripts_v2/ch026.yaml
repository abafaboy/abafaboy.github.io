chapter: 26
title: Core Farm
format: SCRIPT_FORMAT_v2.md
when: "Friday, about 2 AM: the old side passage beside the glass wall, the iron door, and the stone balcony over the pit on level four."
story_beats: ARC3_4_BEATS.md#26-core-farm
cast:
  kang_jaeha: crew
  nib: mask
  borro: default
  lyra: default
  moon_ahin: default
  ahin_husks: default        # 36; they wait in the side passage from P14
  crew_pyo: default
  crew_dami: default
  crew_woo: default
  crew_ho: default
  tide_warden: default       # new boss design, see continuity
  kanghan_engineer: default
  kanghan_guard: default
locations: [farm_canyon, hanriver_gate_flashback, farm_pit]
continuity:
  - "Jaeha: the crew kit, the respirator round his neck, Dami's scarf on his LEFT shoulder, dried blood under his nose. In his coverall's chest pocket, the stamped chain link from ch 4 (matte black factory steel, one small stamped mark: a shape, never letters)."
  - "The side passage and the iron door (P02-P13): a narrow, older stone corridor beside the glass wall, cables along its floor; it ends in the dark stone chamber of the ch 14 flashback and its tall iron door, 4 m high, now propped open with a steel wedge and threaded with cables. On the door's inside face, scratched into the iron with a knife: rough letters (the letterer sets them as a label) and a small scratched thumbs-up. At its foot, a rusted hard-hat lamp and a strip of faded orange vest cloth."
  - "The pit (new location farm_pit, P15 onward), seen from an old Far Side stone balcony high on its wall with a carved balustrade: a vast round chamber 150 m across and 80 m deep, the original boss chamber, filled with machinery. In its centre the Hushed Tide Warden kneels, chained. Steel catwalks ring the pit at three levels; terraces of glass tanks step up the walls; a glass-fronted control room with screens hangs on the far wall; cranes; a freight elevator carrying racks of filled tanks up into the dark. The glass wall of ch 25 is one side of the pit, fogging and clearing with the Warden's breath. Lighting: the deep violet of the drained light, white work lights, red warning lights from P56."
  - "The Hushed Tide Warden (new boss, CHARACTER_DESIGNS_v2.md 4c, to be added): a sea-giant, 30 m tall if he stood, kneeling and sagging; pale blue-grey skin like a drowned man's with Hush cracks leaking violet ash; armour of red and white coral grown like plate, crusted with barnacles and shells; a crown of coral branches; a long beard of kelp; a broad, noble, sorrowful face, eyes closed until ch 27. Chains as thick as tree trunks run from steel cuffs on his wrists, neck and waist to anchors in the pit walls. Dozens of steel pipes are driven into his body through collars bolted into the coral, drawing smoky violet light out through glass sections into the tanks. A broken trident lies in the machinery at his knees."
  - "Kanghan engineers (generic) work round him like dairy farmers: grey coveralls, white hard hats, respirators round their necks, tablets, trolleys. Kanghan guards (2.14) patrol the catwalks."
  - "The tanks: glass cylinders the height of a man on steel racks, filling with smoky violet light that settles into faceted crystals at the bottom (cores); each tank has the silver hexagon and the small crescent-moon seal stamped on its steel cap."
  - "Moon Ahin's husks wait in the side passage (P14 onward) with the crew's orders not to move; only Jaeha, Moon Ahin, the crew and the three summons crawl out onto the balcony."
plants:
  - "PLANT P08, P12: Minseok's lamp; Jaeha leaves it on the ledge under his niche (ch 32 P44)."
  - "PLANT P28-P29, P40: half of Seoul's hospitals run on Kanghan cores (ch 32: 'Do you want the hospitals dark, Ahin?')."
  - "PLANT P32-P35: the stamped link from ch 4 matches the Warden's chains: the knight at Gate 0912 was chained by Kanghan too (Arc 5)."
  - "PLANT P37-P39: Nib learns who chained his commander (Arc 5)."
  - "PLANT P49-P50, P59: the Warden can feel the summons, his own world's people, and his eye begins to open (ch 27)."
hook_type: threat

