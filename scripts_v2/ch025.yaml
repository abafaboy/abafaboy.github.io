      shears off the rock wall in a shower of snapping bolts and falls away into the dark; the foreman (foreman_gu), alone at the
      grille, throws himself back from the new edge. The column clings to the walkway below. Scale: the gap is 15 m wide.
    acting:
      foreman_gu: "throwing himself backwards from the edge, arms flailing, hard hat flying"
    calm: top
    sfx:
      - {text: "THOOOM", style: impact, at: [0.30, 0.20], size: L, rot: 0}
