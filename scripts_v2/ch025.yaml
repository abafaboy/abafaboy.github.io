chapter: 25
title: Same Kind
format: SCRIPT_FORMAT_v2.md
when: "Friday, about 1 AM to 2 AM: the cleft below the locked gate, the old pipe gallery near the canyon floor, the pipe junction, and the glass wall."
story_beats: ARC3_4_BEATS.md#25-same-kind
cast:
  kang_jaeha: crew           # the crew kit; the respirator mostly round his neck now
  nib: mask                  # seal 3/5 armour
  borro: default             # joins at P12
  lyra: default              # joins at P12
  moon_ahin: default
  ahin_husks: default        # 37 left; No. 1 leads; No. 17 broken in P38 (36 left)
  foreman_gu: default        # P01-P02 only
  crew_pyo: default
  crew_dami: default
  crew_woo: default
  crew_ho: default
  ash_hound: default         # CHARACTER_DESIGNS_v2.md 4b.3, a pack of twelve
  ash_hound_alpha: default   # 4b.3
locations: [farm_canyon]
continuity:
  - "Jaeha: the crew kit, the respirator hanging round his neck from P05 (the core dust is thin down here); the claw gash on his LEFT shoulder (ch 24) under a strip of Dami's scarf from P11. A nosebleed from P41."
  - "Moon Ahin: her full design (2.11); a smudge of dust on the white coat-dress from P05. Her husks: 37 left; each has a small silver numeral on the back of its neck; No. 1, the lead husk, is no different to look at but always walks at the front."
  - "The pipe gallery (P11-P30, location farm_canyon): an ancient Far Side tunnel near the canyon floor, a vaulted stone passage carved with wave patterns, 12 m wide and 10 m high; three of the giant pipes run side by side along it on steel cradles, humming and glowing faintly violet; caged maintenance lamps every 20 m; side channels of black water."
  - "The pipe junction (P31-P42): a round vaulted chamber 30 m across where the pipes split three ways; one pipe has a crack leaking violet light like steam, and the ash hounds lap at the light pooling under it."
  - "Ash hounds (4b.3): wolf-sized, black, eyeless and noseless, split jaws of bone-white teeth, violet ash from cracks along the back; the pack moves only when the alpha howls (its tell). The alpha is chest-high on a man, its neck cracks flaring violet when it howls."
  - "The glass wall (P53-P60): where the gallery ends, an enormous curved wall of thick glass 30 m high set into the rock in a steel frame, fogged on the inside; the three pipes pierce it through steel collars. Beside the frame's base, a brass plate with the silver hexagon logo and, under it, a small crescent-moon seal (the Moon family's). No legible text."
  - "Field forms (P34-P40): Borro moss green, Lyra river blue, Nib amber; CARRY for two at a time at most (Lv. 2)."
plants:
  - "PLANT P19: 'Uncle Taegun': Director Baek Taegun is Moon Ahin's uncle, her mother's brother (ch 32)."
  - "PLANT P38, P44: No. 17 shatters, and Moon Ahin touches its broken face (ch 30)."
  - "PLANT P45-P47: Moon Ahin understands CARRY (ch 30: 'Why are you carrying my husks?')."
  - "PLANT P58-P60: her grandfather's seal on the wall of the farm (ch 26, ch 32)."
hook_type: personal

panels:

