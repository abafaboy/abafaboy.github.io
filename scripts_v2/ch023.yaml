chapter: 23
title: Under the Bridge
format: SCRIPT_FORMAT_v2.md
when: "Tuesday night: the bridge girders over the Kanghan enclosure, through Nib's eyes; Wednesday evening: the rooftop room; Thursday from 10:50 PM: the riverside park, the enclosure, and the inside of the Han River gate."
story_beats: ARC3_4_BEATS.md#23-under-the-bridge
cast:
  kang_jaeha: hoodie         # P01-P24; from P26 the crew's grey coveralls, orange T-4 tabard and respirator
  nib: mask                  # seal 3/5 scout-captain armour; rest form; no mask at home
  borro: default
  lyra: default
  song_yerin: default
  yoo_bomi: default
  choi_dongmin: default
  kang_seoa: default
  foreman_gu: default        # generic: Kanghan site foreman, see continuity
  crew_pyo: default          # generic: Uncle Pyo, T-1, name card P30
  crew_dami: default         # generic: Dami, T-2
  crew_woo: default          # generic: Jang Woo, T-3
  crew_ho: default           # generic: Jang Ho, T-5
  kanghan_guard: default     # generic (CHARACTER_DESIGNS_v2.md 2.14)
  kanghan_engineer: default  # generic, see continuity
  moon_ahin: default         # P63-P64
  ahin_husks: default        # her forty husks
locations: [hanriver_gate, rooftop_room, farm_canyon]
continuity:
  - "Kang Seoa (15): her outfit as each panel says; glasses, the calculator keychain. Never any fan service. The camera stays at her eye level or above, never below."
  - "Jaeha, healing: Yerin has closed the worst wounds; a plaster on his LEFT cheek, bandages under his sleeves; he still favours his RIGHT leg but walks without the stick from P25 (he leaves it at home on purpose)."
  - "The crew's kit (from P26): grey work coveralls; an orange tabard with a big black stencilled number front and back (1 to 5); a full-face respirator with a smoky tinted visor and twin round filters, so the face behind it is only a dark shape; a yellow hard hat with a lamp. Jaeha is number 4. Once the masks are on (P35), the five look the same apart from height and number."
  - "Foreman Gu (generic): a thickset Kanghan site foreman in his fifties, a grey coverall with the silver hexagon emblem (no letters), a hard hat, a clipboard and a black stun baton on his belt, a respirator hanging at his neck; bored and mean."
  - "The crew (generic, all F-rank summoners): Uncle Pyo (63, T-1): small and wiry, a grey crew cut, a weathered kind face, a bad LEFT knee in a brace; Dami (34, T-2): tired, hair in a low bun, a phone with her daughter's photo as its lock screen; Jang Woo (25, T-3) and Jang Ho (23, T-5): brothers, both lanky with the same big ears, Ho with bleached hair. Each sends one plain husk ahead (section 3: the dull matte white mannequin); Jaeha makes one too."
  - "Kanghan engineers (generic): grey coveralls with the hexagon emblem, white hard hats, respirators, tablets. Kanghan guards: CHARACTER_DESIGNS_v2.md 2.14."
  - "The enclosure (location hanriver_gate): as in ch 8 and ch 22: the fence hung with black tarps, two containers, the generator, the cables, the gate slit in the shadow of pier 7 with its faded yellow 7 and the flickering lamp. New: the bottom third of the slit lies below the river's edge, behind a sagging steel net; a crane truck and a box truck inside the fence; crates with a faint violet glow."
  - "Inside the gate (new location farm_canyon): a vast Far Side canyon in a dim violet-grey twilight with no sun: sheer dark rock walls 400 m deep, a thread of river far below. Steel walkways 2 m wide with rails are bolted into the walls and zig-zag down; pipes as thick as trucks run beside them down into the dark, humming; work lights on poles; cables everywhere. Old Far Side trap stones are set into the rock and the walkways' rock ledges: square carved plates with worn spiral marks. A steel engineers' cabin on a platform at the first landing."
  - "The summons inside (P41-P61): unseen by the crew. Nib moves along the top of the pipes above the walkways; Borro and Lyra keep to the river at the canyon floor. They show only when the art is from their side."
  - "Moon Ahin (P63-P64): her full design (2.11), walking down the walkway as if the abyss is not there. Her forty husks (ahin_husks): polished porcelain white with fine silver seams, marching two by two in perfect step."
plants:
  - "PLANT P06-P09: Kanghan is moving cores out by the truckload, faster since Saturday."
  - "PLANT P22-P23: the dinner promise, Friday at seven (ch 31, ch 33)."
  - "PLANT P44: the gate has been open for four years, and its boss is alive (ch 26)."
  - "PLANT P58-P60: the heir has an inspection order from the board (ch 24, ch 32)."
hook_type: arrival

