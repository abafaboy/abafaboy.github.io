      whole blow pours through Borro's body into Jaeha's hands as a torrent of white-gold light instead of crushing them; Geum
      (geum_okran) holds her ladle up beside them. Past them, twelve white husks (ahin_husks) race along the walkway toward her forearm,
      which rests on the breakwater's edge. Scale: they are under one of her fingers.
