chapter: 40
title: First Kill
format: SCRIPT_FORMAT_v2.md
when: "Friday 8:10 PM to Saturday 1:12 AM, Busan: the neck of the breakwater and the Deep Lantern's head; the harbour after the gate closes; Director Baek's office in Seoul; the breakwater after midnight."
story_beats: ARC5_BEATS.md#40-first-kill-hook-mystery
cast:
  kang_jaeha: training       # the tracksuit; the splinted RIGHT index finger; his RIGHT forearm broken from P24
  geum_okran: default
  nib: mask                  # field form P07-P33; mask off at the hook
  borro: default             # field form P01-P33
  lyra: default              # field form P08-P38
  pim: default               # field form P13-P33
  moon_ahin: default         # the white coat-dress
  ahin_husks: default
  deep_lantern: default      # hushed until P26, freed P27-P33 (4d.3)
  fishermen: default         # the boats lost on the dark sea (P21, P28)
  han_sora: shorts           # the charcoal Kanghan jacket tied round her waist by its sleeves
  kanghan_engineer: default
  song_yerin: default
  kang_seoa: default         # NEVER any fan service
  market_aunties: default
  yoo_bomi: default
  choi_dongmin: default
  evacuees: default          # the crowd coming back down to the harbour
  baek_taegun: default
  deputy_hwang: default
locations: [busan_breakwater, kanghan_barge, busan_fish_market, kanghan_office]
continuity:
  - "Jaeha: look `training` (the purple tracksuit, the bandaged LEFT forearm, the RIGHT index finger splinted with a chopstick). Blood dried under his nose and ears from ch 39. While he holds the strike (P02-P24) his skin glows white-gold with fine cracks of light along his arms and neck, brightest in his RIGHT fist. From P24 his RIGHT forearm is broken (no gore: it hangs wrong, then is splinted by Yerin from P48 with a sling). Soaked from P36."
  - "The STORE countdown: P03 00:10, P12 00:07, P15 00:04, P16 00:03, P22 00:02, P24 release. Keep the order."
  - "Field forms: Nib (amber), Borro (moss green), Lyra (river blue), Pim (lilac, wings open, the headset round his neck). In the break, field form comes back after a minute. When the gate closes at P33 the break is over, and each field form simply runs out its 06:00: Nib, Borro and Pim drop to rest form at P33; Lyra, who called hers last, keeps it to P38 for the dive."
  - "Nib: seal 3/5 armour and the cracked husk mask; the white bandage round his RIGHT upper arm (ch 35)."
  - "Pim's position from P13 to P33: on top of the harbour light tower near the neck of the breakwater (ch 39 P54), wings open; his voice reaches Jaeha through LINK."
  - "The Deep Lantern (4d.3): hushed until P26 (the violet lantern, the Hush crack down her brow, dull violet eyes); freed from P27: the lantern flares pure white and sweeps the sea like a lighthouse beam, her eyes turn sea-grey and gentle; then she sinks and dissolves into light (P33). Scale: Jaeha is smaller than one of her fingers; the crack on her brow is 10 m long; the crest-spine rises 30 m from the top of her head."
  - "The Deep Lantern's core (6): a head-sized core shaped like a lantern, a cage of pale coral round a slowly pulsing white-violet light. Jaeha holds it in his LEFT hand."
  - "Moon Ahin: the white coat-dress (2.11), white gloves, the silver baton in her RIGHT hand; her husks polished white, several cracked after P14. All twenty-eight come back: twelve made the stair (Saebyeok the first step, knocked into the sea at P15, cracked), sixteen held the sea wall. Fan service (adult); the camera never below her waist level."
  - "Kang Seoa (15): school uniform, glasses, the red megaphone. Never any fan service; the camera at her eye level or above."
  - "Song Yerin: the off-white healer's jacket with mint trim, the pink bag; covered; her healing light is soft mint-white."
  - "Director Baek (2.13) in his office (location kanghan_office): the charcoal three-piece suit, silver glasses, both hands folded on the cane with its violet core handle; a wall screen shows Bomi's stream (drawn: the white lighthouse beam over Busan). Deputy Director Hwang (2.18) stands beside the desk, in person."
  - "Nib at the hook: rest form, mask pushed up on his head, his knives on the stone."
plants:
  - "PLANT P20: '...take... them... home...' (the core; ch 50: the RELEASE button, CONTRACT)."
  - "PLANT P40-P45: HARVEST only; he keeps the core and promises to find the button (ch 48 CONTRACT, ch 50)."
  - "PLANT P59: 'Strong things are easier to keep' (Baek's plan for Part One)."
  - "PLANT P63-P66: Kett's call sign from inside a gate (Arc 6)."
hook_type: mystery

