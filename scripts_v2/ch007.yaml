chapter: 7
title: Ten Thousand Won a Trap
format: SCRIPT_FORMAT_v2.md
when: "Wednesday, two days after the sewer job: the rooftop at 7 AM, an F-grade survey gate in a closed shopping arcade in Hapjeong at 2 PM, the arcade's street exit at dusk, and the rooftop room that night."
story_beats: STORY_BIBLE_v4.md#arc-2-chapters-612-the-trap-rats-chapter-by-chapter
cast:
  kang_jaeha: vest          # at home in the morning: the grey hoodie only, the vest on the laundry line (see continuity)
  nib: mask                 # rest form all chapter; no mask at home (P01–P02, P67–P72); seal 2/5 look
  choi_dongmin: default
  song_yerin: default
  yoo_bomi: default
  kang_seoa: default
  survey_officer: default   # generic: the Association survey officer, see continuity
  bh_shield: default        # ch 1 hunter 6, the burly shield-bearer who retreated with Mok
  bh_trapper: default       # generic Black Hound saboteur, see continuity
  kanghan_watcher: default  # generic Kanghan security (CHARACTER_DESIGNS_v2.md 2.14)
locations: [rooftop_room, survey_gate]
continuity:
  - "Kang Seoa (15): her outfit as each panel says; glasses, the calculator keychain. Never any fan service. The camera stays at her eye level or above, never below."
  - "Jaeha: a small plaster on his right cheekbone, no other bandages. Fringe over the LEFT eye, pencil behind the RIGHT ear, notebook in the LEFT chest pocket, phone in the right chest pocket. At home in the morning (P01–P16) he wears the grey hoodie and work trousers without the vest; the washed vest hangs on the laundry line, its torn hem corner showing. He wears the vest from P18 to P33, when he takes it off to leave on the grain; from P42 it has a long sword slash through the white T patch on the back; he carries it over his arm in P56 and wears it again from P57."
  - "Nib: seal 2/5 look (nib/turnaround_seal2.png), rest form all chapter (dull eyes, no glow). At home with no mask (nib/front_seal2_nomask.png) in P01–P02 and P67–P72; the cracked husk mask over his upper LEFT face from P03 to P66. In front of Choi, the officer, the saboteurs and Bomi he plays a husk: stiff, silent, arms hanging (he fails). Inside the gate with only Jaeha and Yerin he walks and talks normally."
  - "Choi Dongmin: his rescue jacket (navy with hi-vis yellow-green panels), stubble, eye bags, a paper coffee cup; off duty but in uniform."
  - "The survey officer (generic, no name card): a man in his fifties in a grey Hunter Association windbreaker, reading glasses on a cord, a clipboard, a bored face."
  - "The saboteurs (generic, no name cards), both in the black Black Hound jacket with the small red hound's head: the shield-bearer from ch 1 (bh_shield: burly, shaved head, a short broad sword at his hip, no shield today) and a wiry man in his thirties with a goatee and a utility belt hung with wire spools, pliers and a hand crossbow (bh_trapper). The trapper smokes menthols."
  - "The survey gate inside (location survey_gate): a ruined Far Side granary of round stone silos linked by narrow stair passages, spilled grain, amber dusk light through slits. The trap chamber (P28–P56): a round hall 12 m across and 10 m high with two square chute mouths in the ceiling (chute A over the rigged pressure plate, chute B over the far side of the floor) and a narrow stair passage running round the wall 5 m up, where chute B's big wooden lever stands. A third, cracked chute hatch sits in the ceiling above the middle of the floor."
  - "The Kanghan watcher (P66): a man in a black suit and tie with an earpiece and the silver hexagon lapel pin, in a parked black sedan."
plants:
  - "PLANT P25: the LINK readout shows distance and limit, 40 m of 160 m at LINK Lv. 2 (ch 8 pushes it to the limit)."
  - "PLANT P54: the shield-bearer's recorded words, 'The boss said you recorded him' (Mok suspects the ch 5 recording; Arc 3)."
  - "PLANT P66: Kanghan is watching the survivors (ch 12 file)."
  - "PLANT P71–P72: 'That's what Dad said, the night of the Opening.' (Part Two)."
hook_type: personal

panels:

