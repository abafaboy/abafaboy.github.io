      Jaeha's washed orange vest hangs with its torn hem corner, the Mapo skyline and the Han River bridges hazy beyond the
      parapet. Nib (nib, seal 2/5 look, NO mask: nib/front_seal2_nomask.png) sits on a plastic chair at a folding table,
      eating cereal from a big bowl, bare feet dangling. Jaeha (kang_jaeha, grey hoodie, no vest) brushes his teeth at the
      rooftop sink by the door. Scale: the parapet is waist-high to Jaeha (1 m); the water tank is 2 m tall; Nib's head
      reaches Jaeha's belt.
    acting:
      nib: "perched on the plastic chair, bowl held up to his chin in his left hand, spoon in his right, chewing, eyes half-lidded"
      kang_jaeha: "at the sink, toothbrush in his mouth, one hand on the tap, hair a mess, looking at the sky"
    calm: top
    lines:
