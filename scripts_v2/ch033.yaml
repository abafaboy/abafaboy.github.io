chapter: 33
title: Garbage
format: SCRIPT_FORMAT_v2.md
when: "Friday 7 PM: the rooftop dinner; Saturday: the hospital; Saturday night: the road south; Sunday at dawn: a tteokbokki stall at Busan's harbour, and the sea beyond it."
story_beats: ARC3_4_BEATS.md#33-garbage-arc-4-finale
cast:
  kang_jaeha: hoodie         # from P15 a hospital gown under the hoodie; a wheelchair P22-P31
  nib: mask                  # no mask at home and in the hospital room
  borro: default
  lyra: default
  song_yerin: default
  yoo_bomi: default
  choi_dongmin: default
  kang_seoa: default         # 15: never any fan service
  landlady: default
  gomi: default
  moon_ahin: default         # P05-P13
  ahin_husks: default        # Saebyeok (No. 1) only
  crew_pyo: default
  crew_dami: default
  dami_daughter: default     # generic: Dami's daughter, about 6, the yellow raincoat from her lock screen
  crew_woo: default
  crew_ho: default
  hospital_doctor: default   # generic
  geum_okran: default        # new main cast, name card P31, see continuity
locations: [rooftop_room, hospital, expressway_night, geum_stall, busan_sea_gate]
continuity:
  - "Kang Seoa (15): her outfit as each panel says; glasses, the calculator keychain. Never any fan service. The camera stays at her eye level or above, never below."
  - "Jaeha: the clean grey hoodie; his hands shake in every panel where they are visible (a faint tremor line on the fingers); from P15 a hospital gown under the hoodie, an IV line taped to the back of his LEFT hand until P21; no gloves from P15 to the end of the chapter (the hospital, the van and Busan, bare hands with the tremor showing on his fingers; the training look from ch 34 is bare-handed too); a wheelchair from P22."
  - "The rooftop dinner (P01-P13, location rooftop_room): two fold-out tables pushed together under the strings of warm bulbs; a portable grill with samgyeopsal, bowls of banchan, kimchi, a pan of tteokbokki, a heap of Borro's lettuce, boxes of fried chicken; plastic stools and chairs; the Mapo skyline at night."
  - "Dami's daughter (generic, about 6): the too-big yellow raincoat from her mother's lock screen, a grin with a missing front tooth. A child: drawn simply and cutely, never any fan service. Moon Ahin: her fresh white coat-dress, hair loose, no ribbon; as in ch 32, only her RIGHT white glove is on (the LEFT one tucked into her belt) and a small bandage covers the back of her bare LEFT hand; Saebyeok (No. 1) carries a huge cellophane-wrapped luxury fruit basket behind her. A glamour beat at the table (P07): elegant on a plastic stool, Lyra beside her."
  - "The hospital (new location hospital): a four-bed ward in a Mapo hospital at night, curtains, a monitor beeping, a window over the city; then the same ward in grey morning light."
  - "The road (new location expressway_night): Choi's white Gate Rescue van on an expressway south at night, the dashboard glow, Jaeha asleep in the passenger seat, the summons squeezed in the back with Borro folded double."
  - "Auntie Geum Okran (new main cast, CHARACTER_DESIGNS_v2.md 2.9; full sheet to come): 62, short and broad, about 155 cm, with a wrestler's shoulders and forearms; short permed grey hair under a faded floral headscarf; a deep-lined, sun-browned face, sharp black eyes that see everything, one gold tooth; a red-and-white checked apron over a faded purple tracksuit; rubber slippers. Her LEFT arm from just above the elbow is an old heavy prosthetic: battered gunmetal steel plates and rivets, a faded painted wave pattern on the forearm, three thick fingers and a thumb. In her RIGHT hand, always, a big long-handled steel ladle. She talks loudly and pokes people with the ladle. Name card background: gradient, harbour blue #2C4A63 to rust #A8572E."
  - "Geum's stall (new location geum_stall): a 24-hour pojangmacha tent stall on the edge of a harbour market in Busan: an orange tarp tent lit by bare bulbs, a long counter with plastic stools, a huge flat pan of bubbling red tteokbokki, fish-cake skewers in broth, steam; behind it, fishing boats, a breakwater, seagulls, the open sea going grey-pink at dawn."
  - "The sea gate (new location busan_sea_gate, P62-P65): far out under the sea off Busan, on the dark seabed: a vast ring of glowing white-cyan light lying flat on the sea floor, 300 m across, sealed over by a lid of ancient carved stone slabs hauled from the gate's own ruins, with ten-year-old steel plates bolted over them; one seal cracking, violet light and bubbles leaking up from the crack. Something enormous and dark moves under the lid. No legible text."
plants:
  - "PLANT P16-P18: CARRY CAPACITY is a number, so it can be trained (Arc 5)."
  - "PLANT P38-P40: Geum saw a man carry like that ten years ago, the night the gates opened: Operator #1 (Part One)."
  - "PLANT P51-P56: [NEW QUEST: THE WALL OF BUSAN] (Arc 5, STORE / RELEASE I in ch 40)."
  - "PLANT P62-P65: the Busan sea gate's seal begins to fail (Arc 5: 72 hours, ch 36)."
hook_type: power

