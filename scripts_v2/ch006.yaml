chapter: 6
title: Trap Rats
format: SCRIPT_FORMAT_v2.md
when: "The next Monday: an E-grade gate in a Mapo storm drain in the afternoon, the drain outside at dusk, and Bomi's room above her parents' restaurant that night."
story_beats: STORY_BIBLE_v4.md#arc-2-chapters-612-the-trap-rats-chapter-by-chapter
cast:
  kang_jaeha: vest          # healing: a plaster on his right cheekbone, no other bandages
  nib: mask                 # seal 2/5 look; walks as a "husk" in public; field form only P26–P36
  song_yerin: default
  yoo_bomi: default
  ash_rat: default
  client_leader: default    # generic: E-rank hunter in his forties, see continuity
  client_spear: default     # generic: E-rank hunter in his twenties, see continuity
  landlady: default         # generic: the rooftop room's landlady, see continuity
locations: [sewer_gate, rooftop_room, bomi_room]
continuity:
  - "Jaeha: the orange vest (washed, the hem corner still torn), a plaster on his right cheekbone, no other bandages. Fringe over the LEFT eye, pencil behind the RIGHT ear, notebook in the LEFT chest pocket."
  - "Nib: seal 2/5 look (nib/turnaround_seal2.png) with the cracked husk mask over his upper LEFT face. In public he plays a husk: walking stiffly in front, arms hanging, perfectly silent (he fails). Rest form (dull eyes, no glow) except P26–P36, when he is in field form and LINKED (amber eyes, thin amber outline)."
  - "Bomi: her full design (CHARACTER_DESIGNS_v2.md 2.7), the white camera drone with its red light always near her while she streams. She cannot hit anything with her bow (running joke). Never a low angle up her shorts: the camera stays at chest height or above."
  - "The client guild (generic, no name cards): two E-rank hunters in mismatched cheap gear. The leader is a balding man in his forties with a paunch, a dented breastplate over a tracksuit and a cheap sword he holds wrong (his thumb wrapped over the top of the grip). The other is a skinny man in his twenties in a hoodie and a plastic-looking chest guard with a spear."
  - "Ash rats (CHARACTER_DESIGNS_v2.md 4b.1): about 70 cm long, hairless blotched grey hide, eyes leaking violet ash, yellow chisel teeth. The swarm mother (P38–P40) is the same creature at 1.4 m long with a ridge of bony spurs along its back."
  - "The landlady (generic, no name card): a stout woman in her late sixties, about 150 cm, permed grey hair, a padded vest over a flowered blouse, slippers, arms always folded."
  - "The sewer gate inside (location sewer_gate): Far Side brick vaults, ankle-deep dark water, side tunnels, white-blue caged lamps. Everyone's boots splash; Nib is barefoot in the water."
plants:
  - "PLANT P58–P60: Bomi's frozen frame (ch 7 deal)."
  - "PLANT P48: 'the Trap Rats' becomes the team's name (ch 12 chant)."
hook_type: mystery

panels:

  # ================= COLD OPEN (P01–P07) =================
  - id: P01
    recipe: establish
    shape: full
    gap: none
    bg: black
    camera: "eye level (1.6 m) down a long brick-vaulted tunnel: a small cloaked figure walking first through the water, a party behind"
    light: "key: white-blue caged lamps every 20 m; their reflections on the black water"
    art: >
      Inside an E-grade gate (location sewer_gate): a long Far Side brick-vaulted tunnel, ankle-deep black water, side
      tunnels branching off, moss and pale roots in the joints, white-blue caged lamps along the wall. A small masked figure
      in a hooded cloak (nib, mask; seal 2/5 look) walks first, stiffly, like a husk. Behind him: Jaeha (kang_jaeha, vest)
      with his notebook, Yerin (song_yerin), Bomi (yoo_bomi) with her white drone hovering, and two shabby hunters
      (client_leader, client_spear). Scale: the vault is 4 m high; people are 1.6–1.8 m; Nib reaches Jaeha's belt.
    acting:
      nib: "walking stiffly first, arms hanging, bare feet in the water, eyes straight ahead"
      kang_jaeha: "ten steps behind, notebook open, scanning the walls"
      song_yerin: "walking close behind Jaeha, hands on her bag strap"
      yoo_bomi: "walking backwards in front of her drone, talking to it"
      client_leader: "at the back, sword out, holding it wrong"
      client_spear: "at the back, spear clutched in both hands"
    calm: top
    lines:
      - {who: offpanel:crowd, type: tag, text: "E-GRADE GATE 1107. A STORM DRAIN IN MAPO. MONDAY."}
    sfx:
      - {text: "SPLSH SPLSH", style: quiet, at: [0.70, 0.86], size: S, rot: 0}

