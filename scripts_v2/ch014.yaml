chapter: 14
title: The Compass
format: SCRIPT_FORMAT_v2.md
when: "Wednesday night just after midnight: the outdoor table of a convenience store in Mangwon. Thursday: the rooftop in the morning and afternoon. Thursday night: the rooftop. A flashback to the Han River gate four years ago."
story_beats: ARC3_4_BEATS.md#14-the-compass
cast:
  kang_jaeha: vest          # hoodie only (see continuity)
  nib: mask                 # rest form except two one-second flashes (P17, P19)
  borro: default
  han_sora: default         # the Black Hound crossbow woman (bh_crossbow in ch 1–13); name card P05
  kang_seoa: default
  song_yerin: default
  yoo_bomi: default
  choi_dongmin: default
  oh_minseok: default       # flashback only (P39–P44)
  store_clerk: default      # generic
locations: [conv_store, rooftop_room, hanriver_gate_flashback]
continuity:
  - "Jaeha: the grey hoodie all chapter (no vest), hood down, plasters on both palms, the forearm bandage. Fringe over the LEFT eye, pencil behind the RIGHT ear, the notebook in the hoodie's front pocket."
  - "Nib: seal 2/5 look; the cracked husk mask at the convenience store; no mask at home. Rest form except two one-second flashes of field form under the table (P17, P19: amber eye, thin amber outline, gone at once)."
  - "Han Sora (han_sora; CHARACTER_DESIGNS_v2.md 2.5 hunter 5, the full sheet characters_v2/han_sora/): 27, about 168 cm, athletic and curvy; a sleek black chin-length bob, winged eyeliner, red lips; the black Black Hound jacket cropped at the waist and worn open over a fitted black tank top with a low scoop neckline; fitted black tactical trousers with a thigh holster; black boots; the compact crossbow slung across her back. The brass compass hangs from a short chain on her wrist like a charm. Flirtatious, amused, dangerous; never Jaeha's love interest. Fan service per CHARACTER_DESIGNS_v2.md: a beautiful face and a confident pose, nothing explicit, no camera aimed at her chest."
  - "The compass: brass, the size of a coin-purse, a glass face, and a needle that is a sliver of smoky violet core crystal, glowing faintly. It swings toward a summon in field form; with no summon awake it points vaguely toward Jaeha."
  - "Oh Minseok (flashback): Jaeha's mentor, in his late thirties, the same orange trap-tester vest as Jaeha's (older, more patched), a kind, crooked grin, short hair going grey, a scar through one eyebrow. Young Jaeha (20) in the flashback: the same look with a shorter fringe, no gloves, a brand-new vest. Young Choi (30): the rescue jacket, no eye bags yet."
  - "The convenience store at night (new key): a bright little store on a Mangwon corner, the outdoor plastic tables and chairs under an awning, a drinks fridge glowing through the glass, the empty street, one streetlamp."
  - "The flashback is drawn in greys, with ONE colour: the orange of the two vests."
plants:
  - "PLANT P19–P22: the compass tracks summons in field form, not Jaeha (ch 31)."
  - "PLANT P33–P36: the incident report: 'accident', signed by Mok; the rescue responder was Choi (Arc 3)."
  - "PLANT P41: 'Everyone comes back, kid.' (Minseok's rule)."
hook_type: personal

