      cups of instant ramen and his notebook; across from him Nib (nib, mask; rest form) eats a triangle kimbap without taking
      off the mask. Scale: the awning is 2.5 m high; the plastic chairs reach Jaeha's hip.
    acting:
      kang_jaeha: "hunched over the notebook, pencil moving, a ramen cup steaming at his elbow"
