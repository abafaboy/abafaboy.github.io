chapter: 15
title: Pass
format: SCRIPT_FORMAT_v2.md
when: "Friday, the day before the raid: a D-grade gate in a closed water-treatment plant in Mapo, from 10 AM to noon; the plant's gate at noon."
story_beats: ARC3_4_BEATS.md#15-pass
cast:
  kang_jaeha: vest
  nib: mask                 # field form from P03; the mask stays on inside the gate out of habit
  borro: default            # no husk face inside the gate (only friends); field form from P03 (cooldown pause P27–P29)
  song_yerin: default
  choi_dongmin: default
  yoo_bomi: default
  basalt_boar: default
locations: [aqueduct_gate]
continuity:
  - "Jaeha: the orange vest with Seoa's red stitches on the back patch, the grey hoodie, plasters on both palms (healing), the forearm bandage. Fringe over the LEFT eye, pencil behind the RIGHT ear, notebook in the LEFT chest pocket."
  - "Nib: seal 2/5 look, the cracked husk mask; field form (amber eyes, thin amber outline) from P03 to P50, with the cooldown pause P27–P29 (rest form) and field form again from P30."
  - "Borro: no husk face inside the gate; field form (moss-green eyes, thin moss-green outline) from P03 to P50, with the same cooldown pause as Nib (P27–P29, rest form); the iron shield; the slate shell with moss and flowers."
  - "Yoo Bomi: her full design and the new drone with the pink ribbon; the drone stays OFF for this job (Jaeha's rule): it sits in her hands."
  - "The basalt boar (new design, see ARC3_4_BEATS.md): a hushed boar the size of a truck, 2.5 m at the shoulder and 5 m long, its hide plated with slabs of black basalt with rough edges like broken paving, coarse dark bristles between the slabs, two curved tusks of glassy black obsidian, small red-brown eyes, and a small violet Hush crack on its brow. It charges in straight lines and lowers its head three strides before impact: that is its tell. Scale: its shoulder is a head higher than Borro's head."
  - "The aqueduct gate (new location aqueduct_gate): outside, a closed water-treatment plant with round settling tanks and a fence; the gate slit in an empty tank. Inside, a ruined Far Side aqueduct: a long stone water channel on top of a row of tall arches crossing a deep gorge, the channel's floor 6 m wide with knee-high walls, shallow water running along it; broken arches far below; a pale yellow sky. The channel is the only path: one way in, one way out."
plants:
  - "PLANT P41: [PASS I · EACH HAND-OFF LOSES 30%] (Borrowed Thunder, ch 19)."
  - "PLANT P53: HARVEST only, a fourth time (ch 50)."
  - "PLANT P58–P60: the CALL is held in reserve (ch 18)."
hook_type: power

panels:

  # ================= THE CHARGE (P01–P12) =================
  - id: P01
    recipe: monster-reveal
    shape: full
    gap: none
    bg: white
    camera: "low, along the aqueduct's stone channel, tilted 10 degrees: a basalt-plated boar the size of a truck charging straight at the camera through shallow water"
    light: "key: a flat pale yellow sky; spray flying white"
    art: >
      Inside a D-grade gate (location aqueduct_gate): along the top of a ruined Far Side aqueduct, a stone water channel 6 m
      wide with knee-high walls, a deep gorge on both sides. A boar the size of a truck (basalt_boar) charges straight down the
      channel toward us through the shallow water, black basalt slabs plating its hide, glassy black obsidian tusks, a violet
      Hush crack on its brow, water exploding from its hooves. Scale: its shoulder is a head higher than Borro's head; the
      channel walls reach a man's knee.
    acting:
      basalt_boar: "mid-charge, head lowered, tusks forward, legs pounding"
    calm: top
    sfx:
      - {text: "DUDUDUDUDUM", style: impact, at: [0.30, 0.70], size: XL, rot: -6}

