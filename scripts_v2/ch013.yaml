chapter: 13
title: The Hearing
format: SCRIPT_FORMAT_v2.md
when: "The next Wednesday: the Hunter Association's headquarters in Mapo, its lobby at 9 AM, a hearing room at 10 AM and the test arena in its basement at noon."
story_beats: ARC3_4_BEATS.md#13-the-hearing
cast:
  kang_jaeha: vest          # a clean vest, a borrowed white shirt collar showing under the hoodie (see continuity)
  nib: mask                 # rest form all chapter
  borro: default            # husk face all chapter; rest form
  song_yerin: default
  choi_dongmin: default
  yoo_bomi: default
  mok_hangyu: default       # a navy suit, no guild jacket (see continuity)
  bh_crossbow: default      # the Black Hound crossbow woman (Han Sora; name card in ch 14)
  inspector_ryu: default    # generic: chairs the hearing panel, see continuity
  bh_lawyer: default        # generic: Black Hound's lawyer, see continuity
  assoc_guard: default      # generic: the lobby guard, see continuity
  training_construct: default
locations: [assoc_lobby, assoc_hearing_room, assoc_arena]
continuity:
  - "Jaeha: the orange vest (Seoa's red stitches on the back patch) over the grey hoodie, with the collar of a borrowed white shirt showing at the neck because Seoa insisted; plasters on both palms; the bite bandage on his LEFT forearm. Fringe over the LEFT eye, pencil behind the RIGHT ear, notebook in the LEFT chest pocket."
  - "Nib: seal 2/5 look with the cracked husk mask; rest form all chapter (no glow). In public he plays a husk, badly. Borro: the white oval husk face tied on with cord; rest form all chapter; he must duck under every doorway (2.4 m)."
  - "Mok Hangyu: a navy suit and tie with the small red hound's-head pin, his gold chain showing at the open collar; no shield. A thin smile for the press; dead eyes."
  - "The Black Hound crossbow woman (bh_crossbow, CHARACTER_DESIGNS_v2.md 2.5 hunter 5): the cropped guild jacket open over the low-necked black tank top, fitted black trousers with the thigh holster, the sleek black bob, winged eyeliner, red lips; in the gallery a small brass compass in her lap. Fan service per CHARACTER_DESIGNS_v2.md: a beautiful face, a confident pose, nothing explicit."
  - "Inspector Ryu (generic, no name card): a tired, fair man in his fifties in a grey Hunter Association uniform jacket, reading glasses, a grey moustache. Two evaluators flank him in the same uniform (a woman in her forties, a young man)."
  - "Black Hound's lawyer (generic): a sleek man in his forties in an expensive grey suit, a silver tie, slicked hair, a tablet."
  - "The lobby guard (generic): a young Association guard in a grey uniform with a handheld scanner wand."
  - "The training construct (new design, see ARC3_4_BEATS.md): a 4 m stone figure of grey granite blocks bound with brass bands, a blank rounded head, arms like pillars; a fist-sized amber test core glowing behind a brass grille in the middle of its chest; slow, heavy, it moves on rails of light in the floor. Scale: Jaeha reaches its hip."
  - "Places (new keys, see ARC3_4_BEATS.md): the Association lobby (a tall glass atrium, a grey-and-white floor with the Association's star-and-shield emblem inlaid (no letters), big screens on the walls, a security arch); the hearing room (a wood-panelled room, a raised panel desk, two tables facing it, a public gallery behind a rail); the test arena (a round basement arena 30 m across with padded grey walls, an observation window high on one side, a big screen)."
plants:
  - "PLANT P27: Jaeha keeps Mok's bribe recording (ch 5) back: 'A bribe gets him a fine. I want the door.' (ch 21)"
  - "PLANT P64–P66: the crossbow woman's compass points at Jaeha (ch 14)."
hook_type: threat

panels:

  # ================= THE LOBBY (P01–P10) =================
