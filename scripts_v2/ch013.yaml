    gap: none
    bg: white
    camera: "high (10 m) in a tall glass atrium: every wall screen showing the same clip of a giant holding up a bridge, people below looking up"
    light: "key: morning daylight through the glass roof; the screens' glow"
    art: >
      The Hunter Association's lobby (location assoc_lobby): a tall glass atrium, a grey-and-white floor with the
      Association's star-and-shield emblem inlaid (no letters), and big wall screens, every one playing the same clip: a
      masked giant holding up a falling footbridge. Hunters in gear, office workers and reporters stand below, looking up at
      the screens. Scale: the atrium is five storeys high; the people are small.
    calm: top
    lines:
      - {who: offpanel:crowd, type: tag, text: "HUNTER ASSOCIATION HEADQUARTERS, MAPO. WEDNESDAY, 9 AM."}
      - {who: offpanel:crowd, type: announce, text: "...TWENTY MILLION VIEWS FOR THE CLIP NOW CALLED 'HIS SUMMONS GO FIRST'..."}
    sfx:
      - {text: "MURMUR MURMUR", style: quiet, at: [0.70, 0.86], size: S, rot: 0}

