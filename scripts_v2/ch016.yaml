chapter: 16
title: The Hero Raid
format: SCRIPT_FORMAT_v2.md
when: "Saturday, 9 AM to noon: a B-grade gate at the foot of an old dam spillway outside Seoul, and the drowned Far Side cathedral inside it."
story_beats: ARC3_4_BEATS.md#16-the-hero-raid
cast:
  kang_jaeha: vest
  nib: mask                 # rest form except nothing (no field form this chapter)
  borro: default            # husk face; rest form until P35, field form P35–P42
  song_yerin: default
  yoo_bomi: default
  choi_dongmin: default
  mok_hangyu: default       # the guild jacket and the tower shield for the raid
  han_sora: default
  bh_raid: default          # generic Black Hound raid squad, see continuity
  bh_sealers: default       # generic Black Hound sealing team, see continuity
locations: [dam_gate, drowned_cathedral]
continuity:
  - "Jaeha: the orange vest with Seoa's red stitches, the grey hoodie, the plasters on his palms almost gone, the forearm bandage; a box of white chalk in his vest's hip pocket. Fringe over the LEFT eye, pencil behind the RIGHT ear, notebook in the LEFT chest pocket. The tiny cyan [CALL · HELD] mark appears at the edge of his point-of-view panels (P13)."
  - "Nib: seal 2/5 look, the cracked husk mask; rest form all chapter (Sora's compass is near). He plays a husk in public, badly."
  - "Borro: the white oval husk face tied on; the iron shield, its dent hammered almost flat; rest form except P35–P42 (field form, moss green). Bomi's new white drone with the pink ribbon is tucked into the moss on his shell from P61, its camera peeking out between the flowers."
  - "Mok Hangyu: his raid look: the black guild jacket with the red hound's head, the gold chain, the black tower shield with the red hound, the short broad sword; a big camera smile, dead eyes."
  - "Han Sora: her full design (the cropped jacket over the low-necked tank top, fitted trousers, thigh holster, the crossbow); the brass compass on its chain at her wrist."
  - "The Black Hound raid squad (generic, no name cards): eight hunters in clean new black guild jackets with the red hound's head, mixed weapons (two swords, a spear, an axe, a mage with a core-tipped staff, two archers, a second shield-bearer). The sealing team (generic): three more hunters in the same jackets who carry a black steel stake 1 m long with a silver double-hexagon emblem (no letters) on its head and a backpack of cables: Kanghan sealing equipment."
  - "The dam gate (new location dam_gate): an old concrete dam spillway in the hills outside Seoul, a huge sloping chute of stained concrete 40 m wide; at its foot a door-height B-grade gate slit glowing white-cyan; press tents, cameras on tripods, a Black Hound van, Association tape."
  - "The drowned cathedral (new location drowned_cathedral): a vast Far Side cathedral half under water: a Gothic nave 60 m long and 30 m high with rows of pillars, the water knee-deep in the aisles and chest-deep in the side chapels, floating pews, broken windows of pale coloured glass (abstract patterns, no figures), and great bronze bells hanging silent on chains from the vault everywhere. Side passages branch off at junctions; one side passage leads down into a flooded crypt. At the far end, the boss chamber's tall bronze double doors under a rose window, with a bell above them."
plants:
  - "PLANT P21–P24: the chalk code, and one arrow that points the wrong way at the crypt junction (ch 17)."
  - "PLANT P13: the held CALL (ch 18)."
  - "PLANT P54–P57: Nib finds something behind the altar wall (ch 17: the second exit)."
  - "PLANT P61: Bomi's drone hides in Borro's moss (ch 21: the stream)."
hook_type: threat

