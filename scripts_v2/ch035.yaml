chapter: 35
title: The Wall
format: SCRIPT_FORMAT_v2.md
when: "Tuesday, 11:41 PM, on the breakwater, and Geum's memory of the night of the Opening ten years ago; Wednesday morning, a new gate in the fish market's cold store; Wednesday night, the end of the breakwater."
story_beats: ARC5_BEATS.md#35-the-wall-hook-arrival
cast:
  kang_jaeha: training       # Geum's spare tracksuit all chapter (he stays in it through the break, ch 39-40)
  nib: mask                  # seal 3/5 armour; rest form, field form in the gate (P34-P49)
  borro: default             # husk face in public; field form in the gate (P34-P49)
  lyra: default              # field form in the gate (P34-P49)
  geum_okran: default        # in the flashback (P11-P22): her look ten years ago, see continuity
  fishermen: default         # P03 the old fisherman; in the flashback, Geum's harbour crew
  brine_crawler: default
  operator_1: flashback      # the man ten years ago: always a shadow, never a face (2.20)
  light_fighters: default    # his fighters made of light (2.20)
  market_aunties: default
  reef_hermit: default       # the cold-store gate's boss (CHARACTER_DESIGNS_v2.md 4d.2)
  pim: default               # the hook only: in the Call (2.19), no headset yet
locations: [busan_breakwater, busan_breakwater_flashback, busan_fish_market, cold_store_gate, call_void, pim_tower]
continuity:
  - "Jaeha: Geum's spare purple tracksuit, too short at the wrists and ankles, his own trainers (look `training`; no vest or hoodie in this chapter). His LEFT forearm: bleeding from the crawler's claw P01-P07, wrapped in his towel from P08 (the towel gone from his neck); from P27 a clean white bandage on it and a fresh towel round his neck. Notebook in the LEFT chest pocket of the tracksuit top, pencil behind the RIGHT ear, fringe over the LEFT eye."
  - "Nib: seal 3/5 armour, the cracked husk mask in public (none in the gate). Rest form until P34; field form in the gate P34-P49 (amber eyes, thin amber outline); a cut across his RIGHT upper arm from P39; Jaeha ties a strip of towel round it in P54."
  - "Borro: husk face in public (none in the gate); field form P34-P49 (moss-green glow). Lyra: no mask; field form P34-P49 (river-blue glow). Rest form for everyone from P50."
  - "Geum now: the checked apron over the purple tracksuit, headscarf, pink slippers, steel LEFT arm, the ladle in her RIGHT hand. When she strikes with the ladle it rings like a bell, and a faint ring of force ripples off it (it is held force let go: the lesson of ch 38)."
  - "THE FLASHBACK (P09-P22, location busan_breakwater_flashback) is drawn in greys only, with violet for the sea and the gate light and amber for the fighters made of light; nothing else in colour."
  - "Geum ten years ago (geum_okran, flashback; 2.20): 52, the same short broad build, short permed hair still black, the gold tooth; BOTH arms her own; a fishmonger's rubber apron and boots over a work shirt with the sleeves rolled up. She woke up with her power that night. For a shield: a steel watertight door torn off a fishing boat, gripped by its handles on her LEFT arm."
  - "Geum's crew ten years ago (fishermen, flashback): fishermen and dock workers who woke up with power that night, in waterproofs and boots, with boat hooks, gaff poles and harpoons. No uniforms and no guild gear: there was no Association yet."
  - "The man ten years ago (operator_1, flashback; 2.20): a slim young man in a long dark coat, his face ALWAYS hidden: in shadow, turned away, or cut off by the frame. Never draw his face. When he carries, thin amber threads run from the sea into his chest and he bleeds from the nose and hands."
  - "His fighters made of light (light_fighters, 2.20): five tall human-shaped figures of soft amber light, featureless, walking ahead of him; and out in the water beside the breakwater one vast long shape of amber light, swimming, with a lantern of light at the tip of a curved crest on its head (she is the Deep Lantern, ch 39-40)."
  - "The cold-store gate (new location cold_store_gate): behind the fish market's cold-store door, between racks of frozen fish, a door-height violet slit; inside, a flooded Far Side shrine 25 m across, grey stone pillars, sea-green water knee-deep, coral on the walls, shafts of blue-green light from cracks above, a raised dais."
  - "The Reef Hermit (reef_hermit, 4d.2): a hermit crab 4 m tall on its legs, wearing a sunken grey stone shrine for a shell; the shrine is old and too tight, cracked through the dome, and bits crumble off it when it moves; a bronze bell inside it clangs as it moves; two huge claws, the RIGHT bigger; dull violet eyes on stalks; a violet Hush crack across the carapace; a soft pale pink-grey curled abdomen hidden inside the shrine. Scale: Jaeha reaches the bottom of its shell."
  - "Pim (2.19), at the hook only: an inch from Jaeha's face at the mouth of his rift inside the Call, enormous glossy black eyes, feathery antennae; no headset yet."
plants:
  - "PLANT P05-P06: Geum's strike is 'a held one', not a hard one (STORE, ch 38)."
  - "PLANT P13-P19: the man ten years ago carried for his fighters, then stopped; the biggest of his fighters carried a lantern of light (the Deep Lantern, ch 39-40; Operator #1, Part Two)."
  - "PLANT P20-P22: the thing under the lid has the same lantern, burning violet; Geum lost her arm holding it; the lid is ten years old (ch 38-40)."
  - "PLANT P53: HARVEST only, again (ch 50)."
hook_type: arrival

