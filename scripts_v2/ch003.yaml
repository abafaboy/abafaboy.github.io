chapter: 3
title: The Ninth Wall
format: SCRIPT_FORMAT_v2.md
when: "Nib's memory of the Ninth Wall on the Far Side (a grey flashback), then the same Thursday night inside the boss room of Gate 0912, picking up at the last forty seconds of Nib's field form."
story_beats: STORY_BIBLE_v4.md#chapter-3-the-ninth-wall-about-65-panels
cast:
  kang_jaeha: vest
  song_yerin: default
  nib: mask                 # present day: the cracked husk mask; from P56 his seal 2/5 look (Ninth Wall colours)
  knight_commander: default # present day: hushed (face-hole). In the flashback: unhushed, visor closed (see continuity)
  kett: default
locations: [ninth_wall, boss_room]
continuity:
  - "FLASHBACK P01–P09: drawn in greys (desaturated blue-grey and stone), with ONE warm colour: Kett's mustard scarf. Nib's red scarf is grey here too. Hush-spawn are black shapes leaking violet ash, the only other tint."
  - "In the flashback Nib has no husk mask (that comes later) and wears his cloak in the Ninth Wall's colours (wall-blue lining, bronze trim, the nine-tower sigil on the clasp), all in grey tones. Kett: about 95 cm, mustard scarf, oversized hand-me-down cloak, one short knife."
  - "In the flashback the commander is the knight before he was hushed: the same dark iron and bronze armour, intact, the nine-tower sigil on the chest, a whole wall-blue cloak, and a CLOSED great helm with a narrow visor slit and NO face-hole. His face is never shown (it is revealed in ch 4)."
  - "Present day: Nib's field form runs out at P14. P15–P46 he is in rest form: the same look with dull eyes, no amber glow and no LINK outline. From P48 he is back in field form and LINKED (thin amber outline, glowing amber eyes). From P51 he has his seal 2/5 look: the cloak lining turns wall-blue, the trim bronze, and the clasp shows the nine-tower sigil. He keeps the husk mask over the upper LEFT of his face throughout."
  - "Jaeha: dried blood on his lip and chin from chapter 2. The notebook is in his hands from P18 until he closes it at P25 and puts it in his LEFT chest pocket; after that the pocket shows it."
  - "The boss room floor has square pressure plates with engraved borders. The trap: a cluster of plates in front of a side archway (picture-right of the knight in P20–P31). The archway has a rusted iron portcullis hanging up in its groove; the two pillars that flank it have rows of spike holes. The knight is 4.5 m tall; the archway is about 7 m high, so the portcullis can pin him."
plants:
  - "PLANT P05: a great bell rings the retreat from a distant fortress (ch 9 refusal; ch 68 Caldric)."
  - "PLANT P04: Nib sends Kett back with a message (ch 40 call sign; ch 88)."
  - "PLANT P16: 'Everyone comes back' (Oh Minseok's rule, ch 21)."
  - "PLANT P63: 'before the Hush takes you too' (Arc 6: bosses are hushed heroes)."
hook_type: mystery

panels:

  # ================= FLASHBACK: THE NINTH WALL (P01–P09) =================
  - id: P01
    recipe: establish
    shape: full
    gap: none
    bg: black
    camera: "high and wide over a mountain pass from a camera hovering beyond the wall: the curtain wall across the pass, the siege below"
    light: "flat grey overcast; the only tints are violet ash and, far off, nothing warm at all"
    art: >
      Drawn in greys, a memory (location ninth_wall): a great curtain wall of pale limestone across a mountain pass, with
      nine round towers and tattered banners (wall-blue, here grey). Below it, filling the valley like a black tide,
      thousands of Hush-spawn: faceless black shapes leaking violet ash, climbing the rubble toward the wall. Smoke rises
      from two of the towers. Scale: the wall is about 25 m high and the towers rise above it; people on the wall-walk
      would be specks.
    calm: top
    lines:
      - {who: offpanel:crowd, type: tag, text: "THE FAR SIDE. THE NINTH WALL, BEFORE IT FELL."}
      - {who: nib, type: narr_dark, text: "I WAS THE LAST SCOUT OF THE NINTH WALL."}
    sfx:
      - {text: "RRRRRRR", style: quiet, at: [0.80, 0.86], size: S, rot: 0}

  - id: P02
    recipe: talk
    shape: wide
    gap: short
    bg: black
    camera: "eye level on the wall-walk, three-quarter: the armoured commander turning to the small scout beside the battlements"
    light: "flat grey daylight; smoke drifting behind"
    art: >
      Greys. On the wall-walk, the commander (knight_commander, before he was hushed: intact dark armour, the nine-tower
      sigil on his chest, a whole cloak, a CLOSED great helm with a narrow visor slit and no face-hole) turns to Nib
      (nib, no mask, cloak in the Ninth Wall's colours rendered in grey), who stands at attention by the battlements.
      Scale: the commander is 4.5 m tall; Nib (105 cm) reaches just above his knee. Behind them, a few soldiers file
      down a stair.
    acting:
      knight_commander: "half-turned toward Nib with one gauntlet resting on the battlement, the other pointing down the pass behind the wall; helm tilted down toward the small scout"
      nib: "standing at attention, heels together, chin up, one fist over his heart in a salute, eyes on the commander's helm"
    eyeline: "the commander → Nib (down); Nib → the commander (up)"
    foreground: "a cropped merlon of the battlement at the left edge"
    calm: top
    lines:
      - {who: knight_commander, type: speech, text: "HOLD THE GATE UNTIL THE ARMY IS THROUGH THE PASS. THEN WE COME BACK FOR YOU.", side: l}
      - {who: nib, type: speech, text: "YES, COMMANDER.", side: r}

  - id: P03
    recipe: talk
    shape: wide
    gap: short
    bg: black
    camera: "low two-shot on the wall stair: Nib crouching to the young scout's height, a message tube between them"
    light: "flat grey; the mustard scarf the one warm colour in the frame"
