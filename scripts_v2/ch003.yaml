      Greys, except for one warm colour: the mustard-yellow scarf of Kett (kett), a young goblin scout about 95 cm in an
      oversized hand-me-down cloak. Nib (nib, no mask) presses a sealed message tube into Kett's hands on the wall
      stair. Kett grips Nib's sleeve, pleading.
    acting:
      nib: "down on one knee to Kett's height, pressing the message tube into the boy's hands with both of his, face stern and calm"
      kett: "clutching the tube to his chest with one hand and Nib's cloak sleeve with the other, leaning toward him, eyebrows up, mouth wide open mid-plea"
    eyeline: "Nib ↔ Kett"
    foreground: "the cropped edge of a stone stair rail at the bottom right"
    calm: top
    lines:
      - {who: kett, type: speech, text: "COME WITH ME, NIB! YOU DON'T HAVE TO STAY HERE ALONE!", side: r}
      - {who: nib, type: speech, text: "GO FIRST, KETT. I'LL BE RIGHT BEHIND YOU.", side: l}

  - id: P04
    recipe: silent
    shape: tall
    gap: short
    bg: black
    camera: "high, looking down the long wall stair: the small figure running down and away, looking back"
    light: "flat grey; the mustard scarf the one warm colour"
