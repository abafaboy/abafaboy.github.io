chapter: 4
title: Harvest or Release
format: SCRIPT_FORMAT_v2.md
when: "The same Thursday night: the end of the fight in the boss room of Gate 0912, then the gate exit on the street in Mapo at about 11:30 PM."
story_beats: STORY_BIBLE_v4.md#chapter-4-harvest-or-release-about-70-panels
cast:
  kang_jaeha: vest
  song_yerin: default
  nib: mask                 # seal 2/5 look the whole chapter (characters_v2/nib/turnaround_seal2.png); rest form from P52
  knight_commander: default
  choi_dongmin: default
  mok_hangyu: default       # on the billboard only
locations: [boss_room, gate_exit]
continuity:
  - "Nib has his seal 2/5 look throughout (wall-blue cloak lining, bronze trim, the nine-tower sigil on the clasp; reference characters_v2/nib/turnaround_seal2.png) and keeps the cracked husk mask over the upper LEFT of his face. Field form and LINKED (thin amber outline, amber eyes) until P51; rest form (dull eyes, no outline) from P52."
  - "Jaeha: dried blood on lip and chin; fresh nosebleed from the CARRY at P05, stopped by Yerin at P07; dried blood again after. Notebook in his LEFT chest pocket."
  - "The knight's helm keeps its black-violet face-hole until the release (P31), where for ONE panel it holds a real face: an old soldier's, scarred and grey-bearded. Then ash."
  - "The Ninth Wall blade: 2.2 m, dark iron, bronze crossguard like a wall with nine towers, wall-blue grip cloth, bronze disc pommel with the sigil. Next to Jaeha it is longer than he is tall."
  - "At the gate exit Jaeha, Yerin and Nib wear gold foil rescue blankets. Choi Dongmin: navy rescue jacket with hi-vis yellow-green panels and silver reflective stripes, a paper coffee cup."
plants:
  - "PLANT P33: the stamped chain link; Jaeha pockets it (Arc 4: the same mark at the Kanghan farm, ch 26)."
  - "PLANT P44: OPERATOR AUTHORITY CANNOT BE TRANSFERRED (why Kanghan must recruit, test or trick him)."
  - "PLANT P38: NINTH WALL BLADE, STRENGTH 90 vs 7 (ch 97: he lifts it with stored force)."
hook_type: threat

