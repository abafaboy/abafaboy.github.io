    shape: wide
    gap: long
    bg: white
    camera: "high, from the ceiling corner of the small rooftop room: Jaeha asleep in a heap on the floor mattress, the fat cat asleep on his chest, Nib guarding him, Lyra bored in the window, Seoa at her desk"
    light: "late-morning sun through the window"
