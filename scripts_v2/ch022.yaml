chapter: 22
title: The Last Seconds
format: SCRIPT_FORMAT_v2.md
when: "Sunday: the morning news; the columbarium in the afternoon; the rooftop party at dusk; the Kanghan guild hall the same night; the rooftop room at 2:47 AM on Monday."
story_beats: ARC3_4_BEATS.md#22-the-last-seconds
cast:
  kang_jaeha: hoodie         # no vest (torn in ch 20-21); bandaged; limps with a walking stick
  nib: mask                  # seal 3/5 scout-captain armour; rest form; no mask at home
  borro: default             # husk face; rest form; his tarp garden
  lyra: default              # rest form; no mask
  song_yerin: default
  yoo_bomi: default
  choi_dongmin: default
  kang_seoa: default         # 15: never any fan service
  landlady: default
  gomi: default
  granny_kimchi: default     # the radish granny (ch 11), generic
  conv_clerk: default        # generic convenience-store clerk, see continuity
  inspector_ryu: default     # voice on the phone only (P07)
  kanghan_spokesman: default # generic, on the TV only (P03)
  mok_hangyu: default        # on the news (P01); young, in a grey memory (P24)
  oh_minseok: default        # his photo (P13); on the video (P53-P56)
  moon_ahin: default         # P47-P50
  police: default            # generic, on the news only
locations: [conv_store, rooftop_room, columbarium, hanriver_gate_flashback, kanghan_guild_hall, hanriver_gate]
continuity:
  - "Kang Seoa (15): her outfit as each panel says; glasses, the calculator keychain. Never any fan service. The camera stays at her eye level or above, never below."
  - "Jaeha: the grey hoodie and dark trousers, no vest (the old one was torn to pieces in the gate); Yerin's healing has closed the worst of it, but bandages still show on his LEFT upper arm and RIGHT forearm under the pushed-up sleeves, a plaster on his LEFT cheek, and he limps on his RIGHT leg with a plain wooden walking stick (P12-P27). A black cap at the columbarium. His notebook is in the hoodie's front pocket."
  - "Nib: seal 3/5 scout-captain armour (CHARACTER_DESIGNS_v2.md 2.2) over the cloak; the cracked husk mask in public (the columbarium); no mask at home (the rooftop). Borro: the white husk face; rest form; his tarp garden on the roof (ch 10) with real lettuce now. Lyra: her full design (2.10), rest form, no mask; the camera is never aimed up her skirt or down her top."
  - "Bomi: her design exactly (cropped neon-yellow bomber, black crop top, high-waisted denim shorts, black thigh-high socks); a confident adult glamour pose in P33, never a low angle. Yerin: her approved covered look, drawn cute. Seoa: her uniform shirt and tie with the blazer off and a cardigan at home; never any fan service."
  - "Moon Ahin (P47-P50): her full design (2.11): the white coat-dress with the plunging V and the slit up her LEFT side, white thigh-highs and boots, white gloves, the silver ribbon bow, the baton in her RIGHT hand. A glamour panel in P47; no name card yet (ch 24)."
  - "The news footage (P01-P03) is drawn as TV images; the letterer lays the channel's lower third over them (tv.lowerthird on: panel). In P04 the TV above the counter is flat green and the letterer fills it."
  - "The convenience store (location conv_store, ch 14) in the morning: bright, the TV mounted above the counter; the clerk (generic): a sleepy man in his twenties in a green store vest."
  - "The columbarium (new location columbarium): a quiet modern memorial hall on a hillside: long white corridors lined from floor to ceiling with small glass-fronted niches (8 rows, the top row 3 m up), white chrysanthemums, sunlight through tall windows, a polished stone floor. Minseok's niche is at chest height."
  - "Minseok's niche (P13): behind the glass, a small white urn, a framed photo of Minseok in his orange vest grinning and giving a thumbs-up, a tiny wooden husk figure, an old can of coffee, a small blank brass nameplate. No legible text anywhere."
  - "The grey memory (P24, location hanriver_gate_flashback): four years ago, outside the iron door; everything grey except the two orange things: young Jaeha's new vest and the orange phone. Young Choi (30, no eye bags) in his rescue jacket; young Mok (34): the same build, short dark hair with no grey, a black Black Hound guild jacket."
  - "The video (P53-P56): drawn as the shaky phone image, with a small white timestamp label at the bottom. Minseok as in ch 21. His last seconds show, through the white-cyan shimmer of the gate's rim from inside, the riverbank under a Han River bridge at night: the concrete pier with its big faded yellow stencilled 7, the orange sodium lights on the span's underside, one lamp with a cracked cover, the black river. Exactly the pier Nib saw in ch 8 (location hanriver_gate), four years earlier, before the fence and the tarps."
  - "Lyra's brother Ilan (ch 18): mentioned only."
plants:
  - "PLANT P07-P09: the core is held as evidence; the reward waits for the trial (Arc 4, ch 32)."
  - "PLANT P20-P21: Choi keeps a copy of the video (Arc 4: 'Choi keeps a copy')."
  - "PLANT P42: Lyra asks when they will look for Ilan."
  - "PLANT P48-P49: Moon Ahin finds the cash payments to trap-testers for a Han River gate Kanghan says it doesn't have (ch 23-24)."
  - "PLANT P61-P65: the Han River gate is still open, four years after its boss was 'cleared' (Arc 4)."
hook_type: mystery

panels:

  # ================= SUNDAY (P01-P11) =================
  - id: P01
    recipe: establish
    shape: full
    gap: none
    bg: white
    camera: "news footage, eye level from the press line: Mok in handcuffs being walked up the steps of a police station between officers, camera flashes"
    light: "flat grey morning light; white camera flashes"
    art: >
      News footage, drawn as a TV image: Mok (mok_hangyu), handcuffed, in a grey police-issue jacket over his clothes, is walked
      up the steps of a police station between two officers (police); reporters crowd the foot of the steps with microphones and
      cameras flashing. Keep the bottom fifth of the image calm for the channel's lower third.
    acting:
      mok_hangyu: "head down, shoulders hunched, cuffed hands in front, not looking at the cameras"
      police: "two officers each holding one of his arms, walking him up the steps"
    calm: bottom
    lines:
      - {who: offpanel:crowd, type: tag, text: "SUNDAY MORNING."}
    ui:
      - kind: tv.lowerthird
        "on": panel
        text: "BLACK HOUND RAID LEADER MOK HANGYU ARRESTED"
        ticker: "ATTEMPTED MURDER ON A LIVE STREAM · 2.1 MILLION WATCHED · ASSOCIATION REOPENS GATE 0912 INQUIRY"
    sfx:
      - {text: "CHAK CHAK CHAK", style: quiet, at: [0.80, 0.30], size: S, rot: 0}

  - id: P02
    recipe: insert
    shape: wide
    gap: short
    bg: white
    camera: "news footage, low from the street: workmen lowering a black dog's-head guild sign from the front of a building on straps"
    light: "grey morning"
    art: >
      News footage: from the street, workmen on a cherry-picker lower a big black dog's-head guild sign off the front of a glass
      office building on straps; below, people in black guild jackets carry cardboard boxes out to the kerb. Scale: the sign is
      as tall as two men. Keep the bottom fifth calm for the lower third.
    calm: bottom
    silent: true
    ui:
      - {kind: tv.lowerthird, "on": panel, text: "ASSOCIATION REVOKES BLACK HOUND'S LICENCE · GUILD DISSOLVED"}
    sfx:
      - {text: "KREEEK", style: quiet, at: [0.70, 0.30], size: S, rot: 0}

  - id: P03
    recipe: talk
    shape: wide
    gap: short
    bg: white
    camera: "news footage, eye level: a smooth Kanghan spokesman at a podium in front of a white wall with the silver hexagon logo"
    light: "bright press-room light"
    art: >
      News footage: a smooth Kanghan spokesman (kanghan_spokesman) in a navy suit at a podium, in front of a white wall with the
      silver hexagon-in-a-hexagon logo (no letters); microphones bristle on the podium. Keep the bottom fifth calm.
    acting:
      kanghan_spokesman: "both hands resting on the podium, a practised sorrowful frown, eyes on the cameras"
    eyeline: "the spokesman → the cameras"
    foreground: "the bristle of microphones on the podium, cropped, bottom"
    calm: top
    lines:
      - {who: kanghan_spokesman, type: phone, text: "KANGHAN HAD NO KNOWLEDGE OF MR. MOK'S ACTIONS. HE WAS A CONTRACTOR ACTING ALONE.", side: l}
    ui:
      - {kind: tv.lowerthird, "on": panel, text: "KANGHAN: 'A CONTRACTOR ACTING ALONE'"}

  - id: P04
    recipe: reaction
    shape: wide
    gap: short
    bg: white
    camera: "eye level inside the convenience store: the radish granny at the counter glaring up at the TV, the sleepy clerk nodding"
    light: "bright shop light; the TV's glow"
    art: >
      Inside the Mangwon corner convenience store in the morning (location conv_store): the TV above the counter, its screen flat
      green; below it the radish granny (granny_kimchi) in her red rubber apron, a shopping basket on her arm with a daikon radish
      sticking out of it, glares up at the screen; behind the counter the clerk (conv_clerk) nods.
    acting:
      granny_kimchi: "glaring up at the TV, one rubber-gloved hand on her hip, the basket on her other arm, lips pursed"
      conv_clerk: "leaning on the counter, chin in his hand, nodding sleepily"
    eyeline: "granny and clerk → the TV (up)"
    calm: top
    lines:
      - {who: granny_kimchi, type: speech, text: "A CONTRACTOR ACTING ALONE, MY FOOT.", side: l}
    ui:
      - {kind: tv.lowerthird, "on": screen, text: "KANGHAN: 'A CONTRACTOR ACTING ALONE'"}
    sfx:
      - {text: "HMPH", style: comic, at: [0.30, 0.40], size: S, rot: -6}

  - id: P05
