chapter: 32
title: Change the Angle
when: "Raid morning, directly after ch 31's early charge. The fight lasts seconds; returns and treatment follow, then fragment integration while the central crew finishes returning. No calendar date is lettered."
story_beats: PART_ONE_BEATS.md#32
cast:
  taeo: outdoor # Navy zip jacket over black hoodie, black cargos, black low sneakers with one white stripe. Mole under RIGHT eye. Olive backpack with faded orange OLD shield-and-open-door patch beside the operator table. Never crosses.
  nib: default # Adult, 105 cm, barefoot; V-notch LEFT ear, single lower LEFT fang, brown rope belt, pouch RIGHT hip, brown wooden sheath LEFT hip. Charcoal repair at RIGHT outer thigh retained from ch 29. Dinosaur sticker on pouch. Matte black 8x30 binoculars, strap knot at LEFT neck, Kett's mark on hinge. Drilled white site hard hat, chin strap fastened. Compact radio LEFT hand or LEFT belt.
  orrin: default # Adult stoneback; 230 cm long, 135 cm shell height, four columnar legs with three blunt nails each, stacked-slate shell, grey-olive skin, heavy-lidded adult face. Haein's removable scaffold-clamp LEFT anterior rim brace; shell does NOT crack here. Return ring distal RIGHT foreleg.
  haein: default # Slate-blue bib overalls, beige tee, brown tool belt, jaw-length black bob, clear safety glasses. Outside at survey base station.
  sejin: default # Sage scrubs, olive medic rig, charcoal cargos, dark boots, cropped black hair. Paid safety officer, outside throughout.
  minho: default # Brown work jacket, grey tee, olive cargos, black knee pads, brown boots; grey streak LEFT temple, chest radio, LEFT wristwatch. Returns from central route.
extras:
  central_crew: "Two adult Ryu survey workers, one stocky man and one lean woman, in muted orange work vests and white hard hats; dusty but walking unaided, carrying closed deposit cases."
  bridge_boss: "Adult-sized dungeon ram-beast, far larger than Nib: squat blocky stone shoulders, four heavy cloven feet, coarse dark clay plates, low red slit eyes, two ridged mineral horns. The outer horn has a pale layered tip. No equipment, no return mark, no comic expression."
locations: [terrace_gate_east, terrace_gate_rim]
location_notes:
  terrace_gate_east: "No drawn key supplied. Matches ch 31: green dusk sky, rust-clay terraces with stable grey capstone shelves, violet shadows, black void below. Advancing toward the boss, cliff is RIGHT/inland and drop LEFT/outboard. At the 200 m bridge approach Orrin occupies the broad stable capstone beside an oblique projecting cliff face. Nib's escape pocket is behind Orrin's shoulder. Two shut low grey deposit cases ride side by side on a canvas pad on Orrin's MIDDLE shell tier; their handles join with a short webbing loop, never a body harness. Ryu's white cable, blue bands each metre, follows the RIGHT inland edge to grey relay tripods every 50 m."
  terrace_gate_rim: "Outside Terrace Gate's east connection: packed gravel staging apron, scaffold threshold frame, operator table and first-aid mat to its left, clear return landing in front. The central connection's separately licensed exit is farther across the same apron. Local connections close on their own bosses; an east clear does not cancel Minho's central run. Table holds the grey survey base station, coiled white/blue survey cable and dark medical displays."
props:
  brace: "Haein's ch 30 LEFT anterior rim brace, matching ch 31: canvas-padded dull galvanized channels, scaffold half-couplers and two short hinged diagonal props with square feet. Both swung down at the hook; outer foot still unseated and lower pin misaligned until Orrin plants near forefoot. At P02 Nib seats that outer foot and holds the pin ready; P08 plants forefoot, P09 locks pin. It spreads a glancing load, never makes the rim invulnerable."
  turning_line: "Short plain survey safety rope clipped to the brace's outboard eye. Nib uses a loose bight to catch the boss horn and give its head a lateral cue. Orrin and the angled brace carry the tension; Nib releases before the load peaks. Not the white radio cable."
  horn_fragment: "Palm-length pale grey layered mineral tip, dark clay at its broken base. Breaks off against the cliff before the boss falls. Nib retrieves it from the safe shelf; consumed by integration at P45. Window 4's first new kind, +34%."
palette_notes: "A4 inside-gate green dusk with violet shadows; threat red only in the boss's eyes. Outside: dusty ochre gravel, warm brown shadows, washed blue morning sky; blood is the single grit red. Nib link amber #F2A93B and Orrin link slate-green remain distinct in Taeo's RIGHT palm. Interface cyan #3FE3F2 on deep navy is reserved for windows/integration. Return marks are cold-white rings with violet edges, never interface cyan. Hard cel shadows, no bloom, haze, decorative particles or generated lettering throughout."

panels:
  - id: P01
    shape: tall
    gap: none
    bg: black
    camera: "low behind Orrin's unfinished brace, up the bridge toward the charging ram"
    art: >
      terrace_gate_east, continuing the last instant of ch 31. Orrin (orrin, default stoneback design)
      fills the lower right, body half turned, one forefoot still seeking purchase. Nib (nib, default,
      drilled white hard hat, full belt and binocular locks) crouches at the open clamp beside him.
      The stone ram-beast already charges down the bridge from upper left, head lowered, clay plates
      thrown forward. ACTING: Orrin sharply alert, Nib's jaw set at the lost second. Green dusk from
      above, violet undercuts, one threat-red eye. Keep the void visible below the bridge; no shell
      crack, no people falling, no letters or effects drawn into the art.
      Nib crouches on the left beside the brace, Orrin on the right; the ram approaches from upper left.
    calm: top
    sfx:
      - {text: "DRRRM", style: impact, at: [0.24, 0.33], size: XL, rot: 24}
    notes: "Starts at ch 31's hook: the charge is early and the brace is not yet set. ch031.yaml was absent when this batch began; the beats supply the handoff."

  - id: P02
    shape: strip
    gap: short
    bg: black
    camera: "extreme close-up across the open lower clamp and Nib's hands"
    art: >
      Nib's olive-green hands (nib, default cuffs absent, pale forearm scars) press the brace's lower
      steel pin toward its socket. His knee has nudged the outer prop's square foot off the stone
      joint onto sound capstone. Pin holes remain misaligned because Orrin has not planted his
      forefoot. Five fingers on each hand, believable grip; the rope eye sits
      outboard, separate from the white survey cable farther inland. Green sky light on dull steel,
      violet shadow under the rim at terrace_gate_east. No fracture in the slate, no readable marks.
      Nib's instruction comes from above the left edge; only hands, pin and prop foot are shown.
    calm: top
    lines:
      - {who: "offpanel:nib", type: "speech", text: "ORRIN. PLANT YOUR FOREFOOT.", side: "l"}

  - id: P03
    shape: tall
    gap: short
    bg: black
    camera: "outside, front three-quarter on Taeo at the operator table"
    art: >
      terrace_gate_rim. Taeo (taeo, outdoor, RIGHT-eye mole) has risen halfway from his folding chair,
      gripping the base-station handset in his LEFT hand, RIGHT palm open. Sejin (sejin, sage scrubs,
      olive rig) slides the blood-pressure cuff clear of his elbow without pulling his arm. Haein
      (haein, overalls, safety glasses) holds the cable socket steady. ACTING: Taeo recognises the
      sound before he is ready; both women become wholly attentive. Morning sun from left, ochre
      gravel and brown shadows, gate rim cold beyond them. Screens dark; backpack patch visible;
      no figures inside the interface, no drawn words.
      Taeo on the right, Sejin on the left and Haein in the centre at the line; Nib's warning comes through the left speaker.
    calm: top
    lines:
      - {who: "offpanel:nib", type: "phone", text: "THE RAM'S CHARGING EARLY.", side: "l"}
      - {who: "taeo", type: "float", text: "I HAD A WHOLE SENTENCE PREPARED."}

  - id: P04
    shape: inset-r
    gap: short
    bg: black
    silent: true
    camera: "eye-level close-up on Nib looking past the camera at the charge"
    art: >
      Nib (nib, default and drilled hard hat), close at terrace_gate_east: narrow adult amber eyes,
      flat mouth, LEFT ear notch, one LEFT lower fang just visible. He looks past us toward the ram,
      then down toward the rope in his hand at the bottom edge. Fear is present and contained in a
      tightened jaw. Binoculars ride high, black strap knotted LEFT. Green dusk catches his cheek,
      violet shadow beneath the hard-hat brim. No cute proportions, no dialogue or marks in art.
    calm: none

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 32 · CHANGE THE ANGLE"

  - id: P06
    shape: full
    gap: short
    bg: white
    camera: "high overhead oblique showing the complete turn and escape pocket"
    art: >
      Establish the geometry at terrace_gate_east in one clean view. Bridge enters lower left;
      cliff projects diagonally across the upper side of the broad shelf; void lies along its
      bottom side. Orrin (orrin, default) angles his braced shoulder toward the incoming charge,
      forelegs spread over sound ground, two closed grey cases secured on the middle shell pad.
      Nib (nib, default, drilled hat, binoculars, bare feet) moves outboard with the loose rope bight;
      his escape pocket lies behind Orrin, away from the cliff collision. The white/blue survey cable
      stays inland. Green dusk, violet shadows; no diagram arrows, words, duplicated bodies or moving ground.
      The outside instruction comes through the relay at left; Nib and Orrin occupy the centre-right of the overhead view.
    calm: top
    lines:
      - {who: "offpanel:taeo", type: "phone", text: "ORRIN, CAN YOU ANGLE THE BRACE TOWARD THE CLIFF?", side: "l"}

  - id: P07
    shape: tall
    gap: short
    bg: white
    camera: "low beside Orrin's cheek, Nib near his foreleg"
    art: >
      Orrin (orrin, adult slate stoneback) turns his heavy-lidded face toward Nib while lowering his
      near forefoot. Nib (nib, default with hat and binoculars) keeps one palm on the clamp and the
      loose rope in his other hand, not looking away from the ram. ACTING: Orrin deliberate and
      certain, asking for a brief precise action; Nib listens. The closed load stays high on the
      shell, never on the vulnerable lip. terrace_gate_east, green overhead light, violet shell
      shadows. No cute features, no reins, no neck harness, no written fittings.
      Nib crouches on the left, Orrin on the right; include both faces, brace and forefoot.
    calm: top
    lines:
      - {who: "orrin", type: "speech", text: "YES. NIB, WAIT UNTIL MY FOREFOOT IS DOWN.", side: "r"}
      - {who: "nib", type: "speech", text: "WAITING.", side: "l"}

  - id: P08
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "ground-level extreme close-up of Orrin planting his forefeet"
    art: >
      At terrace_gate_east, Orrin's two grey-olive forefeet (orrin, default, three blunt nails per
      foot) settle into two shallow stable hollows in the clay shelf. Knees angle outward; the legs
      are under the load path, not splayed toward the void. Tiny loose clay grains shift beneath
      actual contact only. One lower strut enters from above. Green sky light and hard violet
      shadow show the weight settling. No glowing ground, no hoof anatomy, no extra feet or lettering.
    calm: none

  - id: P09
    shape: inset-l
    gap: short
    bg: white
    camera: "close side angle on Nib closing the locking pin"
    art: >
      Nib (nib, default, hat brim and left ear notch at the top edge) drives the now-aligned pin home
      with his thumb and swings the retaining catch shut. His face is partially visible, satisfied
      only for the instant needed to verify it. Rope hangs loose below his free hand; the knife
      remains in its brown wooden sheath on his LEFT hip. terrace_gate_east, green dusk on worn
      steel, violet beneath the slate. Clear separate fingers and fittings; no shell cracks or words.
      Nib's partial face occupies the left third above his locking hand. He keys his clipped belt radio with the free hand; the turning rope stays slack.
    calm: right
    lines:
      - {who: "nib", type: "speech", text: "TAEO. I'M READY TO SHARE THE LOAD.", side: "l"}
    sfx:
      - {text: "KLAK", style: quiet, at: [0.62, 0.59], size: M, rot: -12}

  - id: P10
    shape: full
    gap: short
    bg: white
    camera: "outside, over Haein's shoulder onto Taeo and his open palm"
    art: >
      At terrace_gate_rim the foreground is Haein's slate-blue overall shoulder and the grey speaker
      grille, white cable plugged in with its blue band visible. Beyond, Taeo (taeo, outdoor) opens
      his RIGHT hand beside the handset in his LEFT. Amber and slate-green pulses sit separately
      in the same palm. ACTING: Taeo terrified, chin held level by effort; Sejin watches him from
      the centre, hands ready. Sun from left, dusty ochre and brown; no floating readout yet,
      no amber in his left hand, no legible base-station screen.
      Taeo's face is visible waist-up on the right, Sejin in the centre, Haein's shoulder at left beside the speaker carrying Orrin's voice.
    calm: top
    lines:
      - {who: "offpanel:orrin", type: "phone", text: "BRACE SET. I'M READY TO SHARE THE LOAD.", side: "l"}
      - {who: "taeo", type: "speech", text: "ON YOUR WORD, ORRIN.", side: "r"}
    notes: "Both linked people explicitly permit the prepared manoeuvre. The intact Ryu line carries every cross-threshold voice; the links are brief pulses, not permanent telepathy."

  - id: P11
    shape: strip
    gap: short
    bg: white
    camera: "tight profile on Taeo's face and the handset"
    art: >
      Taeo (taeo, outdoor), profile at terrace_gate_rim, handset pressed close without hiding his
      mouth. His lips part; he swallows a private fear rather than issuing another instruction.
      The mole under his RIGHT eye is on the visible cheek. A hard line of morning sun picks out
      the sweat at his temple; brown and blue-grey simplified canopy shadows behind. One hand
      only at the handset. No interface, no lettering and no smile that makes the danger trivial.
    calm: top
    lines:
      - {who: taeo, type: float, text: "I WANT TO SAY COME BACK ALREADY."}

  - id: P12
    shape: full
    gap: short
    bg: white
    camera: "from just above the ram's horns toward Nib at the bridge mouth"
    art: >
      terrace_gate_east from the charging ram's approach. Its two stone horns frame Nib (nib,
      default, drilled hat and all locked props), who stands apparently exposed in the middle of
      the lane. Bare feet are planted obliquely; rope bight is low and slack, its far end clipped
      to Orrin's brace to the right. Orrin's angled shoulder makes a ramp toward the inland cliff,
      not a wall across the bridge. ACTING: Nib's stare is flat and deliberate, no grin. Green
      dusk, violet drop, threat red only at the ram's eye edge. No energy weapon or glowing rope.
      Nib occupies the centre, Orrin to the right; full bodies have room between the foreground horns.
    calm: top
    lines:
      - {who: nib, type: speech, side: c, text: "HERE."}

  - id: P13
    shape: inset-r
    gap: short
    bg: white
    camera: "close on the ram's eye turning toward the bait"
    art: >
      The bridge_boss at terrace_gate_east: a narrow red eye shifts toward Nib off frame, and the
      near mineral horn tilts a fraction outboard. Coarse dark clay plates crowd the eye socket,
      pale layered horn tip at the lower edge. This is animal attention, not villainous amusement.
      Green dusk cuts across the upper plates, violet in the crevices. Keep the background nearly
      flat, the motion readable through the changed horn angle. No symbols, words or human pupils.
    calm: left
    sfx:
      - {text: "HRRRF", style: quiet, at: [0.36, 0.72], size: M, rot: -6}

  - id: P14
    shape: tall
    gap: short
    bg: white
    camera: "outside, at Taeo's knee level as Sejin steadies the chair"
    art: >
      Taeo (taeo, outdoor) bends his knees at terrace_gate_rim, lowering his weight before the
      impact; Sejin (sejin, default medic gear) plants a boot against the chair leg and braces
      one hand behind his shoulder. He has not yet fallen. His right palm faces upward, both
      distinct pulses visible; left hand holds the handset. ACTING: a raw frightened half-smile
      that dies as he listens. Morning side light, ochre ground, warm brown shadows. Backpack
      with old orange patch beside table; no magic armour, no additional screens or lettering.
      Sejin on the left supports Taeo on the right; show their faces and knees as he lowers his weight.
    calm: top
    lines:
      - {who: sejin, type: speech, side: l, text: "I'VE GOT YOU."}
      - {who: taeo, type: float, text: "PLEASE LET THAT BE ENOUGH."}

  - id: P15
    shape: tall
    gap: short
    bg: black
    camera: "side elevation across the void, ram closing the last stretch"
    art: >
      terrace_gate_east, side elevation preserving the bridge, stable shelf and inland cliff.
      The ram's heavy forequarters clear the bridge and reach the shelf; Nib (nib, default, full
      locks) is a small upright target just ahead of the horn. Orrin (orrin, default and locked
      rim brace) stands diagonal behind him, forelegs now planted, cargo secured on the shell.
      The white radio cable is safely inland. Green dusk silhouettes, hard violet underside;
      motion lines follow the ram horizontally. No crushed Nib, no moving cliff or figures below.
    calm: top
    sfx:
      - {text: "DUM DUM DUM", style: impact, at: [0.24, 0.34], size: L, rot: 22}

  - id: P16
    shape: strip
    gap: short
    bg: black
    silent: true
    camera: "extreme close-up on Nib's feet beginning the turn"
    art: >
      Nib's bare olive-green feet (nib, default) pivot at terrace_gate_east: the rear heel lifts,
      front toes press into clay, knees already angled toward the safe pocket behind Orrin.
      The loose rope crosses ahead of his ankles, never wraps them. At the top edge the hem of
      charcoal shorts and brown wooden sheath remain separate from the line. Green overhead
      light, violet foot shadows, a few displaced grit grains. No boots, no glowing footprints,
      no additional feet, no words; hold the deliberate instant before the yank.
    calm: none

  - id: P17
    shape: tall
    gap: short
    bg: black
    camera: "three-quarter above Nib's shoulder as he casts the bight"
    art: >
      Nib (nib, adult, default with drilled hard hat and binoculars) casts the loose rope bight
      across the near horn's base and steps sideways, out of the charging lane. His arms extend
      diagonally toward the brace eye, showing the rope's endpoint on Orrin (orrin, default).
      ACTING: Nib's teeth set, eyes measuring; Orrin watches the point of contact. The rope
      changes the head angle by a little, not the ram's whole momentum. terrace_gate_east,
      green dusk, violet shadows. No lasso round the neck, no cute face or energy tether.
      Nib casts from the left, Orrin braces on the right; show their full stances and the rope endpoint.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "TURN."}
    sfx:
      - {text: "FWIP", style: quiet, at: [0.55, 0.33], size: M, rot: -18}

  - id: P18
    shape: strip
    gap: short
    bg: black
    camera: "tight on Nib's two hands pulling the lateral cue"
    art: >
      Nib's scarred forearms (nib, default) make one hard lateral wrench on the rope, hands
      low and separate, with all fingers gripped properly. Behind the hands the horn rotates
      into the oblique steel brace. Nib's body is already passing out of the direct lane;
      his hands will open next, before full load arrives. terrace_gate_east, green reflected
      sky, violet dark behind. No blood, no bent fingers, no claim that he stops the ram
      by muscle, no signs or words.
    calm: none
    sfx:
      - {text: "KRRK", style: quiet, at: [0.75, 0.46], size: M, rot: -12}

  - id: P19
    shape: tall
    gap: short
    bg: black
    camera: "low front three-quarter on Orrin as the horn starts to slide along the brace"
    art: >
      Orrin (orrin, adult stacked-slate carrier, default) lowers his shoulder a fraction at
      terrace_gate_east. The ram's horn begins a glancing slide along the diagonal brace,
      pushing near the rim rather than striking its face square. Orrin's angled forelegs
      are directly beneath the braced side. ACTING: heavy eyelids wide with effort, jaw tight,
      utterly present. Nib is already clear in the lower outboard corner, rope hands opening.
      Green dusk, hard violet shadows, dull steel; no shell fracture or red decorative sparks.
      Orrin fills the right third, Nib clears the lower left; the ram horn slides between them along the brace.
    calm: top
    lines:
      - {who: orrin, type: speech, side: r, text: "NOW."}

  - id: P20
    shape: strip
    gap: short
    bg: black
    camera: "outside, extreme close-up on Taeo's right palm and wrist"
    art: >
      Taeo's RIGHT palm (taeo, navy jacket and black hoodie cuffs pushed back) at terrace_gate_rim.
      Amber and slate-green pulse together but remain two separate hard lines; tendons stand
      up and the older purple bruise on his forearm darkens at its edge. Five fingers spread
      in effort, not a claw. Morning sunlight from the left, muted ochre ground out of focus
      as simplified shapes. Leave top air clear. No pulse on the left hand, no interface
      text in the skin, no blood magic.
    calm: top
    lines:
      - {who: taeo, type: float, text: "ONCE. JUST DO IT ONCE."}

  - id: P21
    shape: tall
    gap: short
    bg: navy
    camera: "outside, low full figure on Taeo as the recoil buckles him"
    art: >
      BIG REACTION. Taeo (taeo, outdoor, RIGHT-eye mole) at terrace_gate_rim screams as his knees
      buckle, face distorted by actual pain, tears forced from squeezed eyes. His RIGHT palm
      remains open; LEFT hand still holds the handset. Sejin (sejin, default) catches his upper
      body and guides him toward the gravel, not back onto a rolling chair. Haein (haein,
      overalls) keeps the line connected. Upper third empty for the window. Morning light,
      brown shadows, cyan from the future composite. No chibi, no split skin or shell imagery.
      Taeo buckles on the right, Sejin catches him on the left and Haein remains in the centre at the cable.
    calm: top
    ui:
      - {kind: system.notice, on: float, text: "[LOAD SHARE 21%]", at: [0.5, 0.06], tilt: -5}
    lines:
      - {who: taeo, type: shout, side: r, text: "AAAAH!"}
    sfx:
      - {text: "DING", style: summon, at: [0.84, 0.16], size: M, rot: 0}
    notes: "Required power beat. Taeo redirects 21% of the dangerous rim load through Orrin's prepared foreleg path into the ground and takes transfer recoil. The remaining force glances along the brace; he does not absorb the whole charge. Mechanical force only; no storage, healing or permanent 21% guarantee."

  - id: P22
    shape: full
    gap: short
    bg: black
    camera: "inside, ground-level under the brace following struts to Orrin's forelegs"
    art: >
      terrace_gate_east. A clean mechanical composition: ram horn sliding rightward along the
      padded brace above; diagonal steel struts descending to Orrin's (orrin, default) planted
      foreleg line below; broad feet compressing clay into low ridges on solid shelf. The shell
      rim flexes minimally and remains intact. The boss passes across, not into, Orrin's body.
      Green sky light, violet underside; tiny stone chips only where horn scrapes steel.
      No magical arrows, floating percentages, blue aura, broken leg or new shell crack.
    calm: top
    sfx:
      - {text: "GRRNNK", style: impact, at: [0.58, 0.30], size: XL, rot: -18}

  - id: P23
    shape: tall
    gap: short
    bg: black
    camera: "from the escape pocket toward Nib releasing and the boss swinging inland"
    art: >
      Nib (nib, default, hat and binoculars) releases the rope completely and drops into the
      safe pocket behind Orrin's shoulder, hands open and empty. His face is fierce with
      concentration. Beyond, the ram's head and shoulders rotate inland along the brace,
      hindquarters still carried forward by its charge. Orrin (orrin, default) holds the
      planted stance. terrace_gate_east, green dusk and violet; outboard edge remains behind
      Nib rather than beneath his feet. No rope around his wrists, no extra limbs or words.
      Nib reaches the safe pocket on the left, Orrin braces on the right; keep Nib's shouting face visible above his opening hands.
    calm: top
    lines:
      - {who: nib, type: shout, side: l, text: "CLEAR!"}

  - id: P24
    shape: full
    gap: short
    bg: black
    camera: "high from the cliff, looking down the new collision line"
    art: >
      The ram slams head and forward shoulder into the oblique cliff at terrace_gate_east.
      The angled impact throws its weight back toward the unguarded outer edge; the near
      pale layered horn tip breaks against rock and skips onto the safe shelf beside Nib.
      Nib (nib, default and full locks) crouches behind Orrin (orrin, default), both clearly
      outside the collision. Two grey cargo cases stay shut on the middle shell pad. Green dusk above, violet
      cleft and black void below; impact debris only at the cliff. No blood spray or letters.
    calm: top
    sfx:
      - {text: "KRAAAM", style: impact, at: [0.42, 0.24], size: XL, rot: -9}

  - id: P25
    shape: strip
    gap: short
    bg: black
    camera: "tight side-on on the ram's rear hooves losing the shelf"
    art: >
      Two heavy cloven rear hooves of bridge_boss scrape across the clay lip at terrace_gate_east,
      finding no purchase as the head's collision rotates the body. One hoof has already left
      the shelf; a clean black gap opens beneath it. The stable shelf under Orrin is farther
      inland and does not collapse. Green dusk edge light, violet shadow, black negative space.
      A few chips accompany this actual impact only. No human hands, return mark, cracked
      shell or printed motion effects.
    calm: none
    sfx:
      - {text: "SKRRR", style: impact, at: [0.60, 0.47], size: L, rot: 12}

  - id: P26
    shape: bleed
    gap: long
    bg: black
    silent: true
    camera: "from the shelf lip looking steeply down after the falling boss"
    art: >
      The bridge_boss falls away into the enormous black void at terrace_gate_east, body small
      and tumbling beneath tier after tier of green-lit clay. In the upper sliver of the
      frame, Nib (nib, adult default, hat and binoculars) is on safe ground beside Orrin's
      braced foreleg, looking down with a grim breath leaving him. The pale broken horn tip
      lies near Nib, never below the rim. Violet terrace undersides, wrong green sky limited
      to the top. No comic fall, gore, return flash on the native boss or decorative particles.
    calm: none
    notes: "The boss falls into the void; its death is confirmed by the local connection closing in P29. Horn was broken onto the safe shelf before the fall, not collected from a disappearing corpse."

  - id: P27
    shape: inset-l
    gap: short
    bg: white
    camera: "inside, close on Nib lifting the broken horn tip from the shelf"
    art: >
      Nib (nib, default, drilled hat, binoculars high) picks the palm-length pale mineral horn
      tip off the safe clay shelf at terrace_gate_east. His scarred hand closes firmly around
      its dark broken base; eyes flick from it to Orrin rather than linger on loot. Pouch on
