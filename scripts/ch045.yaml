chapter: 45
title: Arcade Glass
when: "Saturday morning, directly after ch 44's recovered-ID hook; the released surge share arrives before lunch. Integration and the crew meeting occupy the afternoon. The invitation opens at dusk that same Saturday. No calendar date fixed."
story_beats: PART_ONE_BEATS.md#45
cast:
  taeo: default # Black hoodie, black cargos, single-white-stripe sneakers. Sleeves rolled through the family scene; lowered at dusk, bruises retained. One mole below RIGHT eye. Never enters a gate.
  nib: default # Adult scout in the exact ch043 boots; full established belt gear and binoculars throughout.
  orrin: default # Adult stoneback, 230 cm long, 135 cm shell height; upper LEFT-front shell crack and clean protective dressing persist. Rest only.
  grandpa: default # Blue work cap, grey pocket jacket, blue-grey shirt, brown trousers, old dark shoes; still visiting Seoul.
  minho: default # Brown jacket, grey tee, olive cargos, knee pads, brown boots; grey streak LEFT temple, chest radio and LEFT watch.
  sejin: default # Sage scrubs, olive medic rig, charcoal cargos, dark work boots; paid safety officer.
  sera: default # Voice through the invitation only, then anonymous bow silhouette in hook; no featured face or intro before ch046.
locations: [ryu_practice_yard]
location_notes:
  ryu_practice_yard: "Follow keyed south double gate, southwest grey OFFICE, southeast white van, fixed plywood maze, three north targets and west equipment trestle. Taeo's separate ch028 home container is in the service area; show its door/interior in close crops without assigning a new yard-wide orientation. Its low folding table, bedding, lamp, family-photo shelf and green-banded white mug remain. New three-rule sheet is taped to its interior wall. Invitation is on a clear level apron outside that home door, away from maze walls; do not move the keyed office or van."
props:
  boots: "Nib's ch043 chosen pair: matte dark-brown ankle-high leather lace-up work boots, broad round toes, FOUR pairs dull gunmetal round eyelets each, dark-brown round laces in small double knots, black lug soles/low heels, heel pull tabs, oat-grey short socks inside collars. No hooks, buckles, logos, bright trim or exposed steel caps."
  nib_gear: "Adult 105 cm, LEFT-ear V-notch, one lower LEFT fang, brown rope belt, dinosaur-stickered leather pouch RIGHT hip, brown WOODEN sheath LEFT hip. Matte-black 8x30 binoculars high on chest, woven strap knotted LEFT neck, Kett fork on hinge. Pale-blue ID, folded PAPER watch-post drawing and cobalt pencil with carved fork near eraser remain in pouch except pencil during rules. Charcoal repair at RIGHT outer thigh retained."
  father_id: "Original pale-grey laminated Seogang porter card, thumb-worn corners, water-clouded lower edge, cracked empty lanyard slot; exact reverse pencil note from ch044. Kept in its old off-white envelope after P04, on the family-photo shelf inside home."
  surge_share: "Three finite anchor fragments collected during the permitted surge APPROACH, before evacuation-only orders: two thumb-sized grey STONE pieces and one flat palm-length smoky violet-grey ARCADE GLASS with stepped translucent internal bands. These are dungeon anchor material, not a broken shop window. Released here after accounting; no new salvage expedition. Stone pieces remain in the divided case; arcade glass is consumed P20. None comes from the abandoned ₩60,000,000 cluster."
  crew_rules: "One large plain cream paper sheet taped to the home-container interior wall. Three blank rows for ui.label. New rules are written together P25–P29; do not preprint them in earlier panels. Original ch021 ASK FIRST paper is kept underneath, not silently lost."
  phone: "Dark-grey phone, top-left hairline crack, clear case and green dinosaur sticker. All visible screens dark unless a matching screen UI is supplied."
palette_notes: "A4 yard: dusty ochre, warm brown shadows, washed sky blue; home morning cool grey-blue daylight, afternoon warm reflected ochre, dusk one warm lamp against deep blue-grey. Integration/invitation cyan #3FE3F2 on navy #0B1530, never confused with Nib's amber link or Orrin's slate-green. No load share, new link or injury cure here. Flat cel planes, warm varied near-black contours, no bloom, haze or decorative particles. All readable matter is separate UI; generated papers, signs and device faces stay blank."
