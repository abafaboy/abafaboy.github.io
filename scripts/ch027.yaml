chapter: 27
title: Sandbags
when: "Immediately after ch 26's last line for the cold open; experiments the following morning, with Sejin arriving before lunch and analysis continuing in the afternoon. Late spring, before the coming Friday's Terrace contracts. No date is lettered."
story_beats: PART_ONE_BEATS.md#27
cast:
  taeo: default # Black hoodie, black cargo trousers, black sneakers with one white stripe; RIGHT-eye mole. Sleeves rolled for trials. Bruising develops on RIGHT forearm at P29; sleeves lowered loosely after Sejin's exam, injury persists. Olive backpack with faded orange old-team patch at trestle; cracked dark-grey dinosaur-sticker phone.
  nib: default # Adult 105 cm, wiry and weathered; V-notch LEFT ear, single lower fang LEFT; pinkish-tan torn wrap, charcoal knee shorts, BROWN rope belt, RIGHT sticker pouch, LEFT brown wooden sheath, barefoot. Matte black 8x30 binoculars high on chest, black strap knot LEFT, Kett fork on hinge. Pale-blue ID, PAPER drawing and cobalt-blue carved pencil in pouch.
  orrin: default # Adult 230 cm stoneback, 135 cm shell height; angular stacked-slate terraces, dust-grey olive skin, heavy-lidded olive eyes, four columnar legs with three blunt nails apiece, short tail. No clothing or harness. No cracks or brace yet.
  haein: default # Adult 20; jaw-length black bob, Ryu brows, slate-blue bib overalls, beige tee, brown belt with spanner RIGHT and screwdriver LEFT; glasses down for trials, on crown afterward, brown boots.
  minho: default # Cold open only. Brown jacket, grey tee, olive cargo trousers, knee pads, brown boots; LEFT grey streak, LEFT chest radio, LEFT wrist watch.
  sejin: default # Adult 36, cropped near-black hair, square jaw, tired brown eyes; sage scrub shirt, olive medic rig, charcoal cargo trousers, dark boots. Nitrile gloves for exam, no faction badge.
locations: [ryu_practice_yard]
location_notes:
  ryu_practice_yard: >
    Follow the keyed south gate, southwest grey office, southeast last west-facing white van,
    central fixed plywood maze, west equipment trestle and three north targets.
    The training rig occupies the open EAST lane outside the maze, with level ground and empty clearance.
    It is a low clamped scaffold test frame with a secondary catch strap and a guarded release cord,
    not the collapsing scaffold of ch 25. Do not change the maze to accommodate it.
    The offered spare container and Haein's workshop remain west-fence annex units beyond the main office.
props:
  rig: >
    One soft 2 kg canvas sandbag drops exactly 20 cm onto a thick foam pad resting on Nib's supported RIGHT forearm.
    The pad's small load cell records impulse; his arm rests on a padded trestle with no pinch point.
    The frame has a physical catch strap that Haein clips closed between trials. She pulls the release from outside its fall path.
    Orrin stands several metres away with an independent calibrated strain-sensor pad lightly bonded
    to the broad shell crown by removable adhesive; it measures local shell response, without a body harness.
    The receiver sensor is outside the bag's reach and mechanically separate from the drop frame.
    The comparison uses both sensors' calibrated, normalised impulse readings, not unconverted raw strain.
    Sensors lead to a cabled recorder with a dark display except the specified screen insert P27.
    This is ordinary measuring equipment, NOT the later reservoir: it stores no impact or charge.
  test_record: >
    Matched 2 kg/20 cm trials; the same bag, pad, support, posture and height throughout.
    First unlinked control normalised to 100 impulse units. A late-routing failure and a premature
    disconnect both stay at 100, with no receiver response.
    First prepared success: Nib 85, Orrin receiver 9. Repeat control: Nib 100, Orrin 0.
    Repeat prepared success: Nib 85, Orrin 9. Thus 15% consistently leaves Nib, only 9 units reach Orrin.
    The balance is costly transmission loss/recoil; do not pretend this is perfect conservation or a harmless buff.
palette_notes: >
  A4 survey-yard ochre, warm brown shadows, pale sky blue. Southeast morning sun, southwest afternoon sun.
  Cold open low southwest sun. Medical shade uses muted sage and grey. Purple bruise is a local injury colour,
  no decorative danger red. Interface cyan #3FE3F2 on navy; Nib amber #F2A93B and Orrin slate-green #70877B remain
  separate pulses in Taeo's RIGHT palm. Flat cel shading, no bloom, floating dust or photographic instruments.
continuity_notes: >
  Brief section 6 and ch 27 beats place the first named LOAD SHARE here, overriding STORY_BIBLE's stale 'from ch 29'.
  No training impact exceeds 15% routing; no reservoir, storage, healing or gate crossing.
  Bruise is Taeo's RIGHT forearm; no new nosebleed here. Nib's test arm is padded and uninjured; Orrin's shell intact.
  All live trials stop before Sejin arrives; her later analysis is paper-only. This matters to consent and the safety promise.

panels:
