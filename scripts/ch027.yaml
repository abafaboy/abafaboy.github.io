      Taeo knows the feeling. Late southwest sun, A4 ochre and warm brown, pale sky.
      Blank Terrace plan on trestle; no shell crack, harness, text or active power.
    calm: top
    lines:
      - {who: orrin, type: speech, side: r, text: "I ALSO HAVE A NAME."}
      - {who: minho, type: speech, side: l, text: "ORRIN. SORRY."}

