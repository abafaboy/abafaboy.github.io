locations: [relay_test_site, meridian_meeting_room, ryu_practice_yard]
location_notes:
  relay_test_site: "Carry ch89: two separate framed E gates, A west/B east, operator chair outside midway, medical cot south, water table west. This chapter shows only water table at shutdown."
  meridian_meeting_room: "Unkeyed Meridian Tower meeting room; long pale stone table east-west, Baek at east end, Minho west, city window north, single door south. Two closed folios, plain cups; no giant screens or visible logo text. Institutional A4 blue-white/slate adapted to expensive finishes."
  ryu_practice_yard: "Drawn key wins: grey office container southwest, white work van southeast facing west, south double gate, fixed plywood maze and north targets. Medical lessons use a folding table outside the container under an awning; finance table on the open south apron. Doors remain passable. No gate anomaly here."
continuity_notes: >
  Nib's adult model, LEFT ear notch and single lower LEFT fang, brown rope belt, RIGHT dinosaur-sticker
  pouch, LEFT brown wooden sheath, marked black 8x30 binoculars/LEFT strap knot remain exact.
  Folded PAPER drawing, pale-blue ID and cobalt fork-marked pencil stay in pouch. His chosen ch43 boots
  remain on: matte dark-brown ankle leather, broad round toes, four gunmetal round eyelet pairs,
  double-knotted round dark-brown laces, heel pull tabs, black lug soles/low heels, oat-grey short socks
  inside collars; no hooks, buckles, logos or visible steel caps. Verified against ch043 during final checking.
  Taeo's RIGHT-eye mole, olive backpack/OLD faded orange patch, dark grey cracked phone/dinosaur sticker remain.
  Prior forearm bruises and heart-rhythm problem persist; no force-transfer testing today. ch89's provisional
  half-second light-load ceiling remains, not proof of field safety. No new companion links or colours.
  Minho's Bluebird debt was ₩310,000,000 at ch26; do not invent a current payoff or forgiven balance.
  Haeseong co-op's agreed ₩90,000,000 financing remains under its ch84 share/sea-survey terms;
  the ₩210,000,000 shown here is the TOTAL crew Yeoju commitment, not an extra sum added to that funding.
  No new gross bank balance, guaranteed prize amount, or forfeiture schedule is invented.
palette_notes: "A4 daylight: dusty ochre yard, brown shadows, sky blue. Meridian: blue-white, slate, navy. Evening yard awning: warm practical lamp on brown/ochre, deep blue shadows. Red reserved for danger, no decorative supernatural glow. All forms, name tabs and brands blank until label UI."
