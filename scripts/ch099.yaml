chapter: 99
title: Fair Rent
when: "Straight from ch98's hook: the grey afternoon of Day Two at Yeoju (about 14:30). Then four days later (the exchange settles, Ryu yard), the following week (viewing, crew vote, closing), about six weeks of fit-out, moving day, the opening-eve dinner on the roof, and the early morning of opening day. No calendar dates are lettered."
story_beats: PART_ONE_BEATS.md#99
cast:
  taeo: outdoor # Navy jacket over black hoodie, black cargos, striped black sneakers, olive backpack with the OLD faded orange patch, RIGHT-eye mole, cracked dark-grey dinosaur phone. P01-P22 and P26 outdoor (street and yard). Indoors from P23 on, and from P27: black hoodie only, jacket off. Lip scab and nose cloth only in P01-P06; by P07 the lip is a faint line.
  nib: default
  orrin: default
  sera: default
  kesh: default
  haein: default # Slate overalls, tool belt, jaw-length black bob, clear safety glasses on her crown.
  dara: default
  sejin: default # Sage scrubs, olive medic rig, cropped black hair, stopwatch on a cord.
  chae: default # Navy cardigan, white collar, plain safety vest, blue folio; regional safety officer.
  minho: default
  seonhee: default # About 55, beige cardigan over a work shirt, sleeves rolled, reading glasses pushed up, pencil behind her ear.
  eunchae: default # 25, 163 cm, brown high ponytail, cream rolled-sleeve shirt, black trousers, black-and-white canvas sneakers; from P27 a navy apron with a ring of index flashcards clipped to the strap. No Hanbit vest any more.
  dr_pyo: default # About 50, neat salt-and-pepper side part, grey temples, rimless rectangular glasses, mid-grey suit, ivory shirt, muted sage tie, black shoes, slate lanyard with a blank ivory badge.
extras:
  building_agent: "Ms. Jeon, Korean building agent about 50, neat grey-streaked bob, beige trench coat over a plain blouse, flat shoes, a heavy ring of keys and a tablet held to her chest; dry, honest, tired of this listing and quietly rooting for them."
  lead_yellow: "The yellow-jacketed coalition leader from ch97: an adult woman about 45, wide calm face, cropped greying hair, yellow field jacket; no hard hat tonight."
  lead_green: "The green-jacketed coalition leader from ch97: an adult man about 52, close grey beard, broad shoulders, forest-green field jacket; no hard hat tonight."
  lead_greyblue: "The grey-blue-jacketed coalition leader from ch97 (the one who showed Chae the licence card): an adult man about 38, thin face, round glasses, grey-blue field jacket; no hard hat tonight."
locations: [yeoju_anchor_field, ryu_practice_yard, go_first]
location_notes:
  yeoju_anchor_field: "Continue ch98's last panels: grey afternoon, wet gravel, ochre mud at the foot of the closed, dark E frame, mud-splashed vans in the north lot, the competition board far off at the southwest canopy."
  ryu_practice_yard: "Canonical key: south double gate, grey office southwest, white van southeast facing west, fixed plywood maze, north targets, west equipment trestle. P07-P11: the west trestle table in southeast afternoon sun. P23-P24: the interior and open door of Taeo's ch28 home container (low folding table, folded bed, bare shelf, green-banded white mug); the cream rules sheet (ch45) is taped to the inner wall with the older ASK FIRST paper under its lower edge."
  go_first: "No drawn key; plan world/floorplans/go_first.png. A four-storey former print works on a street corner in Hapjeong-dong inside the gate zone, about 150 m from the old Hanbit Mart: dull red-brown brick, tall steel-framed windows (dirty at first, washed after the fit-out), flat roof with a rail. SOUTH street is the front. Looking at the front from the street, WEST is the left: Eunchae's glass shopfront and her own street door; EAST is the right: the guild hall's steel street door, then a narrow side yard with the external goods hoist (2.6 x 3.0 m deck on two steel cables) against the east wall. Ground floor: Eunchae's (six tables, pale-wood counter and kitchen behind to the north, store, WC and back door at the rear) and the narrow guild hall at the south-east corner beside the stair. 2F clinic: reception with chairs along the south windows (SW), treatment 1 south, treatment 2 west, recovery with two beds in the middle, store and staff room north, landing east. 3F: four bedrooms along the north wall (Nib, Sera, Kesh, Dara, west to east), Taeo's office and the guild office (licence and co-op files) in the middle, the crew room in the south with the three rules on its north wall, landing and fire stair east. Roof: four raised beds north, a long raised bed south-west, a timber pergola with a long plain table at the centre, Orrin's slate-roofed shelter in the north-east corner, the stair hatch east, the hoist landing at the east edge, a blue water tank in the south-east corner. The guild sign board above the guild door stays under a grey tarpaulin until ch100."
continuity_notes: >
  Time: ch98's afternoon, then +4 days (the GMA Anchor Exchange settles the crew's lot), +about a week (viewing, vote, closing), +about six weeks
  (fit-out; moving day), then the roof dinner on the eve of the opening and the early morning of opening day. The ch100 party is that evening.
  Money (new, exact): crew lot STOCK 3,210 settles at ₩1,620,000,000 gross (about US$1.17 million). Deductions total ₩402,000,000: extraction costs
  ₩246,000,000, agreed wages ₩102,000,000, treatment ₩54,000,000. Net surplus ₩1,218,000,000. Haeseong co-op 30% = ₩365,400,000, paid the same day;
  its separate two-year Haeseong sea-gate survey undertaking (ch84) stands. Crew 70% = ₩852,600,000. The ₩300,000,000 licence capital (₩210M crew
  plus ₩90M co-op) stays in the licence reserve, not spent. The building costs ₩780,000,000, paid in full, no lien, no loan; ₩72,600,000 is left for the fit-out.
  The tyre-base deposit of ₩30,000,000 (ch33, equal thirds Taeo/Nib/Orrin) is returned in full the same day. Iron Vow's lot is not shown.
  Yeoju follow-on logistics contract (non-exclusive): 36 months, ₩42,000,000 a month, with a required medical-cover line of ₩14,000,000 a month that funds the clinic floor.
  Ownership: the building is owned by the cooperative; all eight members (Taeo, Nib, Orrin, Sera, Kesh, Haein, Sejin, Dara) own one eighth each and voted 8-0
  (ch91 rule: bets over ₩50,000,000 go to a crew vote; all eight answer aloud). Arrival members are co-owners; Chae witnesses for the AAO.
  The cooperative has no name yet: the registry carries the placeholder "the cooperative" and the licence form's NAME line is blank until ch100.
  Eunchae's lease: ground floor, ₩1,150,000 a month, NO deposit, rent = her floor's share of the building bills plus 7% for the roof, books open to the tenant; Taeo lives upstairs.
  Taeo: heart check booked as the clinic's first appointment (Tuesday 09:00); forearm bruises yellowing; rhythm problem unchanged; no live-load work.
  Sejin and Dara are driving down to Dr. Lim's provincial clinic (ch87, Venn Logistics fuel) after the opening; Haein's test log has been sent.
  Nib: adult 105 cm, LEFT ear V-notch, one lower LEFT fang, brown rope belt, RIGHT pouch with dinosaur sticker, LEFT brown wooden sheath, 8x30 binoculars on a LEFT-knotted strap,
  exact ch43 boots (matte dark-brown ankle-high leather work boots, round toes, four pairs of dull gunmetal eyelets, dark-brown laces in small double knots, black lug soles, heel pull tabs, oat-grey short socks).
  Amber and slate-green pulses only; no new link colours.
palette_notes: "Yeoju afternoon: cold white light, wet ochre, mud brown. Ryu yard: A4 dusty ochre, sky blue, brown shadows. The building: wet slate street, red-brown brick, pale grey steel windows, cream plaster and pale wood inside, fresh dark soil and sage-green beds on the roof. Roof dinner: dusk blue with cream paper lanterns (warm cream, never amber). Opening morning: cold blue-white light with long hard shadows. Cyan only for interface; amber only for Nib's link and eyes; red only for danger (the guild hall's painted red line belongs to ch100). Flat cel, hard shadows, no haze or bloom."
