      Orrin dusty and enormous at the left with Haein beside his foreleg, Sera and Kesh (wing panels half open) behind Taeo, Dara and Sejin together. At the right Chae, in navy cardigan and safety vest,
      holds her folio, and Minho in brown field clothes stands beside her with his chest radio. Mud-splashed vans stand far behind. Nobody cheers. No readable board or text.
      Orrin and the crew stand on the left and centre; Taeo and Nib sit low in the centre; Chae and Minho stand on the right.
    calm: top
    lines:
      - {who: chae, type: speech, side: r, text: "YOUR STOCK GOES TO THE GMA EXCHANGE TOMORROW. PAYMENT SETTLES IN FOUR DAYS."}
      - {who: taeo, type: speech, side: c, text: "AND THEN?"}
      - {who: chae, type: speech, side: r, text: "THEN YOU HAVE MONEY. WHAT YOU DO WITH IT IS YOUR PROBLEM."}
