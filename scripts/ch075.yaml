chapter: 75
title: Sorry Properly
when: "Straight on from ch 74's dawn radio hook at Chungju. Nib completes withdrawal; Taeo visits the local hospital that evening, then travels to Seoul. Other crew members return earlier during the hospital wait. Overnight at Ryu Survey; final scene at first light. No calendar date or weekday is fixed."
story_beats: PART_ONE_BEATS.md#75
cast:
  taeo: outdoor # Navy jacket, black hoodie/cargos, one-stripe sneakers. RIGHT forearm remains wrapped from ch073; old bruises above wrap and on LEFT forearm. No fresh load. Mole under RIGHT eye.
  nib: default # Adult; his chosen ch043 boots, exact design from that chapter, throughout. LEFT ear notch/fang, brown rope belt, RIGHT pouch with dinosaur sticker, LEFT wooden sheath, matte-black 8x30 binoculars with strap knot LEFT neck. Paper post drawing, pale-blue ID and marked cobalt pencil retained.
  sera: default # Loose cream hospital shirt and sand trousers, braid with bone bead. LEFT arm dressed, splinted and in sling. Flute, bow and quiver are bedside effects; bow/quiver remain outside conversational crops.
  kesh: default # Adult 198-cm signal keeper; full first-panel description P41, working close view P43. No load-sharing link activation.
  orrin: default # Adult slate-shelled quadruped, 230-cm nose-to-tail; old repaired shell crack, no new damage. No saddle or harness.
  sejin: default # Sage scrub shirt, olive medic rig, charcoal cargos, dark boots; cropped black hair.
  haein: default # Slate-blue bib overalls, beige tee, tool belt, clear safety glasses on head.
locations: [chungju_river_gate, chungju_hospital, ryu_practice_yard]
location_notes:
  chungju_river_gate: "No drawn key available at drafting. Temporary exterior operations canopy, folding desk and scaffold-tube threshold frame at Chungju river gate. Black-violet slit with cold white rim. Ryu white survey cable has a blue band every metre; grey relay tripods every 50 m inside. Taeo stays outside. Match any upstream script's established cordon geography when drawing."
  chungju_hospital: "No key yet. Sera's quiet single ward: as ch073, bed RIGHT and cupboard LEFT in doorway view, visitor chair beside bed, pale curtain, blue-white overhead and small shaded cream lamp. Plain cream walls, slate floor, overhead clinical light; no readable hospital or drug branding. Window is dark during visit."
  ryu_practice_yard: "Use locations/ryu_practice_yard/notes.md and key_wide/key_reverse. Grey office container southwest, white van southeast facing west, fixed central plywood maze, equipment trestle west, targets north. Night work takes place on the equipment trestle under a portable task lamp; do not move maze walls. Taeo's residential container is elsewhere in the yard, off frame."
continuity_notes: >
  Ch074 was absent initially, then its last ten panels and end card were read when it appeared.
  Its actual two/three knocks are complete: seven people are outside; Nib alone remains one step inside.
  Ch071-073 confirm LEFT bow-arm injury, Chungju hospital, bedside bow/quiver/flute and Taeo's wrapped RIGHT forearm.
  All panels retain that wrap even in cropped hand views. Nib wears ch043's matte dark-brown ankle leather boots,
  round toes, four dull-gunmetal eyelet pairs, double-knotted dark-brown round laces, black low-heel lug soles,
  heel pull tabs and oat-grey socks; no hooks, logos or visible steel caps.
  Sera and Sejin remain in Chungju. Nib and the working crew return to Seoul earlier; Taeo joins after his visit. No discharge here.
  No interface notice supplies a new order, no route counter changes, no money changes hands.
palette_notes: >
  A4 institutional adaptation for hospital: clean blue-white overhead light, cream local colour, light-slate shadows,
  no saturated accent during apology. Cordon: grey canvas, navy dawn shadow, gate violet-black/cold rim.
  Yard: dusty ochre and warm brown by lamplight, deep blue night beyond; first light sky blue at end.
  All panels clean warm-black contours, flat cel colour and hard shadows. Signs and papers blank unless label UI fills them.
