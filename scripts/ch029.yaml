chapter: 29
title: Paperwork
when: "Spring. Straight on from ch 28's dawn hook at the Ryu yard; Mangwon late that morning; the bridge-boss planning session that afternoon. Before the Friday contract allocation. No calendar date is lettered."
story_beats: PART_ONE_BEATS.md#29
cast:
  taeo: outdoor # Navy zip jacket over black hoodie, black cargos, black sneakers with one white stripe; mole under RIGHT eye. Purple recoil bruise on RIGHT forearm, covered until P46. Olive backpack, faded orange OLD shield-and-open-door patch; cracked dark grey phone, dinosaur sticker.
  nib: default # Adult, 105 cm; LEFT ear V-notch, LEFT lower fang, brown rope belt, pouch RIGHT with green dinosaur sticker, brown wooden sheath LEFT; barefoot. Binoculars always present, matte black 8x30, black strap knotted at LEFT neck, fork on hinge. Shorts mended at P31–P34.
  orrin: default # Adult stoneback, 230 cm long, shell height 135 cm, stacked slate shell, four columnar legs with three blunt nails each; no pet gear or harness. His arrival card is his own.
  minho: default # Brown survey jacket, grey tee, olive cargos, black knee pads, brown boots; grey streak LEFT temple, chest radio, watch LEFT wrist.
  haein: default # Jaw-length black bob, slate-blue bib overalls, beige tee, brown tool belt, clear safety glasses on crown except during tool work.
  sejin: default # Cropped hair, sage scrubs, olive medic rig, charcoal cargos, dark boots; paid safety officer, not an unpaid guest.
  seonhee: default # 55; moss-grey cardigan, cream work shirt, slate trousers, brown shoes, low bun with grey temples, glasses, pencil behind LEFT ear. Recovering from ch 23's collapse.
  dami: default # 19, small wiry adult; short low ponytail, grey hoodie, many-pocketed faded ochre hi-vis vest, olive cargos, brown gloves, dull yellow hard hat. No GO FIRST patch.
  bluebird_collector: default # About 40; charcoal navy suit, open blue-grey collar, no tie; tablet LEFT hand, exactly two broad windbreaker crew behind him.
  granny_moon: default # Elderly, 190 cm, grey skin, long swept-back pointed ears, silver low bun, pale sage eyes, moss cardigan, cream shirt, oatmeal two-pocket apron, charcoal trousers, brown slippers, glasses on dark cord.
  chae: default # TTOK attachment only; not physically present.
extras:
  bluebird_office: "An unseen office employee, heard only through the collector's phone. Clipped and matter-of-fact."
  porters: "Six adult porters accompanying Dami, varied builds and ages, worn muted yellow-green work vests, scuffed boots, empty shoulder straps; no weapons, no guild patches."
props:
  cards: "Nib's pale-blue arrival ID, and Orrin's pale-blue arrival ID from ch 25. Distinct portraits; all print blank until a label entry supplies it. Never equipment tags."
  binoculars: "Nib's matte black 8x30 porro-prism pair, black woven strap knotted at LEFT neck, Kett's three-line fork scratched on the hinge."
  sewing: "Moon uses charcoal thread and a small charcoal cloth backing to reinforce the split seam at Nib's RIGHT outer thigh, below the pouch. This repair remains visible thereafter."
locations: [ryu_practice_yard, mangwon_street, moon_laundromat]
location_notes:
  ryu_practice_yard: "Use locations/ryu_practice_yard/key_wide.png and key_reverse.png: south double gate, southwest GREY office container, central fixed plywood maze, targets on north fence, west trestle. Keep ch 28's added home container/workshop in their established positions; frame tightly rather than inventing or relocating them. Office access ramp may sit outside this crop. Last van begins southeast facing west, then is towed away. No gate anomaly at the yard."
  mangwon_street: "Use the drawn alley key for brick walls, meters and wires; show a stretch of the walk to Moon's, not Taeo moving back into the key's obsolete villa. Daylight variant."
  moon_laundromat: "Follow both drawn keys: south glass entry southeast, corner window southwest with half-lowered blind and folding table, four washers west, two stacked dryers east, north service counter/sink and northeast staff door. The fresh carving goes on the projecting wooden lip of the NORTH service counter. Do not expose an older matching carving: that reveal belongs to ch 76."
palette_notes: "Yard: A4 dusty ochre, warm brown shadows, pale sky blue; dawn starts cool and warms. Laundry: muted cream/teal, warm dome lamps, soft daylight at south window, brown shadows. No supernatural light in the standoff. Link demonstration: separate amber and slate-green in Taeo's RIGHT palm only; never a blended colour. Flat cel rendering, warm near-black ink, no decorative particles or bloom."

panels:
  # THE TWO CARDS
  - id: P01
    shape: wide
    gap: none
    bg: white
    camera: "low from inside the south vehicle gate, looking past Orrin toward the collector"
    art: >
      Continue ch 28's dawn standoff at ryu_practice_yard. Orrin's intact stacked-slate shell fills the lower
      right foreground, his head turned back with patient anger. Bluebird_collector stands beyond him:
      lean Korean man about forty, neatly parted black hair, charcoal navy suit, pale blue-grey open-collar
      shirt, black shoes, no tie; dark tablet in LEFT hand, phone in right. Exactly two broad men in plain
      charcoal windbreakers wait behind him. A recovery truck blocks the street beyond the south gate.
      Cool dawn from east, ochre ground and brown shadows. Devices dark, badges blank, no weapons or lettering.
    calm: top
    lines:
      - {who: bluebird_collector, type: speech, side: l, text: "SHOW ME THE PAPERWORK."}
    notes: "Exact ch 28 hook pickup, not a new encounter. The last Ryu van is still southeast in the yard."

  - id: P02
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "extreme close-up at belt height on Nib's hand lifting a card"
    art: >
      Nib's scarred olive-green hand lifts his pale-blue ID from the RIGHT-hip pouch at ryu_practice_yard.
      The small green dinosaur sticker on its flap, brown rope belt and edge of charcoal shorts establish
      whose hand this is. The card bears his portrait as a simple image; every printed field stays blank.
      His black binocular barrels hang at the upper crop, strap in place. Cold east dawn catches the card's
      edge; muted brown ground behind. Five fingers, proper grip; no glowing card or readable print.
    calm: none

  - id: P03
    shape: inset-l
    gap: short
    bg: white
    camera: "Nib's eye level, front three-quarter, the card held beside his face"
    art: >
      At ryu_practice_yard Nib holds his own ID beside his weathered adult face, unimpressed. LEFT ear
      V-notch, one LEFT lower fang, spiky black hair and amber eyes; default pinkish-tan wrap top,
      binoculars on chest with knot at LEFT neck. He looks up at the collector rather than at us.
      Pale dawn from the right, flat ochre background, brown cel shadow. Card print blank. No cute proportions,
      extra teeth or interface light; leave the right gutter free.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "MINE."}

  - id: P04
    shape: wide
    gap: short
    bg: white
    camera: "side-on at Orrin's head height, Nib between Orrin and the collector"
    art: >
      Nib raises a second pale-blue card at ryu_practice_yard: Orrin's broad adult face is its portrait.
      Orrin lowers his real face beside it, heavy-lidded olive eyes fixed on the collector with dry patience.
      Nib's default belt equipment and bare feet are visible; the collector's suit sleeve enters from left.
      The grey southwest office container is simplified behind them, east dawn along Orrin's slate layers.
      Ochre/brown A4 yard palette. Blank card fields, no collar, tether, saddle, cracks or drawn words.
    calm: top
    lines:
      - {who: nib, type: speech, side: c, text: "HIS."}
      - {who: orrin, type: speech, side: r, text: "I SAID HE COULD HOLD IT."}

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 29 · PAPERWORK"

  - id: P06
    shape: full
    gap: long
    bg: white
    camera: "establishing from the south gate toward the fixed plywood maze"
    art: >
      Ryu_practice_yard, drawn key geography: grey office southwest at image left, last white van southeast
      at right facing west, fixed plywood maze central, three targets north, west equipment trestle.
      Bluebird's two helpers stand between van and gate; their lead faces Nib and Orrin. Taeo, navy jacket
      over hoodie, has hurried out with his olive patched backpack half on. Minho in brown work jacket
      stands by the van. Seonhee, about fifty-five, grey-templed low bun, glasses, pencil behind LEFT ear,
      moss-grey cardigan and cream rolled-sleeve shirt, slate trousers and brown shoes, grips the office
      doorframe, tired but upright. East dawn, dusty ochre and brown shadows. All notices blank, no extra vans.
    calm: top
    lines:
      - {who: narr, type: tag, text: "RYU SURVEY YARD · DAWN"}
      - {who: bluebird_collector, type: speech, side: r, text: "THE INVENTORY CHECK LISTED A LARGE CONSTRUCT."}
      - {who: minho, type: speech, side: l, text: "YOUR INVENTORY CHECK WAS WRONG."}

  - id: P07
    shape: narrow-r
    gap: short
    bg: white
    camera: "close on the collector lowering his eyes to both cards"
    art: >
      Bluebird_collector at ryu_practice_yard examines the two cards held just below frame, his professional
      smile tightening into a working frown. Suit open collar, no tie; tablet clamped under LEFT forearm,
      phone low in right hand with dark screen. One helper's charcoal shoulder behind him, east dawn across
      his cheek. Cool grey-blue suit against muted ochre. No menace face, weapons or readable device display.
    calm: left
    lines:
      - {who: bluebird_collector, type: speech, side: r, text: "ARRIVAL CLASSIFICATION. BOTH OF THEM?"}
      - {who: nib, type: speech, side: l, text: "BOTH OF US."}

  - id: P08
    shape: wide
    gap: short
    bg: white
    camera: "over the collector's shoulder toward Taeo and Orrin"
    art: >
      At ryu_practice_yard Taeo stands beside Orrin, not in front of his face, bringing his phone up with
      an exhausted, controlled politeness. Navy jacket sleeves cover his forearms; mole under RIGHT eye,
      olive backpack old orange patch outward. Orrin's jaw is set. Nib keeps the cards raised below them.
      East dawn lights the right side of their faces, warm brown shadows on the ochre ground. Phone angled
      away with no visible display; no cyan windows, chains or ownership gestures.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "MS. CHAE SENT THE CLASSIFICATION RECORD. I'LL FORWARD IT."}
      - {who: orrin, type: speech, side: r, text: "TO MY PHONE AS WELL. WHEN I HAVE ONE."}
      - {who: taeo, type: speech, side: l, text: "YES. SORRY."}

  - id: P09
    shape: narrow-l
    gap: short
    bg: white
    camera: "kit phone hand, front on"
    art: "KIT HAND"
    calm: none
    ui:
      - {kind: phone.ttok_chat, on: screen, hand: taeo_right_front, title: "Chae Yuri · AAO", messages: [{from: them, text: "Both arrival classifications are active. Their IDs identify persons. They are not registered equipment.", time: "06:18"}, {from: them, text: "Attached: classification records. You can show these if needed.", time: "06:18"}]}
    notes: "Chae's existing arrival-law protection from ch 9 and ch 25 holds. This is fictional in-world paperwork, no new hearing or new status."

  - id: P10
    shape: wide
    gap: short
    bg: white
    camera: "profile on the collector at the open gate, helpers at the depth of the frame"
    art: >
      Bluebird_collector phones his office at ryu_practice_yard, right hand to ear, tablet LEFT. His head
      tips toward the phone in automatic deference, composed but irritated at the delay. Behind him one
      helper reaches toward a loose recovery strap by the truck, the other watches the white van.
      Dawn street light is cool; the yard is dusty ochre, charcoal silhouettes with hard brown shadows.
      Phone screen turned inward. No readable truck branding or threatening tools.
    calm: top
    lines:
      - {who: bluebird_collector, type: speech, side: l, text: "THEY HAVE ARRIVAL IDS. I'VE SENT YOU THE RECORDS."}
      - {who: bluebird_collector, type: speech, side: l, text: "YES. I'M CHECKING BEFORE WE LOAD."}

  - id: P11
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "ground level looking along the loose strap toward approaching work boots"
    art: >
      At the south entrance of ryu_practice_yard a loose flat recovery strap lies on ochre dirt. A helper's
      dark shoe is behind it. From the street, several pairs of scuffed work boots stop in a line across
      the open gate; nearest are Dami's olive cargo cuffs and brown boots. No hand touches the strap and
      no feet tread on anyone. Cool dawn at ground level, long brown shadows. No trap, weapon or lettering.
    calm: none

  - id: P12
    shape: wide
    gap: short
    bg: white
    camera: "from beside Nib toward Dami arriving through the south gate"
    art: >
      Dami arrives at ryu_practice_yard with six adult porters, empty-handed except their rolled cargo
      straps. Her short low ponytail, grey hoodie, worn many-pocketed ochre hi-vis vest, dull yellow hard
      hat and brown gloves match her sheet; small adult proportions, chin held high. She faces the collector
      while Nib turns one notched ear toward her. The porters' tired faces are matter-of-fact, not a mob.
      East dawn, muted ochre/yellow-green workwear, brown shadows; no GO FIRST patches or weapons.
    calm: top
    lines:
      - {who: dami, type: speech, side: r, text: "MORNING. WE'RE EARLY FOR WORK."}
      - {who: bluebird_collector, type: speech, side: l, text: "THIS ISN'T YOUR SITE."}
      - {who: dami, type: speech, side: r, text: "HE WAS AT OURS."}
    notes: "Dami reciprocates the Guro rescue. No porter fund exists yet. Seven porters total including her."

  - id: P13
    shape: tall
    gap: short
    bg: white
    silent: true
    camera: "high from the southwest office corner, looking down on the human wall"
    art: >
      At ryu_practice_yard Dami and six porters form a shoulder-to-shoulder human wall between Orrin and
      the two Bluebird helpers. Their hands stay down. Leave a clear lane from the last white van to the
      south gate: they are protecting a person, not blocking the vehicle seizure. Nib stands at Orrin's
      head with the cards; Taeo is one pace beside them, stunned by the support. Fixed maze and grey
      container retain their key positions. Dawn east light, ochre and brown with muted workwear. No fists,
      chains, placards, glowing eyes or text.
    calm: none

  - id: P14
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up on Taeo from the porters' side"
    art: >
      Taeo at ryu_practice_yard looks past camera at Dami's line, one hand still gripping his backpack
      strap. His polite expression has fallen away into startled, painful gratitude; mole below RIGHT eye,
      navy jacket collar high. Dawn from right, one hard blue-grey shadow under his brow, background reduced
      to warm ochre. No tears as decoration, no phone display or windows.
    calm: left
    lines:
      - {who: taeo, type: float, text: "I HADN'T KNOWN WHO TO CALL."}

  - id: P15
    shape: wide
    gap: short
    bg: white
    camera: "eye level along the porters' line, collector foreground left"
    art: >
      Bluebird_collector, phone still at right ear, addresses Dami across the clear van lane at
      ryu_practice_yard. Dami's shoulders are square; the older porter beside her keeps his empty work
      gloves folded together rather than clenching them. Orrin behind the line watches carefully. East dawn,
      muted charcoal against A4 ochre ground, hard brown shadows. Blank tablet; no physical confrontation.
    calm: top
    lines:
      - {who: bluebird_collector, type: speech, side: l, text: "WE HAVE AN ORDER FOR THE VAN."}
      - {who: dami, type: speech, side: r, text: "THEN TAKE THE VAN."}
      - {who: dami, type: speech, side: r, text: "HE'S NOT IN IT."}

  - id: P16
    shape: strip
    gap: short
    bg: white
    camera: "close on the collector's ear and phone, Nib's two cards in lower foreground"
    art: >
      Tight crop at ryu_practice_yard: Bluebird_collector listens, professional smile gone, right hand
      holding the phone correctly. In the lower foreground Nib's two pale-blue cards remain steady in
      olive-green fingers; faces visible, fields blank. Pale morning sky lights the collector's ear,
      ochre reflected light under the hand. Screen faces inward, no text or interface glow.
    calm: top
    lines:
      - {who: bluebird_office, type: phone, side: r, text: "ARRIVAL RECORDS CONFIRMED. EXCLUDE BOTH PERSONS."}
      - {who: bluebird_office, type: phone, side: r, text: "PROCEED WITH THE VEHICLE."}

  - id: P17
    shape: wide
    gap: short
    bg: white
    camera: "reverse from behind the porters toward the recovery truck"
    art: >
      At ryu_practice_yard the collector lowers the phone and gives one small, precise gesture toward
      the white van. His two helpers turn away from Orrin. The porters remain in place, shoulders only
      beginning to ease. Minho stands by the driver's door with the key in his open hand, jaw tight.
      South street behind, east dawn warming the ochre dirt. Truck signage and tablet blank; no triumph pose.
    calm: top
    lines:
      - {who: bluebird_collector, type: speech, side: r, text: "JUST THE VEHICLE."}
      - {who: minho, type: speech, side: l, text: "THAT WAS ALREADY TOO MUCH."}

  - id: P18
    shape: inset-l
    gap: short
    bg: white
    silent: true
    camera: "close on Nib returning Orrin's card beside his forefoot"
    art: >
      Nib crouches at Orrin's LEFT forefoot in ryu_practice_yard and slides Orrin's card into a small
      plain document envelope resting on the dry ground within Orrin's reach. He looks up first to check
      Orrin has seen it; Orrin dips his head. Nib keeps his own card in his hand. Dawn light on grey slate
      and olive skin, brown ground shadow. No pouch attached to Orrin, no readable envelope or comic cuteness.
    calm: none

  - id: P19
    shape: full
    gap: long
    bg: white
    camera: "from inside the yard through the south gate as the van rolls away"
    art: >
      The LAST white Ryu van is hauled through ryu_practice_yard's south gate behind the recovery truck,
      facing west as its front is drawn toward the street. Blue repossession sticker stays a plain rectangle.
      The porters have stepped clear. Minho's empty hand hangs where the key was; Seonhee stands at the
      grey southwest office door behind him, rigid. Orrin and Nib stay inside the fence. Dawn now pale
      blue, ochre ground with long brown shadows. No other vans or vehicle magically left in the yard.
    calm: top
    lines:
      - {who: taeo, type: float, text: "WE KEPT ONE PERSON. WE LOST THE LAST VAN."}
    notes: "Bluebird leaves with the van, never Orrin. Ryu now has zero vans. No invented auction credit or debt reduction."

  - id: P20
    shape: narrow-r
    gap: short
    bg: white
    silent: true
    camera: "close on Seonhee's hands at the office doorway"
    art: >
      At the grey office door of ryu_practice_yard, Seonhee's cream rolled cuffs frame work-worn hands.
      One hand had been holding a van key-hook board inside the doorway; it lowers now, every hook empty.
      The other rests flat on the jamb until its knuckles lose their whiteness. Morning east light,
      muted grey metal and warm brown wood. No labels on the hooks, no new collapse or injury.
    calm: none

  - id: P21
    shape: wide
    gap: short
    bg: white
    camera: "medium two-shot at Orrin's head height, Dami passing him"
    art: >
      At ryu_practice_yard Dami breaks the line and heads toward the gate, rolling her shoulders under
      her many-pocketed vest. Orrin lowers his face to her level, awkwardly solemn. Nib beside him has
      put his ID safely away. Minho in the background begins folding the van's old ground chock into
      the equipment stack. Cool morning sun, ochre/brown with muted workwear. No handshake requiring
      Orrin's feet to become hands, no new money or drawn print.
    calm: top
    lines:
      - {who: orrin, type: speech, side: l, text: "THANK YOU FOR STANDING THERE."}
      - {who: dami, type: speech, side: r, text: "I STAND FOR A LIVING."}
      - {who: dami, type: speech, side: r, text: "NICE TO CHOOSE WHERE."}

  - id: P22
    shape: inset-r
    gap: short
    bg: white
    camera: "close on Nib watching the departing porters, profile"
    art: >
      Nib at ryu_practice_yard watches Dami go, adult face serious, LEFT ear notch in profile, binoculars
      high on his chest. His scarred hand reaches into his RIGHT pouch. The morning sun is warmer now,
      brown cel shadow under his cheek; flat ochre background. Belt and wooden sheath retain their sides.
      No pet expression or extra objects.
    calm: left
    lines:
      - {who: nib, type: speech, side: r, text: "YOU MISSED BREAKFAST."}

  - id: P23
    shape: wide
    gap: short
    bg: white
    camera: "eye level beside the south fence, Nib offering a wrapped rice ball"
    art: >
      Nib offers Dami one plain paper-wrapped rice ball from his pouch at ryu_practice_yard. Dami looks
      down at it with an exhausted, surprised half-smile, reaching with a gloved hand. Taeo behind Nib
      looks suddenly anxious about the provenance of his breakfast. All in established clothes, clear
      sun from east, ochre and brown, pale wrapping the bright note. No readable packaging or cute Nib.
    calm: top
    lines:
      - {who: dami, type: speech, side: r, text: "THAT YOURS?"}
      - {who: nib, type: speech, side: l, text: "HIS."}
      - {who: taeo, type: speech, side: c, text: "YES. PLEASE HAVE IT."}

  - id: P24
    shape: inset-l
    gap: short
    bg: white
    style: chibi
    camera: "chibi pocket gag, flat stage"
    art: >
      CHIBI comedy at ryu_practice_yard reduced to flat ochre screentone. Chibi Dami tucks the rice ball
      into one of her vest's many pockets with a solemn nod; chibi Nib stares at the pocket with line
      eyes and profound professional envy. His LEFT notch, brown rope belt, RIGHT pouch/sticker, LEFT
      wooden sheath, bare feet and black binoculars remain identical. Chibi Taeo's empty breakfast wrapper
      droops in his hand, one waterfall tear. Simple east-light cel shadow; no lettering or additional food.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "A FOOD POCKET."}
      - {who: dami, type: speech, side: r, text: "THEY'RE ALL FOOD POCKETS IF YOU'RE BRAVE."}
    notes: "Comedy only after Orrin is safe; pocket runner, not a joke at the seizure's expense."

  # AN ERRAND, A REPAIR, A MARK
  - id: P25
    shape: full
    gap: long
    bg: white
    camera: "establishing across a Mangwon lane, Taeo and Nib walking toward the laundromat"
    art: >
      Late-morning mangwon_street, using the drawn brick lane, gas meters, drainpipes and overhead wires
      without showing the obsolete villa as a current home. Taeo in navy jacket and patched olive backpack
      carries a cloth bag of workshop laundry; Nib in default gear walks beside him, binoculars bouncing
      slightly, bare feet deliberate. Nib's RIGHT outer-thigh seam catches on a projecting laundry pin
      at the bag's edge; he frees it with a resigned look. Pale daylight, brick-grey palette with brown
      shadows. Shop signs blank, no active advertising screens or new tear elsewhere.
    calm: top
    lines:
      - {who: narr, type: tag, text: "MANGWON · LATE MORNING"}
      - {who: taeo, type: speech, side: l, text: "SORRY. ONE ERRAND. THEN BACK TO THE PLAN."}
      - {who: nib, type: speech, side: r, text: "TWO. YOUR BREAKFAST."}

  - id: P26
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "through the laundromat corner window, Moon's beckoning hand at Nib's height"
    art: >
      At moon_laundromat's southwest corner window, Granny Moon's long grey hand lifts the half-lowered
      blind only a little and beckons with two fingers. Through the glass Nib's weathered face turns,
      LEFT ear notch clear; he recognizes her watchful gaze above the hand. Warm dome light inside,
      pale daylight outside, cream/teal and brown shadows. No readable window notices or mark on the table.
    calm: none
    notes: "PAYOFF P04 begins: ch 5's watching laundress now initiates contact. Her language and history stay unrevealed."

  - id: P27
    shape: full
    gap: short
    bg: white
    silent: true
    camera: "from the southeast entrance toward the northwest, matching the laundromat wide key"
    art: >
      Moon_laundromat, match key_wide: folding table and corner window front left, four separate washers
      west, two stacked dryers east, north service counter and sink, northeast staff door. Granny_moon,
      elderly and 190 cm, grey-skinned with swept-back pointed ears, silver low bun, pale sage eyes, moss
      cardigan, cream shirt, oatmeal two-pocket apron, charcoal trousers and brown slippers, bends to inspect
      Nib's split RIGHT shorts seam. Reading glasses on dark cord. Nib remains wary but still; Taeo sets
      the cloth laundry bag on the front table. Warm dome lamps plus south daylight, cream/teal palette,
      brown shadows. Lower-left plain for nameplate. Displays dark; no text, older marks or magical effects.
    calm: top
    intro: "GRANNY MOON · MANGWON LAUNDROMAT"

  - id: P28
    shape: wide
    gap: short
    bg: white
    camera: "from the folding table along the aisle, Moon pointing to the staff door"
    art: >
      At moon_laundromat Granny Moon holds a folded clean cream towel out to Nib and indicates the closed
      northeast staff door with an open hand. She has a small sewing tin ready on the north counter.
      Nib, binoculars against his wrap top, understands and gives one wary nod. Taeo looks down into the
      cloth bag, deliberately allowing privacy. Warm lamps, cream tiles, muted teal trim, brown shadows.
      No speech from Moon, no changing clothes on camera, all equipment dark and signs blank.
    calm: top
    lines:
      - {who: nib, type: speech, side: r, text: "THEY STILL WORK."}
      - {who: taeo, type: speech, side: l, text: "THE HOLE HAS ITS OWN HOLE."}

  - id: P29
    shape: narrow-r
    gap: short
    bg: white
    silent: true
    camera: "medium close beside the north service counter after the offpanel change"
    art: >
      At moon_laundromat Nib is seated on the existing stool brought from the front table, wearing his
      normal wrap top and a securely wrapped knee-length cream towel. Brown rope belt with RIGHT pouch
      and LEFT wooden sheath rests visibly across his lap, binoculars stay round his neck. His shorts
      are in Moon's hands. He sits straight-backed, embarrassed but dignified, studying a washer door
      instead of her face. Dome light from above, cream/teal and warm brown. No nudity, underwear,
      cute body, readable machine controls or additional garments.
    calm: none

  - id: P30
    shape: strip
    gap: short
    bg: white
    silent: true
