      the ch 58 reservoir under taeo's hands on its cart above her. Her brows pull together in technical fear,
      one hand reaching up to stop an overcharge she cannot physically reach. White overhead light,
      slate-blue background; no made-up digital gauge or printed warning in art.
    calm: right
    lines:
      - {who: haein, type: speech, side: l, text: "IT'S ALREADY HOT FROM THE FINAL."}
      - {who: taeo, type: speech, side: r, text: "I KNOW."}
