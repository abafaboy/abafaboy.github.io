    calm: top
    sfx:
      - {text: "KLANG", style: impact, at: [0.28, 0.37], size: L, rot: -18}

  - id: P30
    shape: inset-r
    gap: short
    bg: white
    silent: true
    camera: "close down onto the saved operator across Orrin's shell"
    art: >
      cameraman lies supported across orrin's slate shell in exhibition_arena, eyes open behind
      intact glasses, all limbs accounted for, breathing in shocked relief. Orrin turns his adult
      sagging face to check him. White worklight, muted slate and olive shadows. Camera safely on
      the adjacent floor; no blood, broken bones, smile for a lens or saddle.
    calm: none

  - id: P31
    shape: tall
    gap: none
    bg: white
    camera: "from below the stage lip as Taeo's knees give out"
    art: >
      taeo (outdoor) at exhibition_arena folds to his knees, hands slipping off the cart-mounted reservoir.
      minho catches his shoulder before his head can strike the stage; haein steadies the dead device
      on its cart. New purple bruising rises on both forearms and a thin red nosebleed marks his upper lip.
