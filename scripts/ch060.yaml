chapter: 60
title: Saturation
when: "The exhibition final and award ceremony day, immediately after ch 59. The rescue takes seconds; assessment and dressing take about fifteen minutes. No new date or weekday is lettered."
story_beats: PART_ONE_BEATS.md#60
cast:
  taeo: outdoor # Navy zip jacket over black hoodie, black cargos, black low sneakers with one white stripe. Light RIGHT-forearm wrap already present from ch 59. Reservoir on Haein's low grey cart at lectern LEFT, within reach. Backpack transferred from shoulder to equipment table at P06. Fresh bilateral forearm bruising and a nosebleed at P31; white forearm dressings and a small dressing below the nose from P40. One mole under anatomical RIGHT eye.
  nib: default # Ch 43 matte dark-brown ankle leather work boots, broad round toes, four pairs dull gunmetal eyelets, double-knotted brown round laces, plain black low-heel lug soles, heel tabs and oat-grey socks inside collars; never revert to the barefoot model. V-notch LEFT ear, one lower LEFT fang, brown rope belt, dinosaur-sticker pouch RIGHT, brown wooden sheath LEFT. Matte black 8x30 binoculars, strap knot LEFT neck, Kett's mark on hinge. ID, folded PAPER drawing and cobalt-blue marked pencil stay in pouch.
  orrin: default # Adult stoneback, 230 cm long, shell 135 cm high, four columnar legs with three blunt nails each. Slate shell; carry forward any visible repaired ch 37 fracture. No harness or saddle.
  sera: default # River-green wrap over cream short sleeves, sand cropped trousers, brown boots, long brown braid. Bracer LEFT, bow in LEFT hand when carried, quiver RIGHT shoulder, bone flute RIGHT hip. Bow unstrung/slung during ceremony; no shot in rescue.
  haein: default # Slate-blue bib overalls, beige tee, brown tool belt, glasses on crown until she examines the broken reservoir.
  sejin: default # Sage scrub shirt, olive medic rig, charcoal cargos, work boots. Freelance safety officer, not a volunteer.
  minho: default # Brown work jacket, grey tee, olive cargos, knee pads, work boots. Grey streak LEFT temple, radio LEFT chest, watch LEFT wrist.
extras:
  host: "Exhibition host, Korean adult man, short side-parted black hair, neat navy suit over pale shirt, dark shoes, small lapel mic, cue cards left blank. His polished smile becomes practical alarm. Match ch 59 host."
  cameraman: "Press camera operator, Korean man about 45, close-cropped black hair, square glasses, slate work vest over grey tee, black trousers, trainers, press lanyard with blank badge. Adult ordinary working build. Shoulder camera has a plain black body and grey padded strap."
  technician: "Venue technician, Korean woman about 30, tied-back black hair, black work shirt, dark cargos, orange utility belt, headset."
  ryu_crew: "Ryu Survey's established stocky man in his forties and young woman, red-orange safety vests over muted work clothes, dark boots; no new names."
  crowd: "Mixed spectators and press; only a small identifiable pocket continues the mocking chant. Other spectators react with fear, concern or uncertainty. Phones dark or abstract blocks."
locations: [exhibition_arena]
location_notes:
  exhibition_arena: "No drawn key in the available set. MATCH ch 59 exhibition_award_stage: low platform, broad shallow ramp audience-LEFT, central lectern, press pit audience-RIGHT behind waist-high rail. Orrin begins at the ramp foot near the press pit as ch 59's hook frames him. Haein's low grey reservoir cart starts at lectern LEFT within Taeo's reach. Direction words below describe local camera/ramp side, not new compass geography; never mirror ch 59. Added detail: operator's small camera rostrum at press rail, 1.5 m above pit floor. Short overhead truss's camera-side end drops, intact far safety stays attached, fallen end lodges on vacated rostrum rail. Haein rolls reservoir cart to adjacent stage edge as Taeo crouches there. Folding medical screen later erected beside ramp."
props:
  reservoir: "The SAME store-and-release prototype used in ch 50–58, on ch 59's low grey demonstration cart; match casing, fittings and controls exactly. Taeo grips controls while cart supports weight, never wears a newly invented bracelet. Physical WHITE indicator tab rises in its slot beside ivory ceramic inspection window; dull-steel rectangular housing, split copper band, two capped ports and grey hand strap. No luminous reservoir effect. Holds a mechanical slice for no more than 0.8 seconds; capacity and hold time are separate limits. At P28 housing cracks and retaining fitting separates; by P30 permanently inert. Haein bags removable broken housing and fitting; cart stays with venue equipment. No self-repair or spare working unit."
  microphone: "The same plain black handheld mic in Taeo's hand at ch 59's hook. Dropped onto the stage at P12; rolls to the ramp foot at P32. Retrieved at P51. No second microphone is substituted."
palette_notes: "Arena extends A4's clean blue-white institutional key: white worklights above, light-slate hard shadows, muted navy crowd. Decorative show lighting is stopped during rescue. Danger red is limited to the rig's small warning lamp and Taeo's nosebleed. Orrin's permitted link pulse is slate-green; Nib's amber appears only in his eyes here, not in a false link. All art uses warm near-black variable line weight and flat cel shadows; no bloom, glossy skin or ornamental particles. No readable print, bubbles, SFX or interface baked into art; all badges and boards blank."
panels:
  - id: P01
    shape: wide
    gap: none
    bg: white
    camera: "from the stage's ramp-side wing across Taeo toward the stands"
    art: >
      exhibition_arena, continuous from ch 59. taeo (outdoor) stands with the black mic held at chest height,
      shoulders drawn inward, tired polite smile failing. A pocket of spectators beyond cups hands around mouths;
      nearby people look embarrassed. White overhead worklights, blue-white key and slate shadows. Keep upper
      stage backdrop plain and the equipment-grant board blank; light RIGHT-forearm wrap visible,
      navy jacket over hoodie, backpack still on shoulder. No readable print or drawn lettering.
    calm: top
    lines:
      - {who: crowd, type: shout, side: r, text: "HIS SUMMONS GO FIRST!"}
      - {who: taeo, type: float, text: "I HAD A SPEECH. MOSTLY THANK YOU."}
    notes: "Start exactly on ch 59's listed hook. ₩150,000,000 is an equipment grant already awarded, not new cash here. ch059.yaml was absent at the start of this batch."

