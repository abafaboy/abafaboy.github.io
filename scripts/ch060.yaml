    calm: top
    lines:
      - {who: host, type: phone, side: r, text: "ONE MOMENT, PLEASE."}
    notes: "Host uses the PA. Carry ch 59 positions; backpack is set down now. Rig end nearest camera operator falls. Far safety stays attached; whole roof is not collapsing."

  - id: P07
    shape: wide
    gap: short
    bg: white
    camera: "medium from stage level, Taeo between the host and the ramp-side wing"
    art: >
      taeo (outdoor) in exhibition_arena glances toward his crew, tightening his grip on the mic, eyes
      caught between anger and embarrassment. host holds his blank cue cards against his ribs and waits.
      The grant board behind is blank, olive backpack visible at the far ramp-side table. White top light,
