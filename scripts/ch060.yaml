    calm: top
    sfx:
      - {text: "DUMMM", style: impact, at: [0.48, 0.81], size: XL, rot: 0}
    notes: "PAYOFF P14: Taeo fires the banked slice through Orrin along the agreed downward line, braking the landing with Orrin's crouch. A defensive precursor in contact, not a remote force field. Bank/release sequence remains within 0.8 seconds."

