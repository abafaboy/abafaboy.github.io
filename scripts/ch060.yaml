    calm: none
    sfx:
      - {text: "KRAK", style: impact, at: [0.57, 0.49], size: L, rot: -9}
    notes: "PAYOFF P14: permanent physical failure, visible and costly. The final released impulse has happened; the dead unit cannot keep cushioning anything."

  - id: P29
    shape: wide
    gap: none
    bg: white
    camera: "from the far-side aisle back toward the empty ramp-side rostrum"
    art: >
      exhibition_arena, the dark truss end crashes onto the now-vacant ramp-side camera-rostrum rail and
