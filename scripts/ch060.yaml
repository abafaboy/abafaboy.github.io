    shape: strip
    gap: none
    bg: white
    camera: "extreme close-up on the reservoir's inspection portion at capacity"
    art: >
      exhibition_arena, reservoir from ch 58 has its WHITE tab pinned at the top of the mechanical slot;
      the first hairline fracture races through the adjacent casing and one retaining fitting bows.
      Taeo's five-finger grip is rigid, black cuff at edge. White worklight, hard slate-grey shadows.
      Leave a plain area beside the device for an editorial label. No readable meter or UI drawn in.
    calm: none
    ui:
