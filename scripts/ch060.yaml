    shape: full
    gap: short
    bg: white
    camera: "high establishing angle from the ramp-side stands onto stage, ramp and pit"
    art: >
      exhibition_arena rescue geography in one readable view: taeo at the central stage lectern with mic, reservoir on its cart;
