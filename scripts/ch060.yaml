    calm: top
    lines:
      - {who: taeo, type: nervous, side: l, text: "SORRY. IS THIS THE PART WHERE I THANK THE MICROPHONE?"}
      - {who: host, type: speech, side: r, text: "PEOPLE, USUALLY."}

