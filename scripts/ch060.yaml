    calm: top
    lines:
      - {who: sejin, type: shout, side: l, text: "TAEO. HANDS OFF THE UNIT."}
    notes: "Taeo collapses from recoil, conscious but unable to stand safely. The rescue causes no injury to the operator, spectators or companions; Taeo's recoil injuries are the stated exception."

  - id: P32
    shape: strip
    gap: long
    bg: white
    silent: true
    camera: "floor-level on the microphone at the foot of the ramp"
    art: >
      The dropped black mic finishes rolling against the foot of exhibition_arena ramp.
      In the distance sejin kneels beside taeo while minho supports him, bodies reduced to readable
      silhouettes. White ceiling light, slate-grey floor, one hard mic shadow. No disconnected cable,
      text, comic face or ornamental debris.
    calm: none
