      one fine metallic shaving separates. The short lighting truss hangs below, out of focus only by simplified
      drawing, never optical blur. White lamp at frame left cuts a hard edge on grey metal; slate shadow.
      No sparks, fire, readable inspection tag or diagram.
    calm: none

