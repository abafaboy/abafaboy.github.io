    notes: "PAYOFF P14: capacity is reached before even the 0.8-second hold limit can be useful. This is saturation, not an upgrade or a longer storage time."

  - id: P26
    shape: wide
    gap: none
    bg: white
    camera: "front on Taeo with Haein below at the ramp"
    art: >
      haein at exhibition_arena ramp points at the failing housing, face white with recognition;
      taeo above her turns the manual release with a grimace, shoulders shaking. Correct overalls
