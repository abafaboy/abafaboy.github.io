      barrier aside, sera pushes two reporters far-side by their shoulders, and minho's two crew open the
      aisle beyond them. orrin turns under the ramp-side rostrum rather than following the fleeing crowd.
      cameraman rocks backward on the rostrum lip, camera pulling one shoulder. White worklights,
      blue-white deck, hard slate shadows. All screens dark; no spectral shield or magic platform.
    calm: top-right
    lines:
      - {who: sera, type: shout, side: r, text: "LEAVE THE BAGS. THIS WAY."}
