    art: >
      taeo (outdoor) in exhibition_arena leans into the cart-mounted reservoir as its WHITE indicator tab rises in
      the mechanical slot beside its ivory ceramic window, exactly as established in ch 50–58. His brow knots in pain; shoulders draw down,
      wrists held straight. White worklight, slate shadows; slate-green link stays confined to RIGHT
      palm. No ambient shield, time-stop effect, new display or legible gauge.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "BANK."}
    sfx:
      - {text: "NNNN", style: quiet, at: [0.67, 0.60], size: M, rot: 9}
    notes: "PAYOFF P14 begins: bank a bounded slice of the landing impact. The device does not absorb the whole falling man, gravity, heat or electrical current."

  - id: P24
    shape: full
    gap: none
    bg: white
    camera: "low side view at Orrin's knees, the shell lowering above them"
    art: >
      orrin at exhibition_arena bends all four stout legs deliberately, lowering his shell with the
      cameraman supported across its broad slope. ACTING: heavy-lidded concentration, mouth tight,
      no smile. His body gives the landing more stopping distance. White worklights and slate
      shadows; background escape aisle now empty. No shell fracture, straps, saddle or glowing armour.
    calm: top
    lines:
      - {who: orrin, type: speech, side: r, text: "NOW."}

