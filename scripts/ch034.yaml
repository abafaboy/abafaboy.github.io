chapter: 34
title: Surge
when: "The same night as ch 33's surge alert. Dispatch, the journey to Sinjeong, then the first minutes of the evacuation. No new calendar date or clock time is fixed."
story_beats: PART_ONE_BEATS.md#34
cast:
  taeo: outdoors # navy zip jacket, black hoodie/cargos, one-white-stripe black sneakers; olive backpack, OLD faded orange shield/open-door patch; mole under RIGHT eye
  nib: default # adult, 105 cm; LEFT ear V-notch, lower LEFT fang; brown rope belt, pouch RIGHT, brown wooden sheath LEFT; barefoot; binoculars retained
  orrin: default # adult stoneback, 230 cm long, 135 cm shell height; stacked slate shell; no clothes or harness
  minho: default # brown work jacket, grey tee, olive cargos/knee pads, brown boots; grey streak LEFT temple; chest radio, LEFT wristwatch
  haein: default # slate-blue bib overalls, beige tee, tool belt; bob, safety glasses on crown
  sejin: default # sage scrubs, olive medic rig, charcoal cargos, boots
  meridian_officer: default
  seoryun: default # olive field jacket, black tee, tactical trousers/boots; low ponytail, LEFT brow scar; CURRENT redesigned-door patch
extras:
  gma_lead: "Woman about 45, close-cropped hair, pale grey incident vest over a navy rain jacket, white helmet, tired decisive face."
  bidder_one: "Guild dispatcher heard on a speakerphone; no visible body."
  bidder_two: "Second guild dispatcher heard on a separate speakerphone; no visible body."
  ryu_crew: "Two established Ryu survey workers: stocky man in his forties and young woman, orange vests and white helmets."
  civilians: "Evacuating shop workers and customers of different ages; ordinary muted spring clothes, smoke-stained rather than blood-covered."
  rescue_team: "Seoryun's adult rescue crew in practical olive field kit; current redesigned-door emblems."
locations: [ryu_van, sinjeong_street, sinjeong_command, sinjeong_f_stair, sinjeong_arcade]
location_notes:
  ryu_van: "Established white Ryu work van; Haein rides beside Minho, Taeo and Nib behind. An equipment trailer carries consenting Orrin; restraints secure the trailer ramp, never his neck or shell."
  sinjeong_street: "New set; no drawn key exists. Fictional underground shopping arcade by Sinjeong Station, not a real station floor plan. Broad road runs east-west. GMA tent and casualty bay on NORTH pavement, 8 m WEST of F stair. Seoryun's van stops farther west. SOUTH curb is the press line. F stair opens northward through a rectangular concrete hood: 14 steps descending south to a steel fire door at the bottom. Railing on either side. A small blue child-size slip-on trainer with a white heel lies on step 9. Keep it there until ch 35 P24."
  sinjeong_command: "White pop-up command tent, folding map table, two speakerphones, rugged tablets, clipboards, cable drums. Public map is paper, all markings added as labels. Lamps cold white; red only for incident warnings."
  sinjeong_f_stair: "At street top, Taeo's radio/base box on a narrow trestle by WEST railing. White Ryu cable with blue band each metre descends along WEST edge. Door at bottom is hinged EAST and opens into a 3 m square underground landing, against its EAST wall. Steel hold-open wedge stored beside jamb. Taeo remains on street side throughout."
  sinjeong_arcade: "Beyond the fire door, service corridor F runs SOUTH 20 m to a T: pharmacy WEST, food court EAST. A second dogleg north of the pharmacy rejoins F. F has grey tile, cream upper walls, exposed overhead pipes, low red emergency lamps. All seven gates remain deeper than F's first landing: three food court, four shopping corridors. They are vertical black-violet slits with cold rims, never portals covering every doorway."
palette_notes: "Night exterior: concrete blue-grey, navy shadows, cold rescue work lights; warning red sparingly. Arcade: smoke-grey and violet shadow, emergency lamps as hard red shapes. Wrong lavender sky visible only within gate slits. No decorative haze: smoke has a physical source in damaged kitchen ducts. Flat cel colour, warm near-black varied ink."
continuity_notes: "No one in this batch crosses into a dungeon: these are street-side rescue corridors distorted by a surge. No new return marks. Ryu's relay cable is laid for the threshold interference and has grey tripod relays every 50 m. Nib retains paper drawing, pale-blue ID and cobalt pencil in RIGHT pouch with dinosaur sticker; matte black 8x30 binoculars hang on woven strap knotted LEFT neck, Kett mark on hinge. Taeo's cracked grey dinosaur-sticker phone is never upgraded. No new fragment integration. Seoryun's current patch must differ from Taeo's old door; do not explain it before ch 39."
