chapter: 64
title: The Porters' Fund
when: "Immediately after ch 63's warning, then Seoul the following evening between survey stages. A quick Chungju edge-sampling job the next day; back at the Mapo base that evening. No date fixed."
story_beats: PART_ONE_BEATS.md#64
cast:
  taeo: outdoors # Navy jacket, black hoodie/cargos, one-white-stripe sneakers; olive backpack with OLD faded orange open-door patch. Outside every gate shot.
  nib: default # Ch 43 boots, never barefoot; V-notch LEFT ear, one lower LEFT fang, brown rope belt, RIGHT pouch/sticker, LEFT wooden sheath, black 8x30 binoculars knotted LEFT.
  orrin: default # Adult stacked-slate stoneback, 230 cm long; old shell crack a pale healed seam. No harness, saddle or baggage.
  sera: default # River-green wrap over cream sleeves, sand cropped trousers, brown ankle boots; bow/bracer LEFT, quiver RIGHT shoulder, bone flute RIGHT hip.
  minho: default # Brown field jacket, grey tee, olive cargos, work boots; LEFT grey streak, chest radio, LEFT watch.
  haein: default # Slate-blue overalls, beige tee, tool belt, clear glasses.
  sejin: default # Sage scrubs, olive medic rig, charcoal cargos, proper medical case.
  dami: default # 19, 157 cm, working adult. Follow current sheet: faded ochre vest, grey hoodie, olive cargos; yellow hard hat off at meeting. No GO FIRST badge yet.
  mansu: default # 58; age sheet with grey temples/stubble and deeper lines; grey work shirt, lumbar brace, worn trousers, navy jacket; inhaler in LEFT chest pocket.
  courier: default # Bae Jungho, QuickHaul cap/jacket, reflective stripe, stubble. His construct stays at warehouse; no golem in meeting.
extras:
  meridian_lead: "Same ch 63 upstream leader: Korean woman about 40, cropped dark hair, broad nose, navy waterproof jacket/plain silver shoulder tab, charcoal trousers, navy helmet, black gloves."
  porter_yeong: "Meeting participant, Korean woman about 30, square glasses, short tied hair, worn moss field fleece and faded grey work trousers; careful, proud, tired. No model sheet, use consistently within this chapter."
  porters: "Adult day porters, about twenty to sixty, ordinary worn workwear; some carry helmets, no hero uniforms or fresh guild patches."
locations: [chungju_gate_site, mapo_tyre_base, chungju_river_gate]
location_notes:
  mapo_tyre_base: "Ch 33 tyre-shop compound in Mapo gate zone. Featured meeting in open workshop bay, roller shutter raised onto broad forecourt, scarred table, tyre racks and folding chairs. Use ch 33 set if available; this is not Taeo's Ryu-yard container home. Orrin rests in open forecourt and participates. Crew rules on wall use separate labels only."
  chungju_gate_site: "Follow ch 63: service cutting and concrete access tunnel, scaffold-framed door-height slit; map canopy LEFT looking in, med canopy RIGHT; Haein's grey base station beside frame; vans behind in cutting."
  chungju_river_gate: "Follow ch 63: continuous stone ceiling, no sky, teal river from distant upper-right to lower-left, dry near-bank shelf, carved settlement slab on first shelf. Quick sample job stops on this already surveyed shelf; do not approach marker 9 or the deep channels. Old signal posts above flood line, scored channels and paired sockets."
props:
  boots: "Exact ch 43 pair, confirmed at final check: matte dark-brown ankle-high leather lace-ups, broad round toes, four dull gunmetal round eyelet pairs, dark-brown round laces double-knotted small, black low-heeled lug soles and heel pull tabs; oat-grey short socks inside collars. No visible steel cap, hooks, buckles, logo, bright trim or metal plate. Same pair, overrides barefoot sheet."
  samples: "Echo coral: small rigid pale-grey branching fan, hollow blunt tips, dry fallen piece caught above flood line. Third kind REED IRON: rust-brown porous mineral lattice shaped like parallel reed roots, not living reed or salt-iron. Distinct from river stone and each other. Samples finite, voluntarily contributed by finders."
  warning: "UPSTREAM TEAM: ROCKFALL AT MARKER 9, HOLD POSITION. Exact ch 63 sentence and same upstream leader voice. The actual leader denies the new broadcast. No explanation of mechanism."
palette_notes: "A4 workshop/yard extension: dusty ochre/brown daylight, evening warm work lamp and blue-grey shadows. River A4 gate shadows violet, actual cold-white lamps, muted teal water and black stone ceiling; no substitute wrong-colour sky. Interface cyan/navy reserved; return marks white/violet; no decorative amber."
panels:
  - id: P01
    shape: strip
    gap: none
    bg: black
    camera: "extreme close overhead on two separated transmit switches"
    art: >
      chungju_gate_site, straight after ch 63: meridian_lead's gloved hand places her navy radio on the table,
      transmit key visibly untouched, beside the grey live consortium handset. taeo's navy cuff points without
      touching either switch. White tunnel work lamp, muted slate and violet shadow. Five distinct fingers,
      ordinary intact devices; no waveform display, spectre, glow or generated words.
    calm: top
    lines:
      - {who: meridian_lead, type: speech, side: l, text: "CHECK MY SET. THAT WASN'T US."}
  - id: P02
    shape: wide
    gap: short
    bg: white
    camera: "eye level across the sample table, Haein between the two crew leads"
    art: >
      At chungju_gate_site, haein in slate overalls sets a sealed recording card beside her still-powered
      grey base station. minho, brown jacket, and the meridian_lead, navy field kit, watch with wary adult
      faces; taeo keeps a blank log open. White work lamp and cool cutting daylight, grey-blue concrete.
      No accusation pose, broken cable, printed times or diagram solving the mystery.
    calm: top
    lines:
      - {who: haein, type: speech, side: l, text: "RECORDING SAVED. EQUIPMENT CHECK BEFORE ANYONE GOES FARTHER."}
      - {who: minho, type: speech, side: r, text: "AND NO SOLO TESTS."}
    notes: "PLANT P15 continued: denial and saved record of ch 63's new transmission. No early answer."
  - id: P03
    shape: inset-r
    gap: short
    bg: white
    camera: "close on Sera looking from the recording card to her map roll"
    art: >
      sera at chungju_gate_site, river-green wrap/cream sleeves, grips her map case against her ribs;
      bow held low LEFT. Her impatient frown softens when she looks toward the returned crews: she wants
      to go back, but counts the cost. White work-lamp key, grey-blue background and muted green cloth.
      No dream of Ilan, new wound, signal glow or chibi during unease.
    calm: left
    lines:
