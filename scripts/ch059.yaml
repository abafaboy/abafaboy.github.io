chapter: 59
title: The Dinosaur Presentation
when: "Same exhibition day as ch 56-58, afternoon, immediately after the fourteen-missed-calls reveal. Haru's school presentation has already finished. Award ceremony follows the call. No fixed calendar date is introduced."
story_beats: PART_ONE_BEATS.md#59
cast:
  taeo: outdoor
  haru: default
  nib: default
  orrin: default
  sera: default
  haein: default
  sejin: default
  minho: default
  bangbang: default
extras:
  official: "Same adult woman in grey exhibition polo, slate trousers, headset, blank credential."
  host: "Adult Korean woman, neat navy suit, pale shirt, short side-parted dark bob; broadcast host with a small lapel mic and presentation cards. Smooth, practical, not malicious."
  school_teacher: "Adult Korean woman, cream cardigan and dark trousers, practical short bob, carrying a stack of paper display boards; distant silent figure only."
  parent_child: "A parent in muted grey jacket helping an ordinary primary-school child pack a cardboard volcano; no named design or dialogue."
  camera_operator: "Adult Korean man in grey utility vest over navy polo, dark trousers, trainers, shoulder camera; on west press-pit rostrum, unhurt throughout. The cameraman in ch 60."
  fans: "BangBang's small adult fan group in muted streetwear with blank round paddles; rest of audience varied and mostly pleased."
locations: [exhibition_arena, exhibition_service_corridor, exhibition_award_stage, exhibition_stands, haeseong_school_corridor]
location_notes:
  exhibition_arena: "Same ch 56-58 arena; heat over, scores locked 6-5 to Yoon crew. Operator box behind clear barrier and open service door."
  exhibition_service_corridor: "Under-stand cream concrete corridor, blue-white fluorescent strips, broad equipment doors, grey bench; connects operator box to award-stage ramp."
  exhibition_award_stage: >
    Sublocation of exhibition_arena: low platform NORTH, broad WEST ramp (audience LEFT), central lectern,
    blank grant board rear. Press pit SOUTH, 1.2 m below deck; camera rostrum at WEST lip, 1.5 m above pit floor.
    Intact short lighting truss above west pit, both suspension points intact here. Orrin beside west ramp.
    Haein brings intact reservoir on low grey demonstration cart to lectern's WEST side beside equipment table.
    Hook: Taeo centre with black wireless mic LEFT and empty reservoir RIGHT in grey strap; Nib at west ramp foot;
    Sera and Haein by west table; Orrin beside west ramp; Sejin and Minho offstage. Table holds backpack and navy jacket.
    No rig failure here; matches ch 60 rescue geography.
  exhibition_stands: "Tiered navy seats and accredited aisle as ch 57-58. BangBang's fan cluster restarts the chant at the hook."
  haeseong_school_corridor: "No key exists. Ordinary local primary-school corridor, pale mint lower wall, cream upper wall, daylight through LEFT classroom glazing, navy classroom door behind Haru, low bench and cardboard projects awaiting collection. Presentation room now emptying. All signs and name cards blank."
wardrobe_locks: >
  Taeo navy jacket over black hoodie through P35; removes jacket in P37, black hoodie thereafter;
  black cargos, black sneakers with one white stripe, RIGHT-eye mole;
  OLD faded orange shield/open-door backpack on shoulder after operator box. Phone dark grey, top-left crack,
  green dinosaur sticker. Ch 58 small nosebleed has stopped; forearm sore and lightly wrapped by Sejin before stage,
  no collapse and no ch 60 saturation injuries yet. His reservoir remains intact, uncharged, known 0.8-second leak.
  Haru ten with child proportions, black cowlick, missing upper front tooth, yellow dinosaur tee, blue shorts,
  grey Velcro trainers. Carries a homemade feathered dinosaur model and a crumpled paper cue card.
  Nib adult 105 cm, LEFT V-notch and lower fang, torn pinkish-tan wrap, charcoal shorts, brown rope belt,
  RIGHT dinosaur pouch, LEFT wooden sheath, black 8x30 binoculars high with LEFT knot
  and fork on hinge. ID, folded PAPER drawing and cobalt fork-marked pencil secured in pouch.
  Ch 43 boots: matte dark-brown ankle-high leather, broad round toes, four pairs dull gunmetal round eyelets,
  dark-brown round laces in small double knots, black lug soles/low heels, heel pull tabs, oat-grey short socks
  inside collars; no logo, hooks, buckles, bright trim or visible steel cap. Identical pair, never barefoot.
  Orrin adult stacked-slate carrier, healed crack seam, no harness. Sera river-green/cream/sand, thick braid,
  brown boots, LEFT bracer/bow, RIGHT quiver and bone flute; winning blunt arrow safely in quiver.
palette_notes: >
  Exhibition: A4 institutional blue-white overhead lamps and slate shadows, muted navy seating;
  service corridor cooler fluorescent cream/slate. School: cool grey-blue daylight, mint lower wall,
  Haru's muted yellow tee as the one warm note. No grief filters or supernatural sky.
  Readable words only through lines and UI. Phone screens green only with matching on: screen UI; use KIT HAND.
  No actual cash or new budget balance, no gold aura for the grant, no already-failing light rig.
