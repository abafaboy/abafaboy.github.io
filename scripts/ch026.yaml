chapter: 26
title: Fair and Square
when: "The next morning after ch 25's scaffold incident, then that afternoon; late spring. The AAO trainee practical is hosted at Ryu Survey's yard. Terrace contracts are on the coming Friday. No calendar date is lettered; the original ch 21 thirty-day housing notice is still running."
story_beats: PART_ONE_BEATS.md#26
cast:
  taeo: default # Black hoodie, black cargo trousers, black low sneakers with one white stripe; mole under RIGHT eye. Olive backpack with faded orange shield-and-open-door patch. No shop vest. Right-palm link pulses only.
  nib: default # Adult, 105 cm; V-notch LEFT ear, LEFT lower fang, torn pinkish-tan wrap top, charcoal knee shorts, BROWN rope belt; dinosaur-sticker pouch RIGHT hip, BROWN WOODEN sheath LEFT hip; barefoot. Matte black 8x30 binoculars always on, black woven strap knotted LEFT, three-line fork on hinge. Pale-blue ID and cobalt pencil with Kett's mark in pouch; folded PAPER drawing protected there.
  orrin: default # Adult stoneback, 230 cm long, 135 cm shell height, terraced slate shell, four columnar legs, three blunt nails each, short tail; dust-grey olive skin, heavy-lidded olive eyes. No clothes, harness, saddle or pet accessories.
  minho: default # Brown work jacket, grey tee, olive cargo trousers, black knee pads, brown boots; grey streak LEFT temple, radio LEFT chest, watch LEFT wrist.
  haein: default # Jaw-length black bob, slate-blue bib overalls, beige tee, brown tool belt, spanner RIGHT, screwdriver LEFT; clear safety glasses on crown, work boots.
  chae: default # Brown bob, navy cardigan, white shirt, black trousers, low heels, blank lanyard ID; blue folio tablet kept closed or dark.
  seonhee: default # About 55; Ryu family brows, grey-templed low bun, glasses, pencil LEFT ear, moss-grey cardigan, cream shirt, slate trousers, brown shoes.
  bluebird_collector: default # Lead and his two crew, as current model sheets; fully described at P31.
locations: [ryu_practice_yard]
location_notes:
  ryu_practice_yard: >
    Use locations/ryu_practice_yard/key_wide.png and key_reverse.png: south double vehicle gate,
    grey office container southwest, last white van southeast facing west with a blank blue sticker,
    fixed central plywood maze, three targets along north fence, equipment trestle west.
    Do not rebuild or widen the maze. The AAO course uses it for Nib and the construct;
    Orrin has a wide outside lane along the EAST fence, with a padded loading stop at its north end.
    Chalk boundary and movable soft barriers are training props, not permanent walls.
    The spare container offered here is a second unit behind the office along the west fence;
    it is outside the baseline key's southern crop. Its door faces east. Haein's workshop is next north.
    A portable timber ramp beside the office's original step provides Dongsik's access; do not erase the keyed step.
props:
  practical: >
    Two identical grey foam marker crates and one adult-size orange rescue dummy, reused after reset.
    At sixty seconds a battery bell signals closure of the west lane; the east lane remains open.
    All three items must reach the south muster mat within 120 seconds; a missing item or unsafe route fails.
    Dummy is a jointed training shape, never a human in peril. Orrin waits outside the maze in his wide lane.
  benchmark_construct: >
    Use characters/ryu_mule/turnaround.png: a nonverbal grey metal quadruped with a box head,
    two circular dark eye lenses, articulated legs, flat feet and khaki side packs.
    Its crate attachment is working equipment; never put a matching harness on Orrin.
palette_notes: >
  A4 yard: dusty ochre ground, warm brown plywood shadows, sky blue and muted orange safety props.
  Morning sun from southeast, afternoon light from southwest. Office doorway: soft grey with daylight spill.
  Nib amber #F2A93B and Orrin slate-green stay distinct in Taeo's RIGHT palm; interface cyan is separate.
  Flat cel fills, warm near-black contours, hard shadows. Screens dark except KIT HAND inserts.
continuity_notes: >
  Ch 25's script was absent at the initial source check; opening follows its specified hook exactly:
  scaffold held by Orrin, Nib on it, two consented pulses, LINK: 2. This chapter does not name LOAD SHARE.
  The housing deadline is the original ch 21 demand to vacate within thirty days of notice, not a fresh extension.
  No licence is awarded here: Minho is already licensed and supplies an assessed benchmark for operator trainees.

panels:
  # COLD OPEN: the astonishing part does not fix the ordinary part.
  - id: P01
    shape: strip
    gap: none
    bg: white
    silent: true
    camera: "extreme close-up from above on Taeo's right palm beside a scaffold clamp"
    art: >
      ryu_practice_yard, the morning after the scaffold incident. Taeo (taeo, default black hoodie)
      studies his open RIGHT hand beside a disconnected steel scaffold clamp on the west trestle.
      One thin amber pulse and one slate-green pulse sit separately in the palm, never mixing.
      His fingers curl carefully around neither. Southeast sun, dusty ochre and warm brown;
      crisp link light only. Five fingers, no wounds newly invented, no diagrams or readable marks.
    calm: none
    notes: "Carries forward LINK: 2 from ch 25. Nib and Orrin are both awake and permitting this brief check; no new window or transfer."

  - id: P02
    shape: wide
    gap: short
    bg: white
    camera: "low medium two-shot beside the disassembled scaffold, at Nib's eye level"
    art: >
      Nib (nib, default, adult weathered face, binoculars high, barefoot, full belt locks) stands
      beside Orrin (orrin, default: huge terraced slate shell, olive-grey face, bare columnar legs).
      The scaffold is safely down behind them at ryu_practice_yard; Orrin no longer supports it.
      Nib checks a clamp with professional disgust. Orrin looks toward Taeo off frame, patient and dry.
      Southeast sun, A4 ochre and brown; keep the sky plain. No active machinery or readable labels.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "I FELT BOTH OF YOU."}
      - {who: orrin, type: speech, side: r, text: "DID IT TELL YOU THE SCAFFOLD WAS BAD?"}

  - id: P03
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up front on Taeo, palm lowered out of frame"
    art: >
      Taeo (taeo, black hoodie, mole under RIGHT eye) in ryu_practice_yard lowers his right hand,
      the excitement meeting an awkwardly sensible question. His smile slips sideways; one brow lifts.
      Clamp edge at bottom, sun on left cheek, soft ochre background with warm brown shadow.
      No lingering link light after the check, no window, no phone screen or readable marks.
    calm: left
    lines:
      - {who: taeo, type: speech, side: r, text: "...NO."}
      - {who: "offpanel:nib", type: speech, side: l, text: "I DID."}

  - id: P04
    shape: wide
    gap: short
    bg: white
    camera: "over Taeo's shoulder toward Minho opening the south gate"
    art: >
      Taeo (taeo, default) foreground turns toward Minho (minho, brown work jacket, grey streak LEFT,
      radio LEFT chest) holding open ryu_practice_yard's south gate. Chae (chae, navy cardigan,
      white collar, brown bob, blue folio closed) enters with a stopwatch and a practical-course folder.
      Minho smiles with disconcerting readiness; Chae looks brisk. Southeast sun, A4 ochre yard,
      sky blue above chain-link. Folder, cards and all signs blank; no screens visible.
    calm: top
    lines:
      - {who: minho, type: speech, side: r, text: "GOOD. TODAY WE TEST THE PART WITH INSTRUCTIONS."}
      - {who: taeo, type: float, text: "I HAD ENJOYED BEING SPECIAL FOR NINE SECONDS."}

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 26 · FAIR AND SQUARE"

  # AAO FIELD PRACTICAL: exactly the same scenario, honestly won.
  - id: P06
    shape: full
    gap: long
    bg: white
    camera: "establishing high from the south gate, matching the yard wide key"
    art: >
      ryu_practice_yard in morning sun: grey office LEFT, last white van RIGHT facing west,
      central fixed plywood zigzag, three north targets. Haein (haein, slate-blue overalls, beige tee,
      bob, tool belt, glasses on crown) has set two grey foam crates and an orange rescue dummy inside.
      Orrin (orrin, bare terraced shell) waits in the open east-fence lane. Nib (nib, default,
      binoculars, full belt locks, barefoot) studies the maze; Taeo grips a radio by the south muster mat.
      Chae raises a stopwatch. Ochre/brown/sky-blue A4 palette; all course boards blank, no gate slit.
    calm: top
    lines:
      - {who: narr, type: tag, text: "RYU SURVEY · AAO TRAINEE FIELD PRACTICAL"}
      - {who: chae, type: speech, side: l, text: "THIS IS PRACTICE. IT DOESN'T GIVE YOU A LICENCE."}
      - {who: taeo, type: speech, side: r, text: "I'D SETTLE FOR NOT EMBARRASSING MYSELF."}

  - id: P07
    shape: wide
    gap: short
    bg: white
    camera: "top-down across Chae's open course folder and the equipment trestle"
    art: >
      Chae (chae, cardigan cuffs) holds a paper plan above the west trestle at ryu_practice_yard:
      simple unlettered route lines, two square crate symbols, one human-shaped dummy symbol.
      A battery bell and mechanical stopwatch sit beside the page; Taeo's black cuff and
      Minho's brown cuff enter from opposite corners. Clean southeast daylight, ochre and pale paper.
      Reserve broad blank blocks on paper for labels. No readable drawing, phone or system overlay.
    calm: top
    ui:
      - {kind: label, text: "2 CRATES + 1 CASUALTY · 120 SECONDS", at: [0.50, 0.25]}
      - {kind: label, text: "BELL AT 60 SECONDS: WEST LANE CLOSED", at: [0.50, 0.66]}
    lines:
      - {who: chae, type: speech, side: l, text: "EVERYBODY OUT. EAST LANE STAYS OPEN AFTER THE BELL."}
      - {who: chae, type: speech, side: l, text: "NOBODY CROSSES A CLOSED LANE. BOTH RUNS GET THE SAME COURSE."}

  - id: P08
    shape: inset-l
    gap: short
    bg: white
    camera: "medium close over Minho's shoulder at Taeo with the trainee radio"
    art: >
      Taeo (taeo, black hoodie) at ryu_practice_yard tests the radio grip with too much care,
      shoulders rigid; Minho's brown jacket occupies one corner. Minho gestures toward the course,
      relaxed but attentive. Morning sun, simplified ochre plywood and brown shadows.
      Radio face plain dark plastic, no numbers or floating windows; backpack remains by the trestle.
    calm: right
    lines:
      - {who: taeo, type: speech, side: l, text: "YOU'RE ENTERING TOO?"}
      - {who: minho, type: speech, side: r, text: "BENCHMARK RUN. I ALREADY HAVE MY LICENCE."}

  - id: P09
    shape: wide
    gap: short
    bg: white
    style: chibi
    camera: "chibi frontal three-shot against a flat course-colour background"
    art: >
      CHIBI comedy at ryu_practice_yard: 2.5-head Taeo (taeo, black hoodie) tries to hang an adult
      orange safety vest on 2.5-head Nib (nib, default, binoculars, LEFT notch, right sticker pouch,
      left wooden sheath, brown rope belt, bare feet). It becomes a floor-length curtain.
      Chibi Haein (haein, overalls, tool belt, glasses) folds it in half with a carpenter's deadpan.
      Flat pale ochre screentone, imagined southeast light; no full set, writing or magical effects.
    calm: top
    lines:
      - {who: taeo, type: nervous, side: l, text: "SORRY. THEY ONLY HAD ONE SIZE."}
      - {who: nib, type: speech, side: r, text: "IT HAS NO POCKETS."}
      - {who: haein, type: speech, side: r, text: "NOW IT HAS NO BOTTOM EITHER."}
    notes: "Vest is folded and put away after this gag; Nib does not wear it on the course."

  - id: P10
    shape: wide
    gap: short
    bg: white
    camera: "side-on at the south muster mat, Taeo crouched between Nib and Orrin"
    art: >
      Back to normal adult proportions. Taeo (taeo, black hoodie) crouches at ryu_practice_yard's
      south start line; Nib (nib, default, binoculars, full locks) stands left with a radio,
      Orrin (orrin, terraced slate shell, bare olive-grey neck) fills right, outside the maze.
      Taeo asks rather than pointing; Nib nods once, Orrin meets his eyes. Southeast sun,
      A4 ochre and warm brown, orange dummy distant. No armour, harness, vest or readable course signs.
    calm: top
    lines:
      - {who: taeo, type: speech, side: c, text: "NIB, WOULD YOU SCOUT? ORRIN, WOULD YOU TAKE THE OUTSIDE LANE?"}
      - {who: nib, type: speech, side: l, text: "YES."}
      - {who: orrin, type: speech, side: r, text: "I LIKE THE WORD 'OUTSIDE'."}

  - id: P11
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up from the side on Chae's thumb releasing the stopwatch"
    art: >
      Chae's hand (chae, navy cuff) releases the mechanical stopwatch at ryu_practice_yard;
      five plausible fingers, small thumb movement. Black hoodie edge behind belongs to Taeo,
      whose free hand tightens on his radio. Southeast sun, pale metal and ochre blur-free flat shapes.
      Stopwatch dial has ticks only, no digits; no text or visible display.
    calm: none
    lines:
      - {who: chae, type: announce, side: l, text: "START."}
    sfx:
      - {text: "TIK", style: quiet, at: [0.58, 0.58], size: S, rot: 0}

  - id: P12
    shape: tall
    gap: short
    bg: white
    camera: "overhead from the northeast target fence down the fixed zigzag"
    art: >
      At ryu_practice_yard Nib (nib, default, binoculars secured high, bare feet, full belt locks)
      moves through the fixed plywood gaps with low efficient scout posture, radio in LEFT hand.
      He stops over the orange dummy at the central return; one grey crate is just beyond it.
      Orrin (orrin, default) advances along the separate wide east lane, carrying nothing yet.
      Morning sun from southeast, ochre and warm brown, orange dummy accent. No speed glow or new maze openings.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "PERSON. NOT WALKING. TWO BOXES BEHIND."}

  - id: P13
    shape: wide
    gap: short
    bg: white
    camera: "waist-high at Taeo's station with Nib beyond the low plywood edge"
    art: >
      Taeo (taeo, black hoodie) outside ryu_practice_yard's maze leans forward, radio close,
      one hand making a useful turning gesture nobody on the course can see. Nib's black hair
      and notched LEFT ear show over a far panel; Orrin's slate shell moves along the east lane.
      Taeo is thinking quickly, almost smiling. Southeast sun, A4 ochre/brown; no magical route lines or visible UI.
    calm: top
    lines:
      - {who: taeo, type: speech, side: r, text: "PASS THE CRATES OVER THE LOW WALL. NO NEED TO WALK THEM ROUND."}
      - {who: nib, type: phone, side: l, text: "YES."}

  - id: P14
    shape: wide
    gap: short
    bg: white
    silent: true
    camera: "low from the east lane beside Orrin's foreleg, looking toward the handover"
    art: >
      Nib (nib, default, barefoot, binoculars at chest, full belt locks) at ryu_practice_yard
      passes a grey foam crate over a low section of the EXISTING maze toward Orrin's broad shell.
      Haein (haein, overalls) spots the empty landing space without touching the load; Orrin
      (orrin, default) holds still and watches Nib. A second crate rests securely on an upper slate terrace.
      Southeast sun, ochre and slate, hard shadows. No hauling harness or bending new opening in the maze.
    calm: none
    notes: "Taeo's idea works. Failure is not because Nib is slow, Orrin is unsuitable, or the assessor cheats."

  - id: P15
    shape: strip
    gap: short
    bg: white
    camera: "close from ground level past the battery bell toward the west lane barrier"
    art: >
      The battery bell on a stool at ryu_practice_yard vibrates; behind it Haein (haein, overalls,
      boots) swings a soft orange barrier across the west lane at its preannounced closure time.
      Nib (nib, default) turns his head sharply toward the new route while remaining beside the dummy.
      Morning sun, muted ochre and orange, warm brown shadows. No danger red, gate rim or readable dial.
    calm: none
    sfx:
      - {text: "DRRRRING", style: alert, at: [0.30, 0.48], size: M, rot: -5}
    ui:
      - {kind: label, text: "00:60 · WEST LANE CLOSED", at: [0.68, 0.18]}
    notes: "Sixty seconds elapsed, not a surprise rule. Same bell timing and closure for Minho's reset course."

  - id: P16
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up three-quarter on Taeo's face and radio"
    art: >
      Taeo (taeo, black hoodie, mole RIGHT eye) at ryu_practice_yard reacts too fast to the bell,
      lips already moving while his eyes switch between Nib and Orrin beyond frame.
      His radio is squeezed high in his right fist; a thumb presses transmit. Sun from southeast,
      plain ochre background, a hard shadow under brow. No screen, link flare or blood.
    calm: left
    lines:
      - {who: taeo, type: speech, side: r, text: "COME BACK. WAIT. TAKE HIM ROUND THAT SIDE."}

  - id: P17
    shape: wide
    gap: short
    bg: white
    camera: "normal-lens profile across the low wall with Nib left and Orrin right"
    art: >
      At ryu_practice_yard Nib (nib, default, full locks, radio LEFT) is beside the orange dummy;
      Orrin (orrin, default) has two foam crates secure on his slate shell in the east lane.
      Both stop rather than guess. Nib looks toward Taeo off frame with one ear angled;
      Orrin has one forefoot poised above clear dirt, skeptical. Southeast sun, A4 ochre/brown,
      no funny distortion or imminent falling load, no lettering on crates.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "WHICH SIDE."}
      - {who: orrin, type: speech, side: r, text: "WHICH OF US?"}

  - id: P18
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "extreme close-up on Taeo's right hand with the radio above his open palm"
    art: >
      Taeo (taeo, hoodie cuff) at ryu_practice_yard turns his RIGHT hand awkwardly under the radio:
      two faint permitted link pulses, amber and slate-green, still distinct on the heel of his palm.
      His fingers tremble, but the radio remains in a plausible grip. Clean southeast sun,
      ochre background. No directional arrows, system window, wounds or power transfer.
    calm: none
    notes: "He feels both people. Feeling is not an instruction; do not narrate the picture or give the link mind-reading."

  - id: P19
    shape: wide
    gap: short
    bg: white
    camera: "frontal medium on Taeo, with Chae's stopwatch hand at the left edge"
    art: >
      Taeo (taeo, black hoodie) outside the maze at ryu_practice_yard plants both feet and
      forces himself to look at one person at a time. His face loses the panicked half-smile.
      Chae's navy cuff and stopwatch sit at left edge, silently counting. Southeast sun,
      pale sky and ochre wall, hard brown shadow. No readable stopwatch or screen.
    calm: top
    lines:
      - {who: taeo, type: speech, side: r, text: "NIB. CASUALTY TO THE EAST OPENING. CONFIRM."}
      - {who: nib, type: phone, side: l, text: "EAST OPENING. YES."}
      - {who: taeo, type: speech, side: r, text: "ORRIN. HOLD THERE UNTIL NIB LOADS THE CASUALTY. CONFIRM."}

  - id: P20
    shape: full
    gap: short
    bg: white
    camera: "low from the south muster mat, both companions approaching through the east lane"
    art: >
      Orrin (orrin, default, broad slate shell) reaches ryu_practice_yard's south muster mat
      with two grey foam crates and the orange dummy lying supported across the broad shell crown.
      Nib (nib, default, barefoot, binoculars high, full locks) walks alongside keeping the dummy's wrist secure.
      Nobody runs; no load spills. Chae (chae, navy cardigan) stops the watch, neutral and firm.
      Southeast sun, A4 dusty ochre, brown, orange. No injury, harness or readable props.
    calm: top
    lines:
      - {who: orrin, type: speech, side: r, text: "CONFIRMED. EVERYBODY OUT."}
      - {who: chae, type: announce, side: l, text: "ONE HUNDRED AND TWENTY-THREE SECONDS."}

  - id: P21
    shape: inset-l
    gap: long
    bg: white
    camera: "close-up slightly high on Taeo lowering the radio"
    art: >
      Taeo (taeo, hoodie, RIGHT-eye mole) at ryu_practice_yard lowers the radio with a small
      exhausted nod. His eyes briefly search Chae's face beyond frame for a kindness she cannot put on the sheet.
      Plain ochre background, southeast daylight, soft brown jaw shadow; no chibi, tear gag or screen.
    calm: right
    lines:
      - {who: chae, type: speech, side: r, text: "SAFE RETRIEVAL. OVER TIME. THE ATTEMPT DOESN'T PASS."}
      - {who: taeo, type: speech, side: l, text: "RIGHT."}

  - id: P22
    shape: wide
    gap: long
    bg: white
    camera: "high from the west trestle across Haein resetting the identical course"
    art: >
      Haein (haein, overalls, bob, tool belt) resets the same two foam crates and orange dummy
      to the same plywood corners at ryu_practice_yard. Chae (chae, cardigan) checks her blank plan.
      Minho (minho, brown jacket, radio LEFT chest) has a construct controller by his belt;
      the grey metal Ryu mule with box head and khaki packs waits at the start.
      Nib and Orrin rest outside the course. Southeast sun, A4 ochre/brown, no new wall gaps or readable plan.
    calm: top
    lines:
      - {who: chae, type: speech, side: l, text: "POSITIONS CHECKED. SAME CLOSURE. SAME LIMIT."}
      - {who: minho, type: speech, side: r, text: "READY."}
    notes: "Licensed benchmark uses Minho's familiar nonverbal construct, not borrowed obedience from Nib or Orrin."

  - id: P23
    shape: strip
    gap: short
    bg: white
    camera: "eye-level close-up along Minho's sightline into the maze"
    art: >
      Minho (minho, brown jacket, grey streak LEFT, radio LEFT chest) stands at the SAME
      operator position at ryu_practice_yard. His eyes track the dummy before the crates;
      lips move in calm short commands, left wrist watch tucked under cuff.
      Southeast sun, warm brown and ochre simplified background. No aura, screen or secret course cues.
    calm: top
    lines:
      - {who: minho, type: speech, side: r, text: "MULE. DUMMY FIRST. RETURN BY EAST LANE."}
      - {who: minho, type: speech, side: r, text: "STOP AT EACH TURN."}

  - id: P24
    shape: wide
    gap: short
    bg: white
    camera: "ground-level side view of the mule stopping exactly short of the closed west route"
    art: >
      The grey metal Ryu mule at ryu_practice_yard, box head level and khaki packs holding the
      orange rescue dummy securely, stops at a plywood return before turning into the EAST route.
      In background Haein (haein, overalls) closes the west lane barrier at the bell again.
      Minho's brown-jacketed silhouette is visible at the operator mat, already facing east.
      Southeast sun, ochre dirt, warm brown shadow, muted orange; no sentient expression on the construct or readable marks.
    calm: top
    lines:
      - {who: minho, type: speech, side: r, text: "EAST. ADVANCE TO THE MAT. STOP."}
    sfx:
      - {text: "DRRRRING", style: alert, at: [0.82, 0.22], size: M, rot: 4}

  - id: P25
    shape: wide
    gap: short
    bg: white
    camera: "slightly high from behind Chae as the last foam crate reaches the mat"
    art: >
      At ryu_practice_yard the orange dummy is already on the south mat; the metal Ryu mule
      lowers the second foam crate next to the first, flat mechanical feet planted outside the load.
      Chae (chae, navy cardigan) stops the watch. Minho (minho, default) relaxes his shoulders only now.
      Taeo (taeo, black hoodie) watches beyond them, plainly disappointed but attentive.
      Southeast sun, A4 ochre and brown. No celebrating crowd, magical assistance or readable dial.
    calm: top
    lines:
      - {who: chae, type: announce, side: l, text: "NINETY-FOUR SECONDS. SAFE. COMPLETE."}
      - {who: minho, type: speech, side: r, text: "THANK YOU."}

  - id: P26
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up front on Taeo trying to keep an ordinary face"
    art: >
      BIG REACTION held small: Taeo (taeo, black hoodie, mole RIGHT eye) at ryu_practice_yard
      presses his lips together with wounded competitive pride, brows climbing despite himself.
      His radio dangles at his side. He inhales before speaking; no caricature.
      Southeast sun, flat pale ochre behind, warm brown shadow; no tears, chibi or effects.
    calm: left
    lines:
      - {who: taeo, type: speech, side: r, text: "YOU WERE BETTER."}
      - {who: "offpanel:minho", type: speech, side: l, text: "YES."}

  - id: P27
    shape: wide
    gap: short
    bg: white
    camera: "medium two-shot under the west trestle awning, Minho facing Taeo"
    art: >
      Minho (minho, brown jacket, grey LEFT streak) hands Taeo (taeo, black hoodie) his blank
      annotated course sheet at ryu_practice_yard. Minho's expression is practical, without a smirk;
      Taeo accepts the page with both hands, cheeks still tight. Radios and clamp on trestle.
      Southeast daylight through awning edge, ochre light and cooler brown shade. All annotations illegible, no screens.
    calm: top
    lines:
      - {who: minho, type: speech, side: l, text: "THAT HANDOVER WAS GOOD. YOUR LAST ORDER WAS FOUR ORDERS."}
      - {who: taeo, type: speech, side: r, text: "I KNEW WHAT I MEANT."}
      - {who: minho, type: speech, side: l, text: "ONLY ONE PERSON DID."}

  - id: P28
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "close on Nib returning his radio into Taeo's hands"
    art: >
