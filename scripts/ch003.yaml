      Bottom, foreground: the edge of Chae's desk and the side of the monitor at the right (its screen turned away from us), throwing hard alert red
      across the keyboard, Chae's frozen hands and the shoulder of her navy cardigan.
      Middle: Taeo (taeo, outdoor) on his stool at the right and Nib (nib, default) standing at the left, both twisted round to look behind them at the glass.
