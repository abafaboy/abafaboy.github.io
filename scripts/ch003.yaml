chapter: 3
title: Seventy-Two Hours
when: "Wednesday 15 March, early spring, the day after chapter 1. The cold open is a few minutes after chapter 2's 3 AM notice; 8:55 AM the alarm; 9:00 AM the call; 10:31 AM leaving home; 10:42 AM on World Cup-ro; 10:53 AM at the Ability Assessment Office, Mapo branch; 11:16 to 11:41 AM in assessment room 3."
story_beats: PART_ONE_BEATS.md#3
cast:
  taeo: outdoor     # P01–P15: default (black hoodie, black cargo trousers, socks; he slept in his clothes). P16–P60: outdoor (navy zip jacket over the hoodie, black low sneakers with one white stripe, the olive backpack with the faded orange patch, the cracked phone)
  nib: default      # barefoot all chapter (refuses shoes, P16); leather pouch on the RIGHT hip; brown wooden sheath on the LEFT hip; the knife is never drawn in this chapter
  chae: default     # first appearance (P42): chin-length brown bob, navy cardigan over a white collared shirt, black trousers, low heels, ID card on a lanyard, work tablet in a blue cover
  seoryun: default  # on TV only (P35): olive field jacket over a black T-shirt, loose low ponytail, thin scar through the left eyebrow, her team emblem (shield with an open door) on the shoulder
  sunline: default  # on the World Cup-ro banner only (P27)
  dr_pyo: default   # P55 (tiny, far down the corridor) and P60 (the hook). Unnamed in this chapter: neat grey suit, white shirt, no tie, thin rimless glasses, greying hair combed back, blank institute lanyard (CHARACTER_BRIEF_2 #2, as ch006)
  eunchae: default  # lock-screen notification only (P10); not drawn
extras:
  receptionist: "AAO Mapo branch receptionist, late twenties: round glasses, hair in a low ponytail, light-blue shirt, a lanyard with a blank card; brisk and polite. The same woman is the voice on the phone in P11–P13."
  reporter: "KNN 24 field reporter: voice only, plus a microphone pushed in from the frame edge (P35)"
  mover: "a removals man in his fifties: grey work jacket, flat cap, a hand towel round his neck; walks ahead of his summon without looking back"
  mannequin: "a plain wooden mannequin construct (match ch007's): featureless oval head, jointed wooden limbs, a canvas strap harness; an old steamer trunk strapped to its back; slow and literal"
  schoolgirl: "a middle-school girl in a navy school blazer with a yellow backpack; her friend, in the same blazer, tugs her sleeve"
  lobby_people: "waiting at the AAO: a teenage girl in a hoodie and her father, who grips a leaflet; an old woman with a cane; a young man in a cheap suit with a knee-high wooden mannequin construct standing stiffly beside his chair"
  rescue_team: "two of Seoryun's teammates on TV: olive field jackets with the same shoulder emblem, sooty and exhausted; one loads a stretcher bag into the van, one sits on its bumper with a paper cup"
locations: [taeo_flat, taeo_building, taeo_street, world_cup_ro, aao_ext, aao_office]
location_notes:
  taeo_building: "LOCATIONS.md sub-key. The open-air 4F corridor (the stairs are at its north end, so it is RIGHT coming out of unit 402) and the ground-floor piloti, where the glass street door sits a step back from the pavement under the brick overhang."
  taeo_street: "LOCATIONS.md sub-key. The two-lane bus street outside the street door; the green branch bus runs south past the door to the corner stop 30 m away. P23 walks north toward Mangwon station."
  world_cup_ro: "No key yet (new id). The six-lane avenue above Line 6 at Mangwon station, 7 minutes' walk north of taeo_flat on the way to the AAO (20 minutes in all, LOCATIONS.md). Wide pavements with bare plane trees just budding, a low forsythia hedge and the Line 6 entrance canopy at the station exit, a bus shelter with a tall portrait advertising screen, shops with blank signs (a phone shop, a bakery, a bank, a SumEx draw-ticket shop with a purple-to-pink sign panel). On the north side a seven-storey mid-rise carries a huge vinyl banner across its top three floors: Sunline for Haneul Air (P27). Keep this building and this banner frame fixed: ch33 and ch61 re-skin the same banner as her sponsors change (P22)."
  aao_ext: "No key yet (new id). AAO Mapo branch: the ground floor of a plain five-storey civic block (pale grey stone panels, blue-tinted glass) on a quiet side street off World Cup-ro, 5 minutes' walk from Mapo-gu Office station. A flat concrete canopy over a four-wing revolving door of glass and brushed steel, with a plain glass push door beside it; a bicycle rack; a planter of clipped boxwood; a pale blue sign panel above the canopy, blank."
  aao_office: "LOCATION_BRIEF id; no key or floor plan yet, so this script fixes the layout (keep it for ch4). LOBBY, through the revolving door: reception counter on the LEFT (low, pale wood; the receptionist's monitor turned away from visitors) with a ticket machine on a post beside it; a square pillar; four rows of linked blue-grey metal chairs facing the RIGHT wall, where a TV hangs about 2.2 m up; a leaflet rack, a water dispenser, a potted rubber plant, green exit signs. At the far end, a wide opening to the ASSESSMENT CORRIDOR: pale grey vinyl floor, white walls, a vending machine and a water cooler at its far end. Each assessment room's corridor wall is clear glass from waist height up, with a frosted band below and the blinds raised. ASSESSMENT ROOM 3 (about 3.5 x 4 m, ceiling LED panels, no window): Chae's desk stands against the back wall FACING the glass wall; the door is at the glass wall's left end as seen from her chair. On the desk at her RIGHT: the monitor on a swing arm (she swings it sideways to share it) and the keyboard. At her LEFT: the hand plate (palm-sized brushed steel, on a cable) and the analogue gauge (round white dial, black needle, plain tick marks, on a short stand). A grey filing shelf behind her. Visitor side: two grey stools; Taeo takes the one in front of the monitor, Nib stands by the other, nearer the door. Two small yellow tape crosses on the open floor between the desk and the glass."
palette_notes: "Flat, 3 AM: lamp off; deep blue-grey with one darker tone; the phone's cold cyan-white on Taeo's face; a thin cold white line of corridor light under the door. Flat, morning: A4 morning (cool grey-blue daylight, soft blue shadows, a band of yellow sun through the curtain gap). Corridor, stairs and streets (not in A4): flat early-spring daylight, pale blue sky, warm grey pavement, blue-grey shadows; a muted green city bus; forsythia lemon-yellow in small touches only (never the link amber); on World Cup-ro the one saturated accent is the white, gold and sky-blue Sunline banner. AAO: A4 (clean blue-white institutional, light slate shadows, navy cardigan, green exit signs). TV broadcast: flat grey daylight, olive and soot, the van's orange stripe. The alert red (P58–P60) is the chapter's one grit accent. Amber #F2A93B appears only in Nib's eyes: there is no link beat in this chapter (the first amber pulse is ch4). No operator-interface windows: the interface stays dark."

panels:

  # ---------------- COLD OPEN: the same night ----------------
  - id: P01
    shape: wide
    gap: none
    bg: black
    camera: "high angle from the window end, above the head of the bed, looking down the length of the dark studio toward the door"
    art: >
      Taeo's studio flat (taeo_flat key), minutes after chapter 2's hook, about 3 AM. The desk lamp is OFF. Only two lights:
      Taeo's phone, throwing cold cyan-white light up onto his face and hands, and a thin cold white line of corridor light under the far door.
      Everything else is deep blue-grey, with one darker shadow tone in the corners.
      Taeo (taeo, default: black hoodie, black cargo trousers, socks) sits hunched on the edge of the bed on top of the grey duvet, elbows on his knees,
      the phone held close in both hands; we see only its dark back and clear case with the small green dinosaur sticker, never its screen.
      ACTING: wide awake and worn out, jaw tight, going over the same few lines again.
      On the floor below him, against the bed's storage drawers, Nib (nib, default) sits with his knees up and his sheathed knife across them,
      his amber eyes two small points of light turned up toward Taeo. Beside Nib on the floor: the white mug with the thin green band, half full of water.
      Between them and the door: the low folding table; the kitchenette strip runs along the RIGHT-hand wall in this view, the desk side on the LEFT.
      Hard cel shadows, no glow haze. No text anywhere.
    calm: top-left
    lines:
      - {who: taeo, type: float, text: "I READ IT ELEVEN TIMES."}
    notes: "Starts where ch2's hook ends ('...IT SAYS I HAVE THREE DAYS.'): Nib still keeping watch against the bed, the refilled cup from ch2 beside him. Looking west from the window end, the kitchenette is on the RIGHT (world/floorplans/taeo_flat.png)."

  - id: P02
    shape: narrow-r
    gap: short
    bg: black
    camera: "Taeo's left hand holding the phone tilted toward him (kit hand)"
    art: "KIT HAND"
    calm: none
    ui:
      - {kind: phone.info_card, on: screen, hand: taeo_left_tilt, title: "GATE SAFETY KOREA", text: "Unregistered summoning detected at your address. · Register within 72 hours. Unregistered entities may be seized. · Time left: 71 h · Deadline: Sat 18 Mar"}
    lines:
      - {who: taeo, type: float, text: "THE NUMBER ONLY WENT DOWN."}
    notes: "Ch2's notice, reread. Time left is shown in whole hours so it stays true whatever minute ch2 stamps on the notice: it arrived just after 3 AM on Wednesday 15 March, so the deadline is just after 3 AM on Saturday 18 March. If ch2 words the notice differently, copy ch2's wording into the first two paragraphs."

  - id: P03
    shape: inset-l
    gap: short
    bg: black
    camera: "close-up, slightly high, Nib on the floor against the bed, lit from above by the phone"
    art: >
      Close on Nib (nib, default) sitting on the floor against the bed's drawers in the dark, knees up, sheathed knife across them.
      The faint cyan-white phone glow from above catches his long nose, the V-notch in the top of his LEFT ear and the rims of his amber eyes;
      the rest of him falls into deep blue-grey. ACTING: alert and still, turning a new word over like a stone;
      his eyes have just flicked to the empty air above the folding table and are coming back up to Taeo.
      A weathered adult face, lines under the eyes, not cute. Flat dark background. No text.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "SEIZED."}
      - {who: "offpanel:taeo", type: speech, side: r, text: "TAKEN AWAY."}
      - {who: nib, type: speech, side: l, text: "BY WHO?"}
    notes: "Nib's glance at the empty air is a wordless callback to ch2's 3 AM glitch (P01), which only he saw. Don't explain it."

  - id: P04
    shape: inset-r
    gap: short
    bg: black
    camera: "close-up from slightly below, Taeo's face lit by the phone"
    art: >
      Taeo (taeo, default) from slightly below, the phone's cold cyan-white light on his face; the small mole under his RIGHT eye catches it.
      ACTING: a crooked half-smile that isn't one, the dry joke he makes when he is frightened; eyes still down on the screen, lower lids heavy.
      Deep blue-grey behind him. The phone is only a dark edge at the bottom of the frame; its screen is not visible. No text.
    calm: left
    lines:
      - {who: taeo, type: speech, side: r, text: "PEOPLE WITH FORMS, PROBABLY."}
      - {who: taeo, type: speech, side: r, text: "I'VE NEVER HAD ANYTHING WORTH SEIZING."}
    notes: "Without meaning to, Taeo jokes about Nib as something he has. Nobody remarks on it; P05 is Nib's answer."

  - id: P05
    shape: tall
    gap: short
    bg: black
    silent: true
    camera: "low, from the floor just inside the door, looking up and back into the dark room"
    art: >
      Tall frame. Foreground, filling the lower half: Nib (nib, default) has moved to the edge of the tiled shoe area just inside the closed steel door
      and sits there facing the door, which means facing us: knees up, the sheathed knife laid across his knees, one hand resting on the brown wooden sheath.
      The cold white line of corridor light from under the door lights his bare feet and the tiles and catches his amber eyes from below as two hard glints.
      ACTING: a sentry settling in for the night: calm, unblinking, grim. A weathered adult soldier, never cute.
      Upper half, small and far behind him: the dark room (kitchenette on the LEFT in this view), the folding table, and Taeo lying back on the bed by the curtained window,
      the phone face-down on his chest, its glow dying; his head is turned on the pillow to watch Nib.
      Deep blue-grey everywhere with one darker tone; the only light is the line under the door and a last cyan edge of the phone. No text.
    calm: top
    notes: "His answer to P04, without a word: nobody is seizing anyone tonight. In ch2 Taeo opened this door so Nib could go; now Nib keeps it. Don't point it out."

  - id: P06
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 3 · SEVENTY-TWO HOURS"

  # ---------------- MORNING: the call ----------------
  - id: P07
    shape: full
    gap: long
    bg: white
    camera: "establishing, eye level from the window end of the room, over the sleeping Taeo toward the door"
    art: >
      Morning in taeo_flat (A4 morning): cool grey-blue daylight; the blackout curtain behind the camera has slipped a hand's width open,
      and a band of yellow sun lies across the duvet and the floor. Soft blue shadows.
      Foreground LEFT: Taeo (taeo, default, still in last night's clothes) asleep on his back on top of the grey duvet, mouth open, one arm flung over the edge,
      his phone vibrating on his chest (motion ticks; its screen faces the ceiling, unseen).
      Middle: the folding table with the white green-banded mug on it, empty.
      Far end: Nib (nib, default) still sitting at the edge of the shoe area exactly where he sat all night, back to us, facing the door;
      he has turned his head over his LEFT shoulder (the V-notch clear) and gives the noise a look of flat disapproval. He has not slept.
      In this view the kitchenette strip and the clothes rack (black hoodies, the olive backpack with its patch on the end hook) are on the RIGHT.
      Drawn background, hard cel shadows. No text.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "8:55 AM"}
      - {who: nib, type: speech, side: r, text: "THE SHOUTING BRICK. AGAIN."}
    sfx:
      - {text: "BRRRRR", style: phone, at: [0.24, 0.66], size: M, rot: -10}
    notes: "Runner (STORY_BIBLE 6): Nib calls the phone 'the shouting brick'. 'AGAIN' counts ch2's buzz and the 3 AM notice. Reverse angle of P05."

  - id: P08
    shape: inset-r
    gap: short
    bg: white
    camera: "medium close-up, Taeo jolting upright on the bed"
    art: >
      Normal-style comedy face. Taeo (taeo, default) has jolted bolt upright on the bed: hair flattened on one side and standing up on the other,
      a red crease from the duvet across his cheek, the buzzing phone clutched to his chest in both hands.
      ACTING: the panic of a man who thinks he has overslept: eyes huge, mouth open, one big sweat drop.
      Morning grey-blue light; flat pale-blue background with a few speed lines. No text.
    calm: left
    lines:
      - {who: taeo, type: nervous, side: r, text: "I'M UP. I'M UP."}
      - {who: "offpanel:nib", type: speech, side: l, text: "IT'S BEEN LIGHT FOR TWO HOURS."}

  - id: P09
    shape: wide
    gap: short
    bg: white
    camera: "low, across the folding table at floor height, the phone between them"
    art: >
      Normal-style comedy beat. Taeo (taeo, default) kneels on the left side of the low folding table and Nib (nib, default) squats on the right,
      both bent over the phone lying flat on the tabletop (its screen faces up and away from us: draw only its dark edge and clear case).
      Simplified faces: Taeo hunched and intense, staring as if he could make the time move; Nib's flat dot-eyed deadpan stare, aimed at Taeo rather than the phone.
      The white mug at the table's edge. Morning light, the band of sun on the floor behind them, background reduced to flat grey-blue shapes. No text.
    calm: top
    lines:
      - {who: nib, type: speech, side: r, text: "WHY ARE WE STARING AT IT?"}
      - {who: taeo, type: speech, side: l, text: "THEY OPEN AT NINE."}
      - {who: nib, type: speech, side: r, text: "IS IT NINE?"}

  - id: P10
    shape: inset-l
    gap: short
    bg: white
    camera: "the phone lying on the table, buzzing (kit hand)"
    art: "KIT HAND"
    calm: none
    ui:
      - {kind: phone.ttok_notification, on: screen, hand: phone_on_table, clock: "08:59", sender: "Eunchae", text: "Manager says come in at 4."}
    lines:
      - {who: taeo, type: speech, side: r, text: "...IT'S 8:59."}
    notes: "Eunchae's message: the store has reopened after the gate, and Taeo has a 4 PM shift today (the beats put ch5 at the store). She doesn't know he awakened."

  - id: P11
    shape: wide
    gap: short
    bg: white
    camera: "eye level from the kitchenette side, the folding table in the middle, both of them leaning in"
    art: >
      The phone lies on the folding table on speaker (screen facing up and away: a dark edge only).
      Taeo (taeo, default) kneels over it, hands flat on the table edge, hair still wild; Nib (nib, default) squats on the far side
      with his notched LEFT ear turned toward the phone, eyes narrowed at the voice coming out of the brick: suspicious and fascinated.
      Behind them the desk and the bed, the window at the left edge with its band of sun. Morning grey-blue light, soft blue shadows. No text.
    calm: top
    lines:
      - {who: narr, type: tag, text: "9:00 AM"}
      - {who: receptionist, type: phone, side: c, text: "ABILITY ASSESSMENT OFFICE, MAPO BRANCH."}
      - {who: taeo, type: nervous, side: l, text: "HI. SORRY. GOOD MORNING. I GOT A NOTICE LAST NIGHT—"}

  - id: P12
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up, Nib's head cocked toward the phone"
    art: >
      Close on Nib (nib, default), head tilted so his long LEFT ear (V-notch clear) points down at the phone below the frame.
      ACTING: deep suspicion of a voice with no body: one brow down, lips pulled back just enough to show the small lower fang on the LEFT.
      Flat pale grey-blue background. No text.
    calm: right
    lines:
      - {who: receptionist, type: phone, side: c, text: "AN UNREGISTERED SUMMONING IN MANGWON-DONG. IT'S ON OUR SYSTEM."}
      - {who: "offpanel:taeo", type: speech, side: r, text: "...ALREADY?"}
    notes: "The state already knows. Gate Safety Korea's detection reached the AAO overnight."

  - id: P13
    shape: wide
    gap: short
    bg: white
    camera: "over Nib's shoulder toward Taeo across the table"
    art: >
      Over Nib's shoulder (his notched LEFT ear and spiky black hair in the foreground) toward Taeo (taeo, default), who leans over the phone on the table.
      ACTING: Taeo frowning at the word he just heard, then answering it, quiet and firm, a little surprised at himself.
      Morning light, the kitchenette behind him simplified. The phone's screen is not visible. No text.
    calm: top
    lines:
      - {who: receptionist, type: phone, side: c, text: "ELEVEN O'CLOCK TODAY. BRING ID. AND BRING IT."}
      - {who: taeo, type: speech, side: r, text: "HIM."}
      - {who: receptionist, type: phone, side: c, text: "...BRING HIM."}
    notes: "Beat line 'BRING ID. BRING HIM.' delivered as a correction: the chapter's issue (categories that don't fit people) in one word."

  - id: P14
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "extreme close-up of Nib's eyes"
    art: >
      Extreme close-up strip of Nib's eyes and brow (nib): the amber irises sliding sideways toward Taeo, off-panel.
      ACTING: he heard that. Surprise held very still, and something being filed away. Coloured line art for the close-up,
      one hard shadow under the brow, morning light. Nothing else in frame. No text.
    calm: none
    focus: [0.5, 0.5]

  - id: P15
    shape: narrow-l
    gap: short
    bg: white
    camera: "Taeo's right hand holding the phone straight to the reader (kit hand)"
    art: "KIT HAND"
    calm: none
    ui:
      - {kind: phone.aao_booking, on: screen, hand: taeo_right_front, clock: "09:02", heading: "Appointment booked", date: "DATE · WED 15 MAR", time: "TIME · 11:00", branch: "MAPO BRANCH", text: "Appointment booked · Wed 15 Mar, 11:00 · Mapo branch"}

  # ---------------- LEAVING ----------------
  - id: P16
    shape: wide
    gap: long
    bg: white
    camera: "medium, at crouching height, from the room toward the entry"
    art: >
      The entry of taeo_flat, later that morning. Taeo (taeo, outdoor: navy zip jacket over the black hoodie, the olive backpack on his back with its faded orange patch)
      crouches on the tiles of the shoe area tying a black sneaker, and holds out a pair of his own grey plastic slides from the shoe cabinet toward Nib.
      Nib (nib, default) stands at the edge of the room floor, one step above him, barefoot, and looks down at the slides: each one is nearly as long as his forearm.
      ACTING: Taeo hopeful and practical; Nib's flat, total refusal. The grey shoe cabinet in the corner; the steel door behind Taeo, closed.
      Morning grey-blue light. No text.
    calm: top
    lines:
      - {who: narr, type: tag, text: "10:31 AM"}
      - {who: taeo, type: speech, side: l, text: "DO YOU WANT SHOES? FOR OUTSIDE?"}
      - {who: nib, type: speech, side: r, text: "NO."}
    notes: "Runner (STORY_BIBLE 9): Nib vs. shoes, until he chooses boots himself in ch43."

  - id: P17
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up, Taeo crouched, counting on his fingers"
    art: >
      Taeo (taeo, outdoor) still crouched in the shoe area, one sneaker tied, counting rules off on his fingers and looking up at Nib.
      ACTING: earnest and anxious, a big brother's briefing; he believes he is being responsible. Simplified background, the edge of the grey steel door. No text.
    calm: right
    lines:
      - {who: taeo, type: speech, side: l, text: "OKAY. RULES. STAY CLOSE. THE KNIFE STAYS IN ITS SHEATH."}
      - {who: taeo, type: speech, side: l, text: "AND I DO THE TALKING, SO—"}
    notes: "Taeo's flaw (STORY_BIBLE 6): he confuses taking responsibility with keeping control."

  - id: P18
    shape: wide
    gap: short
    bg: white
    camera: "low angle from Taeo's crouching eye level, up at Nib"
    art: >
      Low angle from Taeo's crouching eye level: Nib (nib, default) standing one step up at the edge of the room floor, so for once Nib looks DOWN at him.
      ACTING: not angry; level, quiet, final. Arms loose, one hand resting on the pouch at his RIGHT hip, the brown wooden sheath on his LEFT.
      Behind him the room: the folding table and the window light, simplified to flat grey-blue shapes. No text.
    calm: top-right
    lines:
      - {who: nib, type: speech, side: l, text: "YOU DON'T DECIDE WHERE I GO."}

  - id: P19
    shape: tall
    gap: short
    bg: white
    silent: true
    camera: "from the room behind Taeo, looking at the open door"
    art: >
      Nib (nib, default) has stepped down past Taeo and pushed the steel door open himself. It swings OUT into the open-air corridor,
      and a slab of hard spring daylight falls into the entry. Nib is already walking out into it, small, upright and barefoot, not looking back:
      his silhouette against the bright corridor rail and the pale sky, the pouch on his RIGHT hip, the sheath on his LEFT.
      Foreground: Taeo still crouched on the tiles with one lace untied, frozen, looking up after him. ACTING: Taeo caught out, mouth half open.
      Cool daylight in the corridor, grey-blue shadow in the entry. No text.
    calm: top
    notes: "Motif: the open door. In ch2 Taeo opened it for Nib; this time Nib opens it himself. Don't point it out. The door opens OUT; from inside the handle is on the LEFT and the hinges on the RIGHT."

  - id: P20
    shape: inset-r
    gap: short
    bg: white
    camera: "medium, the doorway, from inside"
    art: >
      A beat later: Nib (nib, default) leans back in around the edge of the open door, just his head and shoulders, the notched LEFT ear first.
      ACTING: perfect deadpan dignity, no embarrassment at all. Bright corridor daylight behind him. Simplified background. No text.
    calm: left
    lines:
      - {who: nib, type: speech, side: r, text: "...WHICH WAY?"}
      - {who: "offpanel:taeo", type: speech, side: l, text: "RIGHT. THEN DOWN."}
    notes: "The stairs are at the corridor's north end: right, coming out of unit 402 (LOCATIONS.md)."

  # ---------------- THE STREET DOOR ----------------
  - id: P21
    shape: full
    gap: long
    bg: white
    camera: "low, from the pavement beside the building's street door, looking along the kerb with the bus in the foreground"
    art: >
      BIG REACTION. The ground floor of Taeo's building (taeo_building): the red-brick overhang above, the open piloti car park, the glass street door a step back from the pavement.
      Nib (nib, default) has taken one step onto the pavement and a green city bus is roaring past close to the kerb (taeo_street), filling the left of the frame
      as a wall of green metal and hard speed lines, the wind tearing at his hair and the hem of his wrap top.
      Nib springs backwards toward the doorway: crouched low, one hand flat against the brick, the other on his knife hilt (blade NOT drawn),
      ears flattened back, amber eyes huge with tiny pupils, mouth open on a silent snarl that shows the small lower fang on the LEFT.
      Behind him in the doorway, Taeo (taeo, outdoor) is half out of the glass door, one hand lifted, not touching him.
      Flat early-spring daylight, warm grey pavement, blue-grey shadow under the overhang. No route number and no text on the bus or anywhere.
    calm: top-right
    sfx:
      - {text: "VRRRROOOOM", style: impact, at: [0.30, 0.42], size: XL, rot: -8}
    notes: "Beat: at the street door a bus roars past and he backs into the doorway. The chapter's big reaction: fear, not comedy (no chibi, no sweat drops)."

  - id: P22
    shape: inset-r
    gap: short
    bg: white
    camera: "medium close-up, the recessed doorway"
    art: >
      Nib (nib, default) pressed back into the recess beside the glass street door, breathing hard, shoulders up, staring out at the traffic.
      Taeo (taeo, outdoor) has crouched beside him at a careful arm's length, NOT touching him, his face turned to the street too:
      keeping him company rather than looking at him. ACTING: Nib's pride fighting his pulse; Taeo gentle and patient.
      Blue-grey shadow in the recess, daylight beyond. Simplified background. No text.
    calm: left
    lines:
