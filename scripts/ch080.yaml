chapter: 80
title: Responsibilities
when: "Same afternoon as ch 79's AAO visit; that evening at the old tyre-shop base in Mapo. No Earth calendar date fixed."
story_beats: PART_ONE_BEATS.md#80
cast:
  taeo: outdoor # Navy jacket over black hoodie, black cargos, one-stripe sneakers. Bruised forearms; nosebleed stopped.
  nib: default # Exact purchased ch 43 boots and all persistent scout props.
  sera: default # River-green tunic, cream sleeves, tan trousers, braid and bone flute; LEFT brace/sling throughout.
  ilan: default # Letter only, not physically drawn; Sera's younger brother, about 19 now, about 18 when he wrote it.
  haein: default # Beige shirt, blue-grey overalls, goggles and tool belt.
  chae: default # At AAO only: navy cardigan, white collar, black trousers, low heels, blank ID, closed blue folio tablet.
  orrin: default # At base only; adult slate-shell carrier, repaired old shell seam retained.
  kesh: default # At base only; adult moth-like keeper, fully described at first appearance P25.
  sejin: default # At base: green scrubs, olive medical rig, dark cargos and boots, checking recovery.
locations: [aao_office, mapo_tyre_base]
location_notes:
  aao_office: >
    Follow locations/aao_office/key_wide.png, key_reverse.png and notes.md, and ch 79's blocking. Northern desk with two
    dark monitors; two visitor chairs to its south, broad east window and blinds, northwest shelves, navy west bench,
    southeast glass corridor entrance. Temporary salvage cart beside the desk, not a new permanent fixture.
  mapo_tyre_base: >
    Use the ch 33 old tyre-shop compound, not Taeo's container home at Ryu Survey. No drawn key available.
    Continue ch 63's raised roller shutter, scarred worktable, tyre racks and plain pegboard. Broad forecourt admits
    Orrin; meeting table stays at the open bay mouth so he and Kesh participate without squeezing into an office.
    At night a warm work lamp lights the table from inside; blue-grey forecourt beyond, brown shadows and dusty ochre wood.
props:
  nib_locks: >
    Adult 105 cm scout; LEFT ear V-notch, one lower LEFT fang, brown rope belt, RIGHT leather pouch with dinosaur sticker,
    LEFT brown wooden knife sheath. Matte black 8x30 binoculars, fork on hinge, woven strap knotted LEFT neck.
    Purchased ch 43 boots unchanged: matte dark-brown ankle leather, broad round toes, black low-heeled lug soles, four dull
    gunmetal eyelet pairs each, dark-brown round laces in small double knots, heel pull tabs, oat-grey socks inside collars.
    No hooks, buckles, logos, steel caps or red stitching. Pale-blue ID, cobalt fork-mark pencil and folded PAPER post drawing protected in pouch.
  cylinder: >
    Same dull bronze waterproof cylinder from ch 79, one hand long, recessed screw cap and dark wax beneath locking collar;
    exact settlement emblem from ch 62. Haein opens it at Sera's request. Dry folded paper inside, no electronic device.
    Both cap and wax fragments are retained on cloth; opened cylinder and original letter go with Sera.
  ilan_letter: >
    One dry folded sheet, written a year before the present, sent through an old physical relay. Letterer supplies ALL
    readable words. Settlement-calendar date: RIVER YEAR 306 / FLOOD MONTH / DAY 12; Sera identifies 306 as last year.
    This native calendar has no asserted conversion to Earth's months or dates. Ilan signs his own name.
    He was at a refuge, working with people who needed him, with responsibilities; he does not ask for rescue.
  charter: "One fresh ordinary cream sheet; Taeo writes the heading and first rule at the end. No guild name or emblem chosen yet."
palette_notes: >
  AAO A4 blue-white daylight and light slate shadows, navy clothes. Base evening adapts A4 yard ochre/brown with
  a practical warm lamp and blue-grey night outside. No flashback or live image of Ilan. No supernatural link colours,
  system windows or glowing letter. Quiet acts use normal adult proportions; chibi reserved for safe meeting logistics.
continuity_notes: >
  This is Arc VI's finale. The river is cleared, the failure disclosed, and a cooperative path identified. The crew
  now commits to founding its own cooperative guild and declines a proposed premature next job. No licence, capital,
  legal exemption or building is acquired yet; ch 81 handles requirements. Sera's injury and Taeo's recoil persist.
  Ilan's whereabouts NOW remain unknown. The letter proves his situation a year ago, not present safety or imprisonment.

panels:
  - id: P01
    shape: tall
    gap: none
    bg: white
    camera: "same downward close angle as ch 79's cylinder hook, widening to Sera's face"
    art: >
      Continue aao_office's final ch 79 position: Sera (default river clothes, LEFT brace/sling) holds the sealed bronze
      cylinder in her RIGHT hand over a cloth on her lap. Its exact settlement mark faces us. ACTING: lips part, fear
      of hope held in her jaw. East window daylight, bronze and river-green against slate. No opened cap, sender or glowing relic.
    calm: top
    lines:
      - {who: sera, type: speech, side: r, text: "THE COLLAR OPENS TO THE LEFT."}
      - {who: sera, type: speech, side: r, text: "OPEN IT."}
    notes: "Immediate continuation from ch 79. Sera asks for assistance because the injured arm cannot hold the cylinder against torque."

  - id: P02
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up on Haein's hands at the locking collar"
    art: >
      In aao_office Haein's gloved hands brace the cylinder in folded cloth and turn its collar left. The dark wax seal
      breaks cleanly over the tray, little pieces caught rather than scattered. Sera's RIGHT fingertips stay clear.
      ACTING in the hands: careful restraint. East daylight on dull bronze, slate shadow. No readable marks beyond the existing emblem.
    calm: none
    sfx:
      - {text: "KTK", style: quiet, at: [0.56, 0.50], size: S, rot: 0}

  - id: P03
    shape: narrow-l
    gap: short
    bg: white
    silent: true
    camera: "macro from above into the open cylinder"
    art: >
      aao_office, tight overhead: the bronze cap lies on the cloth, and Haein's gloved fingertips lift one folded DRY
      cream sheet from the cylinder. River silt remains outside the collar, never on the paper. The inner face of the
      fold is still concealed. Blue-white east light, slate and cream. No hologram, generated writing or second message.
    calm: none

