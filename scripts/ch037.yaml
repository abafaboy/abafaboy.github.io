chapter: 37
title: Down
when: "Same surge night, immediately after Seoryun's shield lands in ch 36. Street cover, the refused salvage, then the final obstruction in F. Ch 38 begins at the shell crack without a time jump."
story_beats: PART_ONE_BEATS.md#37
cast:
  taeo: outdoors # navy zip jacket over black hoodie, black cargos/striped sneakers; old-patch olive bag, RIGHT-eye mole; bruising/nosebleed late
  nib: default # adult barefoot scout; LEFT ear notch/lower fang; brown rope belt, RIGHT stickered pouch, LEFT wooden sheath; binoculars
  orrin: default # adult stoneback, 230 cm long/135 cm shell; intact until final story panel, then upper LEFT-front shell crack
  minho: default # brown jacket, grey tee, olive cargos/knee pads, LEFT grey streak, chest radio/LEFT watch
  haein: default # slate-blue bib overalls, beige tee, bob, glasses/tool belt
  sejin: default # sage scrubs, olive medic rig, charcoal cargos
  seoryun: default # olive field jacket, black tee, dark tactical trousers/boots; low ponytail, LEFT brow scar; physical hex shield/current redesigned-door emblem
  dami: default # evacuation-job kit matches current model: 19, 157 cm, short low ponytail/choppy fringe; grey hoodie, sixteen-pocket faded ochre vest, olive cargos, dull yellow hard hat, brown gloves/cargo straps; no GO FIRST patch
extras:
  hounds: "Same THREE charcoal lean angular hounds with overlong forelegs and bony brows; no extras."
  pharmacist: "Cream cardigan, short black perm, key ring; remains one of last four."
  office_man: "Grey office shirt, loosened navy tie; remains one of last four, now assisting an injured woman."
  ankle_woman: "About 45, beige spring coat, dark trousers; left ankle sprain, the second group's unsteady Orrin passenger; not the mauve-vested elder already outside."
  last_child: "Four-year-old boy, about 95 cm, cropped black hair, dusty blue padded jacket, grey leggings, socked feet; last child still inside at hook. Both shoes lost; one possible match at F trestle."
  reunited_child: "Six-year-old girl, black bob, muted yellow raincoat, striped leggings and white sneakers; Dami carries her to the protected exit approach."
  reunited_mother: "Woman about 35, chin-length black hair, beige raincoat over pyjamas, scraped palms; already in Sejin's NORTH casualty bay."
  pharmacy_evacees: "The other six of the remaining ten pharmacy civilians, ordinary muted spring workwear; all exit in the eight-person movement here."
  ryu_crew: "Two survey workers, orange vests/white helmets; manage cable and handoffs."
  deep_team: "Seoryun's olive-uniformed rescue workers; heard over radio from the deeper sector."
locations: [sinjeong_street, sinjeong_f_stair, sinjeong_f_landing, sinjeong_arcade]
location_notes:
  sinjeong_street: "Same ch 34–36 set: F stair on NORTH pavement, command tent/casualty bay WEST, main descent farther WEST, broken lightwell EAST. Three hounds at EAST approach. Physical concrete barriers protect Haein and Sejin. Reporter remains behind media barrier; no camera follows Dami below."
  sinjeong_f_stair: "Alias sinjeong_stairwell in ch 38. 14 steps down SOUTH, street opening NORTH; 3 m square stair-side apron immediately NORTH of bottom steel door. Base trestle WEST of top; Haein's connected base box behind WEST concrete barrier, blue shoe/white heel on trestle. EAST-hinged door initially wedged against EAST wall; falling lintel twists jamb and reduces opening late. Taeo moves to stair-side lower apron P32a, always outside service corridor."
  sinjeong_f_landing: "Alias sinjeong_arcade_f in ch 38. 3 m square landing directly SOUTH of fire door, NORTH of new T obstruction; overhead concrete lintel and EAST pipe chase. A new narrow crack in displaced EAST partition exposes gate-side anchor cluster two steps away, accessible before late collapse but outside safe passage. Orrin faces SOUTH; to retreat he must back NORTH through door to stair-side apron, then up stairs. WEST strip stays a low crawl space."
  sinjeong_arcade: "T's original NORTH arm blocked by gate-side stone; stockroom bypass reconnects NORTH of it. White cable/blue metre bands remains intact, including bypass loop. Grey relay tripods every 50 m. All action is on terrestrial side; no dungeon return marks or boss-clear shortcut."
continuity_notes: "Twelve civilians inside at opening. Eight reach protected exit approach in this chapter: six other pharmacy civilians, yellow-raincoat girl with Dami, and Orrin's other passenger. Last four at hook: pharmacist, office man, ankle woman and blue-shoe boy. Nib stays beside last boy; Dami has girl near NORTH/outer side of fire door, unseen by cameras, ready for ch 38 reunion. Minho guards inside. Seoryun returns to her deeper sector before F's lintel collapse."
