chapter: 35
title: Passage F
when: "Same night, immediately after ch 34. First evacuation circuit, then the surge changes the route. No clock time or new date is fixed."
story_beats: PART_ONE_BEATS.md#35
cast:
  taeo: outdoors # navy jacket, black hoodie/cargos, striped black sneakers; old-patch olive bag, cracked dinosaur-sticker phone; mole RIGHT eye
  nib: default # adult barefoot scout; LEFT notch, LEFT lower fang, brown belt, RIGHT pouch/dinosaur sticker, LEFT wooden sheath; binoculars
  orrin: default # adult 230 cm stoneback; slate shell intact this chapter; no harness
  minho: default # brown jacket, grey tee, olive cargos/knee pads, LEFT grey streak, chest radio/LEFT watch
  haein: default # slate-blue overalls, beige tee, bob, tool belt, glasses
  sejin: default # sage scrubs, olive medical rig, charcoal cargos
  baek: default
extras:
  pharmacist: "Woman about 50, short practical black perm, pale cream cardigan over grey blouse, no white coat; key ring at waist, scraped knuckles."
  elder_woman: "About 78, silver hair in a short curl, mauve padded vest, charcoal skirt over leggings, swollen right ankle wrapped in a scarf."
  elder_man: "About 75, thinning grey hair, brown cardigan and dark trousers, folding cane, makes jokes when frightened."
  office_man: "About 40, rumpled light grey office shirt and loosened navy tie; frightened and ashamed of being frightened."
  civilians: "Eighteen people initially shelter in the pharmacy including the named three civilians; mix of shop workers and customers, all living."
  ryu_crew: "Established stocky male worker and younger woman, orange vests, white helmets; survey cable and torches."
  meridian_team: "Four adult responders in navy high-collar field uniforms, silver shoulder yokes/piping, dark boots, geometric left-chest pins; efficient, stretcher and shields."
locations: [sinjeong_pharmacy, sinjeong_arcade, sinjeong_f_stair, sinjeong_street]
location_notes:
  sinjeong_pharmacy: "New set, no key. WEST branch of F's T. Wide public doorway faces EAST; a bent security shutter is held 1.7 m up. Counter along NORTH wall, medicine shelves behind it, all packaging blank. South wall has low waiting bench. Narrow WEST rear door leads to pharmacy stockroom; adjoining clothing-shop stockroom can be reached beyond it in ch 36. No pharmacy window to street."
  sinjeong_arcade: "Reuse ch 34 geography: F runs SOUTH from north stair landing 20 m to T; pharmacy WEST, food court EAST. Grey tile, cream upper walls, exposed pipes. On first return, turn RIGHT/NORTH at T. Late this chapter expansion of food-court Gate 3 pushes gate-side stone and shop structure across the NORTH arm of the T. Cable survives in a floor utility recess beneath the obstruction. The bypass is west through stockrooms to a dogleg joining F NORTH of this wall."
  sinjeong_f_stair: "14 steps down SOUTH from NORTH pavement; service fire door bottom EAST-hinged, opens against landing EAST wall. Base trestle and field box WEST of street top. Blue child trainer with white heel starts on step 9; Taeo moves it to the trestle P24. White cable/blue metre bands along WEST edge; grey relays at 50 m intervals."
  sinjeong_street: "Command tent/casualty bay on NORTH pavement WEST of F stair. Press SOUTH across road. Main descent farther WEST. Work lights cold white; night blue-grey with restrained red warnings."
continuity_notes: "All rescue passages remain outside dungeon thresholds; no return marks. Radio works because the blue-banded survey cable remains intact. Knock code is deliberately reused through an ordinary steel service door: two outside = come back; three inside = coming. No boss death, automatic return, new alignment or money awarded."
