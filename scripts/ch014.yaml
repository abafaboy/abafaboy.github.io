chapter: 14
title: Roll Call
when: "Thursday, mid-spring, the Guro job day. Opens immediately after ch 13's 1:02 PM roll call; 1:12 PM the overview, 1:20 PM the jacket, 1:37 PM the delivery, 1:55 PM Dami's return, 2:10 PM the wall and about 2:11 PM the hook. Ch 15 answers at about 2:12 PM. Taeo stays outside; Nib scouts ahead of the two Ryu crew laying cable and relays behind him."
story_beats: PART_ONE_BEATS.md#14
cast:
  taeo: outdoor     # outdoor outfit; ONE mole under RIGHT eye. Borrowed white Ryu hard hat throughout. Olive backpack with faded orange shield-and-open-door patch hangs on his folding chair. Coiled handset in LEFT hand; amber pulse in RIGHT palm. He stays outside.
  nib: default      # barefoot; white Ryu hard hat with two drilled ear holes and buckled chin strap from ch 13 P09; V-notch LEFT ear, lower fang LEFT. Radio in LEFT hand; pouch RIGHT hip with dinosaur sticker and, from P29, Kwak's sky-blue L-shaped inhaler with BLUE cap. Brown wooden sheath LEFT hip. No binoculars until ch 19.
  minho: default    # brown work jacket, grey T-shirt, olive cargo trousers with black knee pads, brown boots; grey streak at his LEFT temple; radio clipped high on his LEFT chest; a clipboard with a pencil survey sheet (as ch 15). White Ryu hard hat throughout
  haein: default    # work overalls, tool belt, white hard hat with safety glasses on its brim, headphones round her neck, a red-orange Ryu Survey vest (as ch 16); she runs the base radio and the relay cable she thought of in ch 11
  sejin: default    # medic's chest rig, cropped hair, tired eyes, white hard hat; her white first-aid tent is behind the radio table (as ch 15)
  dami: default     # lime-yellow porter vest over a grey hoodie, scuffed white hard hat, cargo straps, worn gloves, an aluminium A-frame carrier; a cheap phone in a cracked rubber case (screen always turned away or dark)
  dokgo: default    # windbreaker, clipboard tablet clamped under his LEFT arm, an unlit cigarette; TWO phones: the porter-app phone in his LEFT hand, the general contractor's call phone in his chest pocket (as ch 15)
  mansu: default    # P18 memory only. Kwak Mansu, 58 (PART_ONE_BEATS ch 13): heavy-set, short grey hair, grey stubble, a lime-yellow porter vest over a grey thermal top, a back brace (as ch 15–16)
extras:
  porters: "EIGHT Dokgo porters: 01–06, Dami 07 and Kwak 08. Seven present with Kwak missing, Dami included. Ch 13 outfits: yellow-green vests, white number patches, scuffed WHITE hard hats, worn gloves and A-frame loads."
  crew: "The two Ryu line crew from ch 13: stocky man and young woman, red-orange vests and white hard hats; the existing construct mule carries the cable drum. They lay and test cable behind Nib, separate from Dokgo's eight-person roster."
locations: [guro_gate_inside, guro_pit]
location_notes:
  guro_pit: "no key yet (decided here). A building foundation pit in Guro-gu, among older four-storey factory blocks and new glass office towers (the old Guro industrial district that became the Guro Digital Complex). About 60 x 40 m and 12 m deep. Walls of rusty steel H-piles with timber lagging boards between them; two levels of horizontal steel struts and corner braces cross the pit wall to wall at about 4 m and 8 m up; an idle tower crane in the north-west corner. A gravel truck ramp runs down the south wall: Dokgo's battered flatbed truck parks at its top, the single white Ryu Survey van at its foot. Floor: packed grey gravel and mud, puddles, rebar bundles, stacked formwork. THE GATE stands near the middle of the north wall: a door-height black-violet slit with a cold white-cyan rim, on end among the rebar, inside a square frame of scaffold tubes bolted to four concrete blocks, with a ring of orange safety mesh about 10 m across round it and one opening on its south side. Outside the ring, left to right as seen from the ramp: Ryu Survey's white pop-up canopy and folding table (the line's base station, the cable drum, a radio charging rack, two folding chairs; Taeo's chair faces the gate) with the white cable running in through the frame's lower left corner; Dokgo's folding table 4 m to its right (thermos, tablet, two phones); the porters' staging area (crates, steel props, cargo straps) with a jacket rack made of a scaffold tube on two trestles, about 8 m from Ryu's table and in Taeo's line of sight; and Sejin's small white first-aid tent with a plain green cross on the far right near the ramp. The radio table is 8 m outside the frame; a coiled handset cannot reach the frame from the table. White hard hats remain on during site work, including Nib's drilled hat. Supplemental white station stakes with orange tips and white clip lamps stand every 40 m; they do not replace the cable or grey relay tripods every 50 m."
  guro_gate_inside: "no key yet (decided here). The C-grade dungeon. The threshold opens onto THE LANDING, a broad ledge of pale slate-grey slab-stone with the first relay post. Beyond it lies THE BASIN: a vast quarry of stacked grey slab terraces like collapsed shelves, cut with low black galleries. Every surface and the horizon slope about 10 degrees down to the LEFT (as seen looking in), so walkers lean into the slope. The sky is GREEN DUSK: deep teal-green overhead grading to pale acid green at the horizon; shadows violet. THE SURVEY LINE is Ryu Survey's white cable with a blue band every metre, laid along the route, with a relay post every 50 m (a short grey tripod with a small box, a loudspeaker grille, a handset on a coiled cord and a small white status lamp). THE STAGING SHELF, 80 m in, is the porters' turnaround; on its LEFT wall is the arched entrance of THE LOWER GALLERY, a low covered tunnel through the slab: unsurveyed, 40 m shorter than the upper run, with side galleries branching off it in the dark. THE UPPER RUN follows the cable along an open terrace. THE FORWARD CAMP, about 300 m in, is a broad shelf where the two routes meet again, with stacked crates of steel props, lamps and water drums for the clear team and a relay post; the lower gallery's EXIT is a lower, narrower arch on its left side. The survey line carries on past the forward camp toward the boss territory. From P47 both gallery mouths have red-and-white hazard tape tied across them. Beyond the forward camp the upper run continues to station 20, about 800 m from the threshold. Supplemental stations every 40 m; relay tripods every 50 m. At station 14 a dust-sifting side branch bears Kett's mark from P37. At station 20 a fresh rubble wall about 3 m high blocks a roofed side gallery; a finger-wide crack at Nib's face height blows cold air outward."
palette_notes: "Pit (outside): bright afternoon sun from the upper right, short hard shadows; dusty grey-ochre gravel, grey steel and concrete, warm brown shadows; rusty steel struts and lime porter vests kept muted; Haein's red-orange vest and the orange safety mesh and cable never read as the link amber. The gate's violet-black core and cold white-cyan rim are the strongest colour outside. The blue of Kwak's inhaler is the one saturated cool note of the jacket scene. Inside the gate: a saturated green-dusk sky, pale grey stone, violet shadows, the warm-white stake lamps. Amber #F2A93B appears only as Nib's eyes and in Taeo's RIGHT palm (P40, P51). There is no red in the art; red appears only in the lettered UI (the app's penalty line). There are NO operator-interface windows in this chapter: the interface stays dark until ch 19. Page background: black for the cold open, the order (P34–P40) and the last six panels; white elsewhere. The relay (ch 11's idea, Haein's cable): radios still drop out at a threshold (ch 10), so a hard cable through the rim carries the signal, the way a knock carries through the frame. Every voice that comes through the relay or a phone is a phone bubble with its tail to the device."

panels:

  # ---------------- COLD OPEN ----------------
  - id: P01
    shape: full
    gap: none
    bg: black
    silent: true
    camera: "inside the gate, high and wide from a broken arch, looking along the porters' file as it moves away"
    art: >
      Inside the Guro gate (guro_gate_inside), at the forward camp beside the taped lower-gallery exit, moments after the roll call. A file of seven Dokgo Contracting porters (extras.porters) moves off along the tilted pale-grey slab terrace, away from us, crates and steel
      shoring props strapped to their aluminium A-frames, heads down, nobody talking. In the file there is one obvious GAP: an empty stretch of
      floor, two body-lengths long, where one more person should be walking. At the back of the file, Gu Dami (dami, default: lime-yellow porter
      vest over a grey hoodie, scuffed white hard hat, cargo straps, worn gloves, an A-frame with a crate) has stopped and looks back over her
      shoulder, past the camera, toward the dark side branches of the maze behind us: jaw tight, eyes searching, not crying. The porter ahead of
      her has half turned to wave her on with a tired hand. The white cable with blue metre bands follows the terrace; a grey relay tripod with a white lamp stands by the taped arch. Saturated
      green-dusk sky between broken arches; pale stone; long violet shadows. No Dokgo, no hunters, no creatures, no letters or numbers anywhere.
    calm: top-right
    notes: "Straight on from ch 13's hook ('HE'S RESTING SOMEWHERE. KEEP MOVING.'): they kept moving. The gap is Kwak Mansu. Do not show Dokgo here (ch 13 decides where he stood for the roll call)."

  - id: P02
    shape: strip
    gap: short
    bg: black
    camera: "outside, extreme close-up of a thumb on a phone"
    art: >
      Outside, on the pit floor (guro_pit). Extreme close-up of Dokgo Chul's LEFT hand (dokgo: thick, nicotine-stained fingers, a cracked dirty
      thumbnail, the frayed cuff of his windbreaker) holding a cheap rugged phone upright in a scuffed black case. Screen: green. His thumb has
      just tapped the lower third of the screen and is lifting off, casual, a chore done. Behind: grey gravel and the corner of an orange
      water-filled barrier as flat, simplified shapes. Hard afternoon light, one crisp shadow under the thumb. Keep the phone in the middle third.
    calm: none
    ui:
      - {kind: phone.info_card, on: screen, title: "DOKGO CONTRACTING · ROLL CALL", text: "ALL ACCOUNTED FOR · KWAK MANSU: ON BREAK (UNPAID)"}
    sfx:
      - {text: "TAP", style: quiet, at: [0.64, 0.66], size: S, rot: 0}
    notes: "PAYOFF P08 (begins): the app that counted down the lateness penalty in ch 13 now does the boss's thinking. A roster screen of the same app whose clock screen is P09 and ch 15 P08 (the kit has no porter-app kind, so phone.info_card stands in for this screen)."

  - id: P03
    shape: wide
    gap: short
    bg: black
    camera: "eye level, a two-shot beside the threshold frame: Dokgo near and walking out of frame, Taeo two steps behind"
    art: >
      The pit floor beside the gate's scaffold-tube threshold frame (guro_pit): the slit's black-violet core and cold white-cyan rim at the
      left edge of frame, the white survey cable with a blue band every metre running into it, four concrete blocks bolting down the frame's feet. Dokgo Chul (dokgo, default:
      in his fifties, windbreaker, clipboard tablet clamped under his LEFT arm, an unlit cigarette in the corner of his mouth) slides the phone into
      his pocket without looking back, already walking away to the right: flat, tired, final. Two steps behind him, Taeo (taeo, outdoor: navy zip
      jacket over the black hoodie) has one hand half raised, polite and anxious, like a man trying to stop a bus that will not stop.
      Grey gravel, warm brown shadow, the gate's violet the one strong colour.
    calm: top
    lines:
      - {who: taeo, type: nervous, side: r, text: "S-SORRY. YOUR PORTER— HE DIDN'T ANSWER."}
      - {who: dokgo, type: speech, side: l, text: "THEN HE'S ON BREAK."}

  - id: P04
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 14 · ROLL CALL"

  # ---------------- DOKGO'S LOGIC ----------------
  - id: P05
    shape: full
    gap: long
    bg: white
    camera: "establishing, high angle from the pit rim, looking down and across the pit floor"
    art: >
      The Guro construction pit (guro_pit) from its rim, early afternoon. A deep rectangular excavation walled with steel H-piles and timber
      lagging, braced across the top by rusty steel struts that lay a grid of hard shadow bars across the grey gravel floor. Centre-left, on a
      gravel pad, the gate: a door-height black-violet slit with a cold white-cyan rim inside a square scaffold-tube threshold frame, ringed by
      orange safety mesh, a white survey cable with blue bands running into it. LEFT of the frame, 8 m outside it: the white Ryu pop-up canopy over the folding radio table with one small figure at it (Haein at the chunky base radio), upturned crates, an olive backpack on the back of Taeo's folding chair, and, far RIGHT near the ramp, Sejin seated at her white first-aid tent. RIGHT of Ryu's canopy: Dokgo's separate folding table and crates on pallets,
      a rack of steel shoring props, A-frames, porters resting on crates, a scaffold-tube jacket rack on two trestles; and three small figures walking past the pallets
      (a man in a windbreaker, a man in a brown work jacket, and Taeo a step behind). At the rim: an idle tower crane, a parked excavator with its
      bucket down, a concrete pump truck with its boom folded and two ready-mix trucks with their drums turning. Beyond, the backs of Guro office
      towers and apartment blocks, simplified. Drawn and detailed; site boards are blank panels. Bright afternoon sun from the upper right;
      dusty grey-ochre, warm brown shadows; the gate's violet is the strongest colour.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "GURO-GU · THURSDAY · 1:12 PM"}
    notes: "Same composition as ch 15 P06 (radio table LEFT of the frame, Dokgo's staging RIGHT). The waiting ready-mix trucks are why an hour costs ₩5,000,000 (ch 16 notes); never say so."

  - id: P06
    shape: wide
    gap: short
    bg: white
    camera: "tracking, medium, side-on as three men walk past the pallets"
    art: >
      Beside Dokgo's separate folding table and staging pallets (guro_pit). Dokgo (left) walks along the pallets counting crates with a tap
      of two fingers, never breaking stride, the unlit cigarette bobbing, the porter-app phone in his LEFT hand. Minho (minho, default: brown work
      jacket, grey T-shirt, grey streak at his LEFT temple, radio clipped high on his LEFT chest, clipboard in hand) keeps pace at his right shoulder,
      frowning hard, pressing him. Taeo trails a step behind Minho, anxious. The porters' scaffold-tube jacket rack behind them as soft flat shapes.
      Hard sun from the upper right, warm brown shadows.
    calm: top
    lines:
      - {who: minho, type: speech, side: r, text: "ON BREAK WHERE?"}
      - {who: dokgo, type: speech, side: l, text: "KWAK'S CARRIED FOR ME TWENTY YEARS. HE GETS WINDED, HE FINDS A CORNER, HE SITS."}
      - {who: dokgo, type: speech, side: l, text: "HE'S DONE IT BEFORE."}
    notes: "Dokgo is reasonable and knows his man; that is what makes it work. He is even half right: in ch 15 Kwak turns out to have stepped into a side gallery."

  - id: P07
    shape: full
    gap: short
    bg: white
    camera: "low angle from gravel level, looking up at Dokgo with the struts and sky above him"
    art: >
      Dokgo has stopped and turned, and points his unlit cigarette back over his shoulder at the gate like a pointer. Above and behind him the yellow
      struts cut the pale sky into a grid. His face is confident and patient, almost kind: a man explaining the trade to people who don't know it.
      Minho and Taeo listen at the two edges of the frame, in the near foreground and lower than he is, cut off at the shoulder. Hard sun from the
      upper right, hard shadows.
    calm: top-left
    lines:
      - {who: dokgo, type: speech, side: c, text: "AT FOUR, IRONCLAD SEVEN KILL THE BOSS."}
      - {who: dokgo, type: speech, side: c, text: "THIRTY SECONDS LATER, EVERY MARK IN THERE GOES OFF. HE COMES OUT WITH THE REST."}
    notes: "The return-mark rule (ch 10): boss dies, entry closes, 30 seconds, automatic, unconscious or not. Ironclad Seven is the clear team (ch 16, ch 18). Ch 15 P11 restates this logic."

  - id: P08
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up, three-quarter, on Taeo"
    art: >
      Taeo, half convinced and wanting to be: his eyes slide away toward the gate, his mouth trying out a polite agreement it doesn't quite reach.
      The small mole under his RIGHT eye. Simplified gravel-and-strut background.
    calm: left
    lines:
      - {who: taeo, type: speech, side: r, text: "...IF HE'S FINE."}
      - {who: "offpanel:dokgo", type: speech, side: l, text: "HE'S FINE."}
    notes: "The beat's 'it sounds reasonable, if Kwak is fine', said out loud by the one person who will later act on the 'if'."

  - id: P09
    shape: narrow-l
    gap: short
    bg: white
    camera: "straight on: Dokgo's phone held up toward the camera from Minho's eye line"
    art: >
      Dokgo holds the cheap rugged phone up in his LEFT hand at arm's length, upright in portrait, screen toward us. Screen: green. Behind it his
      face is half hidden: one tired eye, the unlit cigarette. Above him, a slice of the rusty steel strut grid and the pale sky. Hard sun.
    calm: none
    ui:
      - {kind: phone.quickhaul_order, on: screen, header: "DOKGO CONTRACTING", destination: "GURO PIT · READY FOR CLEAR 4:00 PM", timer: "02:46:38", rating: "CLIENT PENALTY CLAUSE", penalty: "LATE −₩5,000,000 / HOUR", button: "LOG RUN", clock: "13:13", text: "GURO PIT · READY FOR CLEAR 4:00 PM · 02:46:38 · LATE −₩5,000,000 / HOUR"}
    lines:
      - {who: dokgo, type: speech, side: l, text: "SEARCHING COSTS TIME."}
      - {who: dokgo, type: speech, side: l, text: "TIME COSTS FIVE MILLION AN HOUR."}
    notes: "PAYOFF P08: the ch 13 penalty clause decides the boss's order. The 13:13:22 countdown is to the 16:00 handover; ch 15 P09 separately shows readiness for the 15:00 clear-team entry. Note for the letterer: phone.quickhaul_order currently prints the QuickHaul header and button whatever the ui says; Dokgo's app needs its header and button honoured."

  - id: P10
    shape: wide
    gap: short
    bg: white
    camera: "over Minho's right shoulder, toward Dokgo and Taeo"
    art: >
      Over Minho's shoulder (his brown work jacket and the radio on his chest in the near foreground, right). Dokgo jabs the phone toward Taeo, who
      flinches back with both palms up. Dokgo is not angry, only certain, the cigarette jutting. Behind them, the canopy, the pallets and the
      shoring-prop rack as flat shapes.
    calm: top-left
    lines:
      - {who: dokgo, type: speech, side: l, text: "I PULL FOUR PORTERS TO LOOK, THE HAUL'S LATE. THE CLEAR'S LATE."}
      - {who: dokgo, type: speech, side: l, text: "WHO PAYS THAT? YOU?"}
    notes: "A question ch 15 answers ('GO. I'LL PAY THE PENALTY.' / 'THEN TAKE IT FROM MY DEPOSIT.'). Taeo says nothing here."

  - id: P11
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up, slightly high, on Taeo"
    art: >
      Taeo's polite face draining: a fixed little smile that has stopped meaning anything, one bead of sweat at his temple, his eyes doing a sum
      somewhere far off. The small mole under his RIGHT eye. Plain pale background.
    calm: right
    lines:
      - {who: taeo, type: float, text: "I DID THE MATHS. I ALWAYS DO THE MATHS."}
    notes: "He is thinking of his flat's ₩5,000,000 deposit; do not show or say the figure (ch 15 reveals it: 'THEN TAKE IT FROM MY DEPOSIT'). Also sets up ch 15 P34's won counter."

  - id: P12
    shape: wide
    gap: short
    bg: white
    camera: "from behind the radio table, looking out at Minho and Taeo walking back toward it"
    art: >
      From behind the radio table (guro_pit): the chunky base radio with its short antenna mast and coiled handset and the charging rack in the near
      foreground; Taeo's olive backpack on the back of his folding chair beside the table, faded orange patch out. Minho and Taeo walk back toward us across the
      gravel through the strut-shadow bars. Minho rubs the back of his neck, eyes on the ground, talking low, the clipboard under his arm. Taeo looks
      back over his shoulder at Dokgo, small in the distance at his separate folding table.
    calm: top
    lines:
      - {who: minho, type: speech, side: l, text: "HE'S NOT WRONG. THE CLEAR TEAM WALKS OUR LINE AT THREE."}
      - {who: minho, type: speech, side: l, text: "SAME CLAUSE IN OUR CONTRACT. FIVE MILLION AN HOUR."}
      - {who: minho, type: speech, side: l, text: "AND BLUEBIRD ALREADY TOOK ONE VAN."}
    notes: "PAYOFF P08 (cont.): the clause flows down the chain to Ryu Survey. Clear-team entry 15:00 (ch 16), client deadline 16:00 (ch 15–16). The van is ch 12's tow ('I'VE GOT TWO VANS LEFT', ch 15). Do not state the Bluebird debt figure (hidden until ch 26)."

  - id: P13
    shape: narrow-r
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag, a tall wobbling totem of chibis on a flat dusty-ochre background with screentone dots. At the very top, a huge smug chibi in a suit
      and tie lounges in an office chair, sipping coffee. Under him, chibi Dokgo, a phone at each ear, sweat drops flying. Under Dokgo, chibi Minho
      (grey streak at his LEFT temple, radio on his chest), deadpan, holding the whole stack up with a clipboard. Under Minho, chibi Taeo, sweating
      bullets. At the very bottom, squashed flat as pancakes side by side: chibi Dami (hard hat, A-frame) and chibi Nib (deadpan dot eyes; notched
      LEFT ear, brown rope belt, pouch and wooden sheath all present). No scene detail.
    calm: none
    lines:
      - {who: minho, type: speech, side: r, text: "IT ALL ROLLS DOWNHILL."}
    notes: "Comedy beat (ART_BIBLE A5b). It also quietly shows Taeo sitting on Nib, which is what he does in P35. Ch 15 uses the grey-hair runner twice, so this chapter skips it."

  - id: P14
    shape: wide
    gap: short
    bg: white
    camera: "eye level, across the radio table from the gate side"
    art: >
      Back to normal style. The radio table (guro_pit). Haein (haein, default: overalls, tool belt, safety glasses pushed up, headphones round her
      neck, red-orange Ryu Survey vest) thumps the top of the chunky base radio with the heel of her hand, unimpressed. Taeo sits on an upturned crate
      in the middle, leaning in to the radio's speaker grille with the coiled handset in his LEFT hand. Minho drops onto the crate at the right end
      with his clipboard and pencil. Far to the RIGHT, at the white first-aid tent, Sejin (sejin, default: medic's chest rig, cropped hair) sits eating a
      triangle kimbap. Bright sun, short hard shadows.
    calm: top
    lines:
      - {who: nib, type: phone, side: c, text: "STAKE ELEVEN. GROUND'S GOOD."}
      - {who: haein, type: speech, side: l, text: "SEE? IT WORKS IF YOU HIT IT."}
      - {who: taeo, type: speech, side: c, text: "...SAME."}
    sfx:
      - {text: "BONK", style: comic, at: [0.20, 0.42], size: M, rot: -10}
      - {text: "KSSH", style: quiet, at: [0.50, 0.30], size: S, rot: 4}
    notes: "Nib's voice comes through the relay: phone bubble, tail to the speaker grille. Nib stakes the line and calls each stake in; Minho logs them on his pencil sheet."

  # ---------------- THE JACKET ----------------
  - id: P15
    shape: wide
    gap: long
    bg: white
    silent: true
    camera: "eye level under the canopy, Dami three-quarter in front of the rope of jackets"
    art: >
      At Dokgo's staging (guro_pit): a scaffold-tube rack on two trestles, hung with the porters' jackets, bags and a
      towel. Dami, just out of the gate with an empty A-frame, stands still in front of the THIRD hook from the LEFT and its jacket: a worn faded navy canvas work jacket, frayed at the cuffs, the shoulders rubbed pale by years of straps. Her gloved hand holds its sleeve. Her face: the moment she
      understands it is still here and he is still in there. Strut shadows across the gravel beyond the rack; the gate's violet at the frame edge.
    notes: "Kwak's jacket as in ch 15 P07 (faded navy canvas, LEFT chest pocket)."

  - id: P16
    shape: full
    gap: short
    bg: white
    camera: "medium-wide, from the end of the radio table, Dami arriving from the right"
    art: >
      The radio table. Dami strides in from the right and slaps the navy canvas jacket down on the table beside the base radio, hard enough that a radio
      jumps in the charging rack. Taeo, on his crate, jolts back. Haein at the left end looks up from the radio. Minho at the right end looks over his
      clipboard. Dami's face: furious and frightened at once, chin up. Bright sun, the gate's violet edge behind.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "1:20 PM"}
      - {who: dami, type: speech, side: r, text: "THIS IS MANSU-AJEOSSI'S."}
      - {who: taeo, type: speech, side: l, text: "THE PORTER WHO DIDN'T—"}
    notes: "It is 13:20 (PART_ONE_BEATS ch 14). Dami calls Kwak 'Mansu-ajeossi', as in ch 15."

  - id: P17
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up, the jacket's LEFT chest pocket"
    art: >
      Extreme close-up: Dami's worn glove pulls a sky-blue L-shaped inhaler with a BLUE cap out of the navy canvas jacket's LEFT chest pocket. The frayed pocket edge,
      a pencil stub and a folded blank receipt still inside. The blue plastic is the one saturated note. Keep it in the middle third.
    calm: none
    lines:
      - {who: dami, type: speech, side: r, text: "HIS INHALER."}

  - id: P18
    shape: vignette
    gap: short
    bg: white
    camera: "memory, medium close-up, soft-edged"
    art: >
      A soft-edged memory vignette, desaturated and cooler, fading into the white page. Kwak Mansu (mansu, default: 58, heavy-set, short grey hair,
      grey stubble, a lime-yellow porter vest over a grey thermal top, a back brace), this morning before the crossing, holds the same faded navy canvas work jacket folded over his forearm and pats its LEFT chest pocket twice with his other hand: a small, shy, reassuring
      smile from a quiet man who hates a fuss. The only warm colour is on him: warm light on his face and hands. Plain soft background.
    calm: top
    lines:
      - {who: mansu, type: speech, side: c, text: "MY INHALER'S IN MY JACKET. IT'S FINE."}
    notes: "Reprise of ch 13's line, as remembered (ch 15 P44: 'YOU SAID THAT THIS MORNING'). Kwak is 58 per PART_ONE_BEATS ch 13 (CHARACTER_BRIEF_2 says '40s'; the beats win). Match his ch 13 look."

  - id: P19
    shape: inset-l
    gap: short
    bg: white
    camera: "close, three-quarter, on Taeo holding the inhaler"
    art: >
      Taeo holds the inhaler in both hands now (Dami has pushed it at him), staring at it as if it might explain itself. Dami's folded arms and her
      lime-yellow vest at the frame edge. Plain background.
    calm: right
    lines:
      - {who: taeo, type: speech, side: l, text: "HE WENT IN WITHOUT IT?"}
      - {who: dami, type: speech, side: r, text: "HE SAYS IT'S FOR EMERGENCIES."}
      - {who: dami, type: speech, side: r, text: "HE SAYS HE DOESN'T HAVE THOSE."}

  - id: P20
    shape: wide
    gap: short
    bg: white
    camera: "eye level, two-shot beside the table, Sejin arriving from her tarp"
    art: >
      Sejin has come over from the white first-aid tent with half a triangle kimbap in one hand. She leans in to look at the inhaler without touching it:
      dry, unhurried, honest, her tired eyes very steady. Taeo, half turned toward her on his crate, holds the inhaler up like evidence. The navy canvas jacket
      lies on the table. Simplified tent-and-gravel background.
    calm: top
    lines:
      - {who: taeo, type: speech, side: r, text: "IS HE OKAY WITHOUT IT?"}
      - {who: sejin, type: speech, side: l, text: "I DON'T DIAGNOSE JACKETS."}
      - {who: sejin, type: speech, side: l, text: "SITTING STILL IN CLEAN AIR, MAYBE. IN THAT DUST, FOUR O'CLOCK IS A LONG WAY OFF."}
    notes: "Sejin's voice (ch 10: 'SUMMONED IS NOT A DIAGNOSIS'): the joke first, then the truth. Her line about the marks is ch 15's (P12); do not use it here."

  - id: P21
    shape: wide
    gap: short
    bg: white
    camera: "eye level, two-shot, the gate's violet behind Dami"
    art: >
      Dami's cheap phone in its cracked rubber case buzzes in her hand (screen turned away); she glances at it, then at the gate, already turning to
      go. Taeo has stood up from his crate, inhaler in hand, leaning toward her. Behind Dami: the threshold frame, the slit's violet glow, porters
      shouldering loaded A-frames at the canopy.
    calm: top
    lines:
      - {who: dami, type: speech, side: r, text: "I'M ON THE NEXT RUN. HALF PAST."}
      - {who: taeo, type: speech, side: l, text: "CAN'T YOU LOOK FOR HIM? WHILE YOU'RE IN THERE?"}
      - {who: dami, type: speech, side: r, text: "OFF THE RUN, HE DOCKS ME THE DAY. NINETY THOUSAND."}
      - {who: narr, type: footnote, text: "*₩90,000 ≈ US$65"}
    sfx:
      - {text: "BZZT", style: phone, at: [0.84, 0.52], size: S, rot: -6}
    notes: "Porters earn ₩90,000 a day with no insurance (ch 13). Dami owes ₩2,100,000 on her draw loan (ch 13); not said here."

  - id: P22
    shape: inset-r
    gap: short
    bg: white
    camera: "close on hands, with part of Taeo's face above"
    art: >
      Taeo presses the inhaler into Dami's gloved palm and closes her fingers over it with both of his hands: gentle, urgent, a little desperate.
      Above, the lower half of his face: earnest, polite, trying. Plain background.
    calm: left
    lines:
      - {who: taeo, type: speech, side: r, text: "THEN GIVE IT TO NIB. HE SEES THINGS FIRST."}
      - {who: taeo, type: speech, side: r, text: "JUST IN CASE."}
    notes: "The beat: Taeo sends the inhaler in with the next porter run, to Nib. He does the thing that costs nothing. 'HE SEES THINGS FIRST' comes back at him in P44."

  - id: P23
    shape: narrow-r
    gap: short
    bg: white
    silent: true
    camera: "side-on at the threshold frame, full figure"
    art: >
      The threshold frame from the side: the porter file steps one by one into the black-violet slit, each body cut off at the cold rim. Dami is last,
      water jugs and a bundle of white survey stakes strapped to her A-frame, the chest pocket of her vest zipped shut over the inhaler. She does not
      look back. The guide rope and the white survey cable with a blue band every metre run into the slit beside her; four concrete blocks bolting down the frame's feet.

  # ---------------- INSIDE: THE HANDOFF ----------------
  - id: P24
    shape: full
    gap: long
    bg: white
    camera: "establishing, inside, high and wide over the open galleries along the survey line"
    art: >
      Inside (guro_gate_inside): the tilted slate-grey quarry terraces and low galleries established in ch 13, under a
      saturated green-dusk sky. The white cable with blue metre bands follows the terraces, with grey relay tripods every 50 m and supplemental station stakes every 40 m. In the foreground, the forward camp beside the taped lower-gallery exit (crates and shoring props); the porter file has just arrived with
      their A-frames and Dami is peeling away from it toward Nib. Further along the line, Nib (nib, default) crouches and presses a new white stake
      into a crack in the floor, the radio in his LEFT hand. Long violet shadows; the stake lamps the only warm lights. No creatures, no letters or
      numbers.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "INSIDE · 1:37 PM"}
    notes: "Same layout as ch 15 P35 (the fork and staging point, the stakes and lamps); the sky is green dusk (ch 16)."

  - id: P25
    shape: wide
    gap: short
    bg: white
    camera: "eye level with Nib, side-on two-shot on the gallery floor"
    art: >
      Dami (left) has dropped into a crouch so she is nearer Nib's height and holds out the blue inhaler on her gloved palm, her A-frame still on,
      eyes flicking back to her file: in a hurry, blunt. For one beat the two of them share the look from ch 13 ('the cheap ones').
      Nib (right; nib, default: V-notch in the top of his LEFT ear, one small lower fang on the left, torn pinkish-tan wrap top, torn charcoal shorts,
      brown rope belt, pouch on the RIGHT hip, brown wooden sheath on the LEFT hip, barefoot) has taken it in his RIGHT hand, the radio in his LEFT,
      and holds it out at arm's length, examining it with grave suspicion. Pale stone, green-dusk light, violet shadow under them.
      Nib keeps the white drilled hard hat and chin strap; no binoculars.
    calm: top
    lines:
      - {who: dami, type: speech, side: l, text: "KWAK'S. THE ONE WHO DIDN'T ANSWER. YOUR RADIO GUY SAYS YOU HOLD IT."}
      - {who: nib, type: speech, side: r, text: "WHAT IS IT?"}
      - {who: dami, type: speech, side: l, text: "AIR. IN A TUBE."}

  - id: P26
    shape: inset-r
    gap: short
    bg: white
    camera: "over Dami's shoulder, down at Nib"
    art: >
      Over Dami's shoulder: Nib holds the inhaler out to her at arm's length, deadpan and completely serious, the face he makes over a cup of water.
      Dami's gloved hand pushes it back toward him. Simplified pale stone behind.
    calm: left
    lines:
      - {who: nib, type: speech, side: r, text: "YOU FIRST."}
      - {who: dami, type: speech, side: l, text: "IT'S NOT FOR ME. IT'S FOR SOMEONE WHO CAN'T BREATHE."}
    notes: "Motif: YOU FIRST (whoever offers goes first, to prove it's safe)."

  - id: P27
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up, side profile on Nib alone"
    art: >
      Nib lowers the inhaler and regards it with his flattest deadpan, one long ear tilting down: a comedy face in normal style, adult, dry and faintly
      appalled. Plain green-dusk background.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "...THIS WORLD SELLS AIR."}
    notes: "Comedy face (normal style, not chibi). The ache under it is real: medicine costs money."

  - id: P28
    shape: wide
    gap: short
    bg: white
    camera: "from behind Nib's left shoulder, back along the gallery after Dami"
    art: >
      From behind Nib (his notched LEFT ear and shoulder in the near foreground, left). Dami walks backwards along the gallery toward the porter file,
      which is already moving on, calling back to him with one hand cupped at her mouth; the porter at the back of the file waves her on. Nib watches
      her go, the inhaler in his fist. Green-dusk sky between the broken arches, pale stone, violet shadows, a stake lamp glowing.
    calm: top-right
    lines:
      - {who: dami, type: speech, side: r, text: "HE'S BIG. BAD BACK. HUMS OLD TROT WHEN HE CARRIES."}
      - {who: dami, type: speech, side: r, text: "IF YOU HEAR HUMMING, THAT'S MANSU-AJEOSSI."}
      - {who: nib, type: speech, side: l, text: "I'LL LISTEN."}
    notes: "Kwak's humming is decided here (a gift for ch 15–16 if useful). Nib's promise."

  - id: P29
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "extreme close-up at Nib's right hip"
    art: >
      Extreme close-up: Nib's olive-green fingers tuck the blue inhaler into the leather drawstring pouch on his RIGHT hip (the small dinosaur sticker
      Haru gave him in ch 8 on its flap) and pull the drawstring tight; the fingers stay on the knot a moment. The brown rope belt. Keep it in the
      middle third of the height.
    notes: "The inhaler stays in this pouch until ch 16 P19 (Sejin uses it)."

  - id: P30
    shape: wide
    gap: short
    bg: white
    camera: "low, side-on, at a junction where a dark side branch leaves the line"
    art: >
      Station 14, past the forward camp (guro_gate_inside): on the RIGHT, a dark roofless side branch leaves the line under a broken arch. From the arch, fine pale
      dust is still sifting down in a few thin drawn streams onto a fresh grey drift on the floor; the stone around it is old and dust-furred. Nib
      crouches on the line at the mouth of the branch, one palm flat on the floor, his long ears turned into the dark; his whole body is completely
      still, a scout listening. Deep in the branch: only shadow, nothing visible. A white stake with its warm lamp behind him. Green-dusk light on the
      open side, violet shadow in the branch.
    calm: top-left
    sfx:
      - {text: "TIK… TIK…", style: quiet, at: [0.76, 0.44], size: S, rot: 0}
    notes: "Something moves somewhere in the maze (ch 15's scuttler: 'TIK TIK TIK TIK'). Nib hears it; nobody outside does. Settling dust: something fell today (ch 15 P02: 'THIS WALL FELL TODAY'). The branch is a roofless maze branch, not the roofed side gallery and not a way into it."

  # ---------------- THE ORDER ----------------
  - id: P31
    shape: wide
    gap: long
    bg: white
    camera: "close over the base radio, its speaker grille in the near foreground"
    art: >
      Outside, the radio table (guro_pit). The chunky base radio's speaker grille fills the near foreground, the white survey cable with blue bands running from its
      back. Taeo leans in toward it on his crate, the coiled handset in his LEFT hand, eyes wide. Haein, at the left end, has looked up, one headphone
      cup at her ear. Minho at the right end, pencil stopped on his sheet. Bright sun, short hard shadows.
    calm: top
    lines:
      - {who: nib, type: phone, side: c, text: "TAEO. THE PORTER WHO DIDN'T ANSWER. I HAVE HIS AIR."}
      - {who: nib, type: phone, side: c, text: "THE SIDE GALLERIES HERE GO OFF THE LINE."}
      - {who: nib, type: phone, side: c, text: "I WANT TO LOOK."}

  - id: P32
    shape: wide
    gap: short
    bg: white
    camera: "over Taeo's shoulder toward Minho at the end of the table"
    art: >
      Over Taeo's shoulder (his navy jacket and messy near-black hair in the near foreground, left). Minho, on his crate at the end of the table, keeps
      his eyes on his pencil survey sheet (a drawn line of small stake marks, hatching, no letters) and does not look up; his jaw is tight, his free
      hand flat on the table. He hates this answer and gives it anyway.
    calm: top-right
    lines:
      - {who: taeo, type: speech, side: l, text: "MINHO—"}
      - {who: minho, type: speech, side: r, text: "OUR CONTRACT IS THE SURVEY LINE."}
      - {who: minho, type: speech, side: r, text: "WE'RE ALREADY BEHIND."}
    notes: "PAYOFF P08 (cont.): the clause decides Minho's answer as well as Dokgo's. In ch 7 Minho said 'LET HIM FINISH LOOKING'; nobody says it now (ch 15 P18 has Taeo throw it back at him)."

  - id: P33
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up, front, on Taeo's face"
    art: >
      Taeo's face, close, as the radio keeps talking: the colour leaves it, his pupils go small, sweat stands at his temple, his lips part. The small
      mole under his RIGHT eye. Plain background.
    calm: left
    lines:
      - {who: nib, type: phone, side: l, text: "DUST IS STILL COMING DOWN. SOMETHING FELL TODAY."}
      - {who: nib, type: phone, side: l, text: "AND I HEARD—"}
    notes: "Taeo hears 'fell' and 'heard' and is afraid FOR NIB. Do not explain why a fall lands so hard on him; the Seogang collapse is arc IV's."

  - id: P34
    shape: strip
    gap: short
    bg: black
    silent: true
    camera: "extreme close-up of a thumb on a talk key"
    art: >
      Extreme close-up: Taeo's LEFT thumb presses the talk key of the coiled handset down HARD, the knuckle white, the nail pale with pressure, the grey
      plastic creaking under it. Plain dark background. Keep thumb and key in the middle third of the height.
    calm: none
    notes: "Inverts ch 7 P18 (his thumb lifting OFF the key: 'WAITING IS THE HARD PART'). Half-duplex: keying cuts Nib off, and the rest of his sentence never arrives (as in ch 7 P12–P13)."

  - id: P35
    shape: wide
    gap: short
    bg: black
    camera: "Dutch tilt, medium close on Taeo with the handset at his mouth"
    art: >
      Dutch tilt. Taeo, medium close, the handset at his mouth in his LEFT hand, eyes squeezed shut, shoulders hunched up toward his ears; hard
      strut-shadow bars cut across his face and jacket. Behind him, Haein has turned on her crate to stare at him, a hand frozen on a dial. He looks
      like a man stepping off a ledge, not like a man giving an order.
    calm: top
    lines:
      - {who: taeo, type: speech, side: c, text: "FINISH THE LINE, NIB."}
    notes: "The beat's bad instruction. Taeo's flaw on the page: he decides for the one who can see, cuts him off to do it, and does not say he is scared (ch 19: 'NEXT TIME, BE SCARED OUT LOUD')."

  - id: P36
    shape: inset-l
    gap: short
    bg: black
    silent: true
    camera: "inside, close-up on Nib's face at the side branch"
    art: >
      Inside, at the mouth of the side branch: Nib's face, close, the radio at his ear in his LEFT hand. His long ears sink slowly; his jaw sets; his
      amber eyes go flat and hard; the corner of his mouth pulls tight over the small lower fang on the left. Anger, held still, and under it an ear
      cocked to the radio: he heard something in that voice. The dark of the branch behind him; green-dusk light on one side of his face, violet
      shadow on the other.

  - id: P37
    shape: wide
    gap: short
    bg: black
    camera: "low angle from the gallery floor, behind Nib, the side branch at his back"
    art: >
      From low on the gallery floor, behind Nib: he has stood up and turned his back on the side branch, facing on along the line toward the next stake
      lamps, the radio at his mouth in his LEFT hand. His RIGHT hand is just sliding his knife back into the brown wooden sheath on his LEFT hip: on
      the wall beside the branch's mouth, at knee height, a small fresh three-line fork has been scratched (Kett's mark), pale against the grey. The
      sifting dust under the broken arch behind him; the line's warm lamps ahead under the green-dusk sky.
    calm: top-right
    lines:
      - {who: nib, type: speech, side: l, text: "...FINISHING THE LINE."}
    notes: "Nib obeys, angry. Motif: Kett's mark, on a place he means to come back to. Do not explain it."

  - id: P38
    shape: inset-r
    gap: short
    bg: black
    camera: "outside, close, three-quarter on Taeo at the table"
    art: >
      Outside. Taeo's thumb has come off the key; the handset is lowered to the table in his LEFT hand. He says it to the tabletop, eyes down, very
      small. In the corner of frame, Haein's eyes are on him. Bright sun on the table, his face in his own shadow.
    calm: left
    lines:
      - {who: taeo, type: whisper, side: r, text: "...SORRY."}
    notes: "Off the air: nobody inside hears it. Only Haein does. Sets up ch 19 ('NEXT TIME, BE SCARED OUT LOUD')."

  - id: P39
    shape: wide
    gap: short
    bg: black
    camera: "inside, side-on along a gallery wall"
    art: >
      Inside. Nib strides on along the line and, passing, slaps his open RIGHT palm flat against the gallery wall, hard, without breaking stride; a
      puff of pale dust jumps off the stone around his hand; short impact lines. His face is forward, furious and controlled. Green-dusk light, violet
      shadow, a stake lamp behind him.
    calm: top
    sfx:
      - {text: "THAK!", style: impact, at: [0.56, 0.40], size: L, rot: -8}
    notes: "He lets this one through the link on purpose (the link carries pressure only when the companion permits it)."

  - id: P40
    shape: strip
    gap: short
    bg: black
    silent: true
    camera: "outside, extreme close-up on Taeo's right palm on the table edge"
    art: >
      Extreme close-up: Taeo's RIGHT palm resting on the edge of the folding table. An amber flare (#F2A93B) slams through it under the skin,
      hard-edged, with a few sharp impact lines, and his fingers spring wide open. The amber is the only saturated colour. Dark background.
      Keep it in the middle third.

  - id: P41
    shape: wide
    gap: long
    bg: white
    camera: "side-on, medium-wide, Taeo alone at the end of the table"
    art: >
      Taeo sits down slowly on his folding chair at the radio table, the handset in his LEFT hand resting on his knee, his RIGHT hand closed into a fist
      on the table, eyes on the black-violet slit a few steps away. His olive backpack hangs on the back of his folding chair, faded orange patch out. Haein at the
      other end has put her headphones on and turned to the radio. Bright sun, short hard shadows, the strut grid on the gravel.
    calm: top
    lines:
      - {who: taeo, type: float, text: "I TOLD MYSELF IT WAS THE MONEY."}

  # ---------------- DAMI ----------------
  - id: P42
    shape: wide
    gap: long
    bg: white
    camera: "over Taeo's shoulder toward Dami arriving from the frame"
    art: >
      Over Taeo's shoulder (the back of his navy jacket and his head in the near foreground, left). Dami has just come out of the slit with an empty
      A-frame and come straight to the table, breathing hard, dust on her hard hat; she stops across from him, both gloved hands on the table edge,
      waiting for good news. Taeo, standing now, makes himself look at her. The gate's violet behind her; bright sun.
    calm: top
    lines:
      - {who: narr, type: tag, text: "1:55 PM"}
      - {who: dami, type: speech, side: r, text: "DID HE FIND HIM?"}
      - {who: taeo, type: speech, side: l, text: "...HE WANTED TO LOOK. I TOLD HIM TO FINISH THE LINE."}
    notes: "He tells her the truth. He doesn't soften it."

  - id: P43
    shape: full
    gap: short
    bg: white
    silent: true
    camera: "eye level, front-on at Dami across the table"
    art: >
      BIG REACTION, no words. Dami rocks back from the table as if she has been hit: eyes huge and suddenly wet, mouth open on a sound that doesn't come,
      one A-frame strap sliding off her shoulder, her gloved hands lifting off the table edge. Focus lines burst behind her. In the background Haein
      freezes with her headphones half off; the slit's cold rim and violet core at one side of the frame. Hard light on her face.

  - id: P44
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up on Dami's face"
    art: >
      Dami's face, close: the shock has gone flat and cold; she says it quietly, looking straight at him, chin shaking once and then still. Plain
      background.
    calm: right
    lines:
      - {who: dami, type: speech, side: l, text: "YOU SAID HE SEES THINGS FIRST."}
    notes: "His own words from P22."

  - id: P45
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up, slightly high, on Taeo"
    art: >
      Taeo can't hold her eyes: his gaze drops to the navy canvas jacket on the table, his mouth a flat line, the small mole under his RIGHT eye. Plain
      background.
    calm: left
    lines:
      - {who: taeo, type: speech, side: r, text: "...I KNOW."}
    notes: "Echo of ch 1 ('YOU SAID THAT LAST TIME.' / '...I KNOW.')."

  - id: P46
    shape: wide
    gap: short
    bg: white
    silent: true
    camera: "high angle over the radio table, everyone a little apart"
    art: >
      From high above the radio table: Dami has gone to the far end of the table and leans on both gloved fists, staring at the base radio as if she
      could climb into it. Taeo stands a step apart from her with the handset in his LEFT hand, not looking at her. Haein has turned her back and adjusts
      a dial that doesn't need adjusting. Minho studies his clipboard too hard. Far RIGHT near the ramp, at her white first-aid tent, Sejin watches all of them. The navy canvas jacket
      on the table between Dami and Taeo. Strut shadows across everyone like bars; the gate's violet at the frame edge.
    notes: "Hand-off pose for ch 15 P06 and P09 (2:13 PM): Taeo standing at the table with the handset, Minho beside him with the clipboard, Sejin at her tarp, Dami leaning on both fists at the end of the table. Haein continues at the radio in ch 15–16."

  # ---------------- THE END OF THE LINE ----------------
  - id: P47
    shape: full
    gap: long
    bg: black
    camera: "inside, high and wide along the last stretch of the line"
    art: >
      Inside (guro_gate_inside). Nib walks the last stretch of the line fast, scouting ahead along the tilted upper terrace, the radio in his LEFT hand; behind him the
      white stakes and their warm lamps run back the way he came, one every 40 m. Ahead, the gallery ends against a pale mass. The green-dusk sky
      darkens toward violet at this end; long violet shadows. The two line crew remain behind him, out of frame; no creatures.
    calm: top-left
    lines:
      - {who: taeo, type: float, text: "HE CALLED EVERY STAKE. NOTHING ELSE."}
    notes: "Ch 15 P14 has Taeo's float 'I TOLD HIM TO FINISH THE LINE. HE FINISHED IT.'; this line must stay different."

  - id: P48
    shape: wide
    gap: short
    bg: black
    camera: "eye level, the end of the line, the wall end-on with Nib at its foot"
    art: >
      The end of the line: the gallery runs straight into a wall about 3 m high of fresh-broken pale blocks that fills the mouth of a roofed side
      gallery. The broken faces are clean and sharp with no dust on top; the old stone around them is furred with grey dust. Nib, small at its foot,
      presses the last white stake into the floor beside it; its little clip lamp glows warm white. The green-dusk sky above the wall; violet shadow
      pooled at its base.
    calm: top
    lines:
      - {who: narr, type: tag, text: "2:10 PM"}
    notes: "Lock the wall for ch 15 P01–P02 and P35–P40: fresh-broken blocks closing the mouth of a roofed side gallery, the last stake at its foot."

  - id: P49
    shape: strip
    gap: short
    bg: black
    silent: true
    camera: "extreme close-up, Nib's head from the side"
    art: >
      Extreme close-up: Nib's long LEFT ear with its clear V-notch twitches forward; a few spikes of his black hair lift toward the camera, pushed by
      moving air; one amber eye slides toward where it is coming from. Violet shadow, green-dusk rim light. Keep it in the middle third.

  - id: P50
    shape: inset-l
    gap: short
    bg: black
    camera: "close on a gap between two blocks"
    art: >
      A finger-wide gap between two fresh-broken blocks in the wall, close: sharp clean edges, a black seam, and out of it a thin stream of grit and
      fine dust blown OUTWARD toward the camera, drawn as a few wavy drift lines. Nothing visible inside the gap: only dark. Violet shadow, cold light.
    calm: right
    sfx:
      - {text: "FSSSH", style: quiet, at: [0.70, 0.36], size: S, rot: 0}

  - id: P51
    shape: inset-r
    gap: short
    bg: black
    silent: true
    camera: "outside, close on Taeo's hands at the table"
    art: >
      Outside at the radio table: Taeo's LEFT hand holds the coiled handset, the thumb hovering a few millimetres above the talk key (he was about to
      call Nib). His RIGHT hand lies open on the table beside the base radio, and in the centre of that palm a thin ring of amber light (#F2A93B) pulses
      under the skin: faint and steady, like a thumb pressing from the other side. Not a slam this time. Dark background.
    notes: "Nib has laid his palm on the wall and is letting Taeo feel it (the link crosses a threshold for seconds at a time, only when the companion permits it). Taeo was about to speak; Nib speaks first. Ch 15 P17 shows the same ring 'again'."

  - id: P52
    shape: tall
    gap: short
    bg: black
    camera: "low and close beside the wall, looking past Nib's face up the fresh rubble"
    focus: [0.5, 0.62]
    art: >
      THE HOOK. The fresh-broken wall at the end of the line (guro_gate_inside): pale blocks with clean sharp faces jammed together, rising to the top of the
      frame, the dust-furred old gallery wall at one side, a band of saturated green-dusk sky at the very top. In the lower half, large in the
      foreground: Nib (nib, default: V-notch in the top edge of his LEFT ear, one small lower fang on the left, brown rope belt, leather pouch on the
      RIGHT hip with the dinosaur sticker, brown wooden sheath on the LEFT hip, barefoot), turned three-quarter toward us, his RIGHT palm laid flat on a
      fresh-broken block beside the finger-wide gap at his face height. Out of the gap streams a thin ribbon of grit and dust, blowing past his face;
      the spiky hair at his brow and the tips of his long ears are pushed back by the draught. His amber eyes are narrowed into it, sharp and certain;
      the small radio is at his mouth in his LEFT hand, button pressed. Not anger now: a scout who has found it. Beside him, the last stake's small lamp
      glows warm white. Violet shadows, cold light; the amber of his eyes is the only warm saturated note. Adult, weathered, wiry, never cute.
