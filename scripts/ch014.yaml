chapter: 14
title: Roll Call
when: "Thursday, mid-spring: the Guro pit job set up at ch 12's hook, straight on from ch 13's roll-call hook. 1:11 PM (the app) to about 2:12 PM (the hook). Taeo stays outside on the pit floor all chapter; Nib is inside the C-grade on the survey line."
story_beats: PART_ONE_BEATS.md#14
cast:
  taeo: outdoor     # navy zip jacket over the black hoodie, black cargo trousers, black sneakers. SITE KIT all chapter (decided here; match ch 13 if it differs): a white hard hat a size too big and a Ryu Survey red-orange safety vest over the jacket. The olive backpack (faded orange patch) hangs on the back of his folding chair at the radio table
  nib: default      # barefoot, NO hard hat (see the end card); the Ryu radio in his LEFT hand; leather pouch on the RIGHT hip with Haru's dinosaur sticker (ch 8) on its flap, Kwak's blue inhaler inside it from P29; brown wooden sheath on the LEFT hip. No binoculars (they come in ch 19)
  minho: default    # brown work jacket under a Ryu red-orange vest, white hard hat; grey streak at his LEFT temple; radio clipped high on his LEFT chest
  haein: default    # overalls, tool belt, clear safety glasses pushed up under a white hard hat worn far back; she runs the relay
  sejin: default    # medic's chest rig, cropped hair, tired eyes, white hard hat; her aid station is by the foot of the ramp
  dami: default     # cheap hi-vis porter vest over a hoodie, scuffed hard hat, cargo straps and a shoulder frame, worn gloves; a cheap phone in an armband (its screen always dark)
  dokgo: default    # windbreaker, white hard hat pushed back, a clipboard tablet under his arm, TWO phones (the porter-app phone in his hand, the general contractor's phone in his chest pocket), an unlit cigarette
  mansu: default    # P18 memory only. 58 (PART_ONE_BEATS ch 13), heavy-set, grey stubble, a back brace over a faded work shirt
extras:
  porters: "Dokgo Contracting porters (twelve on the roster, Kwak and Dami included): unawakened men and women from their twenties to their sixties, in the same cheap hi-vis porter vest as Dami over hoodies and work shirts, scuffed hard hats, worn gloves, shoulder frames carrying sealed grey plastic crates, water jugs or battery packs"
  crew: "the two Ryu Survey crew members from ch 7: a stocky man in his forties and a young woman, red-orange safety vests, white hard hats; inside the gate they work a survey instrument on a tripod"
  gc_manager: "the general contractor's site manager: a voice on Dokgo's second phone only, never drawn"
  porter_voices: "the porters answering roll call through the relay: voices only"
locations: [guro_gate_inside, guro_pit]
location_notes:
  guro_pit: "Decided here; conform to ch 13 if it differs. A building-foundation excavation on a construction site in Guro-gu, Seoul, about 40 x 30 m and 12 m deep. Walls of steel H-piles with timber lagging boards. Two tiers of steel cross-struts (H-beams in rust-orange primer) span it about 4 m and 8 m below the street, with diagonal corner braces: from the floor the sky is a pale rectangle cut into a grid, and in sun the struts lay a grid of hard shadow bars across the floor. North side: an earth ramp laid with steel road plates up to the street gate; at the top, the general contractor's site-office containers, a concrete pump truck with its boom folded (booked and waiting) and an idle tower crane. The floor is compacted grey gravel. THE GATE stands in the south half, in the shade of the south wall: a black-violet slit about 2.6 m tall with a cold white-cyan rim, inside a square scaffold-tube portal (the 'threshold frame', about 3 m tall, its two posts straddling the slit's edges, the frame the knock code is knocked on), ringed by orange barrier fencing and cordon tape. A thick black relay cable banded with yellow tape runs from the radio table across the gravel inside a rubber cable ramp, up the frame's LEFT post and into the slit. Seen from the ramp (looking south): RIGHT of the gate (west, 8 m off) is the radio table under a blue tarp lean-to (a folding table with the grey rugged relay base unit and its two stub antennas, a speaker grille on its face, a radio charging rack, Minho's rugged laptop, three folding chairs; Taeo's backpack hangs on the middle chair, patch out). LEFT of the gate (east) is Dokgo's staging (pallets of water jugs and battery packs going in, sealed grey crates coming out) and the porters' rest area: a rope strung between two rebar stakes, hung with the porters' jackets and bags, plastic stools and a water cooler. Near the ramp foot, right: Sejin's aid station (a folding table with a white medic case, a small oxygen cylinder, a folded stretcher, a camp chair). Light at 1-2 PM: high spring sun from the south-west."
  guro_gate_inside: "Decided here; conform to ch 13 if it differs. The C-grade beyond the Guro gate: a vast terraced quarry of pale bone-grey stone under a GREEN DUSK sky (the wrong colour: saturated sickly green overhead, fading to a yellow-green glow at the horizon; no sun, no clouds). Giant terrace steps descend into the distance; rectangular gallery mouths are cut into the terrace walls, many half collapsed. Shadows are violet. Just inside the slit: the staging ledge (the inside relay box on a short tripod, the relay cable coming out of the slit's dark, stacked crates). THE SURVEY LINE is a terrace path about 3 m wide along the quarry wall, marked every 40 m or so by Ryu Survey stakes (thin steel rods with orange tips and a small blank tag): 20 stakes, the line due finished at 14:30. At STAKE 14 a side passage (a gallery mouth about 2 m tall) opens in the terrace wall, with a fresh fan of pale dust spilling out of it onto the path; from P37 a small three-line fork (Kett's mark) is scratched into the stone beside it at knee height. Where stake 20 will go, the terrace ends against a rockfall of huge pale slabs about 8 m high (a collapsed gallery mouth): THE RUBBLE WALL, with a dark crack between two slabs about 1 m up, at Nib's face height, through which cold air streams out."
palette_notes: "Pit: dusty grey-ochre gravel and concrete, warm brown-grey shadows, a pale blue sky cut into a grid by rust-orange struts; accents: the porters' hi-vis, the Ryu red-orange vests (never the link amber) and the gate's violet with its cold white-cyan rim. The blue of Kwak's inhaler is the one saturated cool note of the jacket scene. Inside the gate: a saturated green-dusk sky, pale bone-grey stone, violet shadows, the orange stake tips. Amber #F2A93B appears only as Nib's eyes and in Taeo's palm (P40, P56). Red appears only in the lettered UI (the app's penalty line), never in the art. There are NO operator-interface windows in this chapter: the interface stays dark until ch 19. The relay rule (decided here): radios still drop out at a threshold (ch 10), so a hard cable through the rim to a relay box inside carries the signal out, the way a knock carries through the frame. Every voice that comes through the relay or a phone is a phone bubble with its tail to the device."

panels:

  # ---------------- COLD OPEN ----------------
  - id: P01
    shape: full
    gap: none
    bg: black
    silent: true
    camera: "inside the gate, high and wide from above the terrace, looking along the porters' file as it moves away"
    art: >
      Inside the Guro gate (guro_gate_inside), on the terrace path just past the staging ledge, moments after the roll call.
      A file of Dokgo Contracting porters (extras.porters) moves off along the path away from us, loads strapped to their shoulder frames,
      heads down, nobody talking. In the file there is one obvious GAP: an empty stretch of path, two body-lengths long, where one more
      person should be walking. At the back of the file, Gu Dami (dami, default: cheap hi-vis porter vest over a hoodie, scuffed hard hat,
      cargo straps, worn gloves, a sealed grey crate on her shoulder frame) has stopped and looks back over her shoulder, past the camera,
      toward the dark gallery mouths in the quarry wall behind us: jaw tight, eyes searching, not crying. The porter ahead of her has half
      turned to wave her on with a tired hand. Saturated green-dusk sky, pale bone-grey terraces stepping away into the distance, long
      violet shadows, the low yellow-green glow on the horizon. No Dokgo, no hunters, no creatures, no letters or numbers anywhere.
    calm: top-right
    notes: "Straight on from ch 13's hook ('HE'S RESTING SOMEWHERE. KEEP MOVING.'): they kept moving. The gap is Kwak Mansu. Do not show Dokgo here (ch 13 decides where he stood for the roll call)."

  - id: P02
    shape: strip
    gap: short
    bg: black
    camera: "outside, extreme close-up of a thumb on a phone"
    art: >
      Outside the gate, on the pit floor (guro_pit). Extreme close-up of Dokgo Chul's hand (dokgo: thick, nicotine-yellowed fingers, the
      frayed cuff of his windbreaker) holding a cheap black phone in a scuffed rugged case. Screen: green. His thumb has just tapped the
      lower third of the screen and is lifting off, casual, a chore done. Behind: grey gravel and the corner of an orange barrier as flat,
      simplified shapes. Hard afternoon daylight, one crisp shadow under the thumb. Keep the phone in the middle third of the height.
    calm: none
    ui:
      - {kind: phone.info_card, on: screen, title: "DOKGO CONTRACTING · ROLL CALL", text: "12 OF 12 ACCOUNTED FOR · KWAK MANSU: ON BREAK (UNPAID)"}
    sfx:
      - {text: "TAP", style: quiet, at: [0.64, 0.66], size: S, rot: 0}
    notes: "PAYOFF P08 (begins): the app that counted down the lateness penalty in ch 13 now does the boss's thinking. Putting Kwak 'on break' makes the count 12 of 12. Twelve porters on the roster (decided here; conform to ch 13 if it gave another number). The UI kit has no porter-app kind, so phone.info_card stands in for Dokgo's app here and in P09 (match whatever ch 13 used)."

  - id: P03
    shape: wide
    gap: short
    bg: black
    camera: "eye level, a two-shot beside the threshold frame: Dokgo near and walking out of frame, Taeo two steps behind"
    art: >
      The pit floor beside the gate's scaffold threshold frame (guro_pit), in the shade of the south wall; the slit's black-violet core and
      cold white-cyan rim at the left edge of frame, the yellow-banded relay cable running up the frame post. Dokgo Chul (dokgo, default:
      in his fifties, windbreaker, white hard hat pushed back, an unlit cigarette in the corner of his mouth, a clipboard tablet under one
      arm, a second phone in his chest pocket) slides the phone into his pocket without looking back, already walking away to the right:
      flat, tired, final. Two steps behind him, Taeo (taeo, outdoor, site kit: white hard hat a size too big, a Ryu red-orange vest over
      the navy jacket) has one hand half raised, polite and anxious, like a man trying to stop a bus that will not stop.
      Grey-ochre gravel, warm brown-grey shadow, the gate's violet as the one strong colour.
    calm: top
    lines:
      - {who: taeo, type: nervous, side: r, text: "S-SORRY. YOUR PORTER— HE DIDN'T ANSWER."}
      - {who: dokgo, type: speech, side: l, text: "THEN HE'S ON BREAK."}

  - id: P04
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 14 · ROLL CALL"

  # ---------------- DOKGO'S LOGIC ----------------
  - id: P05
    shape: full
    gap: long
    bg: white
    camera: "establishing, high angle from the top of the north ramp, looking south down into the pit"
    art: >
      The Guro construction pit (guro_pit) seen from the top of the ramp, early afternoon. A 12 m-deep excavation walled with steel H-piles
      and timber lagging; two tiers of rust-orange steel cross-struts span it and lay a grid of hard shadow bars across the grey gravel floor.
      At the bottom, in the shade of the far (south) wall: the gate, a black-violet slit with a cold white-cyan rim, standing inside a square
      scaffold-tube threshold frame ringed by orange barriers. A black cable with yellow bands snakes from the frame across the gravel to a
      blue tarp lean-to on the RIGHT: the radio table, with one small figure at it (Haein at a grey relay case). On the LEFT of the gate,
      pallets of crates, a rope line hung with jackets, and three small figures walking past the pallets (a man in a windbreaker, a man in
      a red-orange vest, and Taeo's oversized white hard hat a step behind). Near the ramp foot on the right, a tiny aid station.
      In the near foreground at the pit's lip: the folded boom of a parked concrete pump truck, waiting, and the base of an idle tower crane.
      Drawn and detailed; the site boards are blank panels with no letters. Palette: dusty grey-ochre, warm brown-grey shadows, a pale blue sky;
      small accents of hi-vis orange and the gate's violet.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "GURO-GU · THURSDAY · 1:12 PM"}
    notes: "Lock this geography for the chapter (location_notes.guro_pit): radio table RIGHT of the gate as seen from the ramp, porters' staging and rest area LEFT. The waiting pump truck is the deadline you can see."

  - id: P06
    shape: wide
    gap: short
    bg: white
    camera: "tracking, medium, side-on as three men walk past the pallets"
    art: >
      On the pit floor in the strut-shadow grid, beside Dokgo's staging pallets. Dokgo (left) walks along the pallets counting sealed grey
      crates with a tap of two fingers, never breaking stride, the unlit cigarette bobbing. Minho (minho, default: brown work jacket under
      a Ryu red-orange vest, white hard hat, the grey streak at his LEFT temple showing under the brim, radio clipped high on his LEFT chest)
      keeps pace at his right shoulder, frowning hard, pressing him. Taeo trails a step behind Minho, holding his slipping hard hat on with
      one hand. The porters' rope line of jackets hangs behind them as soft flat shapes. Hard sun, warm brown-grey shadows.
    calm: top
    lines:
      - {who: minho, type: speech, side: r, text: "ON BREAK WHERE?"}
      - {who: dokgo, type: speech, side: l, text: "KWAK'S CARRIED FOR ME TWENTY YEARS. HE GETS WINDED, HE FINDS A CORNER, HE SITS."}
      - {who: dokgo, type: speech, side: l, text: "HE'S DONE IT BEFORE."}
    notes: "Dokgo is reasonable, and he knows his man. That is what makes it work. 'Twenty years' is decided here."

  - id: P07
    shape: full
    gap: short
    bg: white
    camera: "low angle from gravel level, looking up at Dokgo with the struts and sky above him"
    art: >
      Dokgo has stopped and turned, and points his unlit cigarette back over his shoulder at the gate like a pointer. Above and behind him the
      rust-orange struts frame a pale blue sky in a grid. His face is confident and patient, almost kind: a man explaining the trade to people
      who don't know it. Minho and Taeo listen at the two edges of the frame, in the near foreground and lower than he is, cut off at the shoulder.
      Hard sun from the upper left, hard shadows.
    calm: top-right
    lines:
      - {who: dokgo, type: speech, side: c, text: "AT FOUR, IRONCLAD SEVEN KILL THE BOSS."}
      - {who: dokgo, type: speech, side: c, text: "THIRTY SECONDS LATER, EVERY MARK IN THERE GOES OFF. HE COMES OUT WITH THE REST."}
    notes: "The return-mark rule (ch 10): boss dies, entry closes, 30 seconds, automatic, unconscious or not. Ironclad Seven is the clear team (ch 18's headline). Boss kill scheduled at 16:00."

  - id: P08
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up, three-quarter, on Taeo"
    art: >
      Taeo under the too-big hard hat, half convinced and wanting to be: his eyes slide away toward the gate, his mouth trying out a polite
      agreement it doesn't quite reach. Simplified gravel-and-strut background.
    calm: left
    lines:
      - {who: taeo, type: speech, side: r, text: "...IF HE'S FINE."}
      - {who: "offpanel:dokgo", type: speech, side: l, text: "HE'S FINE."}
    notes: "The beat's 'it sounds reasonable, if Kwak is fine', said out loud by the one person who will later act on the 'if'."

  - id: P09
    shape: narrow-l
    gap: short
    bg: white
    camera: "straight on: Dokgo's phone held up toward the camera from Minho's eye line"
    art: >
      Dokgo holds the cheap black phone up at arm's length, screen toward us. Screen: green. Behind it his face is half hidden: one tired eye,
      the unlit cigarette, the white hard hat pushed back. Above him, a slice of the strut grid and the pale sky. Hard sun.
    calm: none
    ui:
      - {kind: phone.info_card, on: screen, title: "DOKGO CONTRACTING · SITE CLOCK", text: "ALL CREWS OUT BY 15:00 · 01:46:38 LEFT · LATE: ₩5,000,000 PER HOUR"}
    lines:
      - {who: dokgo, type: speech, side: l, text: "SEARCHING COSTS TIME."}
      - {who: dokgo, type: speech, side: l, text: "TIME COSTS FIVE MILLION AN HOUR."}
    notes: "PAYOFF P08: the ch 13 penalty clause decides the boss's order. The clock reads 1:13:22 PM. Every crew must be out by 15:00 so the clear team can walk the survey line in; boss kill at 16:00."

  - id: P10
    shape: wide
    gap: short
    bg: white
    camera: "over Minho's right shoulder, toward Dokgo and Taeo"
    art: >
      Over Minho's shoulder (his red-orange vest and hard hat in the near foreground, right). Dokgo jabs the phone toward Taeo, who flinches back
      with both palms up. Dokgo is not angry, only certain, the cigarette jutting. Behind them, the porters' pallets as flat shapes and the gate's
      violet in the shade at the far edge.
    calm: top-left
    lines:
      - {who: dokgo, type: speech, side: l, text: "I PULL FOUR PORTERS TO LOOK, THE HAUL'S LATE. THE CLEAR'S LATE."}
      - {who: dokgo, type: speech, side: l, text: "WHO PAYS THAT? YOU?"}
    notes: "A question ch 15 answers ('GO. I'LL PAY THE PENALTY.'). Taeo says nothing here."

  - id: P11
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up, slightly high, on Taeo"
    art: >
      Taeo's polite face draining: a fixed little smile that has stopped meaning anything, one bead of sweat at his temple, the hard hat
      tipping forward over his brow, one hand tightening on the strap of his vest. The small mole under his RIGHT eye. Plain pale background.
    calm: right
    lines:
      - {who: taeo, type: float, text: "MY WHOLE DEPOSIT IS FIVE MILLION."}
      - {who: narr, type: footnote, text: "*₩5,000,000 ≈ US$3,600"}
    notes: "His flat's rental deposit (₩5,000,000; ₩450,000 a month rent, ch 5). Sets up ch 15 ('THEN TAKE IT FROM MY DEPOSIT') and ch 17's signature."

  - id: P12
    shape: wide
    gap: short
    bg: white
    camera: "from behind the radio table, looking out at Minho and Taeo walking back toward it"
    art: >
      From behind the radio table under the blue tarp (the relay case and the charging rack in the near foreground, Taeo's backpack on the
      back of the middle chair, faded orange patch out). Minho and Taeo walk back toward us across the gravel through the strut-shadow bars.
      Minho rubs the back of his neck under his hard hat, eyes on the ground, talking low. Taeo looks back over his shoulder at Dokgo, small
      in the distance by the pallets.
    calm: top
    lines:
      - {who: minho, type: speech, side: l, text: "HE'S NOT WRONG. THE CLEAR TEAM WALKS OUR LINE AT THREE."}
      - {who: minho, type: speech, side: l, text: "SAME CLAUSE IN OUR CONTRACT. FIVE MILLION AN HOUR."}
      - {who: minho, type: speech, side: l, text: "AND BLUEBIRD ALREADY TOOK ONE VAN."}
    notes: "PAYOFF P08 (cont.): the clause flows down the chain to Ryu Survey. The van is ch 12's tow. Do not state the Bluebird debt figure (it stays hidden until ch 26)."

  - id: P13
    shape: inset-r
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag. Chibi Minho (grey streak at his LEFT temple, red-orange vest, hard hat tipped back, radio on his chest), completely deadpan,
      points with one finger at a single NEW grey hair standing straight up out of his streak; it sparkles. Beside him, chibi Taeo in his
      giant hard hat has turned to white stone. Flat dusty-ochre background with a screentone dot pattern.
    calm: left
    lines:
      - {who: minho, type: speech, side: r, text: "THAT ONE'S THE PENALTY CLAUSE."}
    notes: "Runner (STORY_BIBLE §9): Minho's grey streak gains hairs ('THAT'S YOU. THAT ONE'S YOU.', ch 7)."

  - id: P14
    shape: wide
    gap: short
    bg: white
    camera: "eye level, across the radio table from the gate side"
    art: >
      Back to normal style. The radio table under the blue tarp. Haein (haein, default: overalls, tool belt, safety glasses pushed up under a
      white hard hat worn far back) thumps the top of the grey rugged relay case with the heel of her hand, unimpressed. Taeo, now seated
      in the middle chair, leans in to the relay's speaker grille with the handset in his hand. Minho drops into the chair at the right end
      behind his rugged laptop (its screen a dark slab with a few pale plotted lines, plain shapes). Behind them, at the aid station by the
      ramp foot, Sejin (sejin, default: medic's chest rig, cropped hair, white hard hat) sits in a camp chair eating a triangle kimbap.
      Shade under the tarp; sun-and-strut shadow bars on the gravel beyond.
    calm: top
    lines:
      - {who: nib, type: phone, side: c, text: "STAKE ELEVEN. GROUND'S GOOD."}
      - {who: haein, type: speech, side: l, text: "SEE? IT WORKS IF YOU HIT IT."}
      - {who: taeo, type: speech, side: c, text: "...SAME."}
    sfx:
      - {text: "BONK", style: comic, at: [0.20, 0.42], size: M, rot: -10}
      - {text: "KSSH", style: quiet, at: [0.50, 0.30], size: S, rot: 4}
    notes: "Nib's voice comes through the relay: phone bubble, tail to the speaker grille. The relay rule is in palette_notes; do not explain it on the page."

  # ---------------- THE JACKET ----------------
  - id: P15
    shape: wide
    gap: long
    bg: white
    silent: true
    camera: "eye level at the porters' rest area, Dami three-quarter in front of the rope line"
    art: >
      The porters' rest area left of the gate (guro_pit): a rope strung between two rebar stakes, hung with jackets, bags and a towel; plastic
      stools; a water cooler. Dami, just out of the gate with an empty shoulder frame, stands still in front of ONE jacket: an old, faded green
      work jacket with frayed cuffs and two pale patches on its shoulders where straps have rubbed it for years. Her gloved hand holds its
      sleeve. Her face: the moment she understands it is still here and he is still in there. The strut-shadow bars across the gravel; the
      gate's violet at the frame edge.
    notes: "The jacket and Kwak's look are decided here (green work jacket); conform to ch 13 if it showed them."

  - id: P16
    shape: full
    gap: short
    bg: white
    camera: "medium-wide, from the end of the radio table, Dami arriving from the right"
    art: >
      The radio table under the tarp. Dami strides in from the right and slaps the green jacket down on the table between the relay case and
      Taeo's hands, hard enough that a radio jumps in the charging rack. Taeo jolts back in his chair. Haein at the left end looks up from her
      tools. Minho at the right end looks over his laptop. Dami's face: furious and frightened at once, chin up. Shade under the tarp, the
      gravel bright beyond.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "1:20 PM"}
      - {who: dami, type: speech, side: r, text: "THIS IS UNCLE MANSU'S."}
      - {who: taeo, type: speech, side: l, text: "THE PORTER WHO DIDN'T—"}
    notes: "It is 13:20 (PART_ONE_BEATS ch 14). Dami calls Kwak 'Uncle Mansu' (decided here)."

  - id: P17
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up, the jacket's breast pocket"
    art: >
      Extreme close-up: Dami's worn glove pulls a blue L-shaped inhaler with a grey cap out of the green jacket's breast pocket. The frayed pocket
      edge; a pencil stub and a folded blank receipt still inside. The blue plastic is the one saturated note. Keep it in the middle third.
    calm: none
    lines:
      - {who: dami, type: speech, side: r, text: "HIS INHALER."}

  - id: P18
    shape: vignette
    gap: short
    bg: white
    camera: "memory, medium close-up, soft-edged"
    art: >
      A soft-edged memory vignette, desaturated and cooler, fading into the white page. Kwak Mansu (mansu, default: 58, heavy-set, grey
      stubble, a back brace strapped over a faded work shirt), earlier today before the crossing, holds the same old green jacket folded over
      his forearm and pats its breast pocket twice with his other hand: a small, shy, reassuring smile from a quiet man who hates a fuss.
      The only warm colour is on him: warm light on his face and hands. Plain soft background, no location detail.
    calm: top
    lines:
      - {who: mansu, type: speech, side: c, text: "MY INHALER'S IN MY JACKET. IT'S FINE."}
    notes: "Reprise of ch 13's line, as remembered. Kwak is 58 per PART_ONE_BEATS ch 13 (CHARACTER_BRIEF_2 says '40s'; the beats win). Match his ch 13 look."

  - id: P19
    shape: inset-l
    gap: short
    bg: white
    camera: "close, three-quarter, on Taeo holding the inhaler"
    art: >
      Taeo holds the inhaler in both hands now (Dami has pushed it at him), staring at it as if it might explain itself. Dami's folded arms and
      her hi-vis vest at the frame edge. Plain background.
    calm: right
    lines:
      - {who: taeo, type: speech, side: l, text: "HE WENT IN WITHOUT IT?"}
      - {who: dami, type: speech, side: r, text: "HE SAYS IT'S FOR EMERGENCIES."}
      - {who: dami, type: speech, side: r, text: "HE SAYS HE DOESN'T HAVE THOSE."}

  - id: P20
    shape: wide
    gap: short
    bg: white
    camera: "eye level, two-shot beside the table, Sejin arriving"
    art: >
      Sejin has walked over from the aid station with half a triangle kimbap in one hand. She leans in to look at the inhaler without touching it:
      dry, unhurried, honest, her tired eyes very steady. Taeo, half turned toward her in his chair, holds the inhaler up like evidence.
      The green jacket lies on the table. Simplified tarp-and-gravel background.
    calm: top
    lines:
      - {who: taeo, type: speech, side: r, text: "IS HE OKAY WITHOUT IT?"}
      - {who: sejin, type: speech, side: l, text: "I DON'T DIAGNOSE JACKETS."}
      - {who: sejin, type: speech, side: l, text: "SITTING STILL IN CLEAN AIR, MAYBE. IN THAT DUST, FOUR O'CLOCK IS A LONG WAY OFF."}
    notes: "Sejin's voice (ch 10: 'SUMMONED IS NOT A DIAGNOSIS'). The joke first, then the truth."

  - id: P21
    shape: wide
    gap: short
    bg: white
    camera: "eye level, two-shot, the gate's violet behind Dami"
    art: >
      Dami's cheap armband phone buzzes (its screen dark); she glances at it, then at the gate, already turning to go. Taeo has stood up from the
