chapter: 57
title: The Chant
when: "Same exhibition day as ch 56, afternoon. Final draw ends; the timed final begins after the course reset. Ends with 0.8 seconds on the heat clock."
story_beats: PART_ONE_BEATS.md#57
cast:
  taeo: outdoor
  nib: default
  orrin: default
  sera: default
  haein: default
  sejin: default
  minho: default
  do_gangjin: default
  bangbang: default
extras:
  ironvow_bracer: "Adult Korean woman, muscular, blunt black bob, charcoal padded field jacket, dark-steel chest harness and small pauldrons, dark-red chest strip and waist tabs, grey cargos, heavy boots."
  ironvow_runner: "Adult Korean man, lean, short black hair, same Iron Vow member uniform; padded practice shield, no sharp weapon."
  official: "Adult woman in grey exhibition polo, slate trousers, headset and blank credential, as ch 56."
  fans: "Mixed adult spectators in muted casual clothing, several with blank round fan paddles; the chanting group is a small cluster near BangBang, not the entire audience."
locations: [exhibition_draw_stage, exhibition_arena, exhibition_stands]
location_notes:
  exhibition_draw_stage: "Same ramp, officials' desk and blank bracket board as ch 56."
  exhibition_arena: >
    Carry forward ch 50-56 arena. Operator box outside course behind near clear barrier, opposite VIP box,
    two identical independent lanes. Final is a fixed-time score heat: five one-point preliminary obstacles,
    followed by a three-point final relay. A bypass lane allows attempts to be abandoned for zero.
    Maximum eight points; score at horn decides, time breaks a tie. These rules are public before starting.
    Final relay in each lane: padded ram beside LEFT wall; grey receiving pad stored there; pressure shoe
    under a weighted shutter; shoe drives an enclosed hydraulic linkage to a short rising shooting carriage;
    Sera can stand on carriage, ordinary blunt-arrow target above far end. Three lamps correspond to shoe,
    carriage stop and target. Stored force boosts Orrin's voluntary push, never directly enchants the arrow.
    Safety stops and floor pads catch a miss. No actual gate, no return marks, no threshold-radio issue.
  exhibition_stands: "Tiered muted navy seating over the near service corridor, adult fans, safety rail, BangBang filming from an accredited aisle position."
wardrobe_locks: >
  Exact ch 56 outfits. Taeo navy jacket, hoodie, black cargos, single-white-stripe sneakers; mole RIGHT eye;
  olive backpack with OLD orange shield/open-door patch on operator chair. Dark-grey cracked dinosaur phone face-down.
  Nib adult 105 cm, notched LEFT ear, LEFT lower fang, pinkish-tan wrap, charcoal shorts, brown rope belt,
  RIGHT dinosaur pouch, LEFT wooden sheath, high matte-black binoculars with LEFT strap knot and fork-marked hinge;
  ch 43 matte dark-brown ankle-high leather work boots, broad round toes, four pairs dull gunmetal round eyelets,
  dark-brown round laces in small double knots, black lug soles/low heels, heel pull tabs, oat-grey short socks
  inside collars; no logo, hooks, buckles, bright trim or visible steel cap, never barefoot.
  ID, paper drawing and cobalt fork-marked pencil secured in pouch.
  Sera river-green wrap, cream sleeves, sand trousers, braid, LEFT bow/bracer, RIGHT quiver/flute, blunt arrows.
  Orrin adult terraced-slate shell, healed crack seam unchanged, no harness. Reservoir construction follows ch 52-56.
props:
  reservoir: "Match ch 50: hand-sized rectangular dull-steel housing, split copper retaining band, ivory ceramic inspection window, two capped coupling ports, short grey webbing strap, analogue white indicator tab and manual release. Known 0.8-second leak remains; no screen."
palette_notes: >
  A4 institutional extension: arena overhead blue-white lamps, slate shadows and navy seats; steel and grey rubber course.
  Iron Vow red is dark muted fabric, not the danger accent. Cyan only for Taeo's interface if present; none appears here.
  Amber only Nib's permitted RIGHT-palm pulse, separate slate-green for Orrin. Screens dark or abstract shapes;
  scoreboards blank for label UI. No bloom, floating debris, readable art, bubbles or effects drawn as words.
