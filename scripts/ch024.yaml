chapter: 24
title: Too Big for the Door
when: "Straight on from ch023's ACCEPTED, shortly before 9 PM. The flat and corridor, then a night-time ladder-truck extraction through the balcony. Orrin walks to the Ryu yard after the descent; the chapter ends there after midnight. No absolute date is lettered."
story_beats: PART_ONE_BEATS.md#24
cast:
  taeo: default # black hoodie, black cargos, socks in flat; black sneakers with one white stripe outside. Adds navy outdoor jacket at P20. One mole under RIGHT eye; olive pack with faded orange shield/open-door patch, cracked dark grey dinosaur-sticker phone.
  nib: default # adult 105 cm, wiry, weathered. LEFT-ear V-notch; one lower LEFT fang; brown rope belt, pouch RIGHT with dinosaur sticker and cobalt fork-mark pencil, brown wooden sheath LEFT; barefoot. Matte black 8x30 binoculars high on chest, strap knot LEFT neck, fork scratched on hinge; pale-blue ID and PAPER post drawing in pouch.
  orrin: default # FIRST FULL APPEARANCE P04. Adult stoneback carrier, 230 cm nose-to-tail, shell height 135 cm. Four columnar legs with THREE blunt nails per foot, short tail, terraced stacked dark-slate shell, dust-grey olive skin, long neck, sagging adult cheeks, heavy-lidded olive eyes. No clothes, saddle, collar, harness or pet accessories. No shell damage yet.
  minho: default # brown jacket, grey tee, olive cargos, knee pads, brown boots; grey streak LEFT temple, radio LEFT chest, watch LEFT.
  haein: default # short jaw-length black bob, slate-blue bib overalls, beige tee, tool belt, safety glasses.
  seonhee: default # recovering from ch023's stress collapse, seated throughout her yard scene; moss-grey cardigan, cream shirt, slate trousers, low bun with grey temples, reading glasses, pencil behind LEFT ear.
extras:
  building_manager: "Building caretaker, not Hanbit Mart's Manager Oh and not the landlord: woman about 60, square face, tightly curled dark hair, plum fleece over a striped shirt, loose black trousers, slippers, ring of brass keys. Frightened for the building, irritable, ordinary."
  neighbour_403: "Same young father as ch022, about 30, grey T-shirt and track trousers, short bed hair; no toddler on this dangerous work site."
  neighbour_film: "Woman about 25 in a tan padded vest and grey sweatshirt, holding a plain phone vertically; screen always faces away or stays dark."
  glazier: "Woman about 45, navy work jacket, grey trousers, brown gloves, short black braid, clear protective glasses, suction handles and a padded glass trolley."
  truck_operator: "Man about 50, close-cropped grey hair, navy work coveralls, pale orange reflective vest, hard hat, work gloves, wired pendant controller with plain buttons."
  truck_assistant: "Adult woman in matching coveralls, vest, hard hat and gloves; works at the platform and bridge plates."
locations: [taeo_flat, taeo_building, taeo_rear_lane, ryu_practice_yard]
location_notes:
  taeo_flat: "Use drawn keys: from entry, kitchenette LEFT foreground, desk and family-photo shelf LEFT by far wall, bed RIGHT, centred two-pane window opposite entry, clothes rack RIGHT foreground. 18 m², fourth floor. Narrow balcony outside the window. ASK FIRST paper retained on bathroom wall. Orrin pins bed P03; window cracks P03. Glazier removes BOTH sliding panels P24, which are taped and subsequently refitted P47. Balcony front rail bends during extraction; it remains bent through ch028. No new window, service door or lift."
  taeo_building: "Five-storey red-brick block, open-air access corridors over ground-floor piloti; fourth-floor unit 402 door opens OUT into corridor, hinges right when seen inside, handle left. Twelve white rezoning notices remain from ch021–22. A gate-advisory sign stands at street corner; do not confuse west access corridor with rear balcony."
  taeo_rear_lane: "Narrow lane behind the block, below the balcony. A hired goods-moving ladder truck, not a little rescue basket, has a broad rated platform, rigid timber cradle, guardrails and outrigger supports. Contractor checks load before movement. It docks at the balcony; cribbed bridge plates span the short balcony depth. Rail is released at one end to fold aside and then bent by Orrin's careful step. He never waits with his whole body on the narrow balcony. Temporary guards cover the open edge after extraction. No dangling sling around Orrin."
  ryu_practice_yard: "Canonical grey office container southwest, one remaining white work van southeast, fixed plywood maze, targets north, trestle west, south double gate. Ramp fitted beside office step for family access. Orrin stays OUTDOORS under a freestanding canvas rain canopy beside the equipment pallets, clear of the maze and gate. Taeo and Nib still live at the flat until ch028."
palette_notes: "A4 flat: warm orange lamp left, deep blue-grey shadows; arrival cyan #3FE3F2 on navy #0B1530 temporarily dominates. Corridor cold white tubes and blue-grey, street sodium orange. Lane cool truck work lamps with slate shadows and muted orange safety vests. Yard after midnight: ochre/brown materials under warm office doorway light, deep blue night. No amber link in this chapter. Clean flat cel art, warm dark contours; no haze, decorative particles or glossy reptile texture. All paper, labels, signs and screens blank unless lettered in ui."
