chapter: 81
title: The Paperwork Is the Door
when: "The night of ch 80's charter decision, then the following working day. No calendar date fixed."
story_beats: PART_ONE_BEATS.md#81
cast:
  taeo: outdoor # Navy jacket over black hoodie, black cargos, striped black sneakers; continues ch80's writing outfit.
  nib: default # Adult scout, exact chosen ch43 boots throughout; all persistent props below.
  orrin: default
  sera: default # Injured LEFT bow arm remains braced; no ordinary shooting clearance.
  kesh: default
  sejin: default
  chae: default
  haein: default
extras:
  messenger: "Adult woman about 40, short black hair, plain grey courier jacket, navy trousers, canvas document satchel; no Meridian uniform."
locations: [mapo_tyre_base, aao_office, ryu_practice_yard]
location_notes:
  mapo_tyre_base: >
    Old tyre-shop compound in the Mapo gate zone, the crew's rented working base from ch33, not the Ryu yard.
    No drawn key available. Use existing ch33 staging if supplied: broad rolling workshop door opening onto a concrete
    forecourt, work trestle inside, old tyre racks on the side walls, kitchenette behind a partition.
    For this batch the trestle sits just inside the open door; Orrin can remain in the forecourt and join conversations.
  aao_office: "Use locations/aao_office keys and notes. Chae's visitor consultation uses the existing institutional desk area; no new hearing chamber."
  ryu_practice_yard: >
    Use drawn keys: south double gate, southwest GREY office container, southeast single white van facing west,
    fixed central plywood zigzag maze, three north targets, west equipment trestle. Taeo's separate container home
    remains in the service area; neither it nor the tyre-shop base replaces the keyed office.
props:
  nib_locks: >
    Weathered wiry 105 cm ADULT, LEFT-ear V-notch, one lower LEFT fang; torn pinkish-tan wrap and charcoal shorts,
    brown rope belt, RIGHT leather pouch with small green dinosaur sticker, LEFT brown wooden sheath.
    Matte black 8x30 binoculars high on chest, black woven strap knotted LEFT at neck, Kett's fork on hinge.
    Pale-blue ID, folded PAPER post drawing and cobalt-blue pencil with fork near pink eraser remain secured in pouch.
    Exact ch43 boots override the barefoot sheet: matte dark-brown ankle-high leather work boots, broad round toes,
    four pairs of dull gunmetal round eyelets, dark-brown round laces in small double knots, black low-heeled lug soles,
    heel pull tabs, oat-grey short socks inside collars; no hooks, buckles, logos, bright trim or visible steel caps.
  taeo_locks: >
    One mole under RIGHT eye; olive backpack with faded orange OLD shield/open-door patch; dark-grey phone,
    top-left hairline crack, clear case and green dinosaur sticker. Healing recoil bruises on both forearms,
    no fresh bleeding or cardiac diagnosis. No link activation in this chapter.
continuity_notes: >
  ch080.yaml was absent at drafting and became available during the batch; its final ten panels and end card were
  checked and the opening reconciled. Continue its same charter sheet, RIGHT-hand pen and navy outdoor outfit.
  The heading and first rule are written, not a licence. Sera's opened/reclosed bronze cylinder and protected original
  letter both remain with her; the letter is not a new message and need not be exposed at this meeting.
  Arrival-owned cooperative route follows Chae's ch79 discovery. Ownership filing is a proposed lawful structure,
  subject to review, and does not repeal sponsor-employment law. No guild licence, new premises or funds awarded here.
  No numbered ledger plant/payoff is due in ch81. Motifs continue without adding a ledger entry to another file.
palette_notes: >
  Night workshop: practical warm work lamp, brown and blue-grey shadows, an A4 domestic-light extension.
  AAO: clean blue-white, light slate, navy. Ryu yard: A4 dusty ochre, brown, sky blue, muted safety orange.
  Flat cel colour, warm near-black contours. All documents, signs and screens blank unless filled by ui.
