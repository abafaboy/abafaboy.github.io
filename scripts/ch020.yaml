chapter: 20
title: Ask Me
when: "The day after ch 19's integration night. Saturday, 3:56 AM in the flat (the log window from ch 19 still open); a TTOK chat answered at 4:20 PM; the Ryu Survey yard from 7:05 PM (sunset), the party on the workshop roof until about 10:30 PM; goodbyes at the yard gate at 10:41 PM; the 12-minute walk home, stopped at about 10:47 PM under a streetlight on taeo_street, a block short of his building. Spring. No weekday or date is lettered (the TTOK date divider reads TODAY). Taeo works weekend days only since ch 18, this is Saturday: the party follows his weekend day shift."
story_beats: PART_ONE_BEATS.md#20
cast:
  taeo: outdoor     # P01–P05: default (black hoodie, black cargo trousers, socks, no jacket). P07 on: outdoor (navy zip jacket worn OPEN over the black hoodie), olive backpack with the faded orange shield-and-door patch, the phone with the top-left crack and the green dinosaur sticker. The folded notepad page with his copy of the log lives in the hoodie's front pocket all day (P05, P20, P53, P55–P58); the RIGHT-palm gravel graze remains under the square plaster from ch 17; no active nosebleed
  nib: default      # barefoot. V-notch in the LEFT ear, small lower fang on the LEFT, BROWN rope belt, leather pouch on the RIGHT hip (Haru's dinosaur sticker from ch 8 on its flap), knife in the brown wooden sheath on the LEFT hip. His binoculars from ch 19 (compact, black rubber armour, black woven neck strap knotted at the LEFT side of his neck; Kett's mark on the hinge) hang on his chest in EVERY panel he is in; healing RIGHT shoulder-blade graze from ch 17. Pale-blue ID card and Eunchae's cobalt-blue pencil (pink eraser, silver ferrule, chewed end, Kett's fork near the eraser) remain in the RIGHT-hip pouch; the original folded PAPER post drawing stays at the flat; Kwak's knee pads are stored by the entry step; Nib uses his denim-blue fleece blanket from ch 2 (the foil blanket is stored at the mart)
  minho: default    # brown work jacket, grey T-shirt, olive cargo trousers, black knee pads, brown boots; grey streak at the LEFT temple; radio clipped high on the LEFT chest; watch on the LEFT wrist; a black phone in a rugged case
  haein: default    # work overalls, tool belt, clear safety glasses pushed up on her head
  sejin: default    # off duty: a dark field jacket, no chest rig; her medic bag on her shoulder or at her feet; cropped hair, tired eyes
  eunchae: default  # NOT the store vest: cream shirt with rolled sleeves, black trousers, black-and-white canvas sneakers, high ponytail; a tote bag holding the dog-eared exam workbook, a ring of flashcards clipped to its strap
  dami: default     # straight from a day job: the cheap hi-vis porter vest over a grey hoodie, worn gloves in her back pocket, hard hat clipped to her small backpack
  mansu: default    # Kwak Mansu, discharged at 2 PM today: a clean checked flannel shirt buttoned to the neck with his back brace strapped over it, the hospital wristband still on his LEFT wrist, a borrowed aluminium cane, a blue inhaler in the breast pocket. Moves stiffly, breathes carefully
extras:
  taxi: "a plain white Seoul taxi with a blank roof sign; the driver is never seen (P50 only)"
locations: [taeo_flat, ryu_practice_yard, ryu_yard_roof, ryu_yard_street, taeo_street]
location_notes:
  taeo_flat: "LOCATIONS.md key and floor plan, P01–P05 only, 3:56 AM, desk lamp off, curtain shut. Nib's sleeping spot is the floor at the edge of the shoe step, back against the bathroom wall beside the door (as in ch006 P01). The low folding table stands mid-floor between the bed and the kitchenette."
  ryu_practice_yard: "Drawn ryu_practice_yard key: 18 x 26 m, south-centred double vehicle gate, grey corrugated office container southwest, its keyed step plus a removable wheelchair ramp, one visible white van southeast facing west, plywood maze in the centre, three targets at the north fence, equipment trestle west of maze. Fleet total TWO after ch 12's tow: the other van is in the adjoining northwest service bay, outside the key's main view. A low workshop stands beyond that northwest boundary; its WEST stair leads to ryu_yard_roof, the workshop roof introduced in ch 20. The office container is not the party roof. No new repossession marks until ch 22."
  ryu_yard_roof: "Decided here (reconcile when LOCATIONS.md adds ryu_practice_yard): the flat concrete roof of that workshop, about 8 x 6 m, coated in the green waterproof paint of Seoul rooftops, with a knee-high parapet topped by a galvanised pipe rail. An outside steel stair with a handrail climbs the workshop's WEST wall to the roof's north-west corner. A blue plastic water tank on a steel stand in the north-east corner; a row of white styrofoam planters with lettuce and chilli seedlings along the east parapet (Minho's mother's); two poles carrying a string of bare bulbs across the roof. The south parapet overlooks the street and the city: low Mapo roofs, lit apartment towers, and far off to the south-west the lit span of a Han River bridge. The southeast side looks down into the keyed yard. SEATING PLAN, locked P13–P49: a low folding table, long axis east–west, with a portable gas burner and a ridged grill plate in its middle. EAST head: Kwak in the roof's only plastic armchair, Dami on a stool at his north-east corner. NORTH side, west to east: Haein, Minho (the grill, the tongs, his phone on the table), Sejin (medic bag at her feet). SOUTH side, backs to the parapet and the city, west to east: Nib on an upturned blue crate, Taeo on a stool (backpack at his feet, patch out), Eunchae. The sun sets in the west."
  ryu_yard_street: "ch007's key: the pavement outside the yard: chain-link fence with orange safety mesh, a plane tree, low buildings, overhead wires. A taxi pulls in at the kerb in P50."
  taeo_street: "LOCATIONS.md sub-key: the two-lane bus street in Mangwon-dong that Taeo's building stands on: low red-brick blocks, gas meters, tangled overhead wires, a convenience-store sign far off, a parked delivery scooter. The hook happens under the last streetlight on the block before his building, about five minutes from his door. Keep the corner bus stop and its ad screen out of frame."
palette_notes: "Flat, 3:56 AM: deep blue-grey (A4 night with the lamp off) plus interface cyan #3FE3F2 on navy #0B1530, lighting only what faces the log window and ONLY in Taeo's view (P01, P02, P04); P03 and P05 show the room with no cyan at all. Yard and roof at dusk (P08–P12, decided here): low peach-orange sun from the west, dusty blue-violet shadows, the green roof paint muted toward grey-green; accent: the green glass of the soju bottles. Roof from blue hour to night (P13–P49, decided here): warm-white bulb pools (pale butter yellow, clearly paler and less saturated than the link amber), deep navy shadows, the small blue gas flame under the grill; accent: green soju glass. P28 adds one small violet-black gate glow with a cold white-cyan rim on the eastern skyline. Street at night (P50–P60): sodium-orange streetlight pools and deep navy shadows; the one bright accent is the white notepad page in Taeo's hand. Amber #F2A93B appears only in Nib's eyes and as one thin link pulse in Taeo's palm in P48. Red appears only as the red header-bar shapes on the phones in P28. One system window in the chapter (P01), already open, so no DING."

panels:

  # ---------------- COLD OPEN: the same night as the ch 19 hook ----------------
  - id: P01
    shape: tall
    gap: none
    bg: black
    camera: "high angle from the ceiling above the bed's head end (the window wall), looking west down the length of the dark flat toward the door"
    art: >
      Taeo's studio flat (taeo_flat key), 3:56 AM, desk lamp OFF, blackout curtain shut: the room is deep blue-grey with one thin grey-blue line at the curtain edge.
      The only strong light is interface cyan (#3FE3F2 on navy #0B1530) falling from empty air above the low folding table in the middle of the floor;
      leave that air empty, because the letterer floats the log window there.
      Read top to bottom. TOP (far end): the door wall; on the floor at the edge of the shoe step Nib (nib, default) sits asleep with his back against the bathroom wall,
      a blanket over his shoulders, chin down, the binoculars resting on his chest, barefoot, the brown wooden sheath at his LEFT hip. The cyan barely reaches him.
      MIDDLE: Taeo (taeo, default: black hoodie, black cargo trousers, socks) sits cross-legged at the folding table directly under the light, hunched, copying onto a
      small spiral-notepad page with a pencil. His face is lit cyan from above: red-rimmed eyes, mouth pressed flat. He has not slept at all.
      BOTTOM (near): the corner of the bed, its grey duvet thrown back. From this reverse angle the kitchenette strip is on the RIGHT of frame; the southeast clothes rack (backpack on its end hook, patch toward us) is on the LEFT, and the northwest desk and its photo shelf sit behind the camera on the RIGHT. Never mirror the room.
      Hard cel shadows; cyan only on surfaces that face the window. Not: haze, glowing dust, the desk lamp lit, any text.
    calm: top-right
    lines:
      - {who: narr, type: tag, text: "3:56 AM"}
      - {who: taeo, type: float, text: "I'VE READ IT ELEVEN TIMES."}
    ui:
      - {kind: system.log, on: float, at: [0.5, 0.38], headline: "[INTERFACE LOG]", lines: ["TRANSFER 0001 · ROUTE: EMERGENCY", "CATEGORY 7", "CONSENT: NOT REQUESTED", "OPERATOR: AUTO-SELECT (DAMAGED)"]}
    notes: "Continues ch 19 P58–P61: the log remains open from just before midnight into 3:56 AM. Its wording is unchanged. The operator line reprises ch 19's P09 plant; it is not a new plant. Route alignment stands at 50% (ch 19)."

  - id: P02
    shape: strip
    gap: short
    bg: black
    silent: true
    camera: "extreme close-up, straight down on the notepad page under the pencil"
    art: >
      The small spiral-notepad page on the pale wood of the folding table, lit cyan from above. Taeo's right hand grips the pencil so hard the knuckles are pale,
      and the graphite tip has just snapped at the end of the third line: a tiny crumb of lead beside it.
      Three short lines of careful handwriting run across the page, drawn as faint grey pencil strokes only (no letters; the letterer sets the last line).
      Hard shadow of the hand. Nothing else in frame.
    calm: none
    ui:
      - {kind: label, text: "CONSENT: NOT REQUESTED", at: [0.47, 0.62], size: 40, color: "#3a3d44", rot: -2, notes: "pencil handwriting; move onto the third stroke line once the art exists"}
    notes: "His copy holds the three lines about Nib and leaves out the operator line. This page is the chapter's key prop: P05, P20, P53, P55–P58."

  - id: P03
    shape: inset-l
    gap: short
    bg: black
    camera: "floor level beside Nib at the door, his profile close in the foreground, Taeo far across the room"
    art: >
      What the room looks like to anyone except Taeo: completely DARK. No cyan anywhere; deep blue-grey and one thin grey line at the curtain edge.
      Foreground, close: Nib's face in profile, his LEFT ear with its V-notch toward us, eyes OPEN, a faint glint in the amber, perfectly still,
      the blanket still over his shoulders, the binocular strap at his neck. He has been awake for a while.
      Background, small: Taeo as a dark hunched shape at the folding table, writing in the dark.
      Not: any cyan light, any window shape, any text.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "YOUR PENCIL IS LOUD."}
      - {who: nib, type: speech, side: l, text: "AND YOU'RE WRITING IN THE DARK."}
    notes: "The contrast with P01 shows the rule without stating it: the interface's light exists only for Taeo."

  - id: P04
    shape: inset-r
    gap: short
    bg: black
    camera: "close-up on Taeo at the table, three-quarter front, slightly from below"
    art: >
      Taeo (default) caught out: he has flattened his palm over the notepad page and turned it face down, too fast. Cyan light from above on his face again (his view);
      his eyes slide toward the door, guilty, and he tries to make his face ordinary. The pencil rolls away across the table. Plain dark background behind him.
    calm: left
    lines:
      - {who: taeo, type: speech, side: r, text: "SORRY. THE INTERFACE IS OPEN. IT'S BRIGHT FOR ME."}
      - {who: "offpanel:nib", type: speech, side: l, text: "WHAT DOES IT SAY?"}
      - {who: taeo, type: nervous, side: r, text: "...JUST NUMBERS. GO BACK TO SLEEP."}
    notes: "The lie that the hook undoes. 'Just numbers' is half true: ch 19's window showed ROUTE ALIGNMENT 50%."

  - id: P05
    shape: wide
    gap: short
    bg: black
    camera: "medium wide, low across the floor from the kitchenette side, Taeo in profile at the table, Nib by the door at frame left"
    art: >
      The cyan light has gone out by itself: the window is closed and the flat is dark blue-grey again, the curtain line the only grey.
      Taeo sits motionless in profile at the folding table, his palm still flat on the face-down page, shoulders up near his ears, staring at nothing.
      At frame left by the door, Nib's eyes have closed again under the blanket; the binoculars rise and fall on his chest.
      Two hard shadow tones only. Not: cyan, amber, any text.
    calm: top
    lines:
      - {who: taeo, type: float, text: "I'LL TELL HIM IN THE MORNING."}

  - id: P06
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 20 · ASK ME"

  # ---------------- THE YARD, DUSK ----------------
  - id: P07
    shape: narrow-r
    gap: long
    bg: white
    camera: "kit phone hand, straight on"
    art: "KIT HAND"
    calm: none
    ui:
      - {kind: phone.ttok_chat, on: screen, hand: taeo_right_front, title: "Kwak's out", clock: "16:21", date: "TODAY", messages: [{from: them, text: "Dami: AHJUSSI IS OUT!!! Discharged at 2", time: "14:06"}, {from: them, text: "Minho: Roof at the yard. 7.", time: "14:09"}, {from: them, text: "Sejin: Coming as his medic. Not as a guest.", time: "14:12"}, {from: them, text: "Eunchae: I'm bringing lettuce. Nobody else bring lettuce.", time: "14:31"}, {from: me, text: "I'll bring cups.", time: "16:20"}]}
    notes: "A group chat Dami made. Taeo answers two hours late: he has carried the page all day. The date divider reads TODAY so no calendar date is committed (the letterer's default would print TUE 14 MAR)."

  - id: P08
    shape: full
    gap: long
    bg: white
    camera: "establishing, eye level from the pavement outside the yard's pedestrian gate, looking north-east into the yard"
    art: >
      The Ryu Survey yard (ryu_practice_yard) at sunset. Through the open pedestrian gate in the chain-link fence with its orange safety mesh: packed ochre dirt, the plywood maze,
      the grey site-office container, one white van southeast facing west and the second at the northwest service bay beyond the keyed yard; no third van. Beyond the northwest fence, the adjoining one-storey block workshop with its steel stair up the west wall.
      On its flat green-painted roof (ryu_yard_roof): Minho (minho, default) crouched at a gas burner, Haein (haein, default) on a stepladder hanging a string of bare bulbs,
      and Nib (nib, default, binoculars on his chest) already up on the parapet rail like a sentry: he went up first.
      Foreground, at the foot of the stair, small: Taeo (taeo, outdoor) holding a plastic sleeve of plain white paper cups, looking up at the roof and not moving yet.
      Low peach-orange sun from the west (frame left), long hard shadows across the dirt, blue-violet shadow sides. A drawn background. Not: readable text, signs with letters, a third van.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "RYU SURVEY YARD · 7:05 PM"}
      - {who: taeo, type: float, text: "I DIDN'T TELL HIM IN THE MORNING."}
      - {who: taeo, type: float, text: "OR AT LUNCH."}
    notes: "Two vans: Bluebird towed the third in ch 12. The empty bay is the debt made visible; nobody mentions it."

  - id: P09
    shape: wide
    gap: short
    bg: white
    camera: "Nib's point of view through his binoculars, from the roof down to the yard gate"
    art: >
      Binocular point of view: two overlapping circles of picture inside a solid black mask, each circle with a thin dark rim.
      Inside, magnified and slightly flattened, the pedestrian gate below in the last sunlight: Dami (dami, default) with a black plastic bag of green soju bottles in one hand,
      her other arm hooked under Kwak's (mansu, default: checked flannel, back brace over it, hospital wristband, aluminium cane), steering him over the gate's sill;
      Kwak walks stiffly, smiling at the ground. Behind them Eunchae (eunchae, default) carries an enormous paper bag with lettuce leaves spilling over the top,
      and Sejin (sejin, default) comes last with her medic bag on one shoulder. Peach-orange light, blue-violet shadows. Not: text, a crosshair or any HUD.
    calm: top
    lines:
      - {who: "offpanel:nib", type: speech, side: r, text: "FOUR. ONE WITH A STICK. ONE WITH GREEN BOTTLES."}
      - {who: "offpanel:nib", type: speech, side: r, text: "ONE WITH LEAVES. AND THE 'SAY AH' ONE."}
    notes: "Callback: Sejin's 'SUMMONED IS NOT A DIAGNOSIS. SAY AH.' (ch 10)."

  - id: P10
    shape: inset-l
    gap: short
    bg: white
    camera: "medium close-up at the parapet, Haein and Nib side by side"
    art: >
      Haein (default), safety glasses pushed up, leans on the parapet rail beside Nib and stares at his binoculars the way other people stare at cake.
      Nib has lowered them and holds them flat against his chest with both hands, flat-eyed. Behind them Taeo is building a tower of paper cups on the table, glancing over.
      Peach dusk light; the bulb string and the sky behind, simplified.
    calm: right
    lines:
      - {who: haein, type: speech, side: l, text: "CAN I TAKE THOSE APART?"}
      - {who: nib, type: speech, side: l, text: "NO."}
      - {who: taeo, type: speech, side: r, text: "SHE'D HAVE A SCREW LEFT OVER."}
    notes: "Callback to ch 7 P11, where Taeo noticed the screw Haein left over after rebuilding the radio."

  - id: P11
    shape: wide
    gap: short
    bg: white
    camera: "side-on at roof level beside the top of the steel stair"
    art: >
      Kwak (mansu) reaches the top of the stair, one hand on the rail and the cane in the other, breathing carefully; Dami is right behind him with a palm on his back brace.
      Nib has dropped off the parapet and stands at the top step; without fuss he takes Kwak's elbow over the last step, one soldier helping another.
      Kwak looks down at him and gives a small, serious bow of the head, as to an equal. Nib nods once.
      The green roof paint, the water tank, the bulbs (not lit yet) and the low sun behind them. Dusk palette. Not: Nib drawn small or childlike beside Kwak's bulk.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "YOU'RE WALKING."}
      - {who: mansu, type: speech, side: r, text: "BADLY."}
    notes: "Their first meeting since the hospital (ch 18). Kwak's injuries stay general (stiff, a cane, careful breathing); match ch018 if it names them."

  - id: P12
    shape: inset-r
    gap: short
    bg: white
    camera: "close two-shot, Sejin at Kwak's elbow"
    art: >
      Sejin (default, medic bag on her shoulder) has two fingers on Kwak's wrist above the hospital band, taking his pulse while he pretends not to notice;
      she looks at her watch, not at him, deadpan and tired. Kwak gazes over at the grill. Simple flat dusk background.
    calm: left
    lines:
      - {who: sejin, type: speech, side: r, text: "CHEST?"}
      - {who: mansu, type: speech, side: l, text: "IT'S FINE."}
      - {who: sejin, type: speech, side: r, text: "THAT'S ONE."}
    notes: "Runner set up: Sejin counts every 'IT'S FINE' tonight (the second is Taeo's, P24–P25)."

  # ---------------- THE PARTY ----------------
  - id: P13
    shape: full
    gap: long
    bg: white
    camera: "establishing the party, slightly high, from above the west end of the table near the top of the stair, looking east down its length"
    art: >
      Blue hour on the roof (ryu_yard_roof, seating plan): the bulbs have just come on in warm-white pools on the green paint; the sky is deep blue going navy,
      and the city beyond the south parapet (right of frame) is starting to light up. Kwak sits at the far east head in the plastic armchair facing us, Dami beside him.
      On the table: pork belly sizzling on the ridged grill plate over the blue gas flame, garlic slices, a dish of kimchi, a mountain of Eunchae's lettuce,
      green soju bottles and Taeo's tower of paper cups. Minho (left side) holds the tongs over the meat; Eunchae, far right, has reached across and is pulling them
      out of his hand with a teacher's frown, and Minho lets go, baffled. Haein (near left) laughs into her cup. Nib (near right, on his crate) eats a strip of pork
      with his fingers; Taeo beside him smiles a beat late, one hand resting on his hoodie pocket. Grease smoke rises in one thin, hard-edged curl.
      Not: haze, steam clouds, text on the bottles.
    calm: top-left
    lines:
      - {who: eunchae, type: speech, side: r, text: "THOSE TONGS TOUCHED RAW PORK. COOKED MEAT GETS CLEAN TONGS."}
      - {who: minho, type: speech, side: l, text: "ARE YOU STUDYING RIGHT NOW?"}
      - {who: eunchae, type: speech, side: r, text: "I'M ALWAYS STUDYING."}
    sfx:
      - {text: "TSSSSS", style: quiet, at: [0.5, 0.6], size: M, rot: -4}
    notes: "Runner: Eunchae's food-licence exam at the worst moments. No exam date is said here (ch 22 sets 'three weeks')."

  - id: P14
    shape: wide
    gap: short
    bg: white
    camera: "medium two-shot across the south-west corner of the table, eye level"
    art: >
      Dami has come round to Nib's crate with a green bottle and filled a paper cup for him. Nib holds the cup straight back out to her at arm's length, motionless, deadpan.
      Dami takes it and throws it back in one go, delighted, eyes squeezed shut, the hi-vis vest catching the bulb light, the bottle already tilting to refill.
      Bulbs and navy sky behind, simplified. Not: text on the bottle label.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "YOU FIRST."}
      - {who: dami, type: shout, side: r, text: "GLADLY!"}
    notes: "Motif: YOU FIRST (whoever offers a drink drinks it first)."

  - id: P15
    shape: inset-r
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag (A5b). Chibi Nib (ear notch, brown belt, pouch, wooden sheath and binoculars all present) has taken one sip of the refill: his whole face has
      crumpled into a wrinkled knot, ears shot straight back, steam blasting from both ears, tongue out, the paper cup held as far away as his short arm reaches.
      Chibi Dami cackles behind him in a burst of sparkles. Flat pale-green background with a screentone dot pattern.
    calm: top
    lines:
      - {who: nib, type: speech, side: c, text: "WHO DID THIS TO WATER?"}
    sfx:
      - {text: "HAHAHA", style: comic, at: [0.78, 0.2], size: S, rot: 8}

  - id: P16
    shape: inset-l
    gap: short
    bg: white
    camera: "medium close-up, Taeo and Nib side by side on the south side of the table"
    art: >
      Normal style again. A plastic water bottle now stands by Nib's crate and his cup holds water. He holds out a lettuce wrap he has built himself: far too big,
      three leaves, four strips of pork, a whole clove of garlic and a heroic smear of paste, held together by will alone in his long green fingers.
      He offers it flatly without looking at Taeo. Taeo looks at it, then at him, caught off guard by the kindness: a tired, real, lopsided smile.
      Warm-white bulb light; navy behind.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "EAT. YOU DIDN'T SLEEP."}
      - {who: taeo, type: speech, side: r, text: "...THANKS."}
    notes: "Nib noticed the sleepless night (P03). Food as care, as in ch 7's 'THEN EAT. YOURS IS GOING COLD.' From here Nib's cup holds water, which matters in P46."

  # ---------------- KWAK'S LIST ----------------
  - id: P17
    shape: wide
    gap: long
    bg: white
    camera: "low angle from table height at the west end, looking up the table at Kwak standing at its head"
    art: >
      Night has nearly come. Kwak has pushed himself up out of the armchair with the cane, a paper cup raised in his other hand, the back brace over his flannel;
      Dami hovers with both hands half out in case he tips. Around the table everyone goes still and quiet, cups lowering.
      Kwak's face: a shy, heavy, unshowy man about to say something he rehearsed in the dark. The bulbs hang behind his head; navy sky; the water tank in silhouette.
      Not: a microphone, a banner, any text.
    calm: top
    lines:
      - {who: mansu, type: speech, side: c, text: "I'M NOT A SPEECH MAN."}
      - {who: mansu, type: speech, side: c, text: "UNDER THAT SLAB I MADE A LIST. THINGS I'D DO IF I GOT OUT."}

  - id: P18
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up, Kwak's face, straight on"
    art: >
      Kwak, utterly deadpan, eyes half shut, as if reading item one off the inside of his eyelids. Flat warm background.
    calm: left
    lines:
      - {who: mansu, type: speech, side: r, text: "NUMBER ONE WAS PORK."}
    sfx:
      - {text: "HAHAHA", style: comic, at: [0.2, 0.18], size: M, rot: -8}
      - {text: "HA!", style: comic, at: [0.82, 0.86], size: S, rot: 10}

  - id: P19
    shape: wide
    gap: short
    bg: white
    camera: "over Kwak's shoulder, looking down the table at Nib on his crate"
    art: >
      The laughter has settled. Kwak has turned his cup and his stiff body toward Nib; in the near foreground, the back of his shoulder and the brace strap.
      Nib, on his crate, looks up with his deadpan face and does not know what to do with his hands; he gives one small nod.
      Beside him Taeo had started to raise his own cup and has stopped. Bulb light; the city glow beyond the south parapet.
    calm: top
    lines:
      - {who: mansu, type: speech, side: l, text: "NUMBER TWO. THANK THE ONE WHO CAME BACK FOR ME."}
      - {who: mansu, type: speech, side: l, text: "NOBODY ASKED HIM TO. HE CAME ANYWAY."}

  - id: P20
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "extreme close-up on Taeo's hands"
    art: >
      Taeo's right hand holds a paper cup frozen halfway up, the surface of the soju trembling. His left hand has gone flat over the front pocket of his hoodie,
      over the folded page underneath. Bulb light on the knuckles. Nothing else in frame.
    calm: none
    notes: "The word 'asked' lands on him."

  - id: P21
    shape: wide
    gap: short
    bg: white
    camera: "three-quarter from behind Eunchae's shoulder as Kwak turns to Taeo"
    art: >
      Kwak turns his cup and his whole stiff body toward Taeo. Taeo straightens, alarmed to be the subject, and makes a small no-no wave with his free hand.
      In the near foreground, Eunchae's shoulder and ponytail. Across the table Minho chews and watches. Bulb light, navy shadows, simplified background.
    calm: top
    lines:
      - {who: mansu, type: speech, side: l, text: "NUMBER THREE. DAMI SAYS SOMEONE PAID FOR THE HOURS THEY SPENT ON ME."}
      - {who: taeo, type: nervous, side: r, text: "THAT WAS THE CONTRACT. IT WASN'T YOUR—"}

  - id: P22
    shape: wide
    gap: short
    bg: white
    camera: "medium on Minho at the grill, eye level, Taeo at the right edge of frame"
    art: >
      Minho, mid-chew, turns a strip of pork with the clean tongs and says it flatly without looking up: no malice, just a man who does the accounts.
      At the right edge Taeo turns to him with a betrayed, pleading face. Grill smoke curls in one hard-edged ribbon. Bulb light.
    calm: top-left
    lines:
      - {who: minho, type: speech, side: l, text: "THREE MILLION FOUR HUNDRED THOUSAND. OUT OF HIS DEPOSIT."}
      - {who: taeo, type: speech, side: r, text: "MINHO."}
      - {who: minho, type: speech, side: l, text: "WHAT? HE ASKED."}
      - {who: narr, type: footnote, text: "*₩3,400,000 ≈ US$2,500"}
    notes: "Ryu Survey's share of the Guro lateness penalty, signed away in ch 17 from his ₩5,000,000 flat deposit (ch 15)."

  - id: P23
    shape: full
    gap: short
    bg: white
    camera: "side-on, low, along the length of the table"
    art: >
      Kwak bows: a full, deep, ninety-degree bow from the waist toward Taeo, cane braced, paper cup still in his hand, the bulbs swinging above him.
      Taeo has shot halfway up off his stool with both hands out, mortified, a sweat drop at his temple. Dami lunges for Kwak's elbow; Sejin half rises.
      Nib watches from his crate, very still. Everyone else has frozen mid-bite. A real bow, played straight, with the comedy only in Taeo's panic.
    calm: top
    lines:
      - {who: taeo, type: nervous, side: r, text: "PLEASE— SORRY— DON'T, YOU GOT OUT OF HOSPITAL TODAY—"}
      - {who: dami, type: shout, side: l, text: "AHJUSSI, YOUR BACK!"}

  - id: P24
    shape: inset-l
    gap: short
    bg: white
    camera: "close two-shot, Eunchae leaning in beside Taeo"
    art: >
      The same minute: Kwak is sitting again. Eunchae leans in close to Taeo's ear, quiet, sharp-eyed, not letting it go.
      Taeo answers with his polite, exhausted smile, the one he uses on customers. Plain warm background.
    calm: right
    lines:
      - {who: eunchae, type: whisper, side: l, text: "WHAT'S LEFT OF THE DEPOSIT?"}
      - {who: taeo, type: speech, side: r, text: "ONE POINT SIX MILLION. IT'S FINE."}
    notes: "₩5,000,000 − ₩3,400,000 = ₩1,600,000: the balance the ch 21 zoning notice prints."

  - id: P25
    shape: inset-r
    gap: short
    bg: white
    camera: "medium close-up, Sejin across the table"
    art: >
      Sejin, across the table, does not look up from the lettuce wrap she is folding: one eyebrow up, deadpan, two fingers raised.
      Flat navy background.
    calm: left
    lines:
      - {who: sejin, type: speech, side: r, text: "THAT'S TWO."}

  - id: P26
    shape: wide
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag (A5b). Chibi Minho holds the grey streak at his LEFT temple out between two fingers like evidence, a magnifying glass in his other hand,
      and points it at chibi Taeo, who has turned to stone with one giant sweat drop. A tiny sparkle marks one brand-new grey hair.
      Flat pale-blue background with speed lines.
    calm: top
    lines:
      - {who: minho, type: speech, side: l, text: "THAT'S YOU. THAT ONE'S YOU."}
    notes: "Runner (STORY_BIBLE §9): Minho's grey streak gaining hairs, this one earned by 'take it from my deposit' (ch 15)."

  - id: P27
    shape: wide
    gap: long
    bg: white
    camera: "three-quarter from across the table on Taeo and Haein, eye level"
    art: >
      Normal style. Haein has dragged her stool round to squeeze in beside Taeo, elbows on her knees; she has taken his right hand by the wrist and turned the palm up
      under a bulb, peering at it as if it were an engine part that makes a strange noise, with a hungry mechanic's grin. Taeo lets her, wary, interested despite himself.
      The table carries on behind them, simplified. Night sky. Not: any glow in his palm.
    calm: top
    lines:
      - {who: haein, type: speech, side: l, text: "YOU FELT A SLAB SLIP. FROM OUTSIDE A C-GRADE."}
      - {who: haein, type: speech, side: l, text: "IF YOU CAN FEEL IT, I CAN MEASURE IT. IF I CAN MEASURE IT, WE CAN MOVE IT."}
      - {who: taeo, type: speech, side: r, text: "...MOVE IT WHERE?"}
    notes: "Arc III seed (invention): the sandbag tests and [LOAD SHARE] in ch 27. Haein saw his first recoil nosebleed in ch 12. She does not answer; the grin is the answer."

  # ---------------- THE CITY ----------------
  - id: P28
    shape: full
    gap: long
    bg: white
    camera: "from behind Nib on the east parapet, looking out over the city to the east"
    art: >
      Full night. Nib stands on the east parapet's pipe rail beside the water tank, barefoot and perfectly balanced, binoculars to his eyes.
      Beyond him, the low roofs of Mapo and lit apartment towers; between two of them, small and far, a violet-black glow with a cold white-cyan rim,
      ringed by tiny blue-and-red cordon lights: a gate, somewhere in Hapjeong-dong. Below and behind him on the table (lower left), three phones light up at once,
      their screens plain pale rectangles with a red bar shape and no text. The bulb string; navy sky. Not: haze, a readable alert, a fourth light colour.
    calm: top-right
    lines:
      - {who: narr, type: tag, text: "8:52 PM"}
      - {who: nib, type: speech, side: c, text: "VIOLET. THAT WAY."}
      - {who: nib, type: speech, side: c, text: "...NOW THE BRICKS SHOUT."}
    sfx:
      - {text: "BEEEP", style: alert, at: [0.14, 0.78], size: S, rot: -8}
      - {text: "BEEEP", style: alert, at: [0.3, 0.88], size: S, rot: 6}
    notes: "Nib sees it before the Emergency Alert arrives. Runner: phones are 'shouting bricks'. Arc III seed: the Hapjeong gate advisory zone declared in ch 21."

  - id: P29
    shape: inset-l
    gap: short
    bg: white
    camera: "medium close-up, Minho reading his phone, Eunchae at the frame edge"
    art: >
      Minho reads the alert on his phone (the screen turned away from us, a pale glow on his face), jaw tight, the grey streak catching the bulb light.
      At the frame edge Eunchae has stopped wrapping lettuce and is unsmiling, a different person for one second. Plain navy background.
    calm: right
    lines:
      - {who: minho, type: speech, side: l, text: "HAPJEONG. THIRD ONE THIS MONTH."}
      - {who: eunchae, type: speech, side: r, text: "THEY'LL ZONE IT. THEN THE RENTS JUMP."}
    notes: "Eunchae's flicker plants her lost jeonse deposit (revealed ch 22) without telling it."

  # ---------------- DREAMS SAID OUT LOUD ----------------
  - id: P30
    shape: wide
    gap: long
    bg: white
    camera: "medium, low angle on Dami at the east end of the table"
    art: >
      Dami slaps her paper cup down on the table and points round the table with a lettuce leaf like a conductor's baton, cheeks pink from soju, refusing the mood.
      Kwak beside her in the armchair, amused. Bulbs; navy sky.
    calm: top
    lines:
      - {who: dami, type: speech, side: c, text: "NOPE. NO RENT TALK AT A PORK PARTY."}
      - {who: dami, type: speech, side: c, text: "AHJUSSI MADE A LIST. EVERYBODY SAYS THEIR BIG ONE."}

  - id: P31
    shape: inset-r
    gap: short
    bg: white
    camera: "two-shot, Haein and Sejin on the north side"
    art: >
      Haein, back on her own stool, holds up both palms: not playing. Sejin beside her answers at once, dry, looking into her cup, as if she has had it ready for years.
      Flat warm background.
    calm: left
    lines:
      - {who: haein, type: speech, side: l, text: "I'M NOT DRUNK ENOUGH."}
      - {who: sejin, type: speech, side: r, text: "A CLINIC. OPEN NINE TO SIX. CLOSED SUNDAYS."}
    notes: "Sejin's want (STORY_BIBLE): a clinic with predictable hours; paid off in ch 99. Haein's dream is left for a later chapter."

  - id: P32
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up on the table beside the grill"
    art: >
      Minho's black phone in its rugged case buzzes on the table among the lettuce and the paper cups, screen up. Screen: green.
      His broad hand is coming down on it, palm open, to flip it face down. Bulb light; a smear of grill grease on the table.
    calm: none
    ui:
      - {kind: phone.ttok_call, on: screen, caller: "Bluebird Capital"}
    sfx:
      - {text: "BZZT", style: phone, at: [0.78, 0.3], size: M, rot: -6}
      - {text: "BZZT", style: phone, at: [0.9, 0.62], size: S, rot: 4}

  - id: P33
    shape: wide
    gap: short
    bg: white
    camera: "medium on Minho, eye level from across the table"
    art: >
      Minho, his palm flat on the face-down phone (it is still buzzing), says it with total deadpan, looking at nobody, and the table cracks up around him.
      At the frame edge Dami holds up her own phone and waggles it: same club. Bulb light, navy sky.
    calm: top
    lines:
      - {who: minho, type: speech, side: l, text: "GET MY FAMILY OUT OF DEBT."}
      - {who: minho, type: speech, side: l, text: "AND NEVER ANSWER A BLUEBIRD CALL AGAIN."}
      - {who: dami, type: speech, side: r, text: "THEY CALL ME TOO."}
    notes: "Minho's dream (beat). The Ryu debt figure (₩310,000,000) stays hidden until ch 26. Dami's draw loan (₩2,100,000, ch 13) is also owed to Bluebird."

  - id: P34
    shape: wide
    gap: short
    bg: white
    camera: "two-shot across the south-east corner of the table, slightly high"
    art: >
      Eunchae says hers plainly and seriously, a lettuce wrap forgotten in her hand, eyes on the city lights. Dami gapes at her, delighted and appalled.
      Eunchae answers without turning her head, dry. Bulbs; the city glow beyond the parapet.
    calm: top
    lines:
      - {who: eunchae, type: speech, side: l, text: "MY OWN PLACE. MY NAME OVER THE DOOR. FAIR RENT."}
      - {who: dami, type: speech, side: r, text: "FAIR RENT? IN SEOUL?"}
      - {who: eunchae, type: speech, side: l, text: "I SAID DREAM."}
    notes: "Eunchae's dream (beat). Paid off in ch 99 (Eunchae's, at fair rent)."

  - id: P35
    shape: wide
    gap: short
    bg: white
    camera: "close medium on Dami, eye level, Kwak's shoulder in the near foreground"
    art: >
      Dami, her cup held in both hands, tries to say it as a joke and it comes out true: a crooked grin that wobbles, eyes bright.
      Kwak's shoulder and brace strap in the near foreground. Plain warm background.
    calm: top
    lines:
      - {who: haein, type: speech, side: l, text: "YOU STARTED THIS. GO."}
      - {who: dami, type: speech, side: r, text: "THE NEWS SAID 'NO CASUALTIES.' NOBODY SAID AHJUSSI'S NAME."}
      - {who: dami, type: speech, side: r, text: "TO BE A PORTER PEOPLE SAY THE NAME OF."}
    notes: "Dami's dream (beat). Callbacks: ch 18's KNN headline ('NO CASUALTIES') and the porters' chat ('AGAIN NOBODY SAYS OUR NAMES')."

  - id: P36
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up, Nib on his crate, looking down the table at Dami"
    art: >
      Nib says it at once and plainly, like a name read off a duty roster, looking straight at her: deadpan, utterly serious, no smile. Plain flat background.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "GU DAMI."}

  - id: P37
    shape: full
    gap: short
    bg: white
    camera: "high angle over the table from above the grill, cups rising toward Dami"
    art: >
      BIG REACTION. Kwak lifts his cup first, then everyone does, cups raised toward Dami from all round the table: Minho, Haein, Sejin, Eunchae, Taeo, Nib.
      Dami, at the east end, laughs and cries at once, mouth open, tears running, scrubbing her eyes with the sleeve of her grey hoodie under the hi-vis vest.
      Bulb light on every raised hand; the grill's blue flame in the centre. Not: haze or sparkles in normal style.
    calm: top-left
    lines:
      - {who: mansu, type: speech, side: l, text: "GU DAMI."}
      - {who: crowd, type: shout, side: c, text: "GU DAMI!"}
      - {who: dami, type: nervous, side: r, text: "YOU'RE ALL DRUNK."}
    notes: "The inherited will in miniature: a porter's name said out loud (her GO FIRST patch, ch 100)."

  - id: P38
    shape: inset-r
    gap: short
    bg: white
    camera: "medium close-up, Dami pointing her cup at Nib"
    art: >
      Dami, still sniffing, eyes red, points her cup at Nib like a microphone. Nib, at the frame edge, has already gone back to eating, unbothered. Flat background.
    calm: left
    lines:
      - {who: dami, type: speech, side: r, text: "SCOUT. YOU."}
      - {who: nib, type: speech, side: l, text: "NOT TONIGHT."}
      - {who: dami, type: speech, side: r, text: "BOO!"}
    notes: "Callback: ch 2, when Nib looked out of the open door and closed it himself: 'NOT TONIGHT.' His dream is spoken in ch 31."

  - id: P39
    shape: wide
    gap: short
    bg: white
    camera: "over Eunchae's shoulder, on Taeo"
    art: >
      Every head turns to Taeo. Taeo, holding his lettuce wrap, makes the full customer-service retreat: shoulders up, polite smile, a sweat drop, leaning away.
      In the near foreground, Eunchae's ponytail and her finger pointing at him. Bulb light.
    calm: top
    lines:
      - {who: eunchae, type: speech, side: l, text: "THEN TAEO."}
      - {who: taeo, type: nervous, side: r, text: "ME? NO, I'M— I'M JUST HERE FOR THE PORK—"}

  - id: P40
    shape: wide
    gap: short
    bg: white
    camera: "low angle from beside the grill, Minho leaning in, the others behind him"
    art: >
      Minho leans across the table with the clean tongs pointed at Taeo like a gavel, not smiling, entirely serious: he means it.
      Behind him Dami and Haein bang the table with their fists and paper cups, grinning; Kwak claps the arm of his chair. A comedy pile-on with a true centre.
      Bulbs; navy sky.
    calm: top
    lines:
      - {who: minho, type: speech, side: l, text: "YOU SIGNED AWAY YOUR DEPOSIT FOR A MAN YOU MET THAT MORNING."}
      - {who: minho, type: speech, side: l, text: "YOU'VE GOT ONE. SAY IT."}
      - {who: crowd, type: shout, side: r, text: "SAY IT! SAY IT!"}
    sfx:
      - {text: "BAM BAM", style: impact, at: [0.82, 0.8], size: M, rot: -6}

  - id: P41
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up of Taeo's eyes"
    art: >
      An extreme close-up strip of Taeo's eyes as he turns on his stool toward the city beyond the south parapet: the noise falls away from his face,
      the city lights reflected as tiny points in his pupils. Something old is surfacing. Navy, one warm bulb highlight. Nothing else in frame.
    calm: right
    lines:
      - {who: taeo, type: float, text: "I'VE NEVER SAID IT OUT LOUD."}

  - id: P42
    shape: tall
    gap: short
    bg: white
    camera: "low angle from just inside the south parapet, looking up at Taeo turned toward the city"
    art: >
      Taeo (outdoor) has turned on his stool to face the city, and so the camera, with his back to the table; his friends sit small and simplified behind him
      at the bottom of the frame. He is not loud. He says it to the city lights the way you say a thing you have carried since you were fourteen: steady, unguarded, sure,
      the first time we have seen him look sure of anything. The city's cool glow lights his face from the front; the warm bulbs rim him from behind.
      At his feet the olive backpack, its faded orange shield-and-door patch catching the light. Above him the string of bulbs and a deep navy sky with no moon.
      Hard shadows. Not: glow haze, amber, a heroic wind, any text.
    calm: top
    lines:
      - {who: taeo, type: speech, side: c, text: "I'LL CLEAR THE HARDEST GATE IN THIS COUNTRY WITHOUT SETTING FOOT IN IT."}
      - {who: taeo, type: intense, side: c, text: "AND EVERYONE I SEND IN COMES HOME."}
    notes: "Taeo's dream (STORY_BIBLE §6, iconic). The patch is Seoryun's team emblem: his straw hat."

  - id: P43
    shape: wide
    gap: short
    bg: white
    silent: true
    camera: "wide, from the east end over the back of Kwak's armchair, looking down the whole table"
    art: >
      Total silence. Everyone frozen exactly where the words caught them: Dami's cup at her lips, Eunchae's lettuce wrap halfway up, Haein's mouth open,
      Sejin's head tilted, Minho's tongs still pointed; Kwak's back and the armchair in the near foreground.
      At the far end Taeo is still turned away toward the city, and beside him Nib is the only one looking at Taeo instead of at nothing.
      The grill has stopped sizzling: no smoke. Bulb light, navy sky.
    calm: none

  - id: P44
    shape: inset-r
    gap: short
    bg: white
    camera: "medium close-up, Minho"
    art: >
      BIG REACTION. Minho's composure breaks: a laugh bursts out of him that he did not expect, doubled over, the tongs dropped, one hand over his eyes, tears of laughter.
      Not a sneer: the helpless laugh you give a friend who has said something enormous, and his other hand is reaching for Taeo's shoulder.
      Flat warm background with a few burst lines.
    calm: left
    lines:
      - {who: minho, type: speech, side: r, text: "YOU CAN'T EVEN GET A LICENCE."}
    sfx:
      - {text: "PFFT—HA", style: comic, at: [0.24, 0.16], size: M, rot: -10}
    notes: "Minho mocks the dream (STORY_BIBLE §6) without cruelty. Taeo is an unlicensed radio trainee (ch 10); he registers for the exam in ch 47."

  - id: P45
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up on the table top at the west end"
    art: >
      Nib's long green knuckles knock on the folding table three times; the paper cups jump a little at each knock. His other hand already holds his own cup of water.
      Hard bulb light, crisp shadow. Nothing else in frame.
    calm: none
    sfx:
      - {text: "TOK", style: quiet, at: [0.3, 0.3], size: M, rot: -4}
      - {text: "TOK", style: quiet, at: [0.5, 0.24], size: M, rot: 2}
      - {text: "TOK", style: quiet, at: [0.7, 0.3], size: M, rot: 6}
    notes: "Motif: the knock (ch 10). Three knocks from inside mean 'coming'. The laughter stops."

  - id: P46
    shape: bleed
    gap: short
    bg: black
    camera: "low angle from table height, looking up at Nib standing on his crate"
    art: >
      Nib (nib, default: V-notch in the LEFT ear, small fang on the left, brown rope belt, pouch on the RIGHT hip with Haru's sticker, wooden sheath on the LEFT hip,
      barefoot, the binoculars on his chest) has stepped up onto his upturned crate and for once stands taller than everyone seated around him.
      He raises his paper cup of plain water out toward Taeo. Face: dead serious, deadpan, no smile, eyes level on Taeo, a soldier giving his word.
      Behind and above him, the string of bulbs and the deep navy sky; the table edge and one of Taeo's paper cups in the near foreground.
      Warm-white bulb light on one side of his face, navy shadow on the other; amber only in his eyes. Weathered, adult, never cute.
      The panel's bottom edge breaks its border. Not: glow haze, light rays, a smile.
    calm: top
    lines:
      - {who: nib, type: speech, side: c, text: "THEN DON'T SEND ME."}
      - {who: nib, type: speech, side: c, text: "ASK ME."}
    notes: "Iconic line (STORY_BIBLE §2): Nib defends the dream. His cup holds water since P16, the cup of ch 2."

  - id: P47
    shape: full
    gap: short
    bg: white
    camera: "high angle straight down over the table onto the ring of raised cups"
    art: >
      From straight above: a ring of paper cups meeting over the grill, every hand reaching in toward Nib's cup: Dami's, Minho's, Haein's, Sejin's, Eunchae's,
      and Kwak's heavy hand with the hospital wristband. Laughing faces tipped up round the rim of the frame. Taeo's cup arrives last, and lower than the others.
      Bulb light, the blue flame in the centre, green roof paint round the table.
    calm: top
    lines:
      - {who: dami, type: shout, side: l, text: "YOU HEARD HIM! TO ASKING!"}
      - {who: crowd, type: shout, side: c, text: "TO ASKING!"}

  - id: P48
    shape: inset-r
    gap: short
    bg: white
    silent: true
    camera: "medium close-up on Taeo, slightly high"
    art: >
      Taeo, seated, while everyone else drinks: he cannot laugh. The corner of his mouth tries to lift and fails; his eyes are on Nib (off panel left) and wet at the rims.
      In the foreground his right hand holds his paper cup, still full and untouched; in that palm, under the cup, one thin amber pulse (#F2A93B), faint:
      Nib is letting the link through. Bulb light; plain navy background.
    calm: none
    notes: "The link pulse appears only when the companion permits it (STORY_BIBLE §5). The only amber in the chapter outside Nib's eyes."

  # ---------------- LATE ----------------
  - id: P49
    shape: vignette
    gap: long
    bg: white
    silent: true
    camera: "wide, eye level from the stair corner, the roof late at night"
    art: >
      Later. The party has burned down: the grill cold, the bottles empty, the lettuce wilting, half the bulbs swaying in a small wind.
      Kwak asleep in the plastic armchair, mouth open, the cane across his knees; Dami tucking her hi-vis porter vest over him like a blanket.
      Sejin and Eunchae stacking plates; Minho and Haein folding stools. On the parapet rail Nib sits alone with his own paper cup, carefully scoring Kett's mark,
      a small three-line fork, into its side with the tip of his knife, about to tuck the cup into his pouch. Taeo, at the table, watches him do it.
      Night roof palette. The edges fade softly into the white page.
    calm: none
    notes: "The worker is saved: Kwak sleeps safe under a porter's vest. Motif: Kett's mark on things Nib cares about (ch 5). He keeps the cup from the toast."

  - id: P50
    shape: wide
    gap: long
    bg: white
    camera: "medium wide on the pavement outside the yard gate, eye level"
    art: >
      The yard gate on the street (ryu_yard_street), sodium-orange streetlight: a plain white taxi at the kerb, Dami helping Kwak into the back seat.
      Eunchae presses a foil parcel in a black plastic bag into Taeo's hands with a stern look; Minho stands in the open gate with his arms folded;
      Nib already waits on the pavement a few steps up the street, facing home. Deep navy shadows. Not: readable taxi signage.
    calm: top
    lines:
      - {who: narr, type: tag, text: "10:41 PM"}
      - {who: eunchae, type: speech, side: l, text: "LEFTOVERS. EAT THEM. DON'T 'IT'S FINE' ME."}
      - {who: minho, type: speech, side: r, text: "YOON. KEEP THE DREAM. GET THE LICENCE FIRST."}
    notes: "Minho's laugh was not cruel; this is his respect in his own language. Seeds ch 47–49 (the licence)."

  # ---------------- THE WALK HOME ----------------
  - id: P51
    shape: full
    gap: long
    bg: white
    camera: "wide, from across the street, the two of them small"
    art: >
      taeo_street at night: low red-brick blocks, gas meters, tangled overhead wires, a parked delivery scooter, a convenience-store sign glowing far up the street.
      Nib walks ahead on the pavement as he always does, binoculars bouncing on his chest, hands loose; Taeo follows a few metres behind with the plastic bag on his wrist
      and the backpack on one shoulder, slower, head down. Sodium-orange pools of light at intervals and navy dark between them. Nobody else on the street.
    calm: top-left
    lines:
      - {who: taeo, type: float, text: "TWELVE MINUTES TO MY DOOR."}

  - id: P52
    shape: inset-l
    gap: short
    bg: white
    camera: "low, in front of Nib as he walks toward the camera"
    art: >
      Nib walks toward the camera without turning his head back, eyes ahead, saying it to the street. Taeo is a small dark shape behind him, simplified, not blurred.
      Streetlight orange across Nib's shoulders and the binoculars.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "MINHO'S WRONG."}
      - {who: "offpanel:taeo", type: speech, side: r, text: "ABOUT THE LICENCE? HE'S RIGHT."}
      - {who: nib, type: speech, side: l, text: "ABOUT THE DREAM. HARD ISN'T STUPID."}
    notes: "Nib defends the dream a second time, in private."

  - id: P53
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up on Taeo's hand at his hoodie pocket"
    art: >
      Taeo's hand in the front pocket of his black hoodie, under the open navy jacket, closing round the folded notepad page; a corner of the paper shows between his fingers.
      Sodium light on the knuckles. Nothing else in frame.
    calm: right
    lines:
      - {who: taeo, type: float, text: "HE TOLD ME TO BE SCARED OUT LOUD."}
    notes: "Callback to ch 19, Nib: 'NEXT TIME, BE SCARED OUT LOUD.'"

  - id: P54
    shape: full
    gap: long
    bg: white
    camera: "side-on at hip height, the pavement running left to right"
    art: >
      Taeo has stopped dead in the cone of a single streetlight, the only light on this stretch. Nib, a few steps further on at the soft edge of the light, keeps walking,
      his back to Taeo, the binocular strap across his shoulder blades. Between them: bare pavement, the kerb, a gas meter on the wall.
      Taeo's face is turned down toward the pocket where his hand is. Sodium orange from straight above, hard shadows straight down, navy beyond.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "NIB."}
      - {who: nib, type: speech, side: r, text: "MM."}

  - id: P55
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up on Taeo under the streetlight, slightly high"
    art: >
      Taeo takes the folded notepad page out of his pocket and opens it under the light with both hands, looking at the page and not at Nib, because that is easier.
      The light falls hard on his hair and the paper; his eyes are in shadow. The plastic bag of leftovers hangs from his wrist.
    calm: left
    lines:
      - {who: taeo, type: speech, side: r, text: "THE INTERFACE KEEPS A LOG."}
      - {who: taeo, type: speech, side: r, text: "LAST NIGHT IT SHOWED ME YOURS."}

  - id: P56
    shape: wide
    gap: short
    bg: white
    camera: "over Taeo's right shoulder: the open page in the foreground, Nib up the street beyond it"
    art: >
      Over Taeo's right shoulder: the open notepad page in his hands, crisp and close, with three lines of pencil handwriting drawn as strokes only (the letterer sets the words).
      Beyond the page, up the street at the edge of the light, Nib's small back; his steps have slowed. Sodium orange; navy dark beyond.
    calm: top
    ui:
      - {kind: label, text: "TRANSFER 0001 — EMERGENCY\nCATEGORY 7\nCONSENT: NOT REQUESTED", at: [0.36, 0.56], size: 34, color: "#3a3d44", rot: -2, notes: "pencil handwriting, the same hand as P02; fit onto the three stroke lines once the art exists"}
    lines:
      - {who: taeo, type: speech, side: l, text: "IT CALLS YOU TRANSFER ZERO-ZERO-ZERO-ONE."}
      - {who: taeo, type: speech, side: l, text: "ROUTE: EMERGENCY."}
    notes: "PAYOFF P01 (part 1 of 2): Nib is told what the log says. The 3 a.m. flicker he saw on his first night (ch 2, '[ARRIVAL LOGGED — CATEG█RY 7]') was this record."

  - id: P57
    shape: inset-l
    gap: short
    bg: white
    camera: "low close-up on Taeo's face from below, the streetlight above him"
    art: >
      Taeo lifts his eyes from the page to Nib's back. His face in the hard top light carries no excuse: scared and saying it anyway, jaw tight, eyes wet, not crying.
      The streetlight's cone above him; plain navy around.
    calm: right
    lines:
      - {who: taeo, type: speech, side: l, text: "THE DRAW THAT BROUGHT YOU..."}
      - {who: taeo, type: speech, side: l, text: "IT DIDN'T ASK YOU."}

  - id: P58
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up on the last line of the page"
    art: >
      Extreme close-up: Taeo's thumb just under the third pencil line on the page, the paper trembling very slightly, sodium light on the graphite.
      Nothing else in frame.
    calm: top
    ui:
      - {kind: label, text: "CONSENT: NOT REQUESTED", at: [0.5, 0.52], size: 46, color: "#3a3d44", rot: -2, notes: "the same handwriting as P02 and P56"}
    lines:
      - {who: taeo, type: speech, side: l, text: "IT SAYS 'CONSENT: NOT REQUESTED.'"}
    notes: "PAYOFF P01: the log line from ch 19 (planted ch 2), told to Nib in the beat's own words."

  - id: P59
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "extreme close-up at pavement level on Nib's feet"
    art: >
      Nib's bare olive-green feet stop mid-stride on the paving stones: the back heel lifted, the front foot planted and still.
      The edge of the streetlight's pool lies on the pavement behind him and his own shadow stretches out ahead of him. Nothing else in frame.
    calm: none

  - id: P60
    shape: tall
    gap: short
    bg: black
    silent: true
    camera: "low, a few metres in front of Nib on the pavement, looking back up the street toward Taeo"
    art: >
      THE HOOK. Read top to bottom. TOP: far up the street, small, Taeo stands alone in the cone of the streetlight with the open white page in one hand,
      very straight, not following. MIDDLE: the long empty stretch of pavement between them, the kerb line, overhead wires, a dark shop shutter, a gas meter: the distance.
      BOTTOM, close and large: Nib (nib, default), stopped, facing us with his back to Taeo. The light is behind him, so his front is in navy shadow;
      his right hand has closed hard on the strap of his binoculars, and the binocular lenses catch two small crisp highlights from a shop sign behind the camera.
      His face: absolute stillness, amber eyes wide and unblinking, jaw set. No tears, no snarl. Nothing has happened yet, and everything has.
      Sodium orange at the top, deep navy everywhere else; the page in Taeo's hand is the brightest white in the frame.
      Not: amber anywhere except Nib's eyes, system windows, rain, other people, any text.
    calm: none
    notes: "Hook (beat: 'the binoculars, the street, the distance between them'). Ch 21 opens here, on Nib's quiet rage."

  - id: P61
    kind: end
