      Cool dawn from left, slate shadows. No link, boots or readable notice.
      Taeo sits on the left and Nib stands on the right. Give Nib his full adult height beside the kerb.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "THE MAN WHO REFUSED THE BLANKET WAS SCARED."}
      - {who: nib, type: speech, side: r, text: "I KNOW."}

  - id: P12
    shape: inset-r
    gap: short
    bg: white
    camera: "close three-quarter on Nib looking up from the cloth"
    art: >
      sinjeong_street. Nib (default) raises his amber eyes to Taeo, a small crease between
      his brows, mouth level; he is neither forgiving on cue nor asking to be defended.
