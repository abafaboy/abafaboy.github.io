chapter: 39
title: Good Work
when: "Dawn after the Sinjeong surge night, directly following ch 38's unfilmed reunion. Brief memories are explicitly earlier that same night. Ends on the kerb without a scene break before ch 40."
story_beats: PART_ONE_BEATS.md#39
cast:
  taeo: outdoors # Navy jacket, black hoodie and cargos, single-white-stripe sneakers; old-patch olive backpack on lap from P06.
  nib: default # Adult, barefoot; model and prop locks below apply even under a blanket.
  orrin: default # Existing shell crack under Sejin's small protective dressing; no loads.
  minho: default # Brown jacket, grey tee, olive cargos, knee pads, boots; grey LEFT-temple streak and LEFT-chest radio.
  sejin: default # Sage scrubs, olive medic rig, charcoal cargos, boots.
  seoryun: default # Olive field jacket, black tee, tactical trousers, boots; LOW ponytail, scar through LEFT brow, hexagonal shield.
  dami: default # Grey hoodie, muted hi-vis vest, olive cargos, worn gloves, cargo straps and scuffed site hard hat.
extras:
  reunited_mother: "Same ch 38 woman, about thirty-five, black bob, beige raincoat over pyjamas, scraped palms."
  reunited_child: "Same ch 38 six-year-old girl, yellow raincoat, striped leggings. Dami carried her earlier."
  blanket_man: "A man in his fifties, thinning dark hair, maroon sweater over a white shirt, dusty trousers, one wrist bandaged."
  refusing_civilian: "A woman in her sixties, short permed hair, grey cardigan, brown trousers, handbag clutched at chest; visibly frightened, capable of walking."
  responder: "A young municipal relief worker, plain blue tabard over grey fleece, clipboard and water carton."
  crews: "Municipal responders, guild field crews, independent survey workers and porters; mixed ages, tired workwear, differentiated tools."
locations: [sinjeong_street, sinjeong_arcade_f]
location_notes:
  sinjeong_street: "Continue ch 34–38: F stairhead NORTH pavement, fourteen steps down SOUTH to outer apron, command tent/casualty bay WEST, main descent farther WEST, broken lightwell EAST. Media barrier away from working area; supply crates at reunification edge, resting crews along kerb. Earth-side, no gate crossing. No key exists."
  sinjeong_arcade_f: "Memory inserts only: earlier in the same night, at the pharmacy/storeroom evacuation route of ch 35–37 before its final collapse. Match that set. Not a new dungeon or surviving passage after ch 38."
prop_locks: >
  Nib: 105 cm adult, wiry and weathered; olive-green skin, amber eyes, V-notch LEFT ear,
  sole lower LEFT fang, pinkish-tan wrap top, charcoal shorts, BROWN rope belt, RIGHT-hip
  pouch with green dinosaur sticker, BROWN WOODEN sheath LEFT hip, bare feet. Matte black
  8x30 binoculars ride high on chest; black woven strap knotted LEFT neck, Kett's fork
  scratched on hinge. Pale-blue ID, folded PAPER drawing and marked cobalt pencil remain
  in pouch. None is given away. Taeo: mole under RIGHT eye; bruised forearms, cleaned but
  faintly stained upper lip after ch 38 nosebleed; no new link use. Cracked dark-grey phone
  with dinosaur sticker remains his. Backpack patch is the faded orange OLD shield-and-door
  design. Seoryun's LEFT-sleeve patch has the CURRENT redesigned door, same emblem family
  and orange thread, with a broader opening and simplified upright jamb. This door difference
  overrides her model card's older matching-patch shorthand. Do not redraw Taeo's patch.
palette_notes: >
  Dawn disaster extension of A4: cool grey-blue daylight, slate shadows, cold portable lamps
  gradually weaker than the sky. Workwear subdued. Earlier-night memories are desaturated
  cooler vignettes under the route's work lamp; no warm nostalgia for abuse. No active
  interface or link colours. Orange patch is faded rust, never amber light. Flat cel shading
  and varied warm near-black ink, no bloom, decorative dust, flare or photographic blur.
  Screens dark unless filled by same-panel UI; all notices, vest tags and rosters blank.

panels:
  - id: P01
    shape: full
    gap: none
    bg: white
    camera: "medium side view continuing the embrace at the reunification crates"
    art: >
      sinjeong_street. Dami (default, nineteen-year-old small wiry adult in dusty porter gear)
      is still caught in reunited_mother's embrace; the yellow-coated daughter holds her
      mother's hem. Dami has finally put one gloved hand on the woman's back, eyes squeezed
      shut for one breath. Folded blankets between their hips. Cameras remain distant and
      turned away. Cold task lamp, first pale blue horizon. No GO FIRST patch, chibi face,
      invented reporter or readable kit.
      Mother is on the left and Dami on the right; crop both from the waist up, child visible between them.
    calm: top
    lines:
      - {who: reunited_mother, type: whisper, side: l, text: "THANK YOU."}

  - id: P02
    shape: tall
    gap: short
    bg: white
    camera: "medium two-shot of Dami and the mother as the embrace eases"
    art: >
      sinjeong_street. Dami (default) stands right of frame, startled into a crooked unguarded
      smile, one glove still on reunited_mother's sleeve. Her scuffed site hat, short low
      ponytail, grey hoodie, cargo straps and muted hi-vis vest remain. Mother at left has
      wet eyes but a steady gaze. Cold-white lamp, desaturated blue-grey background. No
      camera lens, nameplate, new badge or lettering on clothing.
      Mother is on the left and Dami on the right, both faces and relaxed hands visible with room around their bodies.
    calm: left
    lines:
      - {who: reunited_mother, type: speech, side: l, text: "WHAT'S YOUR NAME?"}
      - {who: dami, type: speech, side: r, text: "DAMI."}

  - id: P03
    shape: tall
    gap: short
    bg: white
    camera: "from Nib's height beside the blanket table toward a newly seated civilian"
    art: >
      sinjeong_street. Nib (default, adult, binoculars high on chest, all belt locks, barefoot)
      offers a folded blanket across the supply table. blanket_man recoils on his chair,
      clutching the bandaged wrist to himself, eyes fixed on Nib's skin. A relief worker
      reaches over from beside them. Nib's expression stays professional. Cold lamp and
      pale dawn, slate shadows. No threatening knife gesture, cute anatomy or readable tags.
      Nib stands on the left, the responder in the centre and the seated blanket man on the right.
    calm: top
    lines:
      - {who: blanket_man, type: speech, side: r, text: "CAN SOMEONE KEEP THAT THING AWAY?"}

  - id: P04
    shape: strip
    gap: long
    bg: white
    silent: true
    camera: "extreme close-up of Nib's hand remaining under the offered blanket"
    art: >
      sinjeong_street. Nib's scarred olive-green hand supports the blanket for a beat longer
      than necessary while the relief worker's human hand takes its other edge. His fingers
      have gone rigid without closing. Brown rope belt and RIGHT pouch edge behind, dinosaur
      sticker partly visible. Cold lamp along cloth folds, dawn-blue shadows. No link light,
      new wound, money, readable label or gesture of retaliation.
    calm: none

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 39 · GOOD WORK"

  - id: P06
    shape: full
    gap: long
    bg: white
    camera: "establishing from across the working lane toward the resting kerb"
    art: >
      sinjeong_street at dawn. Taeo (outdoors) sits on the kerb, olive backpack old patch
      outward on his lap. Nib (default) stands beside a water carton; Orrin (default) rests
      near the triage canopy with the small dressing over his shell crack. Minho (default)
      completes a crew roster; Sejin (default) washes her gloved hands at a portable basin.
      Mixed responders continue work behind. Cool grey-blue daylight, cold lamps fading.
      No rebuilt street, readable casualty board, all-gates-clear banner or new uniforms.
    calm: top
    lines:
      - {who: narr, type: tag, text: "SINJEONG STATION · DAWN"}
      - {who: taeo, type: float, text: "I WANTED TO DEFEND NIB. I DIDN'T KNOW WHAT HE WANTED."}

  - id: P07
    shape: tall
    gap: short
    bg: white
    camera: "earlier-night memory, from behind Nib in the pharmacy evacuation lane"
    art: >
      MEMORY, sinjeong_arcade_f before the collapse. Nib (default, all locks and bare feet)
      crouches and offers his back to refusing_civilian, who jerks her handbag away from him,
      face pinched with fear and disgust. Orrin (default) waits farther along the clear lane,
      before the ch 37 shell damage; a work lamp lights pharmacy shelving as blank blocks.
      Desaturated blue-grey, soft vignette edge, no new blood or cute pleading face. No
      present-day intact F, legible medicine boxes or news cameras.
      Nib crouches on the left; the refusing woman stands on the right, with Orrin beyond them.
    calm: top
    lines:
      - {who: narr, type: tag, text: "EARLIER THAT NIGHT"}
      - {who: refusing_civilian, type: speech, side: r, text: "I WON'T BE CARRIED BY A GOBLIN."}
    notes: "Required refusal, recollected after rescue. Flashback stays within the surge night."

  - id: P08
    shape: inset-l
    gap: short
    bg: white
    silent: true
    camera: "memory close-up on Nib's face after the refusal"
    art: >
      Earlier-night sinjeong_arcade_f. Nib (default) holds his crouch, eyes dropping once
      before returning to the exit route. Adult jaw tight; V-notch LEFT ear, lower LEFT
      fang concealed by pressed lips, black binocular strap knot at LEFT neck. Work-lamp
      cold side light, soft-edged desaturated grey-blue behind. Hurt contained rather than
      exaggerated. No tears streaming, childish pout, magical link or readable object.
    calm: none

  - id: P09
    shape: tall
    gap: short
    bg: white
    camera: "memory profile along the evacuation lane as Nib points the way"
    art: >
      Earlier-night sinjeong_arcade_f. Nib (default) rises and points down a safe narrow lane
      with an open hand, letting refusing_civilian walk ahead under a responder's support.
      She keeps her handbag between them. Nib looks toward the next person waiting, doing
      the job anyway. Cold work lamp above, concrete blue-grey and violet shadows. Orrin
      distant, undamaged at this earlier point. No forced carry, moral speech or readable signs.
      Nib stands on the left, pointing along the clear left-hand evacuation lane; the woman and supporting responder walk on the right.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "THEN WALK. KEEP TO THE LEFT."}

  - id: P10
    shape: strip
    gap: long
    bg: white
    silent: true
    camera: "present-day overhead close-up of Nib cleaning the binocular hinge"
    art: >
      Present dawn, sinjeong_street. Nib (default) rubs a clean cloth over the hinge of his
      matte black 8x30 binoculars, still on their shortened woven neck strap. His thumbnail
      pauses beside Kett's scratched three-line fork. Knuckles dusty, pale healed forearm
      scars intact. Dawn blue daylight, hard slate shadow beneath the barrels. No removed
      mark, new inscription, shoe, watery gloss or readable object.
    calm: none

  - id: P11
    shape: tall
    gap: short
    bg: white
    camera: "seated eye-level two-shot of Taeo and Nib at the kerb"
    art: >
      sinjeong_street. Taeo (outdoors) sits left with old-patch backpack on his lap; Nib
      (default) stands right at nearly Taeo's seated eye level, cleaning cloth in hand.
      Taeo starts speaking too quickly, anxious to help; Nib looks at the cloth. Orrin's
