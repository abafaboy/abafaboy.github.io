    calm: left
    lines:
      - {who: nib, type: speech, side: r, text: "HE STILL CHOSE TO CALL ME A THING."}

  - id: P13
    shape: strip
    gap: short
    bg: white
    camera: "tight view of Taeo's face over the top edge of his backpack"
    art: >
      sinjeong_street. Taeo (outdoors) closes his mouth on the next easy reassurance.
      Brown eyes tired, one mole beneath RIGHT eye, dust caught along the hairline, faint
