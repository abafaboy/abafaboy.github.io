    art: "KIT HAND"
    calm: none
    ui:
      - {kind: phone.ttok_chat, on: screen, hand: taeo_left_tilt, title: "Eunchae", messages: [{from: them, text: "News is looping. Are you all out?", time: "DAWN"}, {from: me, text: "All out. Orrin's hurt. Sejin is treating him.", time: "DAWN"}, {from: them, text: "I'll bring breakfast. Actual breakfast.", time: "DAWN"}]}
    notes: "Plain read-and-reply uses kit hand. Eunchae stays off-site and is not assigned a new job. No exact calendar or clock added."

