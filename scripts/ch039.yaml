      Taeo fills the left third; keep his face and backpack edge in the middle band.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "YES. SORRY."}
      - {who: taeo, type: float, text: "I WANTED A REASON THE INSULT WOULDN'T HURT."}

  - id: P14
    shape: tall
    gap: short
    bg: white
