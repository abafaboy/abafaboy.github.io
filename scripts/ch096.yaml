  grandpa: default
extras:
  field_assistant: "Same adult scout as ch94-95: olive field vest, grey trousers, white hard hat, boots, dressed hand cut."
  teacher: "Korean woman about 40, shoulder-length dark hair, pale-blue cardigan, cream blouse and charcoal skirt; quietly protective of the children's occasion."
  school_children: "Four ten-year-old classmates in ordinary muted casual clothes; one small rerun session, not a contest or an elite examination."
locations: [yeoju_gate_b, yeoju_anchor_field, yeoju_bus_stop, intercity_bus, haeseong_port, grandparents_house, haeseong_school_room]
location_notes:
  yeoju_gate_b: "ch94-95 north tooth/upper notch route: Nib is double-belayed across a short physical gap toward the entry. South causeway broken; ordinary survey communication cable severed. Firm entry landing and physical paired knock plates remain."
  yeoju_anchor_field: "Five independent framed door-height gates west-east, depot north, exterior operator canopy southwest, medical shelter south. A/B force transfer remains disconnected for the rest of day one."
  yeoju_bus_stop: "No key: small roadside shelter outside the fenced contest compound, bench, dark timetable panel and one streetlamp. Same stop morning/night; gates lie beyond fence, not in road."
  intercity_bus: "Ordinary drawn coach interior, paired seats and overhead racks. Use night_bus vocabulary for light, not its city-bus floor plan. Yeoju feeder at 05:00; transfer in Seoul to the established three-hour Haeseong coach. Return uses 16:40 Haeseong coach plus Yeoju feeder."
  haeseong_port: "Drawn key wins: northwest roadside bus shelter, land north, sea south, three idle boats, west breakwater southward, door-height sea gate offshore SOUTH with six restriction buoys. Never put sea gate inside harbour."
  grandparents_house: "Key: south courtyard/sliding doors; low central table, north kitchenette, cream fridge northeast, dark TV/cabinet WEST, two-pane east window, five cushions and bowls, three courtyard pots east, bench west."
  haeseong_school_room: "No key. Small ground-floor classroom opened for an afternoon rerun: presentation board east, four child desks in two pairs, three adult chairs west by door, wide south windows. No auditorium or sponsor staging. Haru's cardboard dinosaur board stays blank where labels belong."
continuity_notes: >
  Resolve ch95 before time jump: Haein physically carries words inside; Taeo's two knocks mean come back.
  Nib's protected jump goes toward exit; three knocks after he reaches inside frame mean coming.
  Sera, assistant and Haein follow secured ropes. All leave voluntarily while B boss lives; marks fade outside.
  Taeo never crosses. No further force transfer on day one; monitoring and reassessment permit ordinary bus travel.
  Dara, 42, square weathered face, dark short braid/grey temples, slate plate over oatmeal wrap, scarred forearms,
  LEFT surgical kit and RIGHT cloth roll; her healing does not fix fatigue or erase the rhythm issue.
  Taeo retains forearm bruising, dried/cleaned nosebleed and small lower-lip cut; no miraculous reset.
  Nib adult: LEFT ear notch/lower fang, brown rope belt, RIGHT pouch/dinosaur sticker, LEFT wooden sheath,
  8x30 binoculars/LEFT neck knot/fork hinge; PAPER drawing, pale-blue ID and cobalt pencil secured.
  Ch43 boots remain provisionally dark-brown lace-up ankle boots, rounded toes, low black rubber soles,
  subject to the parallel ch43 final description. Nib does not travel to Haeseong; he meets the returning bus.
  Taeo's olive backpack has the OLD faded orange shield/open-door patch, phone top-left crack and dinosaur sticker.
  Haru 10, cowlick, one missing upper front tooth, yellow dinosaur tee/blue shorts/velcro sneakers; no prodigy treatment.
  Grandma 71 and Grandpa 74; keep existing model outfits. Haru's school rerun is the ch92 promised rest-day event.
  No result, Minho arrival or counterstroke victory is advanced from ch97-98. Final competitive territory is E.
palette_notes: "Rescue: A4 lavender/violet inside and west-daylight slate outside. Early bus: deep blue, hard streetlamp amber; daylight coast cool blue-grey. Grandparents' home: A4 warm amber/brown, steam white. Classroom: pale daylight with warm faces. Night Yeoju: slate/navy and one lamp."
