chapter: 96
title: The Re-run
when: "Close of contest day one; then the rest day, 5:00 AM departure from Yeoju via Seoul to Haeseong, afternoon re-run, 16:40 coach back via Seoul, night arrival at Yeoju. The final contest day follows."
story_beats: PART_ONE_BEATS.md#96
