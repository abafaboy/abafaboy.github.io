chapter: 67
title: Echo
when: Continues ch066 at the night camp, about 21:10, then the scheduled 05:30 dawn descent. Later approach
  and tests lead to 06:31:12. No calendar date fixed; Taeo stays outside.
story_beats: PART_ONE_BEATS.md#67
