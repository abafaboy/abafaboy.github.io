chapter: 84
title: The Co-op
when: "The Haeseong visitors arrive after a three-hour coach journey, on the working day after ch83. The authorised Yeoju survey follows the next day and ends at dusk. No calendar date fixed."
story_beats: PART_ONE_BEATS.md#84
cast:
  taeo: outdoor
  nib: default
  grandma: default # Travelling shoes instead of indoor slippers; otherwise plaid shirt, beige quilted vest, glasses cord.
  coop_chairman: default
  orrin: default
  sera: default # Meeting only: recovering LEFT arm braced and supported; no bow draw.
  kesh: default # Meeting only: resting in Seoul during the survey.
  sejin: default
  haein: default
  minho: default # Survey adviser only; still undecided about Baek, no financial pledge here.
extras:
  fisherwoman: "Co-op delegate, Korean woman about 68, short greying perm, muted teal windbreaker, brown trousers, practical deck shoes; strong knotted hands, shrewd expression."
  fisherman: "Co-op delegate, Korean man about 76, weathered face, navy knit cap, grey-brown work jacket and blue trousers, rubber boots; hearing aid, alert eyes."
  field_attendant: "Adult woman about 40, short black hair, grey site jacket, muted orange safety vest and white hard hat; administers the ordinary survey permit."
locations: [ryu_practice_yard, yeoju_field_rim, yeoju_survey_landing]
location_notes:
  ryu_practice_yard: >
    Canon key: south double gate, southwest grey office, southeast white van facing west, fixed central plywood
    zigzag maze, three north targets, west equipment trestle. Temporary meeting tables and chairs occupy the
    open southern apron without moving a maze wall. Orrin rests between the two table ends, with a clear exit.
  yeoju_field_rim: >
    Unkeyed authorised pre-contract staging margin: grey gravel, sample trestle, muted orange safety mesh and
    one visible scaffold-framed door-height black-violet threshold north of it. White survey cable with blue
    bands every metre enters lower-left frame corner; grey relay tripods every 50 m. Vehicle access south.
    Do not establish ch93's eventual full contest layout. Taeo remains outside throughout. End state matches ch85.
  yeoju_survey_landing: >
    Shallow permitted route inside that single Yeoju gate: pale layered loam-stone shelf beneath a WRONG-COLOUR
    lavender sky, violet shadows, stiff grey-green reeds north, exposed root-salt crusts west and a charcoal field-ore
    seam at the marked southern shelf lip. All three sample points are within the short permitted landing route.
    Far beyond the exclusion stakes a huge living territorial boss moves behind low ridges. No approach or clear.
props:
  nib_locks: >
    Weathered wiry 105 cm ADULT, LEFT-ear V-notch, single lower LEFT fang, pinkish-tan wrap/charcoal shorts,
    BROWN rope belt, RIGHT leather pouch/dinosaur sticker, LEFT brown WOODEN sheath. Matte-black 8x30 binoculars,
    LEFT woven-strap knot and Kett hinge mark; pale-blue ID, folded PAPER drawing and marked cobalt pencil secured.
    EXACT ch43 boots: matte dark-brown ankle-high leather work boots, broad round toes, four pairs of dull
    gunmetal round eyelets, dark-brown round laces in small double knots, black low-heeled lug soles, heel pull tabs,
    oat-grey short socks inside collars; no hooks, buckles, logos, bright trim or visible steel caps.
  taeo_locks: >
    Navy jacket over black hoodie, black cargos, striped black sneakers, RIGHT-eye mole. Old olive backpack with
    faded orange OLD shield/open-door patch, cracked dark-grey dinosaur-sticker phone. Healing forearm recoil
    bruises persist; no new strain test, bleeding or heart diagnosis. No active companion links or new link hues.
  samples: >
    Exactly THREE consumptive-analysis chips, expressly authorised and signed out: reedstone (flat grey-green
    fibrous shard), root salt (opaque off-white branching chip), field ore (heavy charcoal angular chip with
    dull copper-brown grain). All are new kinds for contact window 6. Integrate in that order for +34%, +33%,
    +33%; 0 to 34 to 67 to 100. Each is consumed once, leaving no duplicate or retained integrated fragment.
  deal: >
    Co-op commits ₩90,000,000 as at-risk financing, subject to its documented mandate and final compliant
    paperwork, completing the proposed ₩300,000,000 capital package with the crew's proposed ₩210,000,000.
    The co-op receives 30% of net Yeoju field-sale surplus AFTER extraction costs, agreed wages and treatment.
    No guaranteed yield or capital repayment from a loss; no method ownership or right to assign crew jobs.
    Separate binding undertaking: survey the Haeseong sea gate within TWO YEARS of the agreement. Survey,
    not a promised clear, reopening of fishing grounds or perpetual extraction right. No funds transferred on panel.
continuity_notes: >
  Existing ch43 and ch80 became available before drafting this chapter; the exact boots and previous opening
  are reconciled in this batch. Sera keeps the original protected Ilan letter as well as the opened/reclosed bronze
  cylinder; no new letter information. The independent route remains an application, not an issued guild licence.
  Co-op deal is agreed; final regulatory processing and all actual contest commitments remain ahead. Nib consents
  to this limited survey and testing, not the later ₩210,000,000 stake. ch85 owns Dara's invitation/arrival and PAYOFF P11.
palette_notes: >
  Yard meeting: A4 dusty ochre, warm brown, sky blue, tea cream. Yeoju exterior: cool slate gravel, muted orange mesh,
  dusk blue; gate violet-black/cold-white rim. Interior: wrong lavender sky, violet shadows, muted earth. Integration
  alone brings interface cyan #3FE3F2/deep navy #0B1530. No link amber, decorative motes, bloom or generated lettering.
