chapter: 66
title: Styles
when: "Directly after ch 65's listening hook, then the following day in Seoul. The crew drives to Chungju that afternoon; the ending is at the surface camp that night, before the second full descent at dawn."
story_beats: PART_ONE_BEATS.md#66
cast:
  taeo: outdoors # Navy jacket/black hoodie, black cargos, single-white-stripe sneakers; olive backpack and OLD faded orange shield/open-door patch; one mole under RIGHT eye. Always outside.
  nib: default # Exact ch 43 chosen boots; weathered adult, LEFT ear notch, one lower LEFT fang; brown rope belt, pouch RIGHT/sticker, wooden sheath LEFT, binoculars knotted LEFT.
  orrin: default # Adult, 230 cm long and 135 cm shell height; stacked slate shell, old healed crack a pale seam, no harness or saddle.
  sera: default # River-green/cream wrap outfit, sand cropped trousers, brown ankle boots; LEFT bow/bracer, RIGHT quiver/flute, long dark-brown braid.
  kesh: default # Adult moth-like signal keeper, 198 cm; four folded wing panels, two antennae, two arms/two legs; olive tunic, dark trousers, wrapped shoes, unlit wand.
  minho: default # Brown jacket, grey tee, olive cargos and knee pads, work boots, LEFT grey temple streak/watch, chest radio.
  haein: default # Slate-blue overalls, beige tee, brown tool belt, clear glasses.
  sejin: default # Sage scrubs, olive medic rig, charcoal cargos and practical boots; proper field med case.
  chae: default # Navy cardigan, white blouse, black trousers, ID lanyard with blank badge, blue folio tablet carried closed.
  dr_pyo: default # TV only: mid-grey suit, ivory shirt, sage tie, rimless glasses, salt-and-pepper side part, blank institute badge. Courteous professional, no villain lighting.
extras:
  meridian_lead: "Same ch 63–64 upstream leader: Korean woman about 40, cropped dark hair, broad nose, navy waterproof jacket/plain silver shoulder tab, charcoal trousers, navy helmet, black gloves. At Chungju only."
  reporter: "KNN 24 interviewer, voice through workshop TV only; no drawing required."
locations: [mapo_tyre_base, ryu_van, chungju_gate_site]
location_notes:
  mapo_tyre_base: "Ch 33 tyre-shop compound, matching ch 63–65 featured bay: raised roller shutter, scarred table, tyre racks, task lamp, crew rules on wall, broad forecourt for Orrin. Use earlier key/layout if available, not Taeo's container home."
  ryu_van: "Interior of the grant-bought van from ch 62/63. Do not alter earlier exterior. Crew seats have real belts; ordinary equipment cases strapped to floor, no cargo strapped on Orrin. Kesh's folded wing panels have clear space behind his own seat."
  chungju_gate_site: "Ch 63–64 cutting and service tunnel: scaffold frame/door-height slit, LEFT map canopy and RIGHT medical canopy looking in, grey base station beside frame, van parking in open cutting behind. Temporary camp cot and kettle under the existing canopies, not a new building. Ryu line remains under consortium watch between runs. No one from Taeo's crew crosses in ch 66."
props:
  boots: "Exact ch 43 pair, confirmed at final check: matte dark-brown ankle-high leather lace-ups, broad round toes, four dull gunmetal round eyelet pairs, dark-brown round laces double-knotted small, black low-heeled lug soles and heel pull tabs; oat-grey short socks inside collars. No visible steel cap, hooks, buckles, logo, bright trim or metal plate. Same pair, overrides barefoot sheet."
  old_stones: "Consortium's authenticated survey stills and a paper rubbing of TWO old near-bank signal posts, obtained on first-stage survey. The stone posts themselves stay inside Chungju. Match ch 63 paired sockets/scored channels; distinctive shared detail is a dogleg groove turning underneath the paired socket lip. It is craft style, not alphabetic writing."
  warning: "UPSTREAM TEAM: ROCKFALL AT MARKER 9, HOLD POSITION. Exact recorded voice and wording from ch 63–65. New repeats travel on the intact wired consortium line; no cause solved here."
palette_notes: "A4 workshop extension: ochre/brown, warm task lamp at night, cool daylight next morning. TV has ordinary blue-white studio light; no sinister Pyo palette. Van afternoon muted grey-blue. Chungju night actual white work lamps, concrete grey, violet-black gate rim. No supernatural sky in this chapter, no link or load transfer. Kesh pale lilac #B7A0D3 reserved for a later consenting link, not active."
