chapter: 65
title: A Festival So Loud
when: "The same Seoul evening as ch 64's completion window. Kesh's invitation, arrival and first hours at the Mapo tyre-shop base; no overnight jump."
story_beats: PART_ONE_BEATS.md#65
cast:
  taeo: outdoor # Navy jacket over black hoodie, black cargos, white-stripe sneakers; jacket unzipped at home base. Olive backpack with OLD faded orange patch; one RIGHT-eye mole.
  nib: default # Ch 43 boots; adult, 105 cm, full notch/fang/belt/hip locks, black 8x30 binoculars and LEFT strap knot; right pouch's dinosaur sticker, pencil, ID, paper drawing.
  orrin: default # Adult stoneback, 230 cm long, 135 cm shell height; slate strata, pale old shell-crack seam; no harness or saddle.
  sera: default # River-green wrap, cream sleeves, sand trousers, brown boots; bow/bracer LEFT, quiver RIGHT shoulder, bone flute RIGHT hip, thick brown braid.
  haein: default # Slate-blue overalls, beige tee, tool belt; clear glasses pushed up.
  sejin: default # Sage scrubs, olive medic rig, charcoal cargos, boots; medical case nearby.
  kesh: default # FIRST APPEARANCE, intro P20. Adult male moth-like signal keeper, 198 cm, exact model sheet; never plush or a child.
extras:
  meridian_lead: "Recorded voice only, same upstream leader as ch 63–64, never physically present in Seoul."
  neighbours: "Eight to twelve ordinary adult neighbours and returning shift workers in jackets, a few helmets in hands; no mob, phones all dark or pocketed."
locations: [mapo_tyre_base, mapo_tyre_lane]
location_notes:
  mapo_tyre_base: "Ch 33 tyre-shop compound, use that layout when available. Open workshop bay and broad forecourt for Orrin; scarred worktable, tyre racks, task lamp, crew rules on wall. Clear a 2 m open floor area just inside the raised shutter for the cyan summon circle; broad side passage remains open. No finished key at drafting. Not Taeo's Ryu-yard container home."
  mapo_tyre_lane: "No separate key; lane immediately outside the compound's forecourt gate. Low workshops and brick villas, one streetlamp, ordinary evening pedestrian flow, distant plain bus-stop shape. Keep it attached to the same open forecourt; no teleport to a festival."
props:
  boots: "Exact ch 43 pair, confirmed at final check: matte dark-brown ankle-high leather lace-ups, broad round toes, four dull gunmetal round eyelet pairs, dark-brown round laces double-knotted small, black low-heeled lug soles and heel pull tabs; oat-grey short socks inside collars. No visible steel cap, hooks, buckles, logo, bright trim or metal plate. Same pair, overrides barefoot sheet."
  kesh_wand: "Small plain unlit signal wand, dark wood with a forked dull-metal head, held in RIGHT hand initially; a craft tool, not a glowing combat staff. Match details sheet."
  recordings: "Haein's ordinary grey field recorder holds the real warning and later repeated transmissions from ch 63–64; physical playback through its speaker. No magical live hearing across hundreds of kilometres."
palette_notes: "A4 workshop extension: warm task-lamp brown/ochre, blue-grey evening shadow. Summon alone replaces this with cyan #3FE3F2/deep navy #0B1530. Lane sodium peach and blue-grey, never link amber. Kesh grey-brown/olive model colours remain muted; no glitter. His eventual link colour reserved here as pale lilac #B7A0D3, NOT activated in this chapter."
panels:
  - id: P01
    shape: strip
    gap: none
    bg: navy
    camera: "extreme close on Taeo's empty left palm, private window light falling across it"
    art: >
      mapo_tyre_base, immediately after ch 64: taeo's LEFT palm is empty, the last cyan ring
      fading, navy cuff at the wrist and old recoil bruise farther up. Two empty sample
      compartments below. Hard cyan from the completion window off frame, deep navy shadows,
      warm task lamp at edge. No reed iron, written numerals, amber link or scar from integration.
      Only Taeo's palm and the sample tray are shown; he speaks from off-frame left.
    calm: top
    lines:
      - {who: "offpanel:taeo", type: "speech", side: "l", text: "SORRY. I DON'T KNOW IF THE INVITATION LETS ME REQUEST A SPECIALITY."}
  - id: P02
    shape: wide
    gap: short
    bg: navy
    camera: "across the sample table toward Sera putting her bow aside"
    art: >
      sera, default at mapo_tyre_base, lays her LEFT-hand bow flat away from the cleared floor,
      keeping the string undrawn, then looks at taeo with one level brow. Bone flute on RIGHT
      hip, quiver RIGHT shoulder, braid over river-green tunic. Cyan private-window key on
      her face, brown worktable with navy shadows. No nocked arrow, candidate menu or magical selection wheel.
      Sera's head and shoulders occupy the right third; her bow and the tabletop remain visible below.
    calm: top
    lines:
      - {who: "sera", type: "speech", side: "r", text: "THEN ASK WHOEVER ANSWERS. THEY CAN TELL YOU WHAT THEY DO."}
  - id: P03
    shape: tall
    gap: short
    bg: white
    camera: "close three-quarter on Nib beside the open side passage"
    art: >
      nib, adult default with binoculars at mapo_tyre_base, moves a stool out of the broad
      side passage. V-notch LEFT ear, one lower LEFT fang, brown belt, RIGHT pouch and LEFT
      wooden sheath all retained; chosen boots planted square. His expression is dry and
      certain. Warm task lamp returns at frame edge, cool blue-grey shadow. No locked door or cute face.
      Nib is fully visible in the left third beside the stool and the unobstructed passage.
    calm: right
    lines:
      - {who: "nib", type: "speech", side: "l", text: "DON'T BLOCK OUR GUEST'S WAY OUT."}
  - id: P04
    shape: tall
    gap: short
    bg: white
    camera: "high diagonal down on the crew clearing a circle of floor"
    art: >
      mapo_tyre_base: taeo in navy jacket and haein in slate overalls move chairs clear of an
      open patch of concrete inside the shutter; sejin slides a folded mat within reach but
      outside it. orrin watches from broad forecourt, no blocked exit. Everyone acts like
      hosts preparing for an adult guest. Warm lamp, brown/ochre and blue-grey. No cyan floor
      circle yet, chalk ritual, restraints or obvious medical emergency.
    calm: none
    silent: true
  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 65 · A FESTIVAL SO LOUD"
  - id: P06
    shape: tall
    gap: long
    bg: navy
    camera: "over Taeo's right shoulder into clear air above the table"
    art: >
      taeo, navy jacket/black hood at mapo_tyre_base, lifts his RIGHT fingertip toward empty
      upper air reserved for the contact window. His face in profile is determined and wary.
      nib and sera beyond keep their eyes on him, not his invisible UI. Cyan key, deep navy
      surround, task lamp as small warm edge. No generated letters, portrait slot filled with
      Kesh early, physical monitor or candidate shopping list.
    calm: top
    ui:
      - {kind: system.window, on: float, headline: "[CONTACT WINDOW 5 OPEN]", body: "[INVITATION ONLY]\n[ROUTE ALIGNMENT 0%]", button: "[SEND INVITATION?]", at: [0.5, 0.07], tilt: -6}
    sfx:
      - {text: "DING", style: summon, at: [0.86, 0.12], size: M, rot: 0}
    notes: "Window 5 opens and meter resets. No skill-selection mechanic introduced. Invitation may be refused or time out."
  - id: P07
    shape: strip
    gap: short
    bg: navy
    camera: "macro side view of Taeo's finger pressing the invitation plane"
    art: >
      mapo_tyre_base, taeo's RIGHT index presses a small cyan plane while his other fingers
      curl naturally, navy cuff visible. At the back of frame the clear side passage stays
      open. Interface cyan hard key, deep navy and faint warm concrete edge. No written
      button, blood, amber pressure pulse, drawn glyphs or physical summon before consent.
    calm: none
    sfx:
      - {text: "TAP", style: quiet, at: [0.71, 0.58], size: S, rot: 0}
  - id: P08
    shape: full
    gap: short
    bg: navy
    camera: "front on Taeo speaking toward the empty air, crew behind him"
    art: >
      taeo, outdoors at mapo_tyre_base, speaks with hands open and shoulders held politely
      straight, trying not to sound like a recruitment advert. sera stands back, river-green
      and attentive, while nib rests one hand on the moved stool. Cyan contact key with
      navy shadows, lamp-brown floor. No visible addressee, face in a screen or public UI.
      Taeo stands at left, Sera at centre behind him, Nib at right by the stool.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "HELLO. I'M YOON TAEO. WE'RE LOOKING FOR SOMEONE WHO KNOWS RIVER SIGNALS."}
      - {who: taeo, type: speech, side: l, text: "YOU CAN SAY NO."}
  - id: P09
    shape: inset-r
    gap: long
    bg: navy
    camera: "close on Taeo listening, his mouth half open after the greeting"
    art: >
      taeo at mapo_tyre_base, navy collar/black hood, waits with raised brows and a small
      awkward smile, single mole under RIGHT eye. His hand lowers to leave space for an
      answer. Cyan from upper left, deep navy background. No countdown clock, visible
      silhouette, telepathic glow in his palm or moving lips for the other voice.
      Taeo's listening face is at left; the unseen contact voice comes from empty air off-frame right.
    calm: left
    lines:
      - {who: "offpanel:kesh", type: "phone", side: "r", text: "RIVER SIGNALS? OH. WHICH RIVER? HAS SOMEONE LOST CONTACT?"}
    notes: "Kesh's unseen voice is heard through the contact channel, hence phone. Delighted curiosity before arrival, not a command response."
  - id: P10
    shape: full
    gap: short
    bg: navy
    camera: "profile two-shot, Taeo repeating Sera's information toward the channel"
    art: >
