    calm: top
    lines:
      - {who: "offpanel:kesh", type: "phone", side: "l", text: "YOU HAVE PEOPLE THERE WHO'D LISTEN TO A SIGNAL KEEPER?"}
      - {who: "sera", type: "speech", side: "r", text: "REAL PEOPLE. MOSTLY IMPATIENT."}
