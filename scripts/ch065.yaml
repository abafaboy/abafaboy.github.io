      Medium two-shot: Taeo stands at left and Sera at right; both faces and the paper still are visible.
    calm: top
    lines:
      - {who: "sera", type: "speech", side: "r", text: "THE CHUNGJU RIVER GATE. STONE CEILING. OLD SIGNAL POSTS. A WARNING KEEPS REPEATING."}
      - {who: "taeo", type: "speech", side: "l", text: "THE CREW DENIES SENDING THE WARNING. WE NEED HELP LISTENING."}
  - id: P11
