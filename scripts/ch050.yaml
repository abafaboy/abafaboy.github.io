chapter: 50
title: Standardized
when: "Morning after the public draw: prototype tests at the Ryu yard, then exhibition venue check-in and pre-event preparation later that morning. Ends at the opening horn of the standardized timed match. No calendar date fixed."
story_beats: PART_ONE_BEATS.md#50
cast:
  taeo: outdoor # Jacket open at yard test, fastened again for venue; stays outside course.
  nib: default # Ch043 chosen boots and complete established scout kit.
  orrin: default
  sera: default
  haein: default
  sejin: default
  minho: default
  park_doyun: default
  sunline: default
  bangbang: default
extras:
  event_marshal: "Woman about 40, cropped brown hair, pale-grey event polo and navy trousers, whistle and clipboard, no faction badge."
  camera_operator: "Man about 30 in slate utility vest, shoulder camera, padded earphones, concentrating on his shot rather than deliberately bullying."
  camera_assistant: "Young adult woman, cream windbreaker, folded reflector and a coiled cable, keeps following the camera operator too closely."
  sunline_manager: "Woman about 40 in tailored beige blazer, practical trainers, dark tablet kept facing her, white stopwatch on wrist."
  constructs: "Doyun's same SEVEN nonverbal ivory-grey articulated frames from ch049: faceless wedge heads, slate joints, five-fingered hands and split flat feet; no luminous cores, new weapons or individual faces."
locations: [ryu_practice_yard, exhibition_concourse, exhibition_aerial_bay, exhibition_course]
location_notes:
  ryu_practice_yard: "Canonical keyed set. Prototype test at west trestle; padded pendulum clamped to a portable frame beside it, not attached to maze walls. No gate."
  exhibition_concourse: "Broad pavilion concourse adjoining ch049 draw foyer: glass roof trusses, north doors to course, east credential desk, wide west equipment access. Pale flooring, blank hanging banners, low cable ramps."
  exhibition_aerial_bay: "Separate west warm-up enclosure visible through concourse mesh: tall bare launch tower, padded perimeter, hanging practice rings, inspected safety net below. Sunline's record course is beyond it, not used for a record attempt yet."
  exhibition_course: "Indoor paired lanes, south start to north finish: A WEST for Doyun, B EAST for Taeo. East/west operator boxes OUTSIDE their lane rails, equal sightlines and open sides, one stool and fixed safety-stop button each. Five identical stations per lane in order: offset corner walls; padded swinging counterweight; hinged deck; three target switches controlling exit shutter; final zigzag to cargo cradle. One orange cargo cylinder travels from south start to north cradle; all active entrants finish behind north line. Identical dimensions/timing, maximum seven active bodies per lane, no output handicap. Seven constructs vs three consenting companions is permitted; no gate, dungeon sky, return marks or boss. Standard timed match ranks completion time, separate from adaptive elimination event."
props:
  boots: "Nib's ch043 pair: matte dark-brown ankle-high leather lace-up work boots, broad round toe, four pairs of dull gunmetal round eyelets, dark-brown round laces in small double knots, plain black lug soles/low heel, heel pull tabs, oat-grey short socks inside collars. No hooks, buckles, logos, bright trim or visible steel caps."
  orrin_shell: "Preserve the existing ch037 shell injury and any subsequent established repair; this chapter adds no damage and does not heal it by omission."
  reservoir: "NEW P14 prototype: hand-sized rectangular dull-steel housing, split copper retaining band, small ivory ceramic inspection window, two capped coupling ports, short grey webbing hand strap. Analogue white indicator tab rises against a mechanical slot when temporarily charged and drops as pressure leaks. No screen, digital timer, runes or luminous cyan battery. Built for bounded mechanical LOAD SHARE input/output, never heat or electricity; not yet approved for event use. Haein retains it off course."
  nib_locks: "Adult 105 cm, weathered angular face; LEFT V-notch, single lower LEFT fang, brown rope belt, RIGHT pouch/dinosaur sticker, LEFT brown wooden sheath. Ch043 chosen boots match exactly. Matte-black 8x30 binoculars, black woven strap knot LEFT neck, Kett fork hinge; pale-blue ID, cobalt fork-marked pencil, folded PAPER drawing in pouch."
  taeo_locks: "ONE mole under RIGHT eye, olive backpack with OLD faded orange shield/open-door patch, top-left-cracked dark-grey dinosaur phone. Existing carrying bruises remain; padded low-load test gives no new injury."
palette_notes: "A4 yard ochre/warm brown/sky blue; venue adaptation of AAO institutional blue-white/slate with navy rails. Sunline's white and muted gold stay material colours, never amber link effects. Cyan reserved for private operator UI; Nib amber and Orrin slate-green only in Taeo's RIGHT palm. All signs/boards/tags blank in art; event lettering with labels. Screens dark or turned away except same-panel composited UI."
