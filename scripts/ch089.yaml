chapter: 89
title: Two Thresholds
when: "After ch 88's contest-format notice; the next supervised test morning, through early afternoon. No absolute date fixed."
story_beats: PART_ONE_BEATS.md#89
cast:
  taeo: outdoors
  nib: default
  orrin: default
  kesh: default
  dara: default
  sejin: default
  haein: default
  park_doyun: default
locations: [ryu_practice_yard, relay_test_site]
location_notes:
  ryu_practice_yard: "Drawn key wins: south vehicle gate, southwest grey container, southeast white van facing west, fixed plywood zigzag maze and three north targets. No actual gate in this yard."
  relay_test_site: "New unkeyed licensed training site, separate from Ryu yard. Two existing E-grade gates in bolted scaffold frames face south across a level concrete apron, A west and B east, six metres apart. Each opens onto a separately surveyed shallow stone vestibule; deeper routes are cordoned, bosses remain alive and remote. A has pale stone beneath a wrong lavender sky; B has dark slate beneath a wrong green sky. No connecting passage. Operator chair midway outside, medical cot behind it to south, instrumentation table east, water table west. Bolted steel knock plates beside both rims. White survey cable, blue band every metre, grey relay tripods every 50 m; separate paired flat grey force-coupler clamp plates. No modified Venn anchors used."
continuity_notes: >
  ch088.yaml was absent at drafting: begin on its contest-format hook from the beats, not a new contest announcement.
  Nib is an adult 105 cm scout: LEFT ear V-notch, one lower LEFT fang, brown rope belt,
  RIGHT pouch with green dinosaur sticker, LEFT brown wooden sheath, matte black 8x30 binoculars,
  black woven strap knotted LEFT at neck, Kett's three-line fork on hinge. His pale-blue ID,
  folded PAPER watch-post drawing and cobalt pencil with pink eraser and carved fork stay inside the pouch.
  Ch043 appeared during final checking: use its matte dark-brown ankle-high leather boots, broad round toes,
  four pairs of dull gunmetal round eyelets, dark-brown round laces in small double knots, heel pull tabs,
  black lug soles/low heels, oat-grey short socks inside collars. No hooks, buckles, logos or visible steel caps.
  Taeo's mole stays under RIGHT eye; old orange shield/open-door patch on olive backpack;
  dark grey phone, top-left crack, green dinosaur sticker. Prior forearm bruising and irregular rhythm persist.
  Only Nib/amber and Orrin/slate-green channels are active, both shown separately in Taeo's RIGHT palm.
  Kesh advises on timing without opening his own link. No restored ch60 reservoir. No healing of fatigue or arrhythmia.
palette_notes: "A4 yard: dusty ochre, warm brown, sky blue. Test apron: muted concrete and blue-grey daylight; gate interiors lavender or green with violet shadows. Medical scene keeps the same light, no magical cleansing. Cyan reserved for operator UI; red only for the medical alert. Hard cel shadows, drawn backgrounds, no haze."
