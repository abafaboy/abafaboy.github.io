chapter: 70
title: Sponsor
when: Same dawn descent, about 06:55–06:58. Camp TV replays an overnight Seoul Assembly first-reading
  report; no trip to Seoul and no new calendar date. Registry filing is under existing provisional rules.
story_beats: PART_ONE_BEATS.md#70
