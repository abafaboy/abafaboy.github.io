chapter: 48
title: Spec
when: "After ch 47's evening at the Ryu yard: the following weeks of written-exam preparation, then written-exam morning and its afternoon result; practical check-in on the next scheduled assessment morning. No calendar date or weekday fixed."
story_beats: PART_ONE_BEATS.md#48
cast:
  taeo: outdoor # Navy jacket over black hoodie, black cargos, single-white-stripe sneakers; jacket off for study and written exam.
  nib: default # Ch043 chosen boots throughout; all established scout props retained.
  orrin: default
  sera: default
  minho: default
  eunchae: default
  park_doyun: default
extras:
  academy_tutor: "Woman about 40, neat short hair, charcoal suit, cream blouse, lapel microphone, practised reassuring smile."
  candidate_hood: "Young adult man, washed maroon hoodie, cheap navy document wallet, bitten nails; anxious rather than hostile."
  candidate_vest: "Young adult woman, new slate tactical vest, narrow braid, expensive laminated study tabs; proud of her preparation."
  invigilator: "Middle-aged man, navy AAO cardigan, pale-blue shirt, soft-soled shoes, plain clipboard."
locations: [ryu_practice_yard, awakened_cram_academy, aao_exam_hall, aao_practical_hall]
location_notes:
  ryu_practice_yard: "Follow locations/ryu_practice_yard keys: south double gate, southwest grey office container, southeast white van, fixed plywood zigzag and three north targets. Taeo's ch028 residential container is separate; its open doorway is shown only in close crops, with the established three crew rules on blank paper for lettering. Do not turn the keyed office into his bedroom."
  awakened_cram_academy: "New unkeyed upstairs classroom: west street windows, east projection board, two ranks of folding desks separated by central aisle; vending alcove at rear south stair door. Narrow pavement below has blank academy placards."
  aao_exam_hall: "New room in the AAO building, not Chae's keyed office: north wall clock, east high windows, spaced single grey desks, south double doors, front collection table. Navy seats and blank green exit plaques."
  aao_practical_hall: "New ground-floor AAO gym: south double entrance, operator rail along east wall, grey padded floor with a central lane, north equipment doors. Blue-white overhead strips, high west daylight. No dungeon gate."
props:
  boots: "Nib's ch043 pair: matte dark-brown ankle-high leather lace-up work boots, broad round toe, four pairs of dull gunmetal round eyelets, dark-brown round laces in small double knots, plain black lug soles/low heel, heel pull tabs, oat-grey short socks inside collars. No hooks, buckles, logos, bright trim or visible steel caps."
  orrin_shell: "Preserve the existing ch037 shell injury and any subsequent established repair; this chapter adds no damage and does not heal it by omission."
  nib_locks: "Adult 105 cm scout; LEFT-ear V-notch, one lower LEFT fang, brown rope belt, RIGHT pouch with green dinosaur sticker, LEFT brown wooden sheath. Ch043 chosen boots, identical to that chapter; no barefoot regression. Matte-black 8x30 binoculars high on chest, black woven strap knotted LEFT of neck, Kett fork scratched on hinge. Pale-blue ID, folded PAPER watch-post drawing, cobalt pencil with carved fork remain in pouch."
  taeo_locks: "ONE mole below RIGHT eye; olive backpack with faded orange OLD shield-and-open-door patch; dark-grey phone with top-left hairline crack and green dinosaur sticker. Residual forearm bruises from carrying, no fresh injury this chapter."
palette_notes: "A4 yard dusty ochre/warm brown/sky blue; evening study uses one warm practical lamp and blue-grey shadow. Academy and AAO adopt A4 institutional blue-white/slate/navy. All generated boards, papers, tags and signs blank; readable matter only ui.label. Screens dark unless filled by same-panel UI. Flat cel colour, warm near-black varied contours; no bloom, photographic blur or decorative particles."
