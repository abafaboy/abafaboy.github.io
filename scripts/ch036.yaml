chapter: 36
title: My Map Is Wrong
when: "Same surge night, directly after ch 35's radio admission. The bypass opens, then the street cordon fails. No date or absolute clock is added."
story_beats: PART_ONE_BEATS.md#36
cast:
  taeo: outdoors # navy jacket, black hoodie/cargos, striped sneakers, OLD orange-patch olive backpack; RIGHT-eye mole
  nib: default # adult barefoot; LEFT notch/fang, brown belt, RIGHT stickered pouch, LEFT wooden sheath; matte black binoculars/LEFT strap knot
  orrin: default # adult slate carrier; intact shell through this chapter
  minho: default # brown jacket, grey tee, olive cargos/knee pads, LEFT grey streak/radio/watch
  haein: default # slate-blue overalls, beige tee, bob, glasses/tool belt
  sejin: default # sage scrubs, olive medic rig, charcoal cargos
  seoryun: default # live and archive; olive jacket/black tee, low ponytail, LEFT brow scar, physical hex shield; CURRENT door emblem in live scene
extras:
  pharmacist: "Same woman about 50, cream cardigan and short perm, key ring on wrist; ten pharmacy civilians remain with her initially."
  office_man: "Same frightened man about 40, grey office shirt, loosened navy tie."
  last_child: "Four-year-old boy, about 95 cm, cropped black hair, dusty blue padded jacket, grey leggings, socked feet. Both shoes lost in the evacuation; the single blue trainer with white heel at F is a possible match. Quiet from shock."
  reunited_child: "Six-year-old girl, black bob, muted yellow raincoat, striped leggings and white sneakers; holding mother's sleeve."
  reunited_mother: "Woman about 35, chin-length black hair, beige raincoat over pyjamas, scraped palms; able to walk, increasingly breathless from smoke."
  stockroom_adults: "Two shop assistants in plain grey aprons and a delivery rider in brown windbreaker, all able to walk."
  ryu_crew: "Established two workers, orange vests/white helmets, torches, white blue-banded cable and grey relay tripods."
  reporter: "Man about 30, cropped brown-black hair, charcoal press vest over pale blue shirt, tablet in rugged black case, bulky camera bag. Useful but too focused on a familiar story."
  archive_vice: "Seoryun's unnamed vice-captain in last year's clip; adult woman about 30, tied-back dark hair, practical olive rescue kit, side profile. Do not identify her as Kang, who is not this footage's subject."
  cordon_team: "Adult GMA responders, grey/navy field kit, helmets and physical shields."
  hounds: "Three charcoal-grey, hound-shaped dungeon predators, lean angular bodies, too-long forelegs and blunt bony brows; no collars, wings or human faces."
locations: [sinjeong_pharmacy, sinjeong_stockrooms, sinjeong_arcade, sinjeong_f_stair, sinjeong_street, archive_rescue_site]
location_notes:
  sinjeong_pharmacy: "Ch 35 set: EAST public shutter, NORTH counter, SOUTH bench, WEST rear stockroom door. The ten remaining pharmacy civilians retreat here from blocked T."
  sinjeong_stockrooms: "No drawn key. Pharmacy WEST door opens into low stockroom, blank medicine cartons on NORTH shelves. Its NORTH shared service door opens to clothing stockroom with wheeled rails of bagged coats. Six new civilians shelter behind those rails. At clothing room's EAST end a push-bar exit opens to a narrow dogleg, running NORTH then EAST to F NORTH of the new stone wall. Smoke is drawn toward that functioning exhaust/exit, giving Nib a physical clue."
  sinjeong_arcade: "F/T obstruction stays put. Original blue-banded cable survives below it. Ryu workers lay a bypass cable loop from existing relay through the stockrooms; radio remains available. No dungeon threshold is crossed, hence no new return marks."
  sinjeong_f_stair: "14 steps SOUTH down from NORTH pavement. Steel door at bottom, EAST hinge, opens against landing EAST wall. Taeo's base at street top WEST railing. Blue shoe/white heel on trestle. Final attack is at TOP street opening, no change of door position."
  sinjeong_street: "North casualty bay/command tent WEST of F; press normally SOUTH. Reporter is allowed near NORTH base briefly, then moved behind a barrier. Secondary street threat comes from one of the SAME seven gates: its expanded mouth reaches a collapsed lightwell EAST of F. GMA defensive cordon breaks; Ryu's radio cable does NOT break."
  archive_rescue_site: "Last year's tablet footage only: anonymous grey gate-site underpass, concrete columns, olive rescue crew and barriers. Desaturated cool flashback palette with olive as remembered colour. No real location, named victim or Kang identification."
