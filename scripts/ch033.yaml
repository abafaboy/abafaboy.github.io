chapter: 33
title: Surplus
when: "The morning after the Terrace clear, then the following week. Lease and move happen during that week; Eunchae's second-practical result and the Sinjeong alert land at the final evening meal. No calendar date is lettered."
story_beats: PART_ONE_BEATS.md#33
cast:
  taeo: outdoor # Navy jacket over black hoodie, black cargos, black low sneakers with one white stripe. Jacket off inside his new room. Mole RIGHT eye. Old orange shield-and-open-door patch on olive backpack. Forearm recoil bruises persist, fading through the week; no active nosebleed.
  nib: default # Adult, barefoot, LEFT ear V-notch and one LEFT lower fang. Pinkish-tan wrap, charcoal shorts with repaired RIGHT outer thigh, brown rope belt, RIGHT pouch with dinosaur sticker, LEFT brown wooden sheath. Matte black 8x30 binoculars with LEFT neck knot and Kett's hinge mark. Site hard hat has been returned to the kit rack.
  orrin: default # Adult, 230 cm long and 135 cm shell height, terraced slate shell intact, four columnar legs, three blunt nails each, grey-olive adult face. No brace outside work, no saddle or pet accessories.
  minho: default # Brown work jacket, grey tee, olive cargos, black knee pads, brown boots, LEFT grey streak, chest radio, LEFT wristwatch. Independent Ryu Survey lead.
  haein: default # Slate-blue overalls, beige tee, brown tool belt, jaw-length black bob, glasses on crown.
  sejin: default # Sage scrubs, olive medic rig, charcoal cargos, boots, cropped black hair. Paid safety officer, dinner guest at the new base.
  seonhee: default # 55, Ryu bookkeeper; fully described at P03, follow current turnaround.
  dongsik: default # 58, wheelchair user; fully described at P13, follow current turnaround.
  eunchae: default # Brown high ponytail, cream rolled-sleeve shirt, grey-green work vest with blank tag, black trousers, black-and-white canvas shoes, tabbed food-hygiene workbook. Arrives after her shift.
  sunline: default # Printed billboard only, P32; white-gold battle outfit, chestnut ponytail, charcoal-shaft spear. No physical appearance or new nameplate.
extras:
  dispatch: "GMA emergency dispatcher, voice on Taeo's phone only; clear, clipped, working through a call list."
locations: [ryu_practice_yard, tyre_shop_base, world_cup_ro]
location_notes:
  ryu_practice_yard: "Use locations/ryu_practice_yard/key_wide.png and key_reverse.png: chain-link south vehicle gate, grey corrugated office southwest, fixed central plywood maze, north targets, west equipment trestle. The repossessed vans are absent now; do not restore the key's parked van. Office doorway close-ups may show the accessibility ramp added for Dongsik; do not reconfigure the maze. Taeo's ch 28 container home remains at the yard until the move."
  tyre_shop_base: "New, no drawn key. Old tyre-shop compound in a Mapo gate zone: south double metal gate, cracked concrete court, a single-storey former repair bay along the north, two separate lockable back rooms off its east corridor, small washroom and sink at the corridor end. West lean-to shed opens directly onto the court, clear height and width ample for Orrin. Low solid workshop roof is NOT load-rated for him. His dry sleeping mat goes under the shed; no roof garden yet. Tyre rack and disconnected lift stay inert at the bay's back. Dinner trestle goes in the court beside the shed; short removable board ramp over the bay threshold accommodates Dongsik. Blank old fascia remains blank; no guild name yet."
  world_cup_ro: "Use ch 3 P27's north-side seven-storey building and banner frame across the top three floors, on the avenue by Mangwon station. This is the SAME frame, reskinned for Sunline's new sponsor. Daylight, plane trees now leafier, shop signs blank."
money_notes: >
  The east CREW'S net settlement is exactly ₩38,000,000 after the entry fee and contracted costs;
  do not deduct the ₩2,000,000 entry fee again. Equal beneficial ownership is one third each.
  Since integer won do not divide by three, each receives ₩12,666,666 cash and the remaining
  ₩2 stays jointly owned, equally, with no extra won assigned to Taeo. This is explicit in P10.
  All three later choose to contribute ₩10,000,000 each to the ₩30,000,000 refundable lease
  deposit and ₩200,000 each to the first month's ₩600,000 rent. Deposit ownership remains
  equal, the lease names all three. Each retains ₩2,466,666 before personal purchases; ₩2
  joint remains separate. The earlier ₩40,000,000 advertised yard deposit is remembered;
  this shop's owner accepts a smaller deposit against higher monthly rent, not a gift or loan.
  Ryu Survey's separate central proceeds make a posted ₩120,000,000 Bluebird principal payment:
  the locked ₩310,000,000 balance falls to ₩190,000,000. Central gross is not specified.
palette_notes: "A4 yard dusty ochre, warm brown shadows and sky blue. Office and new rooms: muted daylight cream with cool blue-grey shadows; evening court: warm work-lamp amber/brown with steam white, following A4 kitchen. World Cup-ro: pale daylight and blue-grey shadows, banner's navy/white/gold accent. Alert red appears only at the final emergency. No interface windows or active link this chapter. Flat cel colour, hard shadows, no haze, bloom or decorative particles; all signage, forms and tags blank until lettered."

panels:
  - id: P01
    shape: narrow-r
    gap: none
    bg: white
    camera: "kit phone hand, straight-on settlement notification"
    art: "KIT HAND"
    calm: none
    ui:
      - {kind: phone.info_card, on: screen, hand: taeo_right_front, title: "RYU SURVEY · EAST TERRACE", text: "NET CREW SETTLEMENT\n₩38,000,000\nEntry and contract costs settled"}
    sfx:
      - {text: "DING", style: phone, at: [0.19, 0.24], size: M, rot: -8}
    notes: "Cold open. Next morning after ch 32's handshake. This is the crew's total, not Taeo's personal share; amount is net, entry fee already accounted for."

  - id: P02
    shape: inset-l
    gap: short
    bg: white
    camera: "close on Taeo at the Ryu office table, looking over his phone"
    art: >
      Taeo (taeo, outdoor, one mole under RIGHT eye) sits at the grey office container's
      folding table at ryu_practice_yard. He holds the dark grey phone below his chin,
      cracked top-left glass turned away, dinosaur case visible. ACTING: the polite smile
      has frozen because the number feels mistaken; eyebrows lift, mouth slightly open.
      Bruised forearms rest on the table, no active nosebleed. Cool morning doorway light,
      cream office and blue-grey shadows. No restored bruises, rich-man fantasy or drawn words.
      Taeo fills the left third in a face-and-shoulders crop.
    calm: right
    lines:
      - {who: taeo, type: speech, side: l, text: "SORRY. IS THERE AN EXTRA ZERO?"}

  - id: P03
    shape: tall
    gap: short
    bg: white
    camera: "eye-level medium two-shot across the ledger, both faces visible"
    art: >
      Ryu Seonhee (seonhee, 55, 162 cm, practical Korean bookkeeper with strong Ryu brows,
      angular cheeks, warm brown eyes, dark low bun grey at the temples, thin reading
      glasses down for the ledger, pencil behind LEFT ear) sits opposite Taeo at
      ryu_practice_yard's office table. Moss-grey cardigan over cream rolled-sleeve work
      shirt, slate trousers, scuffed brown shoes. She taps a blank ruled settlement page,
      sharply patient but pleased. Daylight from the open door, cream and cool slate shadows.
      Calculator screen dark; no legible figures, forms, nametags or floating interface.
      Seonhee sits on the left and Taeo on the right. Include both faces and the ledger between them.
    calm: top
    lines:
      - {who: seonhee, type: speech, side: l, text: "I CHECKED THE SETTLEMENT TWICE. THAT'S THE TOTAL FOR ALL THREE OF YOU."}
      - {who: taeo, type: speech, side: r, text: "PLEASE CHECK ONCE MORE."}

  - id: P04
    shape: tall
    gap: short
    bg: white
    camera: "table-height three-shot, Nib placing three plain saucers in a row"
    art: >
      At the ryu_practice_yard office doorway, Nib (nib, adult default, binoculars and
      full belt locks, barefoot) puts three mismatched empty saucers along the table edge,
      practical rather than ceremonial. Taeo (taeo, outdoor) is seated behind them;
      Orrin's (orrin, default) adult face appears through the open doorway, his body
      safely outside. ACTING: Nib flatly certain, Taeo still blinking, Orrin curious.
      Cool morning daylight, cream tabletop, brown shadows. No coins yet, no written names or screens.
      Nib stands in the left third; seated Taeo is on the right and Orrin is centred beyond the doorway. Leave room for natural proportions.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "THREE SHARES."}

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 33 · SURPLUS"

  - id: P06
    shape: tall
    gap: short
    bg: white
    camera: "medium three-shot across the settlement table, Seonhee in profile"
    art: >
      Taeo (taeo, outdoor) at ryu_practice_yard turns his dark phone face-down and points
      once to each saucer. Nib (nib, default with binoculars, LEFT notch and full locks)
      stands at the table's end, chin lifted to meet him. Orrin remains at the open door,
      visible beyond Nib, not squeezed inside. ACTING: Taeo nervous but decided, Nib
      testing whether the words will hold. Cool daylight from doorway, pale wood and
      slate-blue shadows. Ledger spaces blank, no imaginary banknotes or generated lettering.
      Seonhee sits on the left in clear profile, Nib stands in the centre and Taeo sits on the right. Keep all faces readable.
    calm: top
    lines:
      - {who: taeo, type: speech, side: r, text: "ONE THIRD OF THE SETTLEMENT EACH."}
      - {who: seonhee, type: speech, side: l, text: "NO EXTRA SHARE FOR THE OPERATOR?"}
      - {who: taeo, type: speech, side: r, text: "WE EACH DID THE PART THE OTHERS COULDN'T."}

  - id: P07
    shape: inset-r
    gap: short
    bg: white
    camera: "close on Nib, table light reflected under his eyes"
    art: >
      Nib (nib, adult default) at ryu_practice_yard considers Taeo off frame, eyes narrowing
      before the lower lids soften a fraction. LEFT notch clear, one lower LEFT fang,
      binoculars matte black at his chest with LEFT strap knot. His hands rest on the
      edge of the table rather than clutching the money saucer. ACTING: approving without
      making a performance. Morning daylight, cream and blue-grey, hard cel shadow under
      the brow. No cute proportions, gold shine, currency or words in the art.
      Nib fills the right third in a head-and-shoulders crop.
    calm: left
    lines:
      - {who: nib, type: speech, side: r, text: "EQUAL IS GOOD."}

  - id: P08
    shape: tall
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag, Orrin's proposed denomination"
    art: >
      CHIBI comedy at the now-safe settlement. Chibi Orrin (orrin, identical stacked-slate
      shell, grey-olive skin, three blunt nails per foot) points his chin toward a
      ludicrously tall pile of plain soil sacks in his imagination. Chibi Taeo (taeo,
      outdoor, backpack's old orange patch) stares up with a huge calculator-shaped
      sweat drop; chibi Nib (nib, all locked props and binoculars, barefoot) inspects
      one sack seriously. Flat pale ochre screentone replaces ryu_practice_yard; morning colour.
      No prices, banknotes, decorative glow or letters on sacks.
      Orrin occupies the left, Nib the centre and Taeo the right. Keep the imagined soil stack above them without compressing bodies.
    calm: top
    lines:
      - {who: orrin, type: speech, side: l, text: "I'D LIKE MINE IN SOIL."}
      - {who: taeo, type: nervous, side: r, text: "TWELVE MILLION WON OF SOIL?"}
      - {who: nib, type: speech, side: c, text: "HE COUNTS SLOWLY."}

  - id: P09
    shape: tall
    gap: short
    bg: white
    camera: "normal style, low from the doorway toward Orrin in the yard"
    art: >
      Back to normal. Orrin (orrin, default) rests outside the ryu_practice_yard office,
      the grey corrugated wall beside his intact shell. Taeo (taeo, outdoor) crouches
      within the doorway, not climbing on him. Nib (nib, default, binoculars and belt
      locks) leans against the jamb. ACTING: Orrin slow, dry, wholly serious about the
      garden; Taeo's startled expression loosens into a real smile. Morning sun from
      southeast, dusty ochre and brown shadows. No brace, soil mountain or written sign.
      Orrin is on the left, Nib at the centre jamb and crouching Taeo on the right.
    calm: top
    lines:
      - {who: orrin, type: speech, side: l, text: "PERHAPS A BAG FIRST. THE ROOF CAN WAIT."}
      - {who: taeo, type: speech, side: r, text: "ONE BAG I CAN MANAGE."}

  - id: P10
    shape: full
    gap: short
    bg: white
    camera: "top-down over the final distribution ledger and two tiny coins"
    art: >
      The office table at ryu_practice_yard: Seonhee's moss-grey sleeve and five-fingered
      hand hold a ruler under three equally sized blank ledger rows. Two tiny plain
      aluminium coins rest in a fourth shallow joint-expense dish; the three personal
      saucers are equally spaced. Taeo's black sleeve and Nib's scarred hand sit at
      opposite edges, hands relaxed now. Cool doorway light, cream paper, blue-grey
      shadows. Leave the ledger face unobstructed. Coin values and ledger figures stay
      blank; calculator dark. The payout itself is electronic, not a pile of cash.
    calm: top
    ui:
      - {kind: label, text: "EQUAL OWNERSHIP: 1/3 EACH\nCASH: ₩12,666,666 EACH\n₩2 REMAINDER: JOINT, EQUAL SHARES", at: [0.5, 0.40], size: 30, notes: "Set on the blank ledger, keeping both coins clear."}
    lines:
      - {who: taeo, type: float, text: "I'D NEVER HAD TO WORRY ABOUT TWO WON LEFT OVER."}
    notes: "Exact thirds of ₩38,000,000 are fractional won. Equal cash payments total ₩37,999,998; ₩2 stays jointly and equally owned. No rounding bonus to the operator. Saucer/coin image is bookkeeping, not a cash payout of millions."

  - id: P11
    shape: narrow-l
    gap: long
    bg: white
    camera: "kit phone hand showing Ryu's separate central debt payment"
    art: "KIT HAND"
    calm: none
    ui:
      - {kind: phone.bank_transfer, on: screen, hand: taeo_pov_ots, to: "BLUEBIRD CAPITAL · RYU SURVEY", amount: "₩120,000,000", text: "CENTRAL SETTLEMENT · PRINCIPAL PAYMENT POSTED\nBALANCE: ₩310,000,000 → ₩190,000,000"}
    notes: "Seonhee shows Taeo the posted receipt on his phone. Ryu's central proceeds are separate from the east trio's ₩38,000,000. New continuity decision: ₩120,000,000 pays principal, ₩190,000,000 remains; central gross and interest schedule unstated."

  - id: P12
    shape: full
    gap: short
    bg: white
    camera: "front close-medium on Seonhee, the ledger suddenly beyond her control"
    art: >
      BIG REACTION at the ryu_practice_yard office table. Seonhee (seonhee, 55, default
      moss cardigan and cream shirt, low grey-templed bun, reading glasses) stares down
      at the receipt, then covers her mouth. Tears spill before she can tidy them away;
      shoulders shake, glasses slip, pencil stays behind LEFT ear. Her free hand presses
      the blank ledger flat as if work could contain it. Daylight from the open door,
      cream and cool slate. No comic tear rivers, debt collector, readable paper or gloss.
      Seonhee fills the left third, framed from the waist up.
    calm: top
    lines:
      - {who: seonhee, type: speech, side: l, text: "THE DEBT WENT DOWN."}
      - {who: seonhee, type: whisper, side: l, text: "WE OWE LESS. AFTER ALL THIS TIME."}

  - id: P13
    shape: full
    gap: short
    bg: white
    silent: true
    camera: "side view across Seonhee to Dongsik arriving beside her chair"
    art: >
      Ryu Dongsik (dongsik, 58, broad-shouldered Korean man with square jaw, strong Ryu
      brows, short dark hair strongly grey at temples, brown eyes, clean shaven, weathered
      large hands) rolls beside Seonhee at ryu_practice_yard's office. Old brown survey
      jacket, grey-beige shirt, olive-grey trousers, brown shoes; muted sage lap blanket.
      Real manual steel-grey wheelchair: two large spoked rear wheels with hand rims,
      two front casters, twin footplates, black seat and worn grips. He offers a folded
      handkerchief, eyes wet but mouth steady. Seonhee is still crying. Doorway daylight,
      cream/slate shadows. No standing Dongsik, hospital gear, chibi or words.
    calm: none

  - id: P14
    shape: tall
    gap: short
    bg: white
    camera: "medium group view at wheelchair height with all three speakers visible"
    art: >
      Dongsik (dongsik, default, seated in the same manual wheelchair) faces Seonhee
      (seonhee, moss cardigan, reading glasses) at ryu_practice_yard. She grips the
      handkerchief in one hand and has forgotten the pencil still behind her LEFT ear.
      Minho (minho, default brown jacket, LEFT grey streak) stands behind her with
      Haein (haein, overalls, jaw-length bob), his hand lightly on his mother's chair
      back. ACTING: tenderness without anyone making a speech. Morning doorway light,
      cream and slate; all paper blank, no returned vans, standing father or readable screens.
      Dongsik sits on the left, Seonhee in the centre and Haein stands on the right; Minho stands behind Seonhee. Show their faces.
    calm: top
    lines:
      - {who: dongsik, type: speech, side: l, text: "YOU CAN PUT THE PENCIL DOWN."}
      - {who: seonhee, type: speech, side: c, text: "I CAN'T FIND MY PENCIL."}
      - {who: haein, type: speech, side: r, text: "WE'LL FIND IT AFTER."}

  - id: P15
    shape: tall
    gap: long
    bg: white
    camera: "outside the office, level two-shot of Minho and Taeo"
    art: >
      At the grey container outside ryu_practice_yard, Minho (minho, default, LEFT grey
      streak) stands beside Taeo (taeo, outdoor, RIGHT-eye mole). Behind the open door,
      the family's shapes remain together at the table; keep their faces private.
      Minho looks toward his mother, then to Taeo, shoulders finally lower. Taeo holds
      the phone by his side, bruises still visible below cuffs. Morning sun southeast,
      ochre ground and warm brown shadows. No triumphant poses, collector, equipment
      magically returned or readable signs.
      Minho stands on the left and Taeo on the right with comfortable headroom.
    calm: top
    lines:
      - {who: minho, type: speech, side: l, text: "NEXT JOB, WE EACH TAKE A ROUTE AGAIN."}
      - {who: taeo, type: speech, side: r, text: "NEXT TIME, I PACK A BETTER LUNCH."}
      - {who: minho, type: speech, side: l, text: "GOOD. YOU'RE LEARNING."}
    notes: "Minho remains an independent professional and rival, now treating the east trio as a crew worth working alongside. Debt is reduced, not erased."

  - id: P16
    shape: full
    gap: long
    bg: white
    camera: "establishing from the south gate across the fixed Ryu yard"
    art: >
      ryu_practice_yard follows key_wide: southwest grey office, west equipment trestle,
      central staggered plywood maze and north targets, chain-link perimeter. The old
      southeast van parking spot is empty after repossession. Taeo (taeo, outdoor) steps
      out beside Nib (nib, default and full locks); Orrin (orrin, default) waits where
      the court is broad enough, Haein's dismantled brace on the trestle behind him.
      ACTING: relief gives way to a practical new question as Taeo turns toward them.
      Morning southeast sun, ochre/brown and sky blue. No extra vans, altered maze or lettering.
      Nib is on the left, Orrin in the centre distance and Taeo on the right.
    calm: top
    lines:
      - {who: taeo, type: speech, side: r, text: "CAN WE GO LOOK AT A PLACE TO LIVE?"}
      - {who: nib, type: speech, side: l, text: "WE CAN LOOK."}

  - id: P17
    shape: full
    gap: long
    bg: white
    camera: "new location establishing from the south gate into the tyre-shop court"
    art: >
      tyre_shop_base in midday light, a day later. Through the open south double metal
      gate, cracked concrete leads to a north repair bay, disconnected lift and empty
      tyre rack at the back. East corridor opens to two back-room doors; west lean-to
      shed has a dry floor and generous clear span. Blank faded fascia above the bay.
      Taeo (taeo, outdoor), Nib (nib, adult default, binoculars and belt locks) and Orrin
      (orrin, default) stand in the court with Seonhee (seonhee, moss cardigan, glasses).
      ACTING: cautiously assessing. Daylight cream, cool slate shadows, sky blue; no active gate,
      roof garden, business name, new guild emblem or readable sign.
      Seonhee stands at the left gatepost; Nib is centre-left, Taeo centre-right and Orrin on the right.
    calm: top
    lines:
      - {who: narr, type: tag, text: "MAPO GATE ZONE · THE NEXT DAY"}
      - {who: seonhee, type: speech, side: l, text: "TYRE SHOP. TWO BACK ROOMS. THAT SHED'S INCLUDED."}

  - id: P18
    shape: tall
    gap: short
    bg: white
    camera: "down the east corridor, Nib testing one back-room door"
    art: >
      tyre_shop_base east corridor, seen along its length toward the small washroom and
      sink. Nib (nib, default, full locked props and binoculars, barefoot) opens one
      room door from inside and looks at its ordinary latch with grave professional
      interest. The second room's separate closed door is visible behind him, not
      connected through his room. ACTING: the prospect of privacy almost startles him.
      Daylight from the court, cream plaster and cool blue-grey shadows. No numbered
      rooms, wall slogans, furnished luxury or drawn lettering.
      Nib stands in the right third; show his entire adult body and both room doorways.
    calm: left
    lines:
      - {who: nib, type: speech, side: r, text: "SEPARATE DOORS."}

  - id: P19
    shape: narrow-l
    gap: short
    bg: white
    camera: "kit phone hand showing the lease offer, Seonhee standing beyond the left edge"
    art: "KIT HAND"
    calm: none
    ui:
      - {kind: phone.info_card, on: screen, hand: taeo_left_tilt, title: "TYRE-SHOP COMPOUND · REVISED OFFER", text: "Advertised deposit ₩40,000,000\nAgreed deposit ₩30,000,000\nHigher monthly rent: ₩600,000 · Fixed term: 12 months"}
    lines:
      - {who: "offpanel:seonhee", type: speech, side: l, text: "THE OWNER AGREED TO A SMALLER DEPOSIT AND HIGHER RENT."}
    notes: "Remembers ch 22's ₩40,000,000 deposit barrier. This is a negotiated lease, no magical purchase or cancellation of the gate-zone housing problem. It costs ₩30,000,000 deposit plus ₩600,000 per month."

  - id: P20
    shape: tall
    gap: short
    bg: white
    camera: "court-level three-shot, Taeo lowering himself to speak to both companions"
    art: >
      At tyre_shop_base Taeo (taeo, outdoor) squats carefully on the court, phone away,
      facing Nib (nib, default and full locks) and Orrin (orrin, default). The two
      back-room doors and broad shed occupy opposite background edges. Taeo's bruised
      forearms rest on his knees, he does not hide them from his partners. ACTING:
      he wants this badly and makes himself ask plainly. Midday light from the south,
      pale concrete, cream walls, slate shadows. No signed papers yet, forced smiles,
      cyan link, property ownership certificate or readable fascia.
      Nib stands on the left, Orrin occupies the centre and Taeo squats on the right, leaving natural room for all three.
    calm: top
    lines:
      - {who: taeo, type: speech, side: r, text: "WOULD YOU EACH PUT TEN MILLION WON INTO THE DEPOSIT?"}
      - {who: taeo, type: speech, side: r, text: "RENT IS TWO HUNDRED THOUSAND EACH PER MONTH. ONLY IF YOU WANT TO LIVE HERE."}
    notes: "Ask-first motif becomes a concrete financial choice. He does not commit their equal shares before consent. Each keeps ownership of one third of the refundable deposit."

  - id: P21
    shape: tall
    gap: long
    bg: white
    silent: true
    camera: "low behind Orrin beneath the lean-to, following his gaze to its roof beams"
    art: >
      Orrin (orrin, default) walks under tyre_shop_base's west shed roof and stops on
      its dry concrete, checking overhead clearance with his eyes rather than ducking
      on command. Intact slate shell clears the beams comfortably; no cargo or brace.
      The higher workshop roof is visible beyond, inaccessible to him. ACTING: a long
      still look at the ceiling, guarded hope in heavy adult eyes. Midday court light
      enters from the east, cream concrete and cool slate shadows. No garden, plants
      on his shell, cute face, harness or lettering.
    calm: none

  - id: P22
    shape: tall
    gap: short
    bg: white
    camera: "from within the shed looking out at Taeo and Nib"
    art: >
      Orrin (orrin, default) stands beneath the tyre_shop_base lean-to in foreground,
      turning his adult face toward Taeo (taeo, outdoor), who remains in the court
      beside Nib (nib, adult default and all locks). A plain wall and stationary beam
      frame the empty sleeping area. ACTING: Orrin asks one serious condition, Taeo
      answers without a salesman smile. Midday light across the court, cool slate
      shed shadow, muted cream. No vehicle bed, cage, feed bucket, roof garden or words.
      Orrin is in the left foreground, Nib stands in the centre and Taeo is on the right outside the shed.
    calm: top
    lines:
      - {who: orrin, type: speech, side: l, text: "I SLEEP IN THIS SHED? NOT ON A TRUCK?"}
      - {who: taeo, type: speech, side: r, text: "HERE. THE SHED STAYS PUT."}
      - {who: orrin, type: speech, side: l, text: "THEN YES."}

  - id: P23
    shape: inset-l
    gap: short
    bg: white
    camera: "eye-level close-up of Nib looking toward the unsigned lease"
    art: >
      Nib (nib, default) at tyre_shop_base looks down at the blank lease held by Seonhee
      just out of frame. His hand rests on the pouch at his RIGHT hip, where the
      pale-blue ID is safely stored, dinosaur sticker on flap; wooden sheath remains
      LEFT and binoculars high on chest. ACTING: practical suspicion easing into a
      decision, not gratitude for permission. Midday side light, muted cream and slate
      shadows. No newly invented signature, glowing ID, cute proportions or readable paper.
      Nib fills the left third, head and shoulders visible. Taeo stands beyond the right edge; Seonhee holds the lease below frame.
    calm: right
