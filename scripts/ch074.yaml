chapter: 74
title: There Was No Knock
when: The dawn survey begun at the end of ch 73, continuing without a time jump except a brief explicitly
  tagged equipment-check memory.
story_beats: PART_ONE_BEATS.md#74
cast:
  taeo: outdoor
  nib: default
  orrin: default
  kesh: default
  minho: default
  haein: default
extras:
  upstream_lead: 'Continue ch070/ch073: adult Korean woman about 35, close braid, navy Meridian field
    gear, white helmet, LEFT shoulder radio.'
  consortium_medic: 'Continue ch073: stocky Korean man about 45, short salt-and-pepper hair, teal vest
    over grey shirt, olive square medical pack, white helmet.'
  survey_crew: 'Continue ch073: stocky adult man and short-haired adult woman, dusty orange vests, white
    helmets, survey rods and cable reel.'
props:
  nib_boots: 'Exact ch043 pair: matte dark-brown ankle-high leather lace-up work boots, broad round toe,
    no visible steel cap; four pairs of dull gunmetal round eyelets; dark-brown round laces in small double
    knots; plain black lug soles, low heel, heel pull tab; oat-grey short socks just inside collar. No
    logo, hooks, buckles, bright trim or exposed metal plate.

    '
locations:
- chungju_river_inside
- chungju_river_gate
location_notes:
  topology_lock: 'ch070 master view: entry landing downstream; right-bank survey shelf runs upstream,
    current toward landing. At marker 9, A is LEFT stepped dry shelf and B RIGHT low water-covered shortcut
    past split pillar. Local waterward-left descriptions are relative to the right-bank approach, not
    an A/B swap. Muted lilac mineral seams fill hard white survey lamps. The metal frame has an exposed
    tapping plate.

    '
  chungju_river_inside: 'Continue ch071-73 skyless cavern: entrance landing, right-bank high dry shelf,
    Channel B waterward left under low lip, triage alcove above. This chapter maps a lower return spur
    under the entry shelf, visible from the first-sector bend; its mouth appears to shorten the way back
    to the landing but is undermined by water. It is not the real threshold. A higher right-bank detour
    reconnects to the landing. Keep the continuous stone ceiling, no sky, white survey lamps and violet
    shadows. First-sector action remains close enough to the entrance for the physical brace knocks to
    be heard on the landing.

    '
  chungju_river_gate: 'Continue ch071 canopy, radio table, scaffold-braced slit, gravel access lane. Ryu
    white cable with blue bands every metre stays connected across the threshold, grey tripod relay every
    50 m with white lamp, speaker grille and coiled handset. Haein pays out slack when the inside party
    reroutes it.

    '
continuity_notes: 'Nib adult and wiry, LEFT V-notch, one lower LEFT fang, brown rope belt, RIGHT pouch/dinosaur
  sticker, LEFT brown wooden sheath; matte black 8x30 binoculars high on chest, LEFT strap knot, Kett
  hinge mark; pale-blue ID/PAPER drawing/cobalt pencil protected in pouch; exact ch043 boots, no footwear
  redesign. Kesh adult 198 cm, narrow grey-tan face, dark eyes, TWO feather antennae, FOUR folded grey-brown
  wing panels, olive tunic, dark trousers, wrapped shoes, unlit wand. His radio clips to his sash, not
  his wings. Taeo''s single RIGHT-eye mole, old orange door patch and cracked dinosaur phone stay locked.
  No new link colours, interface claims or medical permission. Sera and Sejin remain at Chungju hospital
  offstage. Eight inside: Nib, Orrin, Kesh, Minho, Meridian lead, consortium medic and two Ryu workers.

  '
palette_notes: 'A4 gate palette adapted to no sky: ink water, violet slate, hard white portable lamps;
  grit red only for physical hazard annotation in lettering. Outside dawn grey-blue and navy. No windows
  this chapter, no cyan decoration, photographic blur, god rays, bloom, readable signs or generated lettering.

  '
