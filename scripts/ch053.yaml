chapter: 53
title: Bank and Release
when: "From the practice-lane decision at the end of ch 52, through the next day's drills, to the exhibition bracket posting that evening. No calendar date fixed."
story_beats: PART_ONE_BEATS.md#53
cast:
  taeo: outdoor
  nib: default
  orrin: default
  sera: default
  haein: default
  sejin: default
  minho: default
locations: [ryu_practice_yard, exhibition_service_corridor]
extras:
  official: "Adult exhibition attendant, grey polo, slate trousers, headset, blank credential; posts the bracket, no dialogue."
location_notes:
  ryu_practice_yard: "Keep the drawn keys: southwest grey office container, southeast west-facing white van, south double gate, fixed central plywood maze and north target fence. Portable padded drill rig in the open lane west of the maze, never rebuild the maze between cuts. Haein's west equipment trestle holds the reservoir and external meter. Arrow backstop uses the existing north targets; no shot toward the street or crew."
  exhibition_service_corridor: "Same cream-concrete under-stand service passage as ch 52, practical white strips, wide equipment doors, loading daylight at one end and controlled public barrier. Bracket noticeboard on public side."
props:
  nib_locks: "Adult 105 cm; LEFT-ear V-notch, sole LEFT lower fang, pinkish-tan sleeveless wrap, charcoal shorts, brown rope belt, RIGHT pouch with green dinosaur sticker, LEFT brown wooden sheath. Exact ch 43 boots: matte dark-brown ankle-high leather lace-up work boots, broad round toes, four pairs dull gunmetal round eyelets, dark-brown round laces in small double knots, plain black lug soles/low heel, heel pull tabs, oat-grey short socks inside collar; no hooks, buckles, logos or bright trim. Never barefoot. Matte-black 8x30 binoculars high on chest, LEFT-neck strap knot, Kett fork on hinge. Pale-blue ID, folded PAPER post drawing and cobalt-blue fork-marked pencil secured in pouch."
  taeo_locks: "Navy jacket, black hoodie/cargos, black single-white-stripe sneakers; RIGHT-eye mole. Olive backpack with faded orange OLD shield/open-door patch on the operator chair. Dark-grey top-left-cracked phone with green dinosaur sticker. Existing faint forearm bruises include ch 51's RIGHT inner pressure stripe; a new small RIGHT lateral forearm bruise develops at P20, reported immediately. No nosebleed."
  reservoir: "Exact ch 50 geometry: hand-sized dull-steel rectangular body, split copper band, ivory ceramic inspection window, two capped coupling ports, short grey webbing hand strap, white analogue indicator tab in mechanical slot. RIGHT palm in strap at input, LEFT hand at manual release; housing has no screen. Temporarily banks a bounded slice of mechanical impact, leaks at 0.8 seconds, finite capacity, intact. Haein can service contacts but does not solve leakage. External meter readouts use label UI. No operator window is invented for engineering timer. Official inspection for adaptive competition occurs at P48."
  drill: "Freestanding hinged padded arm, grey foam head, mechanical spring and Haein's hand release; no autonomous attack. Nib holds a small strapped grey shield pad on his LEFT forearm. Orrin pushes a low wheeled wooden sled into a foam-faced hinged shutter; shutter's opening exposes a target to Sera at the north backstop. The release supplements Orrin's same-direction push. Sera's arrow is separately timed, not force-linked."
palette_notes: "A4 yard: dusty ochre, warm brown, sky blue, ordinary sunlight. Late session uses one cream work lamp and cool blue-grey dusk. Venue: A4 blue-white/slate under practical strips. Amber Nib pulse in Taeo's RIGHT palm, Orrin slate-green, neither a beam. Mechanical motion uses drawn strokes. Flat cel shadows, no bloom, haze, decorative sparks, readable signs or green screens without UI."
