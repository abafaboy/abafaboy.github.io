chapter: 43
title: The Year the Door Didn't Open
when: "Friday afternoon continues ch 42, then Friday night. Main flashback: nine years earlier, Taeo 14 and Haru 1; Seogang departure, collapse, funeral, and one week after funeral in Haeseong. Present returns Saturday morning, after Nib heard the story the night before."
story_beats: PART_ONE_BEATS.md#43
cast:
  taeo: default # present: black hoodie, black cargos, striped sneakers outside; ONE mole RIGHT eye; recoil forearms; olive bag with old orange patch
  nib: default # barefoot until fitting; chooses P47, pays P48; boots worn permanently from P49 onward
  grandpa: default # present 74; memory 65, less stooped, salt-and-pepper hair under same kind of faded blue cap
  grandma: default # memory 62, less grey, red/navy plaid blouse, cream quilted vest, glasses; no present appearance
  taeo_young: default # FOURTEEN, school blazer, white shirt, slate tie, grey trousers; single RIGHT-eye mole; use teenage sheet
  taeo_father: default # memory only, about 45; cheap khaki porter vest, blue-grey work shirt, grey cargos, yellowed helmet
  taeo_mother: default # memory only, about 42; sage blouse, beige apron, brown-grey headscarf, charcoal skirt, leggings, low work shoes
  haru: flashback_one_year # ONE YEAR OLD ONLY, use infant reference in taeo_young/details.png; sage-beige overalls, ivory shirt, black hair tuft
  seoryun: default # archival broadcast only, nine years younger; OLD open-door shield patch, never current redesign
  sejin: default # present P02 only; paid safety officer
extras:
  shop_owner: "Camping-store owner from ch 19: about 65, sun-browned and upright, short grey crew cut, visor pushed up, cobalt-blue hiking jacket, grey hiking trousers, trail shoes, whistle lanyard, pencil behind RIGHT ear."
  market_vendor: "Woman about fifty, short practical perm, maroon padded vest over plain grey top, work apron; runs a small market notions stall."
  newsreader: "KNN 24 news voice only; never a live person at the camp."
  response_operator: "Anonymous relief desk operator, heard over the corded phone only; tired and constrained, not villainous."
  funeral_guest: "Older neighbour in plain dark clothes, background only, no named role."
locations: [ryu_practice_yard, yoon_family_home_past, seogang_waiting_room, funeral_hall, grandparents_house, haeseong_market, camping_store]
location_notes:
  ryu_practice_yard: "Keep keyed south gate, southwest grey office, southeast van, central maze and north targets. Taeo's separate home container is shown in close frames only: plain corrugated grey exterior, single door and low step; inside low folding table, lamp, bedding, shelf with family photo. Never replace the yard office with his home."
  yoon_family_home_past: "No key. Small rented home nine years ago, narrow tiled entry facing low kitchen table and one small north window; parents' work bag by door, baby blanket at table. Do not reuse Taeo's later 18 m² studio."
  seogang_waiting_room: "No key. Community relief room outside the Seogang cordon, plain chairs along wall, thermos table, one box TV on high bracket, entrance glass showing response vehicles beyond. No family member goes inside a gate."
  funeral_hall: "No key. Modest joint memorial room, two framed portrait stands side by side, white flowers, plain visitor table, closed doors at rear. No body or graphic injury shown."
  grandparents_house: "Follow drawn wide/reverse keys: south courtyard doors, north kitchenette, east window, low table centre, TV cabinet on WEST wall, bedding northwest. Nine years ago TV is a small box CRT on that cabinet, not today's flat screen."
  haeseong_market: "No key. Narrow covered market lane, faded fabric roofs and simple notions stall with patch cards on a pegboard, all blank in art. An ordinary purchase, not an official rescue-team shop."
  camping_store: "Match ch 19: faded dark-green awning, glass door LEFT and display window RIGHT; deep narrow interior with boot wall LEFT, jacket racks RIGHT, glass counter at BACK, small TV above counter dark. Khaki, tan and warm wood, cobalt owner's jacket."
props:
  boots: "Nib's chosen first shoes: matte dark-brown ankle-high leather lace-up work boots; broad round toe, no steel cap visible; four pairs of dull gunmetal round eyelets, dark-brown round laces tied in small double knots; plain black lug soles with low heel, heel pull tab, no logo, hooks, buckles, bright trim or exposed metal plate. Oat-grey short socks just inside collar. Same pair thereafter, never generic black combat boots. Price ₩68,000, paid in Nib's cash, no discount or gift."
  nib_gear: "LEFT ear notch, single LEFT lower fang, brown rope belt, RIGHT pouch with dinosaur sticker and ID/paper drawing/marked cobalt pencil; LEFT wooden sheath; high matte black 8x30 binoculars, LEFT strap knot and fork-marked hinge."
  patch: "Cheap faded-orange embroidered shield with OLD OPEN door, slightly crooked border stitching and frayed lower corner. Knock-off bought by Grandpa at market; retained as the current olive-backpack patch. No GO FIRST design."
palette_notes: "Memory: A4 desaturated cool blue-grey, soft-edged panel borders, one restrained warm person accent at a time, never full sepia. Parents' remembered hands can carry warm ochre skin. TV cyan-white is ordinary screen light, not interface cyan. Present yard: ochre/brown; container night: lamp orange/blue-grey; shop: khaki/tan with cobalt jacket. No chibi during grief."
