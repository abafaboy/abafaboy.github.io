chapter: 71
title: Channel B
when: "The consortium's second descent, immediately after ch 70. The rescue takes minutes; no calendar date established."
story_beats: PART_ONE_BEATS.md#71
cast:
  taeo: outdoor # Navy jacket over black hoodie, black cargos, one-stripe sneakers; stays OUTSIDE throughout.
  nib: default # The boots he chose in ch 43, never barefoot; retain that chapter's exact design.
  orrin: default
  sera: default # LEFT bow arm injured here; right arm intact.
  kesh: default
  sejin: default
  haein: default
  minho: default
props:
  nib_boots: >
    Exact ch043 pair: matte dark-brown ankle-high leather lace-up work boots, broad round toe,
    no visible steel cap; four pairs of dull gunmetal round eyelets; dark-brown round laces in
    small double knots; plain black lug soles, low heel, heel pull tab; oat-grey short socks
    just inside collar. No logo, hooks, buckles, bright trim or exposed metal plate.
locations: [chungju_river_gate, chungju_river_inside]
location_notes:
  chungju_river_gate: >
    Follow the now-available ch070 exterior: fenced river maintenance cutting, gravel, bolted steel
    rim frame with exposed tapping plate, folding operator table facing the slit, Haein base station
    left and Sejin first-aid canopy right; command trailer and dark TV behind. Ambulance access behind it.
    Ryu's white cable, blue band every metre, enters at the brace's foot. Grey relay tripods every 50 m,
    with white lamps, speaker grilles and coiled handsets, maintain the radio connection through the threshold.
  chungju_river_inside: >
    No drawn key available. Underground river beneath a continuous stone ceiling; NO SKY.
    Follow ch070 topology: landing DOWNSTREAM; the dry right-bank shelf follows the cable UPSTREAM.
    Current flows back toward the gate. At marker 9 a split pillar separates A (LEFT narrow stepped
    dry shelf) and B (RIGHT low water-covered shortcut). Sera begins on the dry B lip with Nib behind
    her holding the existing safety rope, Orrin braced at the cap, Kesh beside the open old relay fork.
    The waterward LEFT edge of this local right-bank approach is the attack angle, not a swap of A/B.
    The central staging shelf has a higher dry triage alcove; this adds no new channel. Portable white survey lamps key
    the slate stone; reflected violet gate light replaces A4's wrong-colour sky. The river is ink-dark.
continuity_notes: >
  ch070 was absent when drafting began and was read on completion: its last ten story panels and end
  now govern the topology, 06:58-ish opening, active south/upstream rescue problem and Sejin starting outside.
  Sejin crosses physically during P25 after the upstream party verifies A. Both stranded teams withdraw
  along A behind this rescue; no unmentioned workers are left with the predator (P25/P48).
  All Nib panels use adult proportions, LEFT ear notch and single lower LEFT fang, brown rope belt,
  RIGHT pouch with green dinosaur sticker, LEFT brown wooden sheath, matte black 8x30 binoculars
  with LEFT neck knot and Kett's hinge mark. His folded PAPER drawing, pale-blue ID and cobalt pencil
  remain protected in the pouch. Boots inherit ch043; their design is not reinvented here.
  Taeo has one mole beneath RIGHT eye; olive backpack retains the old orange door patch.
  Only Taeo sees windows. Amber Nib and slate-green Orrin pulses belong in his RIGHT palm.
  Sera's consented link is copper-rose #C77E91, recorded in P16 notes. No earlier available script
  assigned her a hue; retain an earlier explicit assignment if a concurrent draft establishes one.
  Kesh does not link; ch065 reserves pale lilac #B7A0D3 for his eventual link.
  Load share diverts mechanical pressure only, with consent; it does not remove an existing wound.
extras:
  upstream_lead: "Voice only, continue ch070: adult woman about 35, close braid, navy Meridian field gear, white helmet, LEFT shoulder radio."
  south_lead: "Background, continue ch070: adult man about 40, shaved head, muted rust waterproof jacket, white helmet, compact shoulder radio."
  survey_workers: "Background adult survey workers in muted slate clothes, white helmets and plain dusty orange vests; no children."
palette_notes: >
  A4 gate treatment adapted to a skyless cavern: slate and violet, hard white lamp pools, ink water;
  sparse danger red after the attack; muted lilac mineral fill continues ch070. Outside: cool morning grey, navy canopy shadows. Earlier staging
  gag: muted daylight, flat cream. No bloom, decorative motes, readable marks or generated lettering.
panels:
  - id: P01
    shape: wide
    gap: none
    bg: navy
    camera: "outside, over Taeo's right shoulder toward the radio table and threshold"
    art: >
      taeo, outdoor, leans into the coiled handset at chungju_river_gate, finishing an order.
      ACTING: frightened certainty held by a clenched jaw. His olive patched backpack hangs on the chair.
      The white banded cable enters the cold-rimmed black-violet slit behind the table. Morning daylight
      and hard gate spill; slate shadows. Keep the table's log blank, all equipment screens dark. No lettering.
      Frame Taeo from the waist up on the right, with the table and threshold beyond him.
    calm: top
    lines:
      - {who: taeo, type: speech, side: r, text: "GO B. THE SYSTEM SAYS IT'S CLEAR."}
    notes: "Direct continuation of ch 70's hook. This is the real Taeo giving the wrong order."
