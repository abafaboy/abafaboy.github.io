chapter: 85
title: Dara
when: "Directly after ch 84's pre-contract Yeoju survey; the journey back to Seoul, then the same evening at Ryu Survey's practice yard. No calendar date is lettered."
story_beats: PART_ONE_BEATS.md#85
cast:
  taeo: outdoor # Navy zip jacket over black hoodie, black cargo trousers, one-white-stripe black sneakers; jacket off and hoodie sleeves raised from P46. Mole under RIGHT eye.
  nib: default # His chosen ch 43 boots, unchanged. Adult, 105 cm; all locked equipment below.
  orrin: default
  sera: default # River-green wrap, sand cropped trousers, soft brown boots; recovering LEFT bow arm remains braced and supported, no bow draw.
  kesh: default
  sejin: default
  haein: default
  dara: default # Physical arrival P24; matte slate armour, oatmeal wrap, LEFT surgical kit, RIGHT cloth roll.
props:
  nib_gear: "V-notch LEFT ear, one lower fang LEFT, brown rope belt, dinosaur-sticker pouch RIGHT hip, brown wooden sheath LEFT hip; pale-blue ID, folded PAPER watch-post drawing and cobalt pencil with Kett's mark protected in pouch. Matte black 8x30 binoculars, black woven strap knotted LEFT at neck, fork scratched on hinge. Exact ch 43 boots: matte dark-brown ankle-high leather, broad round toe, four dull gunmetal eyelet pairs, brown round laces in small double knots, heel pull tab, low black lug soles, oat-grey short socks inside collar; no logo, hooks, buckles or visible steel cap. Never barefoot."
  taeo_gear: "Olive backpack with faded orange knock-off OLD shield-and-open-door patch; dark grey phone, hairline crack TOP LEFT, green dinosaur sticker. Old purple-brown recoil bruises on both forearms; no fresh injury this chapter."
  cup: "The ch 2 white ceramic mug with one thin green band, brought from the container home to the trestle for the welcome."
locations: [yeoju_field_rim, ryu_practice_yard]
location_notes:
  yeoju_field_rim: "Match ch 84: grey gravel, sample trestle, muted orange safety mesh, scaffold-framed violet-black threshold NORTH, vehicle access SOUTH; white survey cable with blue metre bands enters lower-left frame corner, grey relay tripods every 50 m. Tray has THREE empty recesses after reedstone (+34%), root salt (+33%), field ore (+33%) were consumed. Do not establish the contest layout yet. Taeo remains outside."
  ryu_practice_yard: "Follow locations/ryu_practice_yard/key_wide.png and key_reverse.png: south double gate, southwest GREY office container, southeast white van, fixed central plywood zigzag maze, three north targets, west equipment trestle. Arrival takes place on clear southern ground; nothing in the maze moves. The office container is not Taeo's separate container home."
palette_notes: "A4 yard dusty ochre, plywood brown, muted sky blue; dusk at Yeoju, then cream work-lamp pools and hard navy shadows at the yard. Interface cyan #3FE3F2 only for invitation and arrival. Flat cel fills, warm weighted ink, no bloom or decorative particles. All boards, packaging and tags blank unless a label ui supplies words."
panels:
  - id: P01
    shape: strip
    gap: none
    bg: navy
    camera: "extreme close-up down onto the sample tray"
    art: >
      yeoju_field_rim at dusk. THREE recesses in the shallow metal sample tray are empty;
      Taeo's black-cuffed RIGHT hand hangs beside it, fingers open in wonder. Cool sky light,
      grey gravel and brown tray shadows; leave upper air empty. No ore duplicate, no drawn interface.
    calm: top
    ui:
      - {kind: system.notice, on: float, text: "[ROUTE ALIGNMENT 100%]", at: [0.55, 0.12], tilt: -6}
    notes: "Continue ch 84 hook. This is the existing notice, not another integration or pop-in. PAYOFF P11: the new Yeoju kinds have opened contact window 6; repeat fragments have not advanced it."
  - id: P02
    shape: full
    gap: short
    bg: navy
    camera: "eye level across the survey trestle toward the cordon"
    art: >
      Taeo (taeo, outdoor, backpack patch out) looks from the empty tray to the distant gate;
      longing and alarm pull his tired face in opposite directions. Nib (nib, default with chosen boots
      and locked binoculars) stands on his RIGHT, level and watchful. Violet rim beyond the mesh,
      blue dusk above grey gravel. No entry by Taeo, no other window.
      Taeo stands in the left third; Nib stands in the right third.
    calm: top
    lines:
      - {"who": "taeo", "type": "speech", "side": "l", "text": "ANOTHER CHANCE TO INVITE SOMEONE."}
      - {"who": "nib", "type": "speech", "side": "r", "text": "WE ASK. THEY CAN SAY NO."}
  - id: P03
    shape: inset-r
    gap: short
    bg: navy
    silent: true
    camera: "close profile of Taeo looking down at his cuff"
    art: >
      Taeo (outdoor) at yeoju_field_rim pulls his hoodie cuff over a purple-brown forearm bruise.
      His face holds a private wince, then stillness; the mole under his RIGHT eye is visible.
      Dusk from frame left, flat slate-blue background. No fresh blood, no link light.
    calm: none
  - id: P04
    shape: tall
    gap: short
    bg: navy
    camera: "low two-shot beside the packed sample cases"
    art: >
      Nib (chosen boots, pouch RIGHT, sheath LEFT) closes an empty sample case at yeoju_field_rim.
      Taeo (outdoor) lifts his backpack, meeting Nib's eyes instead of looking toward the gate.
      Their faces are serious. Last pale dusk across gravel, violet gate small behind; no new extraction.
      Nib stands left at the case and Taeo right with the backpack; both faces remain visible.
    calm: top
    lines:
      - {"who": "taeo", "type": "speech", "side": "r", "text": "WE'LL SEND THE INVITATION AT THE YARD. WITH EVERYONE THERE."}
      - {"who": "nib", "type": "speech", "side": "l", "text": "GOOD."}
  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 85 · DARA"
  - id: P06
    shape: full
    gap: long
    bg: white
    camera: "establishing from the south double gate looking north"
    art: >
      ryu_practice_yard key at night: fixed ochre plywood maze central, three north targets,
      grey office southwest and white van southeast. Work lamps illuminate the clear southern apron.
      Taeo (outdoor) sets his pack on a chair; Nib checks the unobstructed open south gate.
      Both purposeful and tired. Cream lamp light, hard navy shadows; all signs blank.
    calm: top
    lines:
      - {who: narr, type: tag, text: "RYU SURVEY · THAT EVENING"}
  - id: P07
    shape: full
    gap: short
    bg: white
    camera: "medium group from the west trestle toward the van"
    art: >
      Kesh (kesh: adult, 198 cm, narrow mature grey-tan face, dark eyes, two feathered antennae,
      two arms, four grey-brown wing panels folded over olive tunic, dark trousers, wrapped shoes)
      leans forward eagerly beside Sera (sera, river-green wrap, long braid, bone flute RIGHT hip,
      recovering LEFT bow arm braced and supported, bow unstrung). Yard lamps warm their attentive faces; brown/navy palette.
      No cute insect face or extra limbs.
      Kesh stands left and Sera right, her braced arm supported; give both figures room.
    calm: top
    lines:
      - {who: kesh, type: speech, side: l, text: "SHOULD WE LOOK BUSY?"}
      - {who: sera, type: speech, side: r, text: "I ALWAYS LOOK EXPENSIVE."}
  - id: P08
    shape: tall
    gap: short
    bg: white
    camera: "low shot along the trestle surface"
    art: >
      Sejin (sejin, sage scrubs, olive medic rig, cropped hair, charcoal trousers) arranges water,
      a covered dressing tray and a folded blanket on the yard's west trestle. Her practiced hands
      contrast with guarded eyes. Haein (haein, slate bib overalls, beige tee, tool belt, glasses on crown)
      quietly moves an oily spanner away. Cream work lamp, ochre and olive; no active screens.
      Sejin stands left and Haein right; show their faces above the trestle and the spanner.
    calm: top
    lines:
      - {who: sejin, type: speech, side: l, text: "DON'T MAKE THE FIRST THING THEY SEE A WEAPON."}
      - {who: haein, type: speech, side: r, text: "IT'S A SPANNER."}
      - {who: sejin, type: speech, side: l, text: "YOU'RE HOLDING IT LIKE AN OPINION."}
  - id: P09
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up at Orrin's face level"
    art: >
      Orrin (orrin, adult slate-terraced stoneback, heavy-lidded olive eyes, no harness) waits on
      the yard's southern apron, leaving a broad open path to the south gate. His expression is
      patient and gently skeptical. Cream lamp across layered slate, cool navy shadow. No pet accessories.
      Orrin is in the left third of the close-up.
    calm: right
    lines:
      - {"who": "orrin", "type": "speech", "side": "l", "text": "I HAVE LEFT ROOM FOR OUR GUEST."}
  - id: P10
    shape: full
    gap: short
    bg: white
    camera: "over Taeo's right shoulder into the empty apron"
    art: >
      Taeo (outdoor, RIGHT hand raised) faces clear air above the southern yard ground;
      Nib watches his face from the right, binoculars resting high on his chest. Taeo's jaw is
      tense but his hand steady. Lamp-lit ochre ground, navy background; reserve centre for interface.
      Taeo stands left of centre and Nib at right; give the two standing figures room.
    calm: top
    ui:
      - {kind: system.window, on: float, headline: "[CONTACT WINDOW 6]", body: "[INVITATION AVAILABLE]", button: "[INVITE]", at: [0.50, 0.17], tilt: -7}
    sfx:
      - {text: DING, style: summon, at: [0.80, 0.25], size: S, rot: 0}
    notes: "Only Taeo sees the operator window. No candidate is selected or owned by the crew."
  - id: P11
    shape: strip
    gap: short
    bg: white
    camera: "close side view of Taeo's finger stopping above the button plane"
    art: >
      Taeo's RIGHT index finger pauses in empty air over the yard apron. Black hoodie cuff,
      faint purple bruising at its edge; deliberate restraint in the hand. Hard cyan reflection
      from the interface off frame, warm brown ground behind. No palm pulse, no drawn button words.
    calm: top
    lines:
      - {who: taeo, type: float, text: "I USED TO THINK READY MEANT NOT BEING SCARED."}
  - id: P12
    shape: tall
    gap: short
    bg: white
    camera: "front three-quarter on Taeo, crew spaced behind"
    art: >
      Taeo (outdoor) addresses the contact point on the yard apron with an awkward formal bow;
      his RIGHT hand has just completed one deliberate tap in empty air to send the invitation.
      Sejin and Nib stand well back, attentive. His smile is small, earnest and unpracticed.
      Cream lamp and thin cyan side light over ochre/navy; no crowd pressing on the arrival space.
      Taeo bows at centre, Nib and Sejin well behind to either side; keep the arrival ground open.
    calm: top
    lines:
      - {who: taeo, type: speech, side: c, text: "I'M YOON TAEO. WE WORK AROUND GATES."}
      - {who: taeo, type: speech, side: c, text: "WE NEED SOMEONE WHO CAN HELP US COME BACK ALIVE."}
  - id: P13
    shape: narrow-r
    gap: long
    bg: white
    silent: true
    camera: "close frontal view of Taeo waiting"
    art: >
      Taeo (outdoor) waits at the yard apron, mouth closed, both hands lowered. He makes
      himself allow the silence. Cyan rim at one cheek, cream lamp above, plain navy background.
      Keep his RIGHT-eye mole; no imaginary candidate portrait or answering silhouette yet.
    calm: none
  - id: P14
    shape: full
    gap: short
    bg: white
    camera: "slight low angle on Taeo reacting to the contact"
    art: >
      Taeo (outdoor) abruptly straightens at the yard contact point, eyes large at a voice
      nobody else can hear yet. Nib, at right, studies him rather than the empty air.
      Hard cyan on Taeo's face against work-lamp ochre; no physical Dara yet, no drawn window.
      Taeo stands left and Nib right. Dara is a private mediated voice beyond the right edge, with no body drawn.
    calm: top
    lines:
      - {"who": "offpanel:dara", "type": "phone", "text": "IS ANYONE BLEEDING?", "side": "r"}
      - {"who": "taeo", "type": "speech", "side": "l", "text": "NO."}
      - {"who": "offpanel:dara", "type": "phone", "text": "THEN WHY ARE YOU CALLING?", "side": "r"}
    notes: "First answer, required exact exchange. The angular phone type denotes mediated contact; only Taeo hears this private invitation audio."
  - id: P15
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up on Taeo's apologetic mouth and eyes"
    art: >
      Taeo (outdoor) at the yard almost apologises, catches himself and looks up honestly.
      The tired eyes soften. Cyan contact light from his right, warm work-lamp edge from left;
      simple navy background, mole under RIGHT eye. No added props or candidate image.
      Taeo is in the left third of the close-up.
    calm: right
    lines:
      - {"who": "taeo", "type": "nervous", "side": "l", "text": "SORRY. WE NEED HELP BEFORE SOMEONE STARTS BLEEDING."}
  - id: P16
    shape: tall
    gap: short
    bg: white
    camera: "profile of Taeo with Sejin across the far trestle"
    art: >
      Taeo (outdoor) keeps facing the private contact, but his glance reaches Sejin (medic rig)
      checking her supply bag at the yard trestle. He looks ashamed, she busy and unaware
      of the words. Cream lamp and cyan edge over muted ochre/olive. No live treatment or fresh bleeding.
      Taeo stands left, Sejin works at the trestle right; she cannot hear Dara's private contact.
    calm: top
    lines:
      - {"who": "taeo", "type": "speech", "side": "l", "text": "OUR MEDIC HANDLES EVERY INJURY."}
      - {"who": "taeo", "type": "speech", "side": "l", "text": "I'D LIKE HER TO HAVE HELP BEFORE THE NEXT EMERGENCY."}
  - id: P17
    shape: full
    gap: short
    bg: white
    style: chibi
    camera: "chibi frontal interview panic"
    art: >
      Chibi Taeo (outdoor, 2.5 heads, patch and RIGHT-eye mole preserved) holds a painfully
      straight interview posture while sweat runs down both cheeks. Chibi Nib (chosen boots,
      LEFT notch, brown belt, RIGHT pouch, LEFT sheath and binoculars) evaluates him with line eyes.
      Flat dusty-ochre screentone under a symbolic cream yard lamp. No danger or grief.
      Chibi Taeo stands left and Nib right, both faces clearly visible.
    calm: left
    lines:
      - {who: nib, type: speech, side: r, text: "HE'S DOING THE CUSTOMER FACE."}
      - {who: taeo, type: whisper, side: l, text: "IT'S THE ONLY FORMAL ONE I HAVE."}
  - id: P18
    shape: tall
    gap: short
    bg: white
    camera: "normal-style low view past Taeo's hands to his face"
    art: >
      Back to normal adult proportions. Taeo (outdoor) opens both hands at the yard contact,
      palms empty. He looks embarrassed but direct. The open south gate lies beyond him;
      cream lamps, hard navy shadows and faint cyan on his sleeves. No binding thread or restraint.
      Taeo stands at centre; Dara remains a private voice beyond the right edge.
    calm: top
    lines:
      - {"who": "taeo", "type": "speech", "side": "c", "text": "YOU CAN REFUSE. COMING DOESN'T MAKE YOU MINE."}
      - {"who": "offpanel:dara", "type": "phone", "text": "CAN YOU SEND ME HOME?", "side": "r"}
  - id: P19
    shape: strip
    gap: short
    bg: white
    camera: "tight frontal strip on Taeo's eyes"
    art: >
      Taeo's eyes at the yard, no smile now; the RIGHT-eye mole just within frame.
      Shame and resolve, no averted gaze. Cyan contact reflection on the lower lids, cream
      work-lamp line above, everything else navy. No fantasy return portal behind him.
      Taeo's eyes occupy the centre of this detail strip.
    calm: bottom
    lines:
      - {who: taeo, type: speech, side: c, text: "NOT YET. I CAN'T PROMISE WHEN."}
  - id: P20
    shape: tall
    gap: long
    bg: white
    camera: "high angle on Taeo inside the crew's loose semicircle"
    art: >
      Taeo (outdoor) stands alone in the clear yard apron while Nib, Orrin, Sera, Kesh,
      Sejin and Haein leave him room. Everyone waits without crowding him. His shoulders lower
      as the answer arrives. Cream pools of work light over ochre, hard navy perimeter. No summoning yet.
      Taeo stands centre within the listening semicircle. Dara speaks only through the private contact off right.
    calm: top
    lines:
      - {"who": "offpanel:dara", "type": "phone", "text": "GOOD. HONEST ANSWERS USUALLY COST SOMETHING.", "side": "r"}
      - {"who": "offpanel:dara", "type": "phone", "text": "I'M BRINGING MY TOOLS.", "side": "r"}
  - id: P21
    shape: tall
    gap: long
    bg: navy
    camera: "over Taeo's shoulder above the clear ground"
    art: >
      Taeo (outdoor) lifts his head into empty upper air above the yard apron, startled
      relief plain on his face in partial profile. Nib stands at the far right, watchful.
      Cyan interface illumination begins to override the cream lamp; empty ground below. No human figure yet.
    calm: top
    ui:
      - {kind: system.notice, on: float, text: "[INVITATION: ACCEPTED]", at: [0.50, 0.16], tilt: -6}
    sfx:
      - {text: DING, style: summon, at: [0.83, 0.26], size: M, rot: 0}
    notes: "PAYOFF P11: consented arrival from contact window 6, made possible by new field kinds. Alignment is spent; no spare draw is awarded."
  - id: P22
    shape: full
    gap: short
    bg: navy
    camera: "top-down on the yard arrival circle"
    art: >
      A hard-edged cyan circle opens on clear ochre ground at ryu_practice_yard; a thin vertical
      seam rises from its centre. Taeo (outdoor) steps back, palms out, startled despite preparing;
      Nib in boots stays clear. Lamp shadows yield to cyan/navy. No person materialising from particles.
    calm: top
    sfx:
      - {text: SHIIING, style: summon, at: [0.52, 0.25], size: L, rot: 0}
  - id: P23
    shape: strip
    gap: short
    bg: navy
    silent: true
    camera: "ground-level close-up of one armoured boot crossing the seam"
    art: >
      Dara's slate plated boot steps physically out of the cyan seam onto yard gravel.
      Weight compresses the dust; a corner of oatmeal surgeon's wrap and the bottom of a greave
      enter frame. Her step is confident and practical. Crisp cyan/navy, no glitter or floating disembodied limbs.
    calm: none
  - id: P24
    shape: bleed
    gap: short
    bg: navy
    camera: "low full-figure arrival portrait, three-quarter front"
    art: >
      Dara (dara), adult human woman 42, 180 cm, broad strong build, square weathered face,
      blunt nose, dark eyes, thick brows, dark braid with grey temples, steps fully onto the
      yard apron. Heavy matte slate breastplate, shoulder and upper-arm plates over oatmeal surgeon's
      wrap, scarred bare forearms, layered hip plates, greaves; surgical kit LEFT hip, cloth roll RIGHT.
      Her assessing frown is fierce, never glamorous. Cyan seam behind, cream lamp ahead; lower-left plain ground.
    calm: top
    intro: "DARA · FIELD SURGEON"
    notes: "Physical introduction follows characters/dara/turnaround.png. Her answer has already established her voice. No weapon, spikes, fresh scars or healing aura."
  - id: P25
    shape: inset-r
    gap: short
    bg: white
    camera: "close on Taeo from Dara's eye level"
    art: >
      Taeo (outdoor) at the yard looks up at Dara, whole face opening into an enormous
      relieved expression before he remembers his manners. RIGHT-eye mole; raised hands halfway between
      welcome and surrender. Arrival cyan fading, cream work lamp returning over ochre/navy. No nosebleed.
      Taeo is in the right third of the close-up.
    calm: left
    lines:
      - {who: taeo, type: nervous, side: r, text: "WELCOME. I'M THE ONE WHO CALLED."}
  - id: P26
    shape: full
    gap: short
    bg: white
    camera: "Dara's point of view across the waiting crew"
    art: >
      At the yard, Nib (adult, boots and locked gear) faces Dara levelly; Orrin waits
      behind, Sera's recovering arm supported, Kesh with wings folded, Sejin beside the trestle.
      Their welcome is cautious, not a receiving line. Cream lamps and navy shadows; arrival seam has closed.
      Sejin stands in the right third, Nib left and the waiting crew centre. Dara speaks from beyond the left edge.
    calm: top
    lines:
      - {"who": "offpanel:dara", "type": "speech", "side": "l", "text": "WHICH ONE IS IN CHARGE OF NOT BLEEDING?"}
      - {"who": "sejin", "type": "speech", "side": "r", "text": "APPARENTLY I'VE BEEN PROMOTED."}
  - id: P27
    shape: tall
    gap: short
    bg: white
    camera: "medium single portrait of Dara left, face above her open hand and hip kit"
    art: >
      Dara (slate armour, oatmeal wrap) extends her bare scarred forearm into the yard lamplight,
      palm open to ask for a working introduction. Her surgical kit sits LEFT, cloth roll RIGHT.
      Intent, unsentimental face at frame top. Cream light, warm grey/navy shadows; no healing effect.
      Dara is on the left; show her face and extended hand together, with room below her armour.
    calm: right
    lines:
      - {who: dara, type: speech, side: l, text: "DARA. SURGEON."}
  - id: P28
    shape: full
    gap: short
    bg: white
    camera: "side-on at trestle height, Sejin and Dara shaking hands"
    art: >
      Sejin (sage scrubs, olive rig) and Dara (slate armour, scarred forearms) shake hands over
      the yard trestle. Sejin's eyebrow rises; Dara's mouth curls with dry professional curiosity.
      Cream work lamp on their joined hands, muted olive and slate. No domination pose or crushed grip.
      Sejin stands left and Dara right, both faces and their handshake visible.
    calm: top
    lines:
      - {who: sejin, type: speech, side: l, text: "IM SEJIN. FIELD MEDIC. SAFETY OFFICER."}
      - {who: dara, type: speech, side: r, text: "TWO JOBS. THERE'S YOUR FIRST PROBLEM."}
  - id: P29
    shape: full
    gap: short
    bg: white
    style: chibi
    camera: "chibi inventory inspection from Nib's height"
    art: >
      Chibi Nib (all locked props and chosen boots) solemnly counts pockets on chibi Dara's
      LEFT surgical kit without touching it. Dara (slate armour, RIGHT cloth roll) pulls it
      protectively aside with a raised brow. Flat cream screentone suggests the yard lamp; no medical crisis.
      Chibi Nib stands left and Dara right, with her surgical kit between them.
    calm: right
    lines:
      - {"who": "nib", "type": "speech", "side": "l", "text": "GOOD POCKETS."}
      - {"who": "dara", "type": "speech", "side": "r", "text": "SHARP THINGS IN THEM. ASK FIRST."}
  - id: P30
    shape: full
    gap: short
    bg: white
    camera: "normal medium shot toward the open south gate"
    art: >
      Nib (adult, default with boots) points toward the open south gate of ryu_practice_yard;
      Dara follows the gesture, expression briefly stripped of humour. Her scarred hand rests
      on her closed kit, not a weapon. Cream lamp on their profiles, navy street beyond. No locked gate.
      Nib stands left and Dara right, with the open gate beyond.
    calm: top
    lines:
      - {"who": "nib", "type": "speech", "side": "l", "text": "THE YARD GATE STAYS OPEN."}
      - {"who": "dara", "type": "speech", "side": "r", "text": "I NOTICED."}
  - id: P31
    shape: full
    gap: long
    bg: white
    silent: true
    camera: "from behind Dara looking through the open gate"
    art: >
      Dara (armour, LEFT kit, RIGHT roll) stands at the yard's south opening and looks
      out at a plain unfamiliar Seoul industrial street. Her shoulders stay braced, one hand
      closes on the roll. Cream yard light stops at her feet; cool blue street beyond. No remembered battlefield.
      Give Dara's full figure room at the open yard gate.
    calm: none
  - id: P32
    shape: tall
    gap: short
    bg: white
    camera: "three-quarter two-shot at the gate, Taeo keeping a step back"
    art: >
      Taeo (outdoor) stays inside ryu_practice_yard behind Dara, giving her the opening and her
      space. She turns one eye toward him, testing. His hands remain visible and empty.
      Cream lamp from inside, cool blue street light on armour edge; ochre ground. No enclosing crowd.
      Taeo stands left, keeping a step back; Dara stands right with the exit clear.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "YOU DON'T HAVE TO WORK TONIGHT."}
      - {who: dara, type: speech, side: r, text: "I DIDN'T CROSS A WORLD TO WATCH YOU HIDE YOUR PATIENTS."}
  - id: P33
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up on Dara's eyes looking past Taeo"
    art: >
      Dara's adult square face at the yard gate, dark eyes tracking the crew's fatigue rather
      than the unfamiliar buildings. The abrasive grin has gone; she is counting without moving
      her lips. Cream lamplight, hard slate shadows, grey temple strands. No supernatural diagnostic vision.
      Dara is in the right third of the close-up.
    calm: left
    lines:
      - {who: dara, type: speech, side: r, text: "WHO IS WALKING HURT?"}
  - id: P34
    shape: tall
    gap: short
    bg: white
    camera: "eye-level group beside the west trestle"
    art: >
      Sera (river clothes, supported recovering arm) raises her sound hand at the yard trestle.
      Kesh (folded wings) reluctantly raises his beside her; Orrin, adult slate shell, lifts
      his chin. Dara listens, Sejin beside her with records. Cream lamps, muted olive/slate/ochre. No fresh wounds.
      Sera sits left, Kesh centre and Dara stands right; Sejin listens beside Dara, Orrin behind.
    calm: top
    lines:
      - {who: sera, type: speech, side: l, text: "HURT. STILL EXPENSIVE."}
