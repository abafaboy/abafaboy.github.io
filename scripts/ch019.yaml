chapter: 19
title: Binoculars
when: "Spring, some weeks after the review (ch 9): the day after Taeo's last weeknight shift (ch 18). The morning in the flat runs straight on from ch 18's hook; no time is lettered there, but Chae's follow-up texts are stamped 09:13 and 09:14. Taeo sleeps through the day (he has no shift); 5:40 PM the camping store; 6:40 PM Mangwon Hangang Park at golden hour; 11:40 PM to just before midnight in the flat. No date or weekday is lettered."
story_beats: PART_ONE_BEATS.md#19
cast:
  taeo: default     # P01–P20 and P50–P61: black hoodie, black cargo trousers, socks (home from the night shift; the grey-green Hanbit Mart vest dropped on the bed). P21–P49: outdoor (navy zip jacket over the hoodie, olive backpack with the faded orange shield-and-open-door patch). ONE mole under his RIGHT eye. The link pulse shows in his RIGHT palm (as ch 7, ch 16)
  nib: default      # barefoot; V-notch LEFT ear; one lower fang on the left; brown rope belt; leather pouch RIGHT hip with Haru's small dinosaur sticker on the flap (ch 8); brown wooden sheath LEFT hip. From P37 he wears the binoculars (props.binoculars) in every panel
  chae: default     # TTOK messages only (P10); not drawn
extras:
  shop_owner: "the camping-store owner, about 65: lean, upright and sun-browned, short grey crew cut, a sun visor pushed up on his forehead, a bright cobalt-blue technical hiking jacket zipped to the chin even indoors, grey hiking trousers, trail shoes, a whistle on a lanyard, a pencil behind his right ear. Loud, delighted, a born salesman with a kind streak. Must not resemble Grandpa (no work cap, never stooped)."
  porters_far: "five porters seen tiny through binoculars (P40): lime-yellow hi-vis vests (as Dokgo's porters in ch 13–16; never amber), white hard hats, crates strapped to their backs; the last in line is an older man who has stopped with his hands on his knees"
  hunters_far: "three hunters seen tiny through binoculars (P40): clean dark tactical gear, posing together for a selfie on a phone stick (its screen dark)"
  bori: "the neighbourhood's fat calico street cat, asleep on a tiled roof two streets from the shop; a speck in P32"
props:
  shard: "The dark shard Nib worked out of the lip of the crack at Guro (ch 16 P25): thumb-sized, flat and angular, GLASSY BLACK with a faint violet sheen along its broken edges. Its fine cracks glow interface cyan #3FE3F2 only while Taeo touches it. In THE CUP from P18 to P53; integrated (gone) at P55."
  binoculars: "NEW LOCKED PROP from P37, worn in every panel from then on (bible: 'he wears them always from now on'): compact 8x30 porro-prism field binoculars in MATTE BLACK rubber armour (no chrome, no gold, nothing that shines), two round objective lenses at the front, a central focus wheel, black rubber eyecups, a plain black woven neck strap with one knot tied in it to shorten it (the knot sits at the LEFT side of his neck), so they ride high on Nib's chest just below the collarbones; about as wide as his face. From P51 a tiny three-line fork (Kett's mark) is scratched into the top of the hinge plate between the barrels. Add them to Nib's model sheet."
  pricey_binoculars: "the shop's ₩340,000 pair: sleek roof-prism binoculars with glossy champagne-gold trim that catches the light"
  cup: "THE CUP (world/LOCATIONS.md): a plain white ceramic mug with one thin green band, on the folding table. It holds the shard from P18 to P53."
  drawing: "Nib's drawing of his watch post on flattened cardboard (ch 4, ch 11: a wall, a tree behind it, the lower path, a pale shaded patch) with the white pebble from ch 11 set on the pale patch; it lies on the folding table beside THE CUP."
  banknotes: "Korean banknotes drawn as plain coloured rectangles with no numbers, portraits or words: ₩10,000 pale sage-green (as ch 11), ₩5,000 brick-orange (never the link amber), ₩1,000 pale blue (as ch 7)."
locations: [taeo_flat, camping_store, mangwon_riverside]
location_notes:
  camping_store: "No key yet (decided here). A narrow, old independent camping-and-hiking shop on the east side of the bus street (taeo_street), about 3 minutes' walk north of Taeo's building toward Mangwon station, so the late sun shines in at its door; Nib passes it on every walk to the station. Shopfront: a faded dark-green canvas awning (blank), a glass door on the left, a display window on the right crammed with a small dome tent, a mannequin in a hiking jacket, lanterns, folding chairs and coiled rope; at the front of the window, on a little wooden stand, one pair of plain black binoculars with a small blank price card. Inside, deep and narrow (about 3.5 x 9 m): on the LEFT (seen from the door) a slanted wall of hiking boots; on the right racks of jackets and fleeces, a barrel of trekking poles, rolled sleeping mats; lanterns and carabiners hanging from the ceiling; a pyramid of gas canisters and a display folding chair down the middle; at the back a glass display counter (compasses, headlamps, folding knives, binoculars under the glass), the till at its right end and a small dark TV on a bracket above it. Fluorescent tubes plus warm daylight from the door. Palette (not in A4): khaki, canvas tan and warm wood, warm grey-brown shadows; the owner's cobalt-blue jacket is the one saturated note. Every label, sign and box is blank."
  mangwon_riverside: "First used in ch 6 (no key yet). Mangwon Hangang Park runs along the Han's north bank from Seongsan Bridge (west, downstream: a long steel deck-arch bridge, a row of arches under its deck) to Yanghwa Bridge (east); the park is known for its sunset view toward Seongsan Bridge. This chapter: the top of a stepped concrete embankment below the riverside path, with a low concrete parapet about 75 cm high along its edge (chest-high on Nib, seat-high for Taeo). Below it, grass, the cycle path and the water; across the river, the far bank's embankment road and apartment towers as simple shapes. Spring: fresh green on the trees. Facing the river (south), Nib stands on the right (west) and Taeo sits on his left."
palette_notes: "Flat by day, curtain drawn: dim blue-grey with one hard yellow line of daylight at the curtain's edge; the shard's and the windows' interface cyan #3FE3F2 is the only bright colour. Camping store: khaki, canvas tan and warm wood, warm grey-brown shadows; one accent, the owner's cobalt-blue jacket. Bus street: muted daylight greys and red brick in long late light. Riverside at golden hour: a drawn sky gradient from peach to pale blue, a silver-gold river, long blue shadows; the sunlight kept peach and rose-gold, pinker than the link amber; the gate's violet with its cold white-cyan rim appears only inside the binocular view (P40). Flat at night: the desk lamp's warm orange on the south side, deep blue-grey on the north; interface cyan floods the room at the integration (P55) and from the log (P58–P61). Amber #F2A93B appears only in Nib's eyes and once as the link light in Taeo's right palm (P15). No red in this chapter."

panels:

  # ---------------- COLD OPEN: straight on from ch 18's hook ----------------
  - id: P01
    shape: strip
    gap: none
    bg: black
    silent: true
    camera: "extreme close-up from above on two hands and the shard"
    art: >
      Extreme close-up, looking straight down, kept in the middle third: Nib's open olive-green palm (nib: long fingers, dark nails,
      faint pale scars on the forearm) held out flat, the leather drawstring pouch open at his RIGHT hip at the frame edge.
      In the palm lies the dark shard (props.shard): thumb-sized, flat and angular, glassy black with a faint violet sheen on its broken edges.
      Taeo's index fingertip (taeo, black hoodie cuff) rests on it, and the fine cracks across it glow interface cyan #3FE3F2:
      hard-edged lines of light, the only bright thing in the frame, throwing cyan up onto both sets of fingertips.
      Everything else is deep blue-grey (taeo_flat by day with the blackout curtain drawn). No haze, no particles. No text.
    calm: none
    notes: "Straight on from ch 18's hook (Chae's call; the shard glows cyan when Taeo touches it). If ch 18 leaves the shard in the mouth of the open pouch rather than in Nib's palm, draw it there."

  - id: P02
    shape: tall
    gap: short
    bg: black
    camera: "low angle from the floor beside them, looking up past both figures into the empty air above the shard"
    art: >
      taeo_flat by day with the grey-blue blackout curtain drawn: dim blue-grey, one thin hard yellow line of daylight down the curtain's edge far off at the window.
      Lower third: Nib (nib, default) sits on the floor with his back to the wall beside the entry step, knees up, his palm with the shard held out;
      Taeo (taeo, default: black hoodie, black cargo trousers, socks) kneels in front of him, facing him, one fingertip still on the shard, and his head has snapped up.
      The upper half of the frame is EMPTY dark air (the letterer floats a window there), and Taeo stares into it.
      ACTING: Taeo frozen mid-breath, eyes huge, mouth open, his face lit from above by cool cyan as if by a screen only he has.
      Nib is not looking at the air at all: he watches Taeo's face, wary, brows down, because he sees nothing there.
      Cyan light from the shard and from above; deep blue-grey everywhere else. Hard cel shadows, no glow fog. No text.
    calm: top
    lines:
      - {who: taeo, type: float, text: "IT HADN'T SAID A WORD SINCE THE NIGHT HE CAME."}
    ui:
      - {kind: system.notice, on: float, text: "[ANCHOR FRAGMENT DETECTED]", at: [0.5, 0.10]}
    sfx:
      - {text: "DU-DUN", style: summon, at: [0.84, 0.36], size: L, rot: 0}
    notes: "The interface opens for Taeo for the first time since ch 1 (ch 2's 3 a.m. glitch was seen only by Nib, while Taeo slept; ch 2 P05: Nib could not see the summon card). Only Taeo sees this window; Nib sees only the glow in his own palm."

  - id: P03
    shape: inset-l
    gap: short
    bg: black
    camera: "close-up on Nib's face, three-quarter, from just beside Taeo"
    art: >
      Nib (nib) close: a narrow, weathered adult face with lines under the amber eyes, the V-notch in the top of his LEFT ear,
      the small lower fang on his LEFT showing as he speaks. His eyes stay on Taeo; they flick once to the empty air beside him, where he sees nothing.
      ACTING: wary, low and steady. Cyan light from the shard below catches his jaw; blue-grey beyond. Never cute. No text.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "WHAT DOES IT SAY?"}
    notes: "Echo of ch 2's hook ('WHAT DOES IT SAY?' / '...IT SAYS I HAVE THREE DAYS.')."

  - id: P04
    shape: wide
    gap: short
    bg: black
    camera: "medium close-up on Taeo from the front, slightly low, from Nib's side"
    art: >
      Taeo (taeo, default) from the front, kneeling, one hand still on the shard below the frame, his face lit cyan from above.
      His eyes track a line of something in the empty air over the camera. ACTING: awe tipping into fear, and a strangled half-smile pulling at one corner
      of his mouth (he gets funnier when he is scared); the one small mole under his RIGHT eye; messy near-black hair over his brow.
      The dark room behind him simplified to blue-grey shapes. No text.
    calm: top
    lines:
      - {who: taeo, type: speech, side: c, text: "...IT SAYS IT KNOWS WHAT THAT IS."}

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 19 · BINOCULARS"

  # ---------------- THE FLAT, MORNING ----------------
  - id: P06
    shape: full
    gap: long
    bg: white
    silent: true
    camera: "establishing, high angle from the ceiling corner above the bed, looking back down the room toward the door"
    art: >
      taeo_flat (key and floor plan) by day, the blackout curtain drawn behind the camera: dim blue-grey, one hard yellow line of daylight falling across the floor from the curtain's edge.
      Looking toward the door: the kitchen strip on the RIGHT; the bathroom door and the desk (lamp off) on the LEFT; the folding table in the middle with THE CUP (props.cup)
      and Nib's cardboard drawing with the white pebble on it (props.drawing); the clothes rack with the olive backpack on its end hook, patch out.
      In the foreground, the foot of the bed: the grey duvet rumpled, the grey-green Hanbit Mart vest dropped on it.
      At the far end by the door, small: Nib sits against the wall, Taeo kneels facing him, Taeo's phone face-down on the floor by his knee (the call has just ended).
      Taeo has lifted his free hand toward the empty air between them, one fingertip out, as if to press a button. Cyan from the shard on both of them.
      Furniture exactly where the floor plan puts it. No text.
    calm: top-left

  - id: P07
    shape: wide
    gap: short
    bg: white
    camera: "over Taeo's right shoulder toward the door, the window between him and Nib"
    art: >
      Over Taeo's right shoulder (the back of his messy hair and black hood in the lower-left corner): his fingertip has just touched the air,
      and something only he can see has unfolded there. Leave the upper three-quarters of the frame, centred, as empty air for a large window (letterer).
      Beyond it, at the right edge, Nib sits against the wall by the door, watching Taeo, not the air.
      Dim blue-grey day light; cyan on Taeo's raised hand and the edge of his cheek. No text.
    calm: top
    ui:
      - {kind: system.window, on: float, headline: "[ANCHOR FRAGMENT DETECTED]", body: "[KIND: STONE (NEW)]\n[ROUTE ALIGNMENT 0%]", button: "[INTEGRATE?]", at: [0.5, 0.06]}
    sfx:
      - {text: "DING", style: summon, at: [0.86, 0.14], size: M, rot: 0}
    lines:
      - {who: taeo, type: speech, side: l, text: "IT SAYS 'STONE, NEW.' AND 'ROUTE ALIGNMENT: ZERO PERCENT.'"}
      - {who: taeo, type: speech, side: l, text: "AND THERE'S A BUTTON. 'INTEGRATE?'"}
    notes: "The notice of P02 expands into a full window at his touch, as in ch 1 P50. ROUTE ALIGNMENT is the counter readers will track: 0% here, 50% at P56."

  - id: P08
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up on Nib, eye level, a little from below"
    art: >
      Nib (nib) looks past Taeo at nothing, thinking hard: one word has caught the scout in him.
      ACTING: stillness; the amber eyes narrowing; a first flicker of hope held perfectly flat. The V-notch in his LEFT ear.
      Simplified blue-grey background, a thin cyan edge light from the shard below. No text.
    calm: left
    lines:
      - {who: nib, type: speech, side: r, text: "ROUTE."}
      - {who: nib, type: speech, side: r, text: "A ROUTE GOES SOMEWHERE."}

  - id: P09
    shape: inset-l
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag (2.5 heads). Chibi Taeo holds the dark shard right up to his face, cross-eyed, his mouth a small worried circle,
      as if wondering whether 'integrate' means eating it; a sweat drop flies off him. Chibi Nib, with a flat line-eyed deadpan stare,
      clamps one hand round Taeo's wrist like stopping a toddler. Nib's locks are identical to his model: notch in the LEFT ear,
      brown rope belt, pouch RIGHT hip, brown wooden sheath LEFT hip, barefoot. Flat pale-blue background with screentone dots. No text.
    calm: top
    lines:
      - {who: taeo, type: nervous, side: l, text: "AND 'INTEGRATE'... I THINK IT MEANS I TAKE IT IN?"}
      - {who: nib, type: speech, side: r, text: "DON'T EAT IT."}

  - id: P10
    shape: narrow-r
    gap: short
    bg: white
    camera: "kit phone hand, straight on"
    art: "KIT HAND"
    calm: none
    ui:
      - {kind: phone.ttok_chat, on: screen, hand: taeo_right_front, title: "Chae Yuri · AAO", clock: "09:14", date: "TODAY", messages: [{from: them, text: "Guro stone fragments are selling at ₩400,000 each.", time: "09:13"}, {from: them, text: "Checked: the finder's share is Nib's. His to sell or keep.", time: "09:14"}]}
    sfx:
      - {text: "BZZT", style: phone, at: [0.24, 0.10], size: S, rot: -10}
    lines:
      - {who: "offpanel:nib", type: speech, side: l, text: "YOUR SHOUTING BRICK."}
      - {who: narr, type: footnote, text: "*₩400,000 ≈ US$290"}
    notes: "Chae's follow-up to the ch 18 call. The beat's price: the shard would sell for ₩400,000. Runner: Nib's name for the phone (ch 2: 'YOUR BRICK IS SHOUTING.'). The date pill reads TODAY so that no calendar date is fixed here."

  - id: P11
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up of Taeo's eyes over the top edge of the phone"
    art: >
      Extreme close-up strip, kept in the middle third: Taeo's eyes and brow just above the top edge of his dark grey phone
      (the hairline crack in the top-left corner of the glass visible; the screen itself faces away from us), pale screen light from below.
      The eyes are fixed on one number, the pupils small. ACTING: a temptation he is ashamed of, held very still; a faint crease between the brows.
      The mole under his RIGHT eye. Dim blue-grey around. Nothing else in frame. No text.
    calm: none
    lines:
      - {who: taeo, type: float, text: "RENT IS FOUR HUNDRED AND FIFTY."}
    notes: "Rent is ₩450,000 a month (ch 5); his deposit went on the Guro penalty (ch 17). The temptation stays private: he never says it aloud."

  - id: P12
    shape: wide
    gap: short
    bg: white
    camera: "over Nib's shoulder toward Taeo, at floor level"
    art: >
      Over Nib's shoulder (the back of his spiky black head and his LEFT ear with its V-notch in the near foreground, out of the light):
      Taeo (default) has put the phone face-down on the floor and turned back to Nib. ACTING: a tired, honest face making itself say the right thing;
      he means it, and it costs him: a small lopsided smile that doesn't reach his eyes. The shard lies in Nib's palm in the lower foreground, dark now
      (Taeo's finger is off it). Behind Taeo, the dim room and the far yellow line at the curtain. No text.
    calm: top
    lines:
      - {who: taeo, type: speech, side: r, text: "IT'S YOURS. YOU FOUND IT."}
      - {who: nib, type: speech, side: l, text: "YOU NEED IT."}
      - {who: taeo, type: speech, side: r, text: "...IT'S STILL YOURS."}

  - id: P13
    shape: vignette
    gap: short
    bg: white
    silent: true
    camera: "high angle, looking down on Nib alone with the shard"
    art: >
      Borderless vignette fading into white: Nib (nib) seen from above and a little behind, sitting against the wall with his knees up,
      the dark shard in his open palm at the centre of the frame; his thumb runs once along its edge. It does not glow now.
      ACTING: weighing something big; head bowed, shoulders still. Soft blue-grey tones, the edges fading to white. No text.
    calm: none

  - id: P14
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up on Nib lifting his head, slight low angle"
    art: >
      Nib (nib) lifts his head and looks straight at Taeo: decided. ACTING: calm, level brows, jaw set, no smile.
      The V-notch in his LEFT ear and the small LEFT lower fang. Flat blue-grey background with a faint cyan edge light from the left. No text.
    calm: left
    lines:
      - {who: nib, type: speech, side: r, text: "IF IT MIGHT OPEN THE DOOR, IT'S MINE TO GIVE."}

  - id: P15
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "extreme close-up on their hands, side view"
    art: >
      Extreme close-up strip of hands, in the middle third: Nib's olive-green hand (faint pale scars on the forearm) has turned Taeo's larger RIGHT hand palm-up,
      laid the dark shard in it, and now folds Taeo's fingers closed over it with his own fingers, gently, like closing a door.
      Through the gaps between Taeo's fingers the shard's cracks light cyan #3FE3F2; and on the heel of Taeo's palm, where Nib's thumb presses,
      sits a small crisp spot of amber light #F2A93B: the link. Two hard-edged lights side by side, never blended, no haze. Black hoodie cuff on Taeo's wrist.
      Dim blue-grey around. No text.
    calm: none
    notes: "He gives it. Nib is 'unexpectedly kind with his hands'; the gesture mirrors Taeo closing Dami's fingers over the inhaler in ch 14. The amber is the link in Taeo's RIGHT palm (Nib permits it: he presses on purpose); the cyan is the interface."

  - id: P16
    shape: wide
    gap: short
    bg: white
    camera: "profile two-shot at floor level, Taeo on the left, Nib on the right"
    art: >
      Profile two-shot at floor level: Taeo (default) kneels holding his closed right fist against his chest, cyan light leaking between his fingers,
      leaning toward Nib to protest; Nib sits back against the wall with his arms folded now, unmoved. ACTING: Taeo anguished and embarrassed;
      Nib flat and certain. Seen from the kitchen side: behind them, simplified, the bathroom door and, at the right, the entry step. Blue-grey; cyan from the fist. No text.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "NIB. I CAN'T TAKE FOUR HUNDRED THOUSAND FROM YOU."}
      - {who: nib, type: speech, side: r, text: "YOU'RE NOT TAKING."}
      - {who: nib, type: speech, side: r, text: "I'M GIVING."}
    notes: "Taking versus giving: the hook (CONSENT: NOT REQUESTED) and ch 21 ('YOU TOOK ME.') turn on it. Nobody remarks on it here."

  - id: P17
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up from below on Taeo's face and his raised fist"
    art: >
      From below: Taeo (default) holds his glowing right fist up near his face, eyes lifted to the empty air above it (the window is still there; not drawn).
      His thumb starts to rise toward the air, then stops. ACTING: wanting and dreading at once; a hard swallow.
      Cyan light up from the fist across his chin and nose; the dark ceiling behind. No text.
    calm: right
    lines:
      - {who: taeo, type: speech, side: l, text: "...TONIGHT."}

  - id: P18
    shape: wide
    gap: short
    bg: white
    camera: "medium shot from the window side of the folding table, toward the door"
    art: >
      Taeo (default), on his knees at the folding table, drops the shard into THE CUP (props.cup); the cyan dies as it leaves his hand,
      the cracks going dark in mid-fall. He is already turning toward the bed, rubbing his face with the heel of his other hand, wrecked with tiredness.
      Nib's cardboard drawing with the white pebble lies beside the cup. Behind them by the door, Nib sits against the wall, arms folded, watching.
      Dim blue-grey, the yellow curtain line across the floor. No text.
    calm: top
    sfx:
      - {text: "PLINK", style: quiet, at: [0.38, 0.62], size: S, rot: -6}
    lines:
      - {who: taeo, type: speech, side: l, text: "SORRY. I'VE BEEN UP ALL NIGHT. I'M NOT PRESSING ANYTHING HALF ASLEEP."}
      - {who: nib, type: speech, side: r, text: "TONIGHT."}
    notes: "The window closes when he lets go of the shard; it reopens at his touch in P53. Taeo's 'SORRY' 1 of 2 (the river scene counts on it)."

  - id: P19
    shape: vignette
    gap: short
    bg: white
    camera: "from the foot of the bed along its length toward the curtained window"
    art: >
      Borderless vignette: Taeo (default, socks) lies on top of the grey duvet on his side, facing the curtained window, his back to the room,
      one forearm over his eyes. The hard yellow line of daylight at the curtain's edge crosses his shoulder. ACTING: the stillness of someone pretending to sleep;
      his free hand is a fist on the duvet. Blue-grey tones fading to white at the edges. No text.
    calm: top-left
    lines:
      - {who: taeo, type: float, text: "IF IT OPENS A DOOR, HE GOES THROUGH IT."}
      - {who: taeo, type: float, text: "I WANTED ONE MORE DAY."}

  - id: P20
    shape: narrow-l
    gap: short
    bg: white
    silent: true
    camera: "full figure, Nib by the door, slightly high"
    art: >
      Nib (nib, default) alone by the door, sitting against the wall: he has unrolled a fold of banknotes from his pouch onto his knee and counts them note by note,
      lips moving without sound. The notes are plain coloured rectangles with no numbers, faces or words (props.banknotes): mostly pale sage-green, a few brick-orange and pale blue.
      On the pouch flap at his RIGHT hip, the small dinosaur sticker Haru gave him (ch 8); the knife sheathed on his LEFT hip.
      ACTING: private and careful, a man who has done this count many times. Dim blue-grey day light. No text.
    calm: none
    notes: "His saved wages from spotter and day-rate jobs (ch 7, ch 9, ch 11, ch 13–17). The total is never stated."

  # ---------------- THE CAMPING STORE ----------------
  - id: P21
    shape: full
    gap: long
    bg: white
    camera: "establishing, exterior from across the bus street, eye level"
    art: >
      The bus street in Mangwon-dong (taeo_street vocabulary) in long, warm late-afternoon light: red-brick low-rise blocks, tangled overhead wires, a parked delivery scooter, a plane tree.
      The camping store (camping_store): a narrow old shopfront under a faded dark-green canvas awning (blank), a glass door on the left and a display window on the right crammed with
      a small dome tent, a mannequin in a hiking jacket, lanterns, folding chairs and coiled rope; at the front of the window, on a little wooden stand, one pair of plain black binoculars.
      In front of the window, small in frame: Nib, hands at his sides, not touching the glass, staring in. A few steps behind him Taeo (taeo, outdoor: navy zip jacket over the hoodie,
      olive backpack with the faded orange patch) yawns hugely, his hair flattened on one side from sleep. Muted daylight greys and red brick. Every sign blank. No text.
    calm: top
    lines:
      - {who: narr, type: tag, text: "MANGWON-DONG · 5:40 PM"}

  - id: P22
    shape: inset-r
    gap: short
    bg: white
    silent: true
    camera: "from inside the display window, past the binoculars, out at Nib's face"
    art: >
      From inside the display window looking out: in the foreground, sharp, the plain black binoculars on their little wooden stand (props.binoculars),
      with a small blank white price card propped against the stand. Beyond the glass, Nib's face at the height of the stand, eyes fixed on them,
      a faint reflection of the street lying over him. ACTING: longing, held perfectly still. The glass in front of him is clean: he never touches it. No text.
    calm: top-left
    ui:
