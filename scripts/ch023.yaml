      nib default lowers his noodle cup, deadpan, binoculars against his chest. minho default leans at the stair rail;
      haein default gathers the two sensor fobs. Deep blue evening, warm camping lantern under their faces, ochre yard below.
      Keep the cup labels blank and the sky plain; no visible windows or screens.
    calm: top
