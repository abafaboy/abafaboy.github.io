chapter: 23
title: Same Kind
when: "Late spring. Opens on the Ryu roof in the same evening as ch 22's hook. Two stone-survey jobs follow on successive working days; the archive visit, second van seizure and lodging confrontation follow the second job. Terrace Gate's outer-edge sampling and a sewer survey take the following day. Copper moss is integrated at Taeo's flat that night, shortly before 9 PM. No absolute date is lettered."
story_beats: PART_ONE_BEATS.md#23
cast:
  taeo: outdoor # navy zip jacket over black hoodie, black cargos, black sneakers with one white stripe; default hoodie and socks at home. One mole under RIGHT eye. Olive backpack, faded orange shield-and-open-door patch; cracked dark grey phone, green dinosaur sticker. Never enters a gate.
  nib: default # Adult, wiry, 105 cm, never cute outside chibi. LEFT-ear V-notch, one lower LEFT fang, brown rope belt, pouch RIGHT with green dinosaur sticker, brown wooden sheath LEFT, barefoot. Matte black 8x30 binoculars high on chest, strap knot LEFT neck, Kett's fork scratched on hinge. Pale-blue ID, folded PAPER watch-post drawing and cobalt pencil with carved fork in pouch. Borrowed white ear-hole hard hat only on work sites.
  minho: default # brown jacket, grey tee, olive cargos, black knee pads, brown boots; grey streak LEFT temple, radio LEFT chest, watch LEFT wrist.
  haein: default # jaw-length black bob, slate-blue bib overalls, beige tee, brown tool belt, safety glasses on crown; no grey streak.
  chae: default # brown bob, navy cardigan, white collar, black trousers; blue tablet remains dark.
  seonhee: default # about 55, low bun greying at temples, reading glasses, pencil behind LEFT ear, moss-grey cardigan, cream shirt, slate trousers, brown shoes.
  sejin: default # sage scrubs, olive medic rig, charcoal cargos, short dark hair.
  dami: default # adult 19, short low ponytail, choppy bangs, grey hoodie, faded ochre porter vest with many pockets, olive cargos, brown boots; hard hat carried at lodging.
  bluebird_collector: default # about 40, side-parted black hair, charcoal-navy suit, open pale shirt, no tie; dark tablet LEFT hand. Exactly two broad crew in dark windbreakers; no weapons.
extras:
  tow_driver: "Middle-aged woman in navy coveralls and work gloves, hair tied back; ordinary contractor, no threatening acting."
  lodging_porters: "Three tired adult porters, mixed ages, grey work layers; one has a damp towel over a shoulder. No child porters."
locations: [ryu_practice_yard, ryu_yard_roof, stone_survey_rim, stone_survey_inside, aao_office, porters_lodging, terrace_gate_rim, terrace_gate_outer, sewer_gate_rim, sewer_gate_inside, taeo_flat]
location_notes:
  ryu_practice_yard: "Use drawn key: ochre dirt, grey corrugated office southwest, blue-white van southeast, fixed plywood zigzag maze, targets north, double gate south. ryu_yard is the earlier alias. Opening roof is the established office roof reached by exterior stairs. Two vans at opening, one marked for seizure in ch 22; marked van removed P19, one remains. Add removable access ramp beside the keyed office step, never repaint container white."
  stone_survey_rim: "Two distinct paid jobs, not two visits to one deposit. First: tiled service basement with pipe racks. Second: disused loading shed with ribbed steel wall and concrete dock. Each has a framed door-height violet-black gate, Ryu radio table and intact white cable with blue bands each metre."
  stone_survey_inside: "Job one: broken limestone steps under lavender noon. Job two: grey stone shelves beneath rose-purple cloud. Both yield ordinary stone; violet shadows. Only the established landing area is shown, no boss clear."
  porters_lodging: "Unkeyed first use: rented rooms over a shuttered Mapo tool shop, exterior steel stair to a narrow landing, dented grey doors, drying towels, boot tray, cold tube above doorway. Shared landing is outside the rented rooms. No invented real address."
  terrace_gate_rim: "Unkeyed first use: former clay-storage yard, orange barrier enclosure, scaffold gate frame, folding survey table. A route board has abstract contour lines and blank annotation spaces."
  terrace_gate_outer: "C+ Terrace Gate. Broad outer landing leads toward clay terraces stacked around a void beneath a GREEN DUSK sky; violet shadows. Main central deposit lies far off. Narrow climbing shelves rise near the landing. Sampling stays within the surveyed outer edge; no boss is killed."
  sewer_gate_rim: "Mapo maintenance chamber, damp grey concrete, fixed ladder, portable white work lamps, survey table beside framed gate. Taeo stays on dry human-side staging platform."
  sewer_gate_inside: "Low bricklike mineral vaults, shallow dark water and copper-coloured moss rooted around an exposed anchor seam. Through broken vaults, wrong-colour lavender sky. No sewage monster or boss fight."
  taeo_flat: "Drawn taeo_flat keys win over contradictory compass floor plans. From entrance: kitchenette LEFT foreground, desk and family-photo shelf LEFT by far wall, bed RIGHT, two-pane window centred opposite entrance. Narrow balcony beyond; clothes rack RIGHT foreground. Folding table opened on clear middle floor. Bathroom-wall ASK FIRST sheet retained. Window, rail and bed still intact in this chapter."
palette_notes: "A4: yard dusty ochre/warm brown/sky blue; AAO clean blue-white/light slate; flat warm orange desk lamp against deep blue-grey. Each work site has muted grey or brown surfaces; gates violet-black with cold white rim, inside skies wrong-coloured and shadows violet. Only interface effects use cyan #3FE3F2/navy #0B1530. Nib's eyes and permitted RIGHT-palm link use amber #F2A93B. Red is confined to the seizure strip. Flat cel shading, warm near-black contours, no haze or decorative particles. All signs, paper, screens and boards blank unless filled by a ui label."
panels:
