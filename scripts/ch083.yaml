chapter: 83
title: Numbers
when: "Continues ch82 on the Ryu office roof at dusk; the following working day through evening. No calendar date fixed."
story_beats: PART_ONE_BEATS.md#83
cast:
  taeo: outdoor
  nib: default
  minho: default
  haein: default
  seonhee: default
  sejin: default
  orrin: default
  sera: default # LEFT arm still braced; bone flute and closed message cylinder at RIGHT belt.
  kesh: default
  grandma: default # Phone voice only; not drawn in Seoul until ch84.
locations: [ryu_practice_yard, mapo_tyre_base]
location_notes:
  ryu_practice_yard: >
    Drawn yard key: south gate, grey southwest office container, one southeast white van, fixed central maze
    and three north targets. Continue ch82's secured west access ladder and flat office roof, seated safely
    away from the edge. Daytime finances meeting uses the west equipment trestle, not the home container.
  mapo_tyre_base: >
    Continue ch81's old tyre-shop compound: broad rolling workshop door to concrete forecourt, trestle just
    inside it, old racks at sides, kitchenette behind partition. Orrin joins from the forecourt. Rental is
    current working space; the future purchased base and clinic are not already here.
props:
  nib_locks: >
    Weathered 105 cm ADULT, LEFT-ear V-notch, one lower LEFT fang, pinkish-tan wrap/charcoal shorts, BROWN
    rope belt, RIGHT leather pouch with dinosaur sticker, LEFT brown WOODEN sheath. Matte-black 8x30 binoculars,
    LEFT strap knot and Kett's hinge mark. Pale-blue ID, folded PAPER post drawing and cobalt pencil secured.
    Exact ch43 boots: matte dark-brown ankle-high leather work boots, broad round toes, four dull gunmetal
    eyelet pairs, dark-brown round laces in small double knots, black low-heeled lug soles, heel pull tabs,
    oat-grey socks inside collars; no hooks, buckles, logos, bright trim or visible steel caps. Never barefoot.
  taeo_locks: >
    Navy jacket/black hoodie, black cargos, striped sneakers; RIGHT-eye mole; old olive backpack and faded
    orange OLD shield/open-door patch. Cracked dark-grey dinosaur-sticker phone. Healing forearm recoil bruises,
    no new injury or heart finding. Both Meridian proposals remain unsigned, with their separate owners.
continuity_notes: >
  ₩210,000,000 is the crew's audited proposed capital pool after protected wages, treatment and personal
  reserves, including existing earned balances. It is not a new prize or a transfer, and participation
  remains conditional on member approval. ₩90,000,000 is the gap to ₩300,000,000, not a bid already placed.
  Do not spend or stake the ₩210,000,000: ch90 makes that distinct decision. Minho remains undecided about Baek.
  Yeoju is a public competitive contract over finite stock in five boss territories; follow-on logistics
  is non-exclusive. No contest date, rival, detailed score weighting or two-team format revealed ahead of ch88.
  No numbered ledger entry due here. Grandma's co-op fund is a compensation reserve, not her personal money.
palette_notes: >
  Roof dusk: slate-blue. Day yard: A4 dusty ochre, warm brown, sky blue. Tyre-shop evening: warm practical
  lamp, cream paper and brown shadows against blue-grey forecourt. All lettering through lines/ui; no art text.
panels:
  - id: P01
    shape: tall
    gap: none
    bg: navy
    camera: "roof-height reverse over Taeo toward Minho at dusk"
    art: >
      ryu_practice_yard office roof, exact ch82 positions: minho, brown jacket/grey tee, olive cargos and
      boots, sits safely back from edge beside his pristine proposal. taeo's navy shoulder foreground
      remains still. Minho's LEFT grey streak catches dusk light. ACTING: uneasy honesty. Blue-grey sky,
      brown cloth shadows; no print, new building or hostile gesture.
      Minho is in the right third; Taeo is a listening shoulder at left.
    calm: top
    lines:
      - {"who": "minho", "type": "speech", "side": "r", "text": "BAEK MADE US THE SAME OFFER. I'M THINKING ABOUT IT."}
    notes: "Direct continuation of ch82's hook, repeated once."
  - id: P02
    shape: wide
    gap: short
    bg: navy
    camera: "seated knee-up two-shot of Taeo left and Minho right, folders below their faces"
    art: >
      On ryu_practice_yard roof, taeo, outdoor, rests his own unsigned offer across his knees rather than
      passing it to Minho. His hand starts to rise, then settles. ACTING: resisting an easy
      judgement. Dusk blue, dull roof grey, navy cuff. No drawn contract copy, magic or speech graphics.
      Show both faces above the separate folders, Taeo left and Minho right; neither stands.
    calm: top
    lines:
      - {"who": "taeo", "type": "speech", "side": "l", "text": "MERIDIAN'S MONEY WOULD TAKE SOME PRESSURE OFF YOUR FAMILY."}
      - {"who": "minho", "type": "speech", "side": "r", "text": "SOME OF IT. THAT'S NOT A SMALL THING."}
  - id: P03
    shape: inset-l
    gap: short
    bg: navy
    silent: true
    camera: "close on Minho looking down toward the office doorway"
    art: >
      minho, default field clothes at ryu_practice_yard roof, looks down toward the grey office's open
      doorway below the crop. His strong brows relax into worry, LEFT grey streak unmistakable.
      The day's strain shows in his eyes. Cool dusk key, plain blue-grey ground. No imagined debt
      collector, family apparition, new injury or text.
    calm: none
  - id: P04
    shape: full
    gap: short
    bg: navy
    camera: "profile two-shot on roof against the yard's north targets"
    art: >
      ryu_practice_yard roof: minho, brown jacket, turns to taeo, outdoor, with a practical frown. Taeo
