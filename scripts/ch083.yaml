      Minho sits in the left third; Taeo sits in the right third. Leave room above their knees.
    calm: top
    lines:
      - {"who": "minho", "type": "speech", "side": "l", "text": "IF YOU HAVE ANOTHER PLAN, SHOW ME THE NUMBERS."}
      - {"who": "taeo", "type": "speech", "side": "r", "text": "CAN I SHOW YOU TOMORROW?"}
      - {"who": "minho", "type": "speech", "side": "l", "text": "WITH MY MOTHER THERE. SHE CAN SUBTRACT."}
