chapter: 87
title: Dialysis
when: "The morning after ch 86's gate-side refusal, then a day visit to a provincial clinic south of Seoul. Outward travel is elided, not instantaneous. No date is lettered."
story_beats: PART_ONE_BEATS.md#87
cast:
  taeo: outdoor # Navy jacket over black hoodie, cargo trousers, black striped sneakers; under no-live-load restriction, medical review pending.
  nib: default # Ch 43 chosen boots and all locked props.
  dara: default
  sejin: default
extras:
  clinic_doctor: "Dr. Lim, fictional provincial clinician about 54, Korean woman with short greying hair, rectangular glasses, pale blue clinic shirt and charcoal trousers beneath a plain white coat, sensible shoes. Quiet authority, no saintly smile."
  clinic_nurse: "Nurse Oh, Korean man about 39, broad face, short black hair, muted teal scrubs, soft grey work shoes; practical, cheerful only when he has time. Badge is blank in art."
  han_patient: "Ms. Han, 68, Korean retired seamstress, short waved grey hair, lined face, mauve knitted vest over a soft cream blouse, dark trousers, repaired navy fabric tote. Alert, dryly amused, never infantilised."
  jang_patient: "Mr. Jang, 74, Korean retired bus driver, close grey hair, long face, brown cardigan, pale shirt, dark trousers and black slip-on shoes, old flat cap on his lap. Anxious about transport, socially proud."
props:
  nib_gear: "LEFT-ear V-notch, LEFT lower fang, brown rope belt, RIGHT dinosaur-sticker pouch and LEFT brown wooden sheath. Pale-blue ID, folded PAPER watch-post drawing and cobalt pencil with Kett's fork protected in pouch. Matte black 8x30 binoculars, black woven strap knot at LEFT neck and fork on hinge. Exact ch 43 boots: matte dark-brown ankle leather, broad round toes, four gunmetal round eyelet pairs, brown round laces in double knots, low black lug soles, heel pull tab, oat-grey sock rim; no logos, hooks, buckles or visible steel cap. Never barefoot."
  taeo_gear: "Olive backpack with faded orange knock-off OLD shield-and-open-door patch. Dark grey phone with TOP-LEFT hairline crack and green dinosaur sticker. RIGHT-eye mole, old purple-brown forearm bruises beneath sleeves. No load routed, no new injury, no cardiac clearance here."
  clinic_fuel: "Processed anchor fragments sealed in squat matte light-grey canisters with dark slate collar, two protective handles and a flat navy rectangular supplier plate. The plate stays blank until the final hook label. Medical power module is enclosed; no loose raw fragments or exposed patient-side fuel."
locations: [ryu_practice_yard, provincial_clinic]
location_notes:
  ryu_practice_yard: "Canonical south double vehicle gate, grey southwest office, southeast white van, fixed central plywood maze and north targets. Opening occurs just inside the south gate after the captain has departed."
  provincial_clinic: "New fictional provincial clinic south of Seoul, unnamed town; no existing key. Single-storey cream-brick building on a low shopping street, covered ramp at LEFT of glass entrance, bus stop across road. From entrance: narrow waiting room, reception RIGHT, consult door rear LEFT, double treatment-room door rear RIGHT. Treatment room: six dialysis stations in two rows of three, large east windows, sinks by west wall, staff desk south; north service door to locked utility alcove. Alcove contains enclosed fragment power module on north wall, canisters in a low bolted cabinet on west wall, fuel ledger on a shelf. Service route never crosses a patient's tubing. This is the clinic whose two patients are endangered in ch 100; keep Ms. Han and Mr. Jang available."
palette_notes: "Yard A4 dusty ochre/brown/sky blue. Clinic uses A4 institutional blue-white and light slate, muted teal scrubs; warm daylight at east windows humanises cream blankets and skin. Utility alcove cool grey/navy with clean white task lamp. Flat cel, hard shadows, weighted ink; no hospital horror red or decorative glow. Screens dark or simple abstract shapes; story-critical words in label ui only."
