      - {who: taeo, type: speech, side: c, text: "THEY'RE BETTER AT IT THAN ME."}
      - {who: taeo, type: speech, side: c, text: "AND I MAKE SURE THEY COME BACK."}
    notes: "Exact required answer, chained after P04 YES. A declaration of responsibility, not a new guarantee that the device prevents all harm."

  - id: P07
    shape: full
    gap: long
    bg: white
    silent: true
    camera: "high across the stands, the saved cameraman in the near foreground"
    art: >
      exhibition_arena holds still. Spectators' hands lower, even the chanting pair with mouths
