chapter: 61
title: "Yes"
when: "Continuous from ch 60, the exhibition final day. Live answer and the relocated official photograph that afternoon; online reactions and the porters' lodging that evening. No new calendar date."
story_beats: PART_ONE_BEATS.md#61
cast:
  taeo: outdoor # Navy zip jacket over black hoodie, black cargos, single-white-stripe sneakers. Bilateral white forearm dressings, palms free, small white dressing below nose; tired, no active bleed. Remains seated during live answer. Olive backpack with OLD orange shield/open-door patch; cracked dark-grey dinosaur phone.
  nib: default # Ch 43 matte dark-brown ankle leather work boots, broad round toes, four pairs dull gunmetal eyelets, double-knotted brown round laces, black low-heel lug soles, heel tabs; oat-grey socks inside collars. Adult angular scout; LEFT V-notch, single lower LEFT fang, brown rope belt, RIGHT pouch/dinosaur sticker, LEFT brown wooden sheath. Matte black 8x30 binoculars, strap knot LEFT neck, marked hinge. Folded PAPER watch-post drawing, ID and cobalt-blue marked pencil remain in pouch.
  orrin: default # Adult 230-cm stoneback, 135-cm shell height, slate terraced shell and four columnar legs. Preserve any repaired ch 37 fracture. No pet accessories.
  sera: default # River-green wrap, cream sleeves, sand cropped trousers, brown boots, long braid. LEFT bracer, slung bow, quiver RIGHT shoulder, flute RIGHT hip. No injury to either arm.
  haein: default # Slate-blue overalls, beige tee, tool belt, safety glasses on crown. Carries sealed parts bag with ch 60's permanently broken reservoir.
  sejin: default # Sage scrub shirt, olive medic rig, charcoal cargos and boots. Controls Taeo's exertion and photo access.
  minho: default # Brown work jacket, grey tee, olive cargos, knee pads, work boots; grey streak LEFT temple, radio LEFT chest, watch LEFT wrist.
  sunline: default # BILLBOARD depiction only: chestnut high ponytail, white/gold battle outfit, right-hand leaf-bladed spear. No live recruitment or appearance.
  bangbang: default # Video only: ash-blond high fringe/dark roots, plum/mustard bomber, charcoal shirt, black jeans. All displays either composited or turned away.
  dami: default # Lodging: grey hoodie, olive cargos, work boots. Porter vest and same scuffed WHITE work helmet from ch 13 on bed; this costume override preserves earlier porter scenes despite the newer sheet showing yellow. No GO FIRST cloth patch yet.
extras:
  host: "Same adult male host as ch 59–60: short side-parted black hair, navy suit, pale shirt, dark shoes, lapel mic and blank cue cards."
  cameraman: "Saved camera operator from ch 60: Korean man about 45, square glasses, close black hair, slate work vest/grey tee, black trousers, blank press lanyard. Uninjured."
  photographer: "Official still photographer, Korean woman about 35, short curly black hair, loose charcoal shirt, slate trousers, flat shoes, black camera with plain strap. Practical, used to limited space."
  ryu_crew: "The established stocky man in his forties and younger woman from Ryu Survey, red-orange work vests, muted work clothes and dark boots. They are colleagues, not anonymous servants."
  porter_roommate: "Adult woman about 30, short hair, grey undershirt, navy work trousers, sitting on lower bunk with a lunch box."
  crowd: "Mixed press and spectators. The small chanting pocket from ch 60 can be tracked separately from people who stayed quiet or helped clear the aisle."
locations: [exhibition_arena, exhibition_concourse, world_cup_ro, porters_lodging]
location_notes:
  exhibition_arena: "Carry ch 50–60 venue. Taeo's folding chair is at ramp foot; Sejin within reach. The fallen truss and ramp-side rostrum remain barricaded and powered off. Official photograph relocates to the undamaged far-side service apron: level floor and plain slate wall, broad doors behind, never beneath the failed rig."
  exhibition_concourse: "No key available: exterior pedestrian apron outside the exhibition arena. Glass arena doors, concrete paving and bus stop with blank board. No Sunline billboard here; P16–P17 cut away to the established World Cup-ro frame. Afternoon daylight, later white door spill. All public screens dark except expressly composited phone UI."
  world_cup_ro: "Use ch 3 P27 and ch 33 P32: the SAME north-side seven-storey building by Mangwon station; Sunline vinyl banner frame covers its top three floors. New sponsor skin replaces MORU MOBILE, which replaced HANEUL AIR. No relocation or extra billboard."
  porters_lodging: "No key available: a shared low-cost workers' room in Seoul, four metal bunks, narrow central aisle, two steel lockers, drying socks, cargo straps hung neatly at bed ends. Dami has the lower bunk by a small frosted window; helmet on mattress, grey hoodie still worn. One ceiling fluorescent tube. No guild signage, luxury kit or shrine to Taeo."
palette_notes: "Arena/concourse extends A4 clean blue-white institutional light with slate shadows; exterior afternoon desaturated concrete and sky-blue. Billboard uses Sunline's muted white/gold with one restrained sponsor blue, never link amber. Lodging borrows A4 shop fluorescent green-white, grey-green shadows, cheap warm bedding. Screens are ordinary pale app light. Flat cel rendering and warm near-black line weight; readable text, all bubbles, SFX and labels are separate lettering."
panels:
  - id: P01
    shape: strip
    gap: none
    bg: white
    silent: true
    camera: "extreme close-up from beside Taeo's bandaged right wrist toward the mic grille"
    art: >
      exhibition_arena, exact continuation: taeo's white-dressed RIGHT forearm supports the plain black
      mic just below his mouth, small nose dressing above. Five fingers, a slight tremor he cannot
      hide. Black hoodie collar. White worklight, hard slate shadows. No new blood, glowing palm,
      readable microphone logo or second mic.
    calm: none
    notes: "ch 60 P52 handoff. Taeo is seated at the ramp foot; he has permission for a brief seated answer, then departure."

  - id: P02
    shape: wide
    gap: short
    bg: white
    camera: "from behind the chanting fans across the aisle to the distant chair"
    art: >
      exhibition_arena, backs of two chanting fans at frame left, one phone held out with screen
      turned away. Across a broad cleared aisle bandaged taeo sits small beside nib and orrin;
      sejin stands close. Nearby spectators watch the chanters with discomfort. White overhead
      worklights, muted blue-white and slate. No uniform mocking crowd or restarted rig lights.
    calm: top
    lines:
      - {who: crowd, type: shout, side: l, text: "HIS SUMMONS GO FIRST!"}

  - id: P03
    shape: inset-r
    gap: short
    bg: white
    silent: true
    camera: "tight on Nib in profile at Taeo's shoulder height"
    art: >
      nib (default, adult angular face) at exhibition_arena looks at taeo rather than the crowd,
      weathered mouth closed, eyes steady, LEFT ear notch clear. Binoculars high on chest, strap
      knot at LEFT neck. White worklight, plain slate background. No cute expression, amber
      pulse, fantasy crown or text.
    calm: none

  - id: P04
    shape: wide
    gap: long
    bg: white
    camera: "eye-level close front view of the seated operator"
    art: >
      taeo (outdoor, forearm and nose dressings) at exhibition_arena lifts his eyes over the mic,
      frightened but decided, mouth making one simple word. One mole beneath RIGHT eye. Chair
      back edge visible so he cannot read as standing. White worklight, hard slate shadows;
      no victory glow, painless posture or crowd text in art.
    calm: top
    lines:
      - {who: taeo, type: speech, side: c, text: "YES."}

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 61 · YES"

  - id: P06
    shape: tall
    gap: short
    bg: white
    camera: "low three-quarter with Taeo seated centre and the crew on either side"
    art: >
