    calm: none
    notes: "Full held silence before the first clap."

  - id: P08
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up at chest height on the cameraman's hands"
    art: >
      Saved cameraman's hands at exhibition_arena come together for the first clap, slate vest
