chapter: 49
title: The Cartographer
when: "Same AAO practical morning as ch048's hook, licence collection that afternoon; exhibition application at the Ryu yard that evening; public bracket draw several days later. No calendar date fixed."
story_beats: PART_ONE_BEATS.md#49
cast:
  taeo: outdoor
  nib: default # Ch043 chosen boots, binoculars and established pouch contents throughout.
  orrin: default
  sera: default
  park_doyun: default
  minho: default
extras:
  aao_clerk: "Woman about 45, navy cardigan over pale-blue shirt, short straight bob, rectangular glasses, precise and kindly unsentimental."
  exhibition_host: "Man about 35 in a slate suit and cream open-collar shirt, handheld microphone; heard through venue PA."
  constructs: "Exactly SEVEN nonverbal constructs controlled by Doyun: slender ivory-grey articulated frames, faceless smooth wedge heads, narrow slate joints, long five-fingered hands and flat split feet. Adult-height physical geometry, no faces, clothes, cores, runes or light. Distinguish their positions, not personalities."
locations: [aao_practical_hall, aao_office, ryu_practice_yard, exhibition_draw_hall]
location_notes:
  aao_practical_hall: "Continue ch048: south entrance, north equipment doors, east operator rail, high west windows, central grey padded lane. Training stations from south to north: folding wall maze, hinged bridge with padded counterweight arm, sliding exit shutter. A weighted orange dummy must reach north mat. All are physical indoor test apparatus, no gate or boss."
  aao_office: "Use locations/aao_office key and notes: glass corridor entrance southeast; navy waiting bench southwest; central desk northern half; dark twin monitors, east window, filing shelves northwest. Licence handover uses the visitor side of that desk. Clerk temporarily occupies assessor chair; no Chae appearance implied."
  ryu_practice_yard: "Canonical keyed maze, southwest grey office and southeast van. Evening application at west equipment trestle. Residential container remains separate from office."
  exhibition_draw_hall: "New event pavilion foyer: west daylight glass, north stage with plain draw screen, east registration desk, central aisle and rows of stacking chairs. Diagram on screen only via same-panel ui."
props:
  boots: "Nib's ch043 pair: matte dark-brown ankle-high leather lace-up work boots, broad round toe, four pairs of dull gunmetal round eyelets, dark-brown round laces in small double knots, plain black lug soles/low heel, heel pull tabs, oat-grey short socks inside collars. No hooks, buckles, logos, bright trim or visible steel caps."
  orrin_shell: "Preserve the existing ch037 shell injury and any subsequent established repair; this chapter adds no damage and does not heal it by omission."
  nib_locks: "Weathered adult 105 cm; LEFT-ear V-notch, one lower LEFT fang, brown rope belt, RIGHT pouch with dinosaur sticker, LEFT brown wooden sheath; chosen ch043 boots. Matte-black 8x30 binoculars high on chest, strap knot LEFT neck, fork on hinge. Pale-blue arrival ID, cobalt fork-marked pencil, folded PAPER drawing retained. No spare naked blade on course."
  taeo_locks: "ONE RIGHT-eye mole; black hoodie/cargos, navy jacket, striped black sneakers. Old orange shield/open-door patch on olive backpack; dark-grey top-left-cracked dinosaur phone. Existing carrying bruises visible when cuffs lift."
palette_notes: "AAO A4 blue-white, slate, navy; test dummy muted safety orange, mechanical constructs ivory-grey without interface cyan. Yard ochre/warm brown/sky blue by day, amber practical lamp and navy evening. Draw hall institutional blue-white/slate adapted to west glass. Cyan reserved for Taeo's private interface; amber in his RIGHT palm only for Nib, slate-green for Orrin."
