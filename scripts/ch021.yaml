      - {who: nib, type: whisper, side: l, text: "...ASK. FIRST."}
    notes: "Eunchae taught him to read with flashcards (ch 9; ch 022 P04 has him sounding out the notice). The rule hangs above his head: let the composition say it."

  - id: P51
    shape: wide
    gap: short
    bg: white
    camera: "side view at floor level"
    art: >
