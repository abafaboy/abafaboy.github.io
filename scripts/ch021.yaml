      off his knee, one hand slapping the floor: normal style with comic shock lines round his head. Lamp light. No letters or numbers in the art.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "YOU FELL ASLEEP ON WATCH."}
      - {who: taeo, type: shout, side: r, text: "NIB!"}
    notes: "A scout's rebuke to a sentry. Usually Nib keeps the watch (ch 2, ch 19)."

