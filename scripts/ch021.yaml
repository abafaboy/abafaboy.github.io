      - {who: taeo, type: speech, side: r, text: "I KNOW."}
    notes: "Beat, verbatim: 'I'M NOT STAYING FOR YOU.' (P53) and these two chained bubbles. 'I KNOW.' answers as in ch 2 ('YOU STILL DID.' 'I KNOW.'). 'MIGHT': ch 19 ('IF IT MIGHT OPEN THE DOOR, IT'S MINE TO GIVE.') and P37. Nib's arc beat 4: he stays as a partner, not a possession."

