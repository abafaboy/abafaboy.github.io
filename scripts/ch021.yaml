      - {kind: label, text: "OR VACATE WITHIN 30 DAYS.", at: [0.5, 0.43], size: 30, color: "#1d1917", rot: 0, notes: "on the second blank band"}
      - {kind: label, text: "UNIT 402 · DEPOSIT BALANCE ₩1,600,000", at: [0.5, 0.56], size: 22, color: "#1d1917", rot: 0, notes: "on the darker body line"}
    lines:
      - {who: narr, type: footnote, text: "*₩1,600,000 ≈ US$1,150"}
    notes: "HOOK (beats verbatim): rezoned GATE ADVISORY ZONE; rent +40% or vacate in 30 days; deposit balance ₩1,600,000 (₩5,000,000 less the ₩3,400,000 signed away in ch 17; footnote as ch 17). One door only: ch 022 P01 opens at 5:40 AM by pulling back to all twelve. Same notice and wording as ch 022 P03 (black header bar, blue stamp)."

