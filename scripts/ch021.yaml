      No letters or numbers in the art.
    calm: none
    lines:
      - {who: narr, type: tag, text: "11:40 PM"}
    notes: "Beat: night, Nib returns with two canned coffees, bought with his own money. He came up the stairs past every door, so he has already seen the notices (P57)."

  - id: P50
    shape: wide
    gap: short
    bg: white
