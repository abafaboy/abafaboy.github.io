  # ---------------- HOOK ----------------
  - id: P58
    shape: narrow-r
    gap: short
    bg: white
    camera: "from the corridor just south of the open door, looking north past its free edge"
    art: >
      In the 4F corridor, from just south of 402's open door: the door stands out across the corridor with its inner face toward us, bare. In the narrow gap between its free edge and the rail,
      Taeo's face: he has stepped out in his sneakers trodden down at the heel, the can in his hand, come round the door to look at its other side, and he is reading something we cannot see yet.
      The blood is leaving his face. Cold white tube light; beyond the rail, the street's sodium glow. No letters or numbers in the art.
    calm: none
    silent: true
    notes: "The notice is on the door's outer face, which faces the stairs while the door is held open (taped at 8:40 PM, P48), so Taeo never saw it. Sneakers trodden at the heel as in ch 022 P02."

  - id: P59
    shape: bleed
    gap: short
    bg: black
    camera: "Taeo's point of view: the outer face of his open door"
    art: >
      THE HOOK. Taeo's point of view in the corridor, facing the outer face of his own open door: the slate-grey steel fills the frame, the small blank brass number plate near the top.
      Taped at eye height with clear tape at its top corners, one corner lifting: the notice (props.notice, the same sheet as ch 022 P03), a printed form drawn in blocks: a solid black header bar,
      two clean empty bands below it where large type goes, grey squiggle body lines with one darker line among them, and a round BLUE stamp at the lower right (abstract, no characters).
      At the right edge, the corridor rail and the sodium glow of the street four floors down. At the bottom of the frame, Taeo's hand holding the open can, knuckles pale.
      Cold white light, blue-grey shadow; the sheet is the brightest thing. The frame's bottom edge breaks its border into the black page. No letters or numbers in the art.
    calm: none
    ui:
