    notes: "Runner: Haru's dinosaur facts at gravity moments. True: tooth-enamel isotopes show Camarasaurus moved at least 300 km between its lowland basin and the highlands and came back, probably every year (Fricke et al., Nature 2011)."

  # ---------------- NIGHT: Nib comes back ----------------
  - id: P48
    shape: wide
    gap: long
    bg: white
    camera: "high angle from the ceiling corner above the bed, looking down the room toward the door"
    art: >
      Later, night palette: Taeo (taeo, default) asleep sitting up on the floor against the bed's drawers, chin on his chest, the phone face-down on his knee, the desk lamp on.
      At the far end of the room the front door still stands open; out in the corridor a stranger's shadow lies across the floor just past the doorway (no figure seen). The taped sheet on the
      bathroom wall; the upside-down white mug on the folding table. Warm lamp, deep blue-grey, cold corridor white. No letters or numbers in the art.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "8:40 PM"}
    sfx:
      - {text: "RRRIP", style: quiet, at: [0.86, 0.12], size: S, rot: -6}
    notes: "His first sleep since before ch 20's party. The shadow and the tape are the landlord's agent taping the notice onto 402's open door and onto every door in the building. Nobody knocks. Don't explain; P59 shows what it was."

