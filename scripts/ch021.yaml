      the taped sheet hangs at Taeo's eye height, well above Nib's head; the open door and the corridor light beyond it on the right. Nib reads it slowly, lips moving, a can in each hand,
      his ears tilting back a fraction. Lamp light warm on the sheet. No letters or numbers in the art.
    calm: top-right
    ui:
      - {kind: label, text: "1. ASK FIRST.", at: [0.40, 0.30], size: 34, color: "#2B2523", rot: -2, notes: "move onto the sheet once the art exists"}
