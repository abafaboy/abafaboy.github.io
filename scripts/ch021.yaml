chapter: 21
title: Not Requested
when: "Saturday night from ch 20's 10:47 PM confession into Sunday. About 11:00–11:25 PM the flat; 3:00 AM waiting; 5:45 AM Ryu yard; 9:10 AM AAO weekend duty desk; 11:40 AM home and the rule sheet before noon. Taeo's existing weekend day shift runs off-panel noon–6 PM; Nib is alone at the river in late afternoon. 7:02 PM Grandma's call; 8:40 PM notice delivery; 11:40–11:55 PM Nib's return and the notice. Ch 22 opens Monday at 5:40 AM. No date is lettered."
story_beats: PART_ONE_BEATS.md#21
cast:
  taeo: default     # P01–P06 outdoor (navy zip jacket over the black hoodie, the olive backpack with the faded orange shield-and-open-door patch), walking home from ch 20's party. P07–P29 default (hoodie, socks; the jacket on its hook by the door, the backpack on the rack's end hook; one jacket sleeve on in P29). P30–P39 outdoor (the AAO trip, backpack). P40–P59 default; in P58–P59 his sneakers are shoved on, trodden down at the heel (as ch 022 P02). Exactly one small mole, under his RIGHT eye; the dark grey phone with the hairline crack top-left and the green dinosaur sticker; the RIGHT-palm gravel graze remains under the square plaster from ch 17; no active nosebleed
  nib: default      # barefoot; V-notch in the LEFT ear; one small lower fang on the left; brown rope belt; leather pouch on the RIGHT hip with Haru's dinosaur sticker on its flap (ch 8); knife in the brown wooden sheath on the LEFT hip; ch 19's binoculars (props.binoculars) on their knotted strap high on his chest in every panel EXCEPT the flashback (P02) and the March chibi (P33). Adult and weathered, never cute outside chibi.; healing RIGHT shoulder-blade graze from ch 17. Pale-blue ID card and Eunchae's cobalt-blue pencil (pink eraser, silver ferrule, chewed end, Kett's fork near the eraser) remain in the RIGHT-hip pouch; the original folded PAPER post drawing stays at the flat; Kwak's knee pads are stored by the entry step; Nib uses his denim-blue fleece blanket from ch 2 (the foil blanket is stored at the mart)
  haein: default    # P23–P27 only: work overalls over a grey hoodie, tool belt, safety glasses pushed up on her head; Minho's family look
  chae: default     # P31–P38: chin-length brown bob, navy cardigan over a white collared shirt, ID card on a lanyard, the blue-covered work tablet
  grandma: default  # video only, P43–P47
  haru: default     # video only, P43, P45, P47
extras:
  neighbour_403: "ch 022's north neighbour on 4F, first seen here (match ch 022): a young father in his early thirties, grey T-shirt and track trousers, bed hair, tired and kind, a sleeping toddler of about two slumped on his shoulder"
  aao_waiting: "four or five people waiting in the AAO lobby: a man in a courier jacket, a student with a backpack, an older woman with a shopping bag, an older man in a flat cap; every one of them looking down at a phone (screens dark)"
  aao_staff: "two AAO reception staff in the office's navy cardigans and lanyards"
props:
  cup: "THE CUP (LOCATIONS.md): a plain white ceramic mug with one thin green band, on the folding table, empty since ch 19's integration. Nib turns it upside down in P16; it stays that way until he rights it in P53."
  drawing: "Nib's paper drawing of his post with the white pebble on its pale patch (ch 19 props.drawing), on the folding table beside THE CUP throughout. Nobody touches it."
  blanket: "Nib's faded denim-blue fleece blanket (ch 2), folded on the floor against the wall beside the entry step, by the door: his watch spot in the flat (ch 6, ch 19)."
  binoculars: "ch 19's locked prop: compact 8x30 porro-prism field binoculars in MATTE BLACK rubber armour, black eyecups, a plain black woven neck strap knotted short at the LEFT side of his neck so they ride high on his chest; Kett's mark scratched on top of the hinge plate. Nothing shiny."
  cans: "two short canned coffees from a convenience store, bought with Nib's own money: plain cream-and-brown cans with one stripe, no letters or logos. Opened in P55; both empty on the corridor floor by dawn (ch 022 P02)."
  sheet: "'1. ASK FIRST.': one sheet of white A4 printer paper from Chae's printer, written in black marker, taped with clear tape at Taeo's eye height on the bathroom's outside wall, facing the bed (LOCATIONS.md; world/floorplans/taeo_flat.png item 13). Blank in the art; the letterer writes it."
  notice: "the landlord's notice, the same sheet as ch 022 P03: a white A4 printed form with a solid black header bar, two clean bands below it for large type, grey squiggle body lines (one of them darker: the deposit line), a round BLUE stamp at the lower right (abstract, no characters), clear tape at the top corners. Taped at 8:40 PM at eye height on the OUTER face of 402's open door, and on every other door in the building."
  doorstop: "the flip-down doorstop at the foot of 402's door, on its inside face (the common Korean horseshoe kind). Down from P20 to the end of the chapter, so the door stays open."
locations: [mangwon_street, taeo_street, taeo_flat, taeo_building, nib_post, ryu_practice_yard, aao_office, mangwon_riverside, grandparents_house]
location_notes:
  mangwon_street: "LOCATION_BRIEF #4 key (the walk home): a narrow residential lane in Mangwon-dong at night, low red-brick villas, gas meters, tangled overhead wires, parked scooters, one streetlight. The streetlight is on taeo_street, as fixed by ch 20 P54–P60."
  taeo_street: "LOCATIONS.md sub-key: the two-lane bus street and the corner bus stop 30 m south of the street door. NO advisory-zone sign on the lamp post yet: ch 022 P01 bolts it on at dawn."
  taeo_flat: "LOCATIONS.md and the floor plan. Looking in from the door: kitchen strip LEFT, bathroom then desk RIGHT, bed far right by the window; looking out toward the door the kitchen strip is RIGHT and the bathroom LEFT. The door opens OUT into the corridor and hinges on its north jamb (from inside: handle LEFT, hinges RIGHT). From P41 the sheet is taped on the bathroom's outside wall facing the bed."
  taeo_building: "LOCATIONS.md sub-key, as ch 022 sets it: twelve studios, three to a floor on 2F–5F. On 4F, 401 is the south neighbour, 402 Taeo (the middle door), 403 the north neighbour toward the stairs. The open-air corridor faces the bus street (west), rail on the street side, doors on the east side, stairs at the north end. 402's door, held open, stands out across the corridor with its outer face toward the stairs."
  nib_post: "Flashback only (P02–P03). First drawn view of Nib's post on the other side (ch 4: 'WALL HERE. TREE BEHIND IT. YOU COULD SEE THE LOWER PATH. AND THE WHITE BIT.'): a wall of rough fitted stones on a slope, chest-high on Nib (ch 19 notes), one crooked tree behind it, a lower path winding below, a pale white stone outcrop far off. Desaturated, soft-edged."
  ryu_practice_yard: "Drawn ryu_practice_yard key: 18 x 26 m, south-centred double vehicle gate, grey corrugated office container southwest, its keyed step plus a removable wheelchair ramp, one visible white van southeast facing west, plywood maze in the centre, three targets at the north fence, equipment trestle west of maze. Fleet total TWO after ch 12's tow: the other van is in the adjoining northwest service bay, outside the key's main view. A low workshop stands beyond that northwest boundary; its WEST stair leads to ryu_yard_roof, the workshop roof introduced in ch 20. The office container is not the party roof. No new repossession marks until ch 22."
  aao_office: "LOCATION_BRIEF id (Ability Assessment Office). The lobby: rows of chairs, a ticket machine, a reception counter, a wall TV, green exit signs. Chae's assessment room (ch 3–4): a desk, the hand plate and analogue gauge on a stand, a monitor, two stools, and a small office printer on a side cabinet (decided here)."
  mangwon_riverside: "ch 019's spot (match it): the top of a stepped concrete embankment in Mangwon Hangang Park with a low concrete parapet, chest-high on Nib, seat-high for Taeo; Seongsan Bridge's row of steel arches downstream (right, facing the river)."
  grandparents_house: "Seen only in the video image (P43, P45, P47): the kitchen table in Haeseong under warm amber light."
palette_notes: "Lane and bus street at night (P01, P06): sodium orange, deep navy. Flashback (P02–P03): desaturated cool grey, soft edges; the interface cyan #3FE3F2 of the circle is its only colour. Flat at night (A4): warm lamp orange on the desk side, deep blue-grey on the kitchen side; once the door is open, the corridor's cold white tube light is the accent. Corridor at night: cold white, blue-grey, sodium orange from the street. Flat by day (A4 morning): cool grey-blue, soft blue shadows, a yellow band from the window. Ryu yard at dawn after rain: muted wet ochre, grey-blue puddles, warm brown shadows; the orange mesh the one accent. AAO (A4): clean blue-white, light slate, navy cardigans, green exit signs; interface cyan only as window light on Taeo (P34–P38). Riverside at golden hour (as ch 019): peach to pale blue sky, silver-gold river, pinker than the link amber. Grandma's kitchen on video (A4): warm amber, brown, steam white. Amber #F2A93B: Nib's eyes only, except one faint pulse in Taeo's palm in P55 (none in P22). No red in the art of this chapter; the notice's stamp is blue (ch 022 P03)."

panels:

  # ---------------- COLD OPEN: under the streetlight ----------------
  - id: P01
    shape: wide
    gap: none
    bg: black
    camera: "eye level from just behind Taeo's right shoulder, under the streetlight, looking down the lane at Nib"
    art: >
      Straight on from chapter 20's last panel. A narrow residential lane in Mangwon-dong at night (mangwon_street) on the walk home from the Ryu yard:
      low red-brick villas, gas meters, tangled overhead wires, two parked scooters, dry asphalt. One streetlight throws a hard-edged cone of sodium-orange light.
      In the near foreground, inside the cone, Taeo (taeo, outdoor: navy zip jacket over the black hoodie, the olive backpack with the faded orange shield-and-open-door patch)
      seen from just behind his right shoulder, hands hanging empty, shoulders down. About four metres ahead, just past the edge of the light, Nib (nib, default:
      binoculars on their knotted strap high on his chest) has stopped with his back to Taeo: very still, weight even on both bare feet, head turned a few degrees so the
      V-notch in his LEFT ear and the line of his jaw catch the orange. The empty dark asphalt between them is the subject.
      Sodium orange and deep navy, one hard shadow tone, no glow haze. Signs blank. No letters or numbers in the art.
    calm: top
    lines:
      - {who: narr, type: tag, text: "MANGWON-DONG · 10:47 PM"}
      - {who: nib, type: speech, side: r, text: "AGAIN."}
      - {who: taeo, type: speech, side: l, text: "\"CONSENT: NOT REQUESTED.\""}
    notes: "Starts on ch 20's hook: Taeo stopped under a streetlight and told Nib what the log says; Nib stopped (the binoculars, the street, the distance between them). The confession is at about 10:47 PM on taeo_street (ch 20). 'AGAIN.' makes him say it twice."

  - id: P02
    shape: vignette
    gap: short
    bg: black
    camera: "FLASHBACK: from behind and above Nib's right shoulder at the wall, looking down the slope"
    art: >
      FLASHBACK, Nib's memory of the moment he was taken: desaturated cool grey, soft-edged, the borders fading into the black page.
      Nib's watch post (nib_post), as he drew it in ch 4: a wall of rough fitted stones on a slope, chest-high on him, one crooked tree behind it, a lower path winding down below,
      and far off a pale white stone outcrop (the white bit). Nib (nib, default, WITHOUT binoculars, ID card, blue pencil or dinosaur sticker: none had reached him then) kneels at the wall on watch, seen from behind and above
      his right shoulder, one hand shading his eyes. Under his bare feet, without warning, a ring of cyan light (#3FE3F2) is opening on the ground: the only colour in the panel.
      His head has just begun to turn down toward it; his right hand is moving across to the knife on his LEFT hip. The sky is pale and colourless (flashback desaturation;
      give it no colour). No other figure anywhere and nobody on the path. No letters or numbers in the art.
    calm: none
    silent: true
    notes: "Nib's side of ch 1 P54 (he came out of the seam with the knife half drawn). First drawn view of his post: keep it simple so later chapters can match it. Do not show Kett."

  - id: P03
    shape: vignette
    gap: short
    bg: black
    camera: "FLASHBACK: exactly the same framing as P02"
    art: >
      FLASHBACK, exactly the same framing as P02: the stone wall, the crooked tree, the lower path, the white outcrop. Nobody there. The cyan light is gone.
      A faint scuff in the dirt where he knelt. Desaturated cool grey, soft-edged, fading into black. No letters or numbers in the art.
    calm: none
    silent: true
    notes: "Same camera as P02 on purpose (before and after). 'HE'D FIND MY PLACE EMPTY' (ch 2, ch 9) as a picture: what Kett found, or what Nib sees when he shuts his eyes. Never explained."

  - id: P04
    shape: strip
    gap: short
    bg: black
    camera: "extreme close-up of Nib's eyes, back in the present, turned over his shoulder toward Taeo"
    art: >
      Back under the streetlight. An extreme close-up strip of Nib's eyes and brow, his head now turned back over his shoulder toward Taeo: sodium orange on one side of his face,
      navy shadow on the other; the amber eyes (#F2A93B) hard and dry, brow low, the long nose in profile at the frame edge. No tears. Cold anger, held still.
      Nothing else in frame. No letters or numbers in the art.
    calm: none
    lines:
      - {who: nib, type: speech, side: c, text: "NOBODY ASKED ME."}
    notes: "The cold open's question: what will he do? Here he blames nobody; in the flat (P12) he names Taeo."

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 21 · NOT REQUESTED"

  # ---------------- THE FLAT: the rage ----------------
  - id: P06
    shape: full
    gap: long
    bg: white
    camera: "high angle from a third-floor villa window across the bus street, looking down"
    art: >
      taeo_street at about eleven at night from above: the two-lane bus street running south, the corner bus stop with its lit advertising screen (plain pale shapes only), and Taeo's
      five-storey red-brick studio block with its open ground-floor piloti and the open-air corridors on each floor under cold white tube lights.
      Nib walks ahead toward the glass street door, small and straight-backed; Taeo follows about three metres behind, head down, hands in his jacket pockets.
      Neither looks at the other, and the gap between them never closes. Sodium-orange streetlight, deep navy shadow; the street still dry. No sign on the bus-stop lamp post.
      Signs blank. No letters or numbers in the art.
    calm: top
    silent: true
    notes: "Twelve minutes' walk from the Ryu yard (LOCATIONS.md). The GMA advisory-zone sign goes up only in ch 022 P01, so it is NOT here."

  - id: P07
    shape: full
    gap: short
    bg: white
    camera: "establishing, the studio from the entry, looking east (ch 1 P47's camera)"
    art: >
      Taeo's studio flat (taeo_flat key and floor plan), seen from the entry looking in: the kitchen strip on the LEFT; on the RIGHT the bathroom door; at northwest below the north window the desk with the framed photo (parents, Taeo at 14, baby Haru) on the shelf above; far right by the curtained window, the bed on storage drawers with its grey duvet; the clothes rack with black
      hoodies and the olive backpack hung patch-out on its end hook; in the middle the low pale-wood folding table with THE CUP (props.cup) and Nib's paper drawing with the
      white pebble (props.drawing) on it. Taeo (taeo, default: black hoodie, socks) stands at the desk with his hand still on the desk lamp he has just switched on: warm orange
      on the desk side, deep blue-grey on the kitchen side. Nib (nib) has walked past him and stands in the open floor between the bed and the folding table, looking down at
      his own bare feet. The door behind the camera is shut. Hard cel shadows. No letters or numbers in the art.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "11:00 PM"}
    notes: "Nib stands exactly where the summon circle opened in ch 1 (1.6 m from the bed's head end, between the bed and the folding table; LOCATIONS.md)."

  - id: P08
    shape: wide
    gap: short
    bg: white
    camera: "overhead, straight down on the floor between the bed and the folding table (ch 1 P52's camera)"
    art: >
      Straight down from the ceiling: Nib (nib) stands alone on the bare floor exactly where the summon circle opened in chapter 1, head bowed, looking at the floor.
      The desk lamp's warm light pools around him in a rough round shape: an echo of the circle, NOT a drawn circle, and no cyan anywhere. His shadow falls long toward the
      kitchen side. At the frame edges: the grey duvet (bottom), the folding table with the white mug and the paper drawing (top), and Taeo's socked feet by the desk (right).
      Flat colours, hard shadows. No letters or numbers in the art.
    calm: top
    lines:
      - {who: nib, type: speech, side: c, text: "IT OPENED HERE."}
      - {who: nib, type: speech, side: c, text: "I HAD AN HOUR LEFT ON WATCH."}
    notes: "'An hour left': his relief was due (ch 2, ch 9: 'SOMEONE WAS COMING TO TAKE OVER'). Taeo has worked enough night shifts to know what the last hour of one is. Nobody explains it."

  - id: P09
    shape: wide
    gap: short
    bg: white
    camera: "low, at Nib's eye height (105 cm): two-shot, Nib's back three-quarter in the foreground, Taeo beyond by the desk"
    art: >
      Nib (nib) in the left foreground, seen from behind his left shoulder (the brown wooden sheath on his LEFT hip, the binocular strap across his back), looking up at Taeo.
      Taeo (taeo, default) stands by the desk on the right, lit from below by the lamp: hollow-eyed, guilty, holding very still, his hands half lifted and then not knowing where to go.
      From this low camera Taeo is tall and Nib is small, and it is Nib who holds the room. Background: the lamp-lit wall and the shelf with the framed photo, simplified.
      Warm orange on Taeo's side, blue-grey on Nib's. No letters or numbers in the art.
    calm: top-right
    lines:
      - {who: nib, type: speech, side: l, text: "WHEN YOU PRESSED IT, WHAT DID YOU WANT?"}
      - {who: taeo, type: speech, side: r, text: "...TO SEE WHAT WOULD HAPPEN."}
    notes: "His own ch 1–2 words ('I JUST WANT TO SEE.' / 'I WANTED TO SEE WHAT WOULD HAPPEN.'): the truth, and the worst possible answer."

  - id: P10
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up from Taeo's eye line, looking down onto Nib's face"
    art: >
      Nib's face from Taeo's eye line, tilted up: flat, level, deadly calm. Lamp light on one side; the amber eyes do not blink. One small lower fang shows at the LEFT corner
      of his mouth; his long ears are laid back. A narrow, weathered adult face with lines under the eyes, never cute. Plain blue-grey background. No letters or numbers in the art.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "NOW YOU'VE SEEN."}

  - id: P11
    shape: wide
    gap: short
    bg: white
    camera: "over Nib's right shoulder, looking back down the room toward his watch spot by the door"
    art: >
      Over Nib's right shoulder (the leather pouch on his RIGHT hip with Haru's small dinosaur sticker on its flap, close in the foreground): down the room toward the entry,
      the floor against the wall beside the entry step, where his faded denim-blue fleece blanket (props.blanket) lies folded: his watch spot, where he has sat up every night by
      the door. Nib points at it with two fingers without looking at Taeo. The shut grey steel door beyond it; the navy jacket on its hook. Lamp light warm behind the camera,
      cool shadow on the floor by the door. No letters or numbers in the art.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "EVERY NIGHT I SAT THERE AND KEPT WATCH."}
      - {who: nib, type: speech, side: l, text: "OVER YOU."}
    notes: "His post in the flat (ch 6, ch 19: 'Nib usually keeps watch while Taeo sleeps')."

  - id: P12
    shape: full
    gap: short
    bg: white
    camera: "low angle from floor level in front of Nib, looking up at him; Taeo beyond"
    art: >
      Nib (nib) has turned to face Taeo full on. The low camera lets the 105 cm scout loom for once: feet planted, shoulders square, binoculars high on his chest, both hands open
      at his sides with the fingers slowly curling, NOT touching the knife. Jaw set, the small lower fang on the LEFT showing, eyes steady and dry: the quiet is the rage.
      Behind him, drawn simpler, Taeo stands by the desk, and the lamp throws Taeo's shadow huge across the kitchen-side wall and up over the ceiling, as tall as the room and helpless.
      Warm lamp key, deep blue-grey shadows. No letters or numbers in the art.
    calm: top
    lines:
      - {who: nib, type: speech, side: c, text: "YOU TOOK ME."}
    notes: "Beat: Nib's rage, quiet and worse than shouting. Letter it as a plain speech bubble at normal size, no bold: the plainness is the point. Nib's arc beat 4 (he rages at the consent log)."

  - id: P13
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up from Nib's low eye line, looking up at Taeo"
    art: >
      Taeo's face from below: mouth open on the start of an excuse, one hand lifting palm-out, eyebrows up in reflexive pleading. The small mole under his RIGHT eye.
      Lamp light from below; plain wall behind. No letters or numbers in the art.
    calm: left
    lines:
      - {who: taeo, type: nervous, side: r, text: "I DIDN'T KNOW IT WOULD—"}
    notes: "He starts his ch 2 defence ('I DIDN'T KNOW IT WOULD BE SOMEONE.') and stops himself in P14. A small added beat: he hears himself."

  - id: P14
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up, side-on, Taeo's mouth and jaw"
    art: >
      An extreme close-up strip, side-on: Taeo's mouth closing on the unfinished word, lips pressed together, a muscle tightening along the jaw; the lifted hand has dropped out of frame.
      He is swallowing the excuse. Warm lamp light on the cheek, one hard shadow under the jaw. Nothing else in frame. No letters or numbers in the art.
    calm: none
    silent: true

  - id: P15
    shape: wide
    gap: short
    bg: white
    camera: "eye level, side-on profile two-shot across the room"
    art: >
      Side-on, both in profile: Taeo (left) has straightened up for the first time in the scene, shoulders back, hands open at his sides, looking straight down at Nib instead of away.
      Nib (right) looks up at him, unmoved. Low between them, the folding table with the white mug and the paper drawing; the lamp on the desk behind Taeo.
      A wide stretch of empty floor between them. Warm key on Taeo, blue-grey on Nib. Simplified background. No letters or numbers in the art.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "...YES."}
      - {who: taeo, type: speech, side: l, text: "NOT KNOWING DOESN'T MAKE IT NOT TRUE."}
    notes: "Beat, verbatim. Taeo's arc beat 3: he faces the wrong he did and refuses the ch 2 defence. He says no 'sorry' in this scene (ch 19: 'SORRY'S FOR CUSTOMERS.')."

  - id: P16
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up from above on the folding table"
    art: >
      From above: Nib's olive-green hand (faint pale scars on the forearm) turns THE CUP, the plain white mug with one thin green band, upside down on the pale wood of the folding table,
      slowly and precisely, and lets go. It was empty. At the frame edge, a corner of the paper drawing with the white pebble. Lamp light, one hard shadow. Nothing else in frame.
      No letters or numbers in the art.
    calm: none
    silent: true
    notes: "THE CUP of ch 2 ('YOU FIRST.') turned over. It stays upside down until Nib rights it in P53. Don't explain."

  # ---------------- THE OPEN DOOR ----------------
  - id: P17
    shape: tall
    gap: short
    bg: white
    camera: "low, from behind Nib at his own height, looking down the room at the entry"
    art: >
      From behind Nib (nib: spiky black hair, the V-notch in his LEFT ear, brown rope belt, the pouch on his RIGHT hip and the brown wooden sheath on his LEFT, bare heels) as he walks
      toward the door. At the end of the room, in the narrow tiled entry, stands Taeo (taeo, default), between Nib and the shut grey steel door, and from this low camera he fills the
      doorway: 181 cm against 105. His face is torn; one step and one arm would stop him. The lever handle on the door's LEFT edge (seen from inside), the grey shoe cabinet on the
      right, the navy jacket on its hook, Nib's folded blanket against the wall by the entry step. The lamp behind the camera throws Nib's small shadow forward to Taeo's feet.
      Keep the upper part of the frame plain for narration. No letters or numbers in the art.
    calm: top
    lines:
      - {who: taeo, type: float, text: "EVERYTHING IN ME WANTED TO STAND IN THE DOOR."}
    notes: "Taeo's control flaw (STORY_BIBLE §6) at full strength, and the size difference that makes it dangerous."

  - id: P18
    shape: wide
    gap: short
    bg: white
    camera: "from the open-air corridor, looking in through the doorway (east): ch 2 P13's camera"
    art: >
      From the 4F corridor looking in (taeo_building): the grey steel door has swung wide, out into the corridor at frame LEFT (it hinges on its north jamb).
      Inside, Taeo (taeo, default) has stepped back against the grey shoe cabinet beside the doorway, one arm still out from pushing the door, clearing the way: steady, eyes wet but
      not crying, mouth a straight line. Nib (nib) stops one step short of the threshold, the warm lamp-lit room behind him, cold white corridor light on his face.
      Corridor: cold white tube light from above, a sodium-orange glow rising from the street below. No letters or numbers in the art.
    calm: top-right
    lines:
      - {who: taeo, type: speech, side: l, text: "IT'S OPEN. YOU CAN GO."}
    notes: "Motif: the open door. Same camera and same words as ch 2 P13, where Nib closed it himself. Beat: Taeo doesn't stop him (growth)."

  - id: P19
    shape: narrow-r
    gap: short
    bg: white
    camera: "low, from inside the entry behind Nib, looking out through the doorway"
    art: >
      From low inside the entry, behind Nib: his small figure in silhouette in the door frame, the knotted binocular strap and the notched LEFT ear against the light.
      Beyond him: the corridor's waist-high rail and, past it, the night city: the bus street's sodium glow, a scooter's headlight, too many lit windows (as ch 2 P14).
      One bare foot is on the threshold. Cold white and sodium orange ahead, warm lamp light on his back. No letters or numbers in the art.
    calm: none
    lines:
      - {who: nib, type: speech, side: r, text: "...TONIGHT."}
    notes: "Answers his own ch 2 line ('NOT TONIGHT.'). Don't explain it."

  - id: P20
    shape: full
    gap: short
    bg: white
    camera: "high, from the south end of the 4F corridor, looking north toward the stairs"
    art: >
      The 4F open-air corridor at night (taeo_building), high, from its south end: cold white tube lights under the corridor roof, the waist-high metal rail on the LEFT with the bus street's
