chapter: 41
title: Exchange
when: "Spring. Opens immediately after ch 40 at the Sinjeong kerb; the following Thursday at Seoryun's training exchange, 9 AM to late afternoon; Friday morning at Ryu Survey. No calendar date fixed."
story_beats: PART_ONE_BEATS.md#41
cast:
  taeo: outdoor # navy jacket over black hoodie; black cargo trousers; striped black sneakers; one mole under RIGHT eye; olive backpack, faded orange OLD open-door patch
  nib: default # adult, 105 cm; barefoot throughout; LEFT ear V-notch, single LEFT lower fang, brown rope belt, pouch RIGHT with green dinosaur sticker, wooden sheath LEFT
  orrin: default # adult stoneback, 2.3 m long; Sinjeong shell crack remains visible; padded exercises only
  yeo_ara: default # first featured appearance, intro P07; current team patch
  seoryun: default # heard over Ara's radio only; mostly away on response work
  grandpa: default # Friday hook; blue work cap, grey pocket jacket; overnight bag, no recycling cart on Seoul visit
extras:
  knot_instructor: "Rescue technician, woman about forty, blunt fringe, olive team jacket and charcoal trousers, white training gloves."
  barrier_technician: "Rescue technician, broad man about fifty, closely cropped greying hair, olive field gear, compact folding barrier frame."
locations: [sinjeong_street, seoryun_base, exchange_gate_inside, ryu_practice_yard]
location_notes:
  sinjeong_street: "Use ch 40 kerb, same backpack position and cleared response cordon; opening is a direct continuation of the invitation."
  seoryun_base: "No key yet. Modest rescue depot, concrete drill court in front of a low grey equipment shed; hose rack west, shaded rope trestle north, padded barrier lane east, briefing table beside south exit. A fenced gate exercise bay adjoins the shed. No sponsor backdrop, stage or audience."
  exchange_gate_inside: "Supervised exercise territory reached from the depot's fenced bay: chalky pale ridges, low rust-brown mineral shelves, lavender noon sky, violet shadows. White survey cable with blue metre bands, grey relay tripods at 50 m spacing. Boss remains alive; this is an approach sweep."
  ryu_practice_yard: "Match wide/reverse keys: south double chain-link gate, grey office southwest, one white van southeast, fixed central plywood zigzag maze, three north targets. Taeo's home is a separate container in the yard's service area, never a replacement for the keyed office."
props:
  nib_gear: "Matte black 8x30 porro binoculars high on chest; black woven strap knotted LEFT neck; Kett's fork scratched on hinge. Pale-blue ID, folded PAPER watch-post drawing, cobalt-blue pencil with fork near eraser inside RIGHT pouch."
  phone: "Taeo's dark grey phone, hairline crack TOP LEFT, green dinosaur sticker on case."
  sample: "One thumb-sized dull rust-brown ribbed shard from the supervised exchange approach, called EXCHANGE-GATE SAMPLE. Consumed in P31."
palette_notes: "A4 daily life: dusty ochre/brown court, washed sky blue; depot interior cool institutional blue-white. Gate sky lavender, violet shadows. Interface cyan #3FE3F2/navy #0B1530, amber only Nib link in Taeo's RIGHT palm; Orrin channel slate-green. No decorative particles or bloom."
