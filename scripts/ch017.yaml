chapter: 17
title: Thirty Seconds
when: "Thursday, the same day as ch 13-16 (spring; no date lettered). Inside the gate the boss dies at 4:01 PM and every return mark fires 30 seconds later; the ambulance leaves about 4:10 PM; the general contractor's sedan arrives about 4:25 PM; the kerb from 4:40 PM to about 4:55 PM."
story_beats: PART_ONE_BEATS.md#17
cast:
  taeo: outdoor     # navy zip jacket over the black hoodie, black cargo trousers, black sneakers with one white stripe; over the jacket a borrowed red-orange Ryu Survey safety vest (site rules; decided here unless ch 13-16 dressed him otherwise). His white hard hat lies on the gravel by the radio table and stays there. Dried blood under his nose from the ch 16 recoil; fresh bleeding from P17; a twist of tissue in his LEFT nostril from P46. The olive backpack with the faded orange patch: on the radio table, then on the pavement at his feet on the kerb
  nib: default      # barefoot; V-notch in the LEFT ear; small lower fang on the LEFT; brown rope belt; leather pouch on the RIGHT hip (the dark shard he pocketed in ch 16 is inside it: never shown, never mentioned); brown wooden sheath on the LEFT hip. Dust-caked from P02. From P16 a graze across his RIGHT shoulder blade, grey with dust (no blood colour shown). From P45 a silver foil emergency blanket round his shoulders, worn like a cape
  minho: default    # brown work jacket, grey T-shirt, olive cargo trousers, black knee pads, brown boots; radio clipped high on his LEFT chest; watch on his LEFT wrist; grey streak at the LEFT temple (visibly whiter from P38). Inside the gate: a white hard hat with a headlamp and a short steel pry bar, bent from P25. Dust-grey all over after P29
  sejin: default    # field medic gear and chest rig, cropped hair (CHARACTER_BRIEF_2 #3); an elastic-strap headlamp inside the gate; a bag-valve mask in both hands from P02 to P32; a med bag on her hip
  mansu: default    # Kwak Mansu, 58 (STORY_BIBLE; CHARACTER_BRIEF_2's "40s" is superseded, so grey his stubble and hair if the sheet reads younger): heavy-set, a back brace over his work clothes, a cheap hi-vis porter vest; dust-caked; one trouser leg torn over a bruised shin (pinned in ch 15-16); unconscious until P34; clear oxygen mask from P32
  dami: default     # Gu Dami, 19: cheap hi-vis porter vest over a hoodie, hard hat, cargo straps, worn gloves. She holds Kwak's jacket (the one she brought Taeo in ch 14; drop it if ch 14-16 left it elsewhere) until she lays it over him in P33
  dokgo: default    # Dokgo Chul: windbreaker, clipboard tablet, two phones, an unlit cigarette he never lights
extras:
  ironclad: "the clear team, Ironclad Seven (ch 18's KNN headline): seven hunters, men and women in their twenties and thirties, in matching polished gunmetal-grey armour vests and shoulder plates over black tactical wear, each with the same small sponsor patch on the chest (a plain coloured block, no letters); swords, a spear, a round shield, two short axes; clean, barely dusty, at ease"
  ironclad_lead: "the clear team's leader: a broad man in his thirties with a buzz cut and a showman's grin, a two-handed warhammer on his shoulder"
  reporter: "KNN 24 field reporter: a man in his thirties in a navy suit, neat side-parted hair, a handheld mic with a blank cube logo"
  camera_op: "KNN 24 camera operator: a man in a black cap and black jacket with a shoulder camera, its viewfinder dark"
  paramedic: "two 119 paramedics in navy uniforms with orange reflective panels, no lettering: an older man with grey stubble (the one who speaks) and a young woman; a wheeled stretcher, a green oxygen cylinder, a clear oxygen mask"
  gc_manager: "the general contractor's site manager: a man in his late forties in a crisp navy company windbreaker with a blank logo patch, a white hard hat with one blue stripe, spotless boots, a rugged tablet; a phone almost always at his ear; tired, polite, flat. He never looks toward the ambulance"
  porters: "three Dokgo porters in cheap hi-vis vests, sitting on blue plastic crates by the hoarding, hard hats on their knees"
locations: [guro_gate_interior, guro_side_gallery, guro_pit, guro_pit_street]
location_notes:
  _status: "None of these ids are in world/LOCATIONS.md yet, and ch 13-16 were not written when this script was. Everything below is decided here; if ch 13-16 fix a different layout, sky colour, threshold frame or id, theirs wins and this file should be updated to match."
  guro_gate_interior: "Inside the C-grade Guro gate. A vast quarry-like dungeon of stepped, broken pale stone open to a saturated sulphur-yellow sky (the wrong colour), with violet shadows. The boss's territory lies deep inside; in this chapter the boss is seen only once, as a silhouette (P01)."
  guro_side_gallery: "The collapsed side gallery off the survey line where Nib found Kwak (ch 15). A low tunnel about 2 m high and 3 m wide just under the dungeon's surface, walled and roofed in pale layered stone. Its mouth (the way back) is blocked by a rubble fall (ch 16). On the floor: the tilted slab that pinned Kwak (ch 15-16) and loose rock. The ceiling is one cracked slab layer with a web of fresh cracks (ch 16 hook); through the cracks come thin lines of the sulphur-yellow sky, widening as the countdown runs. Light: Minho's helmet headlamp and Sejin's elastic-strap headlamp (flat, hard-edged white cones), the return marks' white glow and the yellow crack light. Group positions, locked for P02-P27: Kwak on his back in the middle, head toward the blocked mouth; Sejin kneeling at his head with the bag-valve mask; Nib kneeling at Kwak's RIGHT side, holding Kwak's right hand in his own LEFT hand (his RIGHT stays free); Minho on Kwak's far (left) side, under the worst of the ceiling."
  guro_pit: "A construction pit in Guro-gu for a future apartment tower's basement: about 40 x 25 m and 8 m deep, long axis east-west. Shotcrete walls braced by steel soldier piles and horizontal waling beams; an idle tower crane on the north rim; rebar bundles and stacked formwork. The street and site gate are on the SOUTH side; a gravel ramp runs down from the gate (south-west corner) eastward along the south wall. On a gravel apron near the NORTH-EAST corner stands the gate (a door-height black-violet slit with a cold white rim) inside Ryu Survey's portable steel threshold frame: two scaffold-tube uprights and a crossbar, faded yellow-and-black hazard tape round the uprights. This is the 'frame' of the knock (ch 10); match ch 10-16 if they drew it differently. Beside it: Ryu Survey's folding radio table (radios, a closed laptop, Taeo's backpack) and Dokgo's porter staging (blue plastic crates, haul sledges, a pallet of bottled water). Late-afternoon sun from the west: the west wall's shadow covers the west end of the floor, and the gate end is in sun."
  guro_pit_street: "The two-lane street along the site's south side, running east-west. On the site (north) side: a tall steel hoarding printed with a huge glossy render of the tower to be built and a smiling family on a balcony (no text; the developer's logo a blank block), with a sliding mesh site gate near its WEST end. The kerb where Taeo and Nib sit is a few metres east of the gate, in front of the render; facing the street they face south, and Nib sits at Taeo's LEFT. Opposite (south side): low two-to-four-storey shops (a hardware shop, a closed karaoke, a convenience store; signs as blank blocks), overhead wires, a plane tree. Vehicles: a white ambulance with an orange stripe and a red light bar stops at the site gate (the site's standby ambulance since the clear team arrived, decided here); the KNN 24 van with a roof dish (blank logo) parks east of the gate on the site side; the general contractor's black sedan pulls in at the gate. The late sun comes from the west, along the street."
palette_notes: "Inside the gate (ART_BIBLE A4 'Inside gates'): a saturated sulphur-yellow sky, seen in the side gallery only through cracks and holes; violet shadows; flat white headlamp cones. The return marks are thin rings of cold white light, the gate rim's white: never interface cyan #3FE3F2, never amber. The art itself has no red inside the gate; red appears there only in the letterer's last countdown numbers (3, 2, 1, 0). The pit (a construction site, not in A4, so built from the survey-yard row): dusty ochre and concrete grey, warm brown shadows, sky blue; the red-orange vests and the faded yellow-and-black hazard tape are the accents (never the link amber); the gate is a violet-black core with a cold white rim. The street: warm grey pavement, blue-grey shadows, the hoarding render's glossy sky blue and white as the accent; the ambulance's red light bar is the only red. Late-afternoon sun from the west in every outside panel. Amber #F2A93B appears only as Nib's eyes and in Taeo's palm (P17, P22). Taeo's nosebleed is a thin line of dark red. There are no operator-interface windows in this chapter: the interface stays dark until ch 19."

panels:

  # ---------------- COLD OPEN: the boss dies ----------------
  - id: P01
    shape: tall
    gap: none
    bg: black
    camera: "extreme long shot, low, across a vast cavern floor toward the boss"
    art: >
      Inside the Guro gate (guro_gate_interior), far from the side gallery. A vast quarry-like cavern of stepped, broken pale stone
      under a saturated sulphur-yellow sky (the wrong colour), violet shadows. Far off in the middle ground, the dungeon's boss drawn
      ONLY as a solid near-black silhouette: a hill-sized, many-legged armoured crawler reared up on its hind legs, head thrown back,
      toppling. One hard straight line of white light, a hunter's finishing strike, cuts diagonally through its neck. At its feet, tiny,
      the seven hunters of the clear team (extras.ironclad) as small dark figures with weapon glints, one with a two-handed warhammer
      swung high. Chunks of rubble flying, hard-edged; a few sharp particles at the strike only. The bottom third of the frame is dark
      broken foreground rock. No detail inside the boss silhouette (if ch 13-16 drew the boss, match its outline). No red. No letters
      or numbers anywhere.
    calm: top
    lines:
      - {who: narr, type: tag, text: "INSIDE THE GURO GATE · 4:01 PM"}
    sfx:
      - {text: "GRRRAAAAAH—", style: impact, at: [0.50, 0.16], size: XL, rot: -8}
    notes: "Continues ch 16's hook (3:58 PM: deep inside, the boss roars; above Nib and Kwak, the ceiling cracks). The clear team arrived late (ch 16) and kills it at 4:01 PM. The dash is the roar being cut off by the strike."

  - id: P02
    shape: wide
    gap: short
    bg: black
    camera: "low, eye level with the floor, side-on across the side gallery"
    art: >
      The collapsed side gallery (guro_side_gallery): a low tunnel of pale layered stone, dark. Left to right: Kwak Mansu (mansu) on his
      back on the stone floor, unconscious, grey-lipped, face slack, his hi-vis vest and back brace grey with dust. Sejin (sejin) kneeling
      at his head, both gloved hands sealing a bag-valve mask over his mouth and nose, mid-squeeze, her headlamp beam on his face, eyes
      narrowed and steady. Nib (nib: V-notch LEFT ear, pouch RIGHT hip, wooden sheath LEFT hip, barefoot) kneeling at Kwak's RIGHT side,
      holding Kwak's limp right hand in his own LEFT, his long ears snapped upright, his eyes turned up toward the ceiling, listening.
      Minho (minho, white hard hat with headlamp) crouched on Kwak's far side with a short steel pry bar, his headlamp cone thrown up
      across the ceiling. The ceiling is one slab layer webbed with fresh cracks; a thin trickle of grit falls from one; two hairline
      cracks let in knife-thin lines of sulphur-yellow light. At the right edge, the rubble fall that blocks the way back. All four are
      dust-caked. Light: two flat, hard-edged headlamp cones (no glow, no god rays) and violet dark. No marks glowing yet. No blood.
    calm: top-left
    lines:
      - {who: nib, type: speech, side: c, text: "IT'S DEAD."}
      - {who: minho, type: speech, side: r, text: "THEN THIS WHOLE PLACE COMES DOWN."}
    notes: "Boss death begins the dungeon's collapse (the v3 rule kept by the bible). Sejin is breathing for Kwak with the bag: the asthma attack in the dust (ch 15-16) has left him barely breathing on his own; the inhaler Nib carried was used in ch 16. Group positions are locked in location_notes for P02-P27."

  - id: P03
    shape: full
    gap: short
    bg: white
    camera: "establishing, high angle from halfway down the gravel ramp, looking north-east at the gate"
    art: >
      The Guro construction pit (guro_pit): a rectangular excavation about 8 m deep, shotcrete walls braced by steel soldier piles and
      horizontal waling beams, the gravel ramp running down in the foreground, an idle tower crane on the rim, rebar bundles and stacked
      formwork. On the gravel apron by the far wall stands the gate: a door-height black-violet slit hanging in the air inside the
      crew's portable steel threshold frame (two scaffold-tube uprights and a crossbar, faded yellow-and-black hazard tape on the
      uprights). Its rim has just FLARED: a hard ring of cold white light round the slit throws everyone's shadows flat across the
      gravel, away from the gate. By the frame: Taeo (taeo, outdoor, red-orange Ryu Survey vest) standing with one forearm up against the
      glare, dried blood under his nose; Dami (dami) gripping a man's jacket to her chest. Left, by the porters' blue crates: Dokgo
      (dokgo) with one phone at his ear, turning toward the light. Up on the ramp, a KNN camera operator (extras.camera_op) swinging his
      shoulder camera toward the flash. Ryu Survey's folding radio table with radios and Taeo's olive backpack (faded orange patch);
      Taeo's white hard hat on the gravel. Late-afternoon sun from the west: the west wall's shadow over half the floor, the gate in sun.
      Palette: dusty ochre and concrete grey, warm brown shadows, sky blue, red-orange vests; the gate's violet-black core and cold
      white rim. Signs, crane and hoarding carry no letters.
    calm: top-right
    lines:
      - {who: dokgo, type: speech, side: l, text: "IT'S DOWN, SIR. THE BOSS IS DOWN."}
    sfx:
      - {text: "VWOOOM", style: gate, at: [0.80, 0.50], size: L, rot: -6}
    notes: "The rim flare is the public sign of a boss kill (the ch 10 briefing film). From now on entry is closed. Dokgo is reporting up the chain to the general contractor, who arrives in P38. The jacket in Dami's arms is Kwak's (ch 14)."

  - id: P04
    shape: strip
    gap: short
    bg: black
    silent: true
    camera: "extreme close-up, top-down on two clasped hands on the stone"
    art: >
      Extreme close-up, the subject in the middle third: Nib's olive-green LEFT hand (faint pale scars on the forearm, scraped knuckles)
      holding Kwak's big, limp, dust-grey right hand on the stone floor. On the inside of each wrist a ring-shaped mark the size of a
      thumbnail has just lit: a thin, hard ring of cold white light (the gate rim's white: NOT interface cyan, NOT amber), drawn flat with
      crisp edges, laying a small white glow on the skin. Grit on the knuckles. Everything else violet-black. No glyphs inside the rings.
    calm: none
    notes: "Return marks: every living entrant got one on crossing, and they light when the boss dies. The look is decided here (a thin white ring on the inside of the wrist); match ch 10's briefing film if it drew them otherwise."

  - id: P05
    shape: full
    gap: short
    bg: black
    camera: "high angle, straight down through the cracked ceiling onto the four of them"
    art: >
      The camera is above the side gallery's ceiling slab (guro_side_gallery), looking straight down through its jagged fresh cracks: dark
      rock edges fill the near foreground and frame the view, with thin sulphur-yellow light falling between them in hard lines. Below,
      on the dark stone floor, the four of them small in a tight cluster: Kwak (mansu) on his back in the middle; Sejin (sejin) at his
      head squeezing the bag-valve mask; Nib (nib) at his right side holding his hand; Minho (minho) on one knee on his far side, pry
      bar across his knee, headlamp cone up toward us. On four wrists, four small rings of cold white light glow in the dark like four
      small moons: the brightest things in the frame. Rubble and the tilted slab around them; the blocked gallery mouth at the top edge.
      Violet shadows, hard edges, no haze.
    calm: bottom-right
    lines:
      - {who: minho, type: speech, side: r, text: "MARKS ARE LIVE."}
    sfx:
      - {text: "30", style: impact, at: [0.20, 0.24], size: XL, rot: -4}
    notes: "The countdown device: from here to P27 a big lettered number marks the second of every non-silent panel (impact style, red alert style for 3, 2, 1, 0). Thirty seconds after the boss dies, every mark returns its bearer to the outside threshold, conscious or not."

  - id: P06
    kind: title
    gap: long
    bg: black
    title_text: "CHAPTER 17 · THIRTY SECONDS"

  # ---------------- THE COUNT: who goes early ----------------
  - id: P07
    shape: wide
    gap: long
    bg: black
    camera: "low angle up at Minho from beside Kwak's head"
    art: >
      Low angle from the floor beside Kwak's head: the rim of the bag-valve mask and Sejin's gloved hands in the near foreground, lower
      left. Minho (minho: white hard hat with headlamp, radio on his LEFT chest) on one knee, the pry bar in his right hand, holds up his
      LEFT wrist so the others can see its white ring. His face is hard and practical: the licensed lead giving the safe order, firmly,
      not coldly. His headlamp beam cuts across the frame. Behind him the cracked ceiling with one thin yellow line. Dust on everything;
      violet shadows.
    calm: top-left
    lines:
      - {who: minho, type: speech, side: r, text: "THUMB ON IT AND GO. ALL OF YOU."}
    sfx:
      - {text: "29", style: impact, at: [0.86, 0.18], size: L, rot: 6}
    notes: "A conscious bearer can trigger their mark at once by pressing it with a thumb (the method is decided here; match ch 10 if it showed another). Minho gives the textbook order."

  - id: P08
    shape: full
    gap: none
    bg: white
    camera: "eye level on the gravel apron, three-quarter toward the threshold frame"
    art: >
      The gravel apron at the gate (guro_pit), the slit's rim still bright cold white. Out of the black-violet slit, in flat flashes of
      white, the clear team (extras.ironclad) step out one after another onto the gravel, already relaxed and pleased with themselves.
      Their leader (extras.ironclad_lead) points his free hand up at the KNN camera on the ramp with a big showman's grin, warhammer on his
      shoulder. In the foreground right, Taeo (taeo, outdoor, red-orange vest, dried blood under his nose) has stepped toward the frame
      and is searching the faces past their armoured shoulders, tense, eyes jumping from one to the next; Dami (dami) behind him on her
      toes, Kwak's jacket bunched in her arms. The steel threshold frame with its faded hazard tape. Late sun from the west; gravel and
      ochre. Sponsor patches are blank blocks.
    calm: top-left
    lines:
      - {who: ironclad_lead, type: speech, side: l, text: "CLEAN CLEAR, IRONCLAD! SMILE FOR KNN!"}
      - {who: taeo, type: float, text: "CONSCIOUS PEOPLE CAN COME OUT AT ONCE."}
    sfx:
      - {text: "28", style: impact, at: [0.10, 0.84], size: L, rot: -6}
      - {text: "FWSH", style: gate, at: [0.44, 0.34], size: M, rot: -10}
      - {text: "FWSH", style: gate, at: [0.56, 0.46], size: S, rot: 8}
    notes: "The clear team pressed their marks the instant the boss died; each bearer returns to the threshold they crossed. They are clean and unhurt, and they never knew about the side gallery."

  - id: P09
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up, front, Taeo's face past a hunter's armoured shoulder"
    art: >
      Close-up of Taeo (taeo): dried blood under his nose, the small mole under his RIGHT eye, sweat at the temple, dust on his cheek. His
      eyes have stopped searching. The last hunter's gunmetal shoulder plate slides out of frame at the left edge. His face is very still:
      the floor dropping out from under him. Plain warm-ochre background.
    calm: left
    lines:
      - {who: taeo, type: float, text: "NIB WAS CONSCIOUS."}
    sfx:
      - {text: "27", style: impact, at: [0.16, 0.16], size: M, rot: -4}

  - id: P10
    shape: wide
    gap: none
    bg: black
    camera: "over Minho's right shoulder, looking down at Nib"
    art: >
      Over Minho's right shoulder (his brown jacket and the pry bar in the near foreground, right), looking down. Nib (nib) does not touch
      his mark. Still kneeling, still holding Kwak's hand in his LEFT, he shifts his body so that his chest and shoulders cover Kwak's head
      and face, between him and the ceiling: ears flat, jaw set, his amber eyes up at Minho, unblinking. Sejin, under him, keeps squeezing
      the bag. Headlamp light, violet shadows, grit falling.
    calm: top
    lines:
      - {who: minho, type: speech, side: r, text: "HIS MARK BRINGS HIM AT ZERO."}
      - {who: minho, type: speech, side: r, text: "YOURS WON'T CARRY HIM."}
    sfx:
      - {text: "26", style: impact, at: [0.08, 0.22], size: L, rot: -5}
    notes: "The rule, shown honestly: a mark carries its bearer and their worn or carried gear, not another person. Kwak cannot press his own; it will take him at zero by itself."

  - id: P11
    shape: inset-l
    gap: short
    bg: black
    camera: "close-up, Sejin from Kwak's eye line"
    art: >
      Close-up of Sejin (sejin): headlamp on its elastic strap, cropped hair grey with dust, tired eyes fixed on Kwak's chest rising, not
      on Minho; both gloved hands on the bag-valve mask mid-squeeze. Her face is flat and certain: a medic stating a fact. The white ring
      on her wrist. Dark background, falling grit.
    calm: right
    lines:
      - {who: sejin, type: speech, side: l, text: "IF THE ROOF GETS HIM FIRST, HIS MARK BRINGS OUT A BODY."}
      - {who: sejin, type: speech, side: l, text: "A MARK ISN'T A STRETCHER."}
    sfx:
      - {text: "25", style: impact, at: [0.84, 0.14], size: M, rot: 5}
    notes: "Marks do not heal or revive, and they bring back the dead too (the v3 rule). This answers Dokgo's ch 14 logic ('the return marks will bring Kwak out'). It echoes her 'SUMMONED IS NOT A DIAGNOSIS.' (ch 10)."

  - id: P12
    shape: strip
    gap: short
    bg: black
    camera: "extreme close-up, Nib's eyes in the headlamp light"
    art: >
      Extreme close-up strip of Nib's eyes and brow, the subject in the middle third: amber eyes, dust in his eyebrows, the V-notch of his
      LEFT ear at the frame edge, grit falling past. Not angry: decided. A small white glow from below (his mark). Violet-black around.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "I STAY."}
    sfx:
      - {text: "24", style: impact, at: [0.90, 0.50], size: M, rot: 0}

  - id: P13
    shape: wide
    gap: short
    bg: black
    camera: "low, side-on, Minho rising into a brace over the group"
    art: >
      Low, side-on. Minho (minho) looks at the three of them for one beat, then stands into a wide, low brace right over the group, his
      back and helmet under the worst of the cracks, the pry bar held across in both hands. His face: a short breath out through the nose,
      half a curse, then focus. His headlamp swings up across the crack web; three cracks now show sulphur-yellow. Below him, Nib and
      Sejin bent over Kwak.
    calm: top-right
    lines:
      - {who: minho, type: speech, side: r, text: "...THEN NOBODY GOES EARLY."}
      - {who: minho, type: announce, side: r, text: "TWENTY-THREE."}
    sfx:
      - {text: "23", style: impact, at: [0.10, 0.80], size: L, rot: -6}
    notes: "Minho changes his own order: the licensed lead chooses to share the porter's risk. From here he counts aloud."

  - id: P14
    shape: wide
    gap: none
    bg: white
    camera: "medium, low, beside the steel frame, Taeo kneeling"
    art: >
      Medium, low, at the foot of the steel threshold frame (guro_pit): Taeo (taeo) kneels on the gravel with one hand on the frame's taped
      upright, staring into the black-violet slit, lips moving as he counts under his breath. Dami (dami) stands behind him clutching
      Kwak's jacket, frightened, looking from the slit to Taeo. In the background, small: Dokgo (dokgo) has lowered his phone and is
      watching the gate too, the unlit cigarette between his fingers, his face unreadable; the clear team walking up the ramp toward the
      KNN camera. Late sun; the gate rim's cold white edge light on Taeo's face. Ochre, concrete grey, red-orange vest.
    calm: top
    lines:
      - {who: taeo, type: whisper, side: l, text: "...TWENTY-ONE."}
      - {who: dami, type: speech, side: r, text: "WHERE ARE THEY?"}
      - {who: taeo, type: speech, side: l, text: "WAITING. FOR HIM."}
    sfx:
      - {text: "21", style: impact, at: [0.90, 0.16], size: L, rot: 6}
    notes: "Taeo cannot hear or see inside; he knows Nib. Taeo counts the same seconds as Minho without either hearing the other."

  - id: P15
    shape: tall
    gap: none
    bg: black
    camera: "low, from the floor, looking straight up at the ceiling"
    art: >
      From the side gallery floor looking straight UP: the ceiling slab splits in a web of jagged cracks, and knives of saturated
      sulphur-yellow light from the dungeon sky slice down through them into the dark. Rocks the size of fists and bricks break loose and
      fall toward the camera as hard-edged chunks with speed lines; grit streams. At the bottom of the frame, foreshortened: Minho's braced
      shoulders and helmet, headlamp blazing, pry bar up; the top of Nib's spiky black head bent over Kwak. Violet shadows, yellow light,
      the white ring on Minho's wrist. The light is flat-edged shapes: no haze, no glowing dust, no god rays.
    calm: top-left
    lines:
      - {who: minho, type: shout, side: c, text: "HEADS DOWN!"}
    sfx:
      - {text: "KRRRRRAAK", style: impact, at: [0.66, 0.30], size: XL, rot: 12}
      - {text: "19", style: impact, at: [0.14, 0.10], size: L, rot: -6}

  - id: P16
    shape: inset-r
    gap: short
    bg: black
    camera: "close, from above and behind Nib"
    art: >
      From above and behind Nib (nib): a brick-sized rock smashes onto his RIGHT shoulder blade as he curls over Kwak's head; impact lines,
      a burst of grit. His face, half turned toward us: eyes squeezed shut, teeth clenched on the sound, his small lower LEFT fang showing;
      no cry. His LEFT hand still holds Kwak's. A fresh graze across the shoulder blade, grey with dust; no blood colour. Adult and wiry,
      never cute. Violet-black background.
    calm: left
    sfx:
      - {text: "THUD", style: impact, at: [0.56, 0.30], size: L, rot: -10}
      - {text: "17", style: impact, at: [0.86, 0.86], size: M, rot: 4}

  - id: P17
    shape: wide
    gap: none
    bg: white
    camera: "low, front on Taeo as he doubles over"
    art: >
