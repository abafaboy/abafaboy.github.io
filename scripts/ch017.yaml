chapter: 17
title: Thirty Seconds
when: "Thursday, the Guro job day of ch 13-16 (spring; no date lettered). Inside the gate the boss dies at 4:00 PM (the clear team's booked time, ch 15; ch 18's ticker says the gate closed at 16:00) and every return mark fires 30 seconds later. 119 is called at about 4:01 PM; the ambulance leaves about 4:14 PM; the general contractor's sedan arrives about 4:25 PM; the kerb from 4:40 PM; Taeo signs at about 5:00 PM (ch 18 P24: he texts Manager Oh at 17:06, 'right after signing')."
story_beats: PART_ONE_BEATS.md#17
cast:
  taeo: outdoor     # navy zip jacket over the black hoodie, black cargo trousers, black low sneakers with one white stripe; ONE mole under his RIGHT eye. Olive backpack (faded orange shield-and-open-door patch) under the radio table, then at his feet on the kerb; his phone (crack top-left, green dinosaur sticker) on the radio table. Dried blood under his nose at the start (ch 16 pulled the tissues out at P38); fresh bleeding from P17. From P29 a gravel graze on his RIGHT palm; from P44 a square plaster across that palm and a twist of tissue in his LEFT nostril (both still there in ch 18 P02). The link pulse is in his RIGHT palm
  nib: default      # barefoot; V-notch LEFT ear; one lower fang on the left; brown rope belt; pouch on the RIGHT hip with Haru's small green dinosaur sticker on the flap (ch 8); brown wooden sheath on the LEFT hip. No helmet, no lamp, no radio (his handset was crushed in ch 16 P04). Grey with stone dust. His return mark is on his LEFT wrist (ch 13). The dark shard from ch 16 is in the pouch: never shown, never mentioned. From P16 a graze across his RIGHT shoulder blade, grey with dust (no blood colour shown). From P45 a silver foil emergency blanket round his shoulders, worn like a cape
  minho: default    # gate kit as ch 16: brown work jacket, grey T-shirt, olive cargo trousers with black knee pads, brown work boots, watch on his LEFT wrist, radio clipped high on his LEFT chest, a headlamp on an elastic band (no helmet), the telescoping steel survey pole with a hooked head (slung on his back from P13). Return mark on his RIGHT wrist (ch 15). Grey streak at the LEFT temple (visibly whiter from P38). Dust-grey all over. In P13-P29 he holds the steel shoring prop from ch 16, bent from P25; he leaves it on the gravel in P30
  sejin: default    # Im Sejin as ch 16: cropped hair, tired eyes, medic chest rig, field trousers, headlamp on a band, nitrile gloves, trauma bag, one water bottle. Return mark on her RIGHT wrist (ch 15). A compact bag-valve mask from the trauma bag in both hands from P02 to P29
  mansu: default    # Kwak Mansu, 58: heavy-set, short grey hair, stubble, a black back brace over his work clothes, lime-yellow porter vest; asthma; his LEFT shin hurt where the slab pinned it (ch 15-16). Unconscious until P34. His dented white hard hat lies by his head in the gallery and is left behind (P27). Return mark on his RIGHT wrist. Clear oxygen mask from P32
  dami: default     # Gu Dami, 19: lime-yellow porter vest over a grey hoodie, scuffed white hard hat, cargo straps, worn gloves, a cheap phone in a cracked rubber case. She holds Kwak's navy canvas work jacket (ch 13-14) all chapter and still has it in ch 18 P02
  dokgo: default    # Dokgo Chul, 50s, as ch 16: navy windbreaker, reading glasses pushed up on his thinning hair, a clipboard tablet, TWO phones, an unlit cigarette and a cheap plastic lighter
  haein: default    # Ryu Haein, 20, as ch 16: work overalls, tool belt, safety glasses pushed up, headphones round her neck, a red-orange Ryu Survey vest; runs the radio base. In this chapter she times the thirty seconds on her phone
extras:
  gc_director: "the general contractor's site director, Dokgo's boss: heard only on Dokgo's phone in ch 13-16 ('his sedan arrives in ch 17', ch 15); drawn here for the first time (P40-P42). A man in his fifties: a charcoal suit with a new hi-vis vest over it, a white hard hat with a thin navy band (the contractor's colour, as on the site manager in ch 13) held in one hand, a steel watch, spotless shoes, a rugged tablet; a phone almost always at his ear. Calm and quiet; he never raises his voice and never says sorry. He never looks toward the ambulance."
  ironclad: "IRONCLAD SEVEN, the contracted clear team, as ch 16 drew them: seven hunters in matching charcoal armour with brushed-steel trim and a blank silver sponsor patch on each shoulder; mixed weapons (a greatsword, two spears, a tower shield, a bow, gauntlets); fresh, clean, unhurried. Their black van carries a blank shield emblem."
  ironclad_lead: "Ironclad's lead, as ch 16: a tall woman in her thirties with a shaved undercut, a greatsword across her back and sunglasses pushed up on her head; the most relaxed person in the pit."
  ironclad_cam: "the team member who films the others with a phone on a gimbal (ch 16); its screen is never shown."
  reporter: "KNN 24 field reporter, arriving about 4:20 PM with a van and a camera operator: a man in his thirties in a navy suit, neat side-parted hair, a handheld mic with a blank cube logo. (ch 18's anchor is a different, voice-only person.)"
  camera_op: "KNN 24 camera operator: a man in a black cap and black jacket with a shoulder camera, its viewfinder dark."
  paramedic: "two 119 paramedics in navy uniforms with orange reflective panels, no lettering: an older man with grey stubble (the one who speaks) and a young woman; a wheeled stretcher with a monitor; a white ambulance with an orange stripe and a red light bar, no lettering."
  porters: "Dokgo Contracting porters as ch 16: unawakened day labourers of mixed ages in the same cheap lime-yellow hi-vis vests over hoodies and work jackets, scuffed hard hats, cargo straps and gloves. Two of them went in behind Ironclad at 3:47 PM (ch 16 P54) and come out with them in P08."
locations: [guro_gate_inside, guro_side_gallery, guro_pit, guro_pit_street]
location_notes:
  _status: "Ch 13-16 were written alongside this script and disagree with each other. Ids: ch 13-14 call the dungeon guro_gate_inside, ch 15 guro_gate, ch 16 guro_gate_gallery (covering the side gallery too); ch 15 calls the side gallery guro_side_gallery. This script uses guro_gate_inside and guro_side_gallery. The sky is GREEN DUSK (ch 13, 14, 16; ch 15 had sulphur-yellow but deferred to ch 13-14). Pit walls: H-piles with timber lagging in ch 13-15, rust-brown sheet piles in ch 16; the briefs here say only 'steel-piled walls' so the location key can settle it. guro_pit_street is new here."
  guro_gate_inside: "Inside the C-grade Guro gate. Here only the deep cavern of P01, where the boss dies: as ch 16 P60, a vast cavern whose roof has fallen in, open to the green-dusk sky (deep teal-green overhead, pale acid green toward the horizon), pale fractured grey stone, violet shadows. The boss is designed in P01 (ch 16 left its design to ch 17)."
  guro_side_gallery: "As ch 16 left it: a low chamber about 6 x 4 m, ceiling 1.8-2.2 m, of pale grey stone, reached only through a narrow crack in a rubble wall (now choked with rubble: the way back is blocked). The big slab that pinned Kwak lies flat in the middle of the floor; Nib's crushed handset sits under its edge; the steel shoring prop lies flung against the far wall (Minho picks it up in P13); low in a side wall, a black fissure plugged with a stone (where the scuttler went, ch 16 P18). Light: thin hard-edged bars of green-dusk light through ceiling fissures, which widen as the countdown runs, plus the white headlamps of Minho and Sejin and the marks' white glow. Group positions, locked for P02-P27: Kwak on his back beside the fallen slab, his dented white hard hat on the floor by his head; Sejin kneeling at his head with the bag-valve mask; Nib kneeling at Kwak's RIGHT side, holding Kwak's right hand in his own LEFT (his RIGHT stays free); Minho on Kwak's far side."
  guro_pit: "As ch 13-16: a foundation pit in Guro-gu about 12 m deep, steel-piled walls braced by two tiers of steel struts, an idle tower crane, a concrete pump truck with its boom folded and two ready-mix trucks with turning drums on the rim (ch 16). A gravel ramp runs up the SOUTH side to the street gate; Dokgo's battered flatbed truck at its top (ch 13). The gate stands near the NORTH wall: a door-height black-violet slit with a cold white-cyan rim inside the scaffold-tube threshold frame (ch 13-15: two posts straddling the slit's edges and a crossbar), ringed by traffic-orange water-filled barriers (ch 16), with the orange relay cable snaking across the gravel into it. Eight metres in front of it: the Ryu Survey radio table (a folding table, a radio base set with a short antenna mast, a charging rack, upturned crates as seats, Taeo's backpack underneath, his phone on top). At the ramp foot: Dokgo's staging (a white pop-up canopy, a folding table with a cooler and a tablet, crates on pallets) and Sejin's aid station (ch 14: a folding table, a white medic case, a small green oxygen cylinder, a folded stretcher, a camp chair). Light: hazy flat afternoon light from a pale grey-white sky (ch 16) until about 4:20 PM."
  guro_pit_street: "New here. The street along the site's south side, running east-west, among older four-storey factory blocks and new glass office towers (ch 13). On the site (north) side: the tall steel hoarding with the sliding mesh site gate at the top of the ramp near its WEST end. The hoarding's inner face is plain (ch 13, ch 18 P01); its STREET face is printed with a huge glossy render of the apartment tower being built and a smiling family on a balcony (no text; the developer's logo a blank block). The kerb where Taeo and Nib sit is a few metres east of the gate, in front of the render; facing the street they face south, and Nib sits at Taeo's LEFT. Opposite: an older four-storey factory block with roller shutters and a convenience store at street level (signs as blank blocks), overhead wires, a plane tree. Vehicles: the 119 ambulance stops at the site gate (P33-P37); Ironclad's black van is parked along the hoarding east of the gate; the KNN 24 van (roof dish, blank logo) arrives about 4:20 PM; the general contractor's black sedan pulls in at the gate. The haze breaks about 4:20 PM: from then on a low gold sun from the west (ch 18 P01's footage at about 4:40 PM)."
palette_notes: "Inside the gate: green-dusk light (deep teal-green to pale acid green), violet shadows, pale grey stone, flat white headlamp cones. The return marks are thin rings of cold white light with a faint violet edge (ch 13): never interface cyan #3FE3F2, never amber. The only red in the art inside the gate is the boss's wet throat (P01, as ch 16 P60's red glint); the letterer's last countdown numbers (3, 2, 1, 0) are red. The pit: hazy, flat light from a pale grey-white sky (ch 16), concrete grey with blue-grey shadows, steel; the porters' lime-yellow vests, Haein's red-orange vest and the orange barriers stay muted and never read as the link amber; the gate is a violet-black core with a cold white-cyan rim. The street: hazy at first, then low gold sun from the west, long shadows to the east; warm grey pavement; the render's glossy sky blue and white is the accent; the ambulance's red light bar is the only red. Taeo's nosebleed is a thin line of dark red. Amber #F2A93B appears only as Nib's eyes and in Taeo's palm (P17, P22). There are no operator-interface windows in this chapter: the interface stays dark until ch 19."

panels:

  # ---------------- COLD OPEN: the boss dies ----------------
  - id: P01
    shape: tall
    gap: none
    bg: black
    camera: "extreme long shot, low, across a vast cavern floor toward the boss"
    art: >
      Deep inside the Guro gate (guro_gate_inside): a vast cavern whose roof has fallen in, open to a green-dusk sky (deep teal-green
      overhead, pale acid green toward the horizon), pale fractured grey stone, violet shadows. In the middle ground, the dungeon's BOSS
      (designed here): a colossal armoured crawler of the same kind as the scuttler, the size of a four-storey building. It has a long body
      of overlapping slate-violet plates like a giant woodlouse, a fringe of hundreds of thin pale jointed legs along its underside, two huge
      hooked forelimbs, two whip feelers longer than a bus, no eyes, and a round toothed mouth whose wet red throat is the only red in the
      panel. It rears up on its back half, head thrown back, mouth open, already toppling backwards. One hard, straight line of white light
      (the Ironclad lead's greatsword stroke) cuts through the joint behind its head. At its feet, tiny, the seven hunters of the clear team
      (extras.ironclad) in charcoal armour with steel glints; the lead (extras.ironclad_lead) at the end of her swing. Rubble flies in
      hard-edged chunks; a few sharp particles at the strike only. The bottom third of the frame is dark broken foreground rock. No letters
      or numbers anywhere.
    calm: top
    lines:
      - {who: narr, type: tag, text: "INSIDE THE GURO GATE · 4:00 PM"}
    sfx:
      - {text: "GRRRAAAOOO—", style: impact, at: [0.50, 0.14], size: XL, rot: -8}
    notes: "Continues ch 16's hook (3:58 PM: the roar, and the crack above Nib and Kwak). Ch 16 P60 left the boss's design to ch 17: it is fixed here, the scuttler's kind (ch 15-16) grown huge. Ironclad went in about 3:47 PM, 46 minutes late (ch 16), and kills it at 4:00 PM, the booked time (ch 15). The dash is the roar cut off by the strike."

  - id: P02
    shape: wide
    gap: short
    bg: black
    camera: "low, eye level with the floor, side-on across the side gallery"
    art: >
      The side gallery (guro_side_gallery), a low chamber of pale grey stone, dark. The big fallen slab lies flat in the middle of the floor;
      a steel shoring prop lies flung against the far wall; the narrow entrance crack is choked with rubble. Left to right: Kwak Mansu
      (mansu) on his back beside the slab, unconscious, grey-lipped, his lime-yellow vest and back brace grey with dust, his dented white
      hard hat on the floor by his head. Sejin (sejin, headlamp band) kneels at his head, both gloved hands sealing a compact bag-valve mask
      over his mouth and nose, mid-squeeze, eyes narrowed and steady; a damp cloth is pushed down round his neck. Nib (nib: V-notch LEFT ear,
      pouch RIGHT hip, wooden sheath LEFT hip, barefoot) kneels at Kwak's RIGHT side, holding Kwak's limp right hand in his own LEFT, long
      ears snapped upright, eyes turned up toward the ceiling, listening. Minho (minho, headlamp on an elastic band, no helmet) crouches on
      Kwak's far side with his telescoping survey pole, his headlamp cone thrown up across the ceiling, which is webbed with fresh cracks: a
      thin trickle of grit falls from one, and two fissures let in hard thin bars of green-dusk light. All four are dust-caked. Light: two
      flat, hard-edged headlamp cones (no glow, no god rays) and violet dark. No marks glowing yet. No blood.
    calm: top-left
    lines:
      - {who: nib, type: speech, side: c, text: "IT'S DEAD."}
      - {who: minho, type: speech, side: r, text: "THEN THIS WHOLE PLACE COMES DOWN."}
    notes: "Boss death begins the dungeon's collapse (the v3 rule behind STORY_BIBLE §5). Since ch 16's 'HE'S PASSED OUT. STILL BREATHING.' (P55), Kwak's breathing has slowed: Sejin now breathes for him with a compact bag-valve mask from her trauma bag, and ch 16's wet cloth is pushed down. Group positions are locked in location_notes for P02-P27."

  - id: P03
    shape: full
    gap: short
    bg: white
    camera: "establishing, high angle from halfway down the gravel ramp, looking north at the gate"
    art: >
      The Guro construction pit (guro_pit): about 12 m deep, steel-piled walls braced across by two tiers of steel struts, the gravel ramp
      in the foreground, an idle tower crane above, and on the rim a concrete pump truck with its boom folded and two ready-mix trucks with
      turning drums. Near the far (north) wall stands the gate: a door-height black-violet slit hanging in the air inside the scaffold-tube
      threshold frame, ringed by traffic-orange water-filled barriers, the orange relay cable snaking into it. Its rim has just FLARED: a hard
      ring of cold white-cyan light throws everyone's shadows flat across the grey gravel, away from the gate. Inside the ring of barriers,
      beside the frame's post, Taeo (taeo, outdoor, dried blood under his nose) throws a forearm up against the glare. Eight metres back at
      the Ryu radio table, Haein (haein) yanks her headphones off and Dami (dami) stands clutching a man's navy canvas work jacket to her chest;
      Taeo's backpack under the table. Left, under the white pop-up canopy at the ramp foot, Dokgo (dokgo) with one phone at his ear turns
      toward the light; beside the canopy, Sejin's empty aid station. Hazy, flat afternoon light from a pale grey-white sky. Palette:
      concrete grey, blue-grey shadows, steel; the lime-yellow and red-orange vests muted; the gate's violet-black core and cold white-cyan rim.
      Trucks, crane and signs carry no letters.
    calm: top-right
    lines:
      - {who: dokgo, type: speech, side: l, text: "IT'S DOWN, DIRECTOR. THE BOSS IS DOWN."}
    sfx:
      - {text: "VWOOOM", style: gate, at: [0.80, 0.50], size: L, rot: -6}
    notes: "The rim flare is the public sign of a boss kill (the ch 10 briefing film). From now on entry is closed. Taeo walked to the rim at 3:58 and knocked twice on its edge (ch 16 P59). Dokgo reports up the chain to the site director, who arrives in P38. The jacket in Dami's arms is Kwak's (ch 13-14)."

  - id: P04
    shape: strip
    gap: short
    bg: black
    silent: true
    camera: "extreme close-up, top-down on two clasped hands on the stone"
    art: >
      Extreme close-up, the subject in the middle third: Nib's olive-green LEFT hand (faint pale scars on the forearm, scraped knuckles)
      holding Kwak's big, limp, dust-grey right hand on the stone floor. On the inside of each wrist a ring-shaped return mark the size of a
      thumbnail has just lit: a thin, hard ring of cold white light with a faint violet edge (as ch 13 drew Nib's when he crossed), flat, with
      crisp edges, laying a small white glow on the skin. Grit on the knuckles. Everything else violet-black. No glyphs inside the rings.
    calm: none
    notes: "Return marks: every living entrant got one on crossing, and they light when the boss dies. Nib's is on his LEFT wrist (ch 13); Minho's and Sejin's are on their right wrists (ch 15)."

  - id: P05
    shape: full
    gap: short
    bg: black
    camera: "high angle, straight down through the cracked ceiling onto the four of them"
    art: >
      The camera is above the side gallery's ceiling slab (guro_side_gallery), looking straight down through its jagged fresh cracks: dark rock
      edges fill the near foreground and frame the view, with thin bars of green-dusk light falling between them in hard lines. Below, on the
      dark stone floor, the four of them small in a tight cluster beside the fallen slab: Kwak (mansu) on his back, his dented hard hat by his
      head; Sejin (sejin) at his head squeezing the bag-valve mask; Nib (nib) at his right side holding his hand; Minho (minho) on one knee on
      his far side, headlamp cone up toward us. On four wrists, four small rings of cold white light glow in the dark like four small moons:
      the brightest things in the frame. The shoring prop against the far wall; the rubble-choked crack at the top edge. Violet shadows, hard
      edges, no haze.
    calm: bottom-right
    lines:
      - {who: minho, type: speech, side: r, text: "MARKS ARE LIVE."}
    sfx:
      - {text: "30", style: impact, at: [0.20, 0.24], size: XL, rot: -4}
    notes: "The countdown device: from here to P27 a big lettered number marks the second of every non-silent panel (impact style; red alert style for 3, 2, 1, 0). Thirty seconds after the boss dies, every mark returns its bearer to the outside threshold, conscious or not."

  - id: P06
    kind: title
    gap: long
    bg: black
    title_text: "CHAPTER 17 · THIRTY SECONDS"

  # ---------------- THE COUNT: who goes early ----------------
  - id: P07
    shape: wide
    gap: long
    bg: black
    camera: "low angle up at Minho from beside Kwak's head"
    art: >
      Low angle from the floor beside Kwak's head: the rim of the bag-valve mask and Sejin's gloved hands in the near foreground, lower left.
      Minho (minho: headlamp band, radio on his LEFT chest) on one knee, the survey pole in his left hand, holds up his RIGHT wrist so the
      others can see its white ring. His face is hard and practical: the licensed lead giving the safe order, firmly, not coldly. His headlamp
      beam cuts across the frame. Behind him the cracked ceiling with one thin bar of green light. Dust on everything; violet shadows.
    calm: top-left
    lines:
      - {who: minho, type: speech, side: r, text: "THUMB ON IT AND GO. ALL OF YOU."}
    sfx:
      - {text: "29", style: impact, at: [0.86, 0.18], size: L, rot: 6}
    notes: "A conscious bearer can trigger their mark at once, here by pressing it with a thumb (the method is decided here; match ch 10's film if it showed another). Minho gives the textbook order."

  - id: P08
    shape: full
    gap: none
    bg: white
    camera: "eye level on the gravel inside the ring of barriers, three-quarter toward the frame"
    art: >
      At the gate (guro_pit), the slit's rim still bright cold white-cyan. Out of the black-violet slit, in flat flashes of white, the clear
      team (extras.ironclad) step out one after another onto the gravel, relaxed and pleased with themselves. Their lead (extras.ironclad_lead:
      undercut, greatsword across her back, sunglasses pushed up) strolls past Taeo without breaking stride, throwing him a lazy sideways look;
      behind her the team's cameraman (extras.ironclad_cam) walks out backwards filming the others on his gimbal phone (screen unseen). Last,
      unfilmed, the two staging porters (extras.porters) stumble out with empty A-frames and sit straight down on the gravel. In the foreground
      right, Taeo (taeo, outdoor, dried blood under his nose) searches the faces past their armoured shoulders, tense, eyes jumping from one to
      the next. Behind him Haein holds her phone up like a stopwatch (screen turned away). The frame's posts, the orange barriers. Hazy flat
      light; grey gravel. The silver sponsor patches are blank.
    calm: top-left
    lines:
      - {who: ironclad_lead, type: speech, side: l, text: "SEE? THE MARKS DO THE REST."}
      - {who: taeo, type: float, text: "CONSCIOUS PEOPLE CAN COME OUT AT ONCE."}
    sfx:
      - {text: "28", style: impact, at: [0.10, 0.84], size: L, rot: -6}
      - {text: "FWSH", style: gate, at: [0.44, 0.34], size: M, rot: -10}
      - {text: "FWSH", style: gate, at: [0.58, 0.46], size: S, rot: 8}
    notes: "Ironclad pressed their marks the instant the boss died; each bearer returns to the threshold they crossed. The lead repeats what she told Taeo in ch 16 P53 ('THEN WE KILL THE BOSS. THE MARKS DO THE REST.'). She is right about the rule and has no idea who is still inside."

  - id: P09
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up, front, Taeo's face past a hunter's armoured shoulder"
    art: >
      Close-up of Taeo (taeo): dried blood under his nose, the one small mole under his RIGHT eye, sweat at the temple, dust on his cheek, the
      rim's cold light on one side of his face. His eyes have stopped searching. The last hunter's charcoal shoulder plate slides out of frame
      at the left edge. His face is very still: the floor dropping out from under him. Plain grey background.
    calm: left
    lines:
      - {who: taeo, type: float, text: "NIB WAS CONSCIOUS."}
    sfx:
      - {text: "27", style: impact, at: [0.16, 0.16], size: M, rot: -4}

  - id: P10
    shape: wide
    gap: none
    bg: black
    camera: "over Minho's right shoulder, looking down at Nib"
    art: >
      Over Minho's right shoulder (his brown jacket and the survey pole in the near foreground, right), looking down. Nib (nib) does not touch
      his mark. Still kneeling, still holding Kwak's hand in his LEFT, he shifts his body so that his chest and shoulders cover Kwak's head and
      face, between him and the ceiling: ears flat, jaw set, his amber eyes up at Minho, unblinking. Sejin, under him, keeps squeezing the bag.
      Headlamp light, violet shadows, grit falling.
    calm: top
    lines:
      - {who: minho, type: speech, side: r, text: "HIS MARK BRINGS HIM AT ZERO."}
      - {who: minho, type: speech, side: r, text: "YOURS WON'T CARRY HIM."}
    sfx:
      - {text: "26", style: impact, at: [0.08, 0.22], size: L, rot: -5}
    notes: "The rule, shown honestly: a mark carries its bearer and their worn or carried gear, not another person. Kwak cannot press his own; it will take him at zero by itself."

  - id: P11
    shape: inset-l
    gap: short
    bg: black
    camera: "close-up, Sejin from Kwak's eye line"
    art: >
      Close-up of Sejin (sejin): headlamp on its band, cropped hair grey with dust, tired eyes fixed on Kwak's chest rising, not on Minho; both
      gloved hands on the bag-valve mask mid-squeeze. Her face is flat and certain: a medic stating a fact. The white ring on her right wrist.
      Dark background, falling grit.
    calm: right
    lines:
      - {who: sejin, type: speech, side: l, text: "IF THE ROOF GETS HIM FIRST, HIS MARK BRINGS OUT A BODY."}
      - {who: sejin, type: speech, side: l, text: "A MARK ISN'T A STRETCHER."}
    sfx:
      - {text: "25", style: impact, at: [0.84, 0.14], size: M, rot: 5}
    notes: "Marks do not heal or revive, and they bring back the dead too (the v3 rule). This answers Dokgo's ch 14 logic ('the return marks will bring Kwak out'). It echoes her 'SUMMONED IS NOT A DIAGNOSIS.' (ch 10)."

  - id: P12
    shape: strip
    gap: short
    bg: black
    camera: "extreme close-up, Nib's eyes in the headlamp light"
    art: >
      Extreme close-up strip of Nib's eyes and brow, the subject in the middle third: amber eyes, dust in his eyebrows, the V-notch of his LEFT
      ear at the frame edge, grit falling past. Not angry: decided. A small white glow from below (his mark). Violet-black around.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "I STAY."}
    sfx:
      - {text: "24", style: impact, at: [0.90, 0.50], size: M, rot: 0}

  - id: P13
    shape: wide
    gap: short
    bg: black
    camera: "low, side-on, Minho planting the prop over the group"
    art: >
      Low, side-on. Minho (minho) looks at the three of them for one beat, then moves: the survey pole slung on his back, he has dragged the
      steel shoring prop from the far wall and plants it upright beside the group under the worst of the cracks, both hands on it, shoulder set,
      in a wide low stance. His face: a short breath out through the nose, half a curse, then focus. His headlamp swings up across the crack
      web; three fissures now show green-dusk light. Below him, Nib and Sejin bent over Kwak. Low in the side wall behind them, the stone
      plugging the black fissure rocks in its hole.
    calm: top-right
    lines:
      - {who: minho, type: speech, side: r, text: "...THEN NOBODY GOES EARLY."}
      - {who: minho, type: announce, side: r, text: "TWENTY-THREE."}
    sfx:
      - {text: "23", style: impact, at: [0.10, 0.80], size: L, rot: -6}
    notes: "Minho changes his own order: the licensed lead chooses to share the porter's risk. From here he counts aloud. The prop is the one flung against the wall in ch 16 P04."

  - id: P14
