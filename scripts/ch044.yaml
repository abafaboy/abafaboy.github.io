chapter: 44
title: Not Fine
when: "Saturday morning, directly after ch 43. The container threshold, a walk around Ryu Survey yard, a family call, and the recovered porter ID. Grandpa remains in Seoul at the end."
story_beats: PART_ONE_BEATS.md#44
cast:
  taeo: default # black hoodie, black cargos, striped black sneakers; rolls both sleeves on page; fresh/fading forearm bruises persist
  grandpa: default # seventy-four, blue work cap, grey pocket jacket, blue-grey shirt, brown trousers, old dark shoes
  nib: default # EXACT brown boots from ch 43 throughout; all anatomy, gear and belt locks unchanged
  orrin: default # yard; Sinjeong shell crack remains, no load work
  grandma: default # video call only from Haeseong, current age 71, plaid blouse, cream vest and glasses
  haru: default # video call only, current age TEN, yellow dinosaur T-shirt, blue shorts
locations: [ryu_practice_yard, grandparents_house]
location_notes:
  ryu_practice_yard: "Keyed south gate, southwest grey office, southeast white van, fixed plywood maze and north targets. Home container separate: close-framed grey corrugated door and step, low table, lamp and family-photo shelf within; keyed office is not retconned into a bedroom. Watchmen's walk follows clear perimeter aisle, not through changed maze walls."
  grandparents_house: "Video uses canonical room: north kitchen, low centre table, east window, south courtyard doors, WEST TV cabinet with modern flat-screen dark. No CRT in present day."
props:
  boots: "Nib: matte dark-brown ankle-high leather lace-up work boots, broad round toe, FOUR pairs dull gunmetal round eyelets, dark-brown round laces in small double knots, plain black lug soles with low heels, heel pull tabs. Oat-grey short socks just inside collars. No hooks, buckles, logos, bright trim or steel toe plates."
  nib_gear: "Adult 105 cm, LEFT ear V-notch, single LEFT lower fang, brown rope belt, RIGHT leather pouch with dinosaur sticker and pale-blue ID/paper watch drawing/marked cobalt pencil; LEFT brown wooden sheath. High matte black 8x30 binoculars, LEFT woven-strap knot, Kett fork on hinge."
  phone: "Dark grey, hairline crack TOP LEFT, green dinosaur sticker in clear case."
  father_id: "Recovered original Seogang porter day ID, pale grey laminated card, thumb-worn corners and water-clouded lower edge; small photograph of taeo_father in cheap work shirt. Cracked empty lanyard slot, no blood or magical mark. Pencil on reverse exactly: Day 3. Foreman says we go in first. Taeo's birthday next week."
  envelope: "Plain old off-white envelope, creased but not sealed with wax. In Grandpa's overnight bag since arrival; contents unseen until this chapter."
palette_notes: "A4 yard ochre/warm brown/sky blue. Container interior morning: cool grey-blue daylight from open door, plain cream walls, brown table, no dramatic glow. Family video Haeseong amber/brown kitchen light. Injuries muted violet/yellow-grey, skin intact. No actual transfer or new interface in this chapter."
