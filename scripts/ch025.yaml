chapter: 25
title: I Am Not Equipment
when: "Immediately after ch024's yard conversation, after midnight; then the following working day, morning at the AAO, afternoon at the Ryu yard. The two-link discovery happens in late-afternoon light. No absolute date or weekday lettered."
story_beats: PART_ONE_BEATS.md#25
cast:
  taeo: outdoor # navy zip jacket, black hoodie and cargos, black sneakers with one white stripe. Exactly one mole below RIGHT eye. Olive backpack with faded orange shield/open-door patch; dark grey cracked phone with green dinosaur sticker. Pulse always RIGHT palm.
  nib: default # adult 105 cm, wiry and weathered, never cute outside chibi. LEFT-ear V-notch, one lower LEFT fang, brown rope belt, pouch RIGHT with dinosaur sticker and cobalt fork-mark pencil, brown wooden sheath LEFT, barefoot. Matte black 8x30 binoculars high on chest, woven strap knot LEFT neck, fork on hinge. Pale-blue ID and PAPER post drawing in pouch. Borrowed ear-hole hard hat only for scaffold work.
  orrin: default # adult stoneback carrier, 230 cm long, shell 135 cm high, layered terraced dark slate; olive-grey skin, long neck, sagging cheeks, heavy olive lids, four columnar legs, three blunt nails each foot, short tail. No clothes, collar, saddle, harness or cargo fitted to body. Shell intact. NEW link colour slate-green #70877B, first visible in Taeo's RIGHT palm P56–57.
  minho: default # brown jacket, grey T-shirt, olive cargos, knee pads, brown boots, grey streak LEFT temple, radio LEFT chest, watch LEFT.
  haein: default # jaw-length black bob without grey, slate-blue bib overalls, beige tee, brown tool belt, clear safety glasses.
  chae: default # navy cardigan, white collared shirt, black trousers, brown bob, blank ID; dark tablet.
  dr_pyo: default # mid-grey suit, ivory shirt, sage tie, rimless glasses, salt-and-pepper side part, blank institute badge, courteous and curious.
extras:
  photo_clerk: "AAO photo technician, Korean woman about 40, short dark hair, pale-blue work blouse, navy trousers, small silver stud earrings; practical and unfazed."
  client_foreman: "Prospective warehouse client's foreman, man about 45, cropped black hair, broad nose, pale-grey zip work jacket over a faded navy polo, dark work trousers, brown shoes, steel clipboard and clean white hard hat carried under left arm. Not Dokgo; not Bluebird. Speaks in estimates and deadlines, not snarls."
locations: [ryu_practice_yard, aao_office, aao_service_court]
location_notes:
  ryu_practice_yard: "Use keyed grey office container southwest, one remaining white Ryu van southeast, fixed plywood zigzag maze, targets north, trestle west and double gate south. Access ramp beside office step. Orrin's freestanding canvas canopy by pallets outside maze from ch024. Old scaffold observation stand is an ancillary rack beside the west trestle, not a replacement for the keyed maze; two working levels, removable ladder, diagonal braces, no gate inside it."
  aao_office: "Keyed clean office, shelves left, desk north with two dark monitors, east window/blinds, two visitor chairs, navy waiting bench. Only Chae retrieves documents here; Orrin does not fit through its ordinary entrance. Registration work is brought to service court. Public lobby photo booth separate from office."
  aao_service_court: "Unkeyed accessible AAO ground-floor service court: broad vehicle door to covered loading recess, smooth blue-grey paving, portable desk under a canopy. A standard narrow photo booth stands just inside the lobby's glass wall with a seat, pale curtain and dark lens. Staff wheel its camera unit and plain backdrop into the court after the fit gag; no miraculous enlargement of booth. No fictional legal powers beyond the established arrival registration."
palette_notes: "A4 yard ochre/warm brown with sky blue by day, office doorway warm against navy at night. AAO clean blue-white institutional light, light slate shadows, navy clothing, muted green exit plaques. System cyan #3FE3F2/navy #0B1530 only in final window. Nib link amber #F2A93B and Orrin slate-green #70877B stay distinct, both in Taeo's RIGHT palm. No red, blood or purple recoil injury introduced. Flat cel shadows, warm dark contours, no haze or decorative motes. All papers, photo print strips, notices and screens blank except story-critical ui labels."
