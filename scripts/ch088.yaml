chapter: 88
title: Fault
when: "Immediately after ch 87's supplier-plate reveal; the next day at an unrelated municipal service test site, then that evening back at Ryu Survey's yard. No calendar date fixed."
story_beats: PART_ONE_BEATS.md#88
cast:
  taeo: outdoor # No live load in this chapter; irregular rhythm and old bruising persist. Clinicians authorise supervised measurement only at P36.
  nib: default # Exact chosen ch 43 boots; all locked gear.
  dara: default
  sejin: default
  haein: default
  kesh: default
  orrin: default
  park_doyun: default # TTOK response only, not physically present.
extras:
  site_supervisor: "Municipal contractor's site supervisor, Korean woman about 47, sturdy, short dark hair, faded grey work jacket, muted orange vest and white hard hat; blunt but responsible, tablet in plain rubber case. No corporate-villain styling."
props:
  nib_gear: "LEFT-ear V-notch, LEFT lower fang, brown rope belt, RIGHT dinosaur-sticker pouch, LEFT brown wooden sheath; pale-blue ID, folded PAPER post drawing and cobalt pencil with fork protected in pouch. Black 8x30 binoculars, woven strap knot LEFT neck, hinge fork. Boots: matte dark-brown ankle leather, broad round toes, four dull gunmetal round eyelet pairs, brown round laces in small double knots, heel pull tab, low black lug soles, oat-grey socks just inside collars, no logo or metal toe."
  taeo_gear: "RIGHT-eye mole; olive backpack with faded orange knock-off OLD team patch; dark grey phone, TOP-LEFT hairline crack, green dinosaur sticker. Cumulative forearm bruises and irregular resting rhythm unchanged. No restored reservoir, no new link colour, no body used as a test sink."
  fault_unit: "A modified anchor unit in a municipal test cradle, separate from clinic medical canisters. Palm-sized dark mineral core SEALED behind a dull translucent inspection cover, matte grey rectangular casing, added off-centre brass bridge across two external terminal housings, silver crimp sleeve on the bridge's RIGHT end. Navy Venn supplier plate. Do not open or burn the core. Bag and retain only the already-detached outer service tab; whole unit quarantined intact."
  fault_signature: "On the independent recorder: two short forward teeth, a conspicuous flat gap, then one reverse tooth BEFORE the mechanical load moves. This repeatable shape is saved as a reference, not explained or named as sabotage. Use identical shape for the ch 94 comparison."
locations: [provincial_clinic, municipal_service_site, ryu_practice_yard]
location_notes:
  provincial_clinic: "Match ch 87: six-station dialysis clinic; north service alcove, module north wall, bolted canister cabinet west, ledger shelf. Opening still at the cabinet. No patient or device failure here."
  municipal_service_site: "New unkeyed site, unrelated to the clinic and to Yeoju: fenced concrete municipal equipment-testing apron outside Seoul. South access gate; west instrument shelter, centre low steel test cradle with enclosed anchor unit and a captive sandbag sled, north concrete backstop, east clear evacuation lane. The sled is physically captive on a short rail and limited by a padded catch. No dungeon gate, boss, field ore or patient equipment. White Ryu service van outside south fence."
  ryu_practice_yard: "Canonical fixed plywood maze, north targets, grey southwest office container, southeast white van and south double gate. Evening theory at west trestle, two EMPTY portable practice frames on clear south apron. No gate anomaly in the yard."
palette_notes: "Clinic cool white/slate with steady warm doorway light. Service site concrete grey, muted orange safety vest, blue-white daylight and brown-grey shadows; danger red only emergency-stop cap. Yard evening: A4 ochre/brown with cream work lamp and navy shadows. Kesh wings grey-brown/olive, never glitter. Flat cel and hard shadows, warm weighted ink; all diagrams, plates and screens blank/simple shapes unless ui fills them."
panels:
  - id: P01
    shape: strip
    gap: none
    bg: navy
    camera: "same supplier-plate detail as ch 87 hook, slightly wider"
    art: >
      provincial_clinic north alcove: the sealed light-grey medical-fuel canister with dark slate collar
      and protective handles rests securely in the west cabinet. Blank navy supplier plate faces
      camera; Sejin's sage cuff enters with a notebook. White task lamp, cool grey/navy. No leak,
      pulse, open fuel or failing machine.
    calm: none
    ui:
      - {kind: label, text: "VENN LOGISTICS", at: [0.50, 0.57], size: 40}
    notes: "Direct continuation of ch 87 hook; existing brand reveal, not a new fault or proof connecting the clinic to the next site's incident."
  - id: P02
    shape: wide
    gap: short
    bg: white
    camera: "from the alcove threshold toward Sejin and Nurse Oh's off-frame position"
    art: >
      Sejin (sage scrubs, olive rig) copies supplier details onto a plain notebook at
      provincial_clinic's north alcove. Dara (dara: adult human woman 42, 180 cm, broad strong
      build, square weathered face, dark eyes, dark braid with grey temples, heavy matte slate
      armour over oatmeal surgeon's wrap, scarred bare forearms, LEFT surgical kit, RIGHT cloth roll) studies the closed cabinet.
      Warm treatment-room doorway behind, cool white task lamp in front. Both curious, not suspicious;
      notebook illegible, all machinery normal.
    calm: top
    lines:
      - {who: sejin, type: speech, side: l, text: "CONTACT, DELIVERY DAY, ORDER SIZE. I'LL START WITH QUESTIONS."}
      - {who: dara, type: speech, side: r, text: "YOU'LL NEED MORE PAPER."}
