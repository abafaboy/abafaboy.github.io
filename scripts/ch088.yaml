      beige tee, tool belt, glasses down) checks a grey unit while Taeo (outdoor) and
      Nib wait behind the barrier. Responsible supervisor in orange vest watches. Blue-white daylight,
      muted grey/orange, all badges blank. No clinic, Yeoju territory or gate.
    calm: top
    lines:
