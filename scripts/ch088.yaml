    art: >
      From provincial_clinic's service doorway the six-station room continues in warm afternoon light:
      a covered patient at the east front chair, nurse a distant teal shape, machines
      steady with abstract plain displays. Foreground canister stays closed. Institutional blue-white and cream/slate.
      No alarm, medical crisis or supernatural foreshadowing glow.
    calm: none
  - id: P04
    shape: full
    gap: fade-white
    bg: white
    camera: "establishing from the south gate of a separate equipment apron"
    art: >
