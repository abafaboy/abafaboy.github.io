chapter: 30
title: The Rim
when: "Spring. The same afternoon as ch 29's hook, then Friday's Terrace Gate contract allocation and that evening's call home. The final sequence is the following raid morning. No calendar date is lettered."
story_beats: PART_ONE_BEATS.md#30
cast:
  taeo: outdoor # Navy zip jacket, black hoodie/cargos, black sneakers with one white stripe; mole RIGHT eye. Old purple RIGHT forearm bruise, no new injury. Patched olive backpack and cracked dinosaur-sticker phone.
  nib: default # Adult and barefoot. LEFT ear notch/LEFT lower fang; brown rope belt, RIGHT pouch with dinosaur sticker, LEFT wooden sheath. Matte-black 8x30 binoculars, black strap knot LEFT neck, fork on hinge. New charcoal stitching RIGHT outer thigh. From raid morning P44, white Ryu site hard hat with two ear holes, chin strap fastened.
  orrin: default # Adult stoneback, 230 cm long, 135 cm shell height, stacked slate, four columnar legs, three blunt nails per foot. Intact shell; fitted removable rim brace from P17, no cargo harness.
  haein: default # Slate-blue bib overalls, beige tee, brown belt with spanner RIGHT, screwdriver LEFT; short black bob, clear safety glasses.
  sejin: default # Sage scrubs, olive medic rig, charcoal cargos, dark work boots; paid safety officer with authority to halt a test.
  minho: default # Brown jacket, grey tee, olive cargos, knee pads, boots; LEFT-temple grey streak, chest radio, LEFT-wrist watch. Licensed Ryu Survey lead.
  seonhee: default # 55, grey-templed low bun, thin glasses, pencil LEFT ear, moss-grey cardigan over cream rolled-sleeve work shirt, slate trousers, brown shoes.
  grandpa: default # Video only: 74, white hair, weathered tan face, faded blue cap, grey multi-pocket jacket, dark blue shirt, brown trousers.
extras:
  contracts_clerk: "Korean woman about forty-five, short dark hair, steel-grey GMA work jacket, navy trousers, plain lanyard, ink-stained index finger; tired, competent."
  ryu_crew: "Two Ryu survey adults, a stocky middle-aged man and a younger woman, red-orange vests, white hard hats, work boots; background central-route team."
props:
  rim_brace: "Haein's removable LEFT anterior rim brace: two short dull galvanized scaffold channels sandwich a broad canvas pad under the overhang, secured to each other by two scaffold half-coupler clamps; never drill through living shell. Two short hinged diagonal steel props fold rearward during travel, hook-clipped to the channels. At the chosen position they swing down, their square feet seat against firm stone, and the lower locking pin aligns when Orrin plants his forefoot. Pin inserted completes the setup. An outboard rope eye takes a separate short survey safety rope. Directs a glancing mechanical load toward angled forelegs and ground. No lights, motor, reservoir, restraint or saddle. Cannot survive a head-on charge."
  money: "Nib contributes ₩300,000 of saved wages, voluntarily; Taeo supplies ₩1,700,000. Total east entry fee ₩2,000,000. Neither person's remaining balance is fixed. Banknotes plain rectangles; numbers only in ui labels."
locations: [ryu_practice_yard, terrace_gate_rim, grandparents_house]
location_notes:
  ryu_practice_yard: "Keep drawn key: south gate, southwest grey office, fixed maze central, west trestle, north targets. No vans remain after ch 29. Ch 28 home container and workshop stay in the prior script's positions; use close crops rather than inventing a plan."
  terrace_gate_rim: "New set, no drawn key. Terrace Gate site is a fenced disused freight hardstanding with low warehouses, dusty ochre gravel, and a grey contracts cabin west with ramp and outside table. East route uses the near door-height violet-black slit in a bolted scaffold-tube steel frame on concrete feet, facing west with orange cordon. A separately licensed central connection is farther across the same apron, kept small or outside close crops. Local boss death closes its own connection (STORY_BIBLE F17); matches parallel ch 32. Raid canopy and medic station left/southwest of east frame; white cable with blue metre bands feeds its lower southwest corner."
  grandparents_house: "Video image follows drawn key: low table, north kitchenette, dark TV on west cabinet, east two-pane window and south sliding doors to courtyard. Evening pendant light; no meal settings required on a close crop."
palette_notes: "Yard A4 ochre/brown/sky blue; contract site dusty ochre gravel and cool concrete fittings, blue-grey shadows, muted safety orange. Evening yard warm work lamp against deep blue-grey. Haeseong video: warm amber/brown. Gate violet-black with cold rim; no interface or load percentage increase this chapter. Flat cel colour and hard shadows, no bloom."

panels:
  # THE PERSON UNDER THE MEASUREMENT
  - id: P01
    shape: strip
    gap: none
    bg: white
    silent: true
    camera: "extreme close-up under Orrin's left rim, same measurement as ch 29's hook"
    art: >
      At ryu_practice_yard continue directly under Orrin's LEFT rim. Haein's blunt calipers hold the
      width of the unsupported lip; Taeo's pointing hand has stopped just beyond them, black cuff and
      old purple RIGHT forearm bruise visible. The shell is completely unbroken. Southwest afternoon
      sun picks out the slate upper edge, ochre reflected light below, hard brown shadow underneath.
      No fracture, impact, dimensions drawn in art or active link.
    calm: none

  - id: P02
    shape: wide
    gap: short
    bg: white
    camera: "at Orrin's eye level, Taeo above him on left and Haein crouched right"
    art: >
      Orrin in ryu_practice_yard looks from Haein's calipers to Taeo's shocked face. His long adult
      tortoise neck, heavy olive eyelids and stacked slate frame him; he is patient, but finished waiting.
      Taeo in navy jacket has folded the map against his thigh. Haein crouches in slate-blue overalls,
      tools safely lowered. Afternoon sun southwest, A4 ochre/brown yard, grey shell. No pet posture,
      cute face, harness, brace yet or readable diagram.
    calm: top
    lines:
      - {who: orrin, type: speech, side: c, text: "THAT EDGE LIFTS WHEN I BREATHE."}
      - {who: taeo, type: speech, side: l, text: "I DIDN'T KNOW."}

  - id: P03
    shape: tall
    gap: short
    bg: white
    camera: "low from the folded map toward Orrin's level gaze"
    art: >
      At ryu_practice_yard Orrin fills the lower half of a tall frame with his face and two squarely
      planted forelegs, looking up at Taeo with calm hurt rather than anger. Taeo's rolled navy sleeve
      and measuring sketch occupy one edge; Haein's calipers the other. Bare ochre air above the shell
      gives the line space. Southwest sun, hard brown shadows, muted slate. No impact, cracks, nameplate,
      props worn by Orrin or decorative light.
    calm: top
    lines:
      - {who: orrin, type: speech, side: c, text: "YOU MEASURED ME. YOU DIDN'T ASK ME."}
    notes: "Required correction. He allowed Haein's measurement in ch 29, not Taeo's assumption about his body."

  - id: P04
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 30 · THE RIM"

  - id: P05
    shape: inset-l
    gap: long
    bg: white
    silent: true
    camera: "close-up on Taeo, slightly high, map lowering out of view"
    art: >
      Taeo at ryu_practice_yard drops his eyes to the folded map, mouth opening on a reflexive answer,
      then closes it. Mole below RIGHT eye, messy black hair, black hood beneath navy jacket; old bruise
      at rolled RIGHT sleeve. Afternoon sun southwest, plain ochre behind, hard cool shadow under his
      brow. Do not draw a thought bubble, explanation or softened baby face.
    calm: none

  - id: P06
    shape: wide
    gap: short
    bg: white
    camera: "profile two-shot as Taeo kneels properly in front of Orrin"
    art: >
      In ryu_practice_yard Taeo kneels to Orrin's head height and sets the sketch flat on the ground
      outside the forefeet, both empty hands resting on his knees. His face is ashamed and attentive.
      Orrin studies him, head steady. Haein steps out of their direct eye line with her tools. Sun from
      southwest, ochre dirt and brown cel shadows against slate shell. No glow, touch without permission
      or imposed animal pose.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "YOU'RE RIGHT. SORRY."}
      - {who: taeo, type: speech, side: l, text: "WHERE CAN YOU TAKE PRESSURE?"}
      - {who: orrin, type: speech, side: r, text: "WATCH MY FEET."}

  - id: P07
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "ground-level close on Orrin shifting his forefeet"
    art: >
      Orrin at ryu_practice_yard rotates his two columnar forelegs outward and settles his three-nailed
      feet diagonally, pressing into packed ochre ground without scraping up a dramatic cloud. His weight
      lowers through the shoulders, the free shell lip visibly staying clear of the dirt. Taeo's black
      sneaker and Haein's work boot stand well outside the toes. Southwest sun, slate and ochre with
      hard brown shadow. No fracture, impact test or imaginary extra joints.
    calm: none

  - id: P08
    shape: wide
    gap: short
    bg: white
    camera: "front three-quarter on Orrin demonstrating the lowered stance"
    art: >
      At ryu_practice_yard Orrin deliberately lowers his front body over the angled forelegs and lifts
      one heavy eyelid at Taeo, who leans forward listening. Nib, repaired RIGHT shorts seam and binoculars
      clear, stands beside the far foot observing like another tradesman. Southwest sun on slate layers,
      A4 ochre and brown yard. No side-saddle rider, cargo harness, active pulse or shell crack.
    calm: top
    lines:
      - {who: orrin, type: speech, side: c, text: "HERE. INTO THE LEGS. DOWN."}
      - {who: orrin, type: speech, side: c, text: "THE EDGE KEEPS THINGS OUT. IT DOESN'T HOLD ME UP."}

  - id: P09
    shape: inset-r
    gap: short
    bg: white
    camera: "close on Haein at Orrin's left shoulder, pencil held still"
    art: >
      Haein at ryu_practice_yard has her own plain carpenter pencil poised above a blank pad, then
      stops to look into Orrin's face first. Short black bob, clear glasses on crown, slate-blue bib
      overalls and beige tee, tool belt. Her expression is newly curious, no defensive grin. Afternoon
      southwest light, ochre and slate background. No labels on the pad or tool touching his shell.
    calm: left
    lines:
      - {who: haein, type: speech, side: r, text: "WOULD SUPPORT UNDER THE RIM HURT?"}
      - {who: orrin, type: speech, side: l, text: "NARROW SUPPORT WOULD."}

  - id: P10
    shape: wide
    gap: short
    bg: white
    camera: "over Orrin's lowered shoulder toward Haein's pad and Taeo listening"
    art: >
      At ryu_practice_yard Haein holds her pad low where Orrin can see it, drawing a broad shallow
      channel and two short props as simple geometric shapes, no writing. Orrin indicates the width
      by shifting his neck toward two points on the rim; Taeo's hands stay on his own knees. Nib leans
      over the map on the ground. Southwest sun, tan paper, ochre and slate, hard brown shadows.
      No glowing diagram, new machinery or contact without permission.
    calm: top
    lines:
      - {who: orrin, type: speech, side: l, text: "WIDE. SOFT UNDER IT. ROOM FOR MY SHOULDER."}
      - {who: haein, type: speech, side: r, text: "I HAVE SCAFFOLD CLAMPS."}
      - {who: taeo, type: speech, side: c, text: "AND I HAVE AN ARROW TO ERASE."}

  - id: P11
    shape: inset-l
    gap: short
    bg: white
    style: chibi
    camera: "chibi drafting gag, flat ground"
    art: >
      CHIBI at ryu_practice_yard reduced to flat ochre dots. Chibi Taeo erases the same giant arrow
      until the paper has a hole, sweat pouring, olive backpack's old orange patch clear. Chibi Nib
      calmly lays a second blank sheet beneath it, deadpan; LEFT notch, rope belt, RIGHT pouch/sticker,
      LEFT wooden sheath, binoculars and bare feet intact. Chibi Orrin's heavy lids watch from one side.
      Simple afternoon light. No written annotations, real injury or serious confession in chibi.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "YOU'VE MADE A TUNNEL."}
      - {who: taeo, type: nervous, side: r, text: "SORRY. NEW ROUTE."}

  - id: P12
    shape: full
    gap: long
    bg: white
    camera: "high establishing angle on the west trestle turned into a workbench"
    art: >
      At ryu_practice_yard's west trestle Haein works with safety glasses DOWN, clamping two short dull
      galvanized scaffold channels to a wooden block to file the sharp edges. Two half-coupler clamps,
      broad folded canvas pad and short hinged props lie separately on the bench. Orrin waits close
      enough to consult, head level with the work; Taeo holds the new blank sketch and Nib sorts blunt
      bolts. Empty southeast van space, fixed maze behind. Late southwest sun, A4 ochre/brown with dull
      grey metal. No sparks, motors, reservoir, text or drilling through Orrin.
    calm: top
    lines:
      - {who: haein, type: speech, side: l, text: "RIM BRACE. THE CLAMPS JOIN THE METAL. NOTHING GOES THROUGH YOUR SHELL."}
      - {who: orrin, type: speech, side: r, text: "I APPRECIATE THAT DISTINCTION."}

  - id: P13
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up of the canvas pad seated inside a channel"
    art: >
      On the ryu_practice_yard trestle Haein's gloved hands fit a broad canvas pad into the shallow
      galvanized channel, covering all metal edges that will touch the underside of Orrin's LEFT rim.
      Two scaffold half-couplers secure channel halves to each other. A hinge and a folded short prop
      sit clear at the outside edge. Low southwest sun, muted steel grey, canvas tan, warm brown bench.
      No printed instructions, electronics, spikes, pinching jaw against skin or fasteners through shell.
    calm: top
    lines:
      - {who: haein, type: speech, side: l, text: "THIS BUYS A GLANCING HIT. NOT A HEAD-ON ONE."}

  - id: P14
    shape: wide
    gap: short
    bg: white
    camera: "at Orrin's left rim, profile, Haein holding the finished piece short of contact"
    art: >
      At ryu_practice_yard Haein holds the small finished brace beneath Orrin's LEFT anterior rim
      without yet touching him, gaze asking. Orrin angles his forelegs into the demonstrated stance
      and gives a deliberate nod. Taeo crouches at the head watching his expression; Sejin stands
      nearby with hands on her medic rig. Warm afternoon sun southwest, ochre/brown and slate grey.
      No straps over Orrin's back, armour suit, boss or injury.
    calm: top
    lines:
      - {who: haein, type: speech, side: l, text: "TRY THE FIT?"}
      - {who: orrin, type: speech, side: r, text: "SLOWLY."}
      - {who: haein, type: speech, side: l, text: "YOUR SPEED."}

  - id: P15
    shape: narrow-r
    gap: short
    bg: white
    camera: "close on Orrin's face during the gentle fit"
    art: >
      Orrin at ryu_practice_yard breathes out slowly as Haein seats the padded brace below frame.
      The heavy adult eyes narrow in concentration, then one lid eases; his mouth gives a tiny dry
      sideways movement. Slate layers rise behind the head, no crack. Sun southwest, grey-olive skin
      and ochre reflected light, hard brown shadow. No smile of a pet, saddle, restraint or extra limbs.
    calm: left
    lines:
      - {who: orrin, type: speech, side: r, text: "LEFT SIDE. A LITTLE FORWARD."}

  - id: P16
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "ground-level detail of both props planted beside the angled forefoot"
    art: >
      At ryu_practice_yard the brace's two short hinged props now stand down from the padded LEFT
      anterior rim, square feet against a firm practice paving slab. Orrin's own LEFT forefoot is
      planted diagonally beside them, three blunt nails clear, shoulder free to move above. Haein's
      hand withdraws after sliding the lower locking pin through the aligned holes. Sun southwest, dull grey metal, ochre dirt and brown
      shadows. No magical effect, shell puncture, tension tether, full weight drop or numerical dial.
    calm: none

  - id: P17
    shape: wide
    gap: short
    bg: white
    camera: "side view of the safe static lean with all three partners visible"
    art: >
      At ryu_practice_yard Orrin slowly leans his own weight into the set brace, feet angled, keeping
      his head free. Nib lightly touches the padded outer channel with one palm to feel the movement;
      Taeo kneels at his face to listen rather than staring at a gauge. Haein watches shoulder clearance,
      Sejin watches Taeo. Late sun from southwest, ochre/brown, slate and muted canvas. No impact,
      active share, glowing hands, cracks or strain lines implying danger.
    calm: top
    lines:
      - {who: orrin, type: speech, side: c, text: "THERE. THAT GOES DOWN."}
      - {who: taeo, type: speech, side: r, text: "HOW DOES IT FEEL?"}
      - {who: orrin, type: speech, side: c, text: "LIKE SOMEBODY ASKED."}

  - id: P18
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up on Taeo folding the revised map"
    art: >
      Taeo at ryu_practice_yard folds the new unlettered route sketch carefully, looking out of frame
      at Orrin, small tired smile with embarrassment still in it. Navy jacket sleeves lowered over old
      RIGHT forearm bruise. The chalky erased sheet lies discarded behind him, not put back into use.
      Late southwest light, muted navy against ochre, brown shadow. No new window or restored confidence grin.
    calm: right
    lines:
      - {who: taeo, type: float, text: "I WANTED A PLAN THAT DIDN'T NEED CORRECTING."}
      - {who: taeo, type: float, text: "HE NEEDED ONE THAT COULD BE."}

  - id: P19
    shape: wide
    gap: short
    bg: white
    camera: "low side view as Haein folds the props up for travel"
    art: >
      At ryu_practice_yard Haein folds both short brace props rearward along the padded LEFT-rim
      channels and secures them with hook clips. The lower locking pin stays safely retained on its short chain; a
      plain survey rope coils at the outboard eye. Orrin lifts his forebody out of the test stance,
      head turned to check the compact travel position. Nib, repaired charcoal shorts and bare feet,
      removes the practice paving slab from the path. Sunset approaching from southwest, A4 ochre and
      warm brown with steel grey. No complete dismantling, straps round neck or unlettered safety tags.
    calm: top
    lines:
      - {who: haein, type: speech, side: l, text: "FOLDED FOR WALKING. FEET DOWN ONLY ON FIRM STONE."}
      - {who: nib, type: speech, side: r, text: "I'LL SET THEM."}
      - {who: orrin, type: speech, side: c, text: "I'LL CHOOSE THE STONE."}
    notes: "Travel state locked for ch 31. Brace is fitted but NOT SET for impact until both props are swung down and seated."

  # FRIDAY: WHOSE NAME, WHOSE MONEY
  - id: P20
    shape: full
    gap: long
    bg: white
    camera: "establishing of the freight hardstanding, looking east toward the near east connection"
    art: >
      Terrace_gate_rim in Friday daylight: a fenced unused freight hardstanding, low plain warehouses,
      grey contracts cabin at west, the east black-violet door-height slit in a bolted steel frame near right,
      and a separately licensed central connection farther across the apron,
      orange cordon around it. At the cabin's outside table Minho in brown jacket faces the clerk;
      Taeo, Nib and Seonhee wait behind: she is fifty-five, grey-templed low bun, glasses, pencil LEFT
      ear, moss-grey cardigan, cream rolled work shirt, slate trousers, brown shoes, worry held in her jaw.
      Haein carries the compact tool roll. Orrin waits beside Nib, LEFT
      rim brace props are clipped up, shell intact. Pale sun south, ochre gravel and blue-grey shadows,
      muted safety orange. All boards blank, no third gate, vans or green device screens.
    calm: top
    lines:
      - {who: narr, type: tag, text: "TERRACE GATE · FRIDAY · CONTRACT ALLOCATION"}
      - {who: contracts_clerk, type: speech, side: l, text: "CENTRAL ROUTE. RYU SURVEY."}
    notes: "Central and east have separately licensed local connections on the same apron, matching ch 32. Killing the east boss closes east, allowing the central run to finish independently."

  - id: P21
    shape: wide
    gap: short
    bg: white
    camera: "across the contract table toward Minho receiving his allocation"
    art: >
      At terrace_gate_rim the contracts_clerk, a tired Korean woman about forty-five with short dark
      hair, steel-grey work jacket, navy trousers and blank lanyard, slides a folder across the table.
      BIG REACTION: Minho lets out a sudden open-mouthed laugh of relief before accepting the folder,
      grey streak LEFT temple, watch LEFT wrist, eyes creased shut for one unguarded beat. Seonhee behind
      him puts one hand over her ledger. South daylight,
      dusty ochre gravel, blue-grey shadow. Paper headings and cabin signs blank until labels.
    calm: top
    ui:
      - {kind: label, text: "CENTRAL ROUTE · RYU SURVEY · AWARDED", at: [0.51, 0.75], size: 32, notes: "place on the folder's blank allocation header"}
    lines:
      - {who: minho, type: speech, side: r, text: "THANK YOU."}
      - {who: seonhee, type: speech, side: r, text: "NOW YOU CAN START WORRYING ABOUT THE ACTUAL JOB."}

  - id: P22
    shape: inset-r
    gap: short
    bg: white
    camera: "close on Minho glancing sideways at Taeo"
    art: >
      Minho at terrace_gate_rim glances at Taeo offpanel, folder under one arm and one corner of his
      mouth lifting in genuine competitive pleasure. Brown jacket, LEFT grey streak and chest radio
      match sheet. A plain grey cabin wall drops the setting to simple shapes; south daylight casts
      a clean blue-grey jaw shadow. No gloating sneer, new rank badge or van.
    calm: left
    lines:
      - {who: minho, type: speech, side: r, text: "TRY TO BRING SOMETHING BACK BESIDES MY SISTER'S CLAMPS."}
      - {who: taeo, type: speech, side: l, text: "I'D LIKE THE CLAMPS BACK TOO."}

  - id: P23
    shape: wide
    gap: short
    bg: white
    camera: "from behind the clerk toward the east crew lined up at the same table"
    art: >
      At terrace_gate_rim Taeo, Nib and Orrin face the clerk in their own line, Seonhee beside Taeo
      with her plain ledger open. Nib's head reaches Taeo's belt, Orrin's slate shell rises behind both;
      no one stands on him. Seonhee is fully visible: fifty-five, grey-templed low bun, glasses, pencil
      LEFT ear, moss-grey cardigan, cream rolled shirt, slate trousers, brown shoes. Her face is sharp
      and tired, determined now. South sun, dusty ochre and blue-grey. Papers blank, no ownership form.
    calm: top
    lines:
      - {who: contracts_clerk, type: speech, side: l, text: "EAST TERRACE. ALSO UNDER THE RYU SURVEY LICENCE?"}
      - {who: seonhee, type: speech, side: r, text: "YES. THREE PARTNERS. ONE OPERATOR OUTSIDE."}

  - id: P24
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up from above on Seonhee signing the licence authorization"
    art: >
      At terrace_gate_rim Seonhee's lined hand signs the blank authorization line of an east-route
      form while her other hand holds the paper steady. Pencil behind LEFT ear is just out of frame;
      cream cuff rolled, moss-grey sleeve. A plain ink signature may be a simple non-readable stroke;
      all named information is reserved for labels. South sun, cream paper, dull grey table and
      blue-grey shadows. No tremor implying collapse, unpaid bill figure or equipment classification.
    calm: none
    ui:
      - {kind: label, text: "EAST TERRACE · RYU SURVEY LICENCE", at: [0.48, 0.23], size: 30, notes: "form header"}
      - {kind: label, text: "AUTHORISED: RYU SEONHEE", at: [0.49, 0.69], size: 30, notes: "authorization field beside signature"}
    notes: "Her signature commits the family licence because she believes in the team. No transfer of guild ownership."

  - id: P25
    shape: wide
    gap: short
    bg: white
    camera: "medium across the table, Taeo turning toward Seonhee"
    art: >
      Taeo at terrace_gate_rim turns toward Seonhee with the start of a worried protest, hands open
      above the tabletop. She meets his eyes over low reading glasses, ledger closed, face a bookkeeper's
      deliberate decision. Nib watches from below table height; Orrin remains quiet behind him. South
      daylight, ochre gravel and blue-grey, muted moss cardigan. No glowing documents or personal-debt waiver.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "ARE YOU SURE? AFTER THE VAN—"}
      - {who: seonhee, type: speech, side: r, text: "I CAN COUNT PEOPLE AS WELL AS LOSSES."}
      - {who: seonhee, type: speech, side: r, text: "SIGN YOUR PART."}

  - id: P26
    shape: narrow-l
    gap: short
    bg: white
    camera: "detail on the east-route fee slip laid before Taeo"
    art: >
      At terrace_gate_rim a small white fee slip lies on the plain contract table, clerk's ink-stained
      finger at its blank total box. Taeo's black cuff and worn wallet enter at the lower edge. Paper
      numbers and writing reserved for the label entry. South daylight, cool grey table with hard
      blue-grey hand shadows, no active terminal screen or visible bank balance.
    calm: none
    ui:
      - {kind: label, text: "EAST TERRACE · ENTRY FEE ₩2,000,000", at: [0.50, 0.38], size: 32, notes: "on the blank fee slip"}
    lines:
      - {who: contracts_clerk, type: speech, side: l, text: "TWO MILLION. BEFORE ENTRY."}

  - id: P27
    shape: wide
    gap: short
    bg: white
    camera: "close on Taeo across the tabletop as Nib's hand enters the lower frame"
    art: >
      At terrace_gate_rim Taeo takes a breath over his open wallet, eyes on the fee slip, polite face
      trying not to flinch. Nib's scarred olive hand enters from the lower side carrying a square folded
      envelope. Seonhee waits without reaching for either person's money. South light, muted navy,
      grey tabletop and blue-grey shadows. No invented full bank balance, bright gold coins or drawn print.
    calm: top
    lines:
      - {who: taeo, type: float, text: "I COUNTED IT AGAIN. IT HADN'T GOT SMALLER."}
      - {who: nib, type: speech, side: l, text: "MOVE YOUR HAND."}

  - id: P28
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "top-down on Nib counting saved notes onto the fee slip"
    art: >
      On terrace_gate_rim's contract table Nib lays three small stacks of soft pale sage banknotes,
      ten notes per stack, each a ₩10,000 note represented only as a plain coloured rectangle. His
      scarred fingers square the edges carefully, a little site dust on one folded corner. Dinosaur
      sticker on RIGHT pouch at crop, LEFT sheath on opposite hip. South daylight, cream paper and
      dull grey table, blue-grey shadow. No readable money printing, new coins or glowing funds.
    calm: none
