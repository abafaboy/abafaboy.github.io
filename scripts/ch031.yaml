chapter: 31
title: Two Pulses
when: "Spring, raid morning, directly after Nib's first step through at the end of ch 30. Roughly the first hour of the east-terrace run. Inside is perpetual green dusk; outside remains morning. No date or exact elapsed-time deadline is lettered."
story_beats: PART_ONE_BEATS.md#31
cast:
  nib: default # Adult, barefoot, LEFT ear V-notch and LEFT lower fang, brown rope belt, RIGHT pouch/dinosaur sticker, LEFT wooden sheath. Buckled white Ryu hard hat, two drilled ear holes, worn throughout. Black 8x30 binoculars, LEFT neck strap knot, fork on hinge. Charcoal repair RIGHT outer thigh; cold-white/violet return ring RIGHT wrist inside. Radio LEFT hand or belt, never magically transmits without intact line.
  orrin: default # Adult stoneback, 230 cm long, 135 cm shell height, stacked slate shell, four columnar legs and three blunt nails per foot. LEFT anterior rim brace fitted; props folded until final setup. Return ring at distal RIGHT foreleg inside.
  taeo: outdoor # Entirely outside: navy jacket, black hoodie/cargos, white-stripe black sneakers, mole RIGHT eye. Olive backpack with old faded orange shield/open-door patch on chair. Existing purple RIGHT forearm bruise; two distinct pulses in RIGHT palm, amber and slate-green.
  sejin: default # Outside: sage scrubs, olive medic rig, charcoal cargos, boots; manual cuff LEFT upper arm of Taeo, watches him as paid safety officer.
  haein: default # Outside: short black bob, slate-blue overalls/beige tee, brown tool belt, clear glasses on crown. Tends Ryu cable and base station, no reservoir device yet.
extras:
  bridge_boss: "Native dungeon ram-beast, far larger than Nib: squat blocky stone shoulders about twice Orrin's shell height, four heavy cloven feet, coarse dark clay/russet-grey plates, low dark-red slit eyes, TWO ridged mineral horns. Outer horn has a pale layered tip. No equipment, fur, return mark or comic face. Slow walking patrol, fast charge. Matches parallel ch 32."
props:
  rim_brace: "Exactly ch 30: canvas-padded dull galvanized LEFT-rim channels, scaffold half-couplers and two short hinged diagonal props, clipped rearward for travel. Square feet must seat and lower locking pin must align after Orrin plants forefoot. Outboard eye has a separate plain survey safety rope coiled ready, never the white radio cable. Final panel: both props swung down, outer foot not seated, lower pin OPEN because near forefoot still settling. No shell puncture, motor, harness or reservoir."
  deposit_cases: "Two identical low dull-grey lidded mineral cases, blank rectangular inventory plates and plain short handles. Start empty on a broad canvas pad atop Orrin's middle shell tier beside folded relay tripods. Filled and shut at P25. Ride side by side on that same pad, handles joined to each other by one short plain webbing loop, never a body harness. Stay carried on Orrin through hook; contents are sale cargo, not integrated."
  survey_line: "White cable, BLUE band every metre; grey short tripod relay at each 50 m, box with speaker grille, coiled-cord handset and white status lamp. Threshold post at landing, then 50/100/150/200 m posts. Nib lays this line as they advance; Haein feeds it outside. Voices across gate only while line intact."
locations: [terrace_gate_east, terrace_gate_rim]
location_notes:
  terrace_gate_rim: "Same ch 30 freight hardstanding with ochre gravel, east connection in near scaffold-tube frame, grey contracts cabin west, orange cordon, southwest operations/medic canopy. Separately licensed central connection lies farther across the apron, off this chapter's close crops, matching ch 32. Each local connection closes on its own boss. No Ryu vans. Taeo, Haein, Sejin stay outside; Minho and central crew are on their own run."
  terrace_gate_east: "New set, no image key yet. Rust-red clay terraces with grey stone cap layers hang over a dark violet void under GREEN DUSK. Shelves are locally level, unlike the tilted Guro basin. Threshold landing is broad and firm. East approach runs along a cliff on the RIGHT, open drop LEFT when advancing, up low stair shelves toward the 150 m mineral shelf. Deposit is in a pale mineral seam on a higher side shelf reached before entering the ram's run-up; boss patrol remains visible below it. At 200 m a sheltered ledge-rest recess in the RIGHT cliff opens onto the inside end of a narrow straight stone bridge/run-up. The boss patrols beyond a square clay buttress at the far end, then has a straight charge lane toward them. Inside wall RIGHT and void LEFT stay fixed. Ram can be turned toward right-hand cliff then over left edge in ch 32; no solution drawn yet."
palette_notes: "Inside A4 wrong-colour saturated green dusk, rust clay, slate caps, VIOLET shadows and dark violet void. Deposit glow is natural pale mint-white #C8D5B5, never operator cyan or link amber. Outside A4-based dusty ochre gravel, blue-grey shadows, east morning sun, muted safety orange. Amber/slate-green appear as distinct short link pulses in Taeo's RIGHT palm; no constant all-day tether, windows, gain beyond 15%, new bruises or nosebleed this chapter."

panels:
  # FIRST FOOT, FIRST PULSE
  - id: P01
    shape: tall
    gap: none
    bg: navy
    silent: true
    camera: "inside just beyond the threshold, low behind Nib as his trailing foot lands"
    art: >
      Directly after ch 30: Nib's trailing bare foot lands on the broad stone-capped landing of
      terrace_gate_east. His 105 cm adult scout silhouette stands against stacked rust-clay terraces
      and a vast wrong-colour GREEN DUSK sky, violet void between shelves. White cable with blue bands
      enters from the slit behind; cold-white/violet ring on RIGHT wrist. Default wrap top, repaired
      RIGHT thigh seam, brown rope belt, RIGHT pouch/sticker, LEFT wooden sheath, black binoculars with
      LEFT strap knot. White site helmet buckled, ears through drilled holes, LEFT notch sharp. Green skylight, violet cel shadows. No boots,
      cute proportions, Guro's tilted ground or operator windows.
    calm: none

  - id: P02
    shape: strip
    gap: short
    bg: navy
    silent: true
    camera: "extreme close-up at the landing edge on Nib's toes and testing hand"
    art: >
      Nib crouches on terrace_gate_east's landing, toes spread on firm grey capstone, one scarred
      olive-green hand feeling the edge before putting weight forward. White cable with blue metre
      band lies on the safe inner side. Fine rust clay dust clings to a fingertip; no crumbling stone
      or blood. Green sky light above, violet shadow under the cap, dark void at far left. Five
      fingers, adult wiry anatomy, no glows or written symbols.
    calm: none

  - id: P03
    shape: tall
    gap: short
    bg: white
    camera: "front three-quarter on Nib at the threshold relay, slit behind right shoulder"
    art: >
      Nib at terrace_gate_east unfolds the first grey relay tripod on the landing and plugs the
      white blue-banded line into its box. He raises his compact radio in LEFT hand, gaze still on
      the unfamiliar terraces. The tripod has a speaker grille, coiled-cord handset and steady white
      lamp, no readable controls. RIGHT return ring, binoculars, repaired shorts and belt sides intact.
      Green dusk sky provides key light, violet shadows, slate landing. No wireless signal graphic or threat yet.
      Nib stands on the left beside the relay; Taeo's voice comes from its speaker on the right.
    calm: top
    lines:
      - {who: "nib", type: "speech", text: "I'M INSIDE. LANDING IS SOLID.", side: "l"}
      - {who: "offpanel:taeo", type: "phone", text: "I HEAR YOU.", side: "r"}
    notes: "Threshold relay established before first through-gate speech. Nib spoke his first line only after connecting it."

  - id: P04
    shape: tall
    gap: short
    bg: white
    camera: "outside at the operations table, from the speaker toward Taeo's right palm"
    art: >
      Outside at terrace_gate_rim Taeo sits beside the base station, navy jacket open over black
      hoodie, LEFT sleeve lowered from shoulder for Sejin's cuff. One thin amber pulse lights his
      open RIGHT palm, scar-free except the old purple forearm bruise above it; he exhales through
      a fearful half-smile. Sejin in sage scrubs watches him, Haein feeds cable beyond. East morning
      sun, ochre gravel and blue-grey shade, old orange backpack patch on chair. No left-palm glow,
      slate-green pulse yet, new blood or interface.
      Taeo sits on the right, Sejin on the left and Haein feeds the cable in the centre background.
    calm: top
    lines:
      - {who: "taeo", type: "speech", text: "NIB'S LINK. ONE PULSE.", side: "r"}
      - {who: "sejin", type: "speech", text: "NOW TAKE ONE BREATH.", side: "l"}
    notes: "Nib deliberately opens his channel after the voice check; a short permitted sample, not involuntary control."

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 31 · TWO PULSES"

  - id: P06
    shape: full
    gap: long
    bg: navy
    camera: "inside, low from the landing's inner wall as Orrin steps through lengthwise"
    art: >
      Orrin crosses lengthwise into terrace_gate_east after Nib: head and front legs on the landing,
      back still through the east door-height slit, no enlarged summon portal. Adult long-necked stoneback,
      230 cm nose-to-tail, 135 cm shell height, terraced slate shell, thoughtful heavy olive eyes, four
      columnar legs with three blunt nails each. LEFT anterior rim brace has both props clipped rearward.
      Two EMPTY low grey mineral cases and folded relay tripods rest on a broad canvas pad at middle
      shell tier, no rider or body harness. Nib guides clearance with an open hand. Green sky and cold
      rim light, violet shadows, rust clay beyond. No shell crack, pet accessories or words on cases.
      Nib on the left guides Orrin through on the right, full bodies visible.
      Nib holds the keyed relay handset toward Orrin with one hand and guides clearance with the other.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "CLEAR ON THE LEFT."}
      - {who: orrin, type: speech, side: r, text: "A GENEROUS DOOR. BY RECENT STANDARDS."}
      - {who: orrin, type: speech, side: r, text: "I'M INSIDE. YOU MAY CHECK MY LINK."}

  - id: P07
    shape: strip
    gap: short
    bg: navy
    silent: true
    camera: "close at ground level as the return ring forms above Orrin's right forefoot"
    art: >
      Orrin's RIGHT forefoot settles on terrace_gate_east's landing. Above the three blunt nails,
      around the distal foreleg, a thin cold-white ring with a violet edge forms where he crossed.
      The white survey cable remains clear of his foot, blue band at frame left. Grey-olive skin,
      pale grey capstone, green dusk key and violet shadow. Not link light, not a cuff, no chain,
      damage, extra nails or text.
    calm: none
    notes: "Orrin is a living entrant and receives a return mark. Native bridge-boss has none."

  - id: P08
    shape: wide
    gap: short
    bg: white
    camera: "medium two-shot of seated Taeo right and Sejin left beside the operations table"
    art: >
      BIG REACTION outside at terrace_gate_rim: Taeo's eyes fly wide as a second distinct slate-green
      pulse appears beside amber in his RIGHT palm. He almost lifts from the chair, then plants both
      feet at Sejin's level stare; wonder and fear break across the same tired face. Navy jacket,
      LEFT upper-arm cuff, old RIGHT forearm bruise, patched backpack on chair. Morning east sun,
      blue-grey canopy shade, ochre gravel. No fresh pain, nosebleed, system window or blended pulse.
      Show Taeo on the right and Sejin on the left, both faces and the right palm clearly visible.
    calm: top
    lines:
      - {who: "taeo", type: "speech", text: "TWO PULSES.", side: "r"}
      - {who: "sejin", type: "speech", text: "STILL ONE BREATH AT A TIME.", side: "l"}
    notes: "Second willing sample across intact line. Same two colours established ch 25; no new power unlock."

  - id: P09
    shape: full
    gap: short
    bg: navy
    camera: "high establishing along the east approach, cliff right and void left"
    art: >
      Terrace_gate_east opens in depth: level grey capstones over rust-red clay shelves, cliff on
      RIGHT and a dark violet drop LEFT while advancing. Low broad stair ledges climb toward a pale
      mineral shelf in the middle distance; beyond it a straight bridge cuts toward a square clay
      buttress. Nib leads barefoot with cable in one hand, Orrin follows slowly with folded brace and
      empty cases, no one else on this route. Wrong green dusk sky overhead, hard violet shadows.
      No Guro tilt, vegetation hiding footing, readable route markers or boss charge yet.
    calm: top
    lines:
      - {who: taeo, type: float, text: "I'D GIVEN THEM A MAP. I WANTED IT TO BE A PROMISE."}
    notes: "Taeo's own floating narration accompanies the cut; it is not a vision feed. He never sees these images through the link."

  - id: P10
    shape: tall
    gap: short
    bg: navy
    camera: "profile from the void side, Orrin placing a foot on a low stair shelf"
    art: >
      On terrace_gate_east's east approach Orrin plants one forefoot fully on a broad low step,
      tests it with a small shoulder shift, then brings his body up without haste. Nib stands ahead
      near the RIGHT cliff, one hand on the next stone, watching Orrin's face for a signal. Empty
      cases and folded tripods sit low on middle shell, LEFT rim props travel-clipped. Green sky key,
      violet shadow, rust clay and grey stone. No cliff fracture, speed rush, saddle or heroic riding pose.
      Nib stands on the left at the next step and Orrin climbs on the right, keeping their entire stances readable.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "YOU CHECK EVERY STEP."}
      - {who: orrin, type: speech, side: r, text: "ONLY THE ONES I INTEND TO USE."}

  - id: P11
    shape: inset-r
    gap: short
    bg: navy
    silent: true
    camera: "close on Nib using the binoculars, front three-quarter"
    art: >
      At terrace_gate_east Nib scans from the safe inside of a shelf, matte-black 8x30 binoculars
      pressed to his eyes, elbows tucked, LEFT strap knot and V-notch clear. He is a weathered adult
      scout fully working, jaw set, not amazed by his own tool. Repaired shorts edge at lower crop,
      RIGHT-wrist return ring visible. Green dusk lights his upper arms, violet cliff shadow behind.
      No lens flare, decorative particles, readable lens numbers or cute features.
    calm: none

  - id: P12
    shape: full
    gap: short
    bg: navy
    camera: "binocular point of view toward the far mineral shelf and lower patrol lane"
    art: >
      Hard black overlapping binocular mask frames terrace_gate_east: above, pale mint-white mineral
      plates glow faintly from a seam in rust clay on a higher side shelf; below and beyond a square
      buttress, the living bridge_boss walks its patrol. It is a huge stone ram-beast, twice Orrin's
      shell height at shoulder, slab skull, TWO ridged mineral horns, outer horn with a pale layered tip,
      four blocky legs with split hooves, russet-grey plates, low dark-red slit eyes.
      Green dusk skylight, violet shadows. No cyan fragment glow, return mark, charge dust or text.
      Nib speaks from behind the binocular viewpoint at the left edge; no scout face is visible in the lens image.
    calm: top
    lines:
      - {who: "offpanel:nib", type: "speech", text: "MINERAL DEPOSIT ABOVE THE BRIDGE. BOSS WALKING BELOW. WE KEEP THE RAM WALKING.", side: "l"}
    notes: "Boss design locked here. The deposit is accessible without killing it. Two ridged horns; pale outer tip is the ch 32 fragment. No break before that fight."

  - id: P13
    shape: strip
    gap: short
    bg: navy
    camera: "close on a stone hoof at the far end of the boss's patrol"
    art: >
      On terrace_gate_east's distant straight bridge-run, one split stone hoof lands beside an old
      worn groove. A lower edge of russet-grey plate hangs over the blocky ankle; the body is out of
      crop. The hoof is walking at a heavy regular pace, not charging, no fresh damage. Green sky
      light, violet shadow, dark drop beyond the bridge edge. No return ring, blazing hoofprint,
      drawn sound or red warning rune.
      Nib's radio report carries over the hoof detail from beyond the left edge, through the intact survey line.
    calm: top
    lines:
      - {who: "offpanel:nib", type: "phone", text: "FIFTY METRES. FIRST LINE POST UP.", side: "l"}
    sfx:
      - {text: "TOK", style: quiet, at: [0.59, 0.65], size: M, rot: -5}

  - id: P14
    shape: full
    gap: short
    bg: white
    camera: "outside, over Haein's shoulder at the marked cable drum"
    art: >
      At terrace_gate_rim Haein controls the white cable drum under the canopy, blue metre bands
      sliding past one gloved hand. Taeo sits beyond with base handset at his mouth and RIGHT hand
      open on his knee, link light currently dark between samples. Sejin checks the manual gauge
      beside his LEFT upper arm, all markings plain. East morning sun, dusty ochre, cool blue-grey
      shade and muted orange cordon. No screen UI, permanent tether, new bruise or changing sky outside.
      Taeo sits on the right and Sejin on the left; Haein's cable drum shoulder frames the left foreground.
    calm: top
    lines:
      - {who: "taeo", type: "speech", text: "COPY. COLLECT THE MINERALS BEFORE FIGHTING THE BOSS. NO HURRY.", side: "r"}
      - {who: "sejin", type: "speech", text: "NO HURRY OUT HERE EITHER.", side: "l"}

  - id: P15
    shape: tall
    gap: short
    bg: navy
    camera: "at the inside fifty-metre relay, Nib looks up as Orrin passes"
    art: >
      At terrace_gate_east's 50 m relay Nib closes the tripod's socket cover and looks at Orrin
      moving past, patient as the huge forefoot negotiates a low step. Compact radio now clipped to
      LEFT belt clear of wooden sheath, binoculars high, RIGHT return ring. Orrin's LEFT brace props
      remain folded, empty grey cases low on pad. Green sky and violet shadows, slate and rust clay.
      No labels on the relay, snagged cable or cue of a time limit.
      Nib stands at the relay on the left and Orrin passes on the right, both faces and feet visible.
    calm: right
    lines:
      - {who: "nib", type: "speech", text: "TAEO SAYS NO HURRY.", side: "l"}
      - {who: "orrin", type: "speech", text: "A MOST COMPATIBLE EMPLOYER.", side: "r"}

  - id: P16
    shape: full
    gap: short
    bg: white
    style: chibi
    camera: "chibi pace gag on a flat green stage"
    art: >
      CHIBI comedy at terrace_gate_east reduced to a flat muted-green screentone stage, no real
      drop or threat visible. Chibi Nib sits on a tiny separate crate-like rock, binoculars raised,
      watching chibi Orrin's lifted foot descend with majestic slowness. Nib is line-eyed and entirely
      patient; a little stack of imagined pillows appears behind his head as he waits, purely gag
      imagery. LEFT notch, rope belt, RIGHT pouch/sticker, LEFT sheath, bare feet and binoculars intact.
      Orrin's brace folded. Green key, violet flat shadow, no lettering or speed claims.
      Chibi Orrin occupies the left, Nib sits on his separate rock at right; full gag poses have room.
    calm: left
    lines:
      - {who: nib, type: speech, side: r, text: "I HAVE TIME TO SCOUT TOMORROW."}
      - {who: orrin, type: speech, side: l, text: "PLEASE CHECK THE WEATHER."}
    notes: "Pace joke before danger, never Orrin as a pet. No actual stop or sleep here."

  - id: P17
    shape: full
    gap: long
    bg: navy
    camera: "from the higher mineral shelf looking down the last stair approach"
    art: >
      Normal style. At terrace_gate_east's 150 m side shelf Orrin completes the last low stair,
      checking the capstone before settling. Nib has installed the 100 m and now 150 m grey relay
      posts along the cliff side; show the last two separated by an honest stretch of cable, each
      a white lamp and folded-away handset. Pale mint-white mineral seam glows at image right, safe
      above the distant boss run. Green dusk key, violet shadow, rust clay/grey capstone. No charging
      boss, opened new contact window, van or third companion inside.
      Nib stands on the left at the seam and Orrin arrives on the right.
    calm: top
    lines:
      - {who: "nib", type: "speech", text: "THE MINERAL SHELF.", side: "l"}
      - {who: "orrin", type: "speech", text: "GOOD. I WAS BEGINNING TO MISS THE STAIRS.", side: "r"}

  # TAKE THE DEPOSIT WHILE THE BOSS LIVES
  - id: P18
    shape: tall
    gap: short
    bg: navy
    camera: "side-on along the safe mineral shelf, Nib inspecting the seam"
    art: >
      On terrace_gate_east's mineral side shelf Nib tests the pale seam with a small blunt extraction
      wedge from the tool roll, not his knife. Orrin kneels his forebody slightly to make the TWO
      empty grey cases accessible atop the central tier. His LEFT rim brace stays folded and clear
      of the working area. Nib's adult face is concentrated, bare toes on good capstone, RIGHT wrist
      return ring. Green sky key plus natural pale mint-white seam light, violet shadows. No interface
      cyan, broken shell, fresh mark in the rock or readable case labels.
      Nib works on the left and Orrin lowers his forebody on the right; include their faces, seam and cases.
    calm: top
    lines:
      - {who: "nib", type: "speech", text: "SHALL I LOAD THE CASES ON YOUR MIDDLE SHELL TIER?", side: "l"}
      - {who: "orrin", type: "speech", text: "BOTH CASES. KEEP THE WEIGHT EVEN.", side: "r"}

  - id: P19
    shape: strip
    gap: short
    bg: navy
    silent: true
    camera: "extreme close-up of Nib loosening a mineral plate at its natural joint"
    art: >
      At terrace_gate_east Nib's scarred hands work a blunt wedge into a natural joint beneath one
      pale mineral plate in the clay seam. One hand controls the wedge, the other supports the plate
      so it cannot drop; fine rust dust lies on his charcoal shorts. Cold-white/violet return ring
      RIGHT wrist, no bruise. Green sky edge and pale mint-white mineral light, hard violet shadow.
      No letters, glowing palm, absorbed fragment or knife used as a pry bar.
    calm: none

  - id: P20
    shape: full
    gap: short
    bg: navy
    camera: "across the open first case toward Nib and the distant still-walking boss"
    art: >
      At terrace_gate_east the first grey case is open on Orrin's central shell pad, foam-like plain
      cloth lining ready. Nib lowers the loosened mineral plate into it with both hands, shoulders
      careful. In the far background below the side shelf, clearly small, the bridge_boss is still
      WALKING past the clay buttress, intact horn and all four legs visible. Green dusk overhead,
      violet shadows, natural mint-white cargo glow. No boss death, gate closure, integration or readable print.
      Nib's face and shoulders are visible on the left above the case; Taeo's voice comes through the radio at right.
    calm: top
    lines:
      - {who: "nib", type: "speech", text: "ONE CASE STARTED. BOSS STILL WALKING.", side: "l"}
      - {who: "offpanel:taeo", type: "phone", text: "COPY.", side: "r"}
    notes: "Extraction visibly precedes the boss's death. No new-kind fragment integrated; the sale deposit stays physical cargo."

  - id: P21
    shape: full
    gap: short
    bg: white
    camera: "outside, eye level across the operations table, Taeo listening without interrupting"
    art: >
      At terrace_gate_rim Taeo grips the base handset but leaves the transmit switch released, listening
      with his lips pressed closed around an unasked instruction. Sejin beside him looks from his face
      to his steady open RIGHT hand, cuff on LEFT upper arm; Haein tends the drum. East sun, cool
      ochre gravel and blue-grey canopy shade. Backpack old patch on chair. No new injury, fresh pressure
      numbers, active screen or vision of the mineral shelf reflected in his eyes.
    calm: top
    lines:
      - {who: taeo, type: float, text: "I HAD A QUESTION EVERY TEN SECONDS."}
      - {who: taeo, type: float, text: "MOST OF THEM WERE 'ARE YOU STILL THERE?'"}

  - id: P22
    shape: inset-l
    gap: short
    bg: navy
    camera: "close on Orrin watching Nib lift the second case lid"
    art: >
      Orrin on terrace_gate_east's mineral shelf watches Nib work from beneath heavy eyelids,
      his mouth crooked with a small dry smile. The second low grey case lid is raised at the top
      crop; first case filled, still open nearby. LEFT rim brace and toes stay clear of the void.
      Green dusk light, pale mint-white seam reflection, violet shadows. No eating the mineral,
      cute smile, head pat, shell crack or extra cases.
      Orrin fills the left third; Nib works outside the right edge, only his raised case lid in view.
    calm: right
    lines:
      - {who: "orrin", type: "speech", text: "TAEO'S VERY QUIET.", side: "l"}
      - {who: "offpanel:nib", type: "speech", text: "HE'S WORKING HARD AT STAYING QUIET.", side: "r"}

  - id: P23
    shape: strip
    gap: short
    bg: navy
    camera: "same distant patrol, tighter on the ram's slab head passing the buttress"
    art: >
      Terrace_gate_east's bridge_boss walks behind the far clay buttress, side view of its long slab
      skull and two ridged dark mineral horns, the outer one with a pale layered tip. Low dark-red eye
      passes out of sight; no new horn growing, no snarl or speed lines. Foreground mineral shelf edge
      remains safely higher. Green skylight, rust clay, grey plates, hard violet shadow. No return mark,
      drawn warning or magical signal.
    calm: top
    sfx:
      - {text: "TOK", style: quiet, at: [0.74, 0.75], size: M, rot: 3}
    notes: "Patrol continues while both cases are filled. No fixed patrol countdown promised to the reader."

  - id: P24
    shape: tall
    gap: short
    bg: navy
    camera: "high angle over Nib and Orrin, both cases now full"
    art: >
      On terrace_gate_east's side shelf Nib places the last pale mineral piece in the SECOND low
      grey case, matching the level in the first. Orrin has subtly shifted his middle tier under the
      canvas pad to keep both cases square and balanced; Nib acknowledges with an appreciative ear tilt.
      Natural seam is visibly depleted where they worked, not infinitely regrowing. Green dusk key,
      violet shadows, pale mint-white cargo. No third case, interface integration, boss death or written count.
      Nib stands on the left beside the cases and Orrin on the right; both faces visible with the cargo.
    calm: top
    lines:
      - {who: "nib", type: "speech", text: "TWO CASES. EVEN WEIGHT.", side: "l"}
      - {who: "orrin", type: "speech", text: "LET'S STOP BLOCKING THE MINERALS' VIEW.", side: "r"}

  - id: P25
    shape: strip
    gap: short
    bg: navy
    camera: "close-up of Nib closing the cases and joining their handles"
    art: >
      At terrace_gate_east Nib shuts both mineral case lids and secures their plain catches, then
      links the two adjacent handles with ONE short plain webbing loop. The pair rests side by side
      on the broad canvas pad nested against Orrin's central slate tier; no strap passes around body
      or throat. LEFT rim brace props remain folded at distant lower edge. Green sky key, violet
      shadow, dull grey cases; glow disappears under lids. Inventory plates blank, no magical storage.
      Keep the image on Nib's hands and the closed catches; his report comes from above the left edge into his keyed belt radio.
    calm: top
    lines:
      - {who: "offpanel:nib", type: "speech", text: "DEPOSIT PACKED. BOTH CASES.", side: "l"}
    sfx:
      - {text: "KLIK", style: quiet, at: [0.34, 0.52], size: S, rot: -4}
      - {text: "KLIK", style: quiet, at: [0.70, 0.57], size: S, rot: 4}
