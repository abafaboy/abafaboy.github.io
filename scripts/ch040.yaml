chapter: 40
title: Why the Patch
when: "Same dawn kerb conversation as ch 39, continuous from 'WHY THE PATCH?' Memories refer to nine years earlier; no new present-day date is assigned. The invitation is for Seoryun's Thursday training exchange."
story_beats: PART_ONE_BEATS.md#40
cast:
  taeo: outdoors # Navy jacket over black hoodie, black cargos, single-white-stripe sneakers; olive backpack with OLD faded orange door patch.
  seoryun: default # Present age 38, olive field jacket, black tee, tactical trousers, boots; low ponytail, LEFT-brow scar, physical hexagonal shield/current door emblem.
  nib: default # Nearby, within earshot; adult and barefoot, full locks below.
  orrin: default # Nearby on rescue mat, upper LEFT-front shell fracture protected by small dressing; no loads.
  sejin: default # Background aftercare in sage scrubs and olive medic rig.
  taeo_young: default # Fourteen, 160 cm adolescent, school blazer/white shirt/slate tie/grey trousers, RIGHT-eye mole.
  taeo_father: default # Memory of contracted porter, about 45; full first-appearance description P09.
  taeo_mother: default # Memory of camp cook, about 42; full first-appearance description P10.
  haru: baby # Age ONE in memory only, black hair tuft, ivory shirt and sage-beige overalls; never current ten-year-old model.
  kang: memory # Seoryun's former vice-captain, memory only; no finished model, full description P28.
extras:
  seoryun_young: "Seoryun at about 29 in the Daegu broadcast, same broad-shouldered adult build and low dark ponytail, older olive rescue jacket with OLD door emblem; younger face, left brow obscured when scar chronology would be ambiguous. Do not make her a teen."
  rescue_porters: "Adult workers in faded khaki vests and dirty off-white hard hats, plain cargo straps, worn work clothes. Broadcast subjects, not Taeo's father."
  kang_civilians: "Several adult civilians in muted everyday coats, cowering on one side of a fallen slab in Seoryun's brief account; no named new casualties or children."
  dispatch: "Voice on Seoryun's field radio only."
  reporter: "Recorded voice from the old Daegu rescue broadcast; never a present interviewer."
  crews: "Background municipal responders and porters continuing practical relief work; no eavesdropping crowd or press scrum."
locations: [sinjeong_street, seogang_camp_memory, grandparents_house, daegu_gate_broadcast, kang_collapse_memory]
location_notes:
  sinjeong_street: "Continue ch 39 kerb. F stair NORTH pavement, command/casualty bay WEST, main descent farther WEST, broken lightwell EAST; media barrier away from conversation. Nib stays beside resting Orrin within earshot. No spatial or time jump between chapters."
  seogang_camp_memory: "Unkeyed narrated reconstruction, not a claim Taeo witnessed the collapse. Porter staging area and camp cook's serving trestle, then administrative hands/empty tools against abstract concrete. Do not draw the funeral, bodies or a complete collapse sequence; ch 43 owns that sustained flashback."
  grandparents_house: "Use locations/grandparents_house/key_wide.png and notes.md: TV cabinet WEST wall, kitchen NORTH, east window and south sliding courtyard doors fixed. Nine-years-ago insert swaps today's small flat screen for an OLD CRT in the same cabinet position. Evening, no five-place Sunday meal."
  daegu_gate_broadcast: "Only inside old broadcast imagery, a different gate in Daegu nine years ago. Earth-side rescue cordon with an open black-violet slit and cold rim; porters led outward by Seoryun, who turns back. Never Seogang, never a claim she could have reached Taeo's parents."
  kang_collapse_memory: "Unkeyed brief account from Seoryun; separate undated collapse, location and causal details left unnamed. Slab divides civilians from Kang. Gate interior suggested by one distant lavender wrong-colour opening; muted A4 memory palette, no named dungeon or invented last words."
prop_locks: >
  Taeo: mole under RIGHT eye, deep purple recoil bruises on BOTH forearms concealed by cuffs,
  cleaned nosebleed stain, dark-grey phone with top-left hairline crack and dinosaur sticker.
  No link use, new percentage, relic, promise of recruitment or payment this chapter. Backpack
  OLD orange shield-and-door patch remains exactly as earlier chapters. Knock-off purchase
  is reserved for ch 43. Seoryun's CURRENT door on LEFT sleeve/shield has broader opening and
  simplified upright jamb; do not copy the backpack's old geometry onto current gear.
  Nib: 105 cm adult, wiry weathered angular face, V-notch LEFT ear, sole lower LEFT fang,
  pinkish-tan wrap, charcoal shorts, BROWN rope belt, dinosaur-sticker pouch RIGHT, BROWN
  WOODEN sheath LEFT, bare feet. Matte black 8x30 binoculars high on chest, black woven strap
  knotted LEFT neck, Kett's fork on hinge. Pale-blue ID, folded PAPER drawing and marked
  cobalt pencil remain in pouch. Orrin's crack and dressing persist; no pet harness.
palette_notes: >
  Present: cool dawn grey-blue and slate, weakening cold task lamps, muted olive/rust patch.
  Memories follow A4: desaturated, cooler, soft-edged, one warm trace attached to the remembered
  parent; no full funeral colour sequence. Grandparents' geography follows drawn key but
  night light is old TV blue and a dim pendant. Danger is never a chibi beat. One short chibi
  hesitation occurs before the confession starts. Clean varied warm near-black lines and
  hard cel shadows; no bloom, airborne decoration, airbrushed grief or photographic blur.
  All papers, emblems' text fields, boxes and screens blank/dark unless the panel supplies UI.

panels:
  - id: P01
    shape: strip
    gap: none
    bg: white
    camera: "extreme close-up of Taeo's thumb caught on the patch seam"
    art: >
      sinjeong_street. Taeo's hand (outdoors, navy cuff over black hoodie) holds the worn
      olive backpack between his knees; thumb caught gently under frayed OLD orange door
      embroidery. He does not tear it loose. Cold dawn grazes canvas and the slightly
      shaking fingers, slate shadows below. No readable text, active link, patch redesign,
      blood on the emblem or memory scene hidden inside it.
      The patch and hands fill the middle detail band; Taeo remains above and beyond the left edge.
    calm: top
    lines:
      - {who: taeo, type: float, text: "I'D NEVER IMAGINED TELLING HER ABOUT MY PARENTS."}

  - id: P02
    shape: tall
    gap: short
    bg: white
    style: chibi
    camera: "chibi medium two-shot of the seated pair before the serious conversation"
    art: >
      Flat pale dawn-blue screentone, symbolic sinjeong_street. Chibi Taeo (navy jacket,
      black hoodie, old-patch backpack) sits bolt upright like a clerk greeting an impossible
      customer, eyes tiny with one huge nervous sweat drop. Chibi Seoryun (olive field kit,
      low ponytail, LEFT scar) sits relaxed, a practical small smile. No injuries used as
      joke, grief imagery, rescue danger, hearts, shrine effects or readable objects.
      Taeo sits on the left and Seoryun on the right. Leave room for both chibi bodies and the backpack.
    calm: left
    lines:
      - {who: taeo, type: nervous, side: l, text: "SORRY. MAY I CALL YOU CAPTAIN HAN?"}
      - {who: seoryun, type: speech, side: r, text: "CAPTAIN HAN IS FINE."}
    notes: "Only chibi story panel. The serious confession has not begun; return to normal immediately."

  - id: P03
    shape: tall
    gap: short
    bg: white
    camera: "normal-style level two-shot on the kerb"
    art: >
      sinjeong_street. Taeo (outdoors) lets his shoulders drop, steadies the bag on his
      knees and looks at Seoryun (default). She waits, elbows on knees, shield at her outer
      boot, no attempt to finish his answer. Cold grey-blue dawn, slate shadows, plain
      emergency vehicles in distance. Faces honest and tired. No chibi proportions,
      romantic light, readable street furniture or new injuries.
      Taeo sits on the left and Seoryun on the right with both faces visible and natural seated proportions.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "I'M TWENTY-THREE."}
      - {who: taeo, type: speech, side: l, text: "I WAS FOURTEEN WHEN I FIRST SAW YOUR RESCUE BROADCAST."}

  - id: P04
    shape: inset-l
    gap: long
    bg: white
    silent: true
    camera: "close front view of Seoryun settling to listen"
    art: >
      sinjeong_street. Seoryun (default) turns her whole tired face toward Taeo, the small
      joke gone naturally. LEFT-eyebrow scar, loose low ponytail, dust at collar, current
      orange sleeve patch edge. Her expression is attentive, unarmoured without being
      sentimental. Cool dawn light from open roadway, slate-blue plain background. No
      press microphone, memory overlay, tears or guilty knowledge she does not yet have.
    calm: none

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 40 · WHY THE PATCH"

  - id: P06
    shape: full
    gap: long
    bg: white
    camera: "wide across the kerb, ongoing relief work behind the conversation"
    art: >
      sinjeong_street. Taeo (outdoors) and Seoryun (default) remain seated with the old-patch
      backpack between them. Nib (default, all locks, barefoot) stands beside Orrin (default)
      on his mat a few paces away; Sejin (default) checks supplies. Porters carry an empty
      stretcher behind the resting crews. Cool dawn, slate shadows, muted workwear. No
      public confession stage, visible phone screen, healed shell or readable signage.
      Taeo sits on the left and Seoryun on the right, with Nib and Orrin behind the centre of the conversation.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "THE SEOGANG CAMP COLLAPSE. NINE YEARS AGO."}

  - id: P07
    shape: strip
    gap: short
    bg: white
    camera: "close on Seoryun's eyes as she recognises the incident"
    art: >
      sinjeong_street. Seoryun (default), tight eye crop with LEFT-eyebrow scar: recognition
      narrows her gaze, then concern stills it. No shock streaks or new tears. Pale dawn
      from camera left, hard slate shadow beneath the brow. Background reduced to cool
      grey. No flashback yet, TV reflection, interface or implied personal responsibility.
      Seoryun's eyes occupy the right third of the detail band.
    calm: top
    lines:
      - {who: seoryun, type: speech, side: r, text: "THE CAMP COLLAPSE?"}

  - id: P08
    shape: wide
    gap: short
    bg: white
    camera: "medium view toward Taeo with Seoryun in foreground profile"
    art: >
      sinjeong_street. Taeo (outdoors) nods once, both hands on the backpack, thumb no
      longer worrying the seam. His face does not perform grief for her; it grows flat
      with an old effort. RIGHT-eye mole visible, sleeves covering recoil. Seoryun's
      olive shoulder in foreground. Grey-blue dawn, slate shadows. No younger body,
      corpse imagery, active glow or readable object.
      Taeo is on the left and Seoryun in right foreground profile. Frame them from the waist up.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "YES. MY FATHER WAS A PORTER."}
      - {who: taeo, type: speech, side: l, text: "MY PARENTS BOTH WORKED AT SEOGANG."}

  - id: P09
    shape: vignette
    gap: long
    bg: white
    camera: "remembered waist-up portrait of Taeo's father adjusting his work straps"
    art: >
      seogang_camp_memory, narrated portrait. taeo_father (about 45, 176 cm, lean working
      adult, Taeo's angular jaw and kind tired brown eyes, short dark hair, NO mole) adjusts
      plain cargo straps over a faded khaki vest with dull reflective strips. Blue-grey
      rolled-sleeve work shirt, charcoal trousers, worn work boots, yellowed off-white hard
      hat; face turned toward someone outside frame with a tired small smile. Camp trestle
      simplified behind. Desaturated cold daylight, one warm trace on his face. No readable
      porter ID, modern patch, accident reenactment or child at the job site.
      Father fills the centre, framed from the waist up. Present-day Taeo's account continues from beyond the left edge; Father does not speak.
    calm: top
    lines:
      - {who: "offpanel:taeo", type: speech, side: l, text: "CONTRACT WORK. HE COULD CARRY MORE THAN ANYONE I KNEW."}
    notes: "PAYOFF P06: the father who 'went in first' has a job and a face. Narrated memory, not a new first-person witness account."

  - id: P10
    shape: vignette
    gap: short
    bg: white
    camera: "remembered waist-up portrait from the serving side of the camp kitchen"
    art: >
