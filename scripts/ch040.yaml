      - {who: "offpanel:taeo", type: speech, side: l, text: "WE WATCHED THE TV AT MY GRANDPARENTS'."}
    notes: "PAYOFF P03 and PAYOFF P06. A brief anchor for the confession; full funeral/market/patch flashback remains ch 43."

