chapter: 16
title: Out Now
when: "Thursday, mid-spring: the Guro job day (chapters 13–17). 2:31 PM, straight on from ch 15's hook (the slab drop), to 3:58 PM (the hook); ch 17 opens on the boss's death at 4:01 PM. Lettered times: 2:31 PM; 14:52 on the porters' chat; 3:00 PM (the general contractor's hourly call); 15:01 on Dokgo's app; 3:31 PM; 3:46 PM (Ironclad Seven arrive); 15:58 / 3:58 PM (the roar)."
story_beats: PART_ONE_BEATS.md#16
cast:
  taeo: outdoor     # navy zip jacket over the black hoodie, black cargo trousers, black sneakers with one white stripe; ONE mole under his RIGHT eye. Site kit (ch 13, 14, 17): a borrowed white Ryu Survey hard hat, a size too big, and a borrowed red-orange Ryu vest over the jacket. The hard hat falls off in P09 and stays on the gravel by the radio table (as ch 17). Olive backpack (faded orange shield-and-open-door patch) on the back of his folding chair at the radio table. Phone (crack top-left, green dinosaur sticker) lies on the radio table. Nosebleed from P08; a twisted tissue up each nostril P14–P36, pulled out in P37; dried blood under his nose after that. The link palm is his RIGHT (ch 7, 14, 15).
  nib: default      # inside the gate all chapter. Barefoot; V-notch LEFT ear; one lower fang on the left; brown rope belt; pouch RIGHT hip with Haru's dinosaur sticker on the flap (Kwak's inhaler in it until P19; the dark shard in it from P25); brown wooden sheath LEFT hip. No hard hat (as ch 14, 15, 17; ch 13's drilled hard hat is not worn inside). His Ryu radio is tucked into his rope belt (ch 15 P40) until it jolts out in P03 and is crushed under the slab in P04. Grey with stone dust from P04 on.
  minho: default    # inside: brown work jacket under a red-orange Ryu vest, white hard hat with a headlamp, a steel pry bar (ch 15); grey streak at his LEFT temple; radio clipped high on his LEFT chest; watch on his LEFT wrist. His hard hat is knocked off in P16, sits in his lap in P34–P35 (his hair grey with dust) and is back on from P55.
  sejin: default    # inside: medic chest rig, cropped hair, tired eyes, a headlamp on an elastic strap (no hard hat inside, as ch 17), medic bag, nitrile gloves, one water bottle; a bag-valve mask comes out of her bag in P55 (she uses it in ch 17)
  mansu: default    # Kwak Mansu, 58: heavy-set, grey stubble, a black elastic lumbar brace, a yellow-green porter vest (number patch 08) over a grey work top; no jacket (Dami has it) and no hard hat on (his dented one lies on the floor, its lamp dying). His legs are hurt where the slab pinned them, one trouser leg torn over a bruised shin (as ch 17); he cannot stand. Asthma. He hums when he is steadying himself (ch 14).
  dami: default     # outside all chapter. Cheap yellow-green porter vest with many pockets (number patch 07) over a grey hoodie, scuffed white hard hat, cargo straps, worn gloves; her empty A-frame carrier; Kwak's faded navy canvas work jacket knotted round her waist (ch 15); her phone lives in a chest pocket of the vest (ch 13)
  dokgo: default    # outside: windbreaker, scuffed white hard hat pushed back, clipboard tablet under his LEFT arm, TWO phones (the general contractor calls on the first, in his RIGHT hand; the porter app runs on the second, in a cracked black rubber case, in his LEFT), an unlit cigarette behind his ear or at his lip, a cheap plastic lighter
  haein: default    # outside: overalls, tool belt, clear safety glasses pushed up onto the brim of a white hard hat, headphones; she runs the line's base station (ch 13, 14). Ch 15 and ch 17 do not show her: see the note on P06.
extras:
  gc_manager: "the general contractor's site manager (ch 13, 14, 17): a voice on Dokgo's call phone only in this chapter, never drawn. He phones on every hour and counts minutes; calm, cold, polite. He still believes every porter is out (Dokgo told him so at 2:00 PM in ch 14), which is why his sedan fines Dokgo in ch 17. He never says sorry."
  porters: "Dokgo Contracting porters (ch 13: eight on the roster, in pairs 01–08; Dami is 07 and Kwak 08): unawakened men and women from about thirty to sixty in the same cheap yellow-green porter vests with white number patches on the back (blank in the art), scuffed white hard hats, cargo straps, worn gloves, A-frame carriers; tired, sunburnt, quiet."
  ironclad: "IRONCLAD SEVEN, the clear team (ch 14; ch 18's headline), designed to match ch 17: seven hunters, men and women in their twenties and thirties, in matching polished gunmetal-grey armour vests and shoulder plates over black tactical wear, each with the same small sponsor patch on the chest (a plain coloured block, no letters); swords, a spear, a round shield, two short axes; clean, at ease."
  ironclad_lead: "Ironclad's leader (as ch 17): a broad man in his thirties with a buzz cut and a showman's grin, a two-handed warhammer on his shoulder."
  ironclad_cam: "a young hunter on the team who films the others with a phone on a gimbal for their HunterLink page; its screen always faces away from us."
  scuttler: "the gate creature of ch 14–15 (match ch 15 P49): dog-sized and low, many pale jointed legs, overlapping grey chitin plates like a giant woodlouse, two small red eye-glints. The eye-glints are the only red inside the gate."
locations: [guro_pit, guro_side_gallery, guro_gate_inside]
location_notes:
  guro_pit: "As ch 13 (drawn first; ch 14 and 15 defer to it). A foundation pit in Guro-gu about 12 m deep: rusty steel H-piles with timber lagging; two levels of steel struts and corner braces across it at about 4 m and 8 m up, which lay a grid of hard shadow bars on the floor in sun; an idle tower crane; a gravel truck ramp down one wall; at the rim, Dokgo's flatbed truck and (ch 14) a concrete pump truck with its boom folded, booked and waiting. Floor: packed grey gravel, puddles, rebar bundles, stacked formwork. THE GATE: a door-height black-violet slit with a cold white-cyan rim inside a square frame of scaffold tubes bolted to concrete blocks (the frame the knock code is knocked on), inside a ring of orange safety mesh with one opening; Ryu's white survey cable with a blue band every metre runs in through the frame's lower left corner. Outside the ring: Ryu Survey's white pop-up canopy over the folding table (the line's base station with its loudspeaker grille and coiled handset, the cable drum, a radio charging rack, folding chairs; Taeo's chair faces the gate); Dokgo's folding table to its right (thermos, tablet); the porters' staging (crates, steel props, cargo straps) and a jacket rack made of a scaffold tube on two trestles; Sejin's small white first-aid tent near the ramp. This script stages Taeo at the frame's post with the handset's cord stretched taut back to the table, as ch 15 P55 does; ch 13–15 disagree on how far the table stands from the frame, the canopy's colour and which wall the ramp is on, so the panels below give only relative positions. Light: bright spring-afternoon sun from the west."
  guro_side_gallery: "As ch 15. A low stone tunnel about 2.2 m high and 3 m wide, partly collapsed, fallen roof slabs, a dust-thick floor; total darkness except headlamps, which throw hard white cones. Kwak lay 15 m in from the hole at the foot of the rubble wall. After P04: the big slab lies flat; the steel shoring prop is flung against the wall; Nib's radio is crushed under the slab's edge; Kwak's dented hard hat lies nearby, its lamp dying. After P24: the hole, 15 m back, is choked solid. The dark deeper in, beyond Kwak, is where the scuttler went (P18). From P55 the group is placed as ch 17 locks it: Kwak on his back in the middle, head toward the blocked hole; Sejin kneeling at his head; Nib kneeling at Kwak's RIGHT side holding Kwak's right hand in his own LEFT; Minho on Kwak's far (left) side. The roof is a single cracked slab layer just under the dungeon's surface; the crack in P61 is the first daylight the tunnel has had."
  guro_gate_inside: "As ch 13–14: a vast quarry of stacked pale slate-grey slab terraces cut with low black galleries, every surface and the horizon sloping about 10 degrees down to the LEFT (ch 13), under a GREEN DUSK sky (deep teal-green overhead, pale acid green at the horizon; no sun), violet shadows. Used only for the boss in P60. Ch 15 and ch 17 call the sky sulphur-yellow but defer to ch 13–14."
palette_notes: "Pit (outside): bright spring-afternoon sun from the west; packed grey gravel and concrete, wet mud-brown, cool blue-grey and warm brown shadows; a pale blue sky cut into a grid by the struts; accents: the porters' yellow-green vests (muted), the dusty orange safety mesh and the Ryu red-orange vests (never the link amber); the gate's violet-black core and cold white-cyan rim are the strongest colour. Red appears outside only as Taeo's blood (P08–P10). Side gallery: violet-black darkness and hard white headlamp cones; the dust drawn as flat layered shapes and grain, never soft haze; the scuttler's two red eye-glints are the only red. The green-dusk sky is seen only in P60 and through the crack in P61. Nib's link amber #F2A93B appears only in Taeo's RIGHT palm (P07, P12, P57) and in Nib's eyes. No operator-interface windows and no interface cyan: the interface stays dark until ch 19. Page background: black for the cold open and every inside stretch, white outside."

panels:

  # ---------------- COLD OPEN: inside, half a second ----------------
  - id: P01
    shape: strip
    gap: none
    bg: black
    camera: "extreme close-up at hip height on Nib's rope belt and straining forearms"
    art: >
      Inside the side gallery (guro_side_gallery), the same instant as ch 15's hook. Extreme close-up at hip height: Nib's small Ryu radio tucked into his
      brown rope belt, its speaker grille pointing up, its status light lit; just above it his thin olive-green forearms (faint pale scars) are locked on the
      collar handle of a steel shoring prop, every tendon standing out, his bare shoulder jammed under the lip of a great pale slab at the top edge of the frame.
      Grit trickles off the slab's lip. Lit only by a hard white headlamp cone from the left; everything else violet-black. Hard cel shading; grit as
      hard-edged specks. No glow. No text.
    calm: top-right
    focus: [0.45, 0.60]
    lines:
      - {who: taeo, type: phone, side: l, text: "—OUT! NIB, OUT NOW!"}
    sfx:
      - {text: "KSSH", style: phone, at: [0.20, 0.80], size: S, rot: -6}
    notes: "Ch 15 P55's shout, heard through Nib's radio: a phone bubble with its tail to the radio. Sejin's count stopped at 'TWO—' (ch 15 P52) and never reaches three."

  - id: P02
    shape: inset-r
    gap: short
    bg: black
    silent: true
    camera: "extreme close-up, three-quarter, Nib's left eye under the slab"
    art: >
      Extreme close-up of Nib's LEFT eye and cheek under the slab's lip (nib): the amber iris (#F2A93B) flicks to the prop's collar and head plate, which, from
      where he is wedged, look rock-solid; the slipping base plate is beside Kwak's knee, out of his sight. Sweat and grey dust on his olive-green skin, the V-notch
      of his LEFT ear at the frame edge, jaw clenched hard enough to bare the small lower fang on the left. A decision forming: he cannot see what Taeo felt, and
      he is about to act on it anyway. Hard white headlamp light from below left, violet-black shadow. Weathered adult, never cute. No text.
    calm: none
    notes: "The trust beat: the support looks fine to Nib. He moves because Taeo called it."

  - id: P03
    shape: wide
    gap: none
    bg: black
    camera: "low side view at floor level, across the slab"
    art: >
      In one motion Nib tears his shoulder out from under the slab's lip, drops the collar handle, grabs two fistfuls of the front of Kwak Mansu's yellow-green
      porter vest (mansu: heavy-set, 58, grey stubble, black lumbar brace) and throws his whole wiry weight backward. Behind Kwak, Im Sejin (sejin: headlamp on an
      elastic strap, medic chest rig, gloves) is hauling with her arms hooked under his armpits. Kwak's legs slide out from under the slab; his face twists in pain.
      The small radio jolts out of Nib's rope belt and spins toward the slab. At the frame edge, Minho's back and his headlamp cone, still facing the dark deeper in.
      Behind them the prop's base plate is skidding out. Speed lines on the haul, headlamp cones, violet-black dark. Nib adult and wiry, never cute. No text.
    calm: top
    lines:
      - {who: nib, type: shout, side: l, text: "PULL!"}
    sfx:
      - {text: "SKRRK", style: impact, at: [0.80, 0.72], size: M, rot: 10}

  - id: P04
    shape: bleed
    gap: short
    bg: black
    camera: "low, floor level, side-on, the slab filling the top of the frame"
    art: >
      Half a second later the slab comes down. The great pale slab slams flat onto the floor exactly where Kwak's legs and Nib's shoulder were a heartbeat ago;
      the prop pinwheels away; a wall of grey dust and grit bursts outward in hard-edged layered shapes. Low in the foreground: Nib on his back on the rubble with
      Kwak sprawled across his legs and Sejin under Kwak's shoulders, all three tangled; Kwak's boot heels lie a hand's width from the slab's edge. Under the slab's
      edge, Nib's radio is crushed flat, its stubby antenna sticking out, its light dying. Impact lines radiate from the slab. Two headlamp cones slash through the
      dust; violet-black everywhere else. The panel's top edge breaks its border. Dramatic, drawn, hard-shadowed: no haze, no bloom. No text.
    calm: top
    sfx:
      - {text: "KRA-THOOOM", style: impact, at: [0.50, 0.22], size: XL, rot: -6}
    notes: "Nib trusted the call; the margin was half a second. Nobody is crushed. Nib's radio is gone, so outside there is only static until Minho can talk."

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 16 · OUT NOW"

  # ---------------- OUTSIDE: the recoil ----------------
  - id: P06
    shape: full
    gap: long
    bg: white
    camera: "establishing, high angle from the top of the ramp, looking down into the pit"
    art: >
      The Guro pit (guro_pit) from the top of the ramp: H-pile walls with timber lagging, two levels of steel struts laying a grid of hard shadow bars across the
      packed grey gravel. Against the far wall, the gate: a door-height black-violet slit with a cold white-cyan rim inside its square scaffold-tube threshold
      frame, a ring of orange safety mesh round it, Ryu's white survey cable with blue bands running in at the frame's lower left corner. Just outside the ring,
      Ryu's white pop-up canopy over the radio table. Taeo (taeo, outdoor: borrowed white hard hat a size too big, red-orange Ryu vest over the navy jacket) is
      slumping against the frame's nearer post, his RIGHT hand still clamped on the steel, the handset in his LEFT fist with its coiled cord stretched taut back
      to the table. At the table Ryu Haein (haein: overalls, safety glasses pushed up on a white hard hat, headphones) is jumping up from the base station.
      Gu Dami (dami: yellow-green porter vest, scuffed hard hat, Kwak's navy jacket knotted round her waist, her empty A-frame beside her) is half risen from the
      gravel. Beyond, at the porters' staging and the jacket rack, Dokgo Chul (dokgo) and the porters (extras.porters) turn their heads. In the near foreground at
      the rim: the folded boom of the waiting concrete pump truck. Bright afternoon sun from the west. Drawn, simplified background; no lettering on any sign,
      truck or vest. No text.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "GURO-GU · CONSTRUCTION PIT · 2:31 PM"}
    sfx:
      - {text: "KSSSHHHHH", style: phone, at: [0.66, 0.66], size: M, rot: -4}
    notes: "Same instant as ch 15 P55 (Taeo at the frame's post). Haein runs the base station as in ch 13–14; ch 15 does not show her, so if the editor keeps ch 15's cast, drop her from P06, P09, P11, P13, P14, P27, P29, P51 and P54 and cut her one line (P14)."

  - id: P07
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up on Taeo's right hand clamped on the frame's steel post"
    art: >
      Taeo's RIGHT hand clamped on the grey scaffold-tube post of the threshold frame: an amber (#F2A93B) flare bursts in the centre of the palm, white-hot at its
      core, with hard-edged fracture lines shooting to the fingertips; the fingers spasm open off the steel. It is the only saturated colour in the panel. The gate's
      cold rim light grazes the knuckles. Hard-edged shapes only: no soft glow, no bloom. No text.
    calm: none
    sfx:
      - {text: "THOOM", style: impact, at: [0.78, 0.40], size: L, rot: -10}
    notes: "The slab's impact, felt through the link a split second after it lands. This is the recoil."

  - id: P08
    shape: wide
    gap: none
    bg: white
    camera: "low angle, front, close on Taeo's face and shoulders"
    art: >
      BIG REACTION. Taeo (taeo: one mole under his RIGHT eye, the borrowed white hard hat a size too big, red-orange Ryu vest over the navy jacket) jerks upright off
      the post, head snapping back: eyes huge, pupils pinpricks, mouth wide in a scream at the slit beside him, a burst of blood from his nose (the one red thing in
      the panel), the handset cord whipping. Focus lines behind him; the gate's rim a simple cold edge at the side of the frame. Hard shadows. No text.
    calm: top
    lines:
      - {who: taeo, type: shout, side: c, text: "NIB!!"}

  - id: P09
    shape: wide
    gap: short
    bg: white
    camera: "medium, side view at table height"
    art: >
      Taeo's knees go. He folds sideways onto the gravel at the foot of the frame's post like a dropped coat; his oversized hard hat bounces off and rolls away;
      the handset cord yanks the base station across the table. Haein lunges and pins the base station before it falls. Dami, already on her feet, catches Taeo's
      shoulder as he goes down and is dragged to her knees with him. Motion lines on the fall. Bright sun, grey gravel, hard strut shadows. No text.
    calm: top-right
    sfx:
      - {text: "THUD", style: impact, at: [0.30, 0.78], size: M, rot: 8}

  - id: P10
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "high angle, straight down on Taeo lying on the gravel"
    art: >
      From straight above: Taeo on his side on the packed grey gravel at the frame's foot, eyes open and blank, blood dripping from his nose onto the stones (the only
      red), his RIGHT palm open beside his face: dark, ordinary, no glow at all. His white hard hat lies on its side nearby. Dami's gloved hand on his shoulder at the
      frame edge. A bar of strut shadow across his legs. Nothing else. No text.
    calm: none
    focus: [0.50, 0.50]

  - id: P11
    shape: wide
    gap: short
    bg: white
    camera: "eye level from behind the radio table, Taeo in the near foreground"
    art: >
      Dami kneels on the gravel, snatches up the handset by its cord and shouts into it, her face raw with fear. Haein, both hands on the base station, has one
      headphone cup pressed to her ear, listening hard, jaw tight. In the near foreground Taeo lies on his side, staring at his empty hand. The gate's black-violet
      slit in its frame behind them. No text.
    calm: top
    lines:
      - {who: dami, type: shout, side: l, text: "IS HE OUT? IS UNCLE MANSU OUT?!"}
      - {who: taeo, type: float, text: "THE LAST THING I FELT WAS HIM LETTING GO."}
    sfx:
      - {text: "KSSSHHH", style: phone, at: [0.40, 0.55], size: S, rot: 0}
    notes: "'Uncle Mansu' is ch 14's form (ch 15 has 'MANSU-AJEOSSI'); the editor should pick one."

  - id: P12
    shape: strip
    gap: long
    bg: white
    camera: "extreme close-up, top-down, Taeo's right palm on the gravel"
    art: >
      Taeo's RIGHT palm lying open on the grey gravel, a few drops of blood on the stones beside it. In the centre of the palm three small amber (#F2A93B) pulses
      land one after another: draw three concentric hard-edged amber rings, the inner one brightest, as if three taps landed on the same spot. The fingers twitch.
      The only saturated colour. Hard edges only, no glow, no bloom. No text.
    calm: none
    sfx:
      - {text: "TTOK", style: quiet, at: [0.25, 0.35], size: S, rot: -6}
      - {text: "TTOK", style: quiet, at: [0.50, 0.28], size: S, rot: 0}
      - {text: "TTOK", style: quiet, at: [0.75, 0.35], size: S, rot: 6}
    notes: "Motif: the knock (ch 10). Three from inside mean 'coming'. Nib presses his palm to the stone floor (P15), as he pressed the rubble in ch 14 and the wall in ch 15 to let Taeo feel him. Never explain it."

  - id: P13
    shape: wide
    gap: short
    bg: white
    camera: "low two-shot, Taeo up on one elbow, Dami kneeling"
    art: >
      Taeo pushes himself up on one elbow, staring at his palm, and a broken laugh comes out of him: tears and blood together, the most relieved face he has ever
      made. Dami kneels beside him with the handset still in her fist, completely lost. Haein in the background, watching them over the base station. Simplified
      gravel and gate frame behind. No text.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "...THREE."}
      - {who: dami, type: speech, side: r, text: "THREE WHAT?"}
      - {who: taeo, type: speech, side: l, text: "THREE MEANS COMING. HE KNOCKED."}

  - id: P14
    shape: inset-r
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag (2.5 heads; colours, outfits and props identical to the full models). Chibi Dami, tongue poked out in concentration, rams a twisted tissue up each
      of chibi Taeo's nostrils with brutal efficiency, a tissue packet tucked under her arm. Chibi Taeo now has two white tissue tusks like a walrus, waterfall
      tears of relief and little sweat drops flying. Flat pale-blue background with a screentone dot pattern. No blood in this panel. No text.
    calm: top
    lines:
      - {who: offpanel:haein, type: speech, side: c, text: "YOUR NOSE. AGAIN."}
      - {who: taeo, type: speech, side: l, text: "SORRY. I'M BLEEDING ON YOU."}
      - {who: dami, type: speech, side: r, text: "EVERYONE BLEEDS ON ME. HOLD STILL."}
    notes: "Haein's line calls back ch 12 ('YOUR NOSE IS BLEEDING'). Taeo keeps the tissue plugs in until P37."

  # ---------------- INSIDE: the scuttler, the inhaler, the shard ----------------
  - id: P15
    shape: full
    gap: fade-black
    bg: black
    silent: true
    camera: "establishing, eye level, looking down the tunnel past the fallen slab"
    art: >
      The side gallery (guro_side_gallery) moments after the drop: a low stone tunnel, the great slab now lying flat, the steel prop flung against the wall, the
      crushed radio's antenna poking out from under the slab's edge, Kwak's dented hard hat on the floor with its lamp a dying glow. Dust hangs in hard-edged
      layers inside two white headlamp cones (Minho's and Sejin's); everything else is violet-black. Sejin crouches over Kwak, who lies propped against a rubble
      heap, coughing. Minho (minho: white hard hat with headlamp, red-orange Ryu vest over brown work jacket, radio on his LEFT chest) stands with the steel pry
      bar raised toward the dark deeper in the tunnel. In the middle, Nib kneels with his RIGHT palm pressed flat to the stone floor, eyes shut, perfectly still.
      No link light drawn on Nib. No text.
    calm: top
    notes: "Nib has just knocked three times through the link (felt outside in P12)."

  - id: P16
    shape: wide
    gap: short
    bg: black
    camera: "medium, low, from behind Sejin and Kwak toward the dark deeper in"
    art: >
      Out of the dark deeper in the tunnel the scuttler (extras.scuttler) explodes into the headlamp cone, pale jointed legs a blur, straight at Kwak and Sejin.
      Minho steps across them and meets it with the steel pry bar; sparks where steel strikes grey chitin; its lunge knocks his hard hat off his head, and the hat
      spins away with its lamp beam whirling. Sejin hunches over Kwak, shielding his head with her arms. Speed lines and hard impact-flash shapes. The scuttler's
      two small red eye-glints are the only red. Dust in hard-edged layers. No text.
    calm: top-left
    lines:
      - {who: minho, type: shout, side: l, text: "BACK!"}
    sfx:
      - {text: "SKRRRITCH", style: impact, at: [0.75, 0.55], size: L, rot: -12}
      - {text: "KLANG", style: impact, at: [0.45, 0.35], size: M, rot: 8}

  - id: P17
    shape: tall
    gap: short
    bg: black
    camera: "low angle up at Minho, the scuttler pinned against the tunnel wall"
    art: >
      Low angle, a power shot: bareheaded now, Minho drives the scuttler back against the tunnel wall with the pry bar braced across its plated head, boots skidding
      in the grit, teeth bared, the grey streak at his LEFT temple caked with dust. Its legs scrabble at the stone. His fallen hard hat lies on the floor throwing a
      skewed beam up the wall: the panel's main light. Behind and below him Nib (nib, default: V-notch LEFT ear, brown rope belt, pouch RIGHT hip, empty brown
      wooden sheath LEFT hip, barefoot, grey with dust) crouches between the creature and Kwak with his knife drawn in his RIGHT hand, his LEFT arm out to keep
      Sejin back: a soldier's stance, weathered, never cute. Violet-black shadow; the two red eye-glints the only red. No text.
    calm: top
    lines:
      - {who: minho, type: shout, side: c, text: "IN. YOUR. HOLE."}
    sfx:
      - {text: "KRAK", style: impact, at: [0.62, 0.30], size: L, rot: 14}

  - id: P18
    shape: inset-l
    gap: short
    bg: black
    camera: "medium close-up looking into the dark deeper in the tunnel"
    art: >
      The last pale legs of the scuttler vanish into the dark deeper in the tunnel. Nib, knife still out, watches the dark without blinking. Minho stoops for his
      hard hat, its beam lighting his dusty boots. Violet-black shadow. No text.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "IT'LL COME BACK."}
      - {who: minho, type: speech, side: r, text: "THEN IT GETS THE BAR AGAIN."}
    sfx:
      - {text: "TIK TIK TIK", style: quiet, at: [0.30, 0.35], size: S, rot: -4}
    notes: "Beat: Minho fights the scuttler off (ch 15 P49–P50 set it up). It is still somewhere deeper in."

  - id: P19
    shape: wide
    gap: short
    bg: black
    camera: "medium, eye level, across Kwak's body"
    art: >
      Kwak lies propped against the rubble heap, dust on his face, lips greyish, fighting for every breath: shoulders hunched, neck muscles straining, one hand
      clawing at the front of his vest. Sejin on one knee at his side holds out an open gloved palm without taking her eyes off his face. Nib, knife sheathed again
