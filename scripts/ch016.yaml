chapter: 16
title: Out Now
when: "Thursday, mid-spring: the Guro job day of chapters 13–17. From the slab drop (about 2:40 PM, straight on from chapter 15's hook; not lettered) to 3:58 PM. Lettered times: 15:07 on Dami's phone, 3:12 PM (Dokgo), 3:31 PM, 3:46 PM (the clear team arrives), 15:58 / 3:58 PM (the roar)."
story_beats: PART_ONE_BEATS.md#16
cast:
  taeo: outdoor     # navy zip jacket over the black hoodie, black cargo trousers, black low sneakers with one white stripe; ONE mole under his RIGHT eye. Olive backpack (faded orange shield-and-open-door patch) under the radio table all chapter; his phone (crack top-left, green dinosaur sticker) lies on the table. Nosebleed from P08; a twisted tissue up each nostril P14–P37, pulled out in P38; dried blood under his nose after that. The link pulse is in his RIGHT palm (as ch 7).
  nib: default      # barefoot; V-notch LEFT ear; one lower fang on the left; brown rope belt; pouch RIGHT hip with Haru's small dinosaur sticker on the flap (ch 8); brown wooden sheath LEFT hip. No helmet, no lamp. Grey with stone dust from P04 on. His Ryu handset is crushed under the slab in P04.
  minho: default    # gate kit: brown work jacket, grey T-shirt, olive cargo trousers with black knee pads, brown work boots, watch on his LEFT wrist, radio clipped high on his LEFT chest, a headlamp on an elastic band (no helmet), a telescoping steel survey pole with a hooked head. Grey streak at the LEFT temple; whole head dusted grey from P15.
  sejin: default    # Im Sejin: cropped hair, tired eyes, medic chest rig, field trousers, headlamp on a band, nitrile gloves, trauma bag, one water bottle
  mansu: default    # Kwak Mansu, 58 (PART_ONE_BEATS ch 13): heavy-set, short grey hair, stubble, back brace over his work clothes, lime-yellow porter vest; his dented white hard hat lies beside him; LEFT shin hurt where the slab pinned it; asthma
  dami: default     # Gu Dami, 19: lime-yellow porter vest over a grey hoodie, scuffed white hard hat, cargo straps, worn gloves; a cheap phone in a cracked rubber case; small and fierce
  dokgo: default    # Dokgo Chul, 50s: navy windbreaker, reading glasses pushed up on his thinning hair, a clipboard tablet, TWO phones, an unlit cigarette (behind his ear, later between his fingers), a cheap plastic lighter
  haein: default    # Ryu Haein, 20: work overalls, tool belt, safety glasses pushed up, headphones round her neck, a red-orange Ryu Survey vest; runs the radio base and the relay
extras:
  gc_director: "the general contractor's site director, Dokgo's boss: VOICE ONLY on Dokgo's phone, never drawn. Calm and quiet; he never raises his voice and never says sorry."
  porters: "Dokgo Contracting porters: six to eight unawakened day labourers of mixed ages, most of them middle-aged, in the same cheap lime-yellow hi-vis vests over hoodies and work jackets, hard hats, cargo straps and gloves."
  ironclad: "IRONCLAD SEVEN, the contracted clear team: seven hunters in matching charcoal armour with brushed-steel trim and a blank silver sponsor patch on each shoulder; mixed weapons (a greatsword, two spears, a tower shield, a bow, gauntlets); fresh, clean, unhurried. Their black van carries a blank shield emblem."
  ironclad_lead: "Ironclad's lead: a tall woman in her thirties with a shaved undercut, a greatsword across her back and sunglasses pushed up on her head; the most relaxed person in the pit."
  ironclad_cam: "a young man on the team who films the others with a phone on a gimbal; its screen is never shown."
  scuttler: "the gallery creature first heard in ch 15 (match ch 15 if it was drawn): a C-grade cave crawler about 1.2 m long, low and flat like a giant woodlouse, overlapping slate-violet armour plates, a fringe of thin jointed legs, two hooked forelimbs, two long whip feelers, no eyes; a round toothed mouth whose wet red throat is the danger red."
locations: [guro_pit, guro_gate_gallery]
location_notes:
  guro_pit: "no key yet (decided here; match ch 13–15 if they drew it first). A deep rectangular foundation excavation on a Guro-gu building site, about 40 x 25 m and 12 m deep: walls of rust-brown steel sheet piles braced by yellow steel struts across the top; a gravel ramp down the south side; at the rim, site-office containers, an idle tower crane, a concrete pump truck with its boom folded and two ready-mix trucks waiting with their drums turning. The pit floor is compacted grey gravel with puddles, rebar bundles and stacked formwork. The gate stands at the north end near the sheet-pile wall: a door-height black-violet slit with a cold white-cyan rim, ringed by traffic-orange water-filled barriers. Eight metres in front of it, on a gravel pad: the Ryu Survey radio table (a folding table, a radio base set with a short antenna mast, a charging rack, upturned crates as seats, Taeo's backpack underneath), with a thin orange relay cable snaking across the gravel into the slit. At the ramp foot: Dokgo Contracting's staging area (a white pop-up canopy, a folding table with a cooler and a tablet, equipment crates on pallets)."
  guro_gate_gallery: "no key yet (decided here). Inside the C-grade gate: a plain of pale fractured rock under a GREEN DUSK sky, with galleries running just under its surface. The side gallery is a low chamber (about 6 x 4 m, ceiling 1.8–2.2 m) of pale grey stone, reached only through a narrow crack in a rubble wall (the crack Nib found in ch 14). After P04: the big slab lies flat in the middle; the steel shoring prop is flung against the far wall; Nib's crushed handset sits under the slab's edge; the crack is choked with rubble; a black fissure low in the side wall is plugged with a stone (P18). Light: thin hard-edged bars of green-dusk light through ceiling fissures plus the white headlamps of Minho and Sejin."
palette_notes: "Pit: hazy, flat spring-afternoon light from a pale grey-white sky; concrete grey with blue-grey shadows; rust-brown sheet piles; muted yellow struts; muted lime porter vests; Haein's red-orange vest and the orange barriers stay muted and never read as the link amber. The gate's violet is the outside's one saturated hue; red appears outside only as Taeo's blood (P08–P10). Gallery: green-dusk light, violet shadows, pale grey stone, white headlamp beams; the dust is drawn as flat layered shapes and grain, never soft haze; red only in the scuttler's throat (P16–P17) and the boss's mouth (P60). The link amber #F2A93B appears only in Taeo's palm (P07, P12, P57) and in Nib's eyes. There are no operator-interface windows: the interface stays dark until ch 19."

panels:

  # ---------------- COLD OPEN: inside, half a second ----------------
  - id: P01
    shape: strip
    gap: none
    bg: black
    camera: "extreme close-up at floor level on Nib's hands and the foot of the prop"
    art: >
      Inside the gate (guro_gate_gallery), the instant after chapter 15's hook. Extreme close-up at floor level: Nib's olive-green hands
      (nib: faint pale scars on the forearms) locked round a telescopic steel shoring prop that is wedged under the raised edge of a pale stone slab.
      The prop's foot sits on loose pale grit, and a thin trickle of grit is running out from under it: the only sign that it is moving.
      On a rock just right of the prop lies Nib's small Ryu Survey handset radio, its status light lit; Taeo's voice is coming out of it.
      Light: a white headlamp beam from the left and one thin hard-edged bar of green-dusk light from a ceiling fissure. Violet-black shadows,
      pale grey stone. Hard cel shading; the grit as hard-edged specks. No glow effects. No text.
    calm: top-right
    focus: [0.45, 0.60]
    lines:
      - {who: taeo, type: phone, side: r, text: "—OUT! NIB, OUT NOW!"}
    sfx:
      - {text: "KSSH", style: phone, at: [0.84, 0.30], size: S, rot: -6}
    notes: "Continues ch 15's hook mid-shout, heard through Nib's radio (phone bubble, tail to the handset). The prop is one of Kwak's own shoring props from his scattered porter load; match ch 15 if it showed a different support."

  - id: P02
    shape: inset-r
    gap: short
    bg: black
    silent: true
    camera: "extreme close-up, three-quarter, Nib's left eye"
    art: >
      Extreme close-up of Nib's LEFT eye and the side of his face (nib): the amber iris (#F2A93B) flicks DOWN toward the prop, which, from where
      he crouches, looks perfectly steady. Sweat and grey dust on his olive-green skin; the V-notch of his LEFT ear at the frame edge; his jaw
      clenched hard enough to bare the small lower fang on the left. A decision forming: he cannot see what Taeo felt, and he is about to act on it anyway.
      White headlamp key light from below left, violet shadow. Flat cel colour, hard shadow shapes. Weathered adult, never cute. No text.
    calm: none
    notes: "The trust beat: the support looks fine to Nib. He lets go because Taeo called it."

  - id: P03
    shape: wide
    gap: none
    bg: black
    camera: "low side view at floor level, across the slab"
    art: >
      In one motion Nib lets go of the prop and hooks both arms under Kwak Mansu's armpits from behind (mansu: heavy-set, 58, short grey hair,
      back brace over his work clothes, lime-yellow porter vest), heels dug into the rubble, hauling him backward with his whole wiry body.
      Kwak's face is screwed up in pain, mouth open; his LEFT shin is dragging out from under the slab's raised edge.
      Im Sejin (sejin: cropped hair, medic chest rig, headlamp, nitrile gloves) kneels at Kwak's side with one hand up, fingers spread, about to count,
      her other fist bunched in his vest's shoulder strap to pull with them. Behind them the abandoned prop's foot is already skidding out.
      Speed lines on the haul. White headlamp light, green-dusk fissure light, violet shadows. Nib adult and wiry, never cute. No text.
    calm: top
    lines:
      - {who: sejin, type: speech, side: r, text: "ON THREE—"}
      - {who: nib, type: shout, side: l, text: "NOW."}
    sfx:
      - {text: "SKRRK", style: impact, at: [0.80, 0.70], size: M, rot: 10}

  - id: P04
    shape: bleed
    gap: short
    bg: black
    camera: "low, floor level, side-on, the slab filling the top of the frame"
    art: >
      Half a second later the slab comes down. The great pale slab slams flat onto the floor where Kwak's legs were a heartbeat ago; the steel prop
      pinwheels away; a wall of grey dust and grit bursts outward in hard-edged layered shapes. In the low foreground: Nib on his back on the rubble
      with Kwak sprawled half across him, Nib's arms still locked round Kwak's chest; Kwak's boot heel lies a hand's width from the slab's edge.
      Sejin is thrown onto her side with an arm over her head. Under the slab's edge, Nib's handset radio is crushed flat, its stubby antenna sticking out,
      its light dying. Impact lines radiate from the slab. Headlamp beams slash through the dust; green-dusk fissure light; violet shadows.
      The panel's top edge breaks its border. Dramatic, drawn, hard-shadowed: no haze, no bloom. No text.
    calm: top
    sfx:
      - {text: "KRA-THOOOM", style: impact, at: [0.50, 0.22], size: XL, rot: -6}
    notes: "Nib trusted the call and the margin was half a second. Nobody is crushed. Nib's radio is gone, which is why Taeo hears only static."

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 16 · OUT NOW"

  # ---------------- OUTSIDE: the recoil ----------------
  - id: P06
    shape: full
    gap: long
    bg: white
    camera: "establishing, high angle from the pit rim, looking down across the pit floor to the gate"
    art: >
      The Guro construction pit (guro_pit): a deep rectangular foundation excavation walled with rust-brown steel sheet piles and braced by yellow
      steel struts across the top, a gravel ramp down the near side. At the far end of the grey gravel floor stands the gate: a door-height black-violet
      slit with a cold white-cyan rim, ringed by orange water-filled barriers, a thin orange relay cable snaking across the gravel into it.
      Eight metres in front of it, the Ryu Survey radio table on its gravel pad: folding table, radio base set with a short antenna mast, upturned crates
      as seats, an olive backpack underneath. Taeo (taeo, outdoor) is bent double over the table, the radio handset crushed in his LEFT fist, his RIGHT
      hand clamped on the table edge. Ryu Haein (haein: overalls, tool belt, safety glasses pushed up, headphones round her neck, red-orange vest) reaches
      for him across the table. Gu Dami (dami: lime-yellow porter vest over a grey hoodie, scuffed white hard hat, cargo straps, worn gloves) is half
      risen from her crate beside it. Under the white canopy at the ramp foot, porters in lime vests (extras.porters) and Dokgo Chul (dokgo, a phone at
      his ear) turn their heads. At the rim above: an idle tower crane, a concrete pump truck with its boom folded, two ready-mix trucks with drums turning.
      Hazy flat spring-afternoon light from a pale grey-white sky; short hard shadows under the struts; the gate's violet on the gravel near it.
      Drawn background, simplified; signs, trucks and vests carry no lettering. No text.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "GURO-GU, SEOUL · CONSTRUCTION PIT, C-GRADE GATE"}
    sfx:
      - {text: "KSSSHHHHH", style: phone, at: [0.62, 0.62], size: M, rot: -4}
    notes: "The ready-mix trucks waiting at the rim are why the client's clock costs ₩5,000,000 an hour (P08); never say so. Dami has waited at the radio table since she brought Kwak's jacket in ch 14."

  - id: P07
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up, top-down, on Taeo's right hand at the table edge"
    art: >
      Taeo's RIGHT hand clamped on the edge of the folding table, palm turned half up: an amber (#F2A93B) flare bursts in the centre of the palm,
      white-hot at its core, with hard-edged fracture lines shooting out to the fingertips; the fingers spasm open. It is the only saturated colour
      in the panel. Grey table top, grey gravel below, flat daylight. Hard-edged shapes only: no soft glow, no bloom. No text.
    calm: none
    sfx:
      - {text: "THOOM", style: impact, at: [0.78, 0.40], size: L, rot: -10}
    notes: "The slab's impact, felt through the link a split second after it lands. This is the recoil."

  - id: P08
    shape: wide
    gap: none
    bg: white
    camera: "low angle, front, close on Taeo's face and shoulders"
    art: >
      BIG REACTION. Taeo (taeo, outdoor: navy zip jacket over the black hoodie, one mole under his RIGHT eye) jerks upright, head snapping back:
      eyes huge, pupils pinpricks, mouth wide in a scream at the gate,
      a burst of blood from his nose (the one red thing in the panel), the handset cord whipping. Focus lines behind him; the gate's slit small and
      simple in the background. Hard shadows, flat daylight. No text.
    calm: top
    lines:
      - {who: taeo, type: shout, side: c, text: "NIB!!"}

  - id: P09
    shape: wide
    gap: short
    bg: white
    camera: "medium, side view at table height"
    art: >
      Taeo's knees go. He folds sideways off the crate onto the gravel like a dropped coat, the handset cord yanking the radio base across the table.
      Haein lunges across the table and catches the base before it falls. Dami, already on her feet, grabs Taeo's shoulder as he goes down and is
      dragged to her knees with him. Motion lines on the fall. Flat hazy daylight, grey gravel, hard shadows. No text.
    calm: top-right
    sfx:
      - {text: "THUD", style: impact, at: [0.30, 0.78], size: M, rot: 8}

  - id: P10
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "high angle, straight down on Taeo lying on the gravel"
    art: >
      From straight above: Taeo on his side on the grey gravel, eyes open and blank, blood dripping from his nose onto the stones (the only red),
      his RIGHT palm open beside his face: dark, ordinary, no glow at all. Dami's gloved hand on his shoulder at the frame edge.
      Flat grey light, hard small shadows under the stones. Nothing else. No text.
    calm: none
    focus: [0.50, 0.50]

  - id: P11
    shape: wide
    gap: short
    bg: white
    camera: "eye level from behind the radio table, Taeo in the near foreground"
    art: >
      Dami kneels on the gravel, snatches up the handset by its cord and shouts into it, her face raw with fear. Haein, both hands on the radio base,
      has one headphone cup pressed to her ear, listening hard, jaw tight. In the near foreground Taeo lies on his side, staring at his empty hand.
      The gate's black-violet slit behind them. Flat daylight. No text.
    calm: top
    lines:
      - {who: dami, type: shout, side: l, text: "IS HE OUT? IS MANSU OUT?!"}
      - {who: taeo, type: float, text: "THE LAST THING I FELT WAS HIM LETTING GO."}
    sfx:
      - {text: "KSSSHHH", style: phone, at: [0.40, 0.55], size: S, rot: 0}

  - id: P12
    shape: strip
    gap: long
    bg: white
    camera: "extreme close-up, top-down, Taeo's right palm on the gravel"
    art: >
      Taeo's RIGHT palm lying open on the grey gravel, a few drops of blood on the stones beside it. In the centre of the palm three small amber
      (#F2A93B) pulses land one after another: draw three concentric hard-edged amber rings, the inner one brightest, as if three taps landed on
      the same spot. The fingers twitch. The only saturated colour. Flat daylight; hard edges only, no glow, no bloom. No text.
    calm: none
    sfx:
      - {text: "TTOK", style: quiet, at: [0.25, 0.35], size: S, rot: -6}
      - {text: "TTOK", style: quiet, at: [0.50, 0.28], size: S, rot: 0}
      - {text: "TTOK", style: quiet, at: [0.75, 0.35], size: S, rot: 6}
    notes: "Motif: the knock (ch 10). Three from inside mean 'coming'. Nib is pressing his palm to the stone floor (P15), the way he pressed the wall in ch 6. Never explain it."

  - id: P13
    shape: wide
    gap: short
    bg: white
    camera: "low two-shot, Taeo up on one elbow, Dami kneeling"
    art: >
      Taeo pushes himself up on one elbow, staring at his palm, and a broken laugh comes out of him: tears and blood together, the most relieved
      face he has ever made. Dami kneels beside him with the handset still in her fist, completely lost. Haein in the background, watching them over
      the radio base. Flat hazy light, simplified gravel and gate behind. No text.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "...THREE."}
      - {who: dami, type: speech, side: r, text: "THREE WHAT?"}
      - {who: taeo, type: speech, side: l, text: "THREE MEANS COMING. HE KNOCKED."}

  - id: P14
    shape: inset-r
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag (2.5 heads; colours, outfits and props identical to the full models). Chibi Dami, tongue poked out in concentration, rams a twisted
      tissue up each of chibi Taeo's nostrils with brutal efficiency, a tissue packet tucked under her arm. Chibi Taeo now has two white tissue tusks
      like a walrus, waterfall tears of relief and little sweat drops flying. Flat pale-blue background with a screentone dot pattern. No blood in this panel. No text.
    calm: top
    lines:
      - {who: offpanel:haein, type: speech, side: c, text: "YOUR NOSE. AGAIN."}
      - {who: taeo, type: speech, side: l, text: "SORRY. I'M BLEEDING ON YOU."}
      - {who: dami, type: speech, side: r, text: "EVERYONE BLEEDS ON ME. HOLD STILL."}
    notes: "Haein's line calls back ch 12 ('YOUR NOSE IS BLEEDING'). Taeo keeps the tissue plugs in until P38."

  # ---------------- INSIDE: the scuttler, the inhaler, the shard ----------------
  - id: P15
    shape: full
    gap: fade-black
    bg: black
    silent: true
    camera: "establishing, eye level from the far corner of the side gallery"
    art: >
      The collapsed side gallery (guro_gate_gallery) moments after the drop: a low chamber of fractured pale stone, the great slab now lying flat,
      the steel prop flung against the far wall, the crushed handset's antenna poking out from under the slab's edge. Dust hangs in hard-edged layers,
      cut by two white headlamp beams (Minho's and Sejin's) and thin bars of green-dusk light from fissures in the ceiling. Sejin crouches over Kwak,
      who lies propped against a rock, coughing. Minho (minho, gate kit: headlamp band, brown work jacket, knee pads, radio on his LEFT chest) stands
      with his hooked survey pole raised toward a black fissure low in the side wall. In the middle, Nib kneels with his RIGHT palm pressed flat to the
      stone floor, eyes shut, perfectly still. Violet shadows, pale stone; no red anywhere. No link light drawn on Nib. No text.
    calm: top
    notes: "Nib has just knocked three times through the link (felt outside in P12)."

  - id: P16
    shape: wide
    gap: short
    bg: black
    camera: "medium, low, from behind Sejin and Kwak toward the side fissure"
    art: >
      Out of the dust a scuttler (extras.scuttler) explodes from the black fissure low in the side wall, legs a blur, straight at Kwak and Sejin.
      Minho steps across them and meets it with his telescoping steel survey pole, the hooked head catching one of its forelimbs; sparks where steel
      meets armour plate. Sejin hunches over Kwak, shielding his head with her arms. Speed lines and hard impact-flash shapes. The scuttler's open red
      throat is the only red. Green-dusk fissure light, a white headlamp beam swinging, violet shadows, dust in hard-edged layers. No text.
    calm: top-left
    lines:
      - {who: minho, type: shout, side: l, text: "BACK!"}
    sfx:
      - {text: "SKRRRITCH", style: impact, at: [0.75, 0.55], size: L, rot: -12}
      - {text: "KLANG", style: impact, at: [0.45, 0.35], size: M, rot: 8}

  - id: P17
    shape: tall
    gap: short
    bg: black
    camera: "low angle up at Minho, the scuttler pinned against the wall"
    art: >
      Low angle, a power shot: Minho drives the scuttler back against the gallery wall with the pole braced across its armoured head, boots skidding
      in the grit, teeth bared, the grey streak at his LEFT temple caked with dust. The scuttler's legs scrabble at the stone and its feelers whip.
      Behind and below Minho, Nib (nib, default: V-notch LEFT ear, brown rope belt, pouch RIGHT hip, empty brown wooden sheath LEFT hip, barefoot,
      grey with dust) crouches between the creature and Kwak with his knife drawn in his RIGHT hand,
      his LEFT arm out to keep Sejin back: a soldier's stance, weathered, never cute. Headlamp beam thrown up the wall, green-dusk shafts, violet shadow.
      The scuttler's red throat the only red. No text.
    calm: top
    lines:
      - {who: minho, type: shout, side: c, text: "IN. YOUR. HOLE."}
    sfx:
      - {text: "KRAK", style: impact, at: [0.62, 0.30], size: L, rot: 14}

  - id: P18
    shape: inset-l
    gap: short
    bg: black
    camera: "medium close-up on the fissure"
    art: >
      The scuttler's armoured tail and the tips of its feelers vanish back into the black fissure. Minho's boot shoves a block of stone into the gap.
      Nib, knife still out, watches the hole without blinking. Headlamp light, violet shadow. No text.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "IT'LL COME BACK."}
      - {who: minho, type: speech, side: r, text: "THEN IT GETS THE POLE AGAIN."}
    sfx:
      - {text: "SKT SKT SKT", style: quiet, at: [0.30, 0.40], size: S, rot: -4}

  - id: P19
    shape: wide
    gap: short
    bg: black
    camera: "medium, eye level, across Kwak's body"
    art: >
      Kwak lies propped against a rock, dust on his face, lips greyish, fighting for every breath: shoulders hunched, neck muscles straining, one hand
      clawing at the front of his vest. Sejin on one knee at his side holds out an open gloved palm without taking her eyes off his face. Nib, knife
      sheathed again on his LEFT hip, is already putting a blue plastic inhaler into her palm, fetched from the pouch on his RIGHT hip; the pouch flap,
      with Haru's small dinosaur sticker, hangs open. Kwak's eyes fix on the inhaler, stunned. Headlamp light, green-dusk shafts, violet shadow. No text.
    calm: top
    lines:
      - {who: sejin, type: speech, side: r, text: "INHALER."}
      - {who: mansu, type: whisper, side: l, text: "MY... HOW...?"}
      - {who: nib, type: speech, side: c, text: "DAMI."}
    sfx:
      - {text: "HHHK... HHHK...", style: quiet, at: [0.15, 0.62], size: S, rot: 0}
    notes: "The inhaler from Kwak's jacket, which Dami brought out and Taeo sent in with a porter run in ch 14 ('JUST IN CASE')."

  - id: P20
    shape: strip
    gap: short
    bg: black
    camera: "extreme close-up on the inhaler at Kwak's mouth"
    art: >
      Extreme close-up: Sejin's gloved hands fit the blue inhaler's mouthpiece to Kwak's cracked lips; his big, work-worn, dust-creased hand has closed
      over hers on the canister. His eyes are squeezed shut. White headlamp light. Nothing else in frame. No text.
    calm: none
    lines:
      - {who: sejin, type: speech, side: r, text: "ALL THE WAY OUT. NOW IN. HOLD IT."}
    sfx:
      - {text: "PSSHT", style: quiet, at: [0.70, 0.40], size: M, rot: -6}

  - id: P21
    shape: inset-r
    gap: short
    bg: black
    silent: true
    camera: "extreme close-up on the inhaler's dose counter"
    art: >
      Extreme close-up of the back of the blue inhaler between Sejin's gloved thumb and finger: the small dose-counter window on the canister is a plain
      white rectangle, left blank for the letterer. Her headlamp makes one hard white reflection on the plastic. Dark background. No numbers or text drawn.
    calm: none
    ui:
      - {kind: label, text: "014", at: [0.52, 0.50], size: 40, color: "#1d1917", rot: 0, notes: "move onto the dose-counter window once the art exists"}
    notes: "Fourteen doses left: Kwak has been putting off a refill until payday."

  - id: P22
    shape: wide
    gap: short
    bg: black
    camera: "medium two-shot, slightly high, Sejin and Kwak"
    art: >
      Kwak's breathing has eased a notch. He gives Sejin a sheepish, guilty half-smile, and she gives him the flat look of a medic who has heard
