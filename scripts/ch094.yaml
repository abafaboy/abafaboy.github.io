extras:
  depot_keeper: "Adult Korean woman about 50, cropped hair, grey work jacket and trousers, work gloves; practical depot custodian."
  field_assistant: "Adult male scout about 30, plain olive field vest, grey work trousers, white hard hat and boots. Assists Nib; no invented named crew membership."
  ironvow_members: "Adult hunters of mixed genders in dark-steel plate, charcoal undersuits and muted dark-red inset/waist tabs; two-link clasp LEFT collar."
locations: [yeoju_anchor_field, yeoju_gate_a, yeoju_gate_b, yeoju_supply_depot]
location_notes:
  yeoju_anchor_field: "Continue ch93: five independent framed door-height gates A-E west-east; depot north, exterior operator canopy southwest, medical shelter south. A/B pair joined by exterior white blue-banded communication cable and separate grey force couplers, not a physical passage between dungeons. Each frame has paired knock plates, one reachable from each face."
  yeoju_gate_a: "No key. Lavender morning sky, pale ochre stone like flattened reeds, broad firm landing and low extraction terraces. Stock seam north of landing; boss alive beyond a distant folded ridge. Landing has ample room for Orrin and a braced timber stock sledge; cable and tripod every 50 m along surveyed lane."
  yeoju_gate_b: "No key. Same wrong lavender sky, violet shadows, darker reed-stone ribs. Entry landing opens east along a narrow causeway to a broad extraction shelf. South/right side is a deep dry ravine; north/left side solid rib wall. A transverse stone tooth projects from north wall across the causeway's far end; a firm upper notch lies behind it. Iron Vow approaches from shelf's north-east side. Near-threshold causeway is already weathered; no fault-induced collapse."
  yeoju_supply_depot: "North side of exterior apron: corrugated lean-to, paired scales, locked fuel cage east, stock tables west, plain overhead work lamps powered by a depot anchor module. Venn fuel belongs to depot equipment, not Haein's relay rig."
continuity_notes: >
  Nib: adult 105 cm, LEFT V-notch and lower LEFT fang; brown rope belt, RIGHT pouch/dinosaur sticker,
  LEFT brown wooden sheath, matte black 8x30 binoculars with strap knotted LEFT and fork on hinge.
  Ch43 chosen boots retained; provisional dark-brown lace-up ankle boots, rounded toes, low black rubber soles
  until the parallel ch43 script supplies final description. PAPER drawing, pale-blue ID and cobalt pencil stay secured.
  Taeo outside throughout: navy jacket/black hoodie/cargos/striped black sneakers; RIGHT-eye mole; olive old-patch backpack.
  Nib amber pulse only in Taeo's RIGHT palm; Orrin slate-green. No new companion link colours shown.
  Marks inside are thin cold-white wrist rings with violet edges, fading on voluntary outward crossing.
  Ordinary exit remains possible while a boss lives; there is no automatic recall without a boss death.
  All collected stock is extracted before a boss clear. No boss killed in this chapter.
  Kesh handles physical survey-line communication; the mechanical couplers do not substitute for intact communication cable.
palette_notes: "Exterior: cool daylight, slate and ochre. Interior: A4 wrong lavender sky/violet shadow, pale reed-stone. Depot: cool institutional white work lamps and grey-brown. Red for danger only; cyan interface reserved, no decorative particles or bloom."
