chapter: 77
title: The Loop
when: "Continues ch076's counter reveal, then the following morning in Seoul. Recorded evidence and bench work lead through an unnumbered recovery/testing interval; the final day returns to Chungju hospital and the gate. No calendar date or instant recovery is implied."
story_beats: PART_ONE_BEATS.md#77
cast:
  taeo: outdoor # Navy jacket/black hoodie/cargos/one-stripe sneakers, olive backpack with old orange door patch. RIGHT forearm wrapped initially, support retained for testing; old bruising persists. RIGHT-eye mole.
  nib: default # Adult 105-cm scout; exact brown ch043 boots and ch076's TWO charcoal shorts repairs. Permanent props locked below.
  kesh: default # Adult 198-cm moth-like keeper; full first-panel description P06. No force storage, flight or link activation.
  orrin: default # Adult quadruped, bare terraced slate shell with repaired Sinjeong crack. Removable rim brace/collector with consent, never a saddle or restraint.
  haein: default # Slate-blue overalls, beige tee, tool belt, clear glasses pushed up except while working.
  sera: default # Hospital cream shirt and sand trousers until final day; then river-green wrap, cream sleeves, sand trousers, brown boots, braid/bone bead, flute RIGHT hip, quiver RIGHT shoulder. LEFT bow arm injured, dressing and rigid brace throughout final day.
  sejin: default # Sage scrub shirt, olive medic rig, charcoal cargos, boots; cropped black hair. Stays with Sera in Chungju until final operation.
  minho: default # Brown jacket, grey tee, olive cargos/knee pads, brown boots, chest radio; LEFT grey streak. No new debt transaction.
  granny_moon: default # Opening only, elderly grey-skinned 190-cm woman; long ears, silver bun, moss cardigan, cream shirt, oatmeal apron, charcoal trousers, brown slippers, glasses on cord. No speech.
locations: [moon_laundromat, ryu_practice_yard, chungju_hospital, chungju_river_gate]
location_notes:
  moon_laundromat: "Use drawn key and ch076 geography. Two forks on projecting NORTH counter lip, older one 6 cm west of Nib's, previously concealed by felt mat; southeast door, southwest blind."
  ryu_practice_yard: "Use key: southwest office, southeast west-facing white van, fixed central plywood maze, north targets, west trestle. Bench rig and removable dummy firing cradle sit west of maze without altering walls. All bench tests are low-power, on dry land."
  chungju_hospital: "Same local hospital as ch072-075. Ward bedside effects include bow/quiver/flute. Bed to right and cupboard to left in doorway view, pale curtain, blue-white overhead light, shaded cream lamp. No Seoul transfer, newly invented surgery or healing technology."
  chungju_river_gate: "EXTERIOR, following ch070-075: fenced river-maintenance cutting, gravel, scaffold-braced violet-black slit with exposed tapping plate, operator table under canopy, Haein station left, medical canopy right, clear ambulance/return lane. White survey cable with blue bands each metre; grey relays every 50 m inside. No drawn key."
props:
  nib_locks: "LEFT V-notch, single lower LEFT fang, brown rope belt, RIGHT pouch/dinosaur sticker, LEFT wooden sheath; matte-black 8x30 binoculars, LEFT-neck strap knot and fork-marked hinge; pale-blue ID, folded PAPER post drawing and marked cobalt pencil protected. Same ch043 matte dark-brown ankle leather boots, broad round toe, four dull gunmetal eyelet pairs, brown round double-knotted laces, black low-heel lug soles, heel pull tabs, oat-grey socks. No footwear change."
  loop_evidence: "Original recorded real speech and +12-second copies, ch067. Physically synchronised clock tests ch068: test05 06:36:00 -> 06:36:12; test06 branch OPEN 06:43:00 -> no return; test07 CLOSED 06:45:00 -> 06:45:12; test08 OPEN 06:47:00 -> no return. Ordinary field recorder/labels, no operator-system log."
  bench_loop: "Low-power craft replica of the mapped return branch; three dull stone contact pairs connected by visible grooved carriers in a long folded physical path. It carries timing signals only. A removable tongue opens/closes one branch. Its layout is a physical demonstration, not a working pocket dungeon."
  reservoir: "Haein's rebuilt post-ch060 bank apparatus: dull-steel one-shot spring cartridge, replaceable compression stack, bracing collector and dump lever. New housing explicitly built from recovered usable components and replacement parts; ch060's shattered original is never intact again. Usable bank remains at most 0.8 seconds. Only bounded mechanical impulse, no water-volume storage, voices, poison or heat."
  firing_cradle: "Fixed padded frame carries bow weight, draw force and recoil into its base. Sera's LEFT hand only guides alignment within her rigid brace; RIGHT hand controls the release. Sejin supports the injured elbow. One assisted release, not normal archery. Prepared firing-position anchor permits the limited Orrin -> Taeo -> supported shot hand-off. No new link colour or percentage is assigned."
  timing: "Old full-loop copy is +12 s. NEW local timing branch measured separately: first station reports commitment before impact and arms the bank; collector impact starts bank t=0.00, confirmations t=0.20 and 0.40; opening after t=0.50, Sera's release at t=0.55, impulse reaches cradle t=0.60. Hard dump by t=0.80 if no shot. Unequal measured station spacing; no spoken fractional countdown."
continuity_notes: >
  PAYOFF P15 is a physical delayed relay circuit, not time travel. It does not identify the relay's maker or pay off P16.
  Ch068 controls and ch074 last ten panels were read. Nib's personal knock remains a near-threshold physical signal;
  no microphone password or presumed long-range knock replaces it. Any participant calls STOP; Taeo cannot override.
  Existing final-battle script ch078 was checked for its 0.20/0.40/0.60 sequence, supported LEFT bow arm and five entrants.
  Its location aliases differ: its chungju_gate_site is this chapter's exterior chungju_river_gate;
  its interior chungju_river_gate is the upstream scripts' chungju_river_inside. Refer to actual geography, never swap sides.
  Hospital visits include travel; Sejin/Sera stay in Chungju during remote draft review and recovery, then travel locally to gate.
  Final five intended entrants are Nib, Orrin, Kesh, Sera, Sejin. Taeo/Haein/Minho remain outside. No one crosses in this chapter.
  Sera's earlier consented link hue copper-rose #C77E91 and Kesh's reserved lilac #B7A0D3 are retained but not drawn.
palette_notes: >
  A4 yard ochre/brown with sky blue, workshop lamp warm cream; hospital institutional blue-white/slate;
  laundromat cream/teal/brown; final Chungju overcast grey and cold violet rim. Diagram inserts use flat muted
  stone/cream/charcoal with hard edges. No interface windows, supernatural repair glow, sky inside cavern or decorative haze.
