chapter: 62
title: The Photograph
when: "Three days after the exhibition final: grant-funded deliveries at the Mapo base. The next day Taeo takes a three-hour coach to Haeseong, stays overnight, and returns by three-hour coach the following morning. Final meeting and Chae's call that afternoon. No fixed date or weekday."
story_beats: PART_ONE_BEATS.md#62
cast:
  taeo: outdoor # Navy zip jacket over black hoodie, black cargos, black single-white-stripe sneakers; jacket off at family table, back on before return. One mole RIGHT eye. Clean white forearm dressings remain; nose dressing present early, removed after morning wash in Haeseong, small healing red mark remains. No fresh bleeding. Olive old-patch backpack and cracked dinosaur phone.
  nib: default # Adult scout, LEFT V-notch, one lower LEFT fang, brown rope belt, RIGHT dinosaur pouch, LEFT brown wooden sheath. Matte black 8x30 binoculars, LEFT strap knot, fork-marked hinge. ID, folded PAPER drawing and marked cobalt pencil secured. Ch 43 matte dark-brown ankle leather boots, broad round toes, four pairs dull gunmetal eyelets, double-knotted brown round laces, black low-heel lug soles, heel pull tabs; oat-grey socks inside collars.
  orrin: default # Adult 230-cm stoneback, shell height 135 cm; four columnar legs and layered slate shell, healed ch 37 seam. No new shell injury or harness.
  sera: default # Adult human archer; river-green wrap/cream sleeves, sand cropped trousers, brown boots, thick brown braid. LEFT bracer/bow, RIGHT quiver and bone flute. Both arms sound.
  haein: default # Slate-blue bib overalls, beige tee, brown tool belt; glasses on crown or lowered for cable work.
  sejin: default # Sage scrub shirt, olive medic rig, charcoal cargos and work boots. Inspects grant equipment; does not magically heal Taeo.
  minho: default # Brown jacket, grey tee, olive cargos, knee pads, brown boots; grey LEFT-temple streak, LEFT-chest radio and LEFT-wrist watch.
  haru: default # Ten, cowlick, missing upper front tooth, yellow dinosaur tee, blue shorts, grey Velcro trainers outside; shoes off at the family table.
  grandma: default # Kim Okja, permed grey hair, glasses on beaded cord, red/navy plaid, beige quilted vest, dark trousers, slippers, strong work-worn hands.
  grandpa: default # Yoon Gilsu, white hair, faded blue work cap, grey pocket jacket, muted blue shirt, brown trousers; two-wheel cardboard cart stays outside.
  chae: default # Voice only on live phone at the final hook. No drawn appearance or new promotion.
extras:
  delivery_worker: "Adult Korean woman about 40, short hair under plain navy cap, muted grey work jacket and trousers, brown gloves, blank delivery clipboard."
locations: [tyre_shop_base, haeseong_bus, haeseong_port, grandparents_house, chungju_river_gate]
location_notes:
  tyre_shop_base: "Use ch 33 canonical compound: south double metal gate, cracked concrete forecourt, north single-storey repair bay, east corridor with two lockable rooms and washroom/sink at end, west lean-to with Orrin's sleeping mat. Disconnected lift and tyre rack at bay back, scarred worktable, broad roller opening. Roof not load-rated for Orrin. No guild sign yet. mapo_tyre_base in ch 63 is an alias of THIS compound. This is crew workspace, not the Ryu yard or Taeo's separate home container."
  haeseong_bus: "Ordinary intercity coach, muted blue-grey seats, aisle, overhead bags, drawn coastal road views. Three hours Seoul–Haeseong each direction. No real operator branding or invented direct teleportation."
  haeseong_port: "Follow locations/haeseong_port key_wide and reverse. Land north/water south, shore road, northwest bus shelter, three idle white/navy boats, west breakwater extending south. Narrow offshore gate SOUTH of harbour mouth within six muted orange buoys; no new opening or moving it into harbour. Cardboard cart by shelter belongs to Grandpa."
  grandparents_house: "Use drawn keys and notes: south sliding courtyard doors, low central table/floor cushions, north kitchenette, sink west/hob centre/cream fridge northeast; WEST low TV cabinet, east curtained window, bedding northwest. Small concrete courtyard, east pots, west bench, plain metal gate. Present-day flat TV stays dark. Family photo stays on its cabinet; do not bring the separate container-home photo here."
  chungju_river_gate: "SURVEY STILL ONLY at hook, matched to ch 63: no sky, low continuous stone ceiling, broad underground river flowing upper-right to lower-left, near-bank walkable shelf. Carved settlement sign lies on first shelf away from water. Cold-white survey lamps, wet violet shadows, muted teal water. Emblem copied exactly from Sera's existing map. No predator, voices, return marks, living settlement or proof of Ilan's location."
props:
  official_photo: "Exact ch 61 P34 image. Nine people: seated bandaged Taeo, adult booted Nib, full-size Orrin, Sera, Haein with bagged broken unit, Sejin, Minho and the two established Ryu crew. No solo crop that removes anyone. Haru absent. A small paper print is pinned by the base worktable in P35."
  reservoir: "ch 60 broken hand-sized dull-steel rectangle, split copper band, ivory inspection window, collapsed WHITE indicator tab, two capped ports and grey hand strap. Casing and loose band/fitting remain sealed in Haein's parts bag. Still unusable all chapter. Rebuild is design work only, not a functioning replacement."
  van: "Grant purchase: plain off-white used long-wheelbase high-roof utility van, two wide rear doors, dark unlettered side panel, plain black bumpers and low removable loading ramp; ordinary work vehicle, no guild emblem. Equipment mounts along sides; a clear central route. Check usable width/height and load rating for Orrin before he boards; no harness placed on him. Separate from Ryu's vans."
  relay: "Grant equipment retains Ryu standard: white cable with BLUE band every metre, grey tripod every 50 m, grille, coiled handset, white status lamp. More sets and spares, no wireless miracle. Paired housings are for future staged tests, not working simultaneous two-threshold force exchange."
  dinosaur_gift: "Small matte green plastic triceratops in plain paper box, bought with Taeo's own money; ₩18,000. No grant money, luxury electronics, readable package or magic quality."
money_notes: "The existing ₩150,000,000 equipment grant is fully committed through approved vendor purchases: ₩48,000,000 van and loading fittings; ₩72,000,000 relay sets/cable/base-station spares; ₩30,000,000 field medical equipment/supply cases. Total ₩150,000,000, no withdrawable cash or spare grant balance. Med allocation includes portable monitoring equipment and transport kit, not just bandages. Personal coach fares are not specified; gift costs ₩18,000 from ordinary personal funds. No wages, debt balances or Sera's solo prize changed."
palette_notes: "Base daylight follows A4 yard dusty ochre/warm brown with cool blue-grey workshop shadows; work lamps cream. Coach blue-grey with ordinary window daylight. Haeseong port follows key's muted sea blues, concrete grey and dull orange buoys; offshore gate violet-black/cold rim. Family room A4 warm amber/brown, steam white; late afternoon south/east light then pendant at night. Chungju still cold white/teal/violet, no sky. Flat cel colour and hard shadows; no readable text, bubbles or SFX in art. All active screens use same-panel UI or KIT HAND."
panels:
  - id: P01
    shape: tall
    gap: none
    bg: white
    camera: "flat HunterLink front page, the panel becomes the app"
    art: "APP PANEL. Letterer fills the lead image slot with the exact complete group photograph from ch 61 P34. No new art."
    calm: none
    ui:
      - {kind: phone.hunterlink_rank, on: panel, title: "HUNTERLINK · FRONT PAGE", text: "A PLACE IN THE PHOTOGRAPH\nExhibition winners and support crew\n#MYSUMMONSGOFIRST", notes: "Full-width lead photograph includes all nine faces and the broken reservoir bag. This is editorial placement, not a changed combat rank."}
    notes: "ARC V local resolution: the group photo replaces the humiliating isolated crop. It is the same win and existing equipment grant."

  - id: P02
    shape: inset-l
    gap: short
    bg: white
    camera: "close on Sejin at the base worktable, looking down toward the app"
    art: >
      sejin (sage scrubs, olive rig) at tyre_shop_base scarred table squints at a phone
      whose display faces her, not reader. Her tired brows rise in surprise at finding
      herself included; one hand hovers over a medical case. Roller-door daylight from
      south, warm wood and cool slate shadow. No readable screen, logos or glamour lighting.
      Sejin's head and shoulders are at left; Taeo sits off-frame right.
    calm: right
    lines:
      - {who: "sejin", type: "speech", side: "l", text: "I LOOK TIRED."}
      - {who: "offpanel:taeo", type: "speech", side: "r", text: "THE PHOTO'S VERY ACCURATE."}

  - id: P03
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "extreme close-up of Nib's finger checking the complete picture on a turned-away phone"
    art: >
      tyre_shop_base: nib's long olive fingertip pauses beside the back of the cheap
      upright phone as he checks the photograph; the actual screen faces away. His
      marked cobalt pencil remains in RIGHT pouch at edge, black binocular strap
      visible above. South daylight, warm table wood, brown shadows. No drawn names,
      green screen or a second notch.
    calm: none
    notes: "He checks that the people he agreed to stand beside remain in the image; no new solo publicity."

  - id: P04
    shape: full
    gap: short
    bg: white
    camera: "at table height across Nib toward Sera and Taeo"
    art: >
      tyre_shop_base, nib (adult, chosen brown boots, binoculars) stands by the table
      while sera in river-green checks her braid with a vain satisfied smile. taeo
      in navy jacket sits with forearms dressed and small nose patch. South roller
      opening daylight, dusty ochre court beyond, brown/slate shadows. Screens turned
      away, no texts in art or claiming Nib enjoyed interviews.
      Nib stands at left and Sera at right; Taeo sits in the middle behind the table.
    calm: top
    lines:
      - {who: "nib", type: "speech", side: "l", text: "THEY LEFT EVERYONE IN."}
      - {who: "sera", type: "speech", side: "r", text: "THEY LEFT MY BAD SIDE IN."}
      - {who: "nib", type: "speech", side: "l", text: "YOU CHOSE YOUR ANGLE."}

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 62 · THE PHOTOGRAPH"

