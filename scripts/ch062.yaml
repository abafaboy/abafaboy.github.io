    notes: "Exact allocation of the ch 59 award; 48 + 72 + 30 = 150 million. Vendor purchases, not cash in Taeo's personal account."

  - id: P07
    shape: tall
    gap: long
    bg: white
    camera: "establishing from the south compound gate into the forecourt"
