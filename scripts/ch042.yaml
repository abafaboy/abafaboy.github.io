chapter: 42
title: The Plaque
when: "Friday after ch 41. Early morning welcome at Ryu Survey; Grandpa's routine hospital appointment at 10 AM; rescue unit's yearly memorial service at 11 AM; back at the yard that afternoon."
story_beats: PART_ONE_BEATS.md#42
cast:
  taeo: outdoor # navy jacket over black hoodie, black cargos and striped sneakers; jacket removed and hoodie sleeves rolled only at yard washing-up
  nib: default # barefoot; adult locked anatomy and belt props; binoculars high, LEFT strap knot, hinge fork
  grandpa: default # faded blue work cap, grey pocket jacket, blue-grey shirt, brown trousers, old walking shoes
  yeo_ara: default # current open-door rescue patch; radio RIGHT vest
  seoryun: default # brief service appearance, current team patch, away again afterward
  granny_moon: default # grey skin, long ears, silver hair in low bun, glasses on cord, dark olive cardigan, cream apron, black trousers
  orrin: default # remains at yard; existing Sinjeong shell crack unchanged
  sejin: default # paid safety officer; muted teal field top, tan chest medical rig, dark trousers
extras:
  mourners: "About twenty rescue workers and bereaved relatives, ordinary muted coats; no ranks displayed for the gathering."
  tea_helper: "Ryu staff member in a faded orange vest, older woman, hair clipped back; no speaking role or new identity."
locations: [ryu_practice_yard, long_night_memorial]
location_notes:
  ryu_practice_yard: "Use canonical wide/reverse keys: south gate, grey office southwest, white van southeast, fixed plywood maze and north targets. Home container is separate from the office. Washing-up basin is a portable metal bowl on west equipment trestle; no plumbed structure added to key."
  long_night_memorial: "No key yet. Small Seoul memorial park: east entrance from bus road, straight pale-stone walk, low dark-grey memorial wall north of a square court. West end holds a waist-high sloping plaque, accessible from level paving; bench under a young zelkova on south side. Names and category rows blank in art. Flower shelf runs below the plaque. No gate, secret door, Annex signage or supernatural light."
props:
  nib_gear: "Pale-blue ID, folded PAPER watch-post drawing and marked cobalt-blue pencil kept in RIGHT pouch with green dinosaur sticker. Matte black 8x30 binoculars on LEFT-knotted woven strap, Kett fork on hinge; sheath brown wooden at LEFT hip, brown rope belt."
  family_bag: "Grandpa's worn dark overnight bag, kept in yard office while he goes to appointment; sealed unremarked envelope inside remains unrevealed until ch 44."
  flower: "One ordinary white chrysanthemum with one green stem, no ribbon, magic, carving or note. Remains beneath anomalous-entities row."
palette_notes: "Yard follows A4 dusty ochre/warm brown/sky blue. Memorial: cool stone grey, pale blue daylight, violet-grey shade; single white flower. No link-colour use except the brief consenting yard test; amber RIGHT palm, slate-green Orrin channel. Service remains normal proportions."
