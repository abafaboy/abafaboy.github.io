      the kind tied to a ticket counter). Nib grips it in his RIGHT fist, soldier-style, and drags a hard line along the bottom of the sheet.
      Chae watches his hand, not his face. Blue-white light, daylight shapes on the tiles. No text.
    calm: top-right
    lines:
      - {who: chae, type: speech, side: r, text: "SHOW ME."}
      - {who: nib, type: speech, side: l, text: "WALL HERE. TREE BEHIND IT."}
    sfx:
      - {text: "SKRITCH", style: quiet, at: [0.55, 0.78], size: S, rot: -10}
    notes: "Beat: Nib draws his post. The short pencil stub sets up ch5 (Eunchae gives him 'A LONGER ONE'). Nib keeps it (P47)."

  - id: P40
    shape: strip
    gap: short
    bg: white
    camera: "top-down extreme close-up on the drawing"
    art: >
      Top-down on the sheet: Nib's pencil drawing, rough and functional, not pretty: a low wall of stacked stones along a ridge, a crooked tree behind it,
      a short tick-mark where he sat, the ground falling away below to a path that winds down and out of the frame. Beside the path, a small closed shape
      left completely blank, an outline with nothing inside. His olive-green fingers and the pencil stub at the edge. No symbols, no letters, no fork mark.
      Keep the drawing in the middle third. No text.
    calm: none
    lines:
