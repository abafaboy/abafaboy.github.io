      - {who: taeo, type: float, text: "I WANTED IT TO BE HIS WALL."}
    notes: "The first of the six. Inside a gate the sky is the wrong colour (STORY_BIBLE §5); keep it quiet here, the motif proper starts at ch11. It is NOT his post: no white bit anywhere in it."

  - id: P46
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up of Nib's face lit by the tablet"
    art: >
      Extreme close-up strip of Nib's face from the eyes to the chin, lit cool and pale from below by the tablet (the screen itself out of frame):
      he studies the footage for a long moment and lets it go. ACTING: no drama; the eyes close a fraction, the jaw tightens and releases.
