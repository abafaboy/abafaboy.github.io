      - {who: "offpanel:nib", type: speech, side: l, text: "AND THE WHITE BIT."}
    notes: "Beat lines, verbatim. 'The white bit' is drawn as a blank outline: white paper. It is what ch11 picks up (ledger P07, white stone, 'THE SAME KIND'); it is not logged as a plant here. No Kett's mark: it first appears in ch5."

  - id: P41
    shape: inset-r
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
