    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "HOW TALL WAS THE WALL?"}
      - {who: nib, type: speech, side: r, text: "HERE."}
    notes: "Taeo asks instead of guessing (contrast P08)."

  - id: P43
    shape: inset-r
    gap: short
    bg: white
    camera: "kit hand: Chae's tablet"
    art: "KIT HAND"
    calm: none
    ui:
      - {kind: phone.info_card, on: screen, hand: chae_tablet, title: "PUBLIC GATE SURVEYS", text: "Search: stone wall, tree, high ground · 6 recordings"}
    lines:
      - {who: chae, type: speech, side: l, text: "SIX SURVEY RECORDINGS. A WALL, A TREE, HIGH GROUND."}
    notes: "Beat: Chae's PUBLIC GATE SURVEYS archive has six recordings for his description."

  - id: P44
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up on Chae, frontal, the tablet against her chest"
    art: >
      Chae, kneeling, holds the tablet (blue cover) against her chest with both arms and gives Nib the truth at his eye level: calm, careful, kind without softening it.
      Plain pale-blue background. No text.
    calm: right
    lines:
      - {who: chae, type: speech, side: l, text: "THESE ARE FROM INSIDE GATES. IT DOESN'T MEAN YOU'RE FROM ONE."}
      - {who: "offpanel:nib", type: speech, side: r, text: "THEN WHY LOOK?"}
      - {who: chae, type: speech, side: l, text: "BECAUSE IT'S WHAT WE HAVE."}

  - id: P45
    shape: wide
    gap: short
    bg: white
    camera: "the panel IS the survey recording: a surveyor's helmet camera, eye level, slightly wide-angle"
    art: >
      The panel is the footage itself, drawn: a survey recording from inside a gate, seen through a helmet camera, with a slight wide-angle bend at the edges and a thin dark frame line.
      A rocky hollow of grey boulders; on a rise, a tumbled line of stacked stones that might once have been a wall; one dead, crooked tree.
      Above it, the WRONG-COLOURED SKY: a flat pale lavender noon with no sun. At the bottom edge, the gloved hand and red-orange sleeve of a surveyor.
      The footage is muted and a little flat, like recorded video, but still drawn with clean lines and hard shadows (no noise, no blur). No text, no timestamps, no interface.
    calm: top-left
    lines:
