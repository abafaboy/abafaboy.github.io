  # ---------------- THE WATCH POST ----------------
  - id: P36
    shape: wide
    gap: long
    bg: white
    camera: "medium two-shot, Chae and Nib at the same eye level"
    art: >
      Chae, crouched, unbuckles the fob from Nib's LEFT wrist; he lets her. Their eyes are level. Nib asks it flatly, the way a soldier asks for a report;
      Chae answers straight, without looking away. Taeo at the edge of frame holds his own unbuckled fob. Blue-white light. No text.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "BUT YOU CAN'T SEND ME BACK."}
      - {who: chae, type: speech, side: r, text: "I CAN'T DO THAT WITH WHAT WE'VE FOUND."}

  - id: P37
    shape: vignette
    gap: short
    bg: white
    silent: true
    camera: "wide, slightly high, Nib small in the middle of the floor"
    art: >
      A quiet borderless vignette fading into white. Nib stands alone in the middle of the open floor, small, hands at his sides, looking at nothing,
      a long hard-edged patch of window daylight lying across the tiles beside him. The foam pad is gone from the chair. A useful thing has happened,
      and it is far smaller than the thing he came for. Very simplified room. No text.
    calm: none

  - id: P38
    shape: inset-l
    gap: short
    bg: white
    camera: "medium close-up on Taeo, frontal"
    art: >
      Taeo sits forward on the edge of the visitor chair, looking at Nib (off-panel right), making himself be useful: an earnest, tired face, hands clasped.
