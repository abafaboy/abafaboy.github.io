    calm: top
    lines:
      - {who: chae, type: speech, side: r, text: "I'M WRITING 'INTERMITTENT SENSORY RESPONSE.'"}
      - {who: taeo, type: speech, side: l, text: "IS THAT GOOD?"}
      - {who: chae, type: speech, side: r, text: "IT'S TRUE."}
    notes: "Chae's written finding (output low, no rank yet, from ch3). Nib keeps the original drawing and the pencil stub; Chae has photographed the drawing with her tablet. Runner: Nib loves pockets."

  - id: P48
    shape: wide
    gap: short
    bg: white
    camera: "from the corridor, outside the glass door, looking in through the door and the glass partition"
    art: >
      From the corridor: Taeo holds the glass door open (the lock turned back), half out of the room; Nib walks out ahead of him toward us.
      Through the glass partition behind them, Chae has risen from her desk with one hand lifted, about to say something urgent to Taeo, when the desk phone
