    calm: top
    lines:
      - {who: chae, type: speech, side: r, text: "TAEO. WHATEVER HE OFFERS YOU—"}
      - {who: chae, type: whisper, side: r, text: "...THAT'LL BE MY SUPERVISOR."}
    sfx:
      - {text: "BRRRRT", style: phone, at: [0.78, 0.58], size: M, rot: -8}
    notes: "Pays off P13 at once and cuts off her warning, so Taeo walks into the lobby unwarned. Taeo holding the door while Nib goes out first is the open-door motif; don't point it out."

  # ---------------- THE LOBBY ----------------
  - id: P49
    shape: full
    gap: long
    bg: white
    camera: "establishing, the lobby from the mouth of the corridor, eye level"
    art: >
      The AAO lobby (aao_lobby, see location_notes), early afternoon: the glass front onto the street with the revolving door turning slowly, rows of linked blue-grey seats,
      the reception counter with its blank number display and the receptionist (extra) behind it, the lobby_people (extras) waiting with paper tickets, a potted ficus,
      green exit signs. High on the side wall, the TV (screen: green). Daylight through the glass front, blue-white ceiling light.
      In the middle of the seats, Dr. Pyo (dr_pyo, default: neat grey suit, white shirt, no tie, thin rimless glasses, greying hair combed back, the blank lanyard
      with a visitor's pass) rises with a paper coffee cup in each hand and a warm, genuinely pleased smile. In the foreground, Taeo (outdoor, backpack on one shoulder)
      and Nib come out of the corridor and stop. ACTING: Taeo caught; Nib's hand settling on his knife hilt; Pyo delighted, never sinister-cartoon. No text.
    calm: top-right
    intro: "DR. PYO JAESUNG · KANGHAN INSTITUTE"
    ui:
      - {kind: tv.lowerthird, on: screen, text: "KANGHAN INSTITUTE RENEWS STATE RESEARCH CONTRACT", ticker: "HAPJEONG-DONG STORE GATE CLEARED OVERNIGHT · NO CASUALTIES · RESCUE NETWORK BILL DELAYED AGAIN"}
    lines:
      - {who: narr, type: tag, text: "12:52 PM"}
      - {who: dr_pyo, type: speech, side: r, text: "MR. YOON."}
      - {who: dr_pyo, type: speech, side: r, text: "AND YOU MUST BE NIB."}
    notes: "Beat: Dr. Pyo Jaesung, Kanghan Institute, courteous and genuinely curious. He has waited 78 minutes. He uses both names unasked: the flag sent him the file. The ticker keeps ch1's store gate and Han Seoryun's stalled rescue-network bill in the world; nobody reads it aloud."

  - id: P50
    shape: wide
    gap: short
    bg: white
    camera: "medium two-shot over Nib's head, Pyo handing Taeo a cup"
    art: >
      Pyo holds out one of the paper cups to Taeo with a small apologetic tilt of the head; Taeo takes it on reflex in his LEFT hand, polite and wary,
      and finds it cold. Nib stands between them at belt height, looking from the cup to Pyo. Pyo keeps the other cup. Simplified lobby behind: seats, the ficus, daylight. No text.
    calm: top
    lines:
      - {who: dr_pyo, type: speech, side: r, text: "FORGIVE THE AMBUSH. THE OFFICE SHARES ITS FILES WITH US."}
      - {who: dr_pyo, type: speech, side: r, text: "THIS ONE'S YOURS. IT WENT COLD. I WAS EARLY."}
      - {who: taeo, type: speech, side: l, text: "...THANK YOU. SORRY."}
    notes: "'I WAS EARLY' is his only answer to P02 ('HE WAS ALREADY HERE'). Taeo keeps the cold coffee, undrunk, in his LEFT hand to the end of the chapter."

  - id: P51
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up on Nib from Pyo's eye line, looking down"
    art: >
      Nib looks up at Pyo, deadpan, his empty hands at his sides. ACTING: a flat statement of fact, a soldier noting who was counted and who wasn't.
      The V-notch in his LEFT ear, amber eyes. Plain pale background. No text.
    calm: left
    lines:
      - {who: nib, type: speech, side: c, text: "NONE FOR ME."}
      - {who: "offpanel:dr_pyo", type: speech, side: r, text: "...I DIDN'T KNOW YOU'D WANT ONE."}
      - {who: nib, type: speech, side: c, text: "I DON'T."}
    notes: "Laugh with an edge: Pyo didn't think of Nib as someone who wants things. By ch6 he has learned ('I GUESSED JUICE')."

  - id: P52
    shape: wide
    gap: short
    bg: white
    camera: "low side view at Nib's height, Pyo crouching into frame"
    art: >
      Pyo crouches to Nib's eye level, neatly pinching his suit trousers at the knee, the remaining cup held aside, his face open, delighted and genuinely curious,
      like a man who has waited a long time to ask one question. Nib does not step back; his hand rests on his knife hilt, unhurried. Taeo stands above them
      holding the cold cup, uneasy. Simplified lobby, daylight. No text.
    calm: top
    lines:
      - {who: dr_pyo, type: speech, side: r, text: "MAY I ASK YOU ONE THING?"}
      - {who: nib, type: speech, side: l, text: "NO."}
      - {who: dr_pyo, type: whisper, side: r, text: "...WONDERFUL."}
    notes: "He takes the refusal as a finding."

  - id: P53
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "extreme close-up of Pyo's eyes behind his glasses"
    art: >
      Extreme close-up strip of Pyo's eyes behind the thin rimless lenses: crinkled with warm delight, and underneath it a bright, unblinking fascination,
      the look of a man who has found exactly what he came for. One hard highlight on each lens. Eyes in the middle third. No text.
    calm: none

  - id: P54
    shape: full
    gap: short
    bg: white
    camera: "low angle from beside Nib, looking up at Pyo and Taeo"
    art: >
      Pyo rises and speaks to Taeo over Nib's head, warm, reasonable, almost gentle; his open hand gestures toward Nib without looking at him.
