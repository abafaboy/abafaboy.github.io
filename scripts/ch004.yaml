    calm: none
    lines:
      - {who: nib, type: speech, side: c, text: "NOT THAT."}
      - {who: "offpanel:chae", type: speech, side: r, text: "FIVE MORE. I'LL SEND YOU ALL SIX."}
    notes: "Beat line, verbatim. Chae will send the six recordings to Taeo's phone."

  - id: P47
    shape: wide
    gap: long
    bg: white
    camera: "medium wide, from beside the waiting bench, everyone getting ready to leave"
    art: >
      A little later. Chae, back at her desk, types one last line (her monitors facing her, their backs to us). Taeo is on his feet, the olive backpack on one shoulder,
