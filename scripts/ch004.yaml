    calm: right
    lines:
      - {who: taeo, type: speech, side: l, text: "THERE MUST BE SOMETHING WE CAN LOOK FOR."}
      - {who: "offpanel:nib", type: speech, side: r, text: "MY WATCH POST."}

  - id: P39
    shape: wide
    gap: short
    bg: white
    camera: "over Nib's left shoulder, down onto the paper on the floor"
    art: >
