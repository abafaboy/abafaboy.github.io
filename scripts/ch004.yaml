chapter: 4
title: Something There
when: "Wednesday 15 March, early spring (the day after chapter 1). Ability Assessment Office, Mapo branch: the assessment room from 11:34 AM (the flag) and 11:38 AM (the filing) to about 12:50 PM; the lobby from 12:52 PM to about 12:58 PM."
story_beats: PART_ONE_BEATS.md#4
cast:
  taeo: outdoor     # navy zip jacket over the black hoodie, black cargo trousers, black low sneakers with one white stripe. Olive backpack (faded orange patch) at his feet by the east visitor chair, then on one shoulder from P47. Sensor fob on his LEFT wrist P17–P36, so his RIGHT palm stays bare (the link pulse is always in his RIGHT palm). From P50 he holds Pyo's cold coffee in his LEFT hand; his phone in his RIGHT from P56
  nib: default      # barefoot; V-notch LEFT ear, lower fang LEFT; pouch RIGHT hip, brown wooden sheath LEFT hip. Sensor fob on his LEFT wrist P17–P36 (strap far too big); presses with his RIGHT hand. From P47 the folded drawing and Chae's pencil stub are in his pouch
  chae: default     # Chae Yuri: chin-length brown bob, navy cardigan over a white collared shirt, black trousers, low heels, blank ID card on a lanyard, tablet in a blue cover. Cardigan sleeves pushed up from P04
  dr_pyo: default   # first meeting (ch3's hook showed him through the glass): about 50, neat grey suit, white shirt, no tie, thin rimless glasses, greying hair combed back; the blank institute lanyard worn openly with a plain visitor's pass (an official visit). Two paper coffee cups in plain kraft sleeves
extras:
  receptionist: "the AAO receptionist from ch3: glasses, ponytail, light-blue shirt, lanyard; behind the lobby counter, background only"
  lobby_people: "three people waiting on the linked seats with paper number tickets: a tired mother and her teenage son in a school uniform, and an old man in a flat cap with a folder on his knees; background only, nobody stares"
locations: [aao_office, aao_lobby]
location_notes:
  aao_office: "world/keys/aao_office (key_wide.jpg, key_reverse.jpg, notes.md). Follow the key: a 5 × 7 m room. SOUTH wall: a floor-to-ceiling glass partition onto the corridor, with a glass door (long vertical bar handle and a small thumb-turn lock) at the SOUTH-EAST corner and a blank green exit plaque above it. No blind on the corridor glass. EAST wall: one broad daylight window with horizontal blinds. WEST wall: tall filing shelves of binders (north part) and a three-seat navy waiting bench in the south-west alcove. Chae's pale-grey desk sits in the northern half; her rolling chair is on its north side, so she faces the corridor glass over her visitors' heads. On the desk: two dark monitors facing her, a keyboard, plain files, a small flat silver hand plate (visitor-right), a tray holding two black sensor wrist fobs, and a desk phone (added here). Two navy visitor armchairs on the south side face her: Taeo sits in the EAST one; Nib stands beside the WEST one. Behind Chae: a blank framed board and a low cabinet with binders and a plant. Open floor between the visitor chairs and the glass. The corridor beyond the glass: pale walls, grey floor, a plant at the far end, leading to the lobby."
  aao_lobby: "No key yet: the public ground-floor lobby from ch3 (KNN 24 on the TV; Nib went round its revolving door twice). A glass front onto the street with a revolving door and a side swing door; a reception counter with a blank number display and a ticket machine; rows of linked blue-grey seats facing the counter; a wall TV mounted high on the side wall; a potted ficus; green exit signs; the corridor to the assessment rooms opens at the back. Daylight through the glass front, blue-white ceiling light inside."
palette_notes: "Assessment room (ART_BIBLE A4 and the aao_office key): clean blue-white key #DCE6EB, light slate shadows #A9B7C4, pale-grey desk, navy chairs and bench #40536A, blank green exit plaque; daylight from the east window lies across the floor in hard-edged shapes; accent: Chae's navy cardigan. The only red in the chapter is the plain red flag shape on Chae's monitor in P01 (grit accent: a warning). The link amber #F2A93B appears only in Taeo's palm (P22, fading in P23) and in Nib's eyes: nowhere else, not on any prop. The survey recording (P45) is the one saturated image: muted footage under a wrong-coloured pale lavender sky. Lobby: the same blue-white, warmed by daylight through the glass front; the kraft-brown coffee sleeves are the only warm note. No operator-interface windows in this chapter: the interface stays dark until ch19."

panels:

  # ---------------- COLD OPEN: the flag ----------------
  - id: P01
    shape: wide
    gap: none
    bg: white
    camera: "over Chae's right shoulder from behind her desk chair, looking south toward the corridor glass (the key's reverse view)"
    art: >
      The assessment room (aao_office key, reverse view), late morning, blue-white ceiling light and daylight from the east window at the left.
      In the right foreground, cut by the frame: Chae's navy cardigan shoulder and the back of her chin-length brown bob (chae, default).
      In front of her stand her two monitors; the nearer one is a plain flashing red rectangle with one white bar across it (plain shapes, no text): the only red in the panel.
      Beyond the desk, Taeo (taeo, outdoor: navy zip jacket over the black hoodie, messy near-black hair) sits in the east visitor chair, and Nib (nib, default:
      V-notch in the top of his LEFT ear, brown rope belt, leather pouch RIGHT hip, brown wooden sheath LEFT hip, barefoot; 105 cm) stands beside the west chair.
      Both have turned to look back over their shoulders at the glass wall. Taeo's olive backpack, faded orange patch showing, sits at his feet.
      Beyond them, through the glass partition, in the corridor: Dr. Pyo (dr_pyo, default: about 50, neat grey suit, white shirt, no tie, thin rimless glasses,
      greying hair combed back, blank lanyard) stands smiling with a paper coffee cup in each hand.
      ACTING: Taeo uneasy and polite even now; Nib very still, one hand drifting to his knife hilt; Pyo warm and delighted, his eyes on Nib.
      Palette: blue-white and light slate, the red monitor the one hot note. Drawn background, simplified. No text.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "ABILITY ASSESSMENT OFFICE · MAPO BRANCH · 11:34 AM"}
      - {who: taeo, type: speech, side: l, text: "WHO'S THAT?"}
      - {who: chae, type: speech, side: r, text: "KANGHAN INSTITUTE."}
      - {who: chae, type: speech, side: r, text: "THEY STUDY WHAT WE CAN'T FILE."}
    notes: "Picks up ch3's hook: the red ANOMALOUS ENTITY flag (NOTIFY KANGHAN INSTITUTE, STATE CONTRACT) on Chae's monitor, and the grey-suited man with two coffees already in the corridor. The flag is a plain red shape here; ch3 showed its words. Keep the three layers: red monitor, Taeo and Nib turned round, Pyo behind the glass."

  - id: P02
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up on the glass door's lock, side-on, Pyo's face beyond the glass"
    art: >
      Extreme close-up: Chae's hand (navy cardigan cuff, short unpainted nails) turns the small thumb-turn lock under the long bar handle of the glass door.
      A hand's width away on the other side of the glass, a shade paler behind it but drawn with the same clean lines (no blur): Pyo's smiling face and rimless glasses, a coffee cup at his chest.
      One pale hard-edged reflection band across the glass. Keep the hand and the lock in the middle third. No text.
    calm: right
    lines:
      - {who: chae, type: speech, side: l, text: "THE FLAG WENT OUT TEN SECONDS AGO."}
      - {who: chae, type: speech, side: l, text: "HE WAS ALREADY HERE."}
    sfx:
      - {text: "KLIK", style: impact, at: [0.36, 0.55], size: M, rot: -6}
    notes: "Pyo arrived before the flag: Kanghan knew before the office told it. Nobody explains how. In the lobby (P50) his only answer is 'I WAS EARLY'. The key has no blind on the corridor glass, so Chae locks the door instead."

  - id: P03
    shape: inset-r
    gap: short
    bg: white
    silent: true
    camera: "medium close-up through the glass partition, from Taeo's seated eye line"
    art: >
      Through the glass: Dr. Pyo (dr_pyo, default), not in the least offended, lifts one paper coffee cup a few centimetres in a small friendly toast,
      then points two fingers of the same hand down the corridor toward the lobby: I'll wait. His smile is warm and patient; behind the rimless lenses
      his eyes stay on Nib, bright with curiosity. The corridor behind him is plain: pale walls, grey floor, a plant at the far end. No text.
    calm: none
    notes: "Pyo is patient: he waits 78 minutes. The two coffees are his own and Taeo's; none is for Nib (P51)."

  - id: P04
    shape: wide
    gap: short
    bg: white
    camera: "medium, from the visitors' side of the desk, slightly low, Chae facing us"
    art: >
      Chae (chae, default) drops back into her rolling chair and pushes her navy cardigan sleeves up to the elbows, both hands already going to the keyboard:
      calm, fast, decided, a small crease of concentration between her brows. Her blank ID card swings on its lanyard. Her monitors face her, so we see only their dark backs.
      Behind her, the blank framed board and the low cabinet with binders and a plant; the east window's blinds at the right edge.
      In the left foreground, the back of Taeo's head and his navy shoulder; the top of Nib's spiky head beside him. Blue-white light. No text.
    calm: top
    intro: "CHAE YURI · ASSESSOR · ABILITY ASSESSMENT OFFICE"
    lines:
      - {who: chae, type: speech, side: c, text: "GIVE ME FOUR MINUTES."}
      - {who: taeo, type: speech, side: l, text: "FOR WHAT?"}
      - {who: chae, type: speech, side: c, text: "A THIRD BOX."}
    notes: "Callback to ch3's 'I'M NOT A BOX.' Name caption: ch003.yaml did not exist when this was written, so Chae gets her intro here. If ch3 already gives her one, delete this intro."

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 4 · SOMETHING THERE"

  # ---------------- THE THIRD BOX ----------------
  - id: P06
    shape: full
    gap: long
    bg: white
    camera: "establishing, the key's wide view: from just inside the glass door in the south-east corner, slightly high, looking north-west"
    art: >
      The whole assessment room (aao_office key, wide view): the navy waiting bench in the left foreground against the west wall, the tall filing shelves of binders beyond it,
      the pale-grey desk in the northern half with its two monitors and the tray of sensor fobs, the east window at the right throwing hard-edged daylight shapes across the floor tiles.
      Chae types fast at the desk, leaning in. Taeo (taeo, outdoor) sits in the east visitor chair with his back to us, hands clasped between his knees, the backpack at his feet.
      Nib (nib, default) stands beside the west chair facing our way, arms folded, watching the glass door and the corridor behind us, not the screen.
      Clean blue-white light, light slate shadows, navy chairs. A detailed, drawn establishing shot with simplified shapes. No text.
    calm: top
    lines:
      - {who: chae, type: speech, side: r, text: "THE FORM HAS TWO BOXES. THE LAW BEHIND IT HAS THREE."}
      - {who: chae, type: speech, side: r, text: "THEY TOOK ONE OFF THE FORM. NOBODY TOOK IT OUT OF THE LAW."}
    sfx:
      - {text: "TAK TAK TAK", style: quiet, at: [0.58, 0.40], size: S, rot: -6}
    notes: "Beat: Chae finds a third box. Lock the room for the chapter: corridor glass and locked door behind the visitors (south), desk and Chae north, filing shelves west, window east."

  - id: P07
    shape: wide
    gap: short
    bg: white
    camera: "straight on to Chae's nearer monitor, her fingers at the bottom edge"
    art: >
      Chae's nearer monitor seen square-on (screen: green, filling most of the frame) inside a thin dark bezel. Along the bottom edge, her fingers on the pale keyboard,
      one finger lifted. A sliver of the blue-white room around the bezel. No text.
    calm: top
    ui:
      - {kind: phone.info_card, on: screen, title: "AAO REGISTRY · CLASSIFY: 'NIB'", text: "1   CONSTRUCT — registered equipment · 2   AWAKENED PERSON · 3   ARRIVAL — status pending (1995 Act, legacy code)"}
    lines:
      - {who: "offpanel:chae", type: speech, side: r, text: "1995. NOBODY'S USED IT IN TWENTY YEARS."}
      - {who: "offpanel:taeo", type: speech, side: l, text: "...WHAT'S AN ARRIVAL?"}
    notes: "Beat: from a 1995 law, unused for twenty years. ch6 (P17) quotes 'twenty years': keep the figure. Do not tie 1995 to the Long Night on the page."

  - id: P08
    shape: wide
    gap: short
    bg: white
    camera: "medium two-shot at Nib's eye level, from the west end of the desk"
    art: >
      Chae has rolled her chair out round the end of the desk so there is nothing between her and Nib, and sits low, at his eye level, hands loose in her lap:
      she is talking to him, not about him. Nib looks back at her, guarded but listening, ears lifted. In the visitor chair beside him, Taeo leans in with one hand
      half raised, about to answer for Nib. Blue-white light, the filing shelves simplified behind. No text.
    calm: top
    lines:
      - {who: chae, type: speech, side: r, text: "SOMEONE WHO CAME THROUGH. THE LAW NEVER SAYS FROM WHERE."}
      - {who: taeo, type: speech, side: l, text: "THEN THAT'S HIM. HE'S—"}
      - {who: chae, type: speech, side: r, text: "I'M ASKING HIM."}
    notes: "Taeo's flaw (STORY_BIBLE §6: he speaks over people and decides for them), caught by Chae. 'Came through' is all the law says; the reader can wonder who it was written for."

  - id: P09
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up on Nib, frontal, at his own eye height"
    art: >
      Nib close: the narrow, weathered adult face, amber eyes, the V-notch in his LEFT ear. He looks past Chae at the monitor and makes up his mind: one small, hard nod.
      ACTING: wary, then decided; not grateful, not soft. Plain pale-slate background. No text.
    calm: right
    lines:
      - {who: "offpanel:taeo", type: whisper, side: r, text: "...SORRY."}
      - {who: "offpanel:chae", type: speech, side: r, text: "IT DOESN'T SAY WHAT YOU ARE. ONLY THAT YOU'RE HERE."}
      - {who: nib, type: speech, side: l, text: "...THAT ONE."}
    notes: "Nib chooses his own category: the filing is his choice as well as Chae's."

  - id: P10
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up of Chae's finger on the Enter key"
    art: >
      Extreme close-up: Chae's forefinger strikes the Enter key of the pale keyboard, the key pressed deep, short impact lines round the fingertip.
      Her navy cuff at the frame edge. Keep finger and key in the middle third. The keys are blank. No text.
    calm: none
    sfx:
      - {text: "CLACK", style: impact, at: [0.70, 0.40], size: L, rot: -8}

  - id: P11
    shape: wide
    gap: short
    bg: white
    camera: "high angle from behind and above Chae's chair, down onto her monitor"
    art: >
      From above and behind Chae's chair: her monitor in the lower half of the frame (screen: green), her hand still resting by the keyboard.
      Taeo has come round the end of the desk to her shoulder and leans in to see, one hand on the desk edge, eyes wide. Nib's spiky head and notched LEFT ear
      just clear the desk edge beside him; he is looking too. Blue-white light, hard slate shadows. No text.
    calm: top
    ui:
      - {kind: phone.info_card, on: screen, title: "AAO REGISTRY · FILED 11:38", text: "NIB · ARRIVAL — STATUS PENDING · Protected from seizure: 30 days · Classification review: to be scheduled · 72-hour notice: cleared"}
    lines:
      - {who: taeo, type: speech, side: l, text: "WHAT DID YOU JUST DO?"}
      - {who: chae, type: speech, side: r, text: "BOUGHT HIM THIRTY DAYS."}
    notes: "Beat: she files it. Filed at 11:38, four minutes after the flag: she kept her word. The ch2 72-hour registration notice is cleared; the new clock is 30 days of protection from seizure until a classification review. The review date is set later (ch6: on Thursday Pyo already knows it is 23 days away, inside the 30)."

  - id: P12
    shape: wide
    gap: short
    bg: white
    camera: "medium three-shot, eye level, from beside the filing shelves"
    art: >
      Chae leans back in her chair and lets out a breath, a pen turning in her fingers. Taeo stands by the desk end, relieved and lost.
      Nib stands in front of the desk with his arms folded and his chin up. ACTING: Chae tired and steady; Taeo stunned; Nib proud, and annoyed at being explained.
      Blue-white light, daylight from the east window behind them; simplified background. No text.
    calm: top
    lines:
      - {who: chae, type: speech, side: r, text: "NOBODY CAN SEIZE HIM UNTIL A REVIEW DECIDES WHAT HE IS."}
      - {who: nib, type: speech, side: l, text: "I KNOW WHAT I AM."}
      - {who: chae, type: speech, side: r, text: "I KNOW. NOW THREE STRANGERS HAVE TO AGREE."}
    notes: "Three strangers: the GMA panel of three at ch9."

  - id: P13
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up on Chae, three-quarter, slightly low"
    art: >
      Chae close: she glances at the desk phone with dry resignation, then back up with the tiny smile she gets when something interests her.
      Her blank ID card on its lanyard. Plain pale-blue background. No text.
    calm: left
    lines:
      - {who: chae, type: speech, side: r, text: "MY SUPERVISOR WILL ASK WHY."}
      - {who: "offpanel:taeo", type: speech, side: l, text: "WHAT WILL YOU SAY?"}
      - {who: chae, type: speech, side: r, text: "THAT I CAN READ."}
    notes: "Laugh. Plants Chae's career risk (ch9: her boss stares at her through the hearing). The desk phone pays it off in P48."

  - id: P14
    shape: full
    gap: short
    bg: white
    camera: "low angle from Nib's eye height (about 95 cm), looking up at Chae and Taeo"
    art: >
      From Nib's height the two of them loom: Chae has turned her chair to Taeo and leans forward, forearms on her knees, the smile gone: plain, serious, protective.
      Taeo stands over her by the desk end, looking down, his face going still. Behind and above them, the flat ceiling light panels. Neither looks at the camera,
      which is where Nib stands. Blue-white light, hard slate shadows. No text.
    calm: top
    lines:
      - {who: chae, type: speech, side: r, text: "IF THEY FILE HIM AS A CONSTRUCT, HE'S YOUR PROPERTY."}
      - {who: chae, type: speech, side: r, text: "AND PROPERTY CAN BE SOLD."}
      - {who: taeo, type: float, text: "I'D NEVER OWNED ANYTHING ANYONE WANTED."}
    notes: "Beat lines, verbatim. Shot from Nib's eye line: he is being discussed over his head. Sets up ch5's hook ('HOW MUCH AM I?' ... 'THEN SELL.'). Taeo's float is the first flicker of the temptation the lobby tests."

  - id: P15
    shape: narrow-r
    gap: short
    bg: white
    silent: true
    camera: "full figure of Nib, side view"
    art: >
      Nib (nib, full locks: V-notch LEFT ear, small lower fang on the LEFT, brown rope belt, pouch RIGHT hip, brown wooden sheath LEFT hip, barefoot) stands very straight,
      arms still folded, and turns only his head to look up at Taeo, who is out of frame above. ACTING: flat and hard, filing the word 'sold' away.
      Adult and wiry, a soldier's stillness; never cute. Plain pale wall. No text.
    calm: none

  # ---------------- THE CONNECTION TEST ----------------
  - id: P16
    shape: wide
    gap: long
    bg: white
    camera: "medium, from the east window side, across the desk"
    art: >
      Chae, standing at her desk, lifts the two sensor fobs out of their tray: small black rounded fobs the size of a matchbox, each on a black elastic wrist strap,
      wireless, no lights. She holds them up, one in each hand, matter-of-fact. Taeo and Nib wait across the desk, Taeo wary, Nib suspicious of anything that straps on.
      Daylight from the window behind the camera lies across the desk. No text.
    calm: top
    lines:
      - {who: chae, type: speech, side: r, text: "THE REVIEW WILL WANT EVIDENCE. LET'S GET SOME."}
      - {who: chae, type: speech, side: r, text: "THESE ONLY MEASURE. THEY DON'T DO ANYTHING TO YOU."}
    notes: "Beat: the connection test, sensor fobs on both wrists. Lock: Taeo wears his on the LEFT wrist (his RIGHT hand stays bare and empty: the link pulse is always in his RIGHT palm); Nib wears his on the LEFT wrist (his RIGHT hand does the pressing)."

  - id: P17
    shape: inset-l
    gap: short
    bg: white
    camera: "medium close-up two-shot at Nib's height"
    art: >
      Nib holds his fob up between finger and thumb, studying it with open distrust, then levels a flat look at Taeo. Taeo, sheepish, is already buckling his own fob
      onto his LEFT wrist, a big sweat drop at his temple. Plain pale background. No text.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "YOU FIRST."}
      - {who: taeo, type: speech, side: r, text: "...RIGHT. SORRY."}
    notes: "Runner 'YOU FIRST.' (ch2): whoever offers goes first, to prove it's safe. Deliberately not used on Pyo here: ch6 owns the juice."

  - id: P18
    shape: wide
    gap: short
    bg: white
    camera: "side view at waist height on the open floor, the desk beyond"
    art: >
      Side view: Taeo and Nib stand about two metres apart on the open floor between the visitor chairs and the glass wall, facing each other.
      Taeo's fob is on his LEFT wrist, his RIGHT hand empty at his side. Nib's fob is on his LEFT wrist on a strap far too big for him, the loose end dangling.
      Beyond them Chae sits at the desk watching her monitor, which faces her, so we see only its dark back.
      Blue-white light, daylight shapes on the floor. No text.
    calm: top
    lines:
      - {who: chae, type: speech, side: r, text: "TAEO, LOOK AT HIM. DON'T TRY TO GIVE HIM AN ORDER."}
      - {who: taeo, type: speech, side: l, text: "I DON'T GIVE ORDERS."}
      - {who: nib, type: speech, side: r, text: "YOU SAID 'STAY.'"}
    notes: "Callback to ch1 ('S-STAY.') and ch2 ('I'M NOT THAT ONE.')."

  - id: P19
    shape: inset-r
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag (2.5 heads) on a flat pale-blue background with radiating speed lines. Chibi Taeo stares at chibi Nib with ridiculous effort: bulging eyes,
      gritted teeth, a throbbing vein, his whole body quivering, steam puffing from his ears, the fob on his LEFT wrist. Chibi Nib (ear notch, rope belt, pouch,
      sheath and bare feet all intact) leans back away from him with a dot-eyed deadpan stare. No text.
    calm: top
    lines:
      - {who: nib, type: speech, side: r, text: "DO YOU HAVE TO DO THAT?"}
      - {who: taeo, type: speech, side: l, text: "DO WHAT?"}
    notes: "Chibi sheets: taeo, nib."

  - id: P20
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up on Chae at her desk, profile"
    art: >
      Chae in profile at her desk, eyes on her monitor (seen edge-on), one hand raised palm-down without looking up: settle.
      ACTING: patient and dry; she has calmed a hundred nervous new summoners. Plain pale-blue background. No text.
    calm: right
    lines:
      - {who: chae, type: speech, side: l, text: "BREATHE."}
      - {who: chae, type: speech, side: l, text: "YOU'RE LOOKING FOR A FEELING, NOT TRYING TO MAKE SOMETHING HAPPEN."}
    notes: "Beat line, verbatim. A normal first exercise for new summoners; Chae does not know what Taeo's link will do."

  - id: P21
    shape: wide
    gap: short
    bg: white
    silent: true
    camera: "three-quarter, over Taeo's left shoulder toward Nib"
    art: >
      Over Taeo's RIGHT shoulder: he lets out a long breath, his shoulders drop and his empty RIGHT hand opens loosely at his side.
      Facing him, Nib has lost interest in the staring and fusses with his oversized strap: he traps the dangling loose end against the fob with his RIGHT thumb
      and presses it flat. An ordinary thumb, ordinary pressure: no light, no effect. Blue-white light, plain background. No text.
    calm: none
    notes: "The accidental discovery: Nib's thumb presses here; Taeo's empty palm feels it in P22."

  - id: P22
    shape: bleed
    gap: short
    bg: white
    camera: "front, at chest height, Taeo's raised right palm in the foreground and his face above it"
    art: >
      THE FIRST AMBER PULSE. Taeo holds his RIGHT hand up in front of his chest, palm up and tilted toward us (thumb toward frame left), and stares down at it.
      In the centre of the palm: a small hard-edged ring of amber light (#F2A93B) under the skin, the size of a pressing thumb, with three short crisp pulse lines around it.
      It is the only saturated colour in the panel. Above it, Taeo's face, lit faintly amber from below: eyes huge, pupils small, mouth falling open, a bead of sweat (BIG REACTION).
      The background drops to flat pale slate with focus lines. The palm's lower edge breaks the frame toward the reader. Flat cel colour; no bloom, no haze, no particles. No text.
    calm: top
    lines:
      - {who: taeo, type: intense, side: c, text: "...WAIT."}
      - {who: taeo, type: float, text: "IT WASN'T MINE."}
    notes: "First appearance of the amber pulse motif (STORY_BIBLE §7: ch4). The amber shows the reader what Taeo feels; nobody else sees a light and nobody in the room reacts to one. Power: the link begins."

  - id: P23
    shape: wide
    gap: short
    bg: white
    camera: "medium two-shot, slightly high, Chae swivelling in from the right"
    art: >
      Taeo presses the centre of his RIGHT palm with his left forefinger, testing the spot. Nib has frozen with his thumb still on the strap, eyes narrowed on Taeo's hand.
      Chae swivels her chair toward them, alert, pen up. The amber in Taeo's palm has faded to a faint, small amber spot. Blue-white light. No text.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "THERE'S SOMETHING THERE."}
      - {who: chae, type: speech, side: r, text: "WHAT DOES IT FEEL LIKE?"}
      - {who: taeo, type: speech, side: l, text: "LIKE SOMEONE PRESSING IT."}
    notes: "Beat line, verbatim. Title drop."

  - id: P24
    shape: wide
    gap: short
    bg: white
    camera: "over Nib's left shoulder toward the monitor Chae has turned round"
    art: >
      Chae has swivelled one monitor round on its stand to face them. Its screen shows two thin dark-blue lines on a pale ground, one above the other,
