    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "WHAT WHITE BIT?"}
      - {who: nib, type: speech, side: r, text: "THE WHITE BIT."}
    notes: "Chibi sheets: taeo, nib, chae (if chae has none yet, keep her as a tiny silhouette with the bob and the tablet)."

  - id: P42
    shape: wide
    gap: short
    bg: white
    camera: "low side view at floor level across the paper"
    art: >
      Taeo has crouched on the far side of the paper, careful to keep his shadow off it. Nib holds his RIGHT hand out flat, palm down, at the height of his own chest:
      the height of the wall. Taeo looks from Nib's hand to the tiny tick-mark on the drawing, and the drawing starts to become a place to him.
