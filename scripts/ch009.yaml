chapter: 9
title: Someone's Relief
when: "Sunday 19 March, evening: the coach home from Haeseong, straight after ch 8's hook. Then a montage of the next twenty days: Mon 20 Mar (job 2), Mon 27 Mar 11:40 PM (break room), Sun 2 Apr 7:58 AM (the unit's first night done; Taeo's weekend day shift), Fri 7 Apr 11:50 PM (home). Review day is Saturday 8 April, 23 days after ch 6 (Thu 16 Mar): arrival 9:31 AM, hearing 10:00 AM, recess, ruling 4:10 PM, ID photo about 4:30 PM, the lobby about 4:50 PM, the front steps about 5:00 PM (sunset is about 7 PM). The only lettered weekdays are P10's tag and P14's TTOK date."
story_beats: PART_ONE_BEATS.md#9
cast:
  taeo: outdoor     # P01–P04 outdoor (navy zip jacket over the black hoodie, backpack on his knees). P06 outdoor. P07, P12 default (hoodie, at home). P08–P11 work (Hanbit Mart vest over the hoodie). P13–P63 outdoor, the jacket zipped to the chin
  nib: default      # barefoot; pouch RIGHT hip with the small dinosaur sticker Haru gave him in ch 8 (match ch008's design); brown wooden sheath LEFT hip. The knife goes into a security tray in P15 and comes back in P53: the sheath is EMPTY from P16 to P52
  grandpa: default  # P01 only, small, at the Haeseong bus stop beside his cardboard hand cart
  eunchae: work     # P08–P09; TTOK only in P14
  minho: default    # grey streak at the LEFT temple; radio clipped high on his LEFT chest
  chae: default     # navy cardigan, lanyard, the blue-covered work tablet
  dr_pyo: default   # CHARACTER_BRIEF_2 #2: about 50, neat grey suit, white shirt, no tie, thin rimless glasses, greying hair combed back; the blank institute lanyard worn OUTSIDE his jacket today
  courier: default  # Bae Jungho: navy QuickHaul cap and jacket with the reflective stripe, wrist phone
  golem: default    # P29 (chibi) and P43, only as a stone face pressed to the hearing-room door window
extras:
  crew: "two Ryu Survey crew members: a stocky man in his forties and a young woman, both in red-orange safety vests over work clothes, hard hats clipped to their belts (as ch 7)"
  stocker: "the construct stocker from ch 5: a sleek, pale, faceless mannequin construct about 180 cm tall with smooth jointed limbs, in a grey-green Hanbit Mart cap; identical, perfect motions (match ch005's design)"
  guard: "GMA lobby security guard: a broad man in his fifties, navy security uniform with a radio on the shoulder, reading glasses pushed up on his head; tired and decent"
  aao_chief: "the AAO Mapo branch chief, Chae's boss and old mentor (unnamed; the friendship breaks at ch 92): a man of about 58, thinning grey hair combed neatly, reading glasses pushed up on his forehead, a grey cardigan over a white shirt and a dark tie, the same lanyard as Chae; a kind, careful face that has survived thirty years of audits"
  panel_chair: "presiding member of the classification panel: a woman in her early sixties, short iron-grey bob, half-moon reading glasses on a thin chain, dark navy jacket over a grey blouse, GMA lanyard; dry, tired, fair"
  panel_tech: "technical member: a man in his mid-forties, black buzz cut greying at the sides, square dark-rimmed glasses, pale blue shirt with the sleeves rolled, GMA lanyard, a laptop; sceptical"
  panel_legal: "legal member: a woman in her mid-thirties, short black pixie cut, black blazer over a cream knit top, GMA lanyard, a fountain pen and a notepad; attentive (must not resemble Chae: no bob, no cardigan)"
  stenographer: "hearing stenographer: a middle-aged man in a grey sweater with headphones, typing at a small desk below the dais"
  clerk: "GMA registration clerk: a young man in his twenties, white shirt and GMA lanyard, earnest; works a compact camera on a tripod"
locations: [haeseong_port, haeseong_bus, ryu_practice_yard, taeo_flat, hanbit_mart_breakroom, hanbit_mart, hanbit_mart_stockroom, gma_building, gma_hearing_room]
location_notes:
  haeseong_port: "ch 8 designs it (LOCATION_BRIEF item 8). P01 only: the harbour bus stop, the sea road, the sea wall, the idle boats tied up, and the sea gate offshore in its ring of buoys. Follow ch008's layout and its departure light."
  haeseong_bus: "the 3-hour express coach to Seoul (the key LOCATIONS.md names; no entry yet): two-and-two seating, curtains tied back, reading lights off at night, the window a black mirror."
  ryu_practice_yard: "LOCATION_BRIEF key, as in ch 7: plywood screens on steel feet (rearranged into a new course), the scaffold observation platform, the equipment bench and the pallet stack."
  taeo_flat: "world/LOCATIONS.md and its floor plan: desk with the lamp and the framed photo on the south side, the bed by the east window, the folding table in the middle."
  hanbit_mart_breakroom: "world/LOCATIONS.md: lockers LEFT and the rota whiteboard RIGHT as seen from the door; the folding table and black stool against the middle locker; warm fluorescent cream."
  hanbit_mart: "world/LOCATIONS.md: two aisles, the door lined up with aisle 2, the noodle gondola with the red two-for-one tag on its promo end cap; morning sun through the south glass."
  hanbit_mart_stockroom: "world/LOCATIONS.md: racks, the manager's small desk, the steel back door, and the taped rectangle by it where the construct stocker stands between tasks."
  gma_building: "no key yet; decided here. The Gate Management Agency's Seoul office: an eight-storey grey stone-and-glass block above a broad plaza; about twelve wide granite steps up to a glass front with a revolving door between two glass side doors; three flagpoles with plain colour-block flags; a blank stone name panel. Ground floor: a pale stone lobby; the security point (walk-through arch, X-ray belt, grey trays) just inside the doors; along the right wall the registration counter with a small photo corner (pale blue backdrop, a stool, a compact camera on a tripod). Lifts to the upstairs corridor. The GMA works weekends: gates don't keep office hours."
  gma_hearing_room: "no key yet; decided here (LOCATION_BRIEF item 9). About 12 × 9 m, off a long upstairs corridor (pale walls, padded benches, a tall window at its end). ONE door, in the back wall: single-leaf wood with a narrow wired-glass window and a small exit sign above it (running-figure pictogram, no letters). The dais runs across the front wall, raised 40 cm: a long pale-wood desk, three chairs, three blank nameplates, three gooseneck microphones, a water carafe; a blank pale emblem shape on the wall behind. The stenographer's small desk below the dais. LEFT wall (seen from the door): windows with vertical blinds facing west, and a pull-down projector screen at its front end. RIGHT wall: the presenting officer's desk, facing across the room. Mid-floor, facing the dais: the petitioner's table on the LEFT, the respondent's table on the RIGHT, and between them a tall witness lectern (top about 115 cm) with a gooseneck microphone. Two rows of gallery chairs between the tables and the door. Blue-grey upholstery, pale wood, white ceiling light panels; low sun bars through the blinds after 4 PM."
palette_notes: "Coach at dusk and night: slate-blue sea and sky with a thin pale-orange horizon band; the sea gate's violet-black core and cold white-cyan rim are the one saturated thing; inside, dark navy with the window a black mirror. Yard: A4 dusty ochre, warm brown shadows, sky blue, red-orange vests. Flat at night: A4 warm lamp orange on the desk side, deep blue-grey elsewhere. Break room: warm fluorescent cream. Shop floor at 7:58 AM: daylight cream at the front, fluorescent green-white behind, the red sale tag the only saturated note. Stockroom: fluorescent grey-green. GMA (not in A4; proposed): outside, pale grey stone and clear blue sky, cool morning light from the east, then low warm gold sun from the west after 4 PM; the hearing room and corridor in clean blue-white institutional light like the AAO, pale slate shadows, blue-grey upholstery, pale wood; the one accent is the dull green exit sign (never screen green). Memory vignettes P39–P40: A4 flashback (desaturated, cool, soft-edged) with one warm colour for the far figure. Amber #F2A93B appears only in Nib's eyes and in Taeo's palm in P42. Red appears only on the buoy lights (P04) and on Bae's LATE wrist screen (P31, P43). There are no operator-interface windows: the interface stays dark until ch 19."

panels:

  # ---------------- COLD OPEN: the coach home ----------------
  - id: P01
    shape: full
    gap: none
    bg: black
    camera: "establishing, high and wide from above the harbour road at dusk, the coach pulling away"
    art: >
      Haeseong at dusk (haeseong_port; match ch008's harbour road and bus stop). An express coach pulls away from the harbour bus stop along the sea road,
      its windows lit warm, small in the lower third of the frame. At the stop, tiny, Grandpa (grandpa, default: faded blue work cap, grey work jacket with many pockets)
      stands beside his cardboard hand cart and watches it go, one hand half raised and then lowered again.
      Beyond the sea wall the idle fishing boats sit tied up in a row, and offshore stands the sea gate: a tall black-violet slit standing in the water with a cold
      white-cyan rim, ringed by a loop of buoys. It is the one saturated thing in the panel.
      Palette: slate-blue sea and sky, a thin band of pale orange at the horizon, deep blue-grey shadows; the coach windows warm. Hard cel shading; a drawn sky gradient only.
      No text: the coach livery, the stop sign and any gate-zone board are blank shapes.
    calm: top-left
    lines:
      - {who: taeo, type: float, text: "GRANDPA SAYS \"IT'S FINE\" ABOUT EVERYTHING."}
      - {who: taeo, type: float, text: "NOT ABOUT THAT."}
    notes: "Picks up straight after ch 8's hook (Grandpa at the bus door: 'YOUR FATHER WENT IN FIRST TOO, YOU KNOW. ...DON'T YOU EVER.'). 'IT'S FINE' is Grandpa's runner (ch 8). Ledger P06 stays alive here without explanation; its payoff is ch 40 and 43. If ch008 sets the departure in daylight or puts the stop elsewhere, keep ch008's geography and light."

  - id: P02
    shape: wide
    gap: short
    bg: black
    camera: "inside the coach, from the seat in front, looking back over the headrest at the two of them"
    art: >
      Inside the express coach at night (haeseong_bus), reading lights off, the window a black mirror. On the LEFT of frame by the window, Taeo (taeo, outdoor: navy zip
      jacket over the black hoodie, the olive backpack with its faded orange shield-and-door patch on his knees) sits with his temple almost against the glass, staring out,
      jaw tight, eyes unfocused. On the RIGHT in the aisle seat, Nib (nib, default: V-notch in the top of the LEFT ear, brown rope belt, leather pouch on the RIGHT hip with
      Haru's small dinosaur sticker on it, brown wooden sheath on the LEFT hip, barefoot) sits on his heels on the seat because his feet don't reach the floor, a foil parcel
      of Grandma's leftover grilled fish on his knees. He faces forward, but his amber eyes have slid sideways to Taeo.
      Dark navy interior, one cold strip of aisle light on the floor; the only warm notes are Nib's eyes and a glint on the foil. No text.
    calm: top
    lines:
      - {who: nib, type: speech, side: r, text: "HE SAID SOMETHING. AT THE DOOR."}
      - {who: taeo, type: speech, side: l, text: "IT WAS NOTHING."}
    notes: "Taeo's 'IT WAS NOTHING' is his own 'IT'S FINE'. Grandma feeds everyone (runner); drop the foil parcel if ch008's bus-door panels show Nib empty-handed. Seat sides (Taeo window LEFT, Nib aisle RIGHT) hold for P03–P04."

  - id: P03
    shape: strip
    gap: short
    bg: black
    silent: true
    camera: "extreme close-up, side-on, on Nib's left ear"
    art: >
      Extreme close-up on Nib's long LEFT ear with its clear V-notch in the top edge, in the dark of the coach. The ear has swivelled a few degrees toward Taeo, and at the
      frame edge the corner of one amber eye, half-lidded, has turned the same way: he heard it at the door, and he lets the lie stand. A cold sliver of passing streetlight
      across the ear. Deep navy. Keep the ear in the middle third. No text.
    calm: none
    notes: "Nib heard Grandpa. It pays off in the hook ('I DIDN'T ASK YOU TO.'). Do not explain it."

  - id: P04
    shape: inset-r
    gap: short
    bg: black
    camera: "close, Taeo's reflection in the black coach window"
    art: >
      Taeo's face reflected faint and doubled in the black window; through the reflection, far out on the dark sea, the thin violet line of the sea gate and the three tiny
      red lights of its buoys sliding away behind the coach. His real profile at the frame edge, eyes on his reflection: tired, scared, holding it in.
      Deep blue-grey, one violet line, three red dots. No text.
    calm: left
    lines:
      - {who: taeo, type: float, text: "TWENTY DAYS UNTIL THEY DECIDE WHAT HE IS."}
    notes: "The clock, in ch 7 P01's words ('TWENTY-TWO DAYS UNTIL THEY DECIDE WHAT HE IS.'). Sunday 19 March is twenty days before Saturday 8 April."

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 9 · SOMEONE'S RELIEF"

  # ---------------- MONTAGE: twenty days ----------------
  - id: P06
    shape: full
    gap: long
    bg: white
    camera: "high, from the observation platform over the yard, Minho's hand on the rail in the near corner"
    art: >
      Ryu Survey's west practice yard (ryu_practice_yard) in late-morning sun, the plywood screens rearranged into a new course. Deep in it, small, Nib (nib, default)
      crouches at the steel foot of the last screen, the radio at his mouth in his LEFT hand, pointing at the foot with his right: it is bent, and the screen above it leans
      a few degrees. Two crew members (extras.crew) wait at the course entrance with a flatbed trolley. In the near corner, from above, Minho's hand on the platform rail
      and the edge of his clipboard. Far back by the equipment bench, Taeo (taeo, outdoor) sits alone on the pallet stack with a canned coffee in both hands, leaning
      forward, watching. Dusty ochre ground, warm brown shadows, sky-blue sky, red-orange vests. No text.
    calm: top-right
    lines:
      - {who: narr, type: tag, text: "RYU SURVEY YARD · 19 DAYS"}
      - {who: nib, type: speech, side: l, text: "LAST SCREEN. THE FOOT'S BENT. IT'LL TIP."}
      - {who: taeo, type: float, text: "I GOT VERY GOOD AT WATCHING."}
    notes: "Beat: the montage's spotter jobs. This is job 2 of nine (ch 7's was job 1). Monday 20 March. Same pallet stack as ch 7 P30. Nib's radio stays in his LEFT hand (ch 7)."

  - id: P07
    shape: inset-l
    gap: short
    bg: white
    silent: true
    camera: "top-down on the folding table, lamp light"
    art: >
      Taeo's flat at night (taeo_flat), top-down on the pale wooden folding table under the warm desk lamp. Nib's olive-green hand slides a small carbon-copy receipt
      (handwriting drawn as squiggles, no numerals) into a clear plastic document folder that already holds a short stack of them. Beside the folder: Eunchae's pencil,
      with the tiny three-line fork carved near its end, and Taeo's mug (plain white, one thin green band). Warm lamp orange, deep blue-grey at the edges. No text.
    calm: none
    notes: "The growing pile of receipts (beat). The folder is the clear one Taeo carried in ch 7 P03. Kett's mark on the pencil (ch 5): don't point it out."

  - id: P08
    shape: wide
    gap: long
    bg: white
    camera: "medium, side-on across the break-room table"
    art: >
      The Hanbit Mart break room at night (hanbit_mart_breakroom: lockers on the LEFT, the rota whiteboard on the RIGHT as seen from the door; warm fluorescent cream).
      Eunchae (eunchae, work: high ponytail, cream shirt with rolled sleeves, Hanbit Mart vest with name tag) sits on the black stool and holds up a white flashcard, blank
      (the letterer writes on it), with the patience of a teacher who has none left and a great deal of affection. Her dog-eared exam workbook lies open at her elbow,
      and beside it a second, rubber-banded pile of flashcards. Nib (nib, default) kneels up on an upturned green crate to reach the table, Eunchae's pencil in his fist,
      copying onto a sheet of squared practice paper: total concentration, his tongue against his one lower fang, ears forward. A half-eaten triangle kimbap on the table.
      Grey-brown shadows. The flashcards and the practice paper are blank. No text.
    calm: top
    ui:
      - {kind: label, text: "닙", at: [0.30, 0.38], size: 64, color: "#2B2523", rot: 0, notes: "Hangul for NIB in black marker on the card Eunchae holds up; move it onto the card once the art exists"}
    lines:
      - {who: narr, type: tag, text: "HANBIT MART · 11:40 PM · 12 DAYS"}
      - {who: eunchae, type: speech, side: l, text: "AGAIN. THIS ONE'S YOUR NAME."}
      - {who: nib, type: speech, side: r, text: "...NIB."}
    notes: "Beat: Eunchae teaches Nib Hangul with flashcards. Monday 27 March during Taeo's night shift (nights go to the unit only from the 1st); Nib waits in the break room as in ch 6. The rubber-banded pile is her food-licence exam cards (runner)."

  - id: P09
    shape: inset-r
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag (2.5 heads) on a flat cream background with screentone dots. Chibi Nib (ear notch, rope belt, pouch with the dinosaur sticker, sheath and bare feet all
      intact) holds a flashcard up in both hands with enormous pride, dot eyes, sparkles round the card: he has sounded out a hard one. Behind him chibi Eunchae face-palms
      with a big sweat drop and is already reaching to snatch it back: it came from her exam pile. The card is blank. No text.
    calm: left
    ui:
      - {kind: label, text: "교차오염", at: [0.36, 0.40], size: 46, color: "#2B2523", rot: -4, notes: "Korean for 'cross-contamination', one of her food-hygiene exam cards; move it onto the card"}
    lines:
      - {who: nib, type: speech, side: l, text: "CROSS... CONTAMINATION."}
      - {who: eunchae, type: speech, side: r, text: "...WRONG PILE."}
    notes: "Runner: Eunchae's exam flashcards at the worst moment (STORY_BIBLE §9). He can sound out Hangul he can't understand yet."

  - id: P10
    shape: full
    gap: long
    bg: white
    camera: "establishing, from just inside the glass door, looking down aisle 2"
    art: >
      Hanbit Mart's shop floor (hanbit_mart) at 7:58 on a Sunday morning: low sun through the south glass lays warm patches across the front strip; the aisles behind are
      still fluorescent. Far down aisle 2 the construct stocker (extras.stocker) squares the last packet on the noodle gondola with an identical, perfect motion and turns
      toward the stockroom door, its night done. In the near foreground Taeo (taeo, work: the Hanbit Mart vest over the black hoodie) has just come in through the door with
      Nib at his hip; Taeo lifts one hand to the stocker in a small automatic wave with a polite, tired half-smile. The stocker does not look round. Nib watches the stocker,
      not Taeo. The red two-for-one tag on the promo end cap is the one saturated note. Grey-green shadows. No text.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "SUNDAY · 7:58 AM · 6 DAYS"}
      - {who: taeo, type: float, text: "NIGHTS WENT TO THE UNIT. I GOT WEEKENDS."}
      - {who: taeo, type: speech, side: l, text: "MORNING."}
    sfx:
      - {text: "JINGLE", style: quiet, at: [0.10, 0.10], size: S, rot: 8}
    notes: "Beat: the construct stocker works nights; Taeo on weekends only. Sunday 2 April, the morning after the unit's first night (ch 5: 'FROM THE FIRST, NIGHTS GO TO THE UNIT'; ch 1: 'YOU'LL GET WEEKENDS. PROBABLY.')."

  - id: P11
    shape: wide
    gap: short
    bg: white
    camera: "low, from just inside the stockroom door, Nib in the near foreground"
    art: >
      The stockroom (hanbit_mart_stockroom). At the far end by the steel back door, the construct stocker stands perfectly still inside its taped rectangle on the floor,
      cap on, facing the wall, arms at its sides: off in all but name. In the near foreground, from low behind, Nib stands with his back to us, looking at it (LEFT ear
      notch, brown rope belt, pouch RIGHT, sheath LEFT, bare heels). Beside the door frame Taeo zips his vest, glancing down at Nib.
      Fluorescent grey-green; cartons on the racks as simple shapes. No text.
    calm: top
    lines:
      - {who: nib, type: speech, side: c, text: "WHO RELIEVES IT?"}
      - {who: taeo, type: speech, side: r, text: "NOBODY. IT DOESN'T GET TIRED."}
      - {who: nib, type: speech, side: c, text: "THEN NOBODY COMES FOR IT."}
    notes: "The quiet setup for P41 ('I'M SOMEONE'S RELIEF'): 'relieve' in the soldier's sense, to take over a watch. A watch nobody relieves belongs to a thing. Grandpa's ch 8 line ('SOMEBODY ALWAYS COMES TO TAKE OVER') sits underneath. Don't underline it."

  - id: P12
    shape: vignette
    gap: long
    bg: white
    camera: "medium, from the bed end of the flat toward the desk"
    art: >
      Taeo's flat (taeo_flat), the night before the review, desk lamp only. Taeo (taeo, default: black hoodie) sits hunched at the desk writing on a sheet of lined paper:
      dense handwriting drawn as squiggles, two lines struck out hard; a crumpled sheet by his elbow; the clear folder of receipts squared beside it. On the wall shelf
      above the desk, the framed family photo. On the floor with his back against the bed's drawers, Nib (nib, default) sits with his knees up and his forearms across them
      in his sentry pose, wide awake, watching Taeo's back. Warm lamp orange on the desk side, deep blue-grey on Nib's side. Edges fade into the white page. No text.
    calm: top-right
    lines:
      - {who: narr, type: tag, text: "11:50 PM · 1 DAY"}
      - {who: taeo, type: float, text: "I WROTE DOWN EVERYTHING I'D SAY FOR HIM."}
      - {who: nib, type: speech, side: r, text: "THEY'LL ASK ME."}
    notes: "Taeo's pen stops at Nib's line; he doesn't answer. Sets up P32–P34, where he folds these notes away unread. His control flaw (STORY_BIBLE §6): he plans to speak for Nib."

  # ---------------- REVIEW DAY ----------------
  - id: P13
    shape: full
    gap: long
    bg: white
    camera: "establishing, low across the plaza, morning"
    art: >
      The Gate Management Agency's Seoul office (gma_building, new; see location_notes): an eight-storey grey stone-and-glass block above a broad plaza, wide granite
      steps up to a glass front with a revolving door between two glass side doors, three flagpoles with plain colour-block flags, a blank stone name panel.
      Cool, clear spring morning light from the left, hard shadows. Climbing the steps, small in the lower middle: Taeo (taeo, outdoor: navy zip jacket zipped right up
      to the chin, hair water-combed flat with one tuft already springing back up at the crown, the olive backpack with its orange patch on one shoulder, the clear folder
      of receipts clutched to his chest with both arms) and, a step ahead of him, Nib (nib, default, barefoot on the granite), looking up at the building like a sentry
      sizing up a fort. Office workers cross the plaza. Pale grey stone, blue sky, the cool glass. No text.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "GATE MANAGEMENT AGENCY · 9:31 AM"}
    notes: "Review day, Saturday 8 April (23 days after ch 6's Thursday 16 March). Taeo should be on his Saturday shift: P14 explains."

  - id: P14
    shape: narrow-r
    gap: short
    bg: white
    camera: "kit phone hand, straight on"
    art: "KIT HAND"
    calm: none
    ui:
      - {kind: phone.ttok_chat, on: screen, hand: taeo_right_front, title: "Eunchae", clock: "09:32", date: "SAT 8 APR", messages: [{from: them, text: "I've got your shift. Manager says fine.", time: "07:10"}, {from: them, text: "Tell Nib not to rush his vowels.", time: "07:11"}, {from: me, text: "Thank you. Sorry.", time: "09:31"}, {from: them, text: "Stop saying sorry.", time: "09:32"}]}
    notes: "Why Taeo isn't at work on a weekend day. 'Don't rush his vowels' pays off at the ID card (P50). Taeo's sorry runner."

  - id: P15
    shape: wide
    gap: short
    bg: white
    camera: "medium, side-on at the security belt in the lobby"
    art: >
      The GMA lobby security point (gma_building): a walk-through arch, an X-ray belt, a pale stone floor. The guard (extras.guard) holds a grey plastic tray down at Nib's
      height. Nib has drawn his knife from the brown wooden sheath on his LEFT hip and lays it in the tray, but his fingers stay on the hilt a beat too long: his face flat,
      his ears slightly back. Behind him Taeo bows apologetically over his folder with a big sweat drop; his backpack is already riding into the X-ray.
      Cool daylight through the glass front, pale slate shadows. No text.
    calm: top
    lines:
      - {who: taeo, type: nervous, side: r, text: "SORRY. HE'S ATTACHED TO IT."}
      - {who: guard, type: speech, side: l, text: "YOU'LL GET IT BACK ON THE WAY OUT."}
      - {who: nib, type: speech, side: c, text: "IT'S A GOOD KNIFE. DON'T DROP IT."}
    notes: "Nib goes into the hearing unarmed: the sheath on his LEFT hip is EMPTY from P16 to P52, and the knife comes back in P53."

  - id: P16
    shape: wide
    gap: short
    bg: white
    camera: "long corridor at eye level, from behind Chae as she comes round the corner"
    art: >
      The long upstairs corridor (gma_hearing_room; see location_notes): pale walls, padded benches, a tall window at the far end, and on the right the hearing room's single
      wooden door with its narrow wired-glass window and a small exit sign above it (running-figure pictogram, no letters). Near the door, Dr. Pyo (dr_pyo: about 50, neat
      grey suit, thin rimless glasses, greying hair combed back, the blank institute lanyard outside his jacket) hands one of his two paper coffee cups to the AAO branch
      chief (extras.aao_chief), who takes it with the easy nod of an old acquaintance. Pyo has turned his head to greet Nib warmly as Nib walks straight past them without
      looking, eyes fixed on the hearing-room door, the empty sheath on his hip. Behind Nib, Taeo gives Pyo an awkward half-bow. In the near foreground, from behind, Chae
      (chae: chin-length brown bob, navy cardigan, lanyard, the blue-covered work tablet under her arm) has stopped at the corner, watching the coffee change hands.
      Cool white ceiling light. No text.
    calm: top-left
    lines:
      - {who: dr_pyo, type: speech, side: r, text: "GOOD MORNING, NIB."}
      - {who: taeo, type: nervous, side: r, text: "...M-MORNING."}
    notes: "Pyo's two coffees (ch 3 hook, ch 6): today one goes to Chae's boss. Kanghan holds a state contract (ch 3); the coffee says how well they know each other. Nib does not answer."

  - id: P17
    shape: wide
    gap: short
    bg: white
    camera: "two-shot in profile at the corridor window"
    art: >
