chapter: 78
title: The Shot
when: "Immediately after ch 77's gate-side hook. The final Chungju operation, from the safety check to the first minutes after the clear. No date is fixed."
story_beats: PART_ONE_BEATS.md#78
cast:
  taeo: outdoor # Navy zip jacket, black hoodie, black cargos, striped black sneakers. Outside throughout; mole under RIGHT eye.
  nib: default # Adult scout; his purchased ch 43 boots replace the early sheet's bare feet. All persistent props retained.
  orrin: default # Slate shell retains the repaired Sinjeong damage; scaffold-clamp rim brace fitted for the operation.
  sera: default # River-green tunic, cream sleeves, tan trousers, brown boots, braid, quiver and bone flute. Injured LEFT bow arm braced.
  kesh: default # Adult signal keeper; full first-panel description P08. No flying or force storage.
  haein: default # Beige shirt, blue-grey overalls, goggles, tool belt; outside at the recorder and reservoir controls.
  sejin: default # Green scrubs, olive medical rig, black cargos and field boots. Accompanies the firing party inside.
  minho: default # Brown jacket, grey shirt, olive cargos, knee pads, boots; LEFT grey streak, chest radio. Outside.
  river_predator: default # Long eel-like river boss; use its ch 69 design, throat/gill seam exposed during the surge.
locations: [chungju_gate_site, chungju_river_gate]
location_notes:
  chungju_gate_site: >
    No drawn key available at drafting. Continue ch 77's site: scaffold-framed door-height black-violet slit,
    cold white-violet rim, gravel apron, Ryu control trestle left, medical canopy right, clear return apron between.
    White survey cable with blue bands every metre crosses the lower-left frame; grey relay tripods every 50 m.
    Ordinary overcast daylight, cool grey gravel and muted safety orange. No permanent buildings invented.
  chungju_river_gate: >
    Continue ch 63-77 geography; no drawn key available. Underground river beneath a continuous low STONE CEILING:
    no sky. For this set piece the safe shelf is near bank, Orrin's bracing notch just downstream, the lure spur upstream.
    Sera's dry firing shelf is behind Orrin, clear of the water; a fixed padded bow cradle is bolted there.
    Three signal stations follow the existing loop, physically staggered, distinct from the straight white survey cable.
    Slate and violet shadows, violet mineral seam light and hard white work lamps. No new channel opens.
props:
  nib_locks: >
    105 cm weathered adult; LEFT ear V-notch, one LEFT lower fang, brown rope belt, RIGHT pouch with green dinosaur sticker,
    LEFT brown wooden sheath, cobalt pencil with carved three-line fork inside pouch, pale-blue ID and folded PAPER post drawing protected inside.
    Matte black 8x30 binoculars, hinge fork mark, woven strap knotted at LEFT neck. Boots are ch 43's matte dark-brown leather
    ankle boots: broad round toes, black low-heeled lug soles, four dull gunmetal eyelet pairs each, dark-brown round laces
    in small double knots, heel pull tabs, oat-grey socks inside collars. No hooks, buckles, logos, steel caps or red stitching.
  reservoir: >
    The finite bank-and-release apparatus prepared in ch 77, using Haein's repaired/rebuilt post-ch 60 hardware, not the broken original magically restored.
    Collector on Orrin's rim brace; bounded impact passes through Taeo's prepared channel into a one-shot mechanical bow cradle.
    The old 0.8-second usable bank limit still applies. Signal stones convey timing only, not stored water or force.
  bow_support: >
    Padded fixed cradle bears bow weight, draw force and recoil. Sera's braced LEFT bow hand aligns it; her RIGHT hand releases.
    Sejin steadies her elbow. This is one assisted shot, not regained full strength or medical clearance for ordinary combat.
palette_notes: >
  A4 adapted to the underground gate: violet stone shadows, hard white work lamps, no sky and no decorative haze.
  Exterior cool grey daylight. Interface cyan #3FE3F2 only on one status window; amber #F2A93B only Nib's eyes/link,
  slate-green only Orrin's link. No newly assigned Sera/Kesh link colours: their earlier established colours remain canon.
  Danger red is limited to the predator's wound and Taeo's nosebleed. Cel colour, warm near-black contours.
continuity_notes: >
  ch 77 was absent when drafting; its beats supply the exact opening handoff. The now-available ch 71 confirms the injured LEFT bow arm;
  support apparatus and fractional timing are batch staging decisions to reconcile with ch 77. Ch 43's boot design has been checked.
  The plan does not heal Sera, forgive Taeo by winning, or turn echoes into time travel.
  Five entrants in this operation: Nib, Orrin, Sera, Kesh, Sejin. Everyone else remains outside. No native person is found here.

