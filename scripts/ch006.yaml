chapter: 6
title: Not Mine to Sell
when: "Thursday 16 March, early spring (two days after chapter 1). 3:40 AM in the flat; 9:44 AM leaving home; 10:29 AM to about 11:10 AM at the café by Hapjeong Station; about 11:15 AM the side street; 11:40 AM the river path; 9:47 PM at Hanbit Mart."
story_beats: PART_ONE_BEATS.md#6
cast:
  taeo: outdoor     # P01–P04: default (black hoodie, lying dressed on top of the duvet). P06–P50: outdoor (navy zip jacket over the hoodie, olive backpack). P51–P55: work (Hanbit Mart vest over the hoodie)
  nib: default
  dr_pyo: default   # CHARACTER_BRIEF_2 #2: about 50, neat grey suit, thin rimless glasses, blank institute lanyard (tucked into his breast pocket here)
  courier: default  # Bae Jungho
  golem: default
  chae: default     # TTOK messages only (P52); not drawn
extras:
  doorman: "the tower's doorman: grey uniform jacket and cap, white gloves, an earpiece; middle-aged and unflappable"
  cafe_guests: "two office workers in shirtsleeves at a far table, laptops shut"
  stocker: "the construct stocker from ch5: a sleek, pale, faceless mannequin construct about 180 cm tall with smooth jointed limbs, in a grey-green Hanbit Mart cap; identical, perfect motions (match ch005's design)"
locations: [taeo_flat, pyo_cafe_ext, pyo_cafe, hapjeong_side_street, mangwon_riverside, hanbit_stockroom, hanbit_breakroom]
palette_notes: "Flat at night: lamp off; orange streetlight bars through the blind on deep blue-grey (A4 night). Flat in the morning: cool grey-blue daylight with one patch of yellow sun (A4 morning). Café (pyo_cafe, not in A4): cool white daylight from a window wall; cream, pale oak and grey stone; cool-grey shadows; the one accent is the pale lemon-yellow juice (never Nib's amber #F2A93B). Side street: warm grey pavement in flat daylight, blue-grey shadows; accent: the bright blue bottle crates. River path: pale blue-grey sky and river, a few lemon-yellow forsythia sprigs. Hanbit Mart at night: pale fluorescent green-white with grey-green shadows; the break room a little warmer. Amber #F2A93B appears only as Nib's eye colour and as the link light in P55."

panels:

  # ---------------- COLD OPEN: the same night ----------------
  - id: P01
    shape: tall
    gap: none
    bg: black
    camera: "high angle from the ceiling corner above the door, looking down the length of the dark studio"
    art: >
      Taeo's studio flat (taeo_flat key), 3:40 AM, the desk lamp OFF. The only light is orange streetlight through the window blind at the far end,
      falling in hard-edged bars across the bed and the floor; everything else is deep blue-grey, with one darker tone in the corners.
      Read the frame top to bottom. Top: the bed by the window, where Taeo (taeo, default: black hoodie, black cargo trousers, socks) lies on his back
      ON TOP of the grey duvet, still dressed, one forearm across his brow, eyes open, staring at the ceiling.
      Middle: the folding table, bare except for Nib's knife, the naked blade laid flat where Nib put it down at the end of chapter 5, catching one bar of streetlight,
      and the pencil Eunchae gave him lying beside it.
      Bottom, by the door: Nib (nib, default) sits on the floor with his back to the wall, a blanket over his shoulders and head like a hood, knees up,
      face in shadow (he could be asleep); his empty brown wooden sheath shows at his LEFT hip.
      Taeo's olive backpack slumps against the clothes rack, its patch turned away. Hard cel shadows, no glow haze. No text.
    calm: top-right
    lines:
      - {who: narr, type: tag, text: "3:40 AM"}
      - {who: taeo, type: float, text: "I DIDN'T ANSWER HIM."}
    notes: "Picks up the same night as ch5's hook ('THEN SELL.'), which Taeo never answered. Knife: bare blade on the table, empty sheath on Nib's hip. If ch005's last panel lays it down sheathed, draw it sheathed here and in P06."

  - id: P02
    shape: wide
    gap: short
    bg: black
    camera: "medium close-up from low beside the bed, Taeo sitting up on its edge"
    art: >
      Taeo (taeo, default) sits on the edge of the bed, hunched forward, holding a small framed photo in both hands on his knees, looking down at it.
      Orange streetlight bars cross his face and the frame; the rest is deep blue-grey. ACTING: hollow and guilty; heavy lower lids, mouth a flat line,
      the one mole under his RIGHT eye.
      The photo, drawn simply but clearly: a father with Taeo's messy near-black hair, laughing; a mother with long hair tied in a low knot, her arm round
      a 14-year-old Taeo in a navy school uniform who is trying not to smile; baby Haru on the father's arm in a tiny bright first-birthday hanbok.
      Its colours are faded and warm, the only warm thing in the panel. On the shelf above the bed, a gap where the frame stood. No text.
    calm: top
    lines:
      - {who: taeo, type: float, text: "THE WORST PART IS, IT ADDS UP."}
    notes: "The photo is the ch1 P47 frame (two parents, Taeo at 14, baby Haru). The beats ask for no explanation of the parents, so nobody explains them. The first-birthday hanbok and the mother's low knot are new details: lock them for ch8 and ch43."

  - id: P03
    shape: strip
    gap: short
    bg: black
    camera: "extreme close-up of the backpack patch"
    art: >
      Extreme close-up: Taeo's fingertips on the faded orange embroidered patch of his olive canvas backpack (a shield with an open door in its centre),
      his thumb worrying a loose thread at its frayed edge. One bar of orange streetlight across it; deep blue-grey everywhere else.
      Keep the patch in the middle third of the frame. Nothing else. No text.
    calm: right
    lines:
      - {who: taeo, type: float, text: "I USED TO KNOW WHAT I'D DO."}

  - id: P04
    shape: inset-r
    gap: short
    bg: black
    silent: true
    camera: "close-up from across the room, Nib's face under the blanket by the door"
    art: >
      Nib (nib, default) by the door, the blanket over his head like a hood. His amber eyes are OPEN: he was never asleep, and he is watching Taeo across the dark room.
      One bar of orange streetlight crosses his eyes. ACTING: still and watchful, a hurt held perfectly flat; level brows, no frown.
      The V-notch in the top of his LEFT ear shows against the blanket's edge. A narrow, weathered adult face with lines under the eyes: never cute. Deep blue-grey. No text.
    calm: left

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 6 · NOT MINE TO SELL"

  # ---------------- MORNING ----------------
  - id: P06
    shape: strip
    gap: long
    bg: white
    silent: true
    camera: "close on Nib's waist from the front, at table height"
    art: >
      Morning in taeo_flat: cool grey-blue daylight, one patch of yellow sun from the window across the folding table.
      Close on Nib's waist from the front, both hips in frame: his olive-green hand (faint pale scars on the forearm) lifts the bare knife off the table
      and slides it into the brown wooden sheath on his LEFT hip (the viewer's right), held steady by his other hand; the brown rope belt runs across the frame.
      On his RIGHT hip the leather drawstring pouch, with the pencil (a tiny three-line fork carved near its end) poking out of it.
      Keep the hands in the middle third. Flat cel colour, soft blue shadow. No text.
    calm: none

  - id: P07
    shape: narrow-r
    gap: short
    bg: white
    camera: "kit phone hand, straight on"
    art: "KIT HAND"
    calm: none
    ui:
      - {kind: phone.ttok_chat, on: screen, hand: taeo_right_front, title: "Dr. Pyo Jaesung", clock: "09:42", date: "THU 16 MAR", messages: [{from: them, text: "Good morning, Mr. Yoon. Shall we talk properly? The café in the Hapjeong Station tower, 10:30.", time: "06:58"}, {from: them, text: "Coffee is on me.", time: "06:58"}, {from: me, text: "I'll be there.", time: "06:58"}]}
    notes: "Taeo answered in the same minute Pyo wrote (06:58): he was awake. 'I'll be there', not 'we': he meant to go alone. The date divider follows the letterer's ch1 default (TUE 14 MAR) plus two days."

  - id: P08
    shape: wide
    gap: short
    bg: white
    camera: "from inside the room toward the entry, low, at the level of Taeo crouching"
    art: >
      The entry of taeo_flat, cool morning daylight. Taeo (taeo, outdoor: navy zip jacket over the black hoodie, the olive backpack on one shoulder with its
      orange patch visible) crouches at the shoe area tying his second sneaker, eyes shadowed from no sleep.
      Nib (nib: V-notch LEFT ear, brown rope belt, pouch RIGHT hip, knife now sheathed on his LEFT hip, barefoot) already stands at the door with one hand on the handle,
      looking down at Taeo: flat, cold, decided. With Taeo crouched, Nib's eyes are higher than his.
      Simplified background: the door, a shoe rack, a coat hook. No text.
    calm: top
    lines:
      - {who: narr, type: tag, text: "9:44 AM"}
      - {who: taeo, type: speech, side: l, text: "YOU DON'T HAVE TO COME."}
      - {who: nib, type: speech, side: r, text: "IT'S ME HE'S BUYING."}
    notes: "Beat: Nib insists on coming."

  # ---------------- THE CAFÉ ----------------
  - id: P09
    shape: full
    gap: long
    bg: white
    camera: "establishing, exterior, slightly low across the station plaza"
    art: >
      A glass office tower on the corner by Hapjeong Station, late morning, flat spring daylight (pyo_cafe_ext, new). At its foot, a revolving door of glass
      and brushed steel; through the glass front, the café inside in pale oak and cream. The doorman (extra) stands beside the revolving door.
      Office workers cross the plaza; a subway entrance with a blank sign panel. In the foreground Taeo (outdoor) and Nib walk toward the door,
      small in frame, Nib half a step ahead. Palette: warm grey stone and a pale blue sky; accent: the tower's cool teal glass.
      Drawn background, simplified signs. No text.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "HAPJEONG STATION · 10:29 AM"}

  - id: P10
    shape: inset-l
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag (2.5 heads) on a flat pale-blue background with swirl speed lines. Chibi Nib (ear notch, rope belt, pouch, sheath and bare feet all intact)
      stands calmly on the far side of the revolving door, arms folded, a dot-eyed deadpan stare, holding up two fingers.
      Inside the revolving door chibi Taeo is still going round: spiral eyes, a little ghost of sleep drifting out of his mouth, motion swirls,
      his backpack patch flapping, bumping into a chibi doorman. No text.
    calm: right
    lines:
      - {who: taeo, type: nervous, side: l, text: "SORRY—"}
      - {who: nib, type: speech, side: r, text: "TWICE."}
    sfx:
      - {text: "SWISH SWISH", style: comic, at: [0.42, 0.62], size: M, rot: -12}
    notes: "Runner reversal: in ch3 Nib went round the AAO's revolving door twice. Now he walks straight through and sleepless Taeo goes round twice. Taeo's 'SORRY' 1 of 5 (Nib counts them in P50). Chibi sheets: taeo, nib."

  - id: P11
    shape: wide
    gap: short
    bg: white
    camera: "from the café entrance, looking across the room to a corner window table"
    art: >
      Inside pyo_cafe, an upscale café on the tower's ground floor: cool white daylight from a tall window wall, cream walls, pale oak floor, grey stone tabletops,
      a marble counter, two office workers at a far table (cafe_guests).
      At the corner table, Dr. Pyo (dr_pyo: about 50, neat grey suit, white shirt, no tie, thin rimless glasses, greying hair combed back, the blank institute lanyard
      tucked into his breast pocket) rises from the chair that has its back to the wall and a view of the door, buttoning his jacket, with a warm, genuinely pleased smile.
      On the table: two coffees, a tall glass of pale lemon-yellow juice, a slim leather folio and a tablet lying face-down.
      In the foreground, Taeo (outdoor) smooths his hair, still dizzy; Nib scans the room: the exits, the window, the counter.
      Palette: cream and pale grey, one accent (the juice, never amber). No text.
    calm: top
    lines:
      - {who: dr_pyo, type: speech, side: r, text: "MR. YOON. THANK YOU FOR COMING."}
      - {who: taeo, type: speech, side: l, text: "SORRY. THE DOOR."}
      - {who: dr_pyo, type: speech, side: r, text: "AND GOOD MORNING TO YOU."}
    notes: "Two coffees: the callback to Pyo's first image in ch3's hook. Taeo's 'SORRY' 2 of 5. Pyo greets Nib directly and kindly; his courtesy is real, and his contract (P27) still leaves Nib out."

  - id: P12
    shape: inset-l
    gap: short
    bg: white
    camera: "medium, at table height, from the side"
    art: >
      Nib points one finger at Pyo's chair, the one with its back to the wall and a view of the door: a soldier's flat face, no discussion.
      Pyo, half risen, glances at the chair and back at Nib with delighted curiosity, already stepping aside.
      Simplified café background in cream and pale oak shapes. No text.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "THAT SEAT."}
      - {who: dr_pyo, type: speech, side: r, text: "BY ALL MEANS."}

  - id: P13
    shape: wide
    gap: short
    bg: white
    camera: "side view of the whole table, square to it"
    art: >
      The seating rearranged. Pyo now sits on the room side with his back to the café, at ease, legs crossed. Taeo sits on the wall side.
      Nib does NOT sit in the chair he claimed: he stands beside it with his back to the wall and his eyes on the entrance, arms folded,
      barefoot on the pale oak (sheath LEFT hip, pouch RIGHT hip).
      Pyo, amused, slides the tall glass of pale yellow juice across the stone toward Nib with two fingers.
      On the table: the two coffees, the folio, the face-down tablet, a small folded menu card (blocks only).
      Taeo and Nib on the LEFT of frame, Pyo on the RIGHT; keep these sides for the whole café scene. Cool window daylight. No text.
    calm: top
    lines:
      - {who: dr_pyo, type: speech, side: r, text: "YOU'RE NOT GOING TO SIT IN IT."}
      - {who: nib, type: speech, side: l, text: "NO."}
      - {who: dr_pyo, type: speech, side: r, text: "I GUESSED JUICE. I HOPE THAT'S ALL RIGHT."}
    notes: "Nib wanted the sightline, not the chair. He stands for the rest of the scene; standing, his eyes are about level with the seated men."

  - id: P14
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up on Nib, frontal, from Pyo's eye line"
    art: >
      Nib looks from the juice to Pyo without touching it: dead level, deadpan, absolutely serious. A sharp adult face, the V-notch of his LEFT ear visible.
      At the left edge of frame Taeo half raises a hand in apology, a big sweat drop at his temple. Plain cream background. No text.
    calm: right
    lines:
      - {who: nib, type: speech, side: c, text: "YOU FIRST."}
      - {who: taeo, type: nervous, side: l, text: "SORRY. HE'S... CAREFUL."}
    notes: "Runner 'YOU FIRST.' (ch2). Taeo's 'SORRY' 3 of 5."

  - id: P15
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up on Pyo from Nib's eye line"
    art: >
      Pyo lifts the juice glass and takes one small sip, eyes bright behind the rimless lenses: amused, and fascinated in a way that looks a little like
      recognition, as if he has seen this courtesy before. Cool daylight from the window behind him. Simplified background. No text.
    calm: left
    lines:
      - {who: dr_pyo, type: speech, side: r, text: "OF COURSE."}
      - {who: dr_pyo, type: speech, side: r, text: "...HOW SENSIBLE."}
    sfx:
      - {text: "SIP", style: quiet, at: [0.30, 0.62], size: S, rot: 0}
    notes: "Beat: Pyo drinks, amused. Play the hint of recognition lightly; it quietly prepares the slip in P24."

  - id: P16
    shape: wide
    gap: short
    bg: white
    camera: "low, along the stone tabletop, the glass in the foreground"
    art: >
      At tabletop level. In the foreground, Nib's single olive-green forefinger pushes the juice glass (one sip gone) back across the grey stone toward Pyo.
      Behind it, Taeo's COMEDY FACE: a frozen polite smile, dot eyes, a huge sweat drop, whispering sideways to Nib behind his hand.
      On the far side Pyo laughs softly behind his knuckles. Cool daylight, hard shadows on the stone. No text.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "KEEP IT."}
      - {who: taeo, type: whisper, side: l, text: "THAT'S ₩13,500 OF JUICE."}
      - {who: nib, type: speech, side: l, text: "THEN HE SHOULD FINISH IT."}
    sfx:
      - {text: "SHHK", style: quiet, at: [0.20, 0.80], size: S, rot: -4}
    notes: "Beat: Nib refuses the juice. ₩13,500 is the café's price (Taeo read the menu card): more than one of his ₩10,000 lunches (ch4: fifty million = 'five thousand of my lunches')."

  - id: P17
    shape: full
    gap: short
    bg: white
    camera: "over Pyo's shoulder toward Taeo and Nib"
    art: >
      Over Pyo's grey-suited shoulder, the edge of his glasses and his calm profile in the right foreground: he opens the slim leather folio on the table.
      Facing us across the table, Taeo sits up straighter, wary and attentive, both hands round his untouched coffee; Nib stands at the wall beside him, arms folded.
      Window daylight from the left. Simplified café behind them. No text.
    calm: top
    lines:
      - {who: dr_pyo, type: speech, side: r, text: "I'LL BE PLAIN, MR. YOON."}
      - {who: dr_pyo, type: speech, side: r, text: "NOTHING LIKE HIM HAS WALKED INTO AN ASSESSMENT OFFICE IN TWENTY YEARS."}
    notes: "Beat: the pitch (science). 'Twenty years' agrees with ch4: the ARRIVAL category in the 1995 law has gone unused for twenty years."

  - id: P18
    shape: strip
    gap: short
    bg: white
    camera: "top-down insert on the open folio"
    art: >
      Top-down on the grey stone table: the open leather folio with three glossy printed photographs fanned out, drawn simply, with no text or logos:
      a bright private room with a made bed and a big window; a walled garden courtyard with a small pond and a bench under a tree;
      a smiling nurse in a white coat beside a medical cart. Pyo's fingertip rests on the garden photo. Cool daylight.
      Keep the photos in the middle third of the frame. No text.
    calm: none
    lines:
      - {who: "offpanel:dr_pyo", type: speech, side: r, text: "HIS OWN ROOMS. A GARDEN. A DOCTOR ON CALL."}
      - {who: "offpanel:dr_pyo", type: speech, side: r, text: "PEOPLE WHOSE WHOLE JOB IS LISTENING TO HIM."}
    notes: "Beat: the pitch (care)."

  - id: P19
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up of Nib's eyes"
    art: >
      Extreme close-up strip of Nib's amber eyes and brow, which snap from the door to Pyo at the word 'home': sharp, wanting and wary at once.
      The V-notch of his LEFT ear at the frame edge. Cool daylight, flat cel shading, a thin cool-grey mood wash behind. Eyes in the middle third. No text.
    calm: none
    lines:
      - {who: "offpanel:dr_pyo", type: speech, side: r, text: "AND WE'D LIKE TO KNOW HOW HE GOT HERE."}
      - {who: "offpanel:dr_pyo", type: speech, side: r, text: "PERHAPS EVEN HOW HE GETS HOME."}
    notes: "The lure is real: going home is what Nib wants most (STORY_BIBLE §6)."

  - id: P20
    shape: wide
    gap: short
    bg: white
    camera: "profile two-shot across the table, Nib on the left, Pyo on the right"
    art: >
      Nib leans over the table edge toward Pyo, one hand flat on the stone, eyes hard. Pyo meets his eyes with gentle honesty, both hands open on the folio.
      Taeo, seated beside Nib on the left, watches Nib, not Pyo. Window light from behind. No text.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "CAN YOU SEND ME BACK?"}
      - {who: dr_pyo, type: speech, side: r, text: "NOT YET. NOBODY CAN, YET."}
      - {who: nib, type: speech, side: l, text: "THEN DON'T SAY PERHAPS."}

  - id: P21
    shape: full
    gap: short
    bg: white
    camera: "over Taeo's shoulder toward Pyo"
    art: >
      Over Taeo's shoulder (navy jacket, messy hair) in the left foreground, toward Pyo, who now turns his whole attention to Taeo: kind, patient, reasonable,
      hands folded on the closed folio, a small sympathetic tilt of the head. The kindness is what makes it hard.
      Cool daylight through the window behind Pyo. No text.
    calm: top-right
    lines:
      - {who: dr_pyo, type: speech, side: r, text: "NOTED."}
      - {who: dr_pyo, type: speech, side: r, text: "HE'D LIVE BETTER THAN IN AN 18-SQUARE-METRE FLAT, MR. YOON."}
      - {who: dr_pyo, type: speech, side: r, text: "BE HONEST."}
    notes: "Pyo knows the size of the flat: the AAO registration (ch4) gave Kanghan the address. Nobody comments on it; let it sit."

  - id: P22
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up on Taeo, frontal, from Pyo's side"
    art: >
      Taeo looks down at his coffee and his shoulders drop. ACTING: the honest answer costs him: shame and exhaustion, jaw tight, eyes lowered,
      the one mole under his RIGHT eye. A soft cool-grey mood wash behind him (a gradient is allowed behind a reaction). No text.
    calm: left
    lines:
      - {who: taeo, type: speech, side: c, text: "...HE WOULD."}

  - id: P23
    shape: narrow-l
    gap: short
    bg: white
    silent: true
    camera: "full figure of Nib standing at the wall, from beside Taeo"
    art: >
      Nib (nib, full model: V-notch LEFT ear, brown rope belt, leather pouch RIGHT hip, brown wooden sheath LEFT hip, barefoot on the pale oak)
      stands against the cream wall beside the empty chair, arms folded, and turns only his head toward Taeo: he heard that.
      ACTING: nothing moves but the eyes: a private hurt, held. Adult, wiry, upright; never cute. Plain wall. No text.
    calm: none

  - id: P24
    shape: wide
    gap: short
    bg: white
    camera: "high angle down onto the table"
    art: >
      High angle over the table: Pyo's well-kept hand slides the tablet, now face-up with its screen a plain dark rectangle, across the grey stone toward Taeo,
      a slim silver pen laid on top of it. The folio closed beside the coffees. Taeo's hands rest on the table edge; Nib's folded arms just in frame. No text.
    calm: top-left
    lines:
      - {who: dr_pyo, type: speech, side: r, text: "WE'VE STUDIED ARRIVALS BEFORE."}
      - {who: dr_pyo, type: speech, side: r, text: "HE'D BE IN VERY GOOD HANDS."}
    sfx:
      - {text: "SHHK", style: quiet, at: [0.62, 0.70], size: S, rot: -6}
    notes: "PLANT P05: Dr. Pyo, 'WE'VE STUDIED ARRIVALS BEFORE.' He means the Long Night arrivals the institute held in the Annex. Play it as a slip: P25 holds his eyes a beat too long, P26 is the smooth cover, and Nib notices. Inside this chapter it reads simply as 'there were others before Nib, and Kanghan studied them'. Payoff: ch70 (the Arrival Work Permit) and Part Two (the Annex). Log in ledger/PLANTED.md: ch 6, P24, this line."

  - id: P25
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up of Pyo's eyes behind his glasses"
    art: >
      Extreme close-up of Pyo's eyes and the rimless lenses: the smile lines stay where they were, but the eyes go still for one beat too long,
      like a man who has heard himself open a door he meant to keep shut. A thin cool-grey mood wash. Eyes in the middle third. No text.
    calm: none
    lines:
      - {who: "offpanel:taeo", type: speech, side: l, text: "...BEFORE?"}

  - id: P26
    shape: inset-l
    gap: short
    bg: white
    camera: "over Nib's left shoulder at Pyo"
    art: >
      Over Nib's left shoulder: his long LEFT ear with its V-notch large and sharp in the foreground, one narrowed amber eye in profile, fixed on Pyo.
      Beyond him, Pyo has his easy smile back and lifts one hand in a gentle, it's-nothing gesture as he reaches for his coffee. Everything sharp, no blur. No text.
    calm: right
    lines:
      - {who: dr_pyo, type: speech, side: r, text: "IT'S AN OLD CATEGORY, MR. YOON."}
      - {who: dr_pyo, type: speech, side: r, text: "WE'RE AN OLD INSTITUTE."}

  - id: P27
    shape: wide
    gap: short
    bg: white
    camera: "Taeo's point of view, looking down at the tablet in his hands"
    art: >
      Point of view: Taeo's two hands hold the tablet just above the table (screen: green), the silver pen pinned under his right thumb against the case.
      Beyond the tablet: the stone tabletop, the juice glass, and Pyo's folded hands waiting at the far edge. Cool daylight. No text.
    calm: top
    ui:
      - {kind: phone.info_card, on: screen, title: "KANGHAN INSTITUTE · EXCLUSIVE OBSERVATION AGREEMENT", text: "Subject: arrival entity \"NIB\" (status pending) · Residence: Kanghan Institute, residential wing · Term: 5 years · Fee to summoner: ₩50,000,000 · Signature (summoner): ____________"}
    lines:
      - {who: taeo, type: speech, side: l, text: "WHERE DOES HE SIGN?"}
      - {who: dr_pyo, type: speech, side: r, text: "HE DOESN'T. YOU DO."}
      - {who: narr, type: footnote, text: "*₩50,000,000 ≈ US$36,000"}
