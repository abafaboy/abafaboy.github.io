chapter: 98
title: Everyone Comes Back
when: "Straight from ch97's hook: late morning of Day Two at Yeoju, the licensed clear of gate E (about 12:00), the closing of the entry, then the early-afternoon score update. No calendar date given."
story_beats: PART_ONE_BEATS.md#98
cast:
  taeo: outdoor
  nib: default
  orrin: default
  sera: default
  kesh: default
  haein: default
  dara: default
  sejin: default
  chae: default
  minho: default
  do_gangjin: default
  ironvow_captain: default
extras:
  coalition_leads: "Three adult survey-crew leaders in mismatched regional field jackets (one yellow, one green, one grey-blue), plain hard hats, each with a clipboard or radio; no shared uniform and no new guild emblem."
  coalition_porters: "Eight adult porters in plain work vests, gloves and hard hats; ordinary day-rate haulers with safety ropes clipped, ages mixed, none hurt."
  reed_guardian: "E's boss: a colossal heron-like reedstone guardian about 30 m tall when upright. Two stilt legs of fused ochre reedstone stalks, a barrel body of overlapped slate-grey plates, a 20 m neck of pale hollow reed tubes bound like a bundle, a spear-long layered grey beak and a crown of upright reed-blade plates, one pale slit of an eye on each side of the head. Slow and heavy; each stilt plant rings like a bell and lifts a visible ring of gravel. No fire, no glow, no face like a human."
locations: [yeoju_anchor_field, yeoju_gate_d, yeoju_gate_e]
location_notes:
  yeoju_anchor_field: "Continue ch97: five framed door-height gates A-E west-east on a wet gravel apron, depot north, canopy southwest, medical shelter south. The operator chair, instrument table and coupler cabinet stand midway outside D and E, chair facing E; D and E are no longer coupled (Haein pulled the cut-off and keeps the brass key). Ochre clay mud at the foot of the E frame. The competition schedule board from ch96 hangs on two steel posts by the southwest canopy; it is a flat display board that is blank for the letterer until the final panels."
  yeoju_gate_d: "Retired from scoring and still uncleared; Orrin has walked out of it, his D return ring faded. It stays cordoned. Nothing happens inside it in this chapter."
  yeoju_gate_e: "Geometry from ch97: entry landing at the WEST edge; apron opens EAST; north rib wall on the LEFT when looking east, with a long low ledge about 4 m up running from near the landing to mid-apron; shallow dry gully on the RIGHT. The pale slab now lies at the foot of the landing ramp; the dark wedge is split. The taped lane runs along the north wall. The stock seam and fixed stone lip are at the EAST end; the folded ridge was the guardian and has risen. After its death the ridge is a long heap of pale rubble, the sky pales and the entry begins to close."
continuity_notes: >
  Time: Day Two, from just after ch97's hook. The clear is about 12:00-12:30. No Taeo transfers at all this chapter: Haein
  keeps the cut-off key, the couplers are disconnected, medics Sejin and Dara hold stop authority; the clear uses only
  ordinary strengths plus calls over the survey-line handsets. Taeo has a nose-bleed cloth and scabbing lip; he refuses to sit until Nib is out.
  Plan: Orrin braces mid-apron against the north ledge's foot with Nib standing on his shell; Sera on the ledge above; Kesh listens over the cable.
  The guardian plants three times (bell rings), then stabs. Nib jumps; the beak lodges in Orrin's stacked-slate shell. Kesh calls the singing reed
  under the jaw as the guardian inhales; Sera's unaided shot hits it; the neck unzips and the guardian collapses into a ridge of rubble.
  The extracted E stock on the abandoned sledge is destroyed and the unextracted stock under the guardian is lost when the gate closes.
  Return marks flare on boss death (30 s). Orrin and Sera walk out; Nib, last, knocks three times on the inner plate and steps out as the slit narrows.
  Nobody on either team is hurt: no injuries except Taeo's old bruises, nosebleed and rhythm. Orrin is dusty, unhurt.
  Iron Vow has already withdrawn (ch97). Minho's coalition porters and leaders are all out and counted (eight).
  Score board (final): IRON VOW stock 3,980, safety 520, licensed clears 0, total 4,500. YOON TAEO'S CREW stock 3,210, safety 1,150, licensed clears 1,500, total 5,860.
  Nib: adult 105 cm, LEFT ear V-notch, one lower LEFT fang, brown rope belt, RIGHT pouch with dinosaur sticker, LEFT brown wooden sheath,
  8x30 binoculars on a LEFT-knotted strap, exact ch43 boots (matte dark-brown ankle-high leather work boots, round toes, four pairs of dull gunmetal eyelets,
  dark-brown laces in small double knots, black lug soles, heel pull tabs, oat-grey short socks). Taeo: navy jacket over black hoodie, black cargos, striped sneakers,
  old olive backpack with the OLD orange shield/open-door patch, RIGHT-eye mole. Amber and slate-green pulses only; no new link colours.
palette_notes: "Exterior: wet slate and ochre, cold white daylight, mud brown. Interior: A4 wrong lavender sky, violet shadow, pale ochre reedstone, slate-grey guardian. Cyan only for interface; amber only for Nib's link/eyes; red only for blood and the cut-off lever. Flat cel, no haze or bloom."
