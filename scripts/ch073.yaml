chapter: 73
title: Guilt
when: "Late on the day of Sera's evacuation, through the following dawn. Hospital and gate staging both in Chungju; no trip back to Seoul."
story_beats: PART_ONE_BEATS.md#73
cast:
  taeo: outdoor # Same clothing through hospital night; clean cloth at nose, RIGHT forearm wrapped after examination.
  nib: default # Exact ch043 boots, binoculars and permanent belt/pouch props.
  orrin: default
  sera: default # Hospital gown, padded LEFT arm splint; opening only, then remains a patient offstage.
  kesh: default
  sejin: default # Stays with Sera when the consortium returns.
  minho: default
  haein: default
extras:
  ward_nurse: "Korean man about 35, short hair, pale-blue scrub top, dark trousers, practical soft shoes."
  upstream_lead: "Continue ch070 upstream lead: adult Korean woman about 35, close braid, navy Meridian field gear, white helmet, radio at LEFT shoulder; no new nameplate."
  consortium_medic: "Adult Korean man about 45, stocky, short salt-and-pepper hair, teal field vest over grey shirt, square olive medical pack, white hard hat. Independent consortium medic, not Sejin."
  survey_crew: "Two adult Ryu survey workers, one stocky man and one short-haired woman, dusty orange vests and white helmets, cable reel and rulers."
props:
  nib_boots: >
    Exact ch043 pair: matte dark-brown ankle-high leather lace-up work boots, broad round toe,
    no visible steel cap; four pairs of dull gunmetal round eyelets; dark-brown round laces in
    small double knots; plain black lug soles, low heel, heel pull tab; oat-grey short socks
    just inside collar. No logo, hooks, buckles, bright trim or exposed metal plate.
locations: [chungju_hospital, chungju_river_gate, chungju_river_inside]
location_notes:
  topology_lock: >
    ch070 master view: entry landing downstream; right-bank survey shelf runs upstream, current toward
    landing. At marker 9, A is LEFT stepped dry shelf and B RIGHT low water-covered shortcut past split
    pillar. Local waterward-left descriptions are relative to the right-bank approach, not an A/B swap.
    Muted lilac mineral seams fill hard white survey lamps. The metal frame has an exposed tapping plate.
  chungju_hospital: >
    Continue ch072's cream/slate corridor, three linked grey seats, operating doors and service entrance.
    Ward room has a bed on the right, bedside cupboard on the left, plain pale curtain, blue-white overhead
    fluorescent and a small shaded night lamp. The small family waiting alcove has a plain table and water dispenser.
  chungju_river_gate: >
    ch071 gravel staging site: scaffold-braced slit, radio table under white canopy, ambulance lane behind.
    White survey cable with blue bands every metre, grey relay tripod every 50 m, speaker, coiled handset,
    white lamp. Radio works across threshold only while this line is intact. No drawn location key available.
  chungju_river_inside: >
    ch071 right-bank dry shelf, Channel B waterward left under low lip, high triage alcove, continuous
    stone ceiling and NO SKY. First-sector entry landing with a scale rod left beside the water by Ryu;
    no ancient lettering invented. Survey lamps white, shadows violet, river ink-dark. Boss remains alive.
continuity_notes: >
  Nib is an adult, LEFT notch and single lower LEFT fang, brown rope belt, RIGHT pouch with dinosaur,
  LEFT wooden sheath, matte 8x30 binoculars with LEFT knot and hinge mark; ID, PAPER drawing and cobalt
  pencil stay protected inside his pouch. Boots inherit ch043, never new shoes here. Taeo's old orange
  shield/open-door patch, cracked dark-grey phone with dinosaur and single RIGHT-eye mole remain locked.
  Sera has no LEFT bracer; bow, quiver and flute returned to her bedside through Sejin. No arm use or
  discharge. No public failure record yet: the public test record belongs to ch079. No apology accepted.
palette_notes: >
  Hospital A4 institutional blue-white/slate; night lamp muted cream, no orange that competes with links.
  Dawn staging cool grey-blue. Inside the skyless gate violet stone and hard white lamps; warning red
  used sparingly on social UI. No drawn lettering, photographic blur, bloom or particles.
