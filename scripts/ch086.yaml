chapter: 86
title: Field Practice
when: "The same evening as ch 85, then the following morning through late afternoon at Ryu Survey's yard. No calendar date is fixed."
story_beats: PART_ONE_BEATS.md#86
cast:
  taeo: default # Jacket over chair; black hoodie, cargo trousers and striped black sneakers. Forearm bruises visible for examination, covered during ground practice. RIGHT-eye mole.
  dara: default
  sejin: default
  nib: default # Ch 43 boots and all established gear; never barefoot.
  orrin: default
  sera: default # Recovering LEFT bow arm braced and supported; observes, no bow draw.
  kesh: default
  haein: default
  ironvow_captain: default # First appearance P48, full design below.
props:
  nib_gear: "V-notch LEFT ear, one lower fang LEFT, brown rope belt, pouch RIGHT hip with green dinosaur sticker, brown wooden sheath LEFT. Pale-blue ID, folded PAPER watch-post drawing and marked cobalt pencil protected in pouch; matte black 8x30 binoculars, black strap knot LEFT neck, marked hinge. Exact ch 43 boots: matte dark-brown ankle leather, broad round toe, four gunmetal round eyelet pairs, brown round laces double-knotted, low black lug soles, heel pull tab, oat-grey sock rim; no logo, hooks, buckles or visible steel cap."
  taeo_gear: "Olive backpack, faded orange knock-off OLD team patch; cracked-top-left dark grey phone with green dinosaur sticker. Layered purple-brown recoil bruises on forearms; no new impact is routed in this chapter. Green-banded white welcome mug still on trestle."
locations: [ryu_practice_yard]
location_notes:
  ryu_practice_yard: "Canonical keys: south double gate; grey office container southwest, white van southeast; fixed plywood zigzag and three north targets. Trestle west. Medical review at trestle, then portable cot under a plain canopy on the clear south apron. All practice is physical ground rehearsal; no dungeon gate opens here."
palette_notes: "Night opening: cream work lamp, ochre and hard navy. Morning/afternoon A4 yard: dusty ochre and plywood brown, sky-blue light, warm brown shadows, muted orange safety gear. Medical materials dull sage/cream. Danger accent confined to the captain's muted dark-red uniform inset. Flat cel drawing, weighted warm ink, no decorative glow."
panels:
  - id: P01
    shape: tall
    gap: none
    bg: navy
    camera: "reverse of ch 85 hook across Taeo's exposed arms"
    art: >
      ryu_practice_yard at night. Sejin (sage scrubs, olive medic rig) faces Dara across seated
      Taeo's bruised forearms, chin level and eyes hard. Dara's slate shoulder enters left;
      Taeo (black hoodie, sleeves raised) looks between them. Cream task lamp, deep navy beyond.
      The folder lies beside the green-banded mug; no new wound.
      Dara is left, Taeo seated centre and Sejin right; include the three faces above the exposed arms.
    calm: top
    lines:
      - {who: sejin, type: speech, side: r, text: "START WITH HIS ARMS. YOU CAN INSULT ME AFTER THE EXAMINATION."}
  - id: P02
    shape: strip
    gap: short
    bg: navy
    silent: true
    camera: "extreme close-up of Dara's hand releasing its tense grip on her kit"
    art: >
      Dara's bare scarred hand loosens on the LEFT surgical kit at the yard trestle. The
      white knuckles ease; her other hand settles gently beneath Taeo's wrist. Heavy matte slate
      and oatmeal wrap, cream lamp and hard brown/navy shadow. No healing effect or violent gesture.
    calm: none
  - id: P03
    shape: inset-l
    gap: short
    bg: navy
    camera: "close-up on Dara at seated Taeo's height"
    art: >
      Dara (dara: adult human 42, broad 180 cm build, square weathered face, dark eyes,
      thick brows, dark braid with grey temples, slate plates over oatmeal surgeon's wrap,
      scarred forearms, LEFT kit and RIGHT cloth roll) looks at Taeo rather than Sejin.
      Her anger becomes attention. Cream yard task lamp, hard navy background. No glamour or spikes.
      Dara is in the left third of the close-up.
    calm: right
    lines:
      - {"who": "dara", "type": "speech", "side": "l", "text": "FAIR. TELL ME ABOUT THE RECOIL."}
  - id: P04
    shape: tall
    gap: short
    bg: navy
    camera: "table-level two-shot of Taeo and Sejin"
    art: >
      Taeo (black hoodie, sleeves raised) sits right of Sejin at the yard trestle. She opens
      the treatment log; he looks at its thickness and swallows. His jacket hangs on his
      chair, old patch visible on backpack. Cream lamp, ochre paper and navy shadows; entries abstract and blank for overlays.
      Sejin sits left and Taeo right, both faces above the treatment log.
    calm: top
    lines:
      - {"who": "sejin", "type": "speech", "side": "l", "text": "I LOGGED EVERY LOAD YOU REPORTED, AND THE REST I PRESCRIBED."}
      - {"who": "taeo", "type": "speech", "side": "r", "text": "NOT EVERY LOAD IS IN THAT LOG."}
  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 86 · FIELD PRACTICE"
  - id: P06
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up of Sejin looking up from the folder"
    art: >
      Sejin (cropped near-black hair, sage scrubs) looks up at Taeo across the night yard
      trestle. No anger performance: her tired brown eyes stop moving. Fingers rest flat on
      the folder. Cream lamp from above, hard olive and navy shadows. No tears, no accusatory finger.
      Sejin is in the right third of the close-up.
    calm: left
    lines:
      - {"who": "sejin", "type": "speech", "side": "r", "text": "WHICH LOADS DIDN'T YOU REPORT?"}
  - id: P07
    shape: tall
    gap: short
    bg: white
    camera: "profile of Taeo with Nib at the chair's far side"
    art: >
      Taeo (black hoodie, bruised arms) stares at his hands at the yard trestle. Nib (adult,
      chosen boots, high binoculars and locked belt gear) stands beside the chair, refusing to
      rescue him from answering. Cream lamp on Taeo's RIGHT-eye mole, ochre table and navy fence beyond.
      Taeo sits in the left third and Nib stands in the right third.
    calm: top
    lines:
      - {"who": "taeo", "type": "speech", "side": "l", "text": "I LEFT OUT LOADS THAT DIDN'T LEAVE NEW BRUISES."}
      - {"who": "nib", "type": "speech", "side": "r", "text": "YOUR BODY STILL TOOK THEM."}
  - id: P08
    shape: strip
    gap: short
    bg: white
    camera: "overhead detail of Sejin laying a second blank sheet beside the first"
    art: >
      Sejin's gloved hand places a clean sheet beside the thick existing treatment folder on
      the yard trestle. Taeo's fingers curl on the blanket edge; Dara's scarred hand waits
      beside them. Cream task light, dull sage and paper beige, brown shadows. No legible writing or medical diagram.
    calm: top
    lines:
      - {"who": "taeo", "type": "float", "text": "I'D LEFT THE DAMAGE OUT OF HER RECORDS."}
  - id: P09
    shape: full
    gap: short
    bg: white
    camera: "eye-level across the trestle with Dara facing both"
    art: >
      Dara (slate armour) studies Sejin's folder at the yard; Sejin points to a rest interval
      and meets her gaze. Taeo sits quietly to the right. Professional heat, no gloating.
      Cream lamp, muted oatmeal/olive and navy background. Folder pages remain abstract strokes, no magical diagnosis.
      Dara stands left, Sejin centre and Taeo sits right; show both clinicians faces above the log.
    calm: top
    lines:
      - {"who": "dara", "type": "speech", "side": "l", "text": "YOU LET HIM CARRY THROUGH THE BRUISING?"}
      - {"who": "sejin", "type": "speech", "side": "c", "text": "I SET REST PERIODS. HE HID LOADS FROM ME."}
  - id: P10
    shape: inset-l
    gap: short
    bg: white
    camera: "close frontal view of Dara's face"
    art: >
      Dara's face at the yard trestle: her brows ease by one degree as she revises her
      first judgment. Grey temple strands, tight braid, oatmeal collar above matte slate chestplate.
      Cream lamp upper left, hard navy field behind. Keep the face weathered and adult, not softened into chibi.
      Dara is in the left third of the close-up.
    calm: right
    lines:
      - {"who": "dara", "type": "speech", "side": "l", "text": "THEN OUR PATIENT IS HIDING THE DAMAGE."}
  - id: P11
    shape: full
    gap: fade-white
    bg: white
    camera: "morning establishing from the south gate toward the maze"
    art: >
      Morning ryu_practice_yard key, fixed maze and three targets intact. On the southern apron
      Haein (slate overalls, tool belt) lays an UNPOWERED padded lever beside a sandbag; Sejin
      and Dara set a portable cot under a plain canopy west of the maze. Taeo watches,
      chastened. Southeast sun, A4 ochre/brown/sky-blue. No dungeon gate or live reservoir test.
    calm: top
    lines:
      - {who: narr, type: tag, text: "THE NEXT MORNING · GROUND PRACTICE"}
  - id: P12
    shape: tall
    gap: short
    bg: white
    camera: "low view along the cot toward Dara and the watching crew"
    art: >
      Dara (armour) stands beside the cot on the yard apron while Nib, Sera and Kesh
      listen; Kesh is a mature 198 cm moth-like adult, narrow grey-tan face, dark eyes,
      two feathered antennae, four folded grey-brown wing panels over olive tunic, dark trousers,
      wrapped shoes, two arms and two legs. Orrin waits in clear space. Sejin holds the practice checklist, Taeo empty-handed.
      Dara's expression is mercilessly practical. Morning sun, dusty ochre and warm brown shadows. No weapons drawn.
      Dara stands left and Taeo right; listening crew and the cot occupy the middle with room.
    calm: top
    lines:
      - {"who": "dara", "type": "speech", "side": "l", "text": "SHOW ME YOUR EMERGENCY DRILL."}
      - {"who": "taeo", "type": "nervous", "side": "r", "text": "WHICH EMERGENCY? WE HAVE A SELECTION."}
  - id: P13
    shape: full
    gap: short
    bg: white
    style: chibi
    camera: "chibi inspection of an aggressively ordinary chair"
    art: >
      Chibi Dara (slate armour, LEFT kit, RIGHT roll) points at chibi Taeo's folding chair
      as if it were disgraceful enemy fortification. Chibi Taeo (black hoodie, RIGHT-eye mole)
      hugs it, appalled. Flat ochre screentone and a stylised blue morning-sky band; no injury or cardiac joke.
      Chibi Dara stands left and Taeo right with the chair between them.
    calm: left
    lines:
      - {who: dara, type: speech, side: l, text: "WHY IS YOUR OPERATOR'S CHAIR SO FAR FROM HIS MEDIC?"}
      - {who: taeo, type: speech, side: r, text: "I THOUGHT I WAS FURNITURE."}
  - id: P14
    shape: tall
    gap: short
    bg: white
    camera: "normal style overhead map-like view of the apron"
    art: >
      Haein slides Taeo's folding chair beside the canopy cot at ryu_practice_yard, moving the
      chair only, never a maze wall. Sejin uncoils a monitor lead while Dara checks the
      clear path to the south gate. Taeo looks sheepishly useful carrying the blanket. A4 morning ochre/brown/blue; all displays dark.
      Sejin stands left, Haein centre-left with the chair, Taeo centre-right with the blanket, Dara right.
    calm: top
    lines:
      - {"who": "sejin", "type": "speech", "side": "l", "text": "I'VE ASKED TAEO TO MOVE CLOSER."}
      - {"who": "dara", "type": "speech", "side": "r", "text": "NOW TWO MEDICS ARE ASKING."}
  - id: P15
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "detail of Taeo placing his own chair inside Sejin's reach"
    art: >
      Taeo's black-cuffed hands settle his chair by the yard canopy cot, within easy reach
      of Sejin's gloved hand. His sleeves cover the bruises; no link pulse. Southeast morning
      sun across dusty ochre, clean brown chair shadow, portable medical leads coiled safely away from the feet.
    calm: none
  - id: P16
    shape: full
    gap: short
    bg: white
    camera: "high angle over the first dry evacuation rehearsal"
    art: >
      At the yard maze's south entrance Nib (boots, locked binoculars) plays an alert casualty
      seated on a low pad. Kesh (folded grey-brown wings, olive tunic) relays a report;
      Orrin waits outside the narrow corridor. Sera observes with supported arm. Everyone intent. Morning ochre/brown/sky-blue;
      no actual wound, active gate, return marks or magical impact.
      Draw Dara in slate armour at right inspecting Orrin, Kesh reporting at left, Nib seated centre; Sera observes behind.
    calm: top
    lines:
      - {"who": "kesh", "type": "speech", "side": "l", "text": "ONE WALKING CASUALTY. ORRIN WILL CARRY. THE ROUTE IS OPEN."}
      - {"who": "dara", "type": "speech", "side": "r", "text": "WHO CHECKED THE CARRIER?"}
  - id: P17
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up at Orrin's eye level beside the maze"
    art: >
      Orrin (adult layered slate shell, heavy olive eyes) stands beside the yard maze, patient
      but stung that his own condition is often overlooked. No harness or cargo. Morning
      sun catches an old repaired shell seam without making a fresh crack; ochre wall and brown shadows.
      Orrin is in the left third of the close-up.
    calm: right
    lines:
      - {"who": "orrin", "type": "speech", "side": "l", "text": "I WAS ABOUT TO ASK FOR MY OWN CHECK."}
  - id: P18
    shape: tall
    gap: short
    bg: white
    camera: "medium shot from inside the south maze gap toward both clinicians"
    art: >
      Sejin (sage scrubs) indicates the stretcher staging position at the yard gap; Dara (slate
      armour) objects with an open palm. Nib watches from the pad, utterly unsentimental about
      the demonstration. Bright southeast sun, ochre plywood, brown shade. No blocked real exit or live casualty.
      Sejin stands left, Nib sits centre on the pad and Dara stands right, all three faces visible.
    calm: top
    lines:
      - {"who": "sejin", "type": "speech", "side": "l", "text": "FROM HERE I CAN SEE THE WHOLE TEAM."}
      - {"who": "dara", "type": "speech", "side": "r", "text": "AND THE EXIT IS BEHIND YOU."}
      - {"who": "nib", "type": "speech", "side": "c", "text": "DARA'S RIGHT. KEEP THE EXIT IN VIEW."}
  - id: P19
    shape: full
    gap: short
    bg: white
    camera: "medium two-shot of Sejin left and Dara right above the rehearsal checklist"
    art: >
      Sejin turns a plain clipboard and redraws the rehearsal position as abstract boxes at
      the yard trestle. Dara's scarred finger stops on an access path, not on Sejin's
      hand. Their gestures have become collaborative. Morning cream paper over ochre; navy ink shapes remain unreadable.
      Show both faces and their collaborative hands: Sejin left and Dara right; keep the checklist footer clear.
    calm: top
    lines:
      - {"who": "sejin", "type": "speech", "side": "l", "text": "TURN THE STRETCHER HALFWAY AROUND. SAME VIEW. CLEAR EXIT."}
      - {"who": "dara", "type": "speech", "side": "r", "text": "REPEAT THE DRILL."}
    ui:
      - {kind: label, text: "DRY REHEARSAL · 00:46", at: [0.50, 0.78], size: 28, notes: "On the blank checklist footer. Ground-rehearsal duration only; not a safe load or cardiac limit."}
  - id: P20
    shape: tall
    gap: short
    bg: white
    camera: "across the shaded canopy to Taeo sitting beside the cot"
    art: >
      Taeo (black hoodie) sits beside the yard cot, watching the second ground rehearsal. Dara
      turns from the practice toward him; Sejin is already at his side with the pulse
      recorder. Taeo's smile is too quick again. Blue canopy shade over muted ochre, warm sun outside. No connected load apparatus.
      Dara stands left, Sejin centre beside the recorder and Taeo sits right by the cot.
    calm: top
    lines:
      - {"who": "dara", "type": "speech", "side": "l", "text": "NOW WE CHECK YOU AT REST. BEFORE ANY LOAD SHARE."}
      - {"who": "taeo", "type": "speech", "side": "r", "text": "I FEEL FINE SITTING DOWN."}
  - id: P21
    shape: narrow-r
    gap: short
    bg: white
    camera: "close-up on Sejin's fingers checking Taeo's wrist"
    art: >
      Under the yard canopy Sejin's gloved fingertips rest at Taeo's wrist, his black sleeve
      raised just enough. Her posture, partly visible, becomes very still. Dull sage and cream,
      cool blue shade, ochre ground below. No drawn pulse icons or manual diagnostic instructions.
    calm: left
    lines:
      - {"who": "offpanel:sejin", "type": "speech", "side": "r", "text": "DARA. CHECK THIS PULSE."}
  - id: P22
    shape: strip
    gap: long
    bg: white
    silent: true
    camera: "extreme close-up on Taeo's expression as the clinicians exchange a look"
    art: >
      Taeo's eyes under the yard canopy catch Sejin and Dara's silent shared glance off
      frame. His rehearsed reassurance vanishes; RIGHT-eye mole and tense lower lids clear. Cool canopy
      blue, one warm sun edge on his black hair. No glowing chest, pain burst or chibi exaggeration.
    calm: none
  - id: P23
    shape: tall
    gap: short
    bg: white
    camera: "side view of Taeo on the cot with the privacy screen behind"
    art: >
      At the yard canopy Sejin helps Taeo settle on the portable cot for a supervised
      cardiac recording behind a plain folding privacy screen. Dara stands by his head, watchful.
      Hoodie loosened only as required, blanket over torso; no anatomical procedure detail. Cool cream/blue shade, sunlit ochre beyond, monitor plain shapes.
      Sejin is left, Dara centre by the head of the cot, Taeo right with his face visible above the blanket.
    calm: top
    lines:
      - {"who": "sejin", "type": "speech", "side": "l", "text": "WE'RE RECORDING YOUR HEART RHYTHM. DON'T GUESS FOR US."}
      - {"who": "taeo", "type": "nervous", "side": "r", "text": "SORRY. WHAT'S WRONG?"}
  - id: P24
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up on Dara beside the cot"
    art: >
      Dara (armour, oatmeal wrap) sits low enough to meet Taeo's eyes under the yard canopy.
      Her mouth is blunt, her gaze unexpectedly careful. Grey temple hair, dark braid, LEFT
      kit closed. Cool blue shade and cream bounced light. No healing light, no casual certainty about a cure.
      Dara is in the left third of the close-up.
    calm: right
    lines:
      - {who: dara, type: speech, side: l, text: "YOUR HEART ISN'T KEEPING A REGULAR RHYTHM."}
  - id: P25
    shape: strip
    gap: short
    bg: white
    camera: "overhead close detail of the paper recording beside the load log"
    art: >
      On the yard canopy's small table, a printed cardiac trace in abstract thin peaks lies
      beside the recoil log's staggered blank rows. Sejin's finger marks the record, Dara's hand
      holds its edge flat. Cool white-blue shade over dull cream paper; no readable labels in art or exact clinical waveform.
    calm: none
    ui:
      - {kind: label, text: "IRREGULAR RHYTHM · RESTING RECORD", at: [0.50, 0.80], size: 30}
    notes: "Story diagnosis: irregular resting heart rhythm, discovered before any live test. Do not specify a named arrhythmia, treatment regimen or numeric safe threshold."
  - id: P26
    shape: full
    gap: short
    bg: white
    camera: "Taeo's point of view from the cot toward both clinicians"
    art: >
      Sejin (sage scrubs) holds the paper recording under the yard canopy; Dara (slate armour)
      stands beside her, equally serious. They speak to Taeo, not over him. Nib waits beyond
      the privacy screen, worried adult face. Cool cream/blue, muted ochre background. No fantasy pulse joining anyone.
      Sejin stands left, Dara right, Nib waits centre beyond the screen; keep both clinicians faces visible.
    calm: top
    lines:
      - {"who": "sejin", "type": "speech", "side": "l", "text": "REPEATED RECOIL HAS AFFECTED MORE THAN YOUR ARMS."}
      - {"who": "dara", "type": "speech", "side": "r", "text": "NO MORE LOAD TESTS TODAY."}
  - id: P27
    shape: inset-r
    gap: short
    bg: white
    camera: "close frontal reaction of Taeo on the cot"
    art: >
      Taeo (black hoodie, blanket) on the yard cot reacts hugely but silently for a beat:
      eyes wide, mouth open, his apparent harmless position outside suddenly stripped away. RIGHT-eye mole,
      adult proportions. Cool blue canopy shade, white recording paper at frame edge. No nosebleed or collapse.
      Taeo is in the right third of the close-up.
    calm: left
    lines:
      - {"who": "taeo", "type": "speech", "side": "r", "text": "I WAS OUTSIDE THE GATE."}
  - id: P28
    shape: tall
    gap: short
    bg: white
    camera: "low side shot of Nib at the cot and Dara behind"
    art: >
      Nib (adult, boots, binoculars, LEFT notch and locked belt gear) stands at Taeo's cot
      in the yard canopy. He looks scared without letting his stance loosen. Dara waits
      behind him. Cool blue shade, cream blanket, ochre ground; no link pulse or glow.
      Nib stands left, Taeo rests centre on the cot with his listening face visible, Dara waits right.
    calm: top
    lines:
      - {"who": "nib", "type": "speech", "side": "l", "text": "YOUR BODY STILL TOOK THE IMPACT."}
      - {"who": "taeo", "type": "float", "text": "I'D NEVER REALLY BELIEVED THEY WERE WAITING FOR ME TOO."}
  - id: P29
    shape: full
    gap: long
    bg: white
    silent: true
    camera: "high shot over the canopy screen toward the waiting crew"
    art: >
      Beyond the privacy screen at ryu_practice_yard, Sera's sound hand rests on Orrin's slate
      shell; Kesh's antennae droop, Haein has put down her spanner. All look toward the
      canopy, unable to help by working harder. Southeast sun over muted ochre, brown shadows. No grief chibi or public crowd.
      Give the waiting crew room: Sera left, Orrin centre, Kesh centre-right and Haein right.
    calm: none
  - id: P30
    shape: full
    gap: short
    bg: white
    camera: "across Sejin's shoulder toward Dara at the canopy table"
    art: >
      Sejin (sage scrubs) and Dara (armour) review Taeo's recording privately at the yard canopy
      table while he rests in soft background shapes. Sejin's jaw is tight; Dara listens
      with scarred arms folded loosely. Cool blue/cream shade and dull olive. No tablets with invented readable data.
      Sejin stands left and Dara right, Taeo rests quietly in the centre background.
    calm: top
    lines:
      - {"who": "sejin", "type": "speech", "side": "l", "text": "CAN YOUR HEALING FIX HIS HEART RHYTHM?"}
      - {"who": "dara", "type": "speech", "side": "r", "text": "NO. CLOSING A WOUND WON'T FIX HIS HEART RHYTHM."}
  - id: P31
    shape: full
    gap: short
    bg: white
    camera: "medium two-shot of Sejin left and Dara right, scarred forearms and dressing tray below"
    art: >
      Dara rests both scarred forearms beside the unused dressing tray on the yard canopy
      table. Her hands stay open and still, no miracle offered. Sejin's folder remains within
      reach. Blue shade, cream cloth and matte slate edge; no light from hands, blood or open tools.
      Show both clinicians faces above the unused tray: Sejin left, Dara right with her hands open.
    calm: top
    lines:
      - {"who": "dara", "type": "speech", "side": "r", "text": "I CAN CLOSE WOUNDS. I CAN'T REPLACE BLOOD OR ERASE EXHAUSTION."}
      - {"who": "sejin", "type": "speech", "side": "l", "text": "WE AGREE ON THOSE LIMITS."}
  - id: P32
    shape: tall
    gap: short
    bg: white
    camera: "eye-level seated discussion beside Taeo's cot"
    art: >
      Sejin shows Taeo a plain referral envelope at the yard cot; Dara waits beside her,
      giving Sejin the lead. Taeo listens with his whole face, shame turning to attention.
      Cool blue canopy shade and cream paper, sunlit ochre outside. No address, prescription detail or new diagnosis on envelope.
      Sejin sits left with the envelope, Taeo centre on the cot and Dara sits right; all three speakers are drawn.
    calm: top
    lines:
      - {"who": "sejin", "type": "speech", "side": "l", "text": "YOU NEED A MEDICAL REVIEW AND REST. WE'LL SET NEW LIMITS AFTER THE FINDINGS."}
      - {"who": "taeo", "type": "speech", "side": "c", "text": "UNTIL THE REVIEW?"}
      - {"who": "dara", "type": "speech", "side": "r", "text": "NO LIVE LOAD TESTS."}
  - id: P33
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up of Taeo sitting upright on the cot"
    art: >
      Taeo (black hoodie, blanket on knees) sits at the yard cot, eyes on Sejin instead
      of an invisible interface. His hand deliberately leaves the equipment alone. Cool cream and
      blue shade, RIGHT-eye mole clear; no active monitor values or new bruise.
      Taeo is in the left third of the close-up.
    calm: right
    lines:
      - {"who": "taeo", "type": "speech", "side": "l", "text": "YES. PLEASE WRITE THE RESTRICTION DOWN WHERE I CAN SEE IT."}
  - id: P34
    shape: strip
    gap: short
    bg: white
    camera: "overhead on the clipboard turning toward Taeo"
    art: >
      At the yard canopy table Sejin turns a blank-topped clipboard toward Taeo's waiting hand;
      Dara holds the far edge. The three hands share the frame without touching bruises.
      Cream paper, muted sage sleeves, blue shade; leave a clear header band for the letterer.
    calm: none
    ui:
      - {kind: label, text: "NO LIVE LOAD TESTS · MEDICAL REVIEW REQUIRED", at: [0.51, 0.34], size: 31}
    notes: "Restriction persists into ch 88 (theory only); ch 89's supervised trial requires review, measured limits and Dara present."
  - id: P35
    shape: full
    gap: long
    bg: white
