chapter: 79
title: Aftermath
when: "Begins minutes after ch 78's clear at Chungju. Technical report that afternoon; the following afternoon in Seoul at the AAO. No calendar date fixed."
story_beats: PART_ONE_BEATS.md#79
cast:
  taeo: outdoor # Same navy jacket, black hoodie/cargos and striped sneakers; fresh recoil bruises, nosebleed stopped.
  nib: default # Exact ch 43 boots; persistent scout props, paper drawing, pencil and ID retained.
  sera: default # River clothes, braid, bone flute, bow in its case; injured LEFT arm still in brace and sling.
  sejin: default # Green scrubs, olive medical rig, dark cargos and field boots.
  haein: default # Beige shirt, blue-grey overalls, goggles up, tool belt.
  chae: default # Navy cardigan, white collar, black trousers and low heels, blank ID, blue folio tablet kept closed/dark.
  seoryun: default # TTOK message only; not physically present or drawn.
locations: [chungju_gate_site, aao_office]
location_notes:
  chungju_gate_site: >
    Follow ch 78: empty scaffold frame, entry closed, clear gravel apron, control trestle left and medical canopy right.
    Grey overcast light, cool slate shadows and muted orange safety equipment. No re-entry or remaining active gate.
  aao_office: >
    Follow locations/aao_office/key_wide.png, key_reverse.png and notes.md. Desk in northern half, two visitor chairs south
    of it, two dark monitors, east daylight window and blinds, northwest filing shelves, west navy bench by the southeast
    glass corridor entrance. No revolving door inside this room. The salvage tray sits temporarily on a wheeled cart.
props:
  nib_locks: >
    Adult 105 cm scout; LEFT ear notch, one LEFT lower fang, brown rope belt, RIGHT leather pouch with green dinosaur sticker,
    LEFT brown wooden sheath. Matte black 8x30 binoculars, fork on hinge, woven strap knot LEFT neck; exact purchased ch 43 boots.
    Cobalt pencil with carved fork, pale-blue ID, folded PAPER watch-post drawing protected in pouch. Ch 43 boots are matte
    dark-brown leather ankle boots, broad round toes, black low-heeled lug soles, four dull gunmetal eyelet pairs, dark-brown
    round laces double-knotted, heel pull tabs, oat-grey socks inside collars; no hooks, buckles, logos, steel caps or red stitching.
    No new patch or uniform.
  phone: "Taeo's dark-grey phone, clear case, green dinosaur sticker, single hairline crack top-left. Use kit hands for screen close-ups."
  recovery_net: >
    The CLOSED net returned with Nib in ch 78, containing broken relay masonry, silt and a rolled cable sleeve.
    Haein inventories it after safety and technical work; the cylinder remains concealed until this chapter's final sequence.
  cylinder: >
    Waterproof dull bronze message cylinder, one hand long, recessed screw cap, intact dark wax under its locking collar.
    Sera's settlement mark is engraved on the metal: COPY the exact mark already shown on the ch 62 settlement sign,
    not a new design. Worn river silt outside, dry seal inside. No written sender or date visible before ch 80.
palette_notes: >
  Chungju: grey daylight, slate and muted green; no live gate glow. AAO follows A4 blue-white institutional light and
  light slate shadows, navy cardigan and bench. Warm skin accents muted. Cyan reserved for operator UI, which does not
  appear in this chapter. All technical and legal pages are ordinary paper/phone records, not floating system windows.
continuity_notes: >
  The public technical record includes the unaltered Channel B command and false-clear reading, the failed outcome,
  the later assisted shot and the 0.8-second limit. Private medical records and unrelated personal data are not published.
  Sera chooses inclusion of her statement. The cooperative route is an untested legal path, not an issued licence;
  chapter 81 still supplies capital, premises, operator and safety requirements. No money changes hands here.

panels:
  - id: P01
    shape: tall
    gap: none
    bg: white
    camera: "medical-canopy chair height, facing Sera after the clear"
    art: >
      At chungju_gate_site Sera (default river clothes, braid, LEFT brace and sling) sits with the bow across her lap,
      the last tears drying on her cheeks. Sejin (default scrubs and medical rig) slides a plain clipboard toward her.
      ACTING: Sera's huge grin meets Sejin's immovable eyebrow. Overcast daylight, slate and river-green. No healed arm,
      form lettering or open gate.
      COMPOSITION: Sera sits on the left; Sejin stands on the right. Leave vertical room around the chair and sling.
    calm: top
    lines:
      - {who: "sera", type: "speech", side: "l", text: "THEY'LL SING ABOUT THAT SHOT."}
      - {who: "sejin", type: "speech", side: "r", text: "THEY CAN SING WHILE YOU REST."}
    notes: "Direct continuation of ch 78's hook; the laugh becomes a recovery instruction."

  - id: P02
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "extreme close-up of the stopped recorder beside Taeo's wrist"
    art: >
      At chungju_gate_site a grey technical recorder lies stopped on the trestle, its display dark. Taeo's bruised RIGHT
      forearm rests beside it; his thumb hovers over the protected playback control without pressing. ACTING in the hand:
      hesitation. Grey daylight, dull metal and navy cuff. No file names, active screen, text or magic light.
    calm: none

  - id: P03
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up from across the recorder on Taeo"
    art: >
      Taeo (outdoor, mole under RIGHT eye) at chungju_gate_site looks down at the recorder rather than Sera. His nose
      is clean now; fresh bruising shows at the cuffs. ACTING: relief receding before work he does not want to do.
      Grey daylight, plain slate background, no ghostly replay image or screen.
      COMPOSITION: Taeo fills the right third of this head-and-shoulders close-up.
    calm: left
    lines:
      - {who: "taeo", type: "speech", side: "r", text: "I NEED THE CHANNEL B RECORDING TOO."}

  - id: P04
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 79 · AFTERMATH"

