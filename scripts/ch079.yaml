      Haein (default overalls) lays out recorder, timing cards and battered test sheets at the left trestle. Taeo (outdoor)
      takes a chair opposite her; Nib (default, exact ch 43 boots and full scout props) sits nearby with the CLOSED
      recovery net at his feet. Grey daylight, cool slate shadows; no active slit or readable tags.
      COMPOSITION: Haein is left, Nib seated in the middle, and Taeo seated on the right; give each figure room vertically.
    calm: top
    lines:
