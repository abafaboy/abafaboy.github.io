      - {who: haein, type: speech, side: l, text: "THERE ARE TWO VERSIONS OF THE TEST SUMMARY."}
      - {who: taeo, type: speech, side: r, text: "WHY?"}

  - id: P06
    shape: wide
    gap: short
    bg: white
    camera: "over Taeo's left shoulder toward Haein's paired folders"
    art: >
      Haein (default) at chungju_gate_site taps two plain folders, one thin and one thick, without pushing either toward
      Taeo. ACTING: tired bluntness, mouth straight, waiting for him to decide. His navy shoulder and the old patch on
