      Taeo clutches the reservoir. Fluorescent white key, dot-eyed comedy; no tool injury, labels or interface.
      Chibi Haein stands left and chibi Taeo right, both complete figures with clear space between them.
    calm: left
    lines:
      - {who: haein, type: speech, side: l, text: "THE DEVICE. BOTH HANDS."}
