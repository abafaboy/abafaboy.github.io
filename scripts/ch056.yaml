chapter: 56
title: Semifinal
when: "Exhibition semifinal day, afternoon, directly after Sunline's GOOD ANSWER in ch 55. The final draw follows the semifinal. No calendar date is added."
story_beats: PART_ONE_BEATS.md#56
cast:
  taeo: outdoor
  nib: default
  orrin: default
  sera: default
  haein: default
  sejin: default
  minho: default
  baek: default
  do_gangjin: default
extras:
  meridian_lead: "Young adult Korean woman, cropped brown hair, navy high-collar Meridian jacket with silver shoulder yoke, navy utility trousers, black boots; left-chest split-bar pin. Disciplined, gracious competitor."
  meridian_bracer: "Stocky adult Korean man in the same navy/silver uniform, short hair, padded forearm shields."
  meridian_runner: "Lean adult Korean man in the same navy/silver uniform, tied-back black hair, blunt practice spear."
  official: "Adult woman, grey exhibition polo, slate trousers, headset, blank credential."
locations: [exhibition_arena, exhibition_service_corridor, exhibition_draw_stage]
location_notes:
  exhibition_arena: "No drawn key exists at drafting. Carry forward ch 50-55 venue architecture when available. Local geography: grey padded course floor below tiered stands; operator box behind the near clear safety barrier, service exit behind it. Competitors run away from that box toward the far targets. VIP enclosure high on the opposite side. Real arena, no gate crossing. Semifinal uses parallel identical lanes with pivot bridge, pendulum and weighted exit shutter."
  exhibition_service_corridor: "Under-stand corridor adjoining the operator box, cream concrete, fluorescent strips, equipment trestle and wide service doors."
  exhibition_draw_stage: "Small arena-side draw platform, broad access ramp for Orrin, blank bracket board at rear, officials' desk to stage right."
wardrobe_locks: >
  taeo: navy jacket over black hoodie, black cargos, black sneakers with one white stripe, mole under RIGHT eye;
  olive backpack with faded orange OLD shield/open-door patch stays on his operator chair during the heat.
  nib: adult 105 cm scout, pinkish-tan torn wrap, charcoal shorts, brown rope belt, pouch RIGHT with green dinosaur sticker,
  brown wooden sheath LEFT, V-notch LEFT ear, single LEFT lower fang, matte black 8x30 binoculars high on chest,
  strap knot LEFT neck, three-line fork on hinge. His ch 43 boots are matte dark-brown ankle-high leather work boots,
  broad round toes, four pairs dull gunmetal round eyelets, dark-brown round laces in small double knots,
  plain black lug soles/low heels, heel pull tabs, oat-grey short socks inside collars; no logo, hooks, buckles,
  bright trim or visible steel cap. Wear this identical pair throughout, never the barefoot model-sheet feet.
  His pale-blue ID, folded PAPER post drawing and cobalt-blue fork-marked pencil stay secured in his pouch.
  sera: adult 27, ordinary human ears, thick dark-brown braid, river-green wrap over cream sleeves, sand cropped trousers,
  brown ankle boots, LEFT bracer and bow hand, RIGHT-shoulder quiver, bone flute RIGHT hip. Blunt exhibition arrows.
  orrin: adult 230 cm long, four columnar legs, stacked-slate shell, dry heavy-lidded face; healed ch 38 crack remains a seam.
props:
  reservoir: "Match ch 50: hand-sized rectangular dull-steel housing, split copper retaining band, ivory ceramic inspection window, two capped coupling ports, short grey webbing strap, analogue white indicator tab and manual release. Empty and idle during semifinal."
palette_notes: >
  Arena extends A4 institutional blue-white: overhead white lamps, cool slate shadows, muted navy seating;
  no supernatural sky or return marks in this built course. Corridor uses the same cool fluorescent key.
  Link amber belongs only to Nib's permitted pulse in Taeo's RIGHT palm; Orrin's separate pulse is slate-green.
  No Sera link colour is established or needed. Force paths are staging and speed strokes, never magical laser beams.
  Signs, score faces and credentials stay blank for label UI. Screens are dark unless explicitly filled.
panels:
  - id: P01
    shape: strip
    gap: none
    bg: white
    camera: "extreme close-up of Taeo's mouth from Sunline's side"
    art: >
      taeo, outdoor, in exhibition_service_corridor under a cold fluorescent strip, presses his lips together
      against an astonished smile after Sunline has walked off. One hand grips the navy jacket zipper.
      Cool slate shadows, muted cream wall. No Sunline portrait, signs or screens; keep the right edge empty.
    calm: right
    lines:
      - {who: taeo, type: float, text: "I GOT ONE ANSWER RIGHT TODAY."}
    notes: "Starts on the immediate emotional consequence of ch 55's GOOD ANSWER; no agency deal accepted. ch055 was absent at start."
  - id: P02
    shape: full
    camera: "low two-shot across the corridor trestle"
    art: >
      exhibition_service_corridor, fluorescent blue-white. haein, slate overalls over beige tee, safety glasses on
      her black bob, holds out the reservoir; taeo in navy jacket reaches with both hands like receiving a fragile bowl.
      Haein is unimpressed; Taeo tries to look professional. Grey trestle, closed tools. No readable labels or lit screens.
      Haein stands on the left, Taeo on the right; leave room for both bodies and the trestle.
    calm: top
    lines:
      - {who: haein, type: speech, side: l, text: "STOP SMILING. HOLD THE RESERVOIR."}
      - {who: taeo, type: speech, side: r, text: "SORRY. CAN I DO BOTH?"}
