      - {text: "VMM", style: gate, at: [0.76, 0.62], size: S, rot: 0}
    notes: "Motif, first appearance: the knock. The SFX spells TTOK on purpose: 똑똑 is 'knock knock', the messenger app's name (ch 11 letters its knocks the same way). Taeo goes up to the frame, never through it."

  - id: P50
    shape: wide
    gap: short
    bg: white
