      and turned his head to glare at it over his shoulder; it has stopped too, its two dot eyes on him, perfectly blank. Haein, carrying the radio crate
      past, explains without breaking stride and tips her head at the crew member (its summoner, at the edge of frame). Taeo, behind her, winces. Hard
