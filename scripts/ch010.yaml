  - id: P49
    shape: tall
    gap: short
    bg: white
    camera: "low, side-on along the walkway at the frame"
    art: >
      Taeo, in the borrowed red-orange vest over his navy jacket, has walked past the floor tape up to the gate on his own, every line of his body afraid of it: knees soft, shoulders up, his left hand clenched
      at his side, sweat at his temple. He knocks twice with the knuckles of his right hand on the steel of the door frame, a hand's width from where the
      cold white-cyan rim meets it. The black-violet slit fills the frame beside him from floor to lintel, lavender light at its edges; the removed steel
