chapter: 10
title: Day Rates
when: "Monday 10 April, the Monday after the ch 9 ruling (by ch 6–7's count the review fell due on Saturday 8 April); no weekday or date is lettered. 6:41 AM the flat; 6:52 AM the yard; 7:01 to about 8:45 AM the office container (Sejin arrives about 7:30; the safety film at 8:10); 9:20 AM the van; 9:48 to about 10:00 AM the subway maintenance tunnel, where Nib crosses at about 10:00 AM. The first leg runs 40 minutes, so ch 11's knock falls at about 10:40."
story_beats: PART_ONE_BEATS.md#10
cast:
  taeo: outdoor     # P01: default (the black hoodie he slept in). P07–P10: navy zip jacket on ONE arm only, one sneaker unlaced, toothpaste at his mouth. From P14: jacket on properly. From P46: a borrowed red-orange Ryu Survey safety vest over the navy jacket and the clipboard log in his hands (as ch 11 has him). Olive backpack with the faded orange patch throughout (on the radio table at the site)
  nib: default      # barefoot; V-notch LEFT ear; one lower fang LEFT; brown rope belt; leather pouch on the RIGHT hip with Haru's small dinosaur sticker (ch 8); brown wooden sheath on the LEFT hip. His ch 9 ID card (pale blue, rounded corners, the scowling photo) lives in the pouch (held up in P02–P04 and P43), with Chae's glossy survey print from ch 9 (shown in P11 and P41) and his folded drawing. A Ryu handheld radio in his LEFT hand from P46
  minho: default    # grey streak at the LEFT temple; radio clipped high on his LEFT chest; watch on his LEFT wrist. P06–P11 asleep, then waking, in the clothes he slept in. At the site (P42–P57): white hard hat with a headlamp, a survey tablet under his arm, screen dark (as ch 11)
  haein: default    # work overalls, tool belt, clear safety glasses pushed up on her head. From P42: a red-orange safety vest over the overalls (as ch 11)
  sejin: default    # FIRST APPEARANCE (P23, name plate). CHARACTER_BRIEF_2 #3: practical field gear, a medic's chest rig, cropped hair, tired eyes. A hard-shell medic case; a takeaway coffee in the container
extras:
  seonhee: "Ryu Seonhee, Minho's mother, late fifties, about 158 cm: Minho's strong eyebrows; a short practical bob with grey roots; reading glasses usually pushed up into her hair; a pencil behind one ear; a moss-green cardigan over a navy fleece vest, sleeves pushed up; dark trousers; indoor slippers. Brisk, warm, tired; quick hands. She runs Ryu Survey's books."
  dongsik: "Ryu Dongsik, Minho's father, about sixty: broad shoulders and heavy forearms, close-cropped iron-grey hair (the family's early grey), a weathered face with laugh lines; a faded navy fleece with a plain shield logo (no letters) over a check shirt; a grey blanket over his knees. He has used a manual wheelchair (black frame, worn grey push rims) since a survey accident. Quiet, wry, kind."
  crew: "Ryu Survey crew member, the stocky man in his forties from ch 7 (the only crew member on this job, as in ch 11): red-orange safety vest over work clothes, a white hard hat with a headlamp (clipped to his belt in the container), a chest-mounted survey camera rig. He is the mule's summoner. Calm, practical, few words."
  mule: "the crew's construct mule (the ch 11 design): a hauling construct the size of a small pony, built like a mule from jointed pale-grey timber with riveted iron bands; four blocky legs with flat wooden hooves; a long blank wedge-shaped head with two dot eyes and no mouth; a canvas pack harness with pannier frames for cases. Slow, literal, plodding; it follows whoever walks directly in front of it. Registered equipment. Never cute outside chibi."
  gma_warden: "a GMA site warden: a woman in her forties in a navy GMA windbreaker with a reflective band and a blank badge, an ID lanyard, a rugged tablet; brisk, bored, procedural. Posted at the foot of the tunnel's access stair."
  psa_mascot: "the mascot of the GMA safety film, seen only inside the film: a round-headed cartoon porter in a yellow hard hat and a hi-vis vest, with a backpack bigger than he is and a huge grin; drawn in the film's flat cartoon style"
locations: [taeo_flat, ryu_yard, ryu_office, ryu_van, metro_maintenance_tunnel]
location_notes:
  taeo_flat: "LOCATIONS.md key, morning look. Looking in from the door (west): kitchen strip LEFT, the low pale-wood folding table in the middle, the bed far right with its head against the east window wall. Nib's watch spot is the floor against the bed's drawers, between the bed and the folding table."
  ryu_yard: "LOCATIONS.md id (12 minutes' walk from the flat); the lot ch 7 drew as ryu_practice_yard, so use the world/keys/ryu_practice_yard image for its layout. Follow ch 7 and ch 12 where that key differs: the site-office container is WHITE, on the LEFT as seen from the gate, with a short metal wheelchair ramp up to its door (ch 12; for Minho's father); three white vans with plain shield logos along the far fence, the MIDDLE one carrying the bright blue Bluebird sticker and red seizure strip. Seen here at 6:52 AM: low sun from the east (right of frame)."
  ryu_office: "No key yet. Inside the yard's office container: 6.0 × 2.4 m, long axis north–south, ceiling 2.3 m. The door is in the middle of the EAST wall with one window just north of it. Looking in from the door: a padded bench along the back (west) wall facing the door (Minho sleeps on it), with a small fridge, an electric kettle and a jug of barley tea beside it and a shelf of files above; at the LEFT (south) end, Seonhee's desk facing the south wall (ledger, a calculator with a paper roll, a cash box, a desk lamp), and above it on the south wall a corkboard pinned with paper notices, each with a small blue bird logo in its top corner and red ink stamps; at the RIGHT (north) end, Dongsik's corner: the company radio base station on a desk at wheelchair height, a wall map with coloured pins, and a framed photo of a younger Dongsik standing in a survey vest with a boy of about eight and a toddler girl. In the middle: a folding table with a battered laptop, a few plastic stools and upturned crates, a gas heater. One fluorescent tube; Seonhee's desk lamp; morning sun through the east window and the open door. No readable text anywhere."
  ryu_van: "No key yet. A white Ryu Survey van (not the one with the sticker): a long-wheelbase passenger-cargo van; behind the driver's row, one rear bench seat; behind the bench, the cargo area where the mule rides with the packs."
  metro_maintenance_tunnel: "ch 11's id and layout, kept exactly. An out-of-service subway maintenance spur off Line 6: a single concrete horseshoe tunnel about 5 m wide. Seen from the staging end: dull old rails in a concrete track bed on the RIGHT; a raised concrete maintenance walkway about 1.2 m wide along the LEFT wall, its edge a plain kerb about 80 cm above the track bed. Cable trays and conduit on both walls; a de-energised overhead line tied back. Ahead in the LEFT wall, the steel door frame of a cross-passage, its steel door taken off and leaning against the wall beside it; the gate stands exactly inside that frame: a door-height black-violet slit with a cold white-cyan rim that spills a wedge of lavender light across the walkway. The steel frame is the frame of the knock. A strip of yellow-and-black floor tape crosses the walkway 2 m in front of the frame (the line). Just behind the tape, the staging area: a folding table side-on against the wall (a base radio with a coiled handset; Haein's second radio, opened, with a long whip antenna aimed at the gate; a small digital stopwatch with a blank pale LCD face; a clipboard log; a thermos; Taeo's olive backpack, patch out), one folding stool (Haein's), two tripod work lamps with cordon tape between them, and an upturned plastic crate a few metres further back against the wall (Sejin's seat). The access stair is about 30 m back along the walkway from the staging area; the GMA warden's post (a folding barrier and a small table) is at its foot. Trains run in the next tunnel about every five minutes; their rumble comes through the RIGHT wall. Far down the tunnel past the gate, one small green emergency light (no text). Light: the two work lamps, hard white."
palette_notes: "Flat: ART_BIBLE A4 morning (cool grey-blue daylight, soft blue shadows, one yellow band of sun from the curtain gap). Yard at 6:52 AM: the A4 survey-yard ochre and warm brown cooled by early light: pale sky blue, long blue-grey shadows, warm low sun on the container's flank. Office container (not in A4): cream fluorescent and warm desk-lamp yellow, brown shadows, a hard block of morning sun from the east window; the only saturated notes are the small blue bird logos on the notices and their red stamps. Safety film: a flat bright public-information palette (sunny yellow, grass green, sky blue, white), never the interface cyan or the link amber. Van: muted daylight greys. Tunnel (as ch 11): hard white work-lamp light on raw concrete grey, deep blue-grey shadows; the gate's violet-black core and lavender spill are the one cold colour; the red-orange vests are the warm accent (never the link amber). The return mark (P31 in the film, P56 on Nib) is a thin ring of cold rim-white light, never interface cyan. Amber #F2A93B appears only in Nib's eyes and in Taeo's palm (P55, and its last fleck in P57). Red appears only in the Bluebird stamps (P06, P13). There are no operator-interface windows in this chapter: the interface stays dark until ch 19."

panels:

  # ---------------- COLD OPEN ----------------
  - id: P01
    shape: tall
    gap: none
    bg: white
    silent: true
    camera: "high angle from above the folding table, looking toward the bed and the east window"
    art: >
      Taeo's studio flat (taeo_flat key), 6:41 AM, the desk lamp off. Morning look (ART_BIBLE A4): cool grey-blue daylight, soft blue shadows,
      one hard yellow band of low sun through the gap in the grey-blue curtain of the east window. Upper part of the frame: the bed, head against
      the window wall, where Taeo (taeo, default: the black hoodie he slept in, hair flattened on one side, small mole under his RIGHT eye) has just
      pushed himself up on one elbow with the duvet in a heap, looking down over the edge of the bed. His face is dropping from sleepiness into
      fear: eyes widening, lips parting. Lower part of the frame, on the floor against the bed's storage drawers, the spot where Nib sits watch every
      night: Nib's spare blanket (a plain grey-blue fleece) folded into a precise, hard-edged square and squared to the drawers like a soldier's kit,
      the floor around it empty. On the folding table in the near foreground: the plain white mug with one thin green band, washed and turned upside
      down. The olive backpack, faded orange shield-and-door patch facing out, hangs on the clothes rack's end hook. Nobody else is in the room.
      No glow, no phone light, no Nib, no text.
    calm: none
    notes: "Nib has left on his own (ch 9 hook: 'I DIDN'T ASK YOU TO.'). It quietly turns ch 2 and ch 8's 'HE'LL FIND MY PLACE EMPTY' around: now Taeo finds Nib's place empty. Never point at it."

  - id: P02
    shape: full
    gap: long
    bg: white
    camera: "establishing, eye level from the yard's south vehicle gate, early morning"
    art: >
      The Ryu Survey west practice yard (ryu_yard; layout from the ryu_practice_yard key) at 6:52 AM on a cold April morning, seen from the yard gate.
      Low early sun from the right (east) throws long, hard shadows across the dusty ochre dirt and the plywood maze walls; the sky is pale and clear.
      LEFT: the white site-office container with one window lit warm from inside and a short metal wheelchair ramp up to its door. Along the far fence:
      three white vans with plain shield logos, the middle one with the bright blue sticker and red seizure strip on its side door. At the top of the ramp,
      by the shut door, small in the frame and perfectly upright like a sentry at his wall, stands
      Nib (nib, default: barefoot, V-notch in the top of the LEFT ear, brown rope belt, leather pouch on the RIGHT hip with a small dinosaur sticker,
      brown wooden sheath on the LEFT hip; adult and wiry). He holds his new ID card in both hands in front of his chest (from ch 9: a plain pale-blue
      plastic card with rounded corners and a small photo of him scowling; no readable marks) and watches the container door. He is alone. Palette: survey-yard ochre and
      warm brown cooled by early light: pale sky blue, long blue-grey shadows, warm sun on the container's flank. No other people. No readable text.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "RYU SURVEY · WEST PRACTICE YARD · 6:52 AM"}
      - {who: taeo, type: float, text: "I KNEW WHERE HE'D GONE."}
    notes: "Twelve minutes' walk from the flat (LOCATIONS.md). The card is ch 9's (P51–P52). The ramp is for Minho's father (ch 12 keeps it). The stickered middle van is the one Bluebird tows in ch 12."

  - id: P03
    shape: inset-r
    gap: short
    bg: white
    camera: "low, from the top of the ramp at Nib's eye level, looking up at the opening door"
    art: >
      The container door has swung open outward. In the doorway stands Ryu Seonhee (extras.seonhee): reading glasses pushed up into her hair, a pencil
      behind one ear, a steel thermos mug in one hand, the other hand still on the door handle. She looks down at the small barefoot visitor at the top of
      her ramp with brisk, unimpressed surprise: eyebrows up, mouth pursed. Warm desk-lamp light and cream fluorescent behind her; cold morning light on her face.
      Simplified interior shapes behind her.
    calm: left
    lines:
      - {who: seonhee, type: speech, side: r, text: "...IT'S NOT EVEN SEVEN."}

  - id: P04
    shape: wide
    gap: short
    bg: white
    camera: "over Seonhee's shoulder in the doorway, looking down at Nib on the ramp"
    art: >
      Over Seonhee's shoulder (her cardigan shoulder and the back of her head in the near foreground, left). Below her on the metal ramp, Nib holds his ID card
      up at arm's length toward her face like a pass at a checkpoint: chin level, ears up, amber eyes steady, a completely serious deadpan. His one small
      lower fang on the LEFT just shows. His long morning shadow stretches back across the ochre dirt toward the maze. Low sun from the right, hard
      shadows. Keep the top right of the frame plain sky and fence.
    calm: top-right
    lines:
      - {who: nib, type: speech, side: r, text: "I'M A PERSON NOW. ON PAPER."}
      - {who: nib, type: speech, side: r, text: "I WANT WORK. INSIDE."}
    notes: "Continues ch 9's hook ('I WANT TO GO IN.' / 'I DIDN'T ASK YOU TO.'). 'INSIDE' means gate work. The ruling (registered arrival, person, status pending) is what makes him hireable and insurable."

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 10 · DAY RATES"

  # ---------------- THE CONTAINER ----------------
  - id: P06
    shape: full
    gap: long
    bg: white
    camera: "establishing, from the north end of the container behind Dongsik's wheelchair, looking south down its length"
    art: >
      Inside the Ryu Survey office container (ryu_office, see location_notes): narrow, cluttered, warm. Near foreground right: Ryu Dongsik
      (extras.dongsik) in his manual wheelchair at the radio base station, a mug in his hand, turned in his chair to watch the visitor with quiet, wry
      amusement; on the wall beside him, the small framed photo of a younger Dongsik standing in a survey vest with a boy and a toddler girl. Middle:
      Nib sits very upright on an upturned plastic crate by the folding table, both hands round a paper cup of barley tea, steam rising, his ID card
      tucked into the pouch on his RIGHT hip. RIGHT, along the west wall: the padded bench, where a man sleeps under a brown work jacket, face hidden,
      one work boot sticking out (Minho). LEFT: the closed door in the east wall and the window beside it, a hard block of low sun falling across the
      floor. Far end (south): Seonhee back at her desk with the open ledger, the calculator and the desk lamp, half turned toward Nib, one thumb jerked
      at the bench; above her desk the corkboard of pinned notices, each with a small blue bird logo in its top corner and red ink stamps, one sheet
      with a big red stamp (all printed matter drawn as grey blocks). Light: the fluorescent tube, the warm desk lamp and the sun block. Palette: cream
      fluorescent, warm lamp yellow, brown shadows; the blue bird logos and the red stamps are the only saturated notes. No readable text anywhere.
    calm: top
    lines:
      - {who: seonhee, type: speech, side: r, text: "HE'S ASLEEP. YOU CAN WAIT."}
      - {who: seonhee, type: speech, side: r, text: "DRINK THAT. YOU'RE GOING BLUE."}
      - {who: nib, type: speech, side: c, text: "I'M GREEN."}
    notes: "Beat: Ryu Survey's office container. Seonhee runs the books; Dongsik uses a wheelchair; Bluebird notices on the wall. Minho slept in the office (bids were due). Lock this layout for P06–P40."

  - id: P07
    shape: tall
    gap: short
    bg: white
    camera: "low, from the floor by the bench, looking across at the door in the east wall"
    art: >
      BIG REACTION. The container door has been flung open so hard it has banged back against the outside wall; low sun floods in behind the figure.
      Framed in the doorway, Taeo (taeo, outdoor, badly: the navy zip jacket on ONE arm only, the other sleeve flapping; the black hoodie; one sneaker
      unlaced, laces trailing; the olive backpack with its faded orange patch hanging off one shoulder) clutches the door frame, gasping, chest heaving.
      Bed hair sticking up on one side, a smear of white toothpaste at the corner of his mouth, eyes huge with panic and relief, mouth wide on the shout;
      the mole under his RIGHT eye. Speed lines behind him. Keep the top of the frame plain wall above the door.
    calm: top
    lines:
      - {who: narr, type: tag, text: "7:01 AM"}
      - {who: taeo, type: shout, side: c, text: "NIB!"}
    sfx:
      - {text: "BANG!", style: impact, at: [0.82, 0.26], size: L, rot: 10}

  - id: P08
    shape: wide
    gap: short
    bg: white
    camera: "side-on two-shot at seated eye level"
    art: >
      LEFT: Nib on his crate, paper cup in both hands, does not get up; he turns only his head and gives Taeo a flat, unbothered deadpan stare.
      RIGHT: Taeo, bent double just inside the door with his hands on his knees, gasping, looks up at him through his fringe, exasperated almost to
      tears. Simplified container interior behind them; the block of sun across the floor between them.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "YOU'RE LATE."}
      - {who: taeo, type: intense, side: r, text: "YOU DIDN'T LEAVE A NOTE!"}
      - {who: nib, type: speech, side: l, text: "I FOLDED THE BLANKET."}
    notes: "Nib's 'note' is the folded blanket of P01 (Grandpa, ch 8: 'THEN HE'LL KNOW YOU DIDN'T RUN.'). Don't explain it."

  - id: P09
    shape: inset-l
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag. Chibi Taeo (navy jacket on one arm, backpack with the patch) stands frozen with a huge fluffy white toothpaste-foam beard, like a comic
      Santa, sweat drops flying. Chibi Seonhee (glasses in her hair, pencil behind her ear) holds out one tissue between two fingers at arm's length,
      deadpan. Behind them a tiny chibi Dongsik in his wheelchair laughs with his eyes squeezed shut. Flat cream background with screentone dots.
      No text.
    calm: right
    lines:
      - {who: seonhee, type: speech, side: r, text: "YOU HAVE TOOTHPASTE ON YOUR FACE."}
      - {who: taeo, type: nervous, side: l, text: "...SORRY. GOOD MORNING."}
    notes: "Dongsik has no chibi sheet: derive him from extras.dongsik."

  - id: P10
    shape: wide
    gap: short
    bg: white
    camera: "low, from the floor at the north end of the bench"
    art: >
      Back to normal style. On the bench along the west wall, Minho (minho, default: brown work jacket sliding off him, grey T-shirt, olive cargo
      trousers, knee pads, work boots; watch on the LEFT wrist; the grey streak at his LEFT temple sticking straight up from the pillow) has jolted awake
      and rolled half off the bench, one boot on the floor, squinting, hair wrecked, furious at being woken. Behind him, drawn simply: Nib on his crate
      points straight at Taeo with one olive finger without looking at him; Taeo, wiping his mouth with the tissue, flinches. Fluorescent light, a strip
      of sun on the floor.
    calm: top-left
    lines:
      - {who: minho, type: speech, side: l, text: "WHO'S SHOUTING?"}
      - {who: nib, type: speech, side: r, text: "HIM."}
    sfx:
      - {text: "THUD", style: quiet, at: [0.28, 0.84], size: S, rot: -6}

  - id: P11
    shape: wide
    gap: short
    bg: white
    camera: "over Nib's shoulder toward Minho on the bench"
    art: >
      Over Nib's right shoulder (the back of his spiky head and his long LEFT ear with its V-notch at the left edge of frame; he has set his cup down and
      holds up Chae's glossy survey print from ch 9: a pale grey cliff gallery under a lavender sky with a band of white stone far along it, drawn small,
      no text). Minho now sits on the edge of the bench, elbows on knees, rubbing his face with one hand; he stops and looks up at the print between his
      fingers: awake now, recognising the gate, and careful about it. The shelf of files above him. Fluorescent light.
    calm: top-right
    lines:
      - {who: nib, type: speech, side: l, text: "THE GATE ON CHAE'S LIST. THE ONE WITH THE WHITE STONE."}
      - {who: minho, type: speech, side: r, text: "...THE LINE 6 TUNNEL. CHAE CALLED. THAT'S OURS."}
      - {who: minho, type: speech, side: r, text: "E-GRADE. WE GO IN AT TEN."}
    notes: "Chae's open-gate list (ch 9 P57–P58: 'Full survey: not yet scheduled' on Saturday; she printed Nib the entrance still). Ch 10 names it: an out-of-service Line 6 maintenance spur. Chae phoned Minho after the hearing; Ryu Survey bid for the full survey over the weekend and won it. ch 11 pays the white stone off (P07)."

  - id: P12
    shape: inset-r
    gap: short
    bg: white
    camera: "from beside Seonhee's desk at the south end, looking north past her"
    art: >
      Seonhee in the right foreground at her desk, glasses now down on her nose, writing in the ledger and NOT looking up; her pencil hand moves.
      Beyond her on the left, small, Minho on the bench gives his mother a sour, tired look. The desk lamp warm on the ledger page (lines as grey
      squiggles).
    calm: left
    lines:
      - {who: seonhee, type: speech, side: r, text: "HE BID LOW FOR IT."}
      - {who: minho, type: speech, side: l, text: "MUM. WE BID LOW FOR EVERYTHING."}
    notes: "Ryu Survey wins work by underbidding. Minho wanted this one for Nib and won't say so. 'MUM' tells the reader who she is; her name (Ryu Seonhee) is not lettered yet."

  - id: P13
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "extreme close-up, tracking along the corkboard above Seonhee's desk"
    art: >
      The corkboard, close: a row of overlapping paper notices held with coloured pins, each with a small blue bird logo in its top corner and red ink
      stamps on most of them; in the middle, one sheet with a big red rectangular stamp. Tucked between them, an old sun-faded child's crayon drawing
      of a van. All printed matter is grey blocks and the stamps are plain red shapes. Warm lamp light from below.
    calm: none
    ui:
      - {kind: label, text: "FINAL NOTICE", at: [0.52, 0.44], size: 34, color: "#C62828", rot: -6, notes: "stamped look; move onto the big red stamp once the art exists"}
    notes: "Bluebird Capital, Ryu Survey's creditor. The debt figure stays hidden (ch 7 note: until ch 26)."

  - id: P14
    shape: wide
    gap: long
    bg: white
    camera: "eye level with Nib, side-on"
    art: >
      Minho, jacket back on, crouches on his heels in front of Nib's crate so that their eyes are level, the way he did in the yard in ch 7: he makes
      the offer to Nib, directly and businesslike. Nib listens with his ears up, very still, hands on his knees. Behind Minho at the frame edge, Taeo
      (now with the jacket on properly) stands holding the crumpled tissue, half cut off, outside the conversation. Simplified container wall; fluorescent
      light.
    calm: top
    lines:
      - {who: minho, type: speech, side: r, text: "SPOTTER. YOU WALK AHEAD, YOU LOOK, YOU TELL US."}
      - {who: minho, type: speech, side: r, text: "DAY RATE. SIXTY THOUSAND."}
      - {who: narr, type: footnote, text: "*₩60,000 ≈ US$44"}
    notes: "Beat: Minho's offer. ₩60,000 a day, insured (P18). ch 11 P47 pays it in full for a short day."

  - id: P15
    shape: full
    gap: short
    bg: white
    camera: "low angle up at Minho standing, the back of Nib's head in the foreground"
    art: >
      Minho has stood up. In the near foreground, low: the back of Nib's spiky head and his notched LEFT ear. Minho, framed against the fluorescent tube,
      explains the chain with one flat hand stepping down through the air three times like stairs: calm, matter-of-fact, the grey streak at his LEFT
      temple catching the light. Behind him the corkboard of notices is a soft pattern of blue and red shapes. Keep the top of the frame plain ceiling.
    calm: top
    lines:
      - {who: minho, type: speech, side: r, text: "THE SUBWAY COMPANY PAYS A CLEAR TEAM. THE CLEAR TEAM PAYS US TO MAP IT FIRST."}
      - {who: minho, type: speech, side: r, text: "WE PAY YOU."}
      - {who: nib, type: speech, side: l, text: "AND WHO DO I PAY?"}
    notes: "Issue (Arc II): the subcontracting chain, and who is at the bottom of it."

  - id: P16
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up, front on Minho"
    art: >
      Minho, close: he rubs the back of his neck and answers honestly, without a smile; a flicker of shame he doesn't hide, his tired eyes on Nib.
      Plain warm-grey background.
    calm: right
    lines:
      - {who: minho, type: speech, side: l, text: "NOBODY."}
      - {who: minho, type: speech, side: l, text: "YOU GO FIRST."}
    notes: "The title's idea, said as a fact of the trade. Do not underline it."

  - id: P17
    shape: wide
    gap: short
    bg: white
    camera: "two-shot from Minho's position"
    art: >
      Taeo has stepped in from the right, leaning forward with one hand raised like a man haggling at a market stall: earnest, worried, a little
      indignant on Nib's behalf. Nib, on his crate at the left, lifts one olive palm toward Taeo without even looking at him: stop. His eyes stay on
      Minho (off frame). Simplified background.
    calm: top
    lines:
      - {who: taeo, type: speech, side: r, text: "SIXTY FOR A WHOLE DAY? I MAKE MORE STACKING NOODLES."}
      - {who: nib, type: speech, side: l, text: "I CAN COUNT."}
      - {who: nib, type: speech, side: l, text: "THREE YARD JOBS."}
    notes: "Taeo answering for Nib (his flaw). Nib's yard jobs paid ₩20,000 each (ch 7, ch 9)."

  - id: P18
    shape: wide
    gap: short
    bg: white
    camera: "medium, Seonhee swivelled round in her desk chair, the corkboard behind her"
    art: >
      Seonhee has swivelled her chair round to face them, glasses down on her nose, pencil pointed at Taeo like a ruler: brisk and practical, someone
      who does this sum every month. The corkboard of notices behind her on the south wall; the desk lamp warm at her side.
    calm: top-right
    lines:
