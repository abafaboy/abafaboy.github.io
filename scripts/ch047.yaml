chapter: 47
title: Not for Free
when: "Monday late morning, immediately after ch046's map hook. The film-crew emergency, a short paid rescue that afternoon, news after returning, operator-exam registration and cake at the Ryu yard that evening. No calendar date fixed."
story_beats: PART_ONE_BEATS.md#47
cast:
  taeo: outdoor # Navy zip jacket over black hoodie, black cargos, single-white-stripe sneakers, olive old-patch backpack. Jacket off inside home that evening. Persistent forearm bruises; does no load share, remains outside gate.
  nib: default # Adult scout; exact ch043 boots, full belt props and binoculars. Borrowed drilled white Ryu helmet only during site work P22–P40, removed before yard return.
  sera: default # River-green wrap/cream short sleeves, sand cropped trousers, brown ankle boots, LEFT bracer/bow, RIGHT-shoulder quiver and RIGHT-hip flute. Unlinked throughout.
  orrin: default # Rests at Ryu yard throughout; upper LEFT-front shell crack and protective dressing persist. No expedition, load or new injury.
  minho: default # Supervises Ryu's existing contracted line at film gate, outside; brown jacket, grey tee, olive cargos, knee pads, boots, LEFT grey streak and watch, chest radio. Returns with cake in evening.
  sejin: default # Paid medic, sage scrubs/olive rig/charcoal cargos; outside at gate, later yard.
  baek: default # News testimony only, not physically at yard. Navy field-command coat over dark suit, silver temples, LEFT lapel guild pin.
extras:
  producer: "Production company duty producer, woman about forty-five, heard by phone only. Initially defensive about budget and insurance; authorises the fee herself. No separate visible design."
  director: "Stranded film director, man about thirty-five, short swept black hair, grey windbreaker and dark work trousers, small slate script folio; frightened, ashamed, intact."
  camera_operator: "Stranded camera operator, woman about thirty, dark bob under plain navy cap, beige utility vest over charcoal shirt, dark trousers; twisted LEFT ankle, conscious, can hobble with help. Compact shoulder camera set down safely."
  sound_operator: "Stranded sound operator, man about forty, close-cropped hair, moss-grey work shirt, charcoal trousers, padded headphones around neck; boom pole left on ground when ordered, intact."
  reed_lizard: "Small non-boss dungeon predator, waist-high to an adult, long low chalk-grey body, six short hooked feet, narrow jaw and muted danger-red eyes; territorial, not sapient, not a cute pet. No human equipment."
  newsreader: "KNN 24 broadcast voice only; no on-site reporter or invented named presenter."
locations: [ryu_practice_yard, mapo_film_gate_rim, mapo_film_gate_inside]
location_notes:
  ryu_practice_yard: "Canonical keyed south double gate, southwest grey OFFICE, southeast white van, fixed central plywood zigzag, three north targets, west equipment trestle. Taeo's separate home container has low table, bedding, family-photo shelf, father-ID envelope, original green-banded mug and three crew rules on wall. Door is propped open all evening. Poster goes on existing SOUTH fence beside gate; do not change compound or place the home inside keyed office."
  mapo_film_gate_rim: "New unkeyed licensed D-grade filming/survey site in a Mapo gate-zone service court. Door-height black-violet slit in a square scaffold frame on level concrete, barrier opening south. Ryu operator table and white/blue cable drum west, Sejin's first-aid mat east, clear return lane centre, production cases behind barrier. Minho's survey contract already covers line monitoring; this is an additional paid rescue order through Ryu, not an unlicensed independent guild dispatch. No public crowd."
  mapo_film_gate_inside: "Lavender-noon sky, pale limestone terraces and low slate ridges under grey reed roots; violet shadows. White survey cable with blue metre bands follows the stable left/inland path; grey relay tripods every 50 m. Posted turnback at 20 m. Three filmmakers went off the permitted filming strip to a root alcove near the 50 m relay. No boss shown or killed; gate stays open. A plain dark fabric reflector hung from a crossbar on two portable stands at their shoot can drop when one exposed support cord is cut; its fall briefly screens the lizard. Geography shown before the shot."
props:
  boots: "Nib ch043 matte dark-brown ankle-high leather, broad round toe, four dull gunmetal eyelet pairs, dark-brown round double-knotted laces, black lug soles/low heels, heel pull tabs, oat-grey socks inside collars. No hooks, buckles, logos or steel cap."
  nib_gear: "Adult 105 cm, LEFT V-notch, one LEFT lower fang, brown rope belt, dinosaur-stickered RIGHT pouch, LEFT brown WOODEN sheath, charcoal repair RIGHT outer thigh. Matte-black 8x30 binoculars high, black strap knotted LEFT neck, Kett fork hinge. Pale-blue ID, folded PAPER drawing, marked cobalt pencil retained. Helmet drilled for ears, chin strap closed during crossing."
  sera_map: "Hand-drawn settlement map from ch046: river bend, roofs, lower path and ridge wall, blank white-stone landmark. Folded into original oilskin packet P02, retained inside tunic. Recognition remains unresolved; no new route coordinates."
  survey_line: "Ryu white cable with BLUE BAND EVERY METRE, grey relay tripod EVERY 50 M, white status lamp, speaker grille and coiled-cord handset. Intact throughout; only this permits radio across threshold."
  phone: "Taeo dark-grey phone, top-left hairline crack, clear case and green dinosaur sticker. Plain close reads use KIT HAND."
  emergency_fee: "Production company prepays ₩3,000,000. Agreed Ryu line/dispatch plus Sejin medical costs total ₩600,000. Remaining ₩2,400,000 divided equally among participating Taeo, Nib and Sera: ₩800,000 each. Orrin rests and does not work this job. No crew member owes a draw loan or unpaid rescue charge."
  cake: "Small plain cream-frosted cake in white cardboard box, no candles, birthday label, age or guild emblem. Minho buys it as a congratulatory gesture; no price or reimbursement assigned."
palette_notes: "A4 yard dusty ochre/warm brown/sky blue, home evening lamp orange/blue-grey. Gate rim concrete grey with muted ochre equipment; gate violet-black #1A1026/cold white-cyan rim. Inside lavender wrong-colour noon/violet shadows, one danger-red eye accent. Return marks cold white/violet edge, no Sera link colour. News blue-white/slate. Interface stays absent; all phones are ordinary apps. Flat cel hard shadows, warm varied contours; no haze, bloom or decorative particles. Papers/signs blank for ui.label."
