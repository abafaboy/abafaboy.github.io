chapter: 93
title: Displacement
when: "The final preparation days after ch 92; then contest day one, dawn at Yeoju. No calendar date fixed."
story_beats: PART_ONE_BEATS.md#93
cast:
  taeo: outdoor
  nib: default
  orrin: default
  sera: default
  kesh: default
  dara: default
  haein: default
  sejin: default
  chae: default
  do_gangjin: default
  ironvow_captain: default
extras:
  demo_scout: "Adult woman, cropped brown hair, grey padded training vest, black trousers and boots; Iron Vow's consenting demonstration opponent."
locations: [yeoju_demo_ring, ryu_practice_yard, yeoju_anchor_field]
location_notes:
  yeoju_demo_ring: "No drawn key. Public gravel training ring outside the Yeoju depot, padded boundary on east side, spectators west. Not inside a gate."
  ryu_practice_yard: "Use drawn key: south double gate; grey office container southwest, white van southeast, fixed plywood zigzag maze and three north targets. Temporary relay test frames stand on the open apron; do not move maze walls."
  yeoju_anchor_field: "No drawn key. Five independent door-height gates A-E in scaffold safety frames, west-east along a gravel apron. A is first/westmost. Depot north; operator canopy southwest, outside all gates; medical shelter south. The A/B relay pair shares the exterior apron, not a walkable tunnel between dungeons. Outer frames have bolt-on steel knock plates. Blank frame tags receive labels."
continuity_notes: >
  ch092.yaml was absent when this batch began; open directly on its public displacement demonstration hook.
  Nib remains a weathered 105 cm adult: LEFT ear V-notch, one lower LEFT fang, brown rope belt,
  RIGHT pouch with green dinosaur sticker, LEFT brown wooden sheath; matte black 8x30 binoculars,
  black woven strap knotted LEFT at neck, Kett's fork on hinge. Wear his chosen ch43 boots throughout;
  ch043.yaml is not yet available: provisional dark-brown lace-up ankle boots, rounded toes, low black rubber soles.
  Folded PAPER watch-post drawing, pale-blue ID and cobalt pencil stay secured in pouch, never scattered.
  Taeo is 181 cm, mole under RIGHT eye; navy jacket over black hoodie, black cargos, striped black sneakers.
  Olive backpack retains faded orange OLD shield/open-door patch. Dark-grey phone retains top-left crack and dinosaur sticker.
  Amber is Nib's link in Taeo's RIGHT palm; Orrin's is slate-green. No new companion link colours introduced here.
  Survey communication uses white cable with blue bands every metre and grey relay tripods every 50 m.
  Force-transfer couplers are separate paired flat grey clamp plates beside that cable; no wireless radio across rims.
  The measured ceiling from ch89 is retained without inventing a new percentage. Never restore the broken ch60 reservoir.
  Crew approval already covers the committed ₩210,000,000; future bets over ₩50,000,000 require a vote.
palette_notes: "Demo and yard: A4 dusty ochre, brown shadows, sky blue. Yeoju dawn: cool slate daylight, violet gate rims. Flat cel shadows; cyan only for interface, amber only for Nib's link/eyes; red reserved for danger. All boards, tags and screens blank or dark unless filled by UI."
panels:
  - id: P01
    shape: tall
    gap: none
    bg: white
    camera: "low side view across the demo ring, opponent on the right"
    art: >
      At yeoju_demo_ring, Do Gangjin (do_gangjin, dark-steel plate, muted dark-red chest inset and waist tabs,
      LEFT collar iron clasp) plants a boot and drives his gauntleted palm forward. The adult demo_scout skids
      backward toward the padded east boundary, jaw clenched, arms still raised to fight. Afternoon sun from west;
      ochre gravel, brown shadows. Pressure bends dust only at the sliding soles. No energy beam, lettering or injuries.
      Gangjin stands left, the demo scout right; show both complete figures and the boundary behind her.
    calm: top
    lines:
      - {who: do_gangjin, type: speech, side: l, text: "STILL STANDING?"}
      - {who: demo_scout, type: speech, side: r, text: "STILL STANDING."}
