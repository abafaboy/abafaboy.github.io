chapter: 2
title: You First
when: "Tuesday 14 March into Wednesday 15 March, early spring (chapter 1's night). 11:58 PM to about 12:40 AM, then 3:04 AM to about 3:07 AM. Unit 402 and its fourth-floor corridor only."
story_beats: PART_ONE_BEATS.md#2
cast:
  taeo: default     # black hoodie, black cargo trousers, dark socks (his sneakers have been in the shoe area since ch1 P47). No vest, no jacket; the backpack lies at the entry until he hangs it on the rack at bedtime
  nib: default      # barefoot; brown rope belt; pouch RIGHT hip; brown wooden sheath LEFT hip until P52, then the sheathed knife across his knees; the faded denim-blue fleece blanket around his shoulders from P52 on
  eunchae: default  # TTOK messages only (P51); not drawn
locations: [taeo_flat, taeo_building, taeo_street]
palette_notes: >
  P01–P03: interface cyan #3FE3F2 floods the flat with navy #0B1530 shadows (the ch1 summon look), draining away in P03–P04.
  P04–P16: the desk lamp lies toppled on the desk (knocked over in ch1 P52), so its warm orange light falls as one tilted wedge up the south wall; everything else is deep blue-grey.
  From P17 (Taeo sets it upright): the ART_BIBLE A4 flat-at-night look, warm lamp orange on the desk-and-bed (south) side, deep blue-grey on the kitchen (north) side.
  Corridor (P13–P15): cold white tube light, blue-grey shadows, sodium orange coming up from the street.
  3 a.m. (P53–P60): lamp off, deep blue-grey to black, a thin sodium-orange line at the edge of the blackout curtain and a thin cold line under the door;
  interface cyan only for the glitch (P54–P55); cold white-cyan phone light (P58–P60).
  Amber #F2A93B appears only as Nib's eye colour: no link pulse until ch4. No red anywhere in this chapter.
continuity_notes: >
  Room geography from world/floorplans/taeo_flat.png: looking in from the door, kitchen strip LEFT and bed RIGHT; looking out toward the door, kitchen strip RIGHT.
  The door opens OUT; seen from inside, the lever is on the viewer's LEFT and the hinges on the RIGHT. Left over from ch1: the folding table shoved askew against
  the clothes rack (never tidied in this chapter), and the olive backpack (patch out) slumped at the entry step where Taeo dropped it, until he hangs it on the
  rack's end hook off-panel at bedtime (on the hook from P52, as ch3 P07 has it).
  The summon circle and seam are gone after P04. THE CUP (white ceramic mug, one thin green band) lies on its side in a small puddle by the folding table until P30,
  then becomes Nib's water mug; at 3 a.m. it stands on the floor beside him. The lamp: toppled P01–P16, upright from P17, switched off in P52.
  Taeo's phone: face down on the kitchen counter beside the sink (P31–P40), then charging on the floor by the bed's head end (from P51).
  Nib's knife: half drawn P01–P11, fully drawn P12, lowered P13, sheathed P14–P37, drawn at the buzz P38–P40, sheathed from P41 with his right hand on the hilt;
  from P52 the sheathed knife is slipped off his belt and lies across his knees (as ch3 P01 and P05 have it).
  From P43 Nib's place is the floor against the bed's storage drawers (the bed's long north side, where the summon circle stood). Taeo sleeps on top of the grey duvet, dressed.

panels:

  # ---------------- COLD OPEN: the door closes ----------------
  - id: P01
    shape: wide
    gap: none
    bg: black
    camera: "low, from the window end of the room looking west toward the door: the reverse of ch1 P54"
    art: >
      The instant after ch1's final panel, seen from the other side. Taeo's studio flat (taeo_flat key), just before midnight, drowned in interface-cyan
      summon light with navy shadows. Frame LEFT, foreground: the bed (grey duvet), where Taeo (taeo, default: black hoodie, black cargo trousers, dark socks)
      has scrambled back against the wall, one palm still raised and trembling; pale, eyes huge, mouth half open: terror and disbelief.
      Frame centre-right: Nib (nib: adult goblin scout, 105 cm, wiry, olive-green skin, spiky black hair, long ears with the V-notch in the top of the LEFT ear,
      amber eyes, one small lower fang on the left, faint pale scars on both forearms, torn pinkish-tan sleeveless wrap top, torn charcoal knee shorts,
      brown rope belt, leather pouch on the RIGHT hip, brown wooden sheath on the LEFT hip, barefoot) in a low crouch at the edge of the cyan floor circle,
      turned toward Taeo, his right hand across his body on the hilt, the blade half drawn, amber eyes locked on Taeo: weathered, dangerous, scared, never cute.
      Just behind Nib, the thin vertical seam of cyan-white light still stands from floor to ceiling. Beyond them the room runs to the grey steel door
      at the far end, the kitchen strip along the right wall. On the floor between them, the white mug with a thin green band lies on its side in a small puddle
      by the shoved folding table. The desk lamp lies toppled on the desk past the bed's foot, its warm light swamped by the cyan.
      Hard cel shadows; a few sharp particles at the seam only. No text.
    calm: top
    lines:
      - {who: taeo, type: nervous, side: l, text: "Y-YOU CAN TALK."}
      - {who: nib, type: speech, side: r, text: "WHERE."}
    notes: "Picks up the instant ch1 P54 ends on 'WHERE AM I?'. Taeo is on the bed (he scrambled onto it in ch1 P52, knocking the lamp over). The mug is THE CUP (LOCATIONS taeo_flat key props); it tipped over in ch1 P52."

  - id: P02
    shape: inset-r
    gap: short
    bg: black
    camera: "close-up, Taeo from the front, slightly low"
    art: >
      Taeo (taeo, default) on the bed with both hands up in surrender, babbling: the night-shift clerk's customer-service reflex firing in a panic.
      Eyebrows climbing, eyes darting, a wobbly, far too polite smile, big sweat drops; one small mole under his RIGHT eye.
      Cyan light from the left, navy shadow on the right. Flat navy background with a few focus lines. A comedy face, still in normal style. No text.
    calm: left
    lines:
      - {who: taeo, type: nervous, side: c, text: "U-UNIT 402. MANGWON-DONG, MAPO-GU."}
      - {who: taeo, type: speech, side: c, text: "SEOUL?"}
      - {who: taeo, type: speech, side: c, text: "...EARTH?"}
    notes: "He answers 'WHERE' like a delivery address (unit 402, Mangwon-dong, Mapo-gu: LOCATIONS taeo_flat). Every word is useless to Nib, which is the joke."

  - id: P03
    shape: tall
    gap: short
    bg: black
    camera: "low, from the bed past Taeo's raised knee, looking up at Nib and the seam"
    art: >
      The seam closes. The vertical seam of cyan-white light pinches shut from its top and bottom toward its centre, and the cyan drains out of the room.
      Nib (nib) has whipped round at the sound and LUNGES back toward it: his left arm stretched out, fingers reaching into the last hairline of light,
      his right hand still on the half-drawn knife at his left hip, his whole body flung forward off his bare feet. His face, half lit: raw and desperate,
      the first time fear wins over him. Bottom foreground: Taeo's raised knee and his hand gripping the duvet. The walls darkening to navy.
      A few sharp particles at the seam only. Dynamic and drawn, hard shadows, no haze. No text.
    calm: top
    sfx:
      - {text: "SHHHHHK", style: summon, at: [0.82, 0.30], size: L, rot: 90}
    notes: "The way back closes in front of him. Nib reaches for it here; at 3 a.m. (P55) he reaches for a window hanging almost where the seam stood. Draw the two reaches to rhyme."

  - id: P04
    shape: strip
    gap: short
    bg: black
    silent: true
    camera: "extreme close-up of Nib's left hand"
    art: >
      Nib's olive-green left hand, faint pale scars on the forearm, closing on empty air exactly where the seam stood. The last few cyan particles
      wink out between his fingers. Behind the hand, darkness, cut by one tilted wedge of warm orange from the toppled lamp. Nothing else in frame. No text.
    calm: none

  - id: P05
    shape: wide
    gap: short
    bg: black
    camera: "over Taeo's shoulder from the bed, looking at Nib in the middle of the floor"
    art: >
      The cyan is gone. The flat is lit only by the desk lamp lying on its side on the desk, throwing one tilted wedge of warm orange up the wall;
      everything else is deep blue-grey. Foreground left: Taeo's shoulder and the side of his face (taeo, default), his eyes fixed on the empty air
      to the right of Nib's head. Middle, left of centre: Nib (nib) stands where the seam was, his empty left hand still half raised, turning his head slowly back toward Taeo;
      his face is hardening, loss turning into cold threat, and the half-drawn blade catches the lamp light. He does NOT see what Taeo is looking at:
      his eyes pass straight through that air to Taeo. Leave clear empty air to the right of Nib's head for a floating card (the letterer adds it). No text.
    calm: top-right
    ui:
      - {kind: system.summon_card, on: float, name: "[NIB — GOBLIN SCOUT]", at: [0.70, 0.06], tilt: -6}
    sfx:
      - {text: "DING", style: summon, at: [0.93, 0.10], size: M, rot: 0}
    lines:
      - {who: taeo, type: float, text: "IT READ LIKE A RECEIPT."}
    notes: "The draw's result card; only Taeo sees it (ART_BIBLE B4). That Nib cannot see this window matters: at 3 a.m. (P54) he sees one. Taeo quotes the card in P27."

  - id: P06
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 2 · YOU FIRST"

  # ---------------- STANDOFF: the door ----------------
  - id: P07
    shape: full
    gap: long
    bg: white
    camera: "high angle from the ceiling corner above the bed's head, looking west down the whole studio to the door"
    art: >
      Establishing the room after the summon (taeo_flat key; world/floorplans/taeo_flat.png). Looking west: the kitchen strip along the RIGHT wall,
      the desk and the bathroom door along the LEFT wall, the grey steel door at the far end above the tiled shoe area, one step down.
      The desk lamp lies on its side on the desk, throwing a tilted wedge of warm light up the left wall; the rest of the room is deep blue-grey.
      Leftovers of the summon: the folding table shoved askew against the clothes rack, the white mug on its side in a small puddle, Taeo's olive backpack
      (faded orange patch showing) slumped at the entry step. No circle on the floor any more.
      Taeo (taeo, default) has slid off the bed and is sidling west along the front of the desk toward the door, knees bent, hands up,
      wearing a frozen customer-service smile with huge sweat drops; the toppled lamp throws his shadow up the wall, huge and comic.
      In the middle of the floor, Nib (nib) pivots on his bare feet to keep facing him, knife half drawn, eyes narrowed.
      Drawn background, hard cel shadows. No text.
    calm: top
    lines:
      - {who: narr, type: tag, text: "11:58 PM"}
      - {who: taeo, type: nervous, side: l, text: "I'M JUST GOING TO... GET SOME AIR."}
    notes: "A gag in normal style: Taeo tries to sneak out of his own flat. The bed's head is at the window (east) wall; the desk sits between the bed's foot and the bathroom."

  - id: P08
    shape: wide
    gap: short
    bg: white
    camera: "eye level at Nib's height (about 1 m), over Nib's LEFT shoulder, looking west at the door"
    art: >
      Near foreground: the back of Nib's head and his LEFT shoulder, the V-notch in his left ear sharp against the light, and below it his right hand
      across his body on the hilt at his left hip, the half-drawn blade catching the lamp. Beyond, at the end of the room: Taeo (taeo, default) stands in
      the tiled entry with his back pressed to the grey steel door, one hand behind him groping for the lever, frozen mid-escape, eyes on the blade.
      The lever is on the door's LEFT side as seen from inside. Kitchen strip on the right wall, bathroom door on the left. Warm lamp wedge from the left,
      blue-grey everywhere else. No text.
    calm: top
    lines:
      - {who: nib, type: speech, side: c, text: "STAND AWAY FROM THE DOOR."}

  - id: P09
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up, Taeo at the door, from the front"
    art: >
      Taeo (taeo, default) snatches his hand off the lever and throws both hands up, ducking his head in a reflex clerk's bow: an apologetic wince,
      sweat flying. The grey steel door behind him, simplified. Blue-grey shadow, a warm edge of lamp light on one cheek. No text.
    calm: left
    lines:
      - {who: taeo, type: nervous, side: c, text: "SORRY! SORRY."}
      - {who: "offpanel:nib", type: speech, side: l, text: "FOR WHAT."}
    notes: "Runner: Taeo says sorry too much. Nib's 'FOR WHAT.' gets its real answer in P41, and comes back as a joke in P50."

  - id: P10
    shape: wide
    gap: short
    bg: white
    camera: "from the folding-table end of the room, looking west along the kitchen strip"
    art: >
      Foreground right: Taeo (taeo, default) backing toward the camera along the kitchen counter, hands still up, utterly baffled: he has no answer.
      Beyond him at the end of the room: Nib (nib) has darted into the tiled entry; with his eyes locked on Taeo, he shoves backwards at the grey steel door
      with his left hand and shoulder. It does not budge: the latch holds until the lever is pressed. His face shows a flicker of alarm: trapped.
      The backpack at his feet. Lamp wedge on the left wall, blue-grey elsewhere. No text.
    calm: top-left
    sfx:
      - {text: "KLUNK", style: quiet, at: [0.22, 0.50], size: M, rot: -6}

  - id: P11
    shape: inset-l
    gap: short
    bg: white
    silent: true
    camera: "close-up, three-quarter, Taeo against the kitchen counter"
    art: >
      Taeo's face (taeo, default; the mole under his RIGHT eye) as his fear gives way: the brows lift and his mouth closes. He has just understood that
      the trapped one in this room is not him. Warm lamp light on one cheek, blue-grey on the other. Simplified kitchen wall behind. No text.
    calm: none

  - id: P12
    shape: full
    gap: short
    bg: white
    camera: "low three-quarter angle from beside the bathroom door, looking north-west at the entry"
    art: >
      Taeo (taeo, default) has walked slowly back with both hands open. Now he leans over Nib, whose head reaches his belt, and reaches past Nib's head
      with his long left arm to the door's lever. Nib (nib), his back to the grey steel door, has drawn the knife fully and holds it level a few centimetres
      from Taeo's ribs; his face is tilted up at Taeo's, jaw set, ears back. Taeo's eyes are on the blade and there is sweat at his temple, but he keeps moving, slowly.
      The closeness is the tension: a tall man and a small armed adult, almost touching. The lever is on the door's near (south) edge, Taeo's fingers on it.
      The shoe cabinet to the right of the door, the backpack at their feet. Warm lamp light from the room, deep blue-grey shadows. No text.
    calm: top-right
    lines:
      - {who: taeo, type: whisper, side: r, text: "IT'S THE HANDLE. IT PUSHES DOWN."}

  - id: P13
    shape: wide
    gap: short
    bg: white
    camera: "from the open-air corridor outside, looking in through the doorway (east)"
    art: >
      The grey steel door has swung wide, out into the corridor at frame LEFT (it hinges on its north jamb). Inside, Taeo (taeo, default) flattens himself
      against the grey shoe cabinet to the left of the doorway, one arm out, making himself as small as a 181 cm man can, clearing the way: scared, and offering.
      Nib (nib) stands on the threshold, small, his blade lowered but still out, caught in the cold white tube light of the corridor, looking out past the camera
      at the night with wide, wary eyes. Behind them, the warm lamp-lit room. Corridor: cold white tube light from above, a sodium-orange glow rising from
      the street below. No text.
    calm: top-right
    lines:
      - {who: taeo, type: speech, side: l, text: "IT'S OPEN. YOU CAN GO."}
      - {who: taeo, type: float, text: "IT WAS THE ONLY DOOR I KNEW HOW TO OPEN."}
    notes: "Motif: the open door, its first appearance (STORY_BIBLE section 7). Taeo steps aside so Nib can leave. Don't point it out."

  - id: P14
    shape: tall
    gap: short
    bg: white
    camera: "high, behind Nib at the corridor rail, looking down past him to the street four floors below"
    art: >
      The fourth-floor open-air corridor of Taeo's block (taeo_building) at midnight, from above and behind. Nib (nib) stands at the waist-high metal rail,
      whose top reaches his chin; he is up on his toes, his left hand gripping the rail, his right on the knife, now back in its sheath. Seen from behind, small.
      Below and beyond him (taeo_street): the two-lane bus street at midnight. A delivery scooter's single headlight streaks past directly below; a night bus
      pulls away from the corner stop, whose advertising screen is a plain glowing rectangle; a convenience store's white glow; parked cars; tangled overhead wires
      at eye level; the low buildings opposite with dozens of lit windows; taller blocks beyond, glowing all the way to the horizon. Too many lights.
      Palette: sodium orange, cold white, deep navy. Must not appear: gates or violet light, red neon, readable signs. No text.
    calm: top
    sfx:
      - {text: "VRRRRRM", style: quiet, at: [0.62, 0.88], size: M, rot: -4}
      - {text: "HMMMMMMM", style: quiet, at: [0.10, 0.42], size: M, rot: 90}
    notes: "Beats: 'a hum, a scooter below, too many lights'. The rail is on the street (west) side of the corridor; unit 402's door is behind the camera."

  - id: P15
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "extreme close-up of Nib's eyes from the front, at the rail"
    art: >
      Nib's amber eyes, wide, each holding a tiny scatter of reflected city lights; cold corridor light on his brow; his long ears pinned flat back.
      Overwhelmed, and a very long way from home. Never cute: lines under the eyes, a narrow weathered face. Plain dark background. No text.
    calm: none

  - id: P16
    shape: wide
    gap: short
    bg: white
    camera: "from inside the room, looking west at the entry"
    art: >
      Nib (nib) is back inside on the entry tiles, pulling the grey steel door shut by its inside lever with his left hand (lever on the viewer's LEFT,
      hinges on the RIGHT); the slice of cold corridor light narrows to a line across the tiles. His head is turned so his profile shows: tired, decided,
      still guarded. The knife is in its sheath, his right hand resting on the hilt. At frame right, Taeo (taeo, default) is still pressed against the
      shoe cabinet, staring down at him. The toppled lamp's warm wedge from behind the camera, blue-grey shadows. No text.
    calm: top-left
    lines:
      - {who: nib, type: speech, side: l, text: "NOT TONIGHT."}
    sfx:
      - {text: "KA-CHUNK", style: quiet, at: [0.30, 0.62], size: S, rot: 0}
    notes: "He closes it himself: his choice, for now (STORY_BIBLE section 6, Nib's arc step 1)."

  - id: P17
    shape: inset-r
    gap: short
    bg: white
    silent: true
    camera: "close-up on the desk and the wall shelf above it"
    art: >
      Taeo's hand (taeo, black hoodie sleeve) sets the toppled desk lamp upright. Its warm light swings down over the desk and up onto the wall shelf, where
      the framed photo of four people (two parents, a boy of about 14, a baby) catches the light. Only his hand and forearm in frame; nobody looks at the photo.
      No text.
    calm: none
    notes: "From here on the room has the A4 night look: warm on the desk-and-bed side, blue-grey on the kitchen side. The photo is never explained."

  # ---------------- QUESTIONS ----------------
  - id: P18
    shape: wide
    gap: long
    bg: white
    camera: "medium-wide from the kitchen strip, looking south-west across the room"
    art: >
      Taeo (taeo, default) lowers himself to sit cross-legged on the floor in front of the desk at left, hands on his knees: deliberately making himself small.
      A few steps away at right, Nib (nib) stands on the entry tiles by the closed door, right hand resting on the sheathed knife, watching him with flat suspicion.
      Between them, empty floor. The upright lamp lights Taeo's side warm; Nib stands at the edge of the light. Simplified background. No text.
    calm: top
    lines:
      - {who: nib, type: speech, side: r, text: "WHAT DID YOU DO."}
      - {who: taeo, type: speech, side: l, text: "A WINDOW OPENED IN THE AIR. IT SAID 'DRAW.' SO I PRESSED IT."}
      - {who: nib, type: speech, side: r, text: "WHY."}

  - id: P19
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up, Taeo from the front, slightly high"
    art: >
      Taeo (taeo, default; mole under his RIGHT eye) looks down at his hands in his lap. The honest answer is costing him: ashamed, unable to dress it up.
      Warm lamp light from the side, blue-grey shadow, plain background. No text.
    calm: right
    lines:
      - {who: taeo, type: speech, side: l, text: "I WANTED TO SEE WHAT WOULD HAPPEN."}
    notes: "Echoes his ch1 line 'I JUST WANT TO SEE.'"

  - id: P20
    shape: wide
    gap: short
    bg: white
    camera: "over Nib's LEFT shoulder from the entry, looking east down the room at Taeo"
    art: >
      Foreground: the side of Nib's head and his LEFT ear with its V-notch, dark against the light. Beyond, Taeo (taeo, default) sits on the floor at right and looks up,
      meeting Nib's eyes for the first time: miserable and sincere. Behind him the lamp-lit desk, the end of the bed with its grey duvet, and the drawn
      grey-blue curtain over the window at the far end. No text.
    calm: top-left
    lines:
      - {who: taeo, type: speech, side: r, text: "I DIDN'T KNOW IT WOULD BE SOMEONE."}

  - id: P21
    shape: strip
    gap: short
    bg: white
    camera: "low, at Taeo's sitting eye level, looking west at Nib's face"
    art: >
      Nib's face (nib), level and hard, the grey steel door behind him: a demand, and under it a thread of hope. Amber eyes steady, the notch in the LEFT ear visible,
      the small lower fang on the left just showing. Lamp light on half his face. No text.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "SEND ME BACK."}

  - id: P22
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up, Taeo, three-quarter"
    art: >
      Taeo (taeo, default), helpless and guilty, his open hands lifted a little from his knees. Warm side light, blue-grey shadow, plain background. No text.
    calm: left
    lines:
      - {who: taeo, type: speech, side: c, text: "I DON'T KNOW HOW."}
      - {who: "offpanel:nib", type: speech, side: l, text: "THEN FIND OUT."}

  - id: P23
    shape: narrow-l
    gap: short
    bg: white
    camera: "side view, Taeo sitting, full figure"
    art: >
      Taeo (taeo, default), still cross-legged on the floor, extends one index finger and pokes the empty air in front of his face with total sincerity,
      squinting, like a man testing a lift button. Nothing is there. Plain lamp-lit wall behind him. No text.
    calm: right
    lines:
      - {who: taeo, type: speech, side: l, text: "...DRAW?"}

  - id: P24
    shape: inset-r
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag (ART_BIBLE A5b). Chibi Taeo (black hoodie) jabs the empty air with both index fingers in a frantic flurry, motion lines everywhere,
      panic sweat flying, a desperate grin, like hammering a broken vending machine. Beside him stands chibi Nib (V-notch in the LEFT ear, brown rope belt,
      pouch RIGHT, wooden sheath LEFT, barefoot) with a flat deadpan stare: dot eyes, a straight line for a mouth. Flat pale grey-blue background with a
      screentone dot pattern. No text.
    calm: top
    lines:
      - {who: taeo, type: nervous, side: l, text: "MENU?"}
      - {who: taeo, type: nervous, side: l, text: "...PLEASE?"}
    notes: "The beats' comedy: 'DRAW? MENU? ...PLEASE?' Nothing appears. The interface stays dark until it flickers on by itself in P54."

  - id: P25
    shape: wide
    gap: short
    bg: white
    silent: true
    camera: "high angle from the ceiling corner above the door, looking east down the room"
    art: >
      Back to normal style. Seen from above: Taeo (taeo, default) on the floor, his hand slowly lowering through the empty lamp-lit air; nothing has happened.
      Near the camera on the entry tiles, Nib (nib) watches; his long ears droop a fraction and his gaze drops to the floor where the seam stood.
      The small room very still: the askew table, the upright lamp, the bed, the curtained window. No text.
    calm: top

  # ---------------- NAMES ----------------
  - id: P26
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up, Taeo looking up, three-quarter, from Nib's eye height"
    art: >
      Taeo (taeo, default) looks up, earnest and unsure, trying; he risks using the name. Warm side light, soft blue-grey background. No text.
    calm: right
    lines:
      - {who: taeo, type: speech, side: l, text: "I'LL FIND OUT. SOMEHOW."}
      - {who: taeo, type: speech, side: l, text: "...NIB?"}

  - id: P27
    shape: wide
    gap: short
    bg: white
    camera: "over Taeo's shoulder from the floor, looking west at Nib"
    art: >
      Foreground left: the back of Taeo's head and his shoulder (taeo, default), one hand rising to placate. Beyond: Nib (nib) has taken one sharp step off the
      entry tiles toward him, right hand tightening on the hilt, ears flat, eyes hard and alarmed: a stranger knows his name. The grey steel door behind him.
      Lamp light on Nib's front. No text.
    calm: top
    lines:
      - {who: nib, type: speech, side: r, text: "WHO GAVE YOU MY NAME?"}
      - {who: taeo, type: speech, side: l, text: "IT WAS WRITTEN BESIDE YOU."}
      - {who: taeo, type: speech, side: l, text: "'NIB. GOBLIN SCOUT.'"}
    notes: "Taeo is quoting the card from P05."

  - id: P28
    shape: inset-r
    gap: short
