chapter: 46
title: Who's Paying?
when: "Same Saturday dusk as ch045's accepted-invitation hook. First evening and Sunday settling in; Monday morning at AAO registration, then back at the Ryu yard before lunch. No calendar date fixed."
story_beats: PART_ONE_BEATS.md#46
cast:
  taeo: default # Black hoodie, black cargos, single-white-stripe sneakers. Navy outdoor jacket/backpack for AAO trip P25–P37. One RIGHT-eye mole; residual forearm bruises, no load share.
  nib: default # Adult, 105 cm; full established gear and exact ch043 brown boots. Knife drawn P02, sheathed P08; no arrow released.
  orrin: default # Adult stoneback, 230 cm long, 135 cm shell height. Upper LEFT-front shell crack/protective dressing retained; no carrying this chapter.
  sera: default # First featured arrival P01, intro there. Adult human archer, 27, 172 cm; model-sheet outfit, bow LEFT, bracer LEFT, quiver RIGHT shoulder, flute RIGHT hip.
  sejin: default # Sage scrubs, olive medic rig, charcoal cargos, dark boots; paid safety officer.
  minho: default # Brown jacket, grey tee, olive cargos, knee pads, boots; grey streak LEFT temple; first evening/Sunday only.
  chae: default # Navy cardigan, white collared shirt, black trousers, low heels, blank lanyard; blue folio tablet stays dark.
  dr_pyo: default # Mid-grey suit, ivory shirt, sage tie, rimless glasses, salt-and-pepper side part, blank institute badge.
locations: [ryu_practice_yard, aao_office, aao_corridor]
location_notes:
  ryu_practice_yard: "Keyed south gate, southwest grey office, southeast white van, fixed central plywood maze, three north targets and west trestle. Home container is separate; tight home door/interior crops do not reassign office. Crew rules remain taped to interior wall. First arrival occupies the level apron outside the home, matching ch045. Sunday arrow practice uses an isolated clear north-target lane with observers behind the firing point, never in the maze or line of fire. Map scene at west trestle."
  aao_office: "Follow locations/aao_office wide/reverse: south glass partition, southeast entrance, west waiting bench, northern desk, west filing shelves, broad east window/blinds. Two visitor chairs south of desk, two monitors dark on assessor half, silver hand plate visitor-right/east. Orrin remains at the yard; do not cram him into the office."
  aao_corridor: "Short plain institutional corridor immediately outside the keyed office's southeast glass door, navy waiting seats along one side. No new revolving door, second assessment room, press crowd or named official."
props:
  boots: "Nib's permanent ch043 pair: matte dark-brown ankle-high leather, broad round toes, four pairs dull gunmetal round eyelets, dark-brown round double-knotted laces, black lug soles/low heels, heel pull tabs, oat-grey short socks inside collars; no hooks, buckles, logos or bright steel caps."
  nib_gear: "LEFT-ear V-notch, ONE lower LEFT fang, brown rope belt, leather pouch RIGHT with dinosaur sticker, brown WOODEN sheath LEFT, charcoal repair RIGHT outer thigh. Matte-black 8x30 binoculars high, woven strap knotted LEFT neck, Kett fork on hinge. Pale-blue ID, folded PAPER watch-post drawing and marked cobalt pencil in pouch; no new white stone invented."
  sera_gear: "Wooden recurve bow in LEFT hand; right hand draws. Leather bracer LEFT forearm, quiver angled above RIGHT shoulder, ivory bone flute RIGHT hip, short bead/bone necklace, cream bead braid tie. No magical bow, elf ears, sword or guild badge. Folded hand-drawn settlement map wrapped in a small plain oilskin packet tucked inside tunic until P47; map is nonmagical and unlettered."
  cup: "The original plain white ceramic mug with one thin green band. Nib held it low in LEFT hand at ch045 hook. It is handed to Sera; water, no alcohol."
  father_id: "Recovered Seogang ID remains in old off-white envelope on home family-photo shelf; no new clue or rereading."
  taeo_props: "Olive backpack with faded orange OLD shield-and-open-door patch; dark-grey phone with top-left hairline crack and green dinosaur sticker."
palette_notes: "A4 yard ochre/brown/sky blue. Arrival hard cyan #3FE3F2/navy #0B1530; seam dies after step-through, ordinary lamp warmth returns. Home night lamp-orange/blue-grey. AAO clean blue-white/slate/navy, daylight through east blinds. No new link or alignment; Sera remains unlinked. No floating UI after accepted arrival. Screens dark. Flat cel colour and hard shadows, no haze, bloom or decorative motes; every paper, tag and board blank for separate UI labels."
