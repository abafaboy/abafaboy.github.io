chapter: 97
title: Counterstroke
when: "The night of the rest day (straight from ch96's last panel at the Yeoju compound gate), then the pre-dawn medical reassessment and DAY TWO, the final territory E, from about 06:10 to early afternoon. No calendar date given."
story_beats: PART_ONE_BEATS.md#97
