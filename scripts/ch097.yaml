extras:
  ironvow_members: "Six adult hunters of mixed genders in dark-steel repaired plate, charcoal undersuits, muted dark-red chest insets and waist tabs, LEFT two-link collar clasp; no spikes, no readable insignia."
  coalition_leads: "Three adult survey-crew leaders in mismatched regional field jackets (one yellow, one green, one grey-blue), plain hard hats, each with a clipboard or radio; no shared uniform and no new guild emblem."
  coalition_porters: "Eight adult porters in plain work vests, gloves and hard hats with two wheeled stock sledges; ordinary day-rate haulers with safety ropes clipped, nobody hurried or unsafe."
locations: [yeoju_anchor_field, yeoju_gate_d, yeoju_gate_e, yeoju_supply_depot]
location_notes:
  yeoju_anchor_field: "Continue ch93-96: five independent framed door-height gates A-E west-east on a gravel apron, depot north, exterior operator canopy southwest, medical shelter south, steel knock plates on both faces of every frame. DAY TWO: the operator chair, a folding table with Kesh's instrument box and Haein's coupler cabinet stand midway outside the D and E frames, the chair turned to face E. Flat grey couplers clamp D to E; the white blue-banded survey cable runs along the ground between them to a grey relay tripod. Rain came in the small hours: dark wet gravel, puddles, clay mud at the E frame. A, B and C stay cordoned with no scoring work."
  yeoju_gate_d: "No key. Retired from scoring, NOT closed; its boss is alive beyond a far ridge and nobody works stock there. Same wrong lavender sky and violet shadows as A/B. Firm broad reed-stone landing with a low east rib wall that Orrin braces against; surveyed lane and a grey relay tripod near the landing. Chae allows a brace and nothing else (P11)."
  yeoju_gate_e: "No key. Final territory. Same wrong lavender sky, violet shadows, pale ochre reedstone. Entry landing at the WEST edge; the apron opens EAST. North rib wall on the LEFT with a low ledge about 4 m up; on the RIGHT a gentle step down to a shallow dry gully (not a deadly drop). Mid-apron lies one huge flat pale slab skinned with grey gravel, resting on round pebbles; a squat tyre-sized dark wedge under its low WEST edge holds it. The ramp rises east to a fixed stone lip and the stock seam; a folded ridge fills the far end (the boss). The ramp flattens near the landing so a sliding slab coasts to a stop."
  yeoju_supply_depot: "North side of the apron. Used only as the north lot where the coalition vans have been parked since dawn (P50)."
continuity_notes: >
  Time: night of the rest day, then Day Two (final contest day). Entry to E opens at 09:00; this chapter ends
  late morning with the boss rising. Overnight rain: wet gravel, mud at the E frame.
  Taeo: 181 cm, mole under RIGHT eye; navy jacket over black hoodie, black cargos, striped black sneakers;
  old olive backpack with the OLD faded orange shield/open-door patch; cracked phone with dinosaur sticker.
  Forearm recoil bruises persist (no miracle healing), small scabbing lower-lip cut, irregular rhythm unchanged.
  Medical limits from Dara and Sejin: ONE transfer, under half a second, then no more transfers today. Stop word is CUT;
  Sejin says it, Haein cuts the coupler. Chae also holds her own stop authority.
  Nib: adult 105 cm, LEFT ear V-notch, one lower LEFT fang, brown rope belt, RIGHT pouch with dinosaur sticker, LEFT brown wooden sheath,
  matte black 8x30 binoculars on a strap knotted LEFT at the neck (Kett's fork on the hinge); exact ch43 boots
  (matte dark-brown ankle-high leather work boots, round toes, four pairs of dull gunmetal eyelets, dark-brown laces in small double knots,
  black lug soles, heel pull tabs, oat-grey short socks). Return ring: thin cold-white ring with violet edge on the RIGHT wrist inside a gate.
  Only Nib's amber and Orrin's slate-green pulses are active in Taeo's RIGHT palm. No new link colours, abilities or reservoir device.
  Counterstroke: Nib stands on fixed stone beyond the slab; Iron Vow's full displacement push hits him; part of the load is routed
  from outside through the E and D couplers to Orrin braced in D, part banked for Sera's arrow, which knocks the dark wedge out.
  The slab slides west on its round pebbles carrying all eight of Iron Vow upright to the landing. Nobody is hurt.
  Iron Vow withdraws voluntarily and yields the E seam. Coalition crews (Minho's promise, P21) are called after the push-out.
  Chae confirms licensed survey cover is on the line, so a clear now counts. The boss (folded reedstone ridge) rises at the end.
palette_notes: "Night: slate/navy with cold floodlight and one warm canopy lamp. Dawn: wet slate and ochre, cold white sky. Interior D/E: A4 wrong lavender sky, violet shadow, pale ochre reedstone. Cyan only for interface; amber only for Nib's link/eyes; red only for blood and danger. Flat cel, no haze or bloom."
