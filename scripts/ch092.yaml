extras:
  demo_scout: "Adult woman, cropped brown hair, grey padded training vest, black trousers and boots; Iron Vow's consenting demonstration opponent. Match ch093."
  spectators: "Adult survey workers, hunters and local contract staff in muted work jackets; no readable guild logos."
locations: [aao_office, ryu_practice_yard, yeoju_demo_ring]
location_notes:
  aao_office: "Follow drawn key: 5 m E-W by 7 m N-S; southeast glass corridor door, southwest navy waiting bench, pale-grey desk in north half, assessor north/visitors south, east daylight window, northwest filing shelves, twin dark monitors, hand plate visitor-right. Supervisor is visiting Chae's office, not occupying a new mirrored office."
  ryu_practice_yard: "Drawn key: south double gate, southwest grey container, southeast white van facing west, fixed plywood maze and three north targets. New vote sheet hangs beside the three older rules inside open container door. No gate anomaly."
  yeoju_demo_ring: "Match ch093's already-written opening: public gravel training ring outside Yeoju depot, padded boundary EAST, spectators WEST. Not inside a gate. Gangjin drives toward east, scout yields east; the captain stands north of ring. Afternoon west sun. No scoring board needed."
continuity_notes: >
  Chae's unnamed supervisor matches ch009: about 58, thinning neatly combed grey hair, reading glasses on
  forehead, grey cardigan over white shirt/dark tie, charcoal AAO lanyard; kind careful audit-survivor face.
  His first nameplate was ch009 P17; do not introduce him again. Promotion is earned and accepted;
  friendship breaks over his request to relinquish arrival cases, not a fabricated promotion condition.
  Chae remains an AAO regional safety officer, assigned as Yeoju's official independent safety observer.
  Nib: adult 105 cm, LEFT notch/LEFT lower fang, brown rope belt, RIGHT dinosaur-sticker pouch,
  LEFT brown wooden sheath, black 8x30 binoculars/LEFT strap knot/fork hinge. Pouch retains PAPER drawing,
  pale-blue ID and cobalt fork-marked pencil. Ch43's chosen boots: matte dark-brown ankle leather,
  broad round toe, four gunmetal round eyelet pairs, double-knotted round brown laces, heel pull tab,
  black low-heel lug soles, oat-grey short socks inside collars; no buckles, hooks, logos or steel cap.
  Taeo retains RIGHT-eye mole, old faded orange patch on olive backpack, cracked dark-grey dinosaur phone.
  Forearm bruises/irregular rhythm persist; no live force test or healing here. No new link colours.
  Existing ₩210,000,000 commitment was ratified 6-2 in ch91; bets over ₩50,000,000 require a crew vote,
  without replacing individual consent or medical stop. Minho's independent coalition support still pending.
  Haru is heard only over phone; no rendered home interior. Re-run: contest REST DAY, 2:00 PM,
  Haru's Haeseong classroom (haeseong_school_room in ch096). This matches the already-written ch96
  afternoon classroom session. It falls between the two competition days, not during a contest session.
palette_notes: "AAO: A4 clean blue-white, slate shadows, navy/green muted accents. Yard and demo: A4 dusty ochre/brown/sky blue, west sun for demo. Phone light is ordinary white, no operator cyan. Hard cel acting, no decorative particles. All appointment cards, case tabs and notices blank until lettered."
