chapter: 11
title: Waiting
when: "The survey day of ch 10, a weekday in spring after ch 9's review. In the tunnel, time runs from Nib's crossing (ch 10's hook): 0 to about 43 minutes. Then 11:48 PM the same night at the flat. No clock time or weekday is lettered for the tunnel."
story_beats: PART_ONE_BEATS.md#11
cast:
  taeo: outdoor     # P01–P47: navy zip jacket over the black hoodie, black cargo trousers, black low sneakers with one white stripe, plus SITE KIT as in ch 14: a white hard hat a size too big and a borrowed red-orange Ryu Survey safety vest (follow ch010 if it dressed him otherwise). One small mole under his RIGHT eye. Olive backpack (faded orange patch) on the radio table. Right knuckle split at P32. P48–P53: default (black hoodie), in bed, a plaster on that knuckle
  nib: default      # barefoot and bare-headed; brown rope belt; pouch on the RIGHT hip with Haru's small dinosaur sticker on the flap (ch 8); brown wooden sheath on the LEFT hip; the Ryu yard radio in his LEFT hand inside the gate (his right is his knife hand)
  haein: default    # work overalls, tool belt, clear safety glasses pushed up under a white hard hat worn far back (as ch 14); headphones; a red-orange Ryu Survey safety vest over the overalls
  sejin: default    # Im Sejin, B-rank freelance field medic (first seen ch 10): practical field gear, medic's chest rig, cropped hair, tired eyes; a white hard hat on site
  minho: default    # grey streak at the LEFT temple; radio clipped high on his LEFT chest; watch on his LEFT wrist. On the job (as ch 14): a red-orange Ryu vest over the brown work jacket, a white hard hat with a headlamp, a rugged survey tablet (screen dark)
  dami: default     # P52–P53 only, unnamed, in a news clip (as ch 16): lime-yellow porter vest over a grey hoodie, worn gloves, her scuffed white hard hat held in her hands; small and fierce
extras:
  crew: "Ryu Survey crew member, the stocky man in his forties from ch 7: red-orange safety vest over work clothes, white hard hat with a headlamp, a chest-mounted survey camera rig. He is the mule's summoner. Calm, practical, few words."
  mule: "the crew's construct mule (follow ch010's design if it differs): a hauling construct the size of a small pony, built like a mule from jointed pale-grey timber with riveted iron bands; four blocky legs with flat wooden hooves; a long blank wedge-shaped head with two dot eyes and no mouth; a canvas pack harness with pannier frames for cases. Slow, literal, plodding. Registered equipment."
  reporter: "KNN 24 field reporter, a man in his thirties: dark raincoat, neat hair, a microphone with a blank cube. Seen only in the news clip."
  news_porters: "two older porters in the news clip, in the same cheap lime-yellow porter vests as Dami (Dokgo Contracting's, ch 14–16): tired, hands in pockets, eyes on the ground"
locations: [metro_maintenance_tunnel, gate_stone_gallery, taeo_flat, guro_site_news]
location_notes:
  metro_maintenance_tunnel: "No key yet (if ch010 designed it, ch010 wins). An out-of-service subway maintenance spur: a single concrete horseshoe tunnel about 5 m wide. Seen from the staging end: a flat concrete slab track bed with two dull old rails across the middle and RIGHT; a low concrete walkway along the LEFT wall, raised about 30 cm, its edge a plain concrete kerb (Taeo sits on it at P39). Cable trays and conduit on both walls; a de-energised overhead line tied back. The gate stands on the track bed in the middle of the tunnel, facing the staging end: a door-height black-violet slit with a cold white-cyan rim, inside Ryu Survey's THRESHOLD FRAME, a square portal of grey scaffold tube about 2.8 m tall on steel base plates, its two posts close either side of the slit's edges (the frame the knock code is knocked on; the same kit as ch 14). The slit lays a wedge of lavender light across the track bed. Yellow-and-black floor tape crosses the track bed 2 m in front of the frame (the line). Staging, on the walkway just behind the tape: a folding table side-on against the wall (base radio with a coiled handset; Haein's second radio, opened, with a long whip antenna aimed at the gate; a small digital stopwatch with a blank pale LCD; a clipboard log; a thermos; Taeo's olive backpack, patch out), a folding stool, two tripod work lamps with cordon tape between them, and an upturned plastic crate a few metres further back along the walkway (Sejin's seat). No relay cable yet: Haein thinks of it at P46. Trains run in the next tunnel and their rumble comes through the RIGHT wall. Far down the tunnel, one small green emergency light (no text)."
  gate_stone_gallery: "Inside the E-grade gate (taken to be the one on ch 9's open-gate list, whose old survey showed a pale white stone outcrop). An open-sided ledge-road about 3 m wide cut into a pale grey cliff. Walking in from the gate: the cliff wall on the LEFT; on the RIGHT, a row of squat, squared, very old stone struts along the outer edge holding up an overhanging rock roof, and between them open air, a sheer drop to a valley of grey stone stacks, and a lavender noon sky with a small hard white sun (the wrong colour). The inner side of the gate hangs in the air at the gallery's start, beside the first strut. About 150 m in, the gallery bends left and the overhang drops lower; the struts there are closer together. Beyond the bend, a broad band of chalk-white stone runs through the cliff wall (the white outcrop, the survey line's last station). The cracked strut is the last one before the white stone; it comes down in P30 and blocks the gallery at the bend."
  taeo_flat: "LOCATIONS.md key, night look: desk lamp only, warm orange on the desk (south, right-hand) side, deep blue-grey on the kitchen (north, left-hand) side. Looking in from the door: kitchen strip LEFT, the low pale-wood folding table in the middle, the bed far right by the window."
  guro_site_news: "Seen only as a KNN 24 news clip: a construction site in Guro at night, a corrugated hoarding with blank sign blocks, a chained site gate, the violet glow of a gate in the pit beyond, sodium-orange site lights and one harsh white work light. Not necessarily the Guro pit of ch 13."
palette_notes: "Tunnel: hard white work-lamp light on raw concrete grey, deep blue-grey shadows; the gate's violet-black core and lavender spill are the one cold colour; the red-orange vests are the warm accent (never the link amber). The knock sequence (P25–P37) sits on a black page. Inside the gate (pale lavender page #F3EEFB): a saturated lavender noon sky, pale grey-violet stone, violet shadows; the chalk-white outcrop is the brightest thing; no red inside at all (the danger is a hairline crack, drawn in line and grit). Flat at night: ART_BIBLE A4 night. News clip: sodium orange (duller and redder than the link amber), one harsh white work light, violet gate glow. The only red in the drawn art is Taeo's split knuckle (P32). Amber #F2A93B appears only in Nib's eyes and in Taeo's palm at P37; P01's palm has none. There are no operator-interface windows in this chapter: the interface stays dark until ch 19."

panels:

  # ---------------- COLD OPEN ----------------
  - id: P01
    shape: strip
    gap: none
    bg: black
    camera: "extreme close-up, top-down on Taeo's open right palm"
    art: >
      Extreme close-up of Taeo's open right palm held flat at chest height, fingers slightly curled. His left thumb presses hard into the
      centre of it, searching, the way you press a bruise to find it. The palm is plain skin: NO amber light anywhere.
      Hard white work-lamp light from the upper left, one cool shadow tone in the creases; the cuff of the navy zip jacket and the edge of a
      red-orange safety vest at the frame edge. Flat dark concrete grey behind, simplified. No glow, no text.
    calm: right
    lines:
      - {who: taeo, type: float, text: "THE FIRST QUIET IN WEEKS."}
    notes: "Picks up exactly at ch 10's hook: Nib has just stepped into the gate and the amber pulse went dark at the threshold. The link stays dark the whole time Nib is inside and comes back at P37. No amber here."

  - id: P02
    shape: bleed
    gap: short
    bg: black
    silent: true
    camera: "low angle from just behind Nib at the inner threshold, looking along the gallery"
    art: >
      The series' FIRST LOOK INSIDE A GATE (gate_stone_gallery). A long ledge-road cut into a pale grey cliff runs away from us and curves
      gently left in the distance. LEFT: the cliff wall. RIGHT: a row of squat, squared, very old stone struts along the outer edge holding up
      an overhanging rock roof; between them, open air and a sheer drop to a valley of grey stone stacks far below, under a vast LAVENDER NOON
      SKY (the wrong colour) with a small, hard white sun.
      Lower left foreground, from low behind: Nib (nib, default: V-notch in the LEFT ear, brown rope belt, pouch on the RIGHT hip with a small
      dinosaur sticker, brown wooden sheath on the LEFT hip, barefoot) has just straightened up on the stone, weight forward, right hand on his
      knife hilt, the yard radio in his LEFT hand. His head is tipped a few degrees up at the sky and his ears are half flattened: a soldier's
      wariness, not wonder. At the far left edge the inner side of the gate hangs in the air beside the first strut, a door-height black-violet
      slit with a cold white-cyan rim; the blunt wooden head of the crew's mule (mule) is just pushing through it into the light.
      Very far down the gallery, tiny, one pale streak of white in the grey cliff.
      Light: flat, bright lavender-white noon from the open right side; hard violet shadows under the overhang and each strut.
      Palette: lavender, pale grey-violet stone, violet shadow; no red. Drawn and hard-edged: no haze, no god rays, no particles, no text.
      The panel's top edge breaks its border.
    calm: top
    notes: "Motif: the wrong-coloured sky inside gates, first on the page here (STORY_BIBLE §7). The tiny white streak is the outcrop of P19 and the source of P38's pebble: keep it small and never point at it."

  - id: P03
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 11 · WAITING"

  # ---------------- OUTSIDE: THE TABLE ----------------
  - id: P04
    shape: full
    gap: long
    bg: white
    camera: "establishing, eye level from down the tunnel, looking along the walkway at the gate"
    art: >
      metro_maintenance_tunnel (see location_notes): the concrete horseshoe tunnel, a flat slab track bed with two dull rails, a low walkway
      (raised about 30 cm) along the LEFT wall. Ahead, standing on the track bed in the middle of the tunnel and facing us: the gate, a
      door-height black-violet slit with a cold white-cyan rim, inside Ryu Survey's threshold frame (a square portal of grey scaffold tube
      about 2.8 m tall on steel base plates, its two posts close either side of the slit), laying a wedge of lavender light across the
      track bed. Two tripod work lamps throw hard white light; cordon tape between them; yellow-and-black floor tape across the track bed
      2 m in front of the frame.
      Just behind the tape, on the walkway: a folding table side-on against the wall holding a base radio with a coiled handset, a second
      radio opened up with its circuit board out and a long whip antenna aimed at the gate, a small digital stopwatch standing on its end
      (blank pale LCD), a clipboard, a thermos, and Taeo's olive backpack with the faded orange shield-and-door patch facing us.
      Haein (haein, default + white hard hat worn far back + red-orange vest) sits at the table on a folding stool, one headphone cup to her
      ear, frowning at the board. A few metres back along the walkway, Sejin (sejin, default + white hard hat) sits on an upturned plastic
      crate against the wall, peeling a convenience-store triangle kimbap, calm. Taeo (taeo, outdoor + site kit: a white hard hat a size
      too big, a borrowed red-orange vest) stands on the track bed right AT the floor tape, too close and very still, staring at the slit,
      hands clenched at his sides. Far down the tunnel behind the gate, one small green emergency light.
      Palette: hard white light on raw concrete grey, deep blue-grey shadows, the slit's violet and lavender the one cold colour, red-orange
      vests the warm accent (never the link amber). A drawn background; no readable text anywhere.
    calm: top-right
    ui:
      - {kind: label, text: "06:12", at: [0.47, 0.62], size: 30, color: "#2B2523", rot: 0, notes: "the stopwatch LCD; move onto its face once the art exists"}
    lines:
      - {who: narr, type: tag, text: "SUBWAY MAINTENANCE TUNNEL · OUTSIDE THE GATE · 6 MINUTES IN"}
      - {who: haein, type: speech, side: l, text: "STILL NOTHING."}
    sfx:
      - {text: "KSSSHHHH", style: quiet, at: [0.40, 0.56], size: S, rot: -4}
      - {text: "VMMMM", style: gate, at: [0.20, 0.32], size: M, rot: 90}
    notes: "Lock this geography for every tunnel panel: from the staging end, the low walkway and the table on the LEFT, the gate in its scaffold frame on the track bed ahead, the trains' wall on the RIGHT. The stopwatch counts up from Nib's crossing. Taeo is the unpaid radio trainee (ch 10): the clipboard is his log."

  - id: P05
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up across the table at Haein's eye level"
    art: >
      Haein at the radio table, one headphone cup pressed to her ear, turning a tiny dial on the opened radio with two fingers while the whip
      antenna points past her shoulder at the gate. Eyes narrowed at the circuit board, mouth flat. Safety glasses pushed up on her head,
      tool belt, red-orange vest. Plain grey wall behind and a sliver of violet light at the edge.
    calm: right
    lines:
      - {who: haein, type: speech, side: l, text: "LOW BAND, HIGH BAND. NOTHING CROSSES A THRESHOLD."}
      - {who: haein, type: speech, side: l, text: "I KEEP TRYING ANYWAY."}
    notes: "Ch 10's rule, restated by the one person who tests it: radios drop out at thresholds. 'I KEEP TRYING ANYWAY' is answered at P18 (why) and P46 (how)."

  - id: P06
    shape: wide
    gap: short
    bg: white
    camera: "side-on across the tunnel at waist height, the frame at the right edge"
    art: >
      A gag in normal style. Taeo has drifted a full step PAST the floor tape toward the gate without noticing, his whole body leaning
      forward like a plant toward a window, the oversized hard hat tipping. Haein, still seated at the table on the walkway beside him and
      still looking at her circuit board, has reached out sideways without turning her head and hooked one finger through the back of his
      safety vest; she is towing him back over the tape. Taeo: startled, arms windmilling a little, a big sweat drop. The scaffold frame and
      the violet slit at the right edge. Hard white light, simple concrete.
    calm: top-left
    lines:
      - {who: haein, type: speech, side: l, text: "LINE."}
      - {who: taeo, type: nervous, side: r, text: "S-SORRY."}
    sfx:
      - {text: "TUG", style: comic, at: [0.42, 0.40], size: M, rot: -8}
    notes: "Comedy face (ART_BIBLE A5)."

  - id: P07
    shape: inset-r
    gap: short
    bg: white
    camera: "medium close-up on Sejin on her crate"
    art: >
      Sejin on the upturned crate, back to the tunnel wall, legs crossed, eating the triangle kimbap in small efficient bites, entirely
      unhurried. She looks at Taeo from under tired lids: dry, not unkind. Medic's chest rig, cropped hair. Wall and cable tray simplified.
    calm: left
    lines:
      - {who: sejin, type: speech, side: r, text: "FORTY MINUTES, THEN YOU KNOCK. IT'S BEEN SIX."}
      - {who: taeo, type: speech, side: l, text: "...I KNOW."}
    notes: "The plan from ch 10, restated: at 40:00 Taeo knocks twice on the frame ('come back'); three knocks from inside mean 'coming'."

  - id: P08
    shape: full
    gap: short
    bg: white
    camera: "high angle from up by the cable tray, looking down at Taeo and the gate"
    art: >
      From high near the tunnel roof: Taeo small on the track bed on the near side of the floor tape, alone in the hard white cone of one
      work lamp, the clipboard held against his chest in both arms, the big white hard hat a pale disc from above. Before him the scaffold
      threshold frame and the black-violet slit, much bigger than he is, its wedge of lavender light lying across the slab at his feet.
      Haein and the table on the walkway at the left; Sejin a small shape further back. The dull rails run on past the gate into the dark.
      Lonely and still. Deep blue-grey shadows; the slit the only cold colour.
    calm: top-left
    lines:
      - {who: taeo, type: float, text: "I SAID WAITING WAS THE HARD PART."}
      - {who: taeo, type: float, text: "I HADN'T WAITED YET."}
    notes: "Callback to ch 7's float 'WAITING IS THE HARD PART.' (the maze, with a radio in his hand). Never explain it."

  # ---------------- INSIDE: TWELVE MINUTES ----------------
  - id: P09
    shape: full
    gap: long
    bg: "#F3EEFB"
    camera: "medium-wide, side-on along the gallery from among the struts"
    art: >
      gate_stone_gallery, the first survey stop. Lavender noon light from the open side. Left to right: the crew member (crew) folding the
      legs of a tripod scanner; the mule (mule) standing with its pannier frames loaded with cases; and Nib, who has grabbed the long padded
      tripod case before anyone else could and hoisted it across both shoulders. It is far too long and heavy for a 105 cm body: he is already
      listing to one side, knees bent, jaw set, ears back with effort, absolutely refusing to show it.
      Minho (minho, default + white hard hat with headlamp, survey tablet under his arm, screen dark) watches from behind, one eyebrow up.
      The squared struts throw hard violet bars of shadow across the path; lavender sky between them; pale grey-violet stone.
    calm: top
    lines:
      - {who: narr, type: tag, text: "INSIDE THE GATE · 12 MINUTES IN"}
      - {who: crew, type: speech, side: l, text: "YOU'RE THE SPOTTER. LET THE MULE TAKE IT."}
      - {who: nib, type: speech, side: r, text: "I CAN CARRY."}
    notes: "Inside panels sit on a very pale lavender page (#F3EEFB) so the scroll itself tells inside from outside. Nib pays his own way (ch 7: 'I'M BUYING MINE'); here that pride meets a heavy case."

  - id: P10
    shape: inset-r
    gap: short
    bg: "#F3EEFB"
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag (2.5 heads). Chibi Nib lies flattened under the long tripod case like a pancake: only his arms, bare feet and pointed ears stick
      out, with a tiny puff of dust and dizzy spirals above him (ear notch, rope belt, pouch and wooden sheath all present). Past him the chibi
      mule plods serenely along carrying a wobbling tower of six cases, a smug sparkle on its blank wooden face.
      Flat pale-lavender background with screentone dots.
    calm: left
    sfx:
      - {text: "SQUISH", style: comic, at: [0.26, 0.56], size: S, rot: -10}
      - {text: "KLOK KLOK", style: comic, at: [0.70, 0.82], size: M, rot: 6}
    notes: "The mule has no chibi sheet: derive it from extras.mule."

  - id: P11
    shape: wide
    gap: short
    bg: "#F3EEFB"
    camera: "eye level with Nib, profile: Nib and the mule nose to nose"
    art: >
      Back to normal style. Nib has heaved the tripod case up onto the mule's pannier frame and now stands nose to nose with the construct,
      looking straight into its two blank dot eyes with total deadpan, one finger raised as if assigning duties to a recruit. The mule stares
      at nothing. Behind them Minho has turned his face half away, the corner of his mouth giving him away. Adult, wiry, dignified Nib:
      NOT cute. Lavender light, violet strut shadows, simplified stone.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "YOU CARRY. I LOOK."}
      - {who: minho, type: speech, side: r, text: "GOOD. NOW LOOK."}
    notes: "The joke is Nib briefing a construct that cannot understand him. The idea under it: the construct is better at carrying, the person is better at seeing."

  - id: P12
    shape: wide
    gap: short
    bg: "#F3EEFB"
    camera: "high angle from under the overhang, down the length of the gallery"
    art: >
      From up under the overhang: Nib far ahead now, small and unburdened, moving low and quick along the cliff side, one hand trailing near
      the wall, reading the ground, the radio at his mouth in his LEFT hand. Behind him the file: the mule, the crew member with his chest
      camera rig, and Minho in the near foreground with his head tilted to the radio on his LEFT chest. The struts recede in a long rhythm,
      lavender sky between them; the white streak in the cliff a little nearer.
    calm: bottom-right
    lines:
      - {who: nib, type: phone, side: l, text: "GRIT ON THE LEFT. KEEP RIGHT."}
      - {who: minho, type: speech, side: r, text: "SEEN."}
    notes: "Radios work between people on the same side of a threshold. Nib's voice comes out of Minho's chest radio, so it is a phone-voice bubble with its tail to the radio. 'SEEN.' is Minho's radio word (ch 7)."

  # ---------------- OUTSIDE: TWENTY MINUTES ----------------
  - id: P13
    shape: wide
    gap: long
    bg: white
    camera: "low angle from the track bed, toward the table on the walkway"
    art: >
      A train passes in the next tunnel. The RIGHT-hand wall seems to hum, a fine fall of dust sifts out of the cable tray, the tripod lamps
      tremble. Taeo has flinched hard toward the gate, both hands up, eyes huge, mouth open, hard hat jolted crooked: total false alarm.
      Haein does not look up from her board. Sejin, on her crate, does not even stop chewing. Hard white light, blue-grey shadows, the slit's
      violet at the left edge.
    calm: top
    lines:
      - {who: narr, type: tag, text: "OUTSIDE · 20 MINUTES IN"}
      - {who: sejin, type: speech, side: r, text: "TRAIN."}
      - {who: haein, type: speech, side: l, text: "THAT'S THE FOURTH ONE."}
    sfx:
      - {text: "RRRMMMMMBL", style: impact, at: [0.78, 0.30], size: L, rot: -4}
    notes: "Set-up for P30: tunnel noises lettered in plain impact style are trains. P30's boom comes through the gate, lettered in gate style."

  - id: P14
    shape: inset-l
    gap: short
    bg: white
    camera: "two-shot at eye level: Sejin seated in front, Taeo standing behind"
    art: >
      Sejin in the foreground, seated, holding up the half-eaten kimbap like a pointer, dry as dust. Behind her Taeo, sheepish, rubbing the
      back of his neck, ears pink. Simplified background.
    calm: right
    lines:
      - {who: taeo, type: speech, side: r, text: "...SORRY."}
      - {who: sejin, type: speech, side: l, text: "I'M PAID TO WAIT. YOU'RE NOT. SIT DOWN."}
      - {who: taeo, type: speech, side: r, text: "I'M FINE."}
    notes: "Taeo is unpaid; Sejin is on a medic's day rate. He does not sit until his legs decide for him (P39)."

  - id: P15
    shape: wide
    gap: short
    bg: white
    camera: "over Haein's shoulder at the table, toward Taeo at the tape"
    art: >
      Over Haein's right shoulder in the near foreground: the opened radio, a soldering iron in its stand, her hand on the dial. Facing her
      across the end of the table, Taeo stands at the tape with the clipboard against his chest. She has finally looked up at him: a plain,
      blunt, curious question with no malice in it. His answer is in his face before he says it: he looks away, to the slit. Violet light
      on his cheek.
    calm: top
    lines:
      - {who: haein, type: speech, side: l, text: "WHY DON'T YOU JUST GO IN WITH HIM?"}
      - {who: taeo, type: speech, side: r, text: "...I CAN'T."}
    notes: "Echoes ch 9: '...I CAN'T GO IN.' Nobody explains why."

  - id: P16
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up on Haein, three-quarter, eyes down at her work"
    art: >
      Haein has gone back to the circuit board and touches the soldering iron to a joint; a thin curl of solder smoke. She says it flat, as a
      fact, without looking at him: the bluntness is how she carries it. Safety glasses on her head, red-orange vest. Plain background.
    calm: left
    lines:
      - {who: haein, type: speech, side: r, text: "DAD USED TO GO IN FIRST. EVERY JOB."}
      - {who: haein, type: speech, side: r, text: "NOW MINHO DOES."}
    notes: "Ryu Dongsik has used a wheelchair since a survey accident (ch 10). The line echoes Grandpa's ch 8 hook ('YOUR FATHER WENT IN FIRST TOO') without anyone saying so. Never point at it."

  - id: P17
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "extreme close-up of Taeo's eyes"
    art: >
      Extreme close-up strip of Taeo's eyes and brow, the gate's violet reflected small in both: something old has surfaced and he is holding
      it down. Not tears; stillness. One hard shadow under the brow. Nothing else in frame.
    calm: none

  - id: P18
    shape: inset-l
    gap: short
    bg: white
    camera: "medium on Haein glancing up from the table"
    art: >
      Haein glances up at Taeo for one beat and the blunt mask slips: she knows exactly what that face is. Her eyes are already on their way
      back to the board. Simplified background, violet edge light.
    calm: right
    lines:
      - {who: haein, type: speech, side: l, text: "I BUILD THINGS SO I DON'T HAVE TO STAND THERE LIKE YOU."}
    notes: "Answers P05. Haein waits outside too; she has had more practice."

  # ---------------- INSIDE: THE STRUT ----------------
  - id: P19
    shape: full
    gap: long
    bg: "#F3EEFB"
    camera: "medium-wide from behind the file, at the bend"
    art: >
      gate_stone_gallery at the bend, about 150 m in: the gallery curves left, the overhang drops lower and the struts stand closer together,
      thick with age. Beyond the bend a broad band of CHALK-WHITE stone runs through the grey cliff, bright under the lavender noon: the
      brightest thing in the panel. Nib has stopped dead and stepped in against the cliff wall, his open right hand thrown up and back (stop).
      The mule, following its line, plods straight on past him: one wooden forefoot is lifted, about to step under the last strut before the
      white stone, as the crew member behind it calls out. Minho at the back, a hand already at his headlamp. Lavender light, violet shadows.
      No red.
    calm: top-right
    lines:
      - {who: narr, type: tag, text: "INSIDE THE GATE · 27 MINUTES IN"}
      - {who: crew, type: speech, side: l, text: "MULE. STOP."}
    notes: "Constructs follow simple commands literally: the mule would have walked straight under it. The crew member is its summoner."

  - id: P20
    shape: strip
    gap: short
    bg: "#F3EEFB"
    silent: true
    camera: "extreme close-up on the head of the strut"
    art: >
      Extreme close-up of the squared stone strut where it meets the overhang: a hairline crack runs down from its top edge to about halfway,
      so fine it is almost a pencil line, and a thin thread of grey grit trickles out of it. Lavender light on the stone, a violet shadow in
