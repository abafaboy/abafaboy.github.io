      lamp is the only light: warm orange on the desk side, deep blue-grey on the kitchen side.
      Nib sits cross-legged on the floor at the low pale-wood folding table, washed, the dust gone. In front of him, in a neat soldierly row,
      is everything from his pouch: six pale sage-green 10,000-won notes (no numerals), today's small carbon receipt, his registered-arrival
      ID card (scowling photo, blank), the long pencil with the tiny three-line fork carved near its end and Chae's short pencil stub, and the
      white pebble. Beside the row: the flat old biscuit tin with its lid off (his savings) and the clear plastic folder of receipts; and,
      unfolded and creased in quarters, the sheet of plain white paper from ch 4 with his pencil drawing of his watch post: a low wall of
      stacked stones on a ridge, a crooked tree behind it, a path winding down, and beside the path a small closed outline left blank.
      He counts the notes with one finger, solemn.
      Taeo (taeo, default: black hoodie) lies on the bed under the grey duvet, propped on one elbow, phone in hand, its screen dark and turned
      away from us. A plaster on his right knuckle.
    calm: top-left
    lines:
      - {who: "narr", type: "tag", text: "11:48 PM"}
      - {who: "nib", type: "speech", side: "l", text: "₩60,000. FOR FORTY-THREE MINUTES."}
      - {who: "taeo", type: "speech", side: "r", text: "IT'S A DAY RATE."}
      - {who: "nib", type: "speech", side: "l", text: "I LIKE DAY RATES."}
      - {who: "narr", type: "footnote", text: "*₩60,000 ≈ US$44"}
    notes: "Minho paid the full day rate (ch 10 P14: ₩60,000 a day) for a day the collapse cut short. The pouch holds only today's pay; his savings are in the tin (ch 9 P07). The drawing is ch 4's (P39–P40 there), kept folded in his pouch since."

