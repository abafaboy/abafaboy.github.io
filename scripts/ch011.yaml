chapter: 11
title: Waiting
when: "Monday 10 April (not lettered), the survey day of ch 10. In the tunnel, time runs from Nib's crossing at about 10:00 AM (ch 10's hook): Taeo knocks at 40:00 (about 10:40); Nib is out at about 42:30, the crew at about 43:00. Then 11:48 PM the same night at the flat. Only elapsed minutes and 11:48 PM are lettered."
story_beats: PART_ONE_BEATS.md#11
cast:
  taeo: outdoor     # P01–P46: navy zip jacket over the black hoodie, black cargo trousers, black low sneakers with one white stripe, and the borrowed red-orange Ryu Survey safety vest from ch 10 (no hard hat in the tunnel, as ch 10). One small mole under his RIGHT eye. His clipboard log (ch 10 P51). Olive backpack (faded orange patch) on the radio table. Right knuckle split at P32. P47–P52: default (black hoodie), in bed, a plaster on that knuckle
  nib: default      # barefoot (he refused boots in ch 10) and bare-headed; brown rope belt; pouch on the RIGHT hip with Haru's small dinosaur sticker on the flap (ch 8); brown wooden sheath on the LEFT hip; the Ryu handheld radio in his LEFT hand (his right is his knife hand). Inside the gate he wears his return mark: a thin ring of cold rim-white light round his RIGHT wrist (ch 10 P56; never interface cyan). It thins to nothing as he walks back out (P36, decided here)
  haein: default    # work overalls, tool belt, clear safety glasses pushed up on her head, headphones round her neck or one cup to her ear; a red-orange Ryu Survey safety vest over the overalls (as ch 16)
  sejin: default    # Im Sejin, B-rank freelance field medic (first seen ch 10): cropped dark hair, tired eyes, practical field gear, a medic's chest rig with pouches; her hard-shell medic case and a takeaway coffee by her crate (ch 10). Paid ₩300,000 a day to wait at the mouth (ch 10)
  minho: default    # grey streak at the LEFT temple; brown work jacket; radio clipped high on his LEFT chest; watch on his LEFT wrist; in the tunnel and the gate a white hard hat with a headlamp (ch 10) and a rugged survey tablet (screen dark)
  dami: default     # P51–P52 only, unnamed, in a news clip (as ch 16): lime-yellow porter vest over a grey hoodie, worn gloves, her scuffed white hard hat held in her hands; small and fierce
extras:
  crew: "Ryu Survey crew member, the stocky man in his forties from ch 7 (the only crew member on this job, as in ch 10): red-orange safety vest over work clothes, a white hard hat with a headlamp, a chest-mounted survey camera rig. He is the mule's summoner. Calm, practical, few words."
  mule: "the crew's construct mule, as ch 10 draws it: a hauling construct the size of a small pony, built like a mule from jointed pale-grey timber with riveted iron bands; four blocky legs with flat wooden hooves; a long blank wedge-shaped head with two dot eyes and no mouth; a canvas pack harness with pannier frames for cases. Slow, literal, plodding; it follows whoever walks directly in front of it. Registered equipment, leased from the crew member for ₩30,000 a month (ch 10). Never cute outside chibi."
  reporter: "KNN 24 field reporter, a man in his thirties: dark raincoat, neat hair, a microphone with a blank cube. Seen only in the news clip."
  news_porters: "two older porters in the news clip, in the same cheap lime-yellow porter vests as Dami (Dokgo Contracting's, ch 14–16): tired, hands in pockets, eyes on the ground"
locations: [metro_maintenance_tunnel, gate_stone_gallery, taeo_flat, guro_site_news]
location_notes:
  metro_maintenance_tunnel: "ch 10's layout, locked there for this chapter, restated. An out-of-service subway maintenance spur off Line 6: a single concrete horseshoe tunnel about 5 m wide. Seen from the staging end: dull old rails in a concrete track bed on the RIGHT; a raised concrete maintenance walkway about 1.2 m wide along the LEFT wall, its edge a plain concrete kerb about 80 cm above the track bed (Taeo sits on it at P39). Cable trays and conduit on both walls; a de-energised overhead line tied back. Ahead in the LEFT wall, the steel door frame of a cross-passage, its steel door taken off and leaning against the wall beside it; the gate stands exactly inside that frame, a door-height black-violet slit with a cold white-cyan rim that spills a wedge of lavender light across the walkway. The steel frame is the frame of the knock: Taeo knocks on its painted steel jamb (ch 10 P49). A strip of yellow-and-black floor tape crosses the walkway 2 m in front of the frame (the line). Just behind the tape, the staging area: a folding table side-on against the wall (a base radio with a coiled handset; Haein's second radio, opened, with a long whip antenna aimed at the gate; a small digital stopwatch with a blank pale LCD; Taeo's clipboard log; a thermos; Taeo's olive backpack, patch out), one folding stool (Haein's), two tripod work lamps with cordon tape between them, and an upturned plastic crate a few metres further back against the wall (Sejin's seat). The access stair is about 30 m back along the walkway, with the GMA warden's post at its foot. Trains run in the next tunnel about every five minutes; their rumble comes through the RIGHT wall. Far down the tunnel past the gate, one small green emergency light (no text). Light: the two work lamps, hard white. (At the Guro pit in ch 13–17 there is no doorway, so Ryu builds a scaffold-tube threshold frame instead; both are 'the frame'.)"
  gate_stone_gallery: "Inside the E-grade gate on Chae's open-gate list (ch 9 P57–P59: 'Subway maintenance tunnel', survey 'entrance only, 1 still'; her printed still shows this gallery and the white band past the bend). Ch 10–11 is its full survey. An open-sided ledge-road about 3 m wide cut into a pale grey cliff. Walking in from the gate: the cliff wall on the LEFT; on the RIGHT, a row of squat, squared, very old stone struts along the outer edge holding up an overhanging rock roof, and between them open air, a sheer drop to a valley of grey stone stacks, and a lavender noon sky with a small hard white sun (the wrong colour). The inner side of the gate hangs in the air at the gallery's start, beside the first strut. About 150 m in, the gallery bends left and the overhang drops lower; the struts there are closer together. Beyond the bend, a broad band of chalk-white stone runs through the cliff wall (the white outcrop, the survey line's last station). The cracked strut is the last one before the white stone; it comes down in P30 and blocks the gallery at the bend."
  taeo_flat: "LOCATIONS.md key, night look: desk lamp only, warm orange on the desk (south, right-hand) side, deep blue-grey on the kitchen (north, left-hand) side. Looking in from the door: kitchen strip LEFT, the low pale-wood folding table in the middle, the bed far right by the window. Nib's savings live in a flat old biscuit tin and his receipts in a clear plastic folder (ch 9 P07)."
  guro_site_news: "Seen only as a KNN 24 news clip: a construction site in Guro at night, a corrugated hoarding with blank sign blocks, a chained site gate, the violet glow of a gate in the pit beyond, sodium-orange site lights and one harsh white work light. Treat it as a DIFFERENT Guro site from the ch 13–17 pit: ch 14 and ch 16 have no earlier missing man inside that gate. The missing porter is unnamed and his fate is left open (ch 13 keeps it so)."
palette_notes: "Tunnel: hard white work-lamp light on raw concrete grey, deep blue-grey shadows; the gate's violet-black core and lavender spill are the one cold colour; the red-orange vests are the warm accent (never the link amber). The knock sequence (P25–P37) sits on a black page. Inside the gate (pale lavender page #F3EEFB): a saturated lavender noon sky, pale grey-violet stone, violet shadows; the chalk-white outcrop is the brightest thing; no red inside at all (the danger is a hairline crack, drawn in line and grit). Nib's return mark is a thin ring of cold rim-white light, never interface cyan. Flat at night: ART_BIBLE A4 night. News clip: sodium orange (duller and redder than the link amber), one harsh white work light, violet gate glow. The only red in the drawn art is Taeo's split knuckle (P32). Amber #F2A93B appears only in Nib's eyes and in Taeo's palm at P37; P01's palm has none. There are no operator-interface windows in this chapter: the interface stays dark until ch 19."

panels:

  # ---------------- COLD OPEN ----------------
  - id: P01
    shape: strip
    gap: none
    bg: black
    camera: "extreme close-up, top-down on Taeo's open right palm"
    art: >
      Extreme close-up of Taeo's open right palm held flat at chest height, fingers slightly curled. His left thumb presses hard into the
      centre of it, searching, the way you press a bruise to find it. The palm is plain skin: NO amber light anywhere.
      Hard white work-lamp light from the upper left, one cool shadow tone in the creases; the cuff of the navy zip jacket and the edge of the
      red-orange safety vest at the frame edge. Flat dark concrete grey behind, simplified. No glow, no text.
    calm: right
    lines:
      - {who: taeo, type: float, text: "THE FIRST QUIET IN WEEKS."}
    notes: "Picks up exactly at ch 10's hook (P57): Nib has just stepped into the gate and the last fleck of amber has gone out. The link stays dark the whole time Nib is inside and comes back at P37. No amber here."

  - id: P02
    shape: bleed
    gap: short
    bg: black
    silent: true
    camera: "low angle from just behind Nib at the inner threshold, looking along the gallery"
    art: >
      The series' FIRST LOOK INSIDE A GATE (gate_stone_gallery). A long ledge-road cut into a pale grey cliff runs away from us and curves
      gently left in the distance. LEFT: the cliff wall. RIGHT: a row of squat, squared, very old stone struts along the outer edge holding up
      an overhanging rock roof; between them, open air and a sheer drop to a valley of grey stone stacks far below, under a vast LAVENDER NOON
      SKY (the wrong colour) with a small, hard white sun.
      Lower left foreground, from low behind: Nib (nib, default: V-notch in the LEFT ear, brown rope belt, pouch on the RIGHT hip with a small
      dinosaur sticker, brown wooden sheath on the LEFT hip, barefoot) has just straightened up on the stone, weight forward, right hand on his
      knife hilt with the thin ring of cold white light (his return mark) round that wrist, the radio in his LEFT hand. His head is tipped a
      few degrees up at the sky and his ears are half flattened: a soldier's wariness, not wonder. At the far left edge the inner side of the
      gate hangs in the air beside the first strut, a door-height black-violet slit with a cold white-cyan rim; the long blank wooden head of
      the crew's mule (mule) is just pushing through it into the light.
      Very far down the gallery, tiny, one pale streak of white in the grey cliff.
      Light: flat, bright lavender-white noon from the open right side; hard violet shadows under the overhang and each strut.
      Palette: lavender, pale grey-violet stone, violet shadow; no red. Drawn and hard-edged: no haze, no god rays, no particles, no text.
      The panel's top edge breaks its border.
    calm: top
    notes: "Motif: the wrong-coloured sky inside gates, first on the page here (STORY_BIBLE §7). Entry order as ch 10: Nib, the mule, Minho, the crew member. The tiny white streak is the outcrop of P19 and the source of P38's pebble: keep it small and never point at it."

  - id: P03
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 11 · WAITING"

  # ---------------- OUTSIDE: THE TABLE ----------------
  - id: P04
    shape: full
    gap: long
    bg: white
    camera: "establishing, eye level from down the tunnel, looking along the walkway at the gate"
    art: >
      metro_maintenance_tunnel (ch 10's layout; see location_notes): the concrete horseshoe tunnel, dull rails in the track bed on the RIGHT,
      the raised walkway along the LEFT wall. Ahead in the LEFT wall, the steel door frame of a cross-passage (its door leaning against the
      wall beside it), and standing exactly inside the frame, filling it: the gate, a door-height black-violet slit with a cold white-cyan rim,
      laying a wedge of lavender light across the walkway. Two tripod work lamps throw hard white light; cordon tape between them;
      yellow-and-black floor tape across the walkway 2 m in front of the frame.
      Just behind the tape, a folding table side-on against the wall: a base radio with a coiled handset, a second radio opened up with its
      circuit board out and a long whip antenna aimed at the gate, a small digital stopwatch standing on its end (blank pale LCD), a thermos,
      and Taeo's olive backpack with the faded orange shield-and-door patch facing us.
      Haein (haein, default + red-orange vest) sits at the table on the folding stool, one headphone cup to her ear, frowning at the board.
      A few metres back, Sejin (sejin, default) sits on an upturned plastic crate against the wall, peeling a convenience-store triangle
      kimbap, calm, a takeaway coffee on the crate beside her and her hard-shell medic case at her feet. Taeo (taeo, outdoor + the borrowed
      red-orange vest) stands right AT the floor tape with the clipboard log against his chest, too close and very still, staring at the slit.
      Far down the tunnel behind the gate, one small green emergency light.
      Palette: hard white light on raw concrete grey, deep blue-grey shadows, the slit's violet and lavender the one cold colour, red-orange
      vests the warm accent (never the link amber). A drawn background; no readable text anywhere.
    calm: top-right
    ui:
      - {kind: label, text: "06:12", at: [0.47, 0.62], size: 30, color: "#2B2523", rot: 0, notes: "the stopwatch LCD; move onto its face once the art exists"}
    lines:
      - {who: "narr", type: "tag", text: "SUBWAY MAINTENANCE TUNNEL · OUTSIDE THE GATE · 6 MINUTES IN"}
      - {who: "haein", type: "speech", side: "l", text: "STILL NO RADIO SIGNAL."}
    sfx:
      - {text: "KSSSHHHH", style: quiet, at: [0.40, 0.56], size: S, rot: -4}
      - {text: "VMMMM", style: gate, at: [0.20, 0.32], size: M, rot: 90}
    notes: "Geography locked by ch 10 (P42): walkway LEFT, track bed RIGHT, the frame in the LEFT wall, the table just behind the tape, Sejin's crate a few metres back, the trains' wall on the RIGHT. The stopwatch counts up from Nib's crossing. Taeo is the unpaid radio trainee (ch 10): the clipboard is his log."

  - id: P05
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up across the table at Haein's eye level"
    art: >
      Haein at the radio table, one headphone cup pressed to her ear, turning a tiny dial on the opened radio with two fingers while the whip
      antenna points past her shoulder at the gate. Eyes narrowed at the circuit board, mouth flat. Safety glasses pushed up on her head,
      tool belt, red-orange vest. Plain grey wall behind and a sliver of violet light at the edge.
    calm: right
    lines:
      - {who: "haein", type: "speech", side: "c", text: "LOW BAND, HIGH BAND. NO RADIO SIGNAL GETS THROUGH."}
      - {who: "haein", type: "speech", side: "c", text: "I KEEP TRYING ANYWAY."}
    notes: "Ch 10's rule (P47–P48, the beacon on a pole), restated by the one person who tests it: radios drop out at thresholds. 'I KEEP TRYING ANYWAY' is answered at P18 (why) and P45a (how)."

  - id: P06
    shape: wide
    gap: short
    bg: white
    camera: "side-on along the walkway at waist height, the frame at the right edge"
    art: >
      A gag in normal style. Taeo has drifted a full step PAST the floor tape toward the gate without noticing, his whole body leaning
      forward like a plant toward a window. Haein, still seated and still looking at her circuit board, has reached out sideways without
      turning her head and hooked one finger through the back of his safety vest; she is towing him back over the tape. Taeo: startled,
      arms windmilling a little, a big sweat drop. The steel frame and the violet slit at the right edge. Hard white light, simple concrete.
    calm: top-left
    lines:
      - {who: "haein", type: "speech", side: "l", text: "STAY BEHIND THE TAPE."}
      - {who: "taeo", type: "nervous", side: "r", text: "S-SORRY."}
    sfx:
      - {text: "TUG", style: comic, at: [0.42, 0.40], size: M, rot: -8}
    notes: "Comedy face (ART_BIBLE A5)."

  - id: P07
    shape: inset-r
    gap: short
    bg: white
    camera: "medium close-up on Sejin on her crate"
    art: >
      Sejin on the upturned crate, back to the tunnel wall, legs crossed, eating the triangle kimbap in small efficient bites, entirely
      unhurried, the takeaway coffee at her hip. She looks at Taeo from under tired lids: dry, not unkind. Medic's chest rig, cropped hair.
      Wall and cable tray simplified.
    calm: left
    lines:
      - {who: "sejin", type: "speech", side: "r", text: "KNOCK AFTER FORTY MINUTES INSIDE. IT'S BEEN SIX."}
      - {who: "offpanel:taeo", type: "speech", side: "l", text: "I KNOW."}
    notes: "The plan from ch 10 (P48, P51): a 40-minute first leg; at 40:00 Taeo knocks twice on the frame ('come back'); three knocks from inside mean 'coming'."

  - id: P08
    shape: full
    gap: short
    bg: white
    camera: "high angle from up by the cable tray, looking down at Taeo and the gate"
    art: >
      From high near the tunnel roof: Taeo small on the near side of the floor tape, alone in the hard white cone of one work lamp, the
      clipboard held against his chest in both arms. Before him the steel frame and the black-violet slit, much bigger than he is, its
      wedge of lavender light lying across the walkway at his feet. Haein and the table at his shoulder; Sejin a small shape further back.
      The dull rails run away into the dark on the right. Lonely and still. Deep blue-grey shadows; the slit the only cold colour.
    calm: top-left
    lines:
      - {who: taeo, type: float, text: "I SAID WAITING WAS THE HARD PART."}
      - {who: taeo, type: float, text: "I HADN'T WAITED YET."}
    notes: "Callback to ch 7's float 'WAITING IS THE HARD PART.' (the maze, with a radio in his hand). Never explain it."

  # ---------------- INSIDE: TWELVE MINUTES ----------------
  - id: P09
    shape: full
    gap: long
    bg: "#F3EEFB"
    camera: "medium-wide, side-on along the gallery from among the struts"
    art: >
      gate_stone_gallery, the first survey stop. Lavender noon light from the open side. Left to right: the crew member (crew) folding the
      legs of a tripod scanner; the mule (mule) standing with its pannier frames loaded with cases; and Nib, who has grabbed the long padded
      tripod case before anyone else could and hoisted it across both shoulders. It is far too long and heavy for a 105 cm body: he is already
      listing to one side, knees bent, jaw set, ears back with effort, absolutely refusing to show it.
      Minho (minho, default + white hard hat with headlamp, survey tablet under his arm, screen dark) watches from behind, one eyebrow up.
      The squared struts throw hard violet bars of shadow across the path; lavender sky between them; pale grey-violet stone.
    calm: top
    lines:
      - {who: narr, type: tag, text: "INSIDE THE GATE · 12 MINUTES IN"}
      - {who: crew, type: speech, side: l, text: "YOU'RE THE SPOTTER. LET THE MULE TAKE IT."}
      - {who: nib, type: speech, side: r, text: "I CAN CARRY."}
    notes: "Inside panels sit on a very pale lavender page (#F3EEFB) so the scroll itself tells inside from outside. Nib pays his own way (ch 7: 'I'M BUYING MINE'; ch 10: 'I'M TWO MONTHS OF MULE'); here that pride meets a heavy case."

  - id: P10
    shape: inset-r
    gap: short
    bg: "#F3EEFB"
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag (2.5 heads). Chibi Nib lies flattened under the long tripod case like a pancake: only his arms, bare feet and pointed ears stick
      out, with a tiny puff of dust and dizzy spirals above him (ear notch, rope belt, pouch and wooden sheath all present). Past him the chibi
      mule plods serenely along carrying a wobbling tower of six cases, a smug sparkle on its blank wooden face.
      Flat pale-lavender background with screentone dots.
    calm: left
    sfx:
      - {text: "SQUISH", style: comic, at: [0.26, 0.56], size: S, rot: -10}
      - {text: "KLOK KLOK", style: comic, at: [0.70, 0.82], size: M, rot: 6}
    notes: "The mule has no chibi sheet: derive it from extras.mule."

  - id: P11
    shape: wide
    gap: short
    bg: "#F3EEFB"
    camera: "eye level with Nib, profile: Nib and the mule nose to nose"
    art: >
      Back to normal style. Nib has heaved the tripod case up onto the mule's pannier frame and now stands nose to nose with the construct,
      looking straight into its two blank dot eyes with total deadpan, one finger raised as if assigning duties to a recruit. The mule stares
      at nothing. Behind them Minho has turned his face half away, the corner of his mouth giving him away. Adult, wiry, dignified Nib:
      NOT cute. Lavender light, violet strut shadows, simplified stone.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "YOU CARRY. I LOOK."}
      - {who: minho, type: speech, side: r, text: "GOOD. NOW LOOK."}
    notes: "The joke is Nib briefing a construct that cannot understand him (ch 10's chibi end card had them staring each other out). The idea under it: the construct is better at carrying, the person is better at seeing."

  - id: P12
    shape: wide
    gap: short
    bg: "#F3EEFB"
    camera: "high angle from under the overhang, down the length of the gallery"
    art: >
      From up under the overhang: Nib far ahead now, small and unburdened, low against the cliff side, reading the ground, the radio at his
      mouth in his LEFT hand and his RIGHT palm pressed flat against the cliff wall for a beat (the thin return-mark ring at that wrist), head
      tilted, as if listening for something. Behind him the file: the mule, the crew member with his chest camera rig, and Minho in the near
      foreground with his head tilted to the radio on his LEFT chest. The struts recede in a long rhythm, lavender sky between them; the white
      streak in the cliff a little nearer.
    calm: bottom-right
    lines:
      - {who: "nib", type: "phone", side: "l", text: "GRIT ON THE LEFT. KEEP RIGHT."}
      - {who: "minho", type: "speech", side: "l", text: "SEEN."}
    notes: "Radios work between people on the same side of a threshold. Nib's voice comes out of Minho's chest radio, so it is a phone-voice bubble with its tail to the radio. 'SEEN.' is Minho's radio word (ch 7). Nib's palm on the wall is a quiet test of the link, as he pressed the frame in ch 10 P55 and the wall in ch 6; outside, Taeo feels nothing. Ch 12 P09 refers back to it ('IN THERE, I PRESSED THE WALL'). Don't explain it here."

  # ---------------- OUTSIDE: TWENTY MINUTES ----------------
  - id: P13
    shape: wide
    gap: long
    bg: white
    camera: "low, from the track bed, looking up at the walkway"
    art: >
      A train passes in the next tunnel. The RIGHT-hand wall seems to hum, a fine fall of dust sifts out of the cable tray, the tripod lamps
      tremble. Taeo has flinched hard toward the gate, both hands up, eyes huge, mouth open: total false alarm. Haein does not look up from her
      board. Sejin, on her crate, does not even stop chewing. Hard white light, blue-grey shadows, the slit's violet at the left edge.
    calm: top
    lines:
      - {who: narr, type: tag, text: "OUTSIDE · 20 MINUTES IN"}
      - {who: sejin, type: speech, side: r, text: "TRAIN."}
      - {who: haein, type: speech, side: l, text: "THAT'S THE FOURTH ONE."}
    sfx:
      - {text: "RRRMMMMMBL", style: impact, at: [0.78, 0.30], size: L, rot: -4}
    notes: "Trains run about every five minutes (ch 10). Set-up for P30: tunnel noises lettered in plain impact style are trains; P30's boom comes through the gate, lettered in gate style."

  - id: P14
    shape: inset-l
    gap: short
    bg: white
    camera: "two-shot at eye level: Sejin seated in front, Taeo standing behind"
    art: >
      Sejin in the foreground, seated, holding up the half-eaten kimbap like a pointer, dry as dust. Behind her Taeo, sheepish, rubbing the
      back of his neck, ears pink. Simplified background.
    calm: right
    lines:
      - {who: "taeo", type: "speech", side: "r", text: "SORRY."}
      - {who: "sejin", type: "speech", side: "l", text: "I'M PAID TO WAIT. YOU'RE NOT. SIT DOWN."}
      - {who: "taeo", type: "speech", side: "r", text: "I'M FINE."}
    notes: "Ch 10: Sejin is on ₩300,000 a day to wait at the mouth; Taeo is unpaid. He does not sit until his legs decide for him (P39)."

  - id: P15
    shape: wide
    gap: short
    bg: white
    camera: "over Haein's shoulder at the table, toward Taeo at the tape"
    art: >
      Over Haein's right shoulder in the near foreground: the opened radio, a soldering iron in its stand, her hand on the dial. Facing her
      across the end of the table, Taeo stands at the tape with the clipboard against his chest. She has finally looked up at him: a plain,
      blunt, curious question with no malice in it. His answer is in his face before he says it: he looks away, to the slit. Violet light
      on his cheek.
    calm: top
    lines:
      - {who: "haein", type: "speech", side: "l", text: "WHY DON'T YOU JUST GO IN WITH HIM?"}
      - {who: "taeo", type: "speech", side: "r", text: "I CAN'T GO IN."}
    notes: "Echoes ch 9: '...I CAN'T GO IN.' Nobody explains why."

  - id: P16
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up on Haein, three-quarter, eyes down at her work"
    art: >
      Haein has gone back to the circuit board and touches the soldering iron to a joint; a thin curl of solder smoke. She says it flat, as a
      fact, without looking at him: the bluntness is how she carries it. Safety glasses on her head, red-orange vest. Plain background.
    calm: left
    lines:
      - {who: "haein", type: "speech", side: "c", text: "DAD USED TO GO IN FIRST. EVERY JOB."}
      - {who: "haein", type: "speech", side: "c", text: "NOW MINHO DOES."}
    notes: "Ryu Dongsik has used a wheelchair since a survey accident (ch 10 P40: pinned inside a gate, 'MINE TOOK NINE HOURS'). The line echoes Grandpa's ch 8 hook ('YOUR FATHER WENT IN FIRST TOO') without anyone saying so. Never point at it."

  - id: P17
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "extreme close-up of Taeo's eyes"
    art: >
      Extreme close-up strip of Taeo's eyes and brow, the gate's violet reflected small in both: something old has surfaced and he is holding
      it down. Not tears; stillness. One hard shadow under the brow. Nothing else in frame.
    calm: none

  - id: P18
    shape: inset-l
    gap: short
    bg: white
    camera: "medium on Haein glancing up from the table"
    art: >
      Haein glances up at Taeo for one beat and the blunt mask slips: she knows exactly what that face is. Her eyes are already on their way
      back to the board. Simplified background, violet edge light.
    calm: right
