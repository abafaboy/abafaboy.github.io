extras:
  ironvow_bracer: "Adult Korean woman, blunt black bob, charcoal jacket, steel chest harness, small pauldrons, muted dark-red chest strip and waist tabs, grey cargos, boots; same as ch 57."
  ironvow_runner: "Lean adult Korean man, short black hair, same Iron Vow member uniform and blunt practice shield; ch 57."
  official: "Same adult woman in grey exhibition polo, slate trousers, headset, blank credential."
  crowd: "Varied adult exhibition audience; most rise in surprise and celebration. BangBang's small chant cluster does not represent everyone."
locations: [exhibition_arena, exhibition_stands, grandparents_house]
location_notes:
  exhibition_arena: >
    Exact ch 57 final course. Taeo behind near clear barrier, never on course. LEFT wall padded ram and receiving pad;
    Orrin at centre pressure shoe; Sera on short rising firing carriage, bow LEFT, target a short safe shot away.
    Enclosed shoe linkage raises shutter and carriage. Crew bank-release timing is rehearsed, not improvised reflexes.
    Five preliminary one-point obstacles, then final relay worth three only when all three checks register;
    incomplete relay scores zero. Crew begins 3 to Iron Vow's 5, final relay remains. Crew finishes at 6-5 at horn.
    All action from P01-P27 fits the same 0.8-second interval; slow-motion rendering, not extra time.
  exhibition_stands: "Same tiered navy seats, support rail and accredited camera aisle as ch 57."
props:
  reservoir: "Exact ch 50 prototype: hand-sized dull-steel rectangular housing, split copper retaining band, ivory ceramic inspection window, two capped coupling ports, short grey webbing hand strap, analogue white indicator tab in mechanical slot, manual release. Intact throughout. Banks a bounded slice of mechanical impact, held briefly and released once. No new capacity or repair."
  phone: "Taeo's dark-grey phone, top-left hairline crack, green dinosaur sticker; face-down during heat, turned face-up after."
wardrobe_locks: >
  Taeo navy jacket over black hoodie, black cargos, black sneakers with one white stripe; RIGHT-eye mole;
  backpack OLD orange shield/open-door patch on chair. Fading forearm bruises; fresh local forearm soreness and
  a small nosebleed begin with this winning relay, reported to Sejin at once. No collapse until ch 60.
  Nib weathered adult 105 cm, LEFT V-notch, LEFT lower fang, pinkish-tan wrap, charcoal shorts, brown rope belt,
  RIGHT dinosaur pouch and LEFT wooden sheath, high black 8x30 binoculars with LEFT knot
  and fork hinge; his ID, folded PAPER drawing and cobalt fork-marked pencil remain secured. No pet styling.
  Ch 43 boots: matte dark-brown ankle-high leather, broad round toes, four pairs dull gunmetal round eyelets,
  dark-brown round laces in small double knots, black lug soles/low heels, heel pull tabs, oat-grey short socks
  inside collars; no logo, hooks, buckles, bright trim or visible steel cap. Identical pair, never barefoot.
  Orrin adult slate carrier, four legs, healed shell crack seam persists; no new crack. Sera adult human,
  river-green/cream/sand clothes, braid, brown boots, LEFT bow/bracer, RIGHT quiver and flute; blunt arrow.
palette_notes: >
  A4 institutional arena extension: overhead blue-white lamps, slate hard shadows, grey pads, navy stands.
  During load transfer use Nib amber only in Taeo's RIGHT palm, separate slate-green for Orrin.
  Blood is the single danger-red accent in P28 onward. No Sera link colour needed; bowshot is physical.
  Screens dark or absent except kit phone at hook. Boards blank for label UI. No magical arrow aura or laser force paths.
