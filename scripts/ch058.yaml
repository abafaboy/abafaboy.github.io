chapter: 58
title: 0.8 Seconds
when: "Same exhibition afternoon as ch 56-57. Opens on the final heat's last 0.8 seconds, then the immediate result and operator-box aftermath. Haru's presentation date is TODAY."
story_beats: PART_ONE_BEATS.md#58
cast:
  taeo: outdoor
  nib: default
  orrin: default
  sera: default
  haein: default
  sejin: default
