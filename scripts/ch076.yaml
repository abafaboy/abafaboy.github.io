chapter: 76
title: One Word
when: "First light after ch 75, then late afternoon in Mangwon, Seoul, following sleep. Sera and Sejin remain in Chungju; Nib's errand does not move the hospital. No date or weekday fixed."
story_beats: PART_ONE_BEATS.md#76
cast:
  nib: default # Adult scout, 105 cm; exact ch043 boots. All permanent props retained. Shorts off only behind closed staff door; secure knee-length cream towel during mending, gear on lap, boots remain on.
  granny_moon: default # 190-cm elderly grey-skinned woman, model-sheet design; full first-panel description P12. Only ONE spoken word, P34.
  taeo: outdoor # Navy jacket over black hoodie/cargos, striped sneakers, patched olive backpack. RIGHT forearm wrapped; mole under RIGHT eye. Yard only.
  kesh: default # Adult 198-cm moth-like signal keeper; full first-panel description P01. No link activation.
locations: [ryu_practice_yard, mangwon_street, moon_laundromat]
props:
  nib_boots: "Matte dark-brown ankle-high leather lace-up work boots; broad round toes, four dull gunmetal round eyelet pairs, dark-brown round laces in small double knots, black low-heel lug soles, heel pull tabs, oat-grey socks inside collars. No logo, hooks, buckles, bright trim or visible steel cap. Same ch043 pair."
  nib_locks: "LEFT ear V-notch, one lower LEFT fang, adult wiry/angular face; brown rope belt, RIGHT leather pouch with green dinosaur sticker, LEFT brown wooden sheath. Matte-black 8x30 binoculars high on chest, black woven strap knot LEFT neck, fork scratched on hinge. Protected pale-blue ID and folded PAPER post drawing remain in pouch. Cobalt-blue pencil with pink eraser, silver ferrule and three-line fork near eraser returns from Kesh in P02."
  shorts: "Same charcoal knee shorts as before. Ch029's charcoal backing and neat stitching at RIGHT outer thigh remain intact. Fresh separate ragged tear at RIGHT knee/lower hem from ch075; Granny Moon reinforces this new tear with charcoal cloth/thread. No replacement garment."
  counter_marks: "Ch029 mark is on the projecting lip of the NORTH service counter, pale distinct fork cuts. An older same-sized three-line fork is 6 cm to its west, its rounded grooves dull and rubbed; a draped dark felt sewing mat conceals it until P47. Never show the older mark early or create a glowing rune."
location_notes:
  ryu_practice_yard: "Use drawn key: fixed plywood maze central, grey office southwest, white west-facing van southeast, trestle west. Opening continues ch075's task-lamp table at dawn. No gate at yard."
  mangwon_street: "Use keyed red-brick residential-lane vocabulary, utility wires, muted surfaces; afternoon adaptation of night key. Do not reproduce the key's outdated three-storey description of Taeo's former building; no old flat is featured. Laundromat is a separate storefront on Nib's walking route."
  moon_laundromat: "Use notes and wide/reverse keys exactly: southeast glass entry, southwest corner window and folding table, half-lowered blind, four front-load washers WEST, two stacked dryer units EAST, NORTH service counter/sink, northeast staff door. Sewing is at NORTH counter, as ch029. Existing stool brought from front folding table. Warm dome pendants plus south daylight. No new rear exit."
continuity_notes: >
  Ch029's counter lip and repair were read after that concurrent script appeared. Preserve both.
  Granny Moon's native word is rendered THAR, production phonetic choice, meaning WATCHMAN in the scouts' speech.
  It is not a new name, password or proof of her biography. Nib asks who taught her; she provides no answer.
  She physically closes the storefront; no disappearance, Annex explanation, Kett contact or message cloth appears.
  No fee is set or transferred, no new carving is made, and Sera's recovery stays offstage in Chungju.
palette_notes: >
  Yard A4 dusty ochre, brown and dawn sky blue; city muted brick and afternoon grey-blue.
  Laundromat key: cream #D6CBB3, muted teal #6D8882, stainless #B7B9AE, warm dome light #CFAD7E,
  brown shadows #84755F; evening glass turns navy. Clean warm-black contours and hard cel shadows.
  No interface cyan, amber link pulse, decorative particles or readable generated surfaces.
