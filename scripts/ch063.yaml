chapter: 63
title: Consortium
when: "After ch 62's call and Haeseong visit. Preparation in Seoul, then the following morning and afternoon at Chungju; the first consortium descent. No calendar date is fixed."
story_beats: PART_ONE_BEATS.md#63
cast:
  taeo: outdoors # Navy jacket over black hoodie, black cargos, single-white-stripe sneakers; olive backpack, OLD faded orange shield-and-open-door patch; one mole under RIGHT eye. Never crosses.
  nib: default # All model locks; ch 43's chosen boots throughout, never barefoot. Black 8x30 binoculars, strap knotted LEFT; right pouch's dinosaur sticker, pencil, paper drawing and ID retained.
  orrin: default # Adult, 230 cm long, 135 cm shell height; stacked slate shell, healed ch 37 crack retained as a pale seam. No saddle or harness.
  sera: default # River-green wrap/cream underlayer, sand cropped trousers, brown boots; LEFT bow/bracer, RIGHT-shoulder quiver, RIGHT-hip bone flute, thick brown braid.
  minho: default # Brown jacket, grey tee, olive cargos, knee pads, work boots; grey streak LEFT temple, chest radio, LEFT watch.
  haein: default # Slate-blue overalls, beige tee, brown tool belt; glasses on crown except during tool work.
  sejin: default # Sage scrubs, olive medic rig, charcoal cargos and boots; new proper med kit.
  chae: default # Voice on phone only, no portrait.
extras:
  meridian_lead: "Recurring upstream field leader, Korean woman about 40, cropped dark hair, broad nose, navy waterproof field jacket with plain silver shoulder tab, charcoal trousers, navy helmet, black gloves; professional, economical, not a villain. Keep identical in later river chapters."
  consortium_clerk: "Korean man about 45, short thinning hair, pale-grey field vest over blue shirt, clipboard and cheap reading glasses."
  survey_crews: "Adults of mixed ages in plain slate, brown or moss field jackets, helmets and practical boots; no readable guild logos."
locations: [mapo_tyre_base, chungju_gate_site, chungju_river_gate]
location_notes:
  mapo_tyre_base: "Crew's ch 33 old tyre-shop compound in the Mapo gate zone, not Taeo's container home. No finished key yet. Reuse ch 33 layout when available. Featured bay: raised roller shutter, scarred worktable, tyre racks, plain pegboard; broad forecourt admits Orrin without a door gag during serious scenes."
  chungju_gate_site: "New, no drawn key. Fictional fenced service cutting in Chungju. A short concrete access tunnel ends at a steel scaffold frame around a door-height violet-black slit. Outside it, left looking in: white consortium canopy and map table; right: Sejin's medical canopy; van parking in the open cutting behind. Haein's grey base station stands beside the frame. Ordinary daylight reaches the tunnel mouth; work lamps illuminate the final approach."
  chungju_river_gate: "New, no drawn key. No sky: an unbroken low stone ceiling above a broad underground river. From the entry landing the river flows from distant upper-right toward lower-left/downstream; a walkable near-bank shelf follows it upstream. Recessed stone signal posts stand above old flood lines, with scored channels and paired sockets, always unlit initially. A carved settlement sign lies on the first shelf, away from the water. Marker 9 is farther upstream and remains unseen. Ryu white cable, blue band every metre, grey tripod relay every 50 m; cool white lamps, wet violet shadows, muted teal water. Never draw stars, a horizon sky or a predator yet."
props:
  boots: "Confirmed against ch 43 at final continuity check: matte dark-brown ankle-high leather lace-up work boots, broad round toes, four pairs of dull gunmetal round eyelets, dark-brown round laces in small double knots, plain black low-heeled lug soles, heel pull tabs; oat-grey short socks just inside collars. No visible steel cap, hooks, buckles, logo, bright trim or metal plate. Exact same purchased pair throughout; overrides barefoot sheet."
  relay: "Ryu wired survey line: white cable, blue band each metre; grey relay tripod every 50 m, speaker grille, coiled handset and white status lamp. New grant-funded cases do not change this standard. No wireless threshold reception."
palette_notes: "A4 base/yard extension: dusty ochre, warm brown, cool daylight. Chungju surface: cool concrete grey with muted blue shadows. River: the A4 gate violet shadows under actual cold-white survey lamps, muted teal water; there is NO SKY. Interface cyan #3FE3F2/deep navy #0B1530 only for Taeo's windows, amber #F2A93B only for Nib's link and eyes. Return marks cold white/violet. No decorative glow, dust, fog or readable markings."
panels:
  - id: P01
    shape: full
    gap: none
    bg: white
    camera: "table height, across the Mapo worktable toward Sera rising"
    art: >
      mapo_tyre_base, continuing ch 62's hook: sera, default river-green wrap and cream sleeves, has stood so abruptly
      her stool tilts behind her. Her LEFT hand closes on her recurve bow; her face loses its performance smile.
      taeo, outdoors, holds his dark-grey cracked phone near the table. Cool workshop daylight, ochre wood and brown
      shadows per A4 yard extension. Keep the phone face away, documents blank; no generated words or effects.
      Taeo stands on the left with the phone, Sera on the right; Chae's voice comes from that phone at left.
    calm: top
    lines:
      - {who: "offpanel:chae", type: phone, side: l, text: "THE CARVING MATCHES THE STYLE ON SERA'S MAP."}
      - {who: sera, type: speech, side: r, text: "SHOW ME."}
    notes: "Start at the previous hook, with Sera standing. Ch 62 absent at drafting; the phone call remains live."
  - id: P02
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up overhead, Sera's finger between two nonalphabetic emblems"
    art: >
      At mapo_tyre_base, sera's LEFT bracer and five-finger hand frame a printed survey still beside her worn river map.
      Both contain the same simple carved settlement emblem, copied exactly between them, not alphabetic writing.
      Her fingertip stops just short of the still. Cold daylight from the raised shutter; muted paper tan, violet-grey
      photographic stone. No name, date, brother's face or readable map annotations.
    calm: none
    silent: true
  - id: P03
    shape: inset-r
    gap: short
    bg: white
    camera: "close three-quarter on Taeo from Sera's seated eye line"
    art: >
      taeo, navy jacket and black hood at mapo_tyre_base, watches sera off left rather than her map. His tired eyes
      are careful, the mole under his RIGHT eye visible, mouth hesitant. Shutter daylight from left, blue-grey
      shadow against simplified warm plywood. Backpack strap crosses one shoulder; no screen or interface.
      Taeo is framed chest up on the right.
    calm: left
    lines:
      - {who: taeo, type: speech, side: r, text: "SORRY. A MATCHING CARVING DOESN'T MEAN ILAN IS THERE."}
  - id: P04
    shape: full
    gap: short
    bg: white
    camera: "low profile two-shot, bow crossing the space between them"
    art: >
      sera, default, slides the still into her own map roll at mapo_tyre_base, bow held left, flute at right hip.
      She looks directly at taeo, outdoors, with an impatient adult certainty; his hand leaves the paper to her.
      Daylight on muted river-green cloth and brown tabletop, hard violet-grey shadows. Do not depict Ilan,
      a portal to her village or a guaranteed rescue destination. Leave the top plain.
      Sera stands on the left, Taeo on the right, with room for both figures.
    calm: top
    lines:
      - {who: sera, type: speech, side: l, text: "THE CARVING MEANS SOMEONE MAY KNOW ABOUT ILAN."}
      - {who: taeo, type: speech, side: r, text: "THEN WE'LL ASK ABOUT HIM."}
  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 63 · CONSORTIUM"
  - id: P06
    shape: full
    gap: long
    bg: white
    camera: "establishing high angle from the Chungju cutting's vehicle ramp"
    art: >
      chungju_gate_site: the concrete service tunnel, its scaffold-framed violet-black gate visible at the far end;
      map canopy LEFT, medical canopy RIGHT, several plain vans behind. minho, brown field jacket, greets the navy-clad
      meridian_lead while taeo's crew unloads relay cases. sejin opens the proper medical kit. Pale morning daylight
      from the cutting and white tunnel work lamps, concrete grey/blue shadows. All vehicle plates and banners blank;
      no press crowd, readable brands or gate taller than a door.
    calm: top
    lines:
      - {who: narr, type: tag, text: "CHUNGJU · THE NEXT MORNING"}
      - {who: taeo, type: float, text: "I HAD GOT USED TO BEING THE SMALL TEAM."}
  - id: P07
    shape: narrow-l
    gap: short
    bg: white
    camera: "kit phone hand facing the reader"
    art: "KIT HAND"
    calm: none
    ui:
      - {kind: phone.gate_status, on: screen, hand: taeo_left_tilt, title: "GATE SAFETY KOREA", text: "CHUNGJU RIVER · A-GRADE · OPEN · CONSORTIUM SURVEY · NO CLEAR AUTHORISED"}
    lines:
      - {who: taeo, type: float, text: "WORKING WITH BIGGER TEAMS DID NOT MAKE ME FEEL SAFER."}
  - id: P08
    shape: full
    gap: short
    bg: white
    camera: "eye level across the consortium map table"
    art: >
      At chungju_gate_site under the LEFT canopy, minho, default brown jacket, places his grey field case alongside
