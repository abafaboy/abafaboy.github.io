    calm: top
    lines:
      - {who: haein, type: speech, side: l, text: "A DOOR BIG ENOUGH FOR YOU."}
      - {who: orrin, type: speech, side: r, text: "A LOW BAR. FINALLY CLEARED."}
  - id: P12
