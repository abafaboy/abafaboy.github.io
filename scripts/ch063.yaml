      cropped dark hair, broad nose, navy waterproof jacket with plain silver shoulder tab, charcoal trousers,
      navy helmet and black gloves; her measuring look is professional. Other crews wait behind. Cool daylight,
      concrete grey and muted navy. The map has shapes and blank tabs only; no floating UI.
      The Meridian leader stands on the left, Minho on the right; keep both faces clear above the map.
    calm: top
    lines:
      - {who: meridian_lead, type: speech, side: l, text: "MERIDIAN SURVEYS UPSTREAM. RYU MAINTAINS THE RADIO LINE."}
      - {who: minho, type: speech, side: r, text: "IF OUR LINE FAILS, WE STOP THE SURVEY."}
      - {who: meridian_lead, type: speech, side: l, text: "AGREED. ONE SHARED MAP. EACH TEAM COMMANDS ITS OWN PEOPLE."}
  - id: P09
    shape: strip
    gap: short
    bg: white
    camera: "overhead close on four hands placing route tabs"
    art: >
