chapter: 18
title: The News Doesn't Say Porter
when: "The Thursday of the Guro job (ch 12-17) into Friday morning, spring. No calendar date is lettered. Ch 17's signing ends at about 5:00 PM. 7:12 PM to about 9:20 PM at a hospital in Guro-gu (Kwak awake by about 7:40 PM); Line 2 to Hapjeong; Taeo's last night shift at Hanbit Mart 10:04 PM to 6:02 AM (Dokgo at 11:40 PM, the break at 3:10 AM, Manager Oh at 5:58 AM); 8:57 to about 9:03 AM on Friday at the flat, running straight into ch 19 (Chae's follow-up texts there are stamped 09:13 and 09:14)."
story_beats: PART_ONE_BEATS.md#18
cast:
  taeo: outdoor     # P02-P27: navy zip jacket over the black hoodie, black cargo trousers, black sneakers with one white stripe, grey site dust on his knees and sleeves (the borrowed Ryu Survey vest handed back, the hard hat left at the site, ch 17); olive backpack (orange patch out); a twist of tissue in his LEFT nostril and a dried line of blood under it (ch 16 recoil, ch 17 P46). Square plaster on RIGHT palm from ch 17 P44, retained all chapter. P28-P50: work (Hanbit Mart vest over the hoodie, jacket in his locker, nose washed). P51-P61: default (black hoodie; the folded vest over his arm in P51, dropped on the bed by P53)
  nib: default      # barefoot; grey dust on skin and clothes and a dusty graze across his RIGHT shoulder blade (ch 17) until he washes at the store (P28 on: skin clean, graze cleaned, clothes still streaked). Sejin's silver foil emergency blanket worn round his shoulders like a cape (ch 17 P45) from P02 to P27; from P28 it is folded away in Taeo's locker. Pouch on the RIGHT hip with Haru's small green dinosaur sticker on its flap (ch 8); brown wooden sheath on the LEFT hip. From P20 he carries Kwak's knee pads in his hands or lap and never wears them (except the chibi P22 and the end card)
  dami: default     # Gu Dami, 19 (ch 13): cheap yellow-green hi-vis vest bristling with pockets over a grey hoodie, grey cargo trousers, worn grey work gloves, all dusty; her scuffed WHITE hard hat on the seat beside her; a cheap phone, kept in the vest's chest pocket (ch 13 and 16); dried tear tracks through the dust; Kwak's faded navy canvas work jacket in her lap (ch 13, ch 17). Hospital scenes only (P02-P23)
  mansu: default    # Kwak Mansu, 58 (ch 13: grey at the temples, grey stubble, deep lines, heavy-set), in a pale blue hospital gown: oxygen cannula, bruised left cheekbone, grazed forehead, IV in the back of his left hand; his blanketed legs propped on a pillow with two blue cold packs across his shins, the LEFT worse (ch 15–17). His back brace, vest, torn trousers, boots and knee pads are in the belongings bag
  dokgo: default    # Dokgo Chul, 50s (ch 13, ch 15): navy windbreaker, greying hair, grey stubble, heavy eye bags, no hard hat tonight; TWO phones (the general contractor's call phone, and the porter-app phone in a cracked black rubber case), a clipboard tablet under his LEFT arm, an unlit cigarette behind his right ear. P30-P44
  eunchae: work     # high ponytail, cream shirt with rolled sleeves, grey-green Hanbit Mart vest with a BLANK name tag, handheld barcode scanner and stock clipboard; her dog-eared exam workbook in the break room
  manager: default  # Manager Oh: short black hair, black polo, clipboard, keys. P49-P50 only
  chae: default     # voice only, on the phone (P56, P57, P61)
extras:
  ironclad: "IRONCLAD SEVEN, the clear team (ch 14; ch 18's headline), designed to match ch 17: seven hunters, men and women in their twenties and thirties, in matching polished gunmetal-grey armour vests and shoulder plates over black tactical wear, each with the same small sponsor patch on the chest (a plain coloured block, no letters); swords, a spear, a round shield, two short axes; clean, at ease. TV footage only (P01, P29); the young gimbal-phone hunter films the team, screen away."
  ironclad_lead_look: "Ironclad's leader (as ch 17): a broad man in his thirties with a buzz cut and a showman's grin, a two-handed warhammer on his shoulder."
  tv_porters: "the three Dokgo porters of ch 17 (extras.porters there), in the TV footage (P01): cheap yellow-green hi-vis vests with white number patches, sitting on blue plastic crates by the site hoarding, scuffed white hard hats on their knees, heads down. Faces never featured."
  nurse: "ER nurse, about 45: navy scrubs, a lanyard with a blank card, hair in a tight bun, reading glasses pushed up on her head, a clipboard; tired and firm, not unkind"
  boy: "a boy of about 11 in a red football shirt, his left forearm in a fresh white cast and a blue sling; bouncing with excitement, holding his mother's phone"
  mother: "the boy's mother, about 40: office blouse under a beige trench coat, hair coming loose from its clip, exhausted"
  er_patients: "two other people waiting in the ER: an old man in a padded jacket with a drip stand, and a young man in a suit holding an ice pack to one eye; drawn simply"
  stocker: "the construct stocker (ch 5, ch 6): a sleek, pale, faceless mannequin construct about 180 cm tall with smooth jointed limbs, in a grey-green Hanbit Mart cap; identical, perfect motions. Match ch005's design."
  kiosk: "prop, new in this chapter: a self-checkout kiosk, a slim pale-grey pillar about 150 cm tall with a tilted touchscreen, a card slot, a receipt slot and a small speaker grille. A strip of clear protective film is still on one side until P49. It stands on the front strip just east of the west-return glass entrance, between the basket stack and the low drinks display, its screen facing north into the shop. Its voice (P51) is a bright synthetic female voice."
  reporter: "the KNN 24 field reporter of ch 17: a man in his thirties in a navy suit, neat side-parted hair, a handheld mic with a blank cube logo. Seen in the footage in P01; his voice in P01-P02"
  ironclad_lead: "the Ironclad Seven lead's voice, on the store TV (P29); his look is extras.ironclad_lead_look"
  gc_director: "voice only: the general contractor's site director, on Dokgo's phone (P36)"
locations: [guro_hospital_er, seoul_line2, mart_street, hanbit_mart, hanbit_breakroom, taeo_flat]
location_notes:
  guro_hospital_er: "no key yet. The emergency department of a general hospital in Guro-gu, a short walk from a Line 2 station. Waiting area: rows of linked pale-blue plastic chairs, a wall-mounted TV high in one corner, a reception window, wide double doors into treatment. Treatment area: a corridor of curtained bays (pale mint curtains on ceiling tracks), each with a bed, a monitor on an arm, a wall oxygen outlet with a flowmeter and one plastic chair. Cold white-blue fluorescent light. Signs are blank white lightboxes."
  seoul_line2: "no key yet. A Seoul Metro Line 2 car crossing the Han on the Dangsan Railway Bridge between Dangsan and Hapjeong stations at night: long bench seats along both walls, grab poles and hand straps, big windows full of black river and the lit city on the far bank. Real geography: Line 2 runs above ground over the river here; Sindorim (Guro-gu) to Hapjeong is four stops."
  mart_street: "world/LOCATIONS.md (hanbit_mart entry). New from this chapter: the kiosk is visible through the glass just inside the door."
  hanbit_mart: "world/LOCATIONS.md and world/floorplans/hanbit_mart.png. New from this chapter (decided here): the self-checkout kiosk on the front strip just west of the door (extras.kiosk); vitamin-drink gift boxes stacked on the low drinks display by the door; from Friday night the store runs unstaffed 22:00-06:00 with the stocker and the kiosk, entry by bank card."
  hanbit_breakroom: "Alias of drawn key hanbit_breakroom: two west-wall lockers; folding table on east wall south of the fridge, one blue-grey stool, microwave on the northeast fridge, rota board above the table; one outward-opening southwest door. Use the drawn key, not the superseded floor plan."
  taeo_flat: "world/LOCATIONS.md and floor plan, the 'daytime with the curtain closed' look (as ch 19): the grey-blue blackout curtain drawn, the room dim blue-grey with one hard yellow line of daylight at the curtain's edge. Positions handed to ch 19: Nib sits on the floor with his back to the wall beside the entry step (by the door); Taeo starts on the floor against the bed's drawers at the window end and ends kneeling in front of Nib. On the folding table: THE CUP (white, thin green band) and Nib's paper drawing of his post with the white pebble on it (ch 4, ch 11). Never mirror the room."
palette_notes: "KNN footage (P01, P29): late-afternoon sun from the west on the site street and the hoarding's glossy render (P01), or floodlit night at the pit (P29); charcoal armour with brushed steel; in P01 the only saturated note is the porters' hi-vis yellow-green, kept in the bottom fifth where the lower third covers it. Hospital ER (proposed, not in A4): cold blue-white fluorescent, pale slate shadows, pale mint curtains; the only saturated note is Dami's hi-vis vest. Line 2 at night: deep navy car, black river, the city as hard-edged orange and white light shapes. Hanbit Mart at night: A4 (pale fluorescent green-white, grey-green shadows, the red sale tag the only saturated note); the break room a warmer cream. Dawn (P49-P52): pale blue-grey first light with a thin warm gold edge, streetlights still on. Flat by day with the curtain drawn (LOCATIONS.md, as ch 19): dim blue-grey, one hard yellow line of daylight at the curtain's edge. The hook (P61): the shard's fine cracks glow interface cyan #3FE3F2, hard-edged lines of light that throw cyan up onto both faces and fingertips; the rest of the room stays dim blue-grey (ch 19 floods the room cyan only at the integration). Nib's amber eyes are the only warm note. Amber #F2A93B appears only in Nib's eyes and in Taeo's palm in P21. There are no operator-interface windows in this chapter: the interface stays dark until ch 19 opens it."

panels:

  # ---------------- COLD OPEN: the news ----------------
  - id: P01
    shape: full
    gap: none
    bg: black
    camera: "the panel IS the KNN 24 broadcast: the KNN camera's own framing of ch 17's stand-up, eye level, a long lens flattening the depth"
    art: >
      Draw only the broadcast footage; the letterer adds the channel bug, the lower third and the ticker.
      The street outside the Guro site (guro_pit_street of ch 17) at about 4:50 PM, late sun from the left (west). Filling the background, the site's tall
      steel hoarding with its huge glossy render of an apartment tower and a smiling family on a balcony (the developer's logo a blank block).
      At the left edge, the KNN field reporter (extras.reporter) talks to camera with his mic. Behind him, posed against the render with arms folded,
      IRONCLAD SEVEN (extras.ironclad: gunmetal-grey armour vests and shoulder plates, blank chest sponsor patches, the ch 16 weapons), their lead
      in the centre (extras.ironclad_lead_look: broad man, buzz cut, warhammer on his shoulder), relaxed and pleased;
      one hunter brushes grey dust off a shoulder plate for the camera. Clean faces, barely a scratch on them.
      Bottom fifth of the frame, left of centre: the three porters (extras.tv_porters) sit on blue plastic crates against the foot of the hoarding,
      hard hats on their knees, heads down. Keep their heads and shoulders inside that bottom fifth: the letterer's lower-third banner and red ticker
      will cover them, leaving only the tops of their heads and the crates showing. That is the point of the panel.
      Palette: warm late sun, the render's glossy sky blue and white, charcoal and steel; the porters' hi-vis yellow-green is the only saturated note.
      Flat cel colour, hard shadows. No TV frame, no channel graphics, no letters anywhere, no blood, no ambulance (the camera faces away from it).
      The reporter's face and microphone stay in the left third.
    calm: top-left
    ui:
      - {kind: tv.lowerthird, on: panel, text: "IRONCLAD SEVEN CLEARS GURO GATE — NO CASUALTIES", ticker: "GMA CLEAR REPORT · HUNTER CASUALTIES: 0 · GURO-GU C-GRADE GATE CLOSED AT 16:00:30"}
    lines:
      - {who: reporter, type: phone, side: l, text: "IRONCLAD SEVEN CLOSED THE C-GRADE GATE IN GURO-GU JUST AFTER FOUR."}
    notes: "The footage is ch 17's camera setup and stand-up (P44, P56) from the KNN camera's side. The lower third sits over the porters on purpose: 'the porters aren't mentioned' is shown, not said. The ticker's 'HUNTER CASUALTIES: 0' is the only place the counting rule shows; it sits first so the clipped ticker keeps it. No line on the TV ever says 'porter'. The boss died at 4:00 PM; automatic returns and gate closure followed at 16:00:30 (ch 17)."

  - id: P02
    shape: tall
    gap: short
    bg: black
    camera: "pull back: the ER waiting area from the opposite corner, slightly high"
    art: >
      The waiting area of the emergency department (guro_hospital_er), 7:12 PM. Rows of linked pale-blue plastic chairs under cold white-blue fluorescent light.
      High on the wall at top left, a wall-mounted TV, screen: green.
      Directly under it, in one row, three people grey with site dust. In the middle Dami (dami, default: yellow-green hi-vis vest over a grey hoodie, worn work gloves),
      slumped forward with Kwak's faded navy canvas work jacket clutched in her lap, her scuffed white hard hat on the seat beside her.
      On her left Taeo (taeo, outdoor: navy zip jacket over the black hoodie, dust on his knees), a twist of tissue in his left nostril and a dried line of blood
      under it, the olive backpack (orange patch out) between his feet, staring at nothing.
      On her right Nib (nib, default) crouches on his seat in a balanced squat, feet on the plastic, forearms on his knees, like a scout on a wall,
      Sejin's silver foil emergency blanket still round his shoulders like a cape: dust streaks on his olive skin and in his spiky hair, barefoot,
      his feet filthy; he is looking up at the TV.
      In the next row, small: the boy with the cast and his mother (extras.boy, extras.mother); further off the er_patients. The double doors to treatment at the right.
      Palette: cold blue-white and pale slate; Dami's yellow-green vest is the only saturated note. Nib is a weathered adult, not cute.
      No readable signs, no blood beyond the dried line under Taeo's nose.
      Taeo sits on the left, Dami in the centre, and Nib on the right. The unseen reporter's voice comes from the TV at upper left. Give the seated trio room below the television.
    calm: top-right
    ui:
      - {kind: tv.lowerthird, on: screen, text: "IRONCLAD SEVEN CLEARS GURO GATE — NO CASUALTIES", ticker: "GMA CLEAR REPORT · HUNTER CASUALTIES: 0 · GURO-GU C-GRADE GATE"}
    lines:
      - {who: "narr", type: "tag", text: "GURO-GU · 7:12 PM"}
      - {who: "offpanel:reporter", type: "phone", side: "l", text: "ALL SEVEN HUNTERS CAME HOME. A CLEAN CLEAR. NO CASUALTIES."}
      - {who: "taeo", type: "float", text: "THEY READ OUT SEVEN NAMES."}
    notes: "About two and a quarter hours after ch 17's hook. Dami was refused the ambulance ride at ch 17 P36. She followed to hospital WITH Taeo and Nib after the 5:00 PM signing. 'A CLEAN CLEAR. NO CASUALTIES.' is the reporter's ch 17 line, now on air. The folded invoice is in Taeo's jacket (seen in P53)."

  - id: P03
    shape: strip
    gap: short
    bg: black
    silent: true
    camera: "extreme close-up, Dami's hands in her lap"
    art: >
      Extreme close-up: Dami's two hands in worn grey work gloves, the fingertips split, knuckles white, gripping Kwak's big, faded navy canvas work jacket
      bunched in her lap. The jacket's chest pocket gapes open and empty (the sky-blue inhaler went into the gate with Nib in ch 14).
      One dark wet spot on the dusty canvas where a tear fell. Cold fluorescent light, hard shadows. Nothing else in frame.
    calm: none

  - id: P04
    shape: inset-r
    gap: short
    bg: black
    camera: "close-up from slightly below, Nib looking up at the TV"
    art: >
      Nib (nib) close, from slightly below, crouched on his plastic seat, looking up at the TV off-frame top left; its cold light on his face.
      Amber eyes flat and unimpressed, mouth a hard line, the small lower fang showing on the left; dust in his spiky black hair;
      the V-notch clear in the top of his LEFT ear; the crinkled edge of the silver foil blanket at his chin. A weathered adult soldier, not cute.
      Plain pale-slate background.
      Nib's face is in the right third.
    calm: left
    lines:
      - {who: nib, type: speech, side: r, text: "THEY CAN'T COUNT."}

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 18 · THE NEWS DOESN'T SAY PORTER"

  # ---------------- THE WAITING ROOM: fans and porters ----------------
  - id: P06
    shape: narrow-l
    gap: long
    bg: white
    camera: "close on a child's hand holding a phone upright"
    art: >
      A boy's small right hand (extras.boy) holding his mother's phone upright toward us, screen: green, his thumb hovering to tap.
      At the bottom edge, his left forearm in a fresh white cast in a blue sling. Behind, simplified pale-blue chairs. Cold fluorescent light.
    calm: none
    ui:
      - {kind: phone.hunterlink_rank, on: screen, clock: "19:14", heading: "TRENDING TODAY", ranks: [{name: "IRONCLAD SEVEN", votes: "48,210"}, {name: "SUNLINE", votes: "31,977"}, {name: "HAN SEORYUN", votes: "12,404"}], sponsor: "BLUEBIRD CAPITAL · Draw now, pay later", text: "TRENDING TODAY · 1. IRONCLAD SEVEN 48,210 · 2. SUNLINE 31,977 · 3. HAN SEORYUN 12,404 · Bluebird Capital: draw now, pay later"}
    sfx:
      - {text: "TAP TAP", style: phone, at: [0.74, 0.07], size: S, rot: -8}
    notes: "HunterLink fans adore the clear team. The sponsor banner is Bluebird Capital (Dami's lender; arc III). Han Seoryun's name keeps the idol thread in view without comment. 'text' is the letterer's fallback if the screen is not portrait."

  - id: P07
    shape: wide
    gap: short
    bg: white
    camera: "over Dami's left shoulder toward the next row"
    art: >
      Over Dami's shoulder (dami: the edge of her dusty hi-vis vest and the back of her head in the left foreground).
      In the next row the boy (extras.boy) bounces in his seat, holding the phone up to his exhausted mother (extras.mother) with his good hand,
      face blazing with hero worship; the mother, mid-sigh, does not look at the screen. At the right edge Taeo (taeo, outdoor), slumped,
      turns his head to watch the boy: a tired, unreadable face. Simplified waiting-room background, cold fluorescent light.
      Frame everyone from the waist up. Dami's shoulder is at far left; the boy sits in the centre and his mother to his right, with Taeo's watching face at the far right edge.
    calm: top
    lines:
      - {who: boy, type: shout, side: c, text: "MUM! IRONCLAD SEVEN'S NUMBER ONE! I'M GOING TO BE A HUNTER!"}
      - {who: mother, type: speech, side: r, text: "YOU'RE GOING TO BE A DENTIST."}

  - id: P08
    shape: tall
    gap: short
    bg: white
    camera: "Dami's point of view, looking down into her lap"
    art: >
      Dami's point of view looking down: her two gloved hands hold her cheap phone (the one from her vest's chest pocket, ch 16), screen: green,
      her right thumb just lifting off the screen after pressing send. Below the phone, Kwak's faded navy jacket bunched in her lap and her grey-dusted
      knees in cargo trousers; at the top edge, the yellow-green hem of her hi-vis vest. Pale-blue plastic seat edges on either side.
      Cold fluorescent light, hard shadows. This phone is NOT Taeo's: no crack, no dinosaur sticker.
    calm: none
    ui:
      - {kind: phone.ttok_chat, on: screen, title: "PORTERS · GURO PIT", clock: "19:14", date: "THURSDAY", messages: [{from: them, text: "KNN: ironclad seven clears guro gate. no casualties", time: "19:02"}, {from: them, text: "no casualties?? uncle mansu went out on a stretcher", time: "19:04"}, {from: them, text: "they only say porter when one of us goes missing", time: "19:07"}, {from: me, text: "Again nobody says our names.", time: "19:14"}]}
    sfx:
      - {text: "BZZT", style: phone, at: [0.84, 0.18], size: S, rot: 10}
      - {text: "BZZT", style: phone, at: [0.14, 0.30], size: S, rot: -8}
    notes: "The porters' own group chat, the same one ch 16 P31 showed at 14:52 (title, THURSDAY date pill, lowercase style from the others, Dami in sentence case). 'When one of us goes missing' is ch 11's KNN headline ('PORTER MISSING AFTER DOKGO CONTRACTING JOB IN GURO'); that porter stays unnamed. Dami's message sets up her ch 20 dream: 'TO BE A PORTER PEOPLE SAY THE NAME OF.'"

  - id: P09
    shape: inset-l
    gap: short
    bg: white
    silent: true
    camera: "close-up, three-quarter, Dami's face"
    art: >
      Dami (dami) close, three-quarter, the phone's glow on her chin: dust caked on her face, two clean, dry tear tracks through it,
      jaw set, eyes hard and dry. She has finished crying and started being angry. Plain pale-slate background, cold light from above.
    calm: right

  # ---------------- THE BAY: Kwak ----------------
  - id: P10
    shape: tall
    gap: long
    bg: white
    camera: "from the waiting area's double doors, looking down the treatment corridor"
    art: >
      The ER treatment corridor (guro_hospital_er): curtained bays down both sides, pale mint curtains on ceiling tracks, a parked trolley, a monitor's glow.
      Halfway down, the nurse (extras.nurse) stands at one bay's curtain, clipboard raised, calling up the corridor.
      In the foreground Dami is already on her feet and moving, the hard hat forgotten in her hand; behind her Taeo is half out of his chair,
      and Nib drops lightly from his seat to the floor. Cold blue-white light, slate shadows.
      The nurse is on the right by the curtain. Dami moves from the left foreground toward her; Taeo and Nib follow on the left. Show their bodies without compressing the corridor.
    calm: top
    lines:
      - {who: nurse, type: shout, side: r, text: "GUARDIAN FOR KWAK MANSU?"}

  - id: P11
    shape: tall
    gap: short
    bg: white
    camera: "medium two-shot at the curtain gap, Dami and the nurse"
    art: >
      The nurse (extras.nurse) blocks a gap in the mint curtain with her clipboard, firm and tired; Dami (dami) in front of her, small and dusty,
      one gloved hand gripping the curtain edge, chin up, pleading. Simplified corridor behind.
      Dami stands on the left and the nurse on the right. Frame both from the knees up, with both faces visible.
    calm: left
    lines:
      - {who: "nurse", type: "speech", side: "r", text: "ONE GUARDIAN ONLY."}
      - {who: "dami", type: "speech", side: "l", text: "MR. KWAK HAS NOBODY HERE. TAEO AND NIB SAVED HIM. PLEASE."}
      - {who: "nurse", type: "speech", side: "r", text: "FIVE MINUTES."}

  - id: P12
    shape: full
    gap: short
    bg: white
    camera: "inside the bay from the foot of the bed, slightly high"
    art: >
      Inside a curtained ER bay (guro_hospital_er). Kwak Mansu (mansu: 58, heavy-set, grey at the temples, grey stubble, deep lines, kind tired eyes)
      lies propped up in a pale blue hospital gown: an oxygen cannula under his nose, a bruise on his left cheekbone, a graze on his forehead,
      an IV line taped to the back of his left hand; his blanketed legs are propped on a pillow with two blue cold packs strapped across the shins, LEFT worse.
      A monitor on an arm beside him, screen dark with plain shapes; a wall oxygen outlet with a flowmeter; on the plastic chair, a clear plastic
      patient-belongings bag holding his folded vest and work clothes, his black back brace and dusty boots.
      Crowding the curtain: Dami at the bedside, Taeo just inside the curtain, Nib (foil cape) at the foot of the bed, his head at mattress height.
      Kwak's eyes are open and finding them. Cold white-blue light. No blood.
    calm: top-left
    lines:
      - {who: taeo, type: float, text: "THEY MISSED ONE. KWAK MANSU, FIFTY-EIGHT."}
    notes: "Kwak's injuries match ch 15–17: both shins pinned, LEFT worse; bruising, no fracture stated; asthma and dust, unconscious until oxygen; on oxygen; he cannot stand yet; kept in for observation, so ch 20's discharge stays plausible. Age 58 per ch 13 and the beats."

  - id: P13
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up, Kwak on the pillow"
    art: >
      Kwak (mansu) close on the pillow, the cannula under his nose, turning his head toward Nib (off-frame, low). A slow smile that crinkles his eyes;
      his breath is short. Pale mint curtain behind, simplified.
      Kwak's face is on the left.
    calm: right
    lines:
      - {who: "mansu", type: "whisper", side: "l", text: "NIB. YOU CAME LOOKING FOR ME."}

  - id: P14
    shape: full
    gap: short
    bg: white
    camera: "over Kwak's shoulder on the pillow toward the bedside"
    art: >
      Over Kwak's shoulder and the back of his head on the pillow (mansu, left foreground, the cannula tube looped over his ear).
      Beyond him at the bedside: Dami looks away at the curtain, lips pressed tight; Taeo (taeo, outdoor) meets Kwak's eyes and makes himself answer;
      Nib between them, lower, watching Kwak. Cold light, simplified background.
      Kwak's head is on the left in the foreground, Dami stands centre-left, Nib in the centre, and Taeo on the right. Frame the standing visitors from the knees up.
    calm: top-right
    lines:
      - {who: mansu, type: speech, side: l, text: "DID THE NEWS SAY MY NAME?"}
      - {who: taeo, type: speech, side: r, text: "...NO."}

  - id: P15
    shape: full
    gap: short
    bg: white
    camera: "medium two-shot across the bedside, Kwak and Dami"
    art: >
      A horizontal strip of two faces. Left: Kwak (mansu), a wry, pained grin, one eyebrow up, the cannula under his nose. Right: Dami (dami), furious and tearful,
      eyes brimming, mouth open. Flat pale background split by one diagonal band of slate shadow.
      Keep Kwak on the left and Dami on the right, both visible from the waist up at the bedside. Preserve the wry grin and Dami's furious tears.
    calm: none
    lines:
      - {who: "mansu", type: "speech", side: "l", text: "THE NEWS SAYS NO CASUALTIES? THEN I MUST BE FINE."}
      - {who: "dami", type: "intense", side: "r", text: "THAT'S NOT FUNNY."}
      - {who: "mansu", type: "speech", side: "l", text: "IT'S A LITTLE FUNNY."}
    notes: "Kwak's 'it's fine' habit is from ch 13 ('MY INHALER'S IN MY JACKET. IT'S FINE.')."

  - id: P16
    shape: tall
    gap: short
    bg: white
    camera: "side view of the bed at standing height"
    art: >
      Side view of the bed. Kwak (mansu) lifts his IV hand weakly toward the clear plastic belongings bag; Dami has picked it up and holds it open
      on the blanket; Kwak's other hand is already inside it, drawing out a pair of battered knee pads by their straps. His folded work clothes, the back brace
      and a pair of dusty boots show through the plastic. Nib and Taeo watch from the foot of the bed. Cold light.
      Kwak lies on the left, Dami holds his bag open in the centre, and Nib and Taeo watch on the right. Give the bed and standing visitors vertical room.
    calm: top
    lines:
