chapter: 18
title: The News Doesn't Say Porter
when: "The Thursday of the Guro job (ch 12-17) into Friday morning, spring. No calendar date is lettered. 7:12 PM to about 9:20 PM at a hospital in Guro-gu (Kwak awake by about 7:40 PM); Line 2 to Hapjeong; Taeo's last night shift at Hanbit Mart 10:04 PM to 6:02 AM (Dokgo at 11:40 PM, the break at 3:10 AM, Manager Oh at 5:58 AM); 7:58 to about 8:05 AM on Friday at the flat."
story_beats: PART_ONE_BEATS.md#18
cast:
  taeo: outdoor     # P02-P27: navy zip jacket over the black hoodie, grey site dust on his knees and sleeves, olive backpack (orange patch out); a twist of tissue in his LEFT nostril and a dried line of blood under it (the ch 16 recoil); a square plaster across his RIGHT palm (gravel graze, ch 16). P28-P50: work (Hanbit Mart vest over the hoodie, jacket in his locker, nose washed, plaster still on). P51-P61: default (black hoodie; the folded vest over his arm in P51)
  nib: default      # barefoot; grey dust streaks on skin and clothes until he washes at the store (P28 on: skin clean, clothes still streaked); pouch on the RIGHT hip with Haru's small green dinosaur sticker on its flap (ch 8); brown wooden sheath on the LEFT hip. From P20 he carries Kwak's knee pads in his hands or lap and never wears them (except the chibi P22 and the end card)
  dami: default     # fluorescent yellow-green porter vest over a grey hoodie, grey cargo trousers, worn grey work gloves, all dusty; yellow hard hat on the seat beside her; dried tear tracks through the dust. Hospital scenes only (P02-P23)
  mansu: default    # Kwak Mansu, 58 (PART_ONE_BEATS #13), in a pale blue hospital gown: oxygen cannula, bruised left cheekbone, grazed forehead, IV in the back of his left hand, left lower leg in a padded splint. His back brace and work clothes are in the belongings bag
  dokgo: default    # Dokgo Chul: dark navy windbreaker, grey stubble, heavy eye bags, two phones (one in hand, one in his chest pocket), a clipboard tablet under his arm, an unlit cigarette behind his right ear. P30-P44
  eunchae: work     # high ponytail, cream shirt with rolled sleeves, grey-green Hanbit Mart vest with a BLANK name tag, handheld barcode scanner and stock clipboard; her dog-eared exam workbook in the break room
  manager: default  # Manager Oh: short black hair, black polo, clipboard, keys. P49-P50 only
  chae: default     # voice only, on the phone (P56, P57, P61)
extras:
  ironclad: "IRONCLAD SEVEN, the clear team, seen on TV only (P01, P29): seven hunters in matching gunmetal-grey plate armour, each pauldron edged with one row of round rivets, dark navy padded undersuits, helmets carried under the arm; clean, healthy, media-friendly. The leader is a broad man in his late thirties with a buzz cut, a short dark beard and an easy grin. Not villains: they look exactly like the heroes the news wants."
  tv_porters: "Dokgo Contracting porters in the TV footage (P01): fluorescent yellow-green hi-vis vests over hoodies, yellow hard hats, gloves, hauling the team's black equipment cases up a plank ramp. Faces never featured."
  nurse: "ER nurse, about 45: navy scrubs, a lanyard with a blank card, hair in a tight bun, reading glasses pushed up on her head, a clipboard; tired and firm, not unkind"
  boy: "a boy of about 11 in a red football shirt, his left forearm in a fresh white cast and a blue sling; bouncing with excitement, holding his mother's phone"
  mother: "the boy's mother, about 40: office blouse under a beige trench coat, hair coming loose from its clip, exhausted"
  er_patients: "two other people waiting in the ER: an old man in a padded jacket with a drip stand, and a young man in a suit holding an ice pack to one eye; drawn simply"
  stocker: "the construct stocker (ch 5, ch 6): a sleek, pale, faceless mannequin construct about 180 cm tall with smooth jointed limbs, in a grey-green Hanbit Mart cap; identical, perfect motions. Match ch005's design."
  kiosk: "prop, new in this chapter: a self-checkout kiosk, a slim pale-grey pillar about 150 cm tall with a tilted touchscreen, a card slot, a receipt slot and a small speaker grille. A strip of clear protective film is still on one side until P49. It stands on the front strip just west of the glass door, between the basket stack and the low drinks display, its screen facing north into the shop. Its voice (P51) is a bright synthetic female voice."
  reporter: "voice only: the KNN 24 news anchor (P01, P02)"
  ironclad_lead: "the Ironclad Seven leader's voice, on the store TV (P29)"
  gc_director: "voice only: the general contractor's site director, on Dokgo's phone (P36)"
locations: [guro_hospital_er, seoul_line2, mart_street, hanbit_mart, hanbit_mart_breakroom, taeo_flat]
location_notes:
  guro_hospital_er: "no key yet. The emergency department of a general hospital in Guro-gu, a short walk from a Line 2 station. Waiting area: rows of linked pale-blue plastic chairs, a wall-mounted TV high in one corner, a reception window, wide double doors into treatment. Treatment area: a corridor of curtained bays (pale mint curtains on ceiling tracks), each with a bed, a monitor on an arm, a wall oxygen outlet with a flowmeter and one plastic chair. Cold white-blue fluorescent light. Signs are blank white lightboxes."
  seoul_line2: "no key yet. A Seoul Metro Line 2 car crossing the Han on the Dangsan Railway Bridge between Dangsan and Hapjeong stations at night: long bench seats along both walls, grab poles and hand straps, big windows full of black river and the lit city on the far bank. Real geography: Line 2 runs above ground over the river here; Sindorim (Guro-gu) to Hapjeong is four stops."
  mart_street: "world/LOCATIONS.md (hanbit_mart entry). New from this chapter: the kiosk is visible through the glass just inside the door."
  hanbit_mart: "world/LOCATIONS.md and world/floorplans/hanbit_mart.png. New from this chapter (decided here): the self-checkout kiosk on the front strip just west of the door (extras.kiosk); vitamin-drink gift boxes stacked on the low drinks display by the door; from Friday night the store runs unstaffed 22:00-06:00 with the stocker and the kiosk, entry by bank card."
  hanbit_mart_breakroom: "world/LOCATIONS.md and floor plan: lockers on the LEFT and the rota whiteboard on the RIGHT as seen from the door; the black stool against Taeo's (middle) locker; green crates on the back wall."
  taeo_flat: "world/LOCATIONS.md and floor plan, morning look. Taeo sits on the floor against the bed's drawers, the spot where he sat for the summon in ch 1; the folding table stands between him and the door. Never mirror the room."
palette_notes: "KNN footage (P01, P29): late-afternoon gold (P01) or floodlit night (P29) on a grey-brown construction pit, gunmetal armour; in P01 the only saturated note is the porters' hi-vis yellow-green, kept in the bottom fifth where the lower third covers it. Hospital ER (proposed, not in A4): cold blue-white fluorescent, pale slate shadows, pale mint curtains; the only saturated note is Dami's hi-vis vest. Line 2 at night: deep navy car, black river, the city as hard-edged orange and white light shapes. Hanbit Mart at night: A4 (pale fluorescent green-white, grey-green shadows, the red sale tag the only saturated note); the break room a warmer cream. Dawn (P49-P52): pale blue-grey first light with a thin warm gold edge, streetlights still on. Flat in the morning: A4 (cool grey-blue daylight, soft blue shadows, the yellow band from the curtain gap). The hook (P61): interface cyan #3FE3F2 floods the room with navy #0B1530 shadows; Nib's amber eyes are the only warm note. Amber #F2A93B appears only in Nib's eyes and in Taeo's palm in P21. There are no operator-interface windows in this chapter: the interface stays dark until ch 19 opens it."

panels:

  # ---------------- COLD OPEN: the news ----------------
  - id: P01
    shape: full
    gap: none
    bg: black
    camera: "the panel IS the KNN 24 broadcast: news-camera framing, eye level, a long lens flattening the depth"
    art: >
      Draw only the broadcast footage; the letterer adds the channel bug, the lower third and the ticker.
      A Seoul construction site at about 4:40 PM: the rim of a deep excavation pit with steel sheet-pile walls, a yellow tower crane,
      blue site hoarding (blank), churned grey mud. The gate is closed: no slit, nothing glowing.
      Centre and upper frame: IRONCLAD SEVEN (extras.ironclad) walk up out of the pit toward the camera in a loose heroic line,
      helmets under their arms, gunmetal plate catching the low gold sun. The leader in the middle raises a gauntleted fist and grins;
      two of the others laugh, one waves past the camera. Clean faces, barely a scratch on them.
      Bottom fifth of the frame, left of centre: three or four porters (extras.tv_porters) trudge up a plank ramp under the team's black
      equipment cases, heads down, faces turned away. Keep their heads and shoulders inside that bottom fifth: the letterer's lower-third
      banner and red ticker will cover them, leaving only the tops of their yellow hard hats and the cases showing. That is the point of the panel.
      Palette: warm late-afternoon gold, grey-brown mud, gunmetal; the porters' hi-vis yellow-green is the only saturated note.
      Flat cel colour, hard shadows. No TV frame, no channel graphics, no letters anywhere, no blood, no monster carcass.
    calm: top-left
    ui:
      - {kind: tv.lowerthird, on: panel, text: "IRONCLAD SEVEN CLEARS GURO GATE — NO CASUALTIES", ticker: "GMA CLEAR REPORT · GURO-GU C-GRADE GATE · ENTRY CLOSED 16:00 · HUNTER CASUALTIES: 0"}
    lines:
      - {who: reporter, type: phone, side: l, text: "IRONCLAD SEVEN CLOSED THE C-GRADE GATE IN GURO-GU AT FOUR THIS AFTERNOON."}
    notes: "The lower third sits over the porters on purpose: 'the porters aren't mentioned' is shown, not said. The ticker's 'HUNTER CASUALTIES: 0' is the only place the counting rule shows. No line on the TV ever says 'porter'. The boss died at 16:00 (ch 14, ch 17)."

  - id: P02
    shape: wide
    gap: short
    bg: black
    camera: "pull back: the ER waiting area from the opposite corner, slightly high"
    art: >
      The waiting area of the emergency department (guro_hospital_er), 7:12 PM. Rows of linked pale-blue plastic chairs under cold white-blue fluorescent light.
      High on the wall at top left, a wall-mounted TV, screen: green.
      Directly under it, in one row, three people grey with site dust. In the middle Dami (dami, default: hi-vis porter vest over a grey hoodie, worn work gloves),
      slumped forward with a big man's dusty canvas work jacket clutched in her lap, her yellow hard hat on the seat beside her.
      On her left Taeo (taeo, outdoor: navy zip jacket over the black hoodie, dust on his knees), a twist of tissue in his left nostril and a dried line of blood
      under it, a square plaster across his right palm, the olive backpack (orange patch out) between his feet, staring at nothing.
      On her right Nib (nib, default) crouches on his seat in a balanced squat, feet on the plastic, forearms on his knees, like a scout on a wall:
      dust streaks on his olive skin and in his spiky hair, barefoot, his feet filthy; he is looking up at the TV.
      In the next row, small: the boy with the cast and his mother (extras.boy, extras.mother); further off the er_patients. The double doors to treatment at the right.
      Palette: cold blue-white and pale slate; Dami's yellow-green vest is the only saturated note. Nib is a weathered adult, not cute.
      No readable signs, no blood beyond the dried line under Taeo's nose.
    calm: top-right
    ui:
      - {kind: tv.lowerthird, on: screen, text: "IRONCLAD SEVEN CLEARS GURO GATE — NO CASUALTIES", ticker: "GMA CLEAR REPORT · GURO-GU C-GRADE GATE · HUNTER CASUALTIES: 0"}
    lines:
      - {who: narr, type: tag, text: "GURO-GU · 7:12 PM"}
      - {who: reporter, type: phone, side: l, text: "ALL SEVEN HUNTERS CAME HOME SAFELY. THE GMA REPORTS NO CASUALTIES."}
      - {who: taeo, type: float, text: "THEY READ OUT SEVEN NAMES."}
    notes: "About three hours after ch 17's hook: Kwak went by ambulance, Taeo signed the penalty invoice at the kerb, and he, Nib and Dami followed to the hospital. The folded invoice is in Taeo's jacket (seen in P53)."

  - id: P03
    shape: strip
    gap: short
    bg: black
    silent: true
    camera: "extreme close-up, Dami's hands in her lap"
    art: >
      Extreme close-up: Dami's two hands in worn grey work gloves, the fingertips split, knuckles white, gripping the big dusty canvas work jacket
      bunched in her lap. The jacket's chest pocket gapes open and empty (the inhaler went into the gate with Nib in ch 14).
      One dark wet spot on the dusty canvas where a tear fell. Cold fluorescent light, hard shadows. Nothing else in frame.
    calm: none

  - id: P04
    shape: inset-r
    gap: short
    bg: black
    camera: "close-up from slightly below, Nib looking up at the TV"
    art: >
      Nib (nib) close, from slightly below, crouched on his plastic seat, looking up at the TV off-frame top left; its cold light on his face.
      Amber eyes flat and unimpressed, mouth a hard line, the small lower fang showing on the left; dust in his spiky black hair;
      the V-notch clear in the top of his LEFT ear. A weathered adult soldier, not cute. Plain pale-slate background.
    calm: left
    lines:
      - {who: nib, type: speech, side: r, text: "THEY CAN'T COUNT."}

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 18 · THE NEWS DOESN'T SAY PORTER"

  # ---------------- THE WAITING ROOM: fans and porters ----------------
  - id: P06
    shape: narrow-l
    gap: long
    bg: white
    camera: "close on a child's hand holding a phone upright"
    art: >
      A boy's small right hand (extras.boy) holding his mother's phone upright toward us, screen: green, his thumb hovering to tap.
      At the bottom edge, his left forearm in a fresh white cast in a blue sling. Behind, simplified pale-blue chairs. Cold fluorescent light.
    calm: none
    ui:
      - {kind: phone.hunterlink_rank, on: screen, clock: "19:14", heading: "TRENDING TODAY", ranks: [{name: "IRONCLAD SEVEN", votes: "48,210"}, {name: "SUNLINE", votes: "31,977"}, {name: "HAN SEORYUN", votes: "12,404"}], sponsor: "BLUEBIRD CAPITAL · Draw now, pay later", text: "TRENDING TODAY · 1. IRONCLAD SEVEN 48,210 · 2. SUNLINE 31,977 · 3. HAN SEORYUN 12,404 · Bluebird Capital: draw now, pay later"}
    sfx:
      - {text: "TAP TAP", style: phone, at: [0.78, 0.40], size: S, rot: -8}
    notes: "HunterLink fans adore the clear team. The sponsor banner is Bluebird Capital (Dami's lender; arc III). Han Seoryun's name keeps the idol thread in view without comment. 'text' is the letterer's fallback if the screen is not portrait."

  - id: P07
    shape: wide
    gap: short
    bg: white
    camera: "over Dami's left shoulder toward the next row"
    art: >
      Over Dami's shoulder (dami: the edge of her dusty hi-vis vest and the back of her head in the left foreground).
      In the next row the boy (extras.boy) bounces in his seat, holding the phone up to his exhausted mother (extras.mother) with his good hand,
      face blazing with hero worship; the mother, mid-sigh, does not look at the screen. At the right edge Taeo (taeo, outdoor), slumped,
      turns his head to watch the boy: a tired, unreadable face. Simplified waiting-room background, cold fluorescent light.
    calm: top
    lines:
      - {who: boy, type: shout, side: c, text: "MUM! IRONCLAD SEVEN'S NUMBER ONE! I'M GOING TO BE A HUNTER!"}
      - {who: mother, type: speech, side: r, text: "YOU'RE GOING TO BE A DENTIST."}

  - id: P08
    shape: tall
    gap: short
    bg: white
    camera: "Dami's point of view, looking down into her lap"
    art: >
      Dami's point of view looking down: her two gloved hands hold a cheap phone in a scuffed black rubber case, screen: green, her right thumb just lifting
      off the screen after pressing send. Below the phone, the dusty work jacket bunched in her lap and her grey-dusted knees in cargo trousers;
      at the top edge, the yellow-green hem of her hi-vis vest. Pale-blue plastic seat edges on either side. Cold fluorescent light, hard shadows.
      This phone is NOT Taeo's: no crack, no dinosaur sticker.
    calm: none
    ui:
      - {kind: phone.ttok_chat, on: screen, title: "Dokgo porters (19)", clock: "19:14", date: "TODAY", messages: [{from: them, text: "KNN: Ironclad Seven clears Guro gate. No casualties.", time: "19:02"}, {from: them, text: "No casualties?? Mansu went out on a stretcher", time: "19:04"}, {from: them, text: "Same as last time. 'He left the site voluntarily.'", time: "19:07"}, {from: me, text: "Again nobody says our names.", time: "19:14"}]}
    sfx:
      - {text: "BZZT", style: phone, at: [0.84, 0.18], size: S, rot: 10}
      - {text: "BZZT", style: phone, at: [0.14, 0.30], size: S, rot: -8}
    notes: "The porters' own group chat. 'Last time' is ch 11's hook (a porter missing after a Dokgo job, 'left the site voluntarily'); that porter is deliberately not named here. Dami's message sets up her ch 20 dream: 'TO BE A PORTER PEOPLE SAY THE NAME OF.'"

  - id: P09
    shape: inset-l
    gap: short
    bg: white
    silent: true
    camera: "close-up, three-quarter, Dami's face"
    art: >
      Dami (dami) close, three-quarter, the phone's glow on her chin: dust caked on her face, two clean, dry tear tracks through it,
      jaw set, eyes hard and dry. She has finished crying and started being angry. Plain pale-slate background, cold light from above.
    calm: right

  # ---------------- THE BAY: Kwak ----------------
  - id: P10
    shape: wide
    gap: long
    bg: white
    camera: "from the waiting area's double doors, looking down the treatment corridor"
    art: >
      The ER treatment corridor (guro_hospital_er): curtained bays down both sides, pale mint curtains on ceiling tracks, a parked trolley, a monitor's glow.
      Halfway down, the nurse (extras.nurse) stands at one bay's curtain, clipboard raised, calling up the corridor.
      In the foreground Dami is already on her feet and moving, the hard hat forgotten in her hand; behind her Taeo is half out of his chair,
      and Nib drops lightly from his seat to the floor. Cold blue-white light, slate shadows.
    calm: top
    lines:
      - {who: nurse, type: shout, side: r, text: "GUARDIAN FOR KWAK MANSU?"}

  - id: P11
    shape: inset-r
    gap: short
    bg: white
    camera: "medium close-up at the curtain gap"
    art: >
      The nurse (extras.nurse) blocks a gap in the mint curtain with her clipboard, firm and tired; Dami (dami) in front of her, small and dusty,
      one gloved hand gripping the curtain edge, chin up, pleading. Simplified corridor behind.
    calm: left
    lines:
      - {who: nurse, type: speech, side: r, text: "ONE GUARDIAN ONLY."}
      - {who: dami, type: speech, side: l, text: "HE'S GOT NOBODY HERE. THESE TWO PULLED HIM OUT."}
      - {who: nurse, type: speech, side: r, text: "...FIVE MINUTES."}

  - id: P12
    shape: full
    gap: short
    bg: white
    camera: "inside the bay from the foot of the bed, slightly high"
    art: >
      Inside a curtained ER bay (guro_hospital_er). Kwak Mansu (mansu: 58, heavy-set, thinning grey crew cut, broad weathered face, kind tired eyes)
      lies propped up in a pale blue hospital gown: an oxygen cannula under his nose, a bruise on his left cheekbone, a graze on his forehead,
      an IV line taped to the back of his left hand, his left lower leg in a padded splint on top of the blanket. A monitor on an arm beside him, screen dark with plain shapes;
      a wall oxygen outlet with a flowmeter; on the plastic chair, a clear plastic patient-belongings bag holding folded work clothes and a back brace.
      Crowding the curtain: Dami at the bedside, Taeo just inside the curtain, Nib at the foot of the bed, his head at mattress height.
      Kwak's eyes are open and finding them. Cold white-blue light. No blood.
    calm: top-left
    lines:
      - {who: taeo, type: float, text: "THEY MISSED ONE. KWAK MANSU, FIFTY-EIGHT."}
    notes: "Kwak's injuries (decided here, for ch 19-20): oxygen for the asthma and the dust, a fractured left lower leg in a splint, bruises; awake and weak, kept in for observation. Age 58 per PART_ONE_BEATS #13 (CHARACTER_BRIEF_2 says '40s'; the beats win)."

  - id: P13
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up, Kwak on the pillow"
    art: >
      Kwak (mansu) close on the pillow, the cannula under his nose, turning his head toward Nib (off-frame, low). A slow smile that crinkles his eyes;
      his breath is short. Pale mint curtain behind, simplified.
    calm: right
    lines:
      - {who: mansu, type: whisper, side: l, text: "THERE HE IS. THE ONE WHO LOOKED."}

  - id: P14
    shape: wide
    gap: short
    bg: white
    camera: "over Kwak's shoulder on the pillow toward the bedside"
    art: >
      Over Kwak's shoulder and the back of his head on the pillow (mansu, left foreground, the cannula tube looped over his ear).
      Beyond him at the bedside: Dami looks away at the curtain, lips pressed tight; Taeo (taeo, outdoor) meets Kwak's eyes and makes himself answer;
      Nib between them, lower, watching Kwak. Cold light, simplified background.
    calm: top-right
    lines:
      - {who: mansu, type: speech, side: l, text: "DID THE NEWS SAY MY NAME?"}
      - {who: taeo, type: speech, side: r, text: "...NO."}

  - id: P15
    shape: strip
    gap: short
    bg: white
    camera: "a two-face strip: Kwak on the left, Dami on the right"
    art: >
      A horizontal strip of two faces. Left: Kwak (mansu), a wry, pained grin, one eyebrow up, the cannula under his nose. Right: Dami (dami), furious and tearful,
      eyes brimming, mouth open. Flat pale background split by one diagonal band of slate shadow.
    calm: none
    lines:
      - {who: mansu, type: speech, side: l, text: "NO CASUALTIES? ...THEN I'M FINE."}
      - {who: dami, type: intense, side: r, text: "THAT'S NOT FUNNY."}
      - {who: mansu, type: speech, side: l, text: "IT'S A LITTLE FUNNY."}
    notes: "Kwak's 'it's fine' habit is from ch 13 ('MY INHALER'S IN MY JACKET. IT'S FINE.')."

  - id: P16
    shape: wide
    gap: short
    bg: white
    camera: "side view of the bed at standing height"
    art: >
      Side view of the bed. Kwak (mansu) lifts his IV hand weakly toward the clear plastic belongings bag; Dami has picked it up and holds it open
      on the blanket; Kwak's other hand is already inside it, drawing out a pair of battered knee pads by their straps. His folded work clothes, the back brace
      and a pair of dusty boots show through the plastic. Nib and Taeo watch from the foot of the bed. Cold light.
    calm: top
    lines:
      - {who: mansu, type: speech, side: l, text: "DAMI. MY BAG."}

  - id: P17
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up, Kwak's hands holding out the knee pads"
    art: >
      Extreme close-up: Kwak's thick, scarred, work-cracked hands, the IV cannula taped on the back of the left one, holding out two battered knee pads by
      their straps: black hard-plastic caps cracked and scuffed white at the edges, the foam flattened, the elastic straps frayed, one strap mended with silver tape.
      They are held toward the right of the frame, toward someone small. Hard cel light. Nothing else in frame.
    calm: none
    lines:
      - {who: mansu, type: speech, side: l, text: "THIRTY YEARS ON MY KNEES IN OTHER PEOPLE'S GATES."}
      - {who: mansu, type: speech, side: l, text: "TAKE THEM."}
    notes: "Thirty years: gates have opened for 31 (STORY_BIBLE §5), so Kwak has portered since he was about 28. Whether he goes back to portering is left open."

  - id: P18
    shape: inset-r
    gap: short
    bg: white
    camera: "medium close-up, Nib at the bedside, eye level with the mattress"
    art: >
      Nib (nib) at the bedside, his head level with the mattress, arms at his sides, not reaching for the knee pads held out at the left edge of frame.
      A level amber gaze, dust in his hair, the notched left ear. Proud, not cold. A weathered adult. Plain mint background.
    calm: left
    lines:
      - {who: nib, type: speech, side: r, text: "I WAS PAID."}

  - id: P19
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up, Kwak, straight on"
    art: >
      Kwak (mansu) close, straight on: the smile gone, his eyes steady, kind and very firm. The cannula, the bruised cheekbone. Plain pale background.
    calm: right
    lines:
      - {who: mansu, type: speech, side: l, text: "NOT BY ME."}

  - id: P20
    shape: wide
    gap: short
    bg: white
    silent: true
    camera: "low side angle at mattress height"
    art: >
      At mattress height, from the side: Nib (nib) takes the knee pads from Kwak's hands with both of his own, palms up, and dips his head once:
      a formal, soldier's acceptance, his hands unexpectedly gentle. Kwak's hands open and let go. Behind them Dami presses her gloved knuckles to her mouth;
      Taeo stands at the curtain edge, watching Nib. Cold light, hard shadows. Nib adult, not cute.
    calm: top

  - id: P21
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "extreme close-up, Taeo's right hand at his side"
    art: >
      Extreme close-up: Taeo's right hand hanging at his side by the navy jacket's hem, fingers half curled, the square plaster across the palm.
      In the centre of the palm a thin warm ring of amber light (#F2A93B) pulses under the skin: he is feeling Nib's grip on the knee pads.
      Pale mint curtain behind, simplified. No other glow anywhere.
    calm: none
    notes: "Motif: the amber pulse. Nib lets Taeo feel how hard he is holding them; nobody comments."

  - id: P22
    shape: inset-r
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag (characters/nib/chibi.png, the sparkling-pride pose). Chibi Nib, deadpan inside a ring of sparkles, has strapped ONE of Kwak's knee pads
      onto his leg: on him it covers everything from ankle to hip like a knight's greave. Chest out, he holds the second pad up like a shield.
      Same locks: notched left ear, brown rope belt, pouch on the right hip, wooden sheath on the left hip, barefoot. Flat pale-mint background with screentone dots.
    calm: left
    lines:
      - {who: nib, type: speech, side: r, text: "GOOD ARMOUR."}

  - id: P23
