chapter: 69
title: The Predator
when: Same dawn descent, immediately after ch068. About 06:48–06:55. Crosswalk collapse and rescue hold unfold
  in minutes.
story_beats: PART_ONE_BEATS.md#69
cast:
  taeo: outdoor
  nib: default
  orrin: default
  sera: default
  kesh: default
  minho: default
  haein: default
  sejin: default
  meridian_officer: default
extras:
  consortium_lead: Korean woman about 45, square face, close-cropped greying hair, charcoal waterproof field
    coat, white hard hat and a plain grey command folder; efficient and responsible, increasingly afraid.
  meridian_lead: Korean woman about 40, cropped dark hair, broad nose, navy waterproof field jacket with plain
    silver shoulder tab, charcoal trousers, navy helmet and black gloves; economical professional, identical
    to meridian_lead in ch063–064.
  south_lead: Adult Korean man about 40, shaved head, muted rust waterproof jacket, white helmet, compact shoulder
    radio; independent downstream survey captain.
  survey_workers: Adult mixed survey crews in muted slate work clothes, white hard hats and plain orange safety
    vests; no children.
locations:
- chungju_gate_site
- chungju_river_gate
location_notes:
  chungju_gate_site: 'Follow ch063–064 chungju_gate_site: fenced service cutting and short concrete access
    tunnel, scaffold-framed cold-rimmed slit at tunnel end. LEFT looking in, white consortium canopy/map table
    and folding operator table; RIGHT, Sejin medical canopy; vans behind in cutting. Haein base station beside
    frame. White cable with blue metre bands enters at frame foot. Small portable news TV on an equipment case
    under the LEFT map canopy; no extra room or building. Taeo remains outside.'
  chungju_river_gate: 'No drawn location key currently exists. Enclosed underground river under an unbroken
    black stone ceiling: NO SKY. Gate landing downstream; the dry right-bank shelf follows the white survey
    cable upstream, with grey tripod relays every 50 m. Current flows back toward the gate. At marker 9, a
    split pillar divides channels A (landward/right, a narrow stepped dry shelf) and B (waterward/left of the
    right-bank shelf, a low water-covered shortcut). A broad central shelf is the staging shelf. Upstream Meridian
    team beyond the pillar; independent south team at the downstream crosswalk; Nib/Orrin/Sera on the central/right-bank
    shelf. Old river relay stones have shallow grooves and movable stone contact tongues; never draw readable
    runes. Mineral seams supply a wrong-colour muted lilac key, portable lamps hard white, shadows violet.
    Preserve this topology across chapters 67–70.'
wardrobe_notes:
  taeo: 23, 181 cm, navy zip jacket over black hoodie, black cargo trousers and black sneakers with one white
    stripe. Exactly one mole under RIGHT eye. Olive backpack with faded orange OLD shield/open-door patch stays
    outside beside his chair. Dark grey phone with top-left hairline crack, clear case and green dinosaur sticker.
    Remains OUTSIDE throughout. Old faint forearm bruises, no new injury in 67–68.
  nib: 'Adult 105 cm wiry goblin; olive skin, pointed nose, LEFT ear V-notch, ONE lower LEFT fang, brown rope
    belt, torn pinkish-tan wrap top and charcoal knee shorts. Pouch RIGHT hip with green dinosaur sticker;
    brown wooden sheath LEFT. Pale-blue ID, folded PAPER post drawing and cobalt pencil with fork mark protected
    inside pouch. Matte-black 8x30 binoculars high on chest; woven strap knotted LEFT neck; fork mark on hinge.
    Purchased boots: matte dark-brown leather ankle boots from ch043, broad round toes, four dull gunmetal
    eyelet pairs, dark-brown round laces in small double knots, heel pull tabs, black low-heeled lug soles;
    oat-grey short socks hidden inside soft collars; no hooks, buckles or steel caps.'
  orrin: Adult stoneback, 230 cm long, four columnar legs with three blunt nails each; terraced dark stacked-slate
    shell, olive-grey skin, heavy-lidded gentle adult face. No clothes, saddle or harness. Previous shell crack
    healed/stabilised, visible as a pale seam; no new crack here.
  sera: 27, 172 cm adult human; strong shoulders, angular cheekbones, warm dark eyes, thick dark-brown braid
    with bone tie. River-green wrap tunic over cream short sleeves, sand cropped trousers, brown ankle boots.
    Recurve bow LEFT hand, bracer LEFT forearm, quiver over RIGHT shoulder, bone flute RIGHT hip. Both arms
    healthy through end ch070.
  kesh: 'Adult male moth-like signal keeper, 198 cm, slight mature body, narrow grey-tan face, near-black eyes
    with no white sclera, feathered antenna pair, close grey-brown head fur. Exactly two arms and two legs;
    five-finger hands. Four grey-brown wing panels folded cloak-like with diagonal bands, no eye spots. Olive
    sleeveless knee tunic, sash, dark narrow trousers, wrapped shoes; unlit signal wand. Low endurance. Unlit
    right-hand craft wand: dark wood, forked dull-metal head (ch065). Eventual link hue reserved in ch065:
    pale lilac #B7A0D3; not activated here.'
  meridian_officer: 'Use model sheet: Korean adult man, short neat black hair, navy field uniform with silver
    shoulder yoke/piping and trouser tabs, LEFT-ear headset, silver geometric pin LEFT chest, tablet LEFT hand,
    blank ID lanyard. This is the Meridian field-team liaison; no new personal name.'
palette_notes: 'A4 gate treatment adapted to an enclosed river: unbroken stone ceiling replaces wrong-colour
  sky. Muted lilac mineral reflection plus hard white headlamps; violet shadows, dark teal water. Outside:
  cool dawn blue-grey, hard white work lamp, muted safety orange. Cyan #3FE3F2/navy #0B1530 reserved for Taeo''s
  interface; amber #F2A93B only Nib eyes/consented RIGHT-palm link; Orrin link slate-green. No red except actual
  danger/injury. Cel flats, warm near-black varied ink, no haze, bloom, particles or glossy skin.'
boss_design: 'River predator: a long eel-like boss, roughly 16 m visible length, narrow blunt wedge head, small
  recessed dark eyes, broad low jaw with short backward teeth, charcoal-grey wet hide in flat planes, pale
  scarred underside, long low dorsal ridge and four short throat slits. No limbs, horns, luminous lure, human
  face or decorative glow. Keep most of its length under opaque dark teal water; never show it as a dragon.'
