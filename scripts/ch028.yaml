chapter: 28
title: Moving Day
when: "The day after ch 27: late-spring morning packing in the flat, the move to Ryu Survey's yard, dinner and Eunchae's visit that evening. The final scene is the following dawn, still before the coming Friday's Terrace contract allocation. No calendar date is lettered."
story_beats: PART_ONE_BEATS.md#28
cast:
  taeo: default # Black hoodie, black cargo trousers, black sneakers with one white stripe; mole RIGHT eye. Socks while packing, shoes at departure. Purple RIGHT forearm from ch 27; no heavy lifting, keeps cuff loose. Olive backpack with faded orange OLD shield-and-open-door patch; dark-grey cracked phone, green dinosaur sticker. Navy jacket hung in new home for ch 29.
  nib: default # Adult, 105 cm, wiry; V-notch LEFT ear, one LEFT lower fang, torn pinkish-tan wrap, torn charcoal knee shorts, BROWN rope belt, RIGHT pouch with dinosaur sticker, LEFT brown wooden sheath; barefoot. Matte black 8x30 binoculars high on chest, black strap knotted LEFT, Kett fork on hinge. Pale-blue ID and carved cobalt-blue pencil retained; folded PAPER watch-post drawing and white pebble packed safely. Carries THE CUP himself.
  orrin: default # Adult stoneback, 230 cm long, shell 135 cm high; angular terraced stacked slate, dust-grey olive skin, heavy-lidded olive eyes, four columnar legs with three blunt nails each, short tail. No clothing, pet gear, saddle or harness; shell intact. He chooses to carry the moving load on its broad crown.
  haein: default # Jaw-length black bob, slate-blue bib overalls, beige tee, brown tool belt, spanner RIGHT/screwdriver LEFT, clear glasses on crown, dark boots.
  minho: default # Brown jacket, grey tee, olive cargo trousers with black knee pads, brown boots; LEFT grey streak, LEFT chest radio, LEFT wrist watch.
  seonhee: default # About 55, strong Ryu brows, grey-templed low bun, reading glasses, pencil LEFT ear; moss-grey cardigan, cream shirt, slate trousers, scuffed brown shoes.
  dongsik: default # About 58, grey-templed short dark hair, square jaw, brown survey jacket over grey-beige shirt, olive-grey trousers, brown shoes, sage lap blanket; realistic steel-grey manual wheelchair.
  eunchae: default # 25, high brown ponytail, cream rolled-sleeve shirt, black trousers, black-and-white canvas sneakers; Hanbit vest OFF after practical, food-hygiene workbook in her bag, folded result sheet. Not staying at yard; her gosiwon and the lent window flashcard remain hers.
  bluebird_collector: default # Same no-tie suited lead, tablet in LEFT hand and exactly two windbreaker crew, fully described P52.
locations: [taeo_flat, taeo_building, taeo_street, ryu_practice_yard]
location_notes:
  taeo_flat: >
    Follow locations/taeo_flat/key_wide.png, key_reverse.png and key_detail.png: entrance opposite
    the SINGLE centred window, kitchenette left and bed right when looking in, desk/shelf left of window,
    rack right foreground. Drawn keys win over compass contradictions in LOCATIONS.md.
    Keep the narrow exterior balcony required by ch 24 beyond the window; its bent rail and the taped
    repaired/reseated panes remain after Orrin's extraction. Do not put Orrin upstairs again.
    The empty-room sequence removes all personal belongings; fixed rental bed frame/mattress, desk,
    wall shelf and kitchenette remain. Personal bedding, lamp, folding table and collapsed clothes rack move.
  taeo_building: >
    Fourth-floor flat, no lift, open-air access corridor, stair at its end; red-brick exterior and
    ground-level piloti. Orrin waits at ground level. Haein and Minho carry loads down the stairs.
    The old key goes into the manager's handover slot in a plain envelope. Deposit settlement stays off page.
  taeo_street: >
    The familiar Mangwon bus street outside the flat. The yard is about twelve minutes' ordinary walking
    distance; the moving party takes longer. Use broad pavement crossings, no gate or real street address.
  ryu_practice_yard: >
    Preserve key_wide/key_reverse: south double gate, southwest grey office with original step and
    added portable access ramp, last white van southeast facing west, fixed central maze, west trestle,
    three north targets. Ch 26's spare home is in the west-fence annex behind the office, door facing east;
    Haein's workshop is next north. Do not move the keyed office or enlarge the maze.
    Home interior decision: about 3 m east-west by 6 m north-south. East-wall door near south end,
    one small window immediately north of it. Taeo's low sleeping platform against north wall;
    Nib chooses a rolled mat along west wall with clear view to the door. West-wall shelf holds family
    photo; orange cone lamp on a crate beside it. Folding table in middle; clothes rack southwest.
    First rule paper on west wall by shelf, clear aisle to door. Orrin rests outside under a high,
    open-sided work canopy east of home, leaving the doorway and wheelchair route clear.
    Dinner uses two folding tables together in the west open strip, not inside the narrow container;
    wheelchair has a level approach and Orrin his own open side. No early tyre-shop base or GO FIRST sign.
props:
  cup: "THE CUP from ch 2: plain white ceramic mug, one thin green band, ordinary loop handle. No chip, face, name or replacement. Nib carries it through the move, places it on the new table, and it remains there."
  photo: "Same small framed family photograph from shelf above flat's desk: father and mother, Taeo at fourteen, Haru as a baby. It is not a current crew photograph or the grandparents' separate copy."
  moving_load: >
    Two closed cartons, rolled grey duvet and personal sleeping things, dismantled black clothes rack,
    folded low table, orange cone lamp protected in a carton, olive backpack with attached patch.
    Family photo and Nib's folded paper drawing/white pebble are protected in backpack sleeves.
    The little shelf plant from the flat key is protected in one carton with its pot upright.
    Haein and Minho bring these down; Orrin takes all packed household belongings from street to yard,
    on a stable low padded stack over his broad shell crown. No load above his neck, no harness or saddle.
palette_notes: >
  A4 flat morning: cool grey-blue daylight, soft blue shadows, narrow yellow band through window.
  Street and yard day: dusty ochre, warm brown, sky blue. Home/dinner: warm amber-brown from low sun
  and the moved orange cone lamp, steam white; no supernatural amber link. Eunchae's scene stays normal
  proportions in warm lamp side light and quiet blue-grey dusk. Dawn: pale blue-grey, long slate shadows,
  cold white practical lamps. No system windows or active link in this chapter.
continuity_notes: >
  The original thirty-day notice is not renewed; they move before its deadline. Remaining deposit of
  ₩1,600,000 is not shown paid back or spent. No rent or utility figure is invented beyond ch 26's agreed
  work-and-utilities terms. Taeo's ch 27 safety-officer payment remains spent and his RIGHT arm stays purple.
  Nib's original watch-post drawing travels; the separate lent window flashcard remains at Eunchae's gosiwon.
  Orrin's arrival registration was completed in ch 25; the collector's 'unregistered construct' is a false
  assumption, setting up ch 29's paperwork. Last van remains attached to the yard through the hook.

panels:
  # COLD OPEN: one small thing will not go in a box.
  - id: P01
    shape: strip
    gap: none
    bg: white
    silent: true
    camera: "extreme close-up from above on the green-banded mug and two hands"
    art: >
      Morning at taeo_flat. Taeo's LEFT hand (taeo, black hoodie cuff) starts wrapping a
      plain white ceramic mug with one thin green band in packing paper. Nib's scarred
      olive-green hand (nib, default) rests lightly on the handle, stopping the paper,
      not snatching at Taeo. Cool grey-blue window light, soft blue shadow and thin yellow
      highlight on ceramic. Five fingers per hand, real loop handle. No text, new chip,
      knife, supernatural glow or second mug.
    calm: none

  - id: P02
    shape: wide
    gap: short
    bg: white
    camera: "floor-height two-shot across the open packing carton at the folding table"
    art: >
      Taeo (taeo, black hoodie, socks, right sleeve loose over purple forearm) kneels beside
      an open carton at taeo_flat; Nib (nib, adult default, barefoot, high binoculars,
      full belt locks) stands opposite holding the green-banded cup upright by its handle.
      Nib's expression is flatly final, Taeo puzzled. Keyed kitchen left, bed right,
      centred window behind, cool grey-blue morning light with yellow window band.
      Cartons and packing paper blank, no readable labels or magic.
    calm: top
    lines:
      - {who: nib, type: speech, side: r, text: "THAT ONE COMES."}
      - {who: taeo, type: speech, side: l, text: "I WAS PACKING IT."}
      - {who: nib, type: speech, side: r, text: "NOT IN THAT."}

  - id: P03
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up on Taeo looking at the cup, half amused and half caught"
    art: >
      Taeo (taeo, default hoodie, RIGHT-eye mole) at taeo_flat looks from Nib's off-frame
      mug to Nib's face. His tired smile catches on a memory, small and unperformed.
      Loose right cuff at lower edge; one folded carton behind him. Cool morning grey-blue,
      soft blue shadow, yellow line from the centred window. No flashback inset, tears,
      comic blush, new pulse or readable carton marks.
    calm: left
    lines:
      - {who: taeo, type: speech, side: r, text: "IT'S A PERFECTLY GOOD BOX."}
      - {who: "offpanel:nib", type: speech, side: l, text: "I CARRY IT."}

  - id: P04
    shape: wide
    gap: short
    bg: white
    camera: "from beside the window toward the desk shelf as Taeo reaches for the family photo"
    art: >
      At taeo_flat Taeo (taeo, hoodie, socks) uses his LEFT hand to lift the small framed
      family photo from the shelf above the desk left of the keyed window. His bruised RIGHT
      arm stays close to his body. Nib (nib, default, full locks) behind him holds the mug
      with both hands now. The orange cone lamp sits below the shelf, ready to pack.
      Cool grey-blue daylight, soft blue and one yellow window stripe; photo images simple
      human shapes, no readable caption or added family members.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "ALL RIGHT. I'LL TAKE THESE."}

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 28 · MOVING DAY"

  # PHOTO, PATCH, CUP. THE ROOM THEY LEAVE.
  - id: P06
    shape: strip
    gap: long
    bg: white
    silent: true
    camera: "close-up over Taeo's left shoulder on the photo before he wraps it"
    art: >
      In taeo_flat Taeo's LEFT thumb (taeo, black hoodie cuff) brushes dust off the edge of
      the family frame. The same photograph: two ordinary parents with Taeo at fourteen and
      baby Haru; simple drawn faces, the father's hand on the older boy's shoulder. Present
      Taeo's face is cropped away, his pause visible through still fingers. Cool morning
      grey-blue light, soft blue shadow, faint yellow edge. No funeral memory, news footage,
      date, caption, new people or decorative haze.
    calm: none
    notes: "Packs the established photo without spending ch 40–43's backstory revelation."

  - id: P07
    shape: inset-l
    gap: short
    bg: white
    camera: "extreme close-up on the old orange patch as the backpack pocket folds around the frame"
    art: >
      Taeo's olive backpack at taeo_flat lies open on the folding table, family frame
      wrapped in plain cloth inside its padded sleeve. Taeo's LEFT hand closes the fastening
      while the faded orange embroidered shield-and-open-door patch catches daylight on the
      outside. Keep the OLD door design identical to Taeo's current model, frayed stitching.
      Cool grey-blue and soft blue shadows, muted orange thread. No new guild emblem,
      lettering, detached patch, spotlight glow or logos on packing cloth.
    calm: right
    lines:
      - {who: taeo, type: speech, side: l, text: "THAT STAYS ON."}
    notes: "Patch is packed by preserving the backpack it is sewn to, not magically detached. Motif only; no early P03 payoff."

  - id: P08
    shape: wide
    gap: short
    bg: white
    camera: "side-on at Nib's eye level, his paper drawing held above the open backpack"
