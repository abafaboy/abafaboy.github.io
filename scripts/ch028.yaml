  - id: P24
    shape: wide
    gap: short
    bg: white
    camera: "side-on between the home door and Haein's adjacent workshop door"
    art: >
      Haein (haein, overalls, bob, tool belt) at ryu_practice_yard's west annex leans against
      her workshop door north of the spare home, proud and awkward about the gift. Taeo
