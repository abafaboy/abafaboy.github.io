chapter: 5
title: Fifty Million
when: "Wednesday 15 March, early spring: the day after chapter 1 and the same day as chapters 3–4 (ch4 ends in the AAO lobby at about 12:58 PM). Taeo's shift today runs 4 PM to 10 PM (ch003 P10: 'Manager says come in at 4.'). 3:52 PM the construct stocker is delivered to Hanbit Mart; 6:12 PM Eunchae's break; 7:40 to about 7:47 PM Taeo's break in the stockroom and the call to Kanghan; 10:04 PM they leave the store; 10:17 PM the laundromat in Mangwon-dong; 10:24 PM home. Chapter 6 opens at 3:40 AM the same night."
story_beats: PART_ONE_BEATS.md#5
cast:
  taeo: work        # P01–P04 outdoor (navy zip jacket over the black hoodie, olive backpack with the faded orange patch). P06–P37 work (grey-green Hanbit Mart vest with its blank white name tag over the hoodie). P38–P46 outdoor again (vest stuffed in the backpack). P47–P55 default (jacket on its hook, sneakers off: black hoodie, black cargo trousers, socks)
  nib: default      # barefoot; V-notch LEFT ear; small lower fang LEFT; brown rope belt; pouch RIGHT hip; brown wooden sheath LEFT hip (right-handed, cross-draw). From ch004 his pouch holds his folded drawing and Chae's short pencil stub; at P21 he trades the stub for Eunchae's cobalt-blue pencil
  eunchae: work     # high ponytail; cream shirt, sleeves rolled; grey-green vest with blank name tag; black trousers; black-and-white canvas sneakers; the dog-eared exam workbook with sticky tabs; her cobalt-blue pencil behind her RIGHT ear until P21
  manager: default  # Manager Oh Daesik: black polo, clipboard, harried; a small laminated command card from head office (blank)
  granny_moon: default  # FIRST APPEARANCE, unnamed on the page and no name caption (CHARACTER_BRIEF_2 #1): very tall, grey-skinned, cardigan, apron, slippers, reading glasses on a cord
  dr_pyo: default   # phone voice only (P34–P36); not drawn
  haru: default     # TTOK messages only (P28, typed on Grandma's phone); not drawn
extras:
  stocker: "THE CONSTRUCT STOCKER. First appearance: this script locks its design, and ch006 onward match it. A head-office construct unit (registered equipment). 180 cm, slim and sexless like a high-end jointed display mannequin; a smooth matte porcelain-white surface with one cool pale-grey shadow tone; fine seam lines at the neck, shoulders, elbows, wrists, waist, hips, knees and ankles; a smooth egg-shaped head with NO face at all (no eyes, nose, mouth or ears); five smooth jointed fingers on each hand; smooth sculpted feet. A small blank grey registration plate set into the back of its neck. From P06 on it wears exactly one thing, a grey-green Hanbit Mart cap (the staff-vest grey-green, a white circle logo on the front, no letters). No clothes, no metal, no wires, no lights, no screen, no glowing eyes: a summoned pattern given a body, not a robot. Identical, perfect, silent motions; it never turns its head toward a person."
  delivery_crew: "two head-office delivery workers in plain grey coveralls, grey caps and work gloves, tired and efficient; one holds a tablet with a dark screen (P01 only)"
prop_notes:
  transport_case: "a tall grey hard-shell transport case, about 2 m, shaped like a coffin stood on end: aluminium edges, latches, two small wheels at the base, a front lid on side hinges, grey foam inside with a body-shaped recess and two black webbing straps; a blank equipment plate. Empty, it leans against the back-store racks from P06."
  pencil: "Eunchae's exam pencil, Nib's from P21 (lock it for ch006, ch007 and later): a full-length cobalt-blue hexagonal pencil with a pink eraser and a silver ferrule, its end a little chewed. From P23 a tiny three-line fork (one stem splitting into three short prongs, about a fingernail long) is carved through the blue paint near the eraser end, showing pale bare wood. Too long for his pouch, it pokes out of it."
  stub: "Nib's first pencil: the short office pencil stub Chae gave him in ch004 P39 (about 9 cm, natural wood, the kind tied to a ticket counter). He gives it to Eunchae in exchange for hers (P21)."
  drawing: "Nib's drawing of his post from ch004 P40, on a sheet of plain white paper, folded small in his pouch and creased into quarters: a low wall of stacked stones along a ridge, a crooked tree behind it, a tick-mark where he sat, a path winding down and away, and beside it a small closed outline left blank (the white bit). It stays in his pouch when he gets home."
  carton: "a flattened noodle carton, plain brown inner side up, on the stockroom floor. Taeo's sums and the run-off zeros are lettered (labels), never drawn (P29, P30)."
  knife: "Nib's knife as on his details sheet: drawn bare in P48 and left lying on the folding table, handle toward Taeo's side. ch006 P01 opens on it."
  command_card: "a small white laminated card of construct commands from head office, blank lines only."
locations: [mart_street, hanbit_mart_stockroom, hanbit_mart, hanbit_mart_breakroom, mangwon_street, moon_laundromat, taeo_flat]
location_notes:
  mart_street: "LOCATIONS.md key (hanbit_mart entry). P01 uses the 3 m side lane along the store's east wall, with the steel back door beside the recycling bins (floor plan item 26). P38 uses the south street front from across the road, as in ch001 P06."
  hanbit_mart_stockroom: "LOCATIONS.md sub-key; floor plan items 6 and 23–26. The L-shaped stockroom and back store behind the counter: racks of cartons, a hand truck, the manager's small desk with a CCTV monitor (screen dark), the staff WC door, the steel back door to the east lane. This chapter creates the stocker's standby box (item 24): a square of white floor tape about 80 × 80 cm on the concrete just inside the back door. Taeo sits on an upturned blue plastic crate by the racks a few steps inside the stockroom door (item 6, which opens from the shop floor at the counter's north end); the stocker's box is across the room in the back store."
  hanbit_mart_breakroom: "LOCATIONS.md key and floor-plan inset: seen from its door, the lockers are on the LEFT and the rota whiteboard on the RIGHT, so P16 and P25, which look back toward the door from the rear wall, show the lockers on the RIGHT and the whiteboard on the LEFT. Fridge and microwave rear left (seen from the door), crates on the back wall, sink rear right; the folding table and black stool against the middle locker (Taeo's)."
  mangwon_street: "No LOCATIONS.md entry yet; LOCATION_BRIEF key. The walk home west from the Hapjeong-dong villa lanes along Poeun-ro into Mangwon-dong: low red-brick villas and two-storey shop buildings with roller shutters down, a closed café with its chairs stacked inside, gas meters, tangled overhead wires, sodium streetlights, a parked scooter. Quiet a little after 10 PM: a few lit windows, the glow of a convenience store far off, nobody close."
  moon_laundromat: "No LOCATIONS.md entry yet; LOCATION_BRIEF key; first appearance. A narrow self-service laundromat on a quiet side street off Poeun-ro in Mangwon-dong: 7 minutes' walk from Taeo's flat and about 13 from Hanbit Mart (LOCATIONS.md travel times). One shop window on the pavement with a long folding counter just inside it; behind that, a row of front-loading washers and a row of stacked dryers with round dark portholes, a plastic chair; a pale fabric roller blind on a pull cord above the window; the glass door beside the window. At night it is the only lit shopfront on the street, in warm cream-white light. Signs blank."
  taeo_flat: "LOCATIONS.md key and floor plan, night look (lamp only). Locks used here: looking in from the door, the kitchen strip is LEFT and the bed RIGHT by the window; the desk lamp on the desk's bed end; the folding table in the middle; the navy jacket's hook on the bathroom wall by the door."
palette_notes: "Back lane at 3:52 PM: flat white overcast daylight, cool greys and the van's flat white, with the store's pale green-white spilling from the open back door. Stockroom and shop floor: pale fluorescent green-white with grey-green shadows (A4 Hanbit Mart); in the afternoon (P11–P15) daylight through the south glass front lies in warm patches on the front strip while the aisles stay fluorescent (LOCATIONS.md day look); the stocker's porcelain white is the brightest thing in any panel it is in; on the shop floor the red sale tag on the aisle-2 end cap is the only saturated note. Break room: warmer fluorescent cream with grey-brown shadows; accent: Eunchae's cobalt-blue pencil. Streets after 10 PM: sodium orange and deep navy. Laundromat (not in A4): the one warm cream-white window on a dark street; inside cream and pale grey; Granny Moon's grey skin and pale eyes; no saturated accent. Flat at night (A4): warm lamp orange on the desk side, deep blue-grey elsewhere; accent: the cobalt-blue pencil on the table. Amber #F2A93B appears ONLY as Nib's eye colour: there is no link light and no operator-interface window in this chapter."

panels:

  # ---------------- COLD OPEN: A DELIVERY ----------------
  - id: P01
    shape: full
    gap: none
    bg: black
    camera: "wide, from the street end of the store's east side lane, looking down the lane to the open back door; Taeo and Nib in the foreground, backs to us"
    art: >
      The 3 m side lane along Hanbit Mart's east wall in the late afternoon (mart_street, east lane), under a flat white overcast sky: a plain white box van
      with a blank grey-green panel on its side (head-office livery, no letters) is backed in, rear doors open, tail lift down. Two delivery workers
      (delivery_crew) ease the tall grey transport case (prop_notes: a coffin stood on end) off the lift on a hand truck toward the open steel back door,
      which spills pale green-white fluorescent light across the asphalt. Recycling bins by the door, tangled overhead wires, a utility pole, the backs of
      low red-brick villas. In the foreground, just entering
      the lane with their backs to us: Taeo (taeo, outdoor: navy zip jacket over the black hoodie, black cargo trousers, the olive backpack on one shoulder
      with its faded orange shield-and-open-door patch showing) has stopped; Nib (nib, default: V-notch in the LEFT ear, brown rope belt, pouch on the RIGHT
      hip, brown wooden sheath on the LEFT hip, barefoot), half a step ahead of him as always, has stopped too, his right hand drifting across to the knife
      hilt at his left hip. Nib's head reaches Taeo's belt. Palette: cool overcast greys, the van's flat white, the green-white spill from the
      door; soft-edged daylight but hard cel shadows under the van and the bins. No haze. No text and no lettered logos.
    calm: top
    lines:
      - {who: narr, type: tag, text: "HANBIT MART · 3:52 PM"}
      - {who: taeo, type: float, text: "WEDNESDAY WAS A BIG DAY FOR PRICES."}
    notes: "Picks up three hours after ch4's hook (AAO lobby, about 12:58 PM), where Dr. Pyo offered ₩50,000,000 for Nib and Taeo did not say no. Taeo was told to come in at 4 (ch003 P10); P06 gives the reason. Staff use the back door."

  - id: P02
    shape: tall
    gap: short
    bg: black
    camera: "inside the back store, low, from just behind Taeo's and Nib's shoulders at the bottom of the frame, looking up at the open case"
    art: >
      Just inside the steel back door of Hanbit Mart's back store (hanbit_mart_stockroom). One fluorescent tube overhead is half dark; the open door throws
      a slab of flat grey daylight across the concrete. The tall grey transport case stands upright, its front lid swung open on side hinges. Inside, in its grey
      foam recess, held by two black webbing straps across the chest and the thighs, stands the construct stocker (stocker, see extras; no cap yet): a smooth
      matte porcelain-white jointed mannequin body, arms at its sides, head slightly bowed, utterly still, like someone asleep on their feet. Its egg-shaped
      head has NO face. At the bottom of the frame, from behind: Taeo's shoulder (navy jacket, backpack strap) and Nib's head and shoulders, the V-notch in
      his LEFT ear clear, both looking up at it. Read top to bottom: the bowed blank head, the straps, the two small watchers. Palette: grey-green shadow,
      the pale grey slab of daylight, the figure the brightest white in the frame. Hard edges; no glow, no fog. No text.
    calm: none
    silent: true
    notes: "The cold open's striking image: a person-shaped thing delivered in a box, like stock."

  - id: P03
    shape: inset-r
    gap: short
    bg: black
    camera: "close-up on Nib from slightly below, three-quarter, from the case's point of view"
    art: >
      Nib (nib, default) looks up at the figure in the case, crouched a little, his right hand across his body on the knife hilt at his LEFT hip (ready, not
      drawing). Amber eyes narrowed; as the off-panel answer comes, they slide sideways toward Taeo. A weathered adult face with lines under the eyes; the
      small lower fang on the LEFT shows. Fluorescent light from above, a touch of grey daylight from the door on one cheek, a plain dark grey-green background.
      Never cute. No text.
    calm: left
    lines:
      - {who: nib, type: speech, side: r, text: "WHO IS THAT?"}
      - {who: "offpanel:taeo", type: speech, side: l, text: "IT'S NOT A WHO. IT'S A CONSTRUCT."}
    notes: "Nib reads a bound human shape in a box as a prisoner. Taeo's tired 'not a who' is the question the hook turns back on him."

  - id: P04
    shape: tall
    gap: short
    bg: black
    camera: "low angle from the floor in front of the case, looking up: the same low angle as ch001 P54, in flat light"
    art: >
      The construct stocker (stocker, no cap yet) steps OUT of its open case toward the camera in one smooth, perfect stride, the loose webbing straps
      swinging behind it, its blank egg-shaped head level and calm, its five-fingered hands relaxed at its sides. The tube has steadied: flat, even
      fluorescent light, no particles, no glow, no rim light, no seam of light. At the bottom-left edge, small: Nib crouched with his hand gripping his knife
      hilt, staring up, and Taeo's legs just behind him. At the right edge, Manager Oh's hand and black polo sleeve, holding the small laminated command card
      (blank). Hard cel shadows on the concrete. The figure fills the frame: uncanny, never cute and never robotic (no metal, no lights). No text.
    calm: top
    lines:
      - {who: "offpanel:manager", type: speech, side: r, text: "...STEP OUT."}
    sfx:
      - {text: "TAK", style: quiet, at: [0.56, 0.86], size: S, rot: 0}
    notes: "Visual rhyme with ch001 P54 (Nib stepping out of the seam toward camera, Taeo small at the edge): there a person arrived; here a product is unpacked."

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 5 · FIFTY MILLION"

  # ---------------- THE UNIT ----------------
  - id: P06
    shape: full
    gap: long
    bg: white
    camera: "establishing, eye level, across the back store from the stockroom side"
    art: >
      The back store under steady fluorescent light (hanbit_mart_stockroom): racks of cartons on the right, the empty transport case leaning against them,
      the steel back door shut. On the concrete just inside the door, a fresh square of white floor tape (the standby box, floor plan item 24); the stocker
      stands in it, perfectly straight. Manager Oh (manager: black polo, clipboard tucked under one arm, his harried face beaming like a proud father) is up
      on his toes settling a grey-green Hanbit Mart cap (blank white circle logo) onto its smooth head with both hands. Watching from the left: Eunchae
      (eunchae, work: high ponytail, cream shirt with rolled sleeves, grey-green vest with a blank name tag, black trousers, black-and-white canvas sneakers;
      the dog-eared exam workbook with sticky tabs under her arm; a long cobalt-blue pencil behind her RIGHT ear), arms folded, deadpan; Taeo (taeo, work:
      the grey-green vest with its blank name tag over the black hoodie), tired and wary; Nib at Taeo's leg, looking up at TAEO, not at the unit. Palette:
      pale fluorescent green-white, grey-green shadows; the stocker's porcelain white is the brightest note. No text.
    calm: top-left
    lines:
      - {who: manager, type: speech, side: r, text: "HEAD OFFICE SENT IT EARLY. YOU TWO ARE TEACHING IT THE SHELVES."}
    notes: "Beat: the construct stocker arrives, a sleek mannequin in a Hanbit Mart cap. This is why the manager called Taeo in at 4 (ch003 P10): the night staff train their own replacement. Design locked here (extras). The taped square is LOCATIONS.md's standby rectangle, first shown here."

  - id: P07
    shape: wide
    gap: short
    bg: white
    camera: "over Taeo's and Eunchae's shoulders toward the manager, the capped stocker behind him"
    art: >
      Manager Oh faces Taeo and Eunchae (their backs and shoulders in the foreground, Taeo LEFT, Eunchae RIGHT) but keeps his eyes on his clipboard, a
      little guilty. Behind him the capped stocker stands in its taped square, blank head level, as if it were the one being introduced. Simplified racks.
      Fluorescent green-white. No text.
    calm: top
    lines:
      - {who: manager, type: speech, side: c, text: "FROM THE FIRST, NIGHTS GO TO THE UNIT."}
      - {who: taeo, type: speech, side: l, text: "...AND US?"}
      - {who: manager, type: speech, side: c, text: "WEEKEND DAYS. I FOUGHT FOR THAT."}
    notes: "Beat line verbatim. 'The first' is 1 April: until then Taeo keeps his nights (ch006 relies on this). Echoes ch001 P10 ('...AND ME?'): now it is 'us'. The manager is squeezed too and believes he helped."

  - id: P08
    shape: wide
    gap: short
    bg: white
    camera: "reverse angle, medium close on Taeo and Eunchae from the manager's side"
    art: >
      Taeo (LEFT) asks anyway: a small brave lift of the chin, hands at his sides. Eunchae beside him turns her head to look at him. At the right edge, the
      manager's shoulder and clipboard and a careless flap of his hand. ACTING: on the answer, Taeo's tiny relief and the sting under it in one face
      (eyebrows up, mouth tight). Simplified racks, fluorescent light. No text.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "THEN... CAN I HAVE THIS SUNDAY OFF?"}
      - {who: manager, type: speech, side: r, text: "TAKE IT. THE UNIT NEEDS THE PRACTICE."}
    notes: "Added small beat. Pays off ch001 ('I'LL ASK ABOUT SWAPPING' / 'YOU SAID THAT LAST TIME') and makes ch007 ('I'M GOING HOME ON SUNDAY') and ch008 possible. The day off is unpaid; the stocker covers this Sunday's shift."

  - id: P09
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up on Eunchae, three-quarter"
    art: >
      Eunchae, deadpan, workbook clamped under her arm, the cobalt-blue pencil behind her RIGHT ear, her eyes sliding sideways toward the capped stocker
      (out of frame); one eyebrow up a millimetre. Plain pale grey-green background. No text.
    calm: right
    lines:
      - {who: eunchae, type: speech, side: l, text: "THEY REPLACED US WITH A MANNEQUIN IN A HAT."}
    notes: "Beat line verbatim (the chapter's listed laugh)."

  - id: P10
    shape: inset-r
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag (2.5 heads) on a flat screentone background with sparkles. Chibi Manager Oh (black polo, clipboard) hugs the stocker's leg protectively,
      crying offended sparkly tears; the stocker is a simple smooth pale bean shape with a tiny grey-green cap, blank and unbothered. Chibi Eunchae
      (ponytail, vest, pencil behind her ear) has flat dot eyes and a line mouth; chibi Taeo (vest) has turned to white stone and is crumbling at the edges.
      No text.
    calm: left
    lines:
      - {who: manager, type: speech, side: r, text: "IT'S A BRANDED CAP!"}
    notes: "Chibi sheets: eunchae, taeo. None yet for manager or stocker: derive them from the turnaround and the extras description."

  - id: P11
    shape: wide
    gap: short
    bg: white
    camera: "eye level down aisle 2 from its south end, looking north toward the drinks fridges"
    art: >
      Hanbit Mart's shop floor a little after 4 PM (hanbit_mart; the aisles fluorescent, afternoon daylight behind the camera at the glass front), aisle 2: packet noodles on the LEFT (the noodle gondola's aisle-2 face), snacks on the RIGHT, the
      three drinks fridges glowing at the far end. Foreground right: Manager Oh holds up the laminated command card like a magician's prop, proud. Behind
      him Taeo and Eunchae watch. Mid-aisle, the capped stocker glides along the noodle face, both hands already working the shelf. And at the far north
      end, sitting cross-legged ON TOP of the noodle gondola (about 1.6 m up) among the cup-noodle multipacks, Nib surveys the shop from his new high post
      like a sentry on a wall. Nobody in the scene has noticed him. Fluorescent green-white; the red sale tag on the end cap is the only saturated note.
      No text.
    calm: top
    lines:
      - {who: manager, type: speech, side: r, text: "WATCH THIS. \"FACE.\""}
    notes: "'Facing' is shop slang for pulling stock forward so every label faces front. The reader sees Nib up on the gondola before anyone in the scene does. LOCATIONS.md: cup-noodle multipacks along the gondola's top."

  - id: P12
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up along the shelf edge"
    art: >
      Extreme close-up in the middle third: the stocker's two smooth porcelain-white hands (five jointed fingers each, fine seam lines at the knuckles) sweep
      along a row of packet noodles and turn every packet to face front in one continuous, identical, perfect motion. A plain shelf edge, the packets as
      blank colour blocks, fluorescent light. No text.
    calm: none
    silent: true

  - id: P13
    shape: wide
    gap: short
    bg: white
    camera: "high side view, level with the top of the gondola"
    art: >
      At the top of the noodle gondola. The stocker, having faced the multipacks along the top, has reached Nib. It sets both smooth hands on his shoulders
      and turns him a half turn where he sits, so that he faces the front of the shop, exactly as it turned the noodles. Nib lets it happen: body rigid, arms
      still folded, his face a few centimetres from its blank head under the cap, wearing a held, flat, enormous offence. The notched LEFT ear, the brown
      rope belt and the sheath on his LEFT hip show. The aisle below drawn simply (no blur). Fluorescent light. No text.
    calm: top
    silent: true
    notes: "The construct cannot tell a person from stock. Played as comedy; it is also the chapter's question."

  - id: P14
    shape: inset-l
    gap: short
    bg: white
    camera: "frontal close-up on Nib from the aisle below"
    art: >
      Nib, now facing the front of the store from the top of the gondola: perfectly deadpan, eyes level, looking down the aisle at the glass door and the
      daylit street beyond as if inspecting a new watch post. A cup-noodle multipack beside his knee. Plain pale background. Adult and weathered. No text.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "...BETTER VIEW."}

  - id: P15
    shape: full
    gap: short
    bg: white
    camera: "from the north end of aisle 2 looking south, past Nib's back on the gondola top"
    art: >
      BIG REACTION. Reverse angle: in the near foreground, Nib's back and notched LEFT ear on top of the gondola. Below in the aisle Eunchae (right) has
      exploded laughing, doubled over, workbook flapping, eyes squeezed shut, tears at the corners, one hand slapping a shelf. Manager Oh (centre) points up
      at Nib, apoplectic, sweat drops flying. Taeo (LEFT) wears a COMEDY FACE: dot eyes, a wobbling line mouth, a huge sweat drop, palms pressed together in
      apology. The stocker carries on facing the snack shelf, oblivious. At the far end, the glass front bright with afternoon daylight, warm patches on the floor
      by the door. Fluorescent light in the aisle. No text.
    calm: top
    lines:
      - {who: manager, type: speech, side: c, text: "WHY IS YOUR SUMMON ON MY SHELF?"}
      - {who: taeo, type: nervous, side: l, text: "HE LIKES HIGH PLACES. SORRY."}
      - {who: manager, type: shout, side: c, text: "BREAK ROOM!"}
    sfx:
      - {text: "PFFHAHAHA", style: comic, at: [0.70, 0.66], size: L, rot: -8}
    notes: "The chapter's big laugh. Eunchae laughing at the situation, not at him, is why Nib will talk to her in the next scene."

  # ---------------- THE PENCIL ----------------
  - id: P16
    shape: full
    gap: long
    bg: white
    camera: "establishing, high in the break room's rear corner above the sink, looking back across the room to the door"
    art: >
      The Hanbit Mart break room (hanbit_mart_breakroom) seen from the rear: the door at the far side; looking this way the grey lockers are on the RIGHT and
      the rota whiteboard on the LEFT; the pale folding table and the black stool against the middle locker. In the near foreground, low, Nib sits on the
      floor against the crates on the back wall, knees up, a flattened carton on them as a drawing board, and on it his drawing from the AAO (prop_notes),
      unfolded, its quarter creases showing: the low stone wall, the crooked tree, the winding path, the small blank outline. He is adding to it with Chae's
      short pencil stub (about 9 cm). Eunchae has just come in with a steaming
      cup noodle and her workbook, and leans back out of the doorway to call toward the shop floor (Taeo is at the counter, off-panel). Warmer fluorescent
      cream light, grey-brown shadows. No text.
    calm: top
    lines:
      - {who: narr, type: tag, text: "6:12 PM"}
      - {who: eunchae, type: speech, side: c, text: "TAEO! DOES IT BITE?"}
    notes: "The drawing and the stub are the ones Nib pocketed at the AAO (ch004 P39–P47: 'WALL HERE. TREE BEHIND IT... AND THE WHITE BIT'). The break-room geography is reversed on purpose: this camera looks back at the door."

  - id: P17
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up on Nib, three-quarter, eyes down"
    art: >
      Nib keeps drawing without looking up, Chae's short pencil stub gripped in his right fist, soldier-style, eyes on the paper. Flat and unbothered. Plain warm cream
      background. No text.
    calm: left
    lines:
      - {who: nib, type: speech, side: r, text: "I CAN HEAR YOU."}
    notes: "Beat line, kept from the published edition."

  - id: P18
    shape: wide
    gap: short
    bg: white
    camera: "medium two-shot at Nib's eye level, side view"
    art: >
      Eunchae (LEFT) has turned round and come in. She crouches to Nib's eye level, cup noodle in one hand, workbook under her arm, and asks him straight,
      completely matter-of-fact. Nib (RIGHT) looks up at her for the first time, measuring. Simplified lockers and crates. Warm fluorescent. No text.
    calm: top
    lines:
      - {who: eunchae, type: speech, side: l, text: "SORRY. YOU'RE RIGHT."}
      - {who: eunchae, type: speech, side: l, text: "DO YOU BITE?"}
      - {who: nib, type: speech, side: r, text: "NOT PEOPLE WHO ASK."}
    notes: "Beat: Eunchae meets Nib properly. She corrects herself at once and asks HIM. His answer quietly seeds 'ASK ME' (ch20)."

  - id: P19
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up on Eunchae from Nib's eye line"
    art: >
      Eunchae, still crouched, lets out a short surprised laugh through her nose and holds out her free hand to shake, a real smile for once. Plain warm
      cream background. No text.
    calm: right
    lines:
      - {who: eunchae, type: speech, side: l, text: "GOOD ANSWER. I'M EUNCHAE."}
