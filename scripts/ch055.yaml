chapter: 55
title: Angles
when: "After the adaptive-quarterfinal result in ch 54, on semifinal afternoon. Publicity interval and Sunline's aerial record before Taeo's semifinal call. Ends in the service corridor immediately before ch 56. No calendar date fixed."
story_beats: PART_ONE_BEATS.md#55
cast:
  taeo: outdoor
  nib: default
  orrin: default
  sera: default
  haein: default
  sejin: default
  sunline: default
extras:
  fan_artist: "Young adult woman in a muted mauve sweatshirt and navy skirt over leggings, short ponytail, sketchbook and plain canvas tote; delighted, respectful when corrected."
  fan_friend: "Young adult man, pale-grey hoodie and navy trousers, simple intact phone, cheerful and overeager."
  record_official: "Adult woman, grey event polo, navy trousers, headset, mechanical stopwatch, blank credential."
  sunline_manager: "Match ch 50: woman about 40, beige tailored blazer, practical trainers, dark tablet facing herself, white stopwatch on wrist."
  camera_operator: "Adult man, slate utility vest, shoulder camera, padded earphones; follows marked camera position."
locations: [exhibition_arena, exhibition_concourse, exhibition_service_corridor, exhibition_aerial_bay, exhibition_aerial_course]
location_notes:
  exhibition_arena: "Same grey-padded main arena and navy tiered stands as ch 54; opposite VIP enclosure. Meridian semifinal remains pending."
  exhibition_concourse: "Match ch 50-51: broad pavilion with glass roof trusses, north course doors, east credentials and wide west equipment access, pale flooring and low cable ramps. Public fan encounter here. All signs blank."
  exhibition_service_corridor: "Under-stand cream-concrete passage of ch 52-54, white strip lamps, equipment trestle and wide doors. Crew's recovery bench set back in an equipment alcove, outside the public press rope; not a public selfie backdrop."
  exhibition_aerial_bay: "Match ch 50 west warm-up enclosure: mesh boundary, tall bare launch tower, hanging practice rings, padded perimeter and inspected safety net. Adjoins the separate record course."
  exhibition_aerial_course: "The full-height record enclosure beyond the warm-up bay, visible from protected viewing tier connected to the concourse. Retractable roof OPEN to ordinary blue sky and measurable crosswind; 48 m high steel target gantry, six calibrated breakaway target discs along an ascending then descending zigzag, spring launch deck at base, broad inspected safety net below and foam landing deck at south end. Solo aerial-class spear course, not a dungeon or live gate. Timer starts at launch and stops at the sixth clean disc strike. Targets fall into enclosed catch trays, never spectators."
wardrobe_locks: >
  Taeo navy jacket/black hoodie/cargos, single-white-stripe sneakers, ONE mole under RIGHT eye; olive backpack with
  faded orange OLD shield/open-door patch; top-left-cracked dark-grey phone/green dinosaur sticker. Forearm soreness
  from ch 53-54 disclosed, resting and no new force use. Nib adult 105 cm, weathered, LEFT-ear V-notch, sole LEFT lower
  fang, pinkish-tan wrap, charcoal shorts, brown rope belt, RIGHT sticker pouch, LEFT brown wooden sheath. Exact ch 43
  matte dark-brown ankle-high leather lace-up boots, broad round toe, four pairs of dull gunmetal round eyelets,
  dark-brown round laces double-knotted, black lug soles/low heel, heel pull tabs, oat-grey short socks inside collar;
  no hooks, buckles or bright trim. Matte-black 8x30 binoculars high, LEFT-neck strap knot, Kett fork hinge;
  pale-blue ID, folded PAPER drawing and cobalt fork-marked pencil stay in pouch. No arena pad after ch 54's check.
  Orrin adult 230 cm stacked-slate quadruped with healed shell seam. Sera river-green/cream wrap, sand cropped trousers,
  brown boots, ordinary ears, thick brown braid, LEFT bow/bracer, RIGHT quiver and bone flute; blunt sport arrows.
props:
  sera_phone: "Plain inexpensive dark-slate phone acquired for ordinary personal use during exhibition attendance; already used for ch 54's clip. No special app, brand or gate-crossing communications implied. The selfie P12 is an unsent photo draft, deleted on panel; there is no irretrievable private leak to leave unresolved."
  fan_art: "A physical sketchbook drawing of Sera as a triumphant archer; recognizable braid, LEFT bow, RIGHT flute. Unlettered art with separate label caption. An affectionate fan drawing, not an official origin or new name imposed by narrator."
  record: "Local aerial-class solo spear course: previous personal record 8.91 s, new 8.67 s, six clean targets on 48 m rig. Not a gate-clear time or new national title. Sunline's existing serious preparation pays off without changing her weapon powers."
  reservoir: "Haein retains the intact ch 50 hand-sized dull-steel reservoir, copper band, ivory window, capped coupling ports and grey hand strap in its case during publicity. Still 0.8 s and finite capacity. No training, recharge upgrade, breakage or accidental deployment in this chapter."
palette_notes: "Concourse/course adapt A4 institutional blue-white/slate with navy stands. Aerial field has ordinary blue sky, clean daylight, cool slate shadows; Sunline's white and muted-gold kit stays material colour, never Nib's amber or a supernatural aura. Corridor white practical strips, cream walls. No active link, cyan windows, gate sky, return marks, bloom, haze or decorative particles. Generated signs and sponsor patches blank; UI labels supply all words."
