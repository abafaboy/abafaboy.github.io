extras:
  field_assistant: "Same adult scout as ch94: olive field vest, grey trousers, white hard hat, boots; dressed superficial hand cut."
  ironvow_members: "Adults in dark-steel plates, charcoal undersuit, muted red chest inset/waist tabs, LEFT two-link collar clasp."
locations: [yeoju_anchor_field, yeoju_gate_a, yeoju_gate_b]
location_notes:
  yeoju_anchor_field: "ch93-94 layout unchanged: five independent framed door-height gates A-E west-east, depot north, exterior canopy southwest, medical shelter south. White blue-banded communication cable is separate from flat grey mechanical force couplers; steel knock plates on both faces of each safety frame."
  yeoju_gate_a: "Firm reed-stone landing under wrong lavender sky. Orrin braced at padded timber stock sledge; no cargo on shell. Boss alive beyond far ridge. No stock extracted after any boss death."
  yeoju_gate_b: "Entry landing west, narrow causeway east to broad shelf; solid wall NORTH/left, dry ravine SOUTH/right. Southern lip has broken under displaced weight. Transverse tooth projects from north wall across far end; firm upper notch behind it leads back west toward the entry. Small north pocket by shelf remains sound. Near-end escape gap opens beside tooth; neither a third threshold nor an abyss magically crossed by relays."
continuity_notes: >
  Nib keeps LEFT ear notch/lower fang, brown rope belt, RIGHT pouch/dinosaur sticker, LEFT wooden sheath,
  8x30 black binoculars and LEFT-knotted strap. Ch43 chosen boots: retain provisional dark-brown lace-up ankle boots,
  rounded toes, low black rubber soles until ch43 final wording exists. PAPER drawing, ID, cobalt pencil stay secured.
  Taeo: outdoor navy jacket/black hoodie/cargos/striped sneakers; RIGHT-eye mole; old orange patched olive backpack.
  Only his RIGHT palm carries Nib's amber pulse; Orrin slate-green. No new linked companion colour introduced.
  Recoil: worsening forearm bruising, brief nosebleed and a bitten lower lip; irregular rhythm, conscious throughout.
  Dara does not heal a rhythm, replace blood or erase fatigue. No cardiac arrest and no resurrection.
  The measured ch89 ceiling is respected; transfer partly fails on timing/exit angle, not cured by a power increase.
  Initial shove eases after the safety call. Residual displaced weight and failing stone still threaten withdrawal.
  Temporary north pocket gives a real pause for assessment/comedy; nobody jokes during a falling person's peril.
  Bosses remain alive. Cold-white/violet return marks cannot trigger boss-death recall yet; voluntary outward exit works.
palette_notes: "Interior A/B: A4 lavender sky, violet shadow, ochre reed-stone. Exterior: west daylight, slate shade. Red only on Taeo's blood and actual danger. Flat cel, no haze or glitzy force beams. Chibi only in the settled medical pause."
