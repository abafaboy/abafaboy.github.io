chapter: 91
title: The Bet
when: "Directly after ch90's commitment, noon through evening at Ryu yard. Contest date confirmed at the end: one week away."
story_beats: PART_ONE_BEATS.md#91
cast:
  taeo: outdoors
  nib: default
  orrin: default
  sera: default
  kesh: default
  dara: default
  sejin: default
  haein: default
locations: [ryu_practice_yard]
location_notes:
  ryu_practice_yard: "Canonical drawn key: south double gate; southwest grey office container, southeast white van facing west, fixed central plywood maze, three north targets. Finance table on open south apron; eight-place crew meeting moves the same folding table beside the southwest container. Orrin occupies its open north short end without harness or chair. Medical awning nearby. Never remodel the maze or block the door; no actual gate anomaly."
continuity_notes: >
  ch90 ended with ₩210,000,000 total Yeoju capital committed over Nib's objection. That commitment already
  exists; this chapter neither repeats the transfer nor declares it magically cancelled. No refund sum or
  forfeiture schedule is invented. The crew reviews its actual packet before choosing whether to proceed.
  Eight voting crew at this meeting: Taeo, Nib, Orrin, Sera, Kesh, Dara, Sejin, Haein. This is their working
  crew rule before the formal guild founding, not a claim that Minho's independent coalition joined them.
  Nib stays an adult 105 cm scout, LEFT ear notch/LEFT lower fang, brown rope belt, RIGHT stickered pouch,
  LEFT brown wooden sheath, matte black 8x30 binoculars, LEFT strap knot, hinge fork. PAPER drawing,
  pale-blue ID and marked cobalt pencil stay secured in pouch. Keep exact ch43 boots, now verified:
  matte dark-brown ankle leather, broad round toes, four dull gunmetal round eyelet pairs, round brown
  laces in small double knots, heel pull tabs, black lug soles/low heels, oat-grey short socks inside collars.
  No hooks, buckles, logos or visible steel caps.
  Taeo's RIGHT-eye mole, cracked dinosaur-sticker phone, olive backpack/OLD orange door patch persist.
  His forearm bruises and irregular rhythm persist. No test or LOAD SHARE today; ch89's half-second
  light-rig ceiling remains provisional, with medical stop authority intact. No new links or colours.
  Minho's ch90 coalition support remains promised, not already on site. Haeseong sponsor terms unchanged.
palette_notes: "A4 yard ochre/brown/sky blue through afternoon. At dusk, practical awning lamp warms the table against blue-grey container shadows; evening phone scene returns cold white screen accent. Hard cel faces and drawn sets, no decorative particles, bloom or stage lighting. Every paper and board blank unless label UI."
