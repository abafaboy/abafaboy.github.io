chapter: 54
title: Adaptive
when: "The next exhibition session after ch 53's bracket posting: adaptive quarterfinal, then the press corridor and semifinal announcement. No calendar date fixed."
story_beats: PART_ONE_BEATS.md#54
cast:
  taeo: outdoor
  nib: default
  orrin: default
  sera: default
  haein: default
  sejin: default
  minho: default
  baek: default
extras:
  ironvow_junior_lead: "Adult woman about 24, compact athletic build, short black braid, charcoal padded junior-team jacket with dull iron-grey shoulder guards, black trousers, flat combat boots; paired blunt forearm plates. A capable competitor, distinct from Do Gangjin and the elite team."
  ironvow_junior_runner: "Adult man about 21, lean, short hair, same charcoal/iron-grey junior uniform, blunt practice staff."
  ironvow_junior_bracer: "Adult man about 25, broad shoulders, cropped hair, same uniform, large rectangular foam-faced push shield."
  official: "Adult woman in grey exhibition polo, slate trousers, headset, plain credential; course controller and amplified announcer."
  reporter: "Adult woman in cream jacket, black trousers, short ponytail, handheld foam-head microphone, blank press credential. Curious, hurried, initially careless rather than deliberately cruel."
  camera_operator: "Adult man in dark grey polo with shoulder camera, practical trainers and blank credential."
locations: [exhibition_arena, exhibition_service_corridor, exhibition_media_concourse]
location_notes:
  exhibition_arena: "Carry ch 50-51 venue architecture. Quarterfinal local geography: grey padded floor below tiered stands; near-side operator boxes behind clear safety barrier; identical parallel adaptive lanes extend toward far targets; VIP enclosure high opposite. Each lane has pivot stepping plates, an impact pendulum, a weighted exit shutter and a small movable counterweight sled. Shutter has a sliding counterweight on its right-side rail. Controls reconfigure the shutter after a target hit, identically for both teams. Broad marked route fits Orrin. A built arena, no gate, return marks or wrong-colour sky."
  exhibition_service_corridor: "Same cream-concrete under-stand service corridor as ch 52-53: white practical strips, wide equipment doors, equipment trestle, controlled barrier."
  exhibition_media_concourse: "Public press rope outside the service exit, wide concrete concourse, grey acoustic ceiling, practical white strip lights and daylight from upper glazing. Blank event backdrop on far wall; corridor doorway at right. Keep a clear accessible path for Orrin."
wardrobe_locks: >
  Taeo: navy jacket, black hoodie/cargos, single-white-stripe sneakers, RIGHT-eye mole; olive pack with faded orange OLD
  shield/open-door patch on operator chair during race; cracked dark-grey phone with green dinosaur sticker.
  Nib: weathered adult 105 cm, LEFT-ear V-notch, sole LEFT lower fang; pinkish-tan sleeveless wrap, charcoal shorts,
  brown rope belt, RIGHT sticker pouch, LEFT wooden sheath; ch 43 exact chosen boots, never barefoot.
  Matte-black 8x30 binoculars high on chest, strap knot LEFT neck, Kett fork on hinge; pouch holds pale-blue ID,
  folded PAPER post drawing and cobalt fork-marked pencil. Knife stays sheathed in the sporting event.
  Boots match ch 43: matte dark-brown ankle leather, broad round toe, four pairs dull gunmetal round eyelets,
  dark-brown round laces in small double knots, black lug soles/low heels, heel pull tabs and oat-grey short socks;
  no hooks, buckles, logos, bright trim or visible steel caps.
  Orrin: 230 cm adult slateback, four columnar feet, three blunt nails per foot, old healed shell-crack seam.
  Sera: river-green wrap/cream sleeves, sand trousers, brown boots, thick braid, LEFT bow/bracer, RIGHT quiver/flute;
  blunt exhibition arrows. Haein: slate bib overalls, beige tee, tool belt, jaw-length bob, glasses on crown.
props:
  reservoir: "Ch 50 device unchanged: hand-sized rectangular dull-steel housing, split copper band, ivory ceramic inspection window, two coupling ports, grey webbing hand strap, white mechanical indicator tab, manual release. RIGHT palm in strap at coupling input, LEFT hand at release; no screen in housing. Approved at ch 53 P48. Mechanical slice banked, prepared output direction only, 0.8-second leakage limit, finite capacity. One canceled bank at P19-21, one successful low-capacity bank at P28-31. Intact at chapter end. No third link or Sera pulse required."
  nib_pad: "Arena-issued small grey forearm pad strapped LEFT, compatible with his scout outfit; removed at P37 before press exit."
  injuries: "Taeo has disclosed small forearm bruise from ch 53 plus older fading marks; mild soreness after the round, no new nosebleed, fracture or collapse. Nib uninjured by the padded sports hit; Orrin's old shell seam does not reopen."
palette_notes: "Arena and concourse: institutional A4 blue-white overhead practicals, light slate shadows, muted navy stands. Iron Vow charcoal stays subdued. Amber only Nib's eyes/permitted RIGHT-palm pulse; Orrin slate-green. Public readouts and bracket use label UI, not operator windows. No supernatural sky, decorative particles, bloom, haze or readable signs in generated art."
