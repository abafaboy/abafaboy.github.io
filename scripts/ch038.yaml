    gap: none
    bg: black
    camera: "low three-quarter view of Taeo at the street-side landing"
    art: >
      sinjeong_stairwell. Taeo (taeo, outdoors) folds at the knees, his RIGHT hand locked open,
      separate amber and slate-green pulses thin beneath the skin. His eyes lose focus and a
      fresh red thread reaches his lip. Sejin (sejin, sage scrubs and olive rig) catches the
      back of his navy jacket, jaw set, bracing both feet. A lamp above the landing cuts hard
      blue-grey shadows. Backpack still on him; no dungeon beyond his feet, no magic armour.
      Taeo is on the left and Sejin on the right; show both figures with room for their braced legs.
    calm: top
    lines:
      - {who: sejin, type: shout, side: r, text: "TAEO!"}

