chapter: 38
title: The Last Person Out
when: "The Sinjeong surge night, continuing directly from Orrin's shell cracking in ch 37; the final evacuation and the first thinning of the night. No calendar date or casualty total is assigned."
story_beats: PART_ONE_BEATS.md#38
cast:
  taeo: outdoors # Navy zip jacket over black hoodie, black cargos, single-white-stripe sneakers; dusty olive backpack, old orange shield-and-open-door patch. Never enters a gate.
  nib: default # Adult; barefoot. Full prop locks below apply throughout, including the binoculars.
  orrin: default # 230 cm adult stoneback; no clothing, saddle or harness. Shell crack persists.
  minho: default # Brown jacket, grey tee, olive cargos, knee pads, work boots; LEFT-temple grey streak, LEFT-chest radio, LEFT-wrist watch.
  sejin: default # Sage scrubs, olive medic rig, charcoal cargos, work boots.
  seoryun: default # Olive field jacket, black tee, dark tactical trousers, boots; LOW ponytail, LEFT-eyebrow scar, hexagonal shield.
  dami: default # Grey hoodie, sixteen-pocket faded ochre hi-vis vest, olive cargos, brown gloves, cargo straps; scuffed dull yellow hard hat.
extras:
  last_child: "A four-year-old boy, about 95 cm, cropped black hair, dusty blue padded jacket, grey leggings, socked feet. Nib's final passenger from F."
  last_adults: "The three adults still inside at ch 37's hook: pharmacist in cream cardigan with short black perm and key ring; office man in grey shirt and loosened navy tie assisting ankle woman, about 45, beige spring coat, dark trousers, sprained LEFT ankle. All three finish crawling out before Nib brings the boy."
  child_guardian: "A young father in a grey sweatshirt and torn navy trousers, waiting at the street-side F landing with a medic."
  sector_survivor: "An elderly woman in a plum cardigan and navy trousers; exhausted, one shoe missing, supported by Seoryun."
  reunited_mother: "A woman about thirty-five, chin-length black hair, beige raincoat over pyjamas, scraped palms."
  reunited_child: "Her six-year-old daughter in a yellow raincoat and striped leggings, carried out earlier by Dami; distinct from Nib's last child."
  ryu_crew: "Two Ryu survey workers, red-orange vests, work clothes, white hard hats, gloves; one carries a steel rescue prop."
  responders: "Mixed municipal firefighters, freelance medics, porters and guild crews; practical dirty field clothing, separate jobs and tools."
  reporter: "KNN 24 field reporter in a navy rain shell with a plain microphone; camera operator in charcoal with a shoulder camera."
locations: [sinjeong_arcade_f, sinjeong_stairwell, sinjeong_street]
location_notes:
  sinjeong_arcade_f: "Alias sinjeong_f_landing in ch 37. Earth-side 3 m square landing SOUTH of steel fire door, NORTH of obstructed T junction; EAST pipe chase, WEST crawl strip. Stockroom bypass leads here. Orrin faces SOUTH, backs NORTH through door; ceiling lintel rests on upper LEFT-front shell. Match ch 37's topology, no new dungeon."
  sinjeong_stairwell: "Alias sinjeong_f_stair in ch 37. Fourteen steps descend SOUTH from NORTH pavement to a 3 m square apron NORTH of EAST-hinged fire door. Taeo and Sejin remain on this outer apron. Base trestle WEST at top holds abandoned blue shoe with white heel; Haein stays behind WEST concrete barrier with connected base."
  sinjeong_street: "Match ch 34–37: F stair on NORTH pavement, command tent and casualty bay WEST, main descent farther WEST, broken lightwell EAST. Media barrier keeps cameras outside working area. Triage canopy, vans, resting kerb. Do not invent a station exit number."
prop_locks: >
  Nib: 105 cm, wiry adult with angular weathered face, V-notch LEFT ear, one lower LEFT fang;
  pinkish-tan torn wrap top, charcoal knee shorts, BROWN rope belt, pouch RIGHT hip with green
  dinosaur sticker, BROWN WOODEN sheath LEFT hip, bare feet. Matte black 8x30 binoculars high
  on chest, black woven strap knotted LEFT side of neck, Kett's three-line fork on hinge;
  secure binoculars beneath one forearm while carrying the child. Pale-blue ID, folded PAPER
  watch-post drawing and cobalt pencil with Kett's mark remain protected in pouch.
  Taeo: one mole beneath RIGHT eye, cracked dark-grey phone with green dinosaur sticker;
  amber Nib pulse and separate slate-green Orrin pulse only in RIGHT palm. Recoil bruises
  on forearms and fresh nosebleed, never healed by a return mark. Seoryun's present sleeve
  patch has the redesigned door; Taeo's backpack keeps the OLD door. Follow the brief over
  the matching-emblem shorthand in her older card.
  Orrin's fracture is specifically upper LEFT-front, as ch 37; the later small dressing covers
  that edge without repairing it. Haein and the intact survey base remain upstairs throughout.
palette_notes: >
  Disaster extension of A4: concrete and smoke blue-grey under portable cold-white work lamps,
  hard violet spill only from actual nearby breaches; a small danger-red accent for blood or
  emergency equipment, not decorative red light everywhere. Street sodium is muted brown-orange,
  never link amber. Final street panels ease into desaturated pre-dawn blue. Flat cel colour,
  warm near-black varied ink, one hard shadow tone; no bloom, motes, flare or photographic blur.
  All signs, roster fields, cameras and devices remain blank or dark unless a UI entry fills them.

panels:
  - id: P01
    shape: strip
    gap: none
    bg: black
    camera: "extreme close-up across Orrin's loaded shell, almost level with the slate layers"
    art: >
      sinjeong_arcade_f. Orrin (orrin, default) is planted beneath the sagging concrete ceiling;
      only a rigid shoulder and the shell's stacked slate fill the middle third. The existing
      crack parts a fraction farther as grit drops into it. His visible eye at the edge is
      narrowed with deliberate effort. Cold work-lamp light from the exit, violet shadow farther
      in. No new broken limb, blood spray, harness, glowing shell or readable marks.
    calm: top
    sfx:
      - {text: "KRK", style: impact, at: [0.64, 0.49], size: M, rot: -7}
    notes: "Direct continuation of ch 37's shell-crack hook. Match its exact crack position at art handoff; do not introduce a second independent injury."

  - id: P02
