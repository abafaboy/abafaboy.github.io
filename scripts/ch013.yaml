      - {who: dokgo, type: phone, side: c, text: "KEEP MOVING."}
    notes: "HOOK (beat): the roll call inside; Kwak doesn't answer; Dokgo: 'HE'S RESTING SOMEWHERE. KEEP MOVING.' It is 13:02. The voice comes from the relay post's speaker, so the tails point at it. It echoes 'LEFT VOLUNTARILY' (P17) without saying so."

