chapter: 13
title: The Bottom of the Chain
when: "The Thursday Minho named at the end of ch 12; spring. 9:00 AM to about 1:02 PM in a building foundation pit in Guro-gu and, from 10:01, inside its C-grade gate. The general contractor phones Dokgo on every hour. No date is lettered."
story_beats: PART_ONE_BEATS.md#13
cast:
  taeo: outdoor     # navy zip jacket over the black hoodie, black cargo trousers, black sneakers with one white stripe; a borrowed white Ryu Survey hard hat (small blank shield decal) all chapter, a site rule; the olive backpack with the faded orange shield-and-door patch hangs on the back of his folding chair; a clipboard log from P10. He never crosses the threshold.
  nib: default      # barefoot (refuses boots, P09). From P09: a white Ryu Survey hard hat with two holes Haein drilled for his ears, chin strap buckled, ears standing up through it (the V-notch in the LEFT ear shows above the shell). A Ryu radio in his LEFT hand from P32. Pouch RIGHT hip, brown wooden sheath LEFT hip.
  minho: default    # + white hard hat with a small blank shield decal; grey streak at the LEFT temple; radio clipped high on the LEFT chest; watch on the LEFT wrist. Outside at the canopy table all chapter.
  haein: default    # + white hard hat, clear safety glasses pushed up onto its brim (down while drilling, P08); a cordless drill on her tool belt. She runs the line's base station.
  sejin: default    # + white hard hat; at her first-aid tent (P06, P39). No lines in this chapter.
  dami: default     # FIRST APPEARANCE (intro P15). Cheap yellow-green hi-vis porter vest with sixteen pockets (fourteen outside, two inside) over a grey hoodie, scuffed white hard hat, cargo straps, worn gloves; small, wiry, determined. A square white number patch on the vest's back (her app number, 07; blank in the art except where a label is given). Her phone lives in a chest pocket.
  mansu: default    # FIRST APPEARANCE (intro P26). Kwak Mansu, 58 per PART_ONE_BEATS (CHARACTER_BRIEF_2 says "40s": age the sheet up with grey at the temples, grey stubble and deeper lines). Heavy-set; a black elastic lumbar brace over a grey work shirt; the same yellow-green vest (number patch 08); scuffed white hard hat; worn gloves. A faded navy canvas work jacket slung over one shoulder until P30, when he hangs it on the porters' rack; a small sky-blue inhaler (L-shaped puffer, blue cap) sits in its LEFT chest pocket with the cap showing.
  dokgo: default    # FIRST APPEARANCE (intro P02). Dokgo Chul, 50s: windbreaker, scuffed white hard hat, a clipboard tablet in a battered case, TWO phones (the GC calls on the first; the porter app runs on the second, in a cracked black rubber case), and an unlit cigarette he never lights (behind his ear, or between his lips when he talks).
extras:
  gc_manager: "the general contractor's site manager: heard on Dokgo's phone; seen once, from behind, in P01 (face never shown). Crisp white hard hat with a thin NAVY band, a grey suit jacket over a new hi-vis vest, a steel watch, a paper coffee cup."
  porters: "six more Dokgo porters (numbers 01 to 06): men and two women aged about thirty to sixty, the same cheap yellow-green vests with white number patches, scuffed white hard hats, cargo straps, worn gloves; tired, quiet, practised."
  porter: "porter 06, who answers the roll call in P51: a lean, quiet man in his forties in the same vest and hard hat."
  crew: "the two Ryu Survey crew members from ch 7 (a stocky man in his forties and a young woman): red-orange safety vests, white hard hats. They go in behind Nib to lay the line, with the mule."
  mule: "Ryu Survey's construct mule (match ch 10; if ch 10 drew nothing new, the plain wooden mannequin construct from ch 7) with a back frame carrying a drum of white cable."
locations: [guro_pit_rim, guro_pit, guro_gate_inside]
location_notes:
  guro_pit_rim: "no key yet (decided here). The general contractor's site office on the south-east rim of the pit: three white site containers stacked two high, the top one with a floor-to-ceiling glass front facing the pit. Inside (P01 only): a clean window ledge and a coffee cup. The hoarding round the top of the pit is plain grey panels, printed blank."
  guro_pit: "no key yet (decided here). A building foundation pit in Guro-gu, among older four-storey factory blocks and new glass office towers (the old Guro industrial district that became the Guro Digital Complex). About 60 x 40 m and 12 m deep. Walls of rusty steel H-piles with timber lagging boards between them; two levels of horizontal steel struts and corner braces cross the pit wall to wall at about 4 m and 8 m up; an idle tower crane in the north-west corner. A gravel truck ramp runs down the south wall: Dokgo's battered flatbed truck parks at its top, the single white Ryu Survey van at its foot. Floor: packed grey gravel and mud, puddles, rebar bundles, stacked formwork. THE GATE stands near the middle of the north wall: a door-height black-violet slit with a cold white-cyan rim, on end among the rebar, inside a square frame of scaffold tubes bolted to four concrete blocks, with a ring of orange safety mesh about 10 m across round it and one opening on its south side. Outside the ring, left to right as seen from the ramp: Ryu Survey's white pop-up canopy and folding table (the line's base station, the cable drum, a radio charging rack, two folding chairs; Taeo's chair faces the gate) with the white cable running in through the frame's lower left corner; Dokgo's folding table 4 m to its right (thermos, tablet, two phones); the porters' staging area (crates, steel props, cargo straps) with a jacket rack made of a scaffold tube on two trestles, about 8 m from Ryu's table and in Taeo's line of sight; and Sejin's small white first-aid tent with a plain green cross on the far right near the ramp."
  guro_gate_inside: "no key yet (decided here). The C-grade dungeon. The threshold opens onto THE LANDING, a broad ledge of pale slate-grey slab-stone with the first relay post. Beyond it lies THE BASIN: a vast quarry of stacked grey slab terraces like collapsed shelves, cut with low black galleries. Every surface and the horizon slope about 10 degrees down to the LEFT (as seen looking in), so walkers lean into the slope. The sky is GREEN DUSK: deep teal-green overhead grading to pale acid green at the horizon; shadows violet. THE SURVEY LINE is Ryu Survey's white cable with a blue band every metre, laid along the route, with a relay post every 50 m (a short grey tripod with a small box, a loudspeaker grille, a handset on a coiled cord and a small white status lamp). THE STAGING SHELF, 80 m in, is the porters' turnaround; on its LEFT wall is the arched entrance of THE LOWER GALLERY, a low covered tunnel through the slab: unsurveyed, 40 m shorter than the upper run, with side galleries branching off it in the dark. THE UPPER RUN follows the cable along an open terrace. THE FORWARD CAMP, about 300 m in, is a broad shelf where the two routes meet again, with stacked crates of steel props, lamps and water drums for the clear team and a relay post; the lower gallery's EXIT is a lower, narrower arch on its left side. The survey line carries on past the forward camp toward the boss territory. From P47 both gallery mouths have red-and-white hazard tape tied across them."
palette_notes: "Pit (spring day): concrete grey and wet mud-brown, cool blue-grey shadows, a pale washed-blue sky above the rim; accents: the porters' yellow-green hi-vis vests (muted, never neon) and the dusty orange safety mesh. The gate: violet-black core #1A1026 with a cold white-cyan rim. The GC cabin (P01): clean cool white glass and grey. Inside the gate: GREEN DUSK sky (gradient allowed), slate-grey stone, violet shadows, the white survey cable. Red appears only on Dokgo's tablet bar (P43) and as the hazard tape at the lower gallery (P48 onward). The link amber #F2A93B appears only in Taeo's palm (P34 to P36) and in Nib's eyes: keep the vests yellow-green and the GC's hard-hat band navy, so nothing else reads as amber. Return marks are gate light (cold white with a faint violet edge), never interface cyan. There are no operator-interface windows in this chapter: the interface stays dark until ch 19."

panels:

  # ---------------- COLD OPEN: 9:00, the chain ----------------
  - id: P01
    shape: tall
    gap: none
    bg: white
    camera: "high angle from inside the general contractor's glass site cabin on the pit rim, over the site manager's shoulder, looking down into the pit"
    art: >
      The chain, top to bottom, in one tall frame. Top fifth, upper LEFT: the back of the general contractor's site manager
      (extras.gc_manager; face never shown) at the cabin's floor-to-ceiling window: crisp white hard hat with a thin navy band,
      grey suit jacket over a new hi-vis vest, a phone at his right ear, a steel watch on his left wrist; a paper coffee cup
      steams on the clean window ledge. Upper RIGHT stays plain window glass and pale sky.
      Below the ledge the view drops 12 m into the foundation pit (guro_pit key): walls of rusty steel H-piles with timber
      lagging, two levels of steel struts bracing it wall to wall, an idle tower crane in the far corner, a gravel truck ramp.
      At the very bottom, small: grey gravel and mud, puddles, rebar bundles and, inside a ring of orange safety mesh by the
      north wall, the gate: a door-height black-violet slit with a cold white-cyan rim standing on end in a square frame of
      scaffold tubes. Pin-sized porters in yellow-green vests and white hard hats stand in a line beside it, and one tiny man
      at a folding table holds a phone to his ear. A white van waits at the foot of the ramp. Beyond the rim, old four-storey
      factory blocks and new glass towers.
      Clear spring morning sun from the upper left; hard shadows. Palette: clean cool white and grey at the top, concrete grey
      and mud brown below, cool blue-grey shadows; the tiny yellow-green vests are the one saturated accent, plus the gate's violet.
      Signs and hoardings blank. No readable text.
    calm: top-right
    lines:
      - {who: narr, type: tag, text: "GURO-GU, SEOUL · THURSDAY · 9:00 AM"}
      - {who: gc_manager, type: speech, side: l, text: "NINE O'CLOCK, MR. DOKGO."}
    sfx:
      - {text: "BRRR", style: phone, at: [0.34, 0.88], size: S, rot: -6}
    notes: "Cold open: the chain in one scroll, clean glass at the top and mud at the bottom. The GC's voice is speech only here, where he is in frame; everywhere else it reaches the pit as a phone voice. The tiny BRRR sits by the tiny man at the table (Dokgo)."

  - id: P02
    shape: wide
    gap: short
    bg: white
    camera: "low angle at the pit floor, three-quarter on Dokgo at his folding table"
    art: >
      Dokgo Chul (dokgo, default: windbreaker, scuffed white hard hat, two phones, the unlit cigarette behind his ear) stands
      at his folding site table near the gate ring with the first phone at his right ear. He is bowing to it: a small, automatic
      dip of the head and shoulders, a servile smile, tired eyes. His second phone (cracked black rubber case) is in his left
      hand; his tablet lies on the table beside a steel thermos and a coil of cargo straps. Behind him, simplified: the orange
      mesh, the edge of the violet slit, an H-pile wall. Morning sun from the upper left, his hard shadow on the gravel.
      Keep the top of the frame plain pile wall and sky.
    calm: top
    intro: "DOKGO CHUL · DOKGO CONTRACTING"
    lines:
      - {who: gc_manager, type: phone, side: l, text: "SEVEN HOURS. FOUR HUNDRED AND TWENTY MINUTES."}
      - {who: gc_manager, type: phone, side: l, text: "I'M COUNTING THEM."}
      - {who: dokgo, type: speech, side: l, text: "YES, SIR. ON SCHEDULE, SIR."}
    notes: "Beat: Dokgo's phone rings every hour with the general contractor counting minutes (9:00, 10:00, 11:00, 12:00 and 1:00 in this chapter). The deadline is the 16:00 site handover: 420 minutes from 9:00."

  - id: P03
    shape: inset-r
    gap: short
    bg: white
    silent: true
    camera: "close-up, Dokgo's face as he lowers the phone"
    art: >
      Dokgo lowers the phone from his ear and the servile smile slides off his face in one beat. What is left is flat, tired
      and hard: deep lines from nose to mouth, eyes already counting. The unlit cigarette behind his ear; a hard shadow under
      the hard-hat brim. Plain grey-brown background.
    calm: left

  - id: P04
    shape: wide
    gap: short
    bg: white
    camera: "from behind the line of porters at the foot of the ramp, looking across the gravel at Dokgo"
    art: >
      Foreground: the backs of eight porters in a ragged line (extras.porters; two of them, a small young woman and a heavy-set
      man in a back brace, are only backs here and not identifiable): yellow-green hi-vis vests with a square white number patch
      on each back (blank), scuffed white hard hats, cargo straps over their shoulders. Facing them across the gravel, Dokgo
      holds his phone up screen-out like a referee's stopwatch; its screen is a plain dark rectangle. Behind Dokgo, at the foot
      of the ramp, the white Ryu Survey van; Taeo (taeo, outdoor, white hard hat) is climbing out of its side door with a coil
      of cable over his shoulder, small in frame, glancing over. Morning sun from the upper left; the porters' long hard shadows
      stretch across the gravel toward Dokgo.
    calm: top
    lines:
      - {who: dokgo, type: speech, side: c, text: "SEVEN HOURS, PEOPLE."}
      - {who: dokgo, type: speech, side: c, text: "HE'S COUNTING MINUTES."}
    notes: "The same words, passed one link down the chain. Dami and Kwak stand in this line but are introduced at their first featured panels (P15, P26)."

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 13 · THE BOTTOM OF THE CHAIN"

  # ---------------- THE SITE, THE HAT, THE LINE ----------------
  - id: P06
    shape: full
    gap: long
    bg: white
    camera: "establishing, eye level from the foot of the ramp across the pit floor"
    art: >
      The pit floor (guro_pit key; layout in location_notes). LEFT: Ryu Survey's white pop-up canopy over a folding table with
      the line's base station (a grey field box, a handset on a coiled cord, a speaker grille, a row of small white status lamps),
      a big drum of white cable with a blue band every metre, a radio charging rack; Haein (haein, default, hard hat) kneels at
      the drum feeding cable; Ryu's construct mule (extras.mule) stands motionless beside it. CENTRE: the gate in its ring of
      orange mesh: a door-height black-violet slit with a cold white-cyan rim inside a square frame of scaffold tubes bolted to
      concrete blocks; the white cable already runs in through the frame's lower left corner. RIGHT: Dokgo's table; the porters'
      staging area (crates, steel props, cargo straps) and a jacket rack made of a scaffold tube on two trestles; far right by
      the ramp, a small white first-aid tent with a plain green cross, where Sejin (sejin, default, hard hat) unpacks a kit.
      FOREGROUND: Taeo (taeo, outdoor, white hard hat) sets down his coil of cable and eyes the gate the way you would eye a dog
      that might bite. Beside him Nib (nib, default, barefoot) holds a white hard hat out at arm's length and inspects it with
      deep suspicion. Morning sun from the upper left. Palette: concrete grey and mud brown, cool blue-grey shadows; accents the
      yellow-green vests and the dusty orange mesh. No readable signs.
    calm: top
    lines:
      - {who: narr, type: tag, text: "9:14 AM"}
      - {who: taeo, type: float, text: "C-GRADE. I LOOKED IT UP LAST NIGHT."}
      - {who: taeo, type: float, text: "I SHOULDN'T HAVE."}
    notes: "One Ryu van on site: Bluebird towed the other in ch 12. Lock this layout for the chapter and for ch 14 to 17: Ryu's table faces the gate; Dokgo's table is 4 m to its right; the jacket rack is about 8 m away and in Taeo's line of sight."

  - id: P07
    shape: wide
    gap: short
    bg: white
    camera: "medium, eye level with Nib, Minho standing over him"
    art: >
      Nib has put the hard hat on. It will not go down over his long ears: it perches on top of them a hand-span above his
      skull, like a lid on a bottle, the chin strap dangling, both ears bent out sideways under the brim. His face is pure,
      patient deadpan. Minho (minho, default + white hard hat; grey streak at his LEFT temple, radio high on his LEFT chest)
      looks down at him with a clipboard under his arm: unamused, fair, out of ideas. Taeo behind them with a sweat drop.
      Simplified pit background, gravel underfoot.
    calm: top
    lines:
      - {who: minho, type: speech, side: r, text: "SITE RULES. HARD HAT."}
      - {who: nib, type: speech, side: l, text: "IT'S SITTING ON MY EARS."}

  - id: P08
    shape: inset-l
    gap: short
    bg: white
    camera: "close, at drum height, Haein drilling"
    art: >
      Haein, safety glasses DOWN now, braces the hard hat on top of the cable drum with one gloved hand and drives a cordless
      drill through the side of its shell with the other: one neat round hole done, the second biting in, white plastic curls
      spiralling off the bit. Her face is calm and businesslike: a normal Thursday. Flat light background.
    calm: right
    lines:
      - {who: haein, type: speech, side: l, text: "GIVE IT HERE."}
    sfx:
      - {text: "BRRRRT", style: comic, at: [0.70, 0.36], size: M, rot: -8}

  - id: P09
    shape: narrow-r
    gap: short
    bg: white
    camera: "eye level, full figure on Nib"
    art: >
      Nib, full figure, in the drilled hard hat: his long ears stand straight up through the two holes, the V-notch in the top
      of his LEFT ear clear above the shell; the chin strap is buckled tight under his jaw. He wears it dead level, like a
      soldier's helmet, with a grave, approving face. Still barefoot on the gravel. (Brown rope belt, leather pouch on his RIGHT
      hip, brown wooden sheath on his LEFT hip; one small lower fang on the left.) Adult and weathered, NOT cute. Plain gravel
      and pile-wall background.
    calm: none
    lines:
      - {who: nib, type: speech, side: l, text: "...BETTER."}
      - {who: minho, type: speech, side: r, text: "AND BOOTS?"}
      - {who: nib, type: speech, side: l, text: "NO."}
    notes: "Runner: Nib vs. shoes (he chooses boots himself in ch 43). Continuity: Nib wears this drilled Ryu hard hat for site work through the Guro job (ch 13 to 17). It is Ryu kit, not his."

  - id: P10
    shape: wide
    gap: short
    bg: white
    camera: "over Taeo's shoulder at the canopy table, Haein and Minho across it"
    art: >
      Under the white canopy. Near foreground, right: Taeo's shoulder and the back of his hard hat; his olive backpack with the
      faded orange shield-and-door patch hangs on the back of his folding chair. Across the table, Haein sets the base station
      down and points along the white cable to where it runs into the gate frame; Minho, standing, hands Taeo a clipboard with a
      blank ruled log sheet (squiggles only) and taps it once with a finger. Simplified pit and gate frame behind.
    calm: top
    lines:
      - {who: haein, type: speech, side: l, text: "THE LINE CARRIES THE RADIO THROUGH. WHILE IT HOLDS."}
      - {who: minho, type: speech, side: l, text: "YOU LOG HIS CALLS. AND YOU **STAY** OUTSIDE."}
      - {who: taeo, type: speech, side: r, text: "YOU'VE SAID THAT TWICE."}
    notes: "Rule (decided here): radios drop out at thresholds (ch 10), but Ryu's survey line is a cable with a relay post every 50 m, and it carries radio through the threshold for as long as it is intact. Inside, radios work within reach of the line. The knock stays the fallback. 'STAY' is the callback to ch 12's hook."

  - id: P11
    shape: wide
    gap: short
    bg: white
    camera: "low, from the table top, Dokgo leaning in across it"
    art: >
      Dokgo has arrived at the canopy table and leans on it on both fists, tablet in one hand, the unlit cigarette now between
      his lips, bobbing as he talks. Minho straightens up to face him, level and unimpressed. Taeo, seated at the table's end
      between them, leans back out of the way with the clipboard held to his chest. The base station and its cable in the near
      foreground.
    calm: top-left
    lines:
      - {who: minho, type: speech, side: r, text: "I'LL SAY IT AGAIN AT TEN."}
      - {who: dokgo, type: speech, side: l, text: "YOUR SPOTTER GOES IN AT TEN. NOT TEN-OH-ONE."}
      - {who: minho, type: speech, side: r, text: "HE GOES IN WHEN THE FRAME'S CHECKED."}

  - id: P12
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up, top-down on Dokgo's tablet held out over the table"
    art: >
      Dokgo's thumb on his scuffed tablet, held out flat over the table: a contract page drawn as neat grey lines of squiggles,
      a plain header block at the top left, and one clause marked with a pale yellow highlight band, his thumbnail pressed just
      under it. Leave the header block and the highlight band empty for the letterer. A corner of the table and the coiled
      handset cord below.
    calm: none
    ui:
      - {kind: label, text: "SUBCONTRACT · THIRD TIER", at: [0.28, 0.20], size: 34, notes: "move onto the header block once the art exists"}
      - {kind: label, text: "9.3  LATE HANDOVER: ₩5,000,000 PER HOUR", at: [0.52, 0.58], size: 38, notes: "move onto the highlight band once the art exists"}
    lines:
      - {who: dokgo, type: speech, side: r, text: "CLAUSE NINE. READ IT."}
      - {who: narr, type: footnote, text: "*₩5,000,000 ≈ US$3,600"}
    notes: "PLANT P08 (the clause): the client contract's ₩5,000,000-an-hour lateness penalty. It decides Dokgo's orders in this chapter (P43 to P45, P57) and in ch 14 to 17, where Taeo pays a share."

  - id: P13
    shape: wide
    gap: short
    bg: white
    camera: "low, from beside the table, looking up past Dokgo at the pit rim"
    art: >
      Dokgo jabs his unlit cigarette straight up at the glass site cabin on the pit rim far above (small, glinting in the sun),
      then, the same hand in one arc drawn as a single speed line, down at the porters unloading crates at the foot of the ramp.
      Taeo, seated, follows the arc with his eyes, worried. Minho stands with his arms folded: he knows all this already.
      Pale sky above the H-pile walls; steel struts cross the top of the frame.
    calm: top-right
    lines:
      - {who: taeo, type: speech, side: l, text: "FIVE MILLION WON. AN HOUR?"}
      - {who: dokgo, type: speech, side: r, text: "IT STARTS UP THERE."}
      - {who: dokgo, type: speech, side: r, text: "AND IT ROLLS DOWNHILL."}
    notes: "The chain in one gesture: client, contractor, the tiers, Dokgo, then the porters, who are not on the page at all."

  - id: P14
    shape: narrow-r
    gap: short
    bg: white
    camera: "high angle, top-down on Dokgo's second phone on his table"
    art: >
      Dokgo's second phone lies face-up on his folding table in its cracked black rubber case, beside the steel thermos and his
      unlit cigarette. Screen: green. His gloved fingers are just reaching in from the edge of frame to pick it up. Gravel dust
      on the table top.
    calm: none
    ui:
      - {kind: phone.info_card, on: screen, title: "DOKGO CONTRACTING · PORTERS", text: "Guro pit (C-grade): site handover 16:00 · Time left 06:35:48 · Late penalty ₩5,000,000 per hour"}
    lines:
      - {who: taeo, type: float, text: "FIVE MILLION AN HOUR IS ₩83,333 A MINUTE."}
    notes: "PLANT P08 (the countdown): Dokgo's porter app counts down to the 16:00 handover against the ₩5,000,000-an-hour penalty. It is 09:24:12. The app also logs porter runs, and the GC can see it (P43)."

  # ---------------- DAMI ----------------
  - id: P15
    shape: full
    gap: long
    bg: white
    silent: true
    camera: "eye level from the foot of the ramp, looking up it as the porters come down"
    art: >
      Down the gravel truck ramp the porters come in single file, bent forward under crates and steel props on shoulder straps.
      In front: Gu Dami (dami, default: cheap yellow-green hi-vis vest bristling with pockets over a grey hoodie, scuffed white
      hard hat, cargo straps, worn gloves; small, wiry, determined) carries two stacked crates on a shoulder strap, jaw set, eyes
      forward, a strand of hair stuck to her forehead with sweat. Behind her, other porters (extras.porters). Lower right
      foreground, at the canopy table: Taeo has half risen from his folding chair and is staring at her, recognising her, and
      remembering something sad. Dokgo's flatbed truck is parked at the top of the ramp. Sun from the upper left, hard shadows
      down the slope.
    calm: top-left
    intro: "GU DAMI · 19 · PORTER"
    notes: "Continuity from ch 11's hook: Dami is the young porter crying in the background of the KNN 24 report about a porter missing after an earlier Dokgo Contracting job in Guro."

  - id: P16
    shape: wide
    gap: short
    bg: white
    camera: "over Dami's shoulder toward Taeo at the table"
    art: >
      Dami drops her crates beside the canopy with a grunt and straightens, glaring at Taeo, who has been caught staring. He lifts
      both hands, apologetic, half out of his chair. Beside his chair, Nib (drilled hard hat) is not looking at either of them:
      his eyes are fixed on Dami's vest. Simplified canopy and gravel.
    calm: top
    lines:
      - {who: dami, type: speech, side: l, text: "YOU'RE STARING."}
      - {who: taeo, type: nervous, side: r, text: "SORRY. I THINK I SAW YOU ON THE NEWS."}
      - {who: dami, type: speech, side: l, text: "THE BACK OF ME. THEY FILMED THE HUNTERS."}

  - id: P17
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up on Dami, three-quarter, as she glances toward Dokgo's table"
    art: >
      Dami's eyes slide sideways toward Dokgo's table (off panel) and her voice drops; she tugs one glove tighter with her
      teeth. Hard and bitter, not tearful. Plain background.
    calm: left
    lines:
      - {who: dami, type: whisper, side: r, text: "AND HE TOLD THEM THE MAN 'LEFT VOLUNTARILY'."}
      - {who: taeo, type: speech, side: l, text: "THEN WHY DO YOU STILL WORK FOR HIM?"}
    notes: "'LEFT VOLUNTARILY' quotes the ch 11 news. The earlier missing porter stays unnamed and unresolved here; the hook repeats Dokgo's habit."

  - id: P18
    shape: narrow-l
    gap: short
    bg: white
    camera: "close, Dami's gloved hand holding her phone up toward Taeo"
    art: >
      Dami's gloved hand holds her phone up and turned toward Taeo (and us), like evidence: a cheap phone in a scratched case.
      Screen: green. Her vest's pockets and a strap buckle behind it, simplified.
    calm: none
    ui:
      - {kind: phone.info_card, on: screen, title: "BLUEBIRD CAPITAL", text: "Draw loan reminder · Instalment due tomorrow · Balance owed: ₩2,100,000"}
    lines:
      - {who: dami, type: speech, side: l, text: "THAT'S WHY."}
