  - id: P58
    shape: tall
    gap: black
    bg: black
    camera: "inside the gate at the forward camp, low, from behind the relay post"
    art: >
      THE HOOK. Inside the gate (guro_gate_inside: the forward camp). Top quarter: green dusk sky. Below it, the slab wall with the
      lower gallery's exit: a low black arch with red-and-white hazard tape sagging across it, the only red in the panel; beyond the
      tape, nothing but black. Middle: Dami stands in front of the tape, very still, her two crates forgotten at her feet, staring
      into the dark, her face in profile: stricken, furious, afraid. Beside her Nib (drilled hard hat, ears up and turned forward,
      V-notch LEFT ear; brown rope belt, pouch RIGHT hip, brown wooden sheath LEFT hip; barefoot; the radio low in his LEFT hand),
      also in profile, eyes narrowed on the dark, listening, his free hand resting on his knife hilt. Behind them, small, the other
      porters are already shouldering their loads and filing away along the white cable toward the right edge, heads down,
      obedient. Foreground, low and large: the relay post, its loudspeaker grille, its handset swinging on the coiled cord. Everything
      slopes ten degrees down to the left. Green light from above, violet shadows; Nib's amber eye the only warm note. Hard cel
      shadows, no haze. Adult, weathered, never cute.
    calm: top
    lines:
