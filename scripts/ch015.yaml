chapter: 15
title: Air Through a Wall
when: "Thursday, mid-spring: the Guro pit job day (ch 12's 'THURSDAY'; chapters 13–17 are this one day). From about 2:12 PM, straight on from ch 14's hook (Nib at the rubble wall, at about 2:11 PM), to about 2:40 PM, the moment before ch 16's slab drop. Lettered times: 2:13 PM (the pit), the site clock at 14:13 (00:46:51 left until SURVEY LINE READY 15:00), 2:19 PM (inside). Minho reaches the wall at about 2:24 PM; his thirty minutes run 2:24–2:54 PM. The clear team is BOOKED to enter at 3:00 PM; it actually enters at 3:47 PM (ch 16) and kills the boss at 4:00 PM (ch 17)."
story_beats: PART_ONE_BEATS.md#15
cast:
  taeo: outdoor     # navy zip jacket over the black hoodie, black cargo trousers, black sneakers with one white stripe; SITE KIT as ch 14: a white hard hat a size too big and a Ryu Survey red-orange safety vest over the jacket. ONE mole under his RIGHT eye. Olive backpack (faded orange patch out) on the back of his folding chair; his cracked phone face-down on the table. Holds the relay handset in his LEFT hand throughout, matching ch 14 and ch 16; RIGHT palm stays free for the link. The link pulse is in his RIGHT palm (as ch 7 and ch 14). He stays OUTSIDE all chapter
  nib: default      # inside the gate all chapter. Barefoot, white drilled Ryu hard hat with chin strap (ch 13–14). V-notch LEFT ear; one lower fang on the left; brown rope belt; pouch on the RIGHT hip with Haru's small dinosaur sticker on the flap and Kwak's blue inhaler inside (ch 14); brown wooden sheath on the LEFT hip. The small Ryu radio in his LEFT hand, set down on a rock beside the prop in P44 (where ch 16 finds it)
  minho: default    # outside: brown work jacket under a Ryu red-orange vest, white hard hat, grey streak at his LEFT temple, radio clipped high on his LEFT chest, watch on his LEFT wrist, a rugged laptop. From P17, GATE KIT as ch 16: hard hat and vest retained, headlamp band round the helmet, a telescoping steel survey pole with a hooked head
  sejin: default    # cropped hair, tired eyes, medic chest rig, white hard hat outside. From P19 (as ch 16): a headlamp band round her white hard hat, nitrile gloves, a trauma bag, one water bottle
  haein: default    # work overalls, tool belt, a red-orange Ryu vest, safety glasses pushed up under a white hard hat worn far back, headphones round her neck. Runs the relay at the left end of the radio table all chapter
  dami: default     # lime-yellow porter vest over a grey hoodie, scuffed white hard hat, cargo straps, worn gloves, a shoulder frame (dropped at the threshold in P22). From P23 she sits on an upturned crate at the radio table with Kwak's navy canvas jacket in her lap, and stays there into ch 16
  mansu: default    # Kwak Mansu, 58: heavy-set, short grey hair, stubble, a back brace over his work clothes, lime-yellow porter vest; no jacket (it is on the radio table); his dented white hard hat lies beside him; both shins pinned under the slab, the LEFT worst. Seen from P36
  dokgo: default    # navy windbreaker, white hard hat pushed back, a clipboard tablet under his arm, TWO phones (the porter-app phone in his hand, the general contractor's phone in his chest pocket), an unlit cigarette
extras:
  porters: "Dokgo Contracting porters (eight on the roster, Dami 07 and Kwak 08 included): unawakened men and women from their twenties to their sixties in the same cheap lime-yellow hi-vis vests and scuffed hard hats as Dami, cargo straps, shoulder frames carrying sealed grey crates, water jugs or battery packs; tired and quiet"
  crew: "the two Ryu Survey crew members from ch 7: a stocky man in his forties and a young woman, red-orange vests, white hard hats; inside the gate they work a survey instrument on a tripod and plant the orange-tipped stakes"
  scuttler: "the gallery creature of ch 16, only HEARD and glimpsed here: a C-grade cave crawler about 1.2 m long, low and flat like a giant woodlouse, slate-violet armour plates, a fringe of thin jointed legs, two long whip feelers, NO eyes. In this chapter only one feeler and the edge of one plate are seen; its red throat is saved for ch 16"
locations: [guro_pit, guro_gate_inside, guro_side_gallery]
location_notes:
  guro_pit: "no key yet (decided here). A building foundation pit in Guro-gu, among older four-storey factory blocks and new glass office towers (the old Guro industrial district that became the Guro Digital Complex). About 60 x 40 m and 12 m deep. Walls of rusty steel H-piles with timber lagging boards between them; two levels of horizontal steel struts and corner braces cross the pit wall to wall at about 4 m and 8 m up; an idle tower crane in the north-west corner. A gravel truck ramp runs down the south wall: Dokgo's battered flatbed truck parks at its top, the single white Ryu Survey van at its foot. Floor: packed grey gravel and mud, puddles, rebar bundles, stacked formwork. THE GATE stands near the middle of the north wall: a door-height black-violet slit with a cold white-cyan rim, on end among the rebar, inside a square frame of scaffold tubes bolted to four concrete blocks, with a ring of orange safety mesh about 10 m across round it and one opening on its south side. Outside the ring, left to right as seen from the ramp: Ryu Survey's white pop-up canopy and folding table (the line's base station, the cable drum, a radio charging rack, two folding chairs; Taeo's chair faces the gate) with the white cable running in through the frame's lower left corner; Dokgo's folding table 4 m to its right (thermos, tablet, two phones); the porters' staging area (crates, steel props, cargo straps) with a jacket rack made of a scaffold tube on two trestles, about 8 m from Ryu's table and in Taeo's line of sight; and Sejin's small white first-aid tent with a plain green cross on the far right near the ramp. The radio table is 8 m outside the frame; a coiled handset cannot reach the frame from the table. White hard hats remain on during site work, including Nib's drilled hat. Supplemental white station stakes with orange tips and white clip lamps stand every 40 m; they do not replace the cable or grey relay tripods every 50 m."
  guro_gate_inside: "As ch 13–14: a vast terraced quarry of pale bone-grey stone under a GREEN DUSK sky, everything leaning about ten degrees down to the LEFT as seen looking in; the terrace path about 3 m wide; Ryu Survey's white cable with a blue band every metre along it and the orange-tipped steel stakes every 40 m or so (20 in all); at stake 14 a side-passage mouth with a fan of fresh dust and Kett's mark scratched at knee height (ch 14); at stake 20 the RUBBLE WALL, a rockfall of enormous pale slabs about 3 m high with a dark crack between two slabs about 1 m up, at Nib's face height. In P32 Minho's pole frees the stones jammed in the crack and it opens into a squeeze-gap a body wide: still 'a narrow crack' (ch 16), and the only way into the gallery."
  guro_side_gallery: "As ch 16 (decided there; follow it): a low chamber about 6 x 4 m, ceiling 1.8–2.2 m, of fractured pale grey stone, lit only by thin hard-edged bars of green-dusk light from fissures in the ceiling and by headlamps. Before ch 16's drop: a great pale slab lies tilted near the middle, its high edge on rubble and its low edge across Kwak's shins; Kwak half sits on the rubble, propped on his elbows, with his dented hard hat beside him and his split crate's short telescopic steel props spilled round him; a black fissure low in the side wall (the scuttler's hole); the crack they came through glows green in the opposite wall. In P44 Nib sets his radio on a rock just right of the prop."
palette_notes: "Pit: high spring sun from the south-west, dusty grey-ochre gravel and concrete, warm brown-grey shadows, a pale blue sky cut into a grid by the rust-orange struts; accents: the lime-yellow porter vests (muted, never neon), the Ryu red-orange vests (never the link amber) and the gate's violet-black core with its cold white-cyan rim. Inside the gate: the saturated green-dusk sky, pale bone-grey stone, violet shadows, the orange stake tips and the white banded cable. Gallery: violet-black shadow, thin hard-edged bars of green-dusk light, white headlamp cones. NO red anywhere in this chapter's art (red is only in the lettered site-clock UI): ch 16 owns the scuttler's red throat. Return marks are gate light (cold white with a faint violet edge), never interface cyan. Nib's link amber #F2A93B appears only in Taeo's RIGHT palm (P01, P48, P49) and in Nib's eyes. No operator-interface windows: the interface stays dark until ch 19. Page background: white outside, black for the long inside stretches and the last three panels."

panels:

  # ---------------- COLD OPEN ----------------
  - id: P01
    shape: strip
    gap: none
    bg: white
    silent: true
    camera: "extreme close-up, side-on, Taeo's left hand on the relay handset"
    art: >
      Outside at the radio table (guro_pit). An extreme close-up of Taeo's LEFT hand gripping the grey relay handset; his thumb comes
      DOWN on the talk key, firm and steady this time, not white-knuckled. At the frame edge his free RIGHT palm rests on the table, a faint steady amber pulse (#F2A93B) under the skin: a held pressure. The coiled handset cord runs out of frame. Plain dark background.
      Keep the thumb, the key and the glow in the middle third of the height. No other glow, no text.
    calm: none
    focus: [0.5, 0.5]
    notes: "Straight on from ch 14's last panels: his thumb hovered over the key (P51) while Nib's palm on the rubble glowed in his; then Nib spoke first (P52). Now he presses. Mirrors ch 14 P34, where he pressed the key hard to say 'FINISH THE LINE'."

  - id: P02
    shape: tall
    gap: short
    bg: white
    camera: "low angle from the gravel, Taeo half-risen at the radio table, the gate behind him"
    art: >
      Low angle (guro_pit). Taeo (taeo, outdoor, site kit: a white hard hat a size too big, a Ryu red-orange vest over the navy jacket)
      has half risen from his folding chair under the white canopy, the handset at his mouth in his LEFT hand, eyes fixed past the camera on
      the gate: scared, and decided anyway. Brows together, jaw set, a bead of sweat under the hard hat's brim. At the left end of the table
      Haein (haein, default: overalls, red-orange vest, safety glasses pushed up under a white hard hat worn far back, headphones round her
      neck) has turned on her stool, screwdriver stopped in the air. Beyond the canopy's edge the struts grid the sky; hard bars of shadow.
      Taeo is on the right, Haein at the left end of the table; allow room for Taeo's half-standing figure.
    calm: top-left
    lines:
      - {who: taeo, type: speech, side: r, text: "GO LOOK FOR KWAK."}
      - {who: taeo, type: speech, side: r, text: "I'LL PAY THE PENALTY."}
    notes: "Beat line ('GO. I'LL PAY THE PENALTY.'). It answers Dokgo's ch 14 question 'WHO PAYS THAT? YOU?'. Arc beat (STORY_BIBLE §6): he backs someone else's judgement at a cost."

  - id: P03
    shape: tall
    gap: short
    bg: white
    camera: "over Taeo's shoulder toward Minho at the right end of the table"
    art: >
      Over Taeo's shoulder (the oversized hard hat and red-orange vest in the left foreground). At the right end of the table Minho (minho,
      default: brown work jacket under a Ryu red-orange vest, white hard hat, grey streak at his LEFT temple under the brim, radio clipped
      high on his LEFT chest) is already on his feet, one hand flat on his closed rugged laptop: angry and frightened for his family's
      business, not cruel. Shade under the white canopy; the gate's violet edge far behind him.
      Minho stands fully visible on the right; Taeo's shoulder stays in the left foreground.
    calm: top-right
    lines:
      - {who: minho, type: intense, side: r, text: "IT'S NOT YOUR PENALTY, IT'S MY CONTRACT."}
    notes: "Beat line. Ryu Survey has the same clause as Dokgo (ch 14: 'SAME CLAUSE IN OUR CONTRACT. FIVE MILLION AN HOUR.')."

  - id: P04
    shape: strip
    gap: short
    bg: white
    camera: "close-up, front, Taeo's face"
    art: >
      A close strip of Taeo's face, front-on under the too-big hard hat: pale, sweating, apologetic and immovable at the same time, the rare
      stubbornness under the politeness. The single mole under his RIGHT eye. Cold violet light from the distant gate on his left cheek,
      warm daylight on his right. Plain background.
    calm: none
    lines:
      - {who: taeo, type: speech, side: c, text: "THEN TAKE IT FROM MY DEPOSIT."}
      - {who: taeo, type: float, text: "IT'S THE ONLY MONEY I'VE NEVER SENT HOME."}
    notes: "Beat line. His flat's ₩5,000,000 rental deposit (ch 14 P11 anticipates the figure without stating it; world/LOCATIONS.md taeo_flat: ₩450,000 a month on a ₩5,000,000 deposit). Sets up ch 17 (₩3,400,000 signed away) and ch 21 (balance ₩1,600,000)."

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 15 · AIR THROUGH A WALL"

  # ---------------- THE PRICE ----------------
  - id: P06
    shape: full
    gap: long
    bg: white
    camera: "establishing, high angle from the pit rim, looking down across the pit floor"
    art: >
      The Guro construction pit (guro_pit) from its rim: walls of steel H-piles with timber lagging, two tiers of rust-orange steel struts
      crossing it and laying a grid of hard shadow bars on the grey gravel floor. In the shade of the far wall stands the gate: a door-height
      black-violet slit with a cold white-cyan rim inside a square scaffold-tube threshold frame, ringed by orange safety mesh, a white survey cable with a blue band every metre running through the frame's lower LEFT corner. Eight metres outside the frame to its LEFT as seen from the ramp, the radio table under a white canopy
      lean-to, small figures round it: Taeo standing, Minho, Haein, Sejin. To the RIGHT of Ryu's canopy: Dokgo's separate table and staging (pallets of water jugs and
      battery packs, sealed grey crates) and the porters' rest area with the scaffold-tube jacket rack; porters (extras.porters) in lime-yellow vests
      with shoulder frames; Dokgo (dokgo) among them, turning his head toward the raised voices. Near the ramp foot, Sejin's aid station
      (folding table, white medic case, folded stretcher, camp chair). High spring sun from the south-west. No readable text or signs anywhere.
    calm: top
    lines:
      - {who: narr, type: tag, text: "GURO-GU · CONSTRUCTION PIT · 2:13 PM"}
    notes: "Layout as ch 13–14 (see location_notes). The radio table is 8 m from the gate; ch 16 opens with Taeo bent over this table."

  - id: P07
    shape: full
    gap: short
    bg: white
    camera: "wide, eye level, from beside the relay case: the whole table turning to Taeo"
    art: >
      BIG REACTION under the white canopy (guro_pit). Everyone at the radio table turns to Taeo at once: Minho with his eyes wide and his mouth
      open; Haein's screwdriver dropping out of her fingers; Sejin (sejin, default: medic chest rig, cropped hair, white hard hat) at Taeo's
      shoulder with half a triangle kimbap frozen at her mouth. Taeo in the middle, small and stubborn, the handset in his LEFT hand. On the
      table: the grey rugged relay case with its two stub antennas and speaker grille, Minho's laptop, Taeo's cracked phone face-down, and an
      faded navy canvas work jacket with frayed cuffs (Kwak's). Focus lines behind the group; strut-shadow bars across them.
      Frame the group from the knees up: Haein left, Taeo centre, Minho right, Sejin beside Taeo.
    calm: top
    lines:
      - {who: minho, type: speech, side: r, text: "YOUR RENTAL DEPOSIT?"}
      - {who: taeo, type: speech, side: c, text: "MY FLAT'S DEPOSIT. FIVE MILLION WON."}
      - {who: narr, type: footnote, text: "*₩5,000,000 ≈ US$3,600"}
    notes: "Kwak's jacket remains faded navy canvas, with its LEFT chest pocket, as in ch 13 P30 and P55."

  - id: P08
    shape: tall
    gap: short
    bg: white
    camera: "two-shot in profile at the canopy's edge, Dokgo on the left, Taeo on the right"
    art: >
      Profile two-shot at the canopy's edge (guro_pit). Dokgo (dokgo, default: navy windbreaker, white hard hat pushed back, clipboard tablet
      under his arm, an unlit cigarette) has walked over with the porter-app phone in his hand; he points the cigarette at Taeo, almost
      gently: tired, nearly pitying arithmetic. Taeo answers with a small, wretched, polite smile and a slight bow of the head, a sweat drop at
      his temple. Plain dusty background with the grey line of a strut.
      Dokgo stands on the left and Taeo on the right, both fully visible.
    calm: top
    lines:
      - {who: dokgo, type: speech, side: l, text: "YOU'LL PAY?"}
      - {who: dokgo, type: speech, side: l, text: "FIVE MILLION WON ONLY COVERS ONE LATE HOUR, KID."}
      - {who: taeo, type: nervous, side: r, text: "SORRY. I ONLY HAVE THE ONE FLAT."}
    notes: "PAYOFF P08: the clause prices Taeo's only savings at exactly one late hour. Taeo gets funnier when he is scared."

  - id: P09
    shape: narrow-r
    gap: short
    bg: white
    camera: "close on Dokgo's porter-app phone, held upright, straight on"
    art: >
      Dokgo's hand lifting the porter-app phone upright in portrait, screen toward us. Screen: green (a flat, evenly lit #00FF00 area with crisp
      edges). A cheap rugged phone in a scuffed black case; a cracked, dirty thumbnail. Gravel and the edge of a crate behind, simplified.
    calm: none
    ui:
      - {kind: phone.info_card, on: screen, title: "DOKGO CONTRACTING · SITE CLOCK", text: "SURVEY LINE READY 15:00 · 00:46:51 LEFT · SITE HANDOVER 16:00 · LATE: ₩5,000,000 PER HOUR"}
    notes: "PAYOFF P08: Readiness countdown at 14:13:09. Ch 14 P09 counts separately to the contractual 16:00 handover. The line is due ready for Ironclad at 15:00; the penalty applies to late SITE HANDOVER, not being inside after 15:00."

  - id: P10
    shape: wide
    gap: short
    bg: white
    camera: "medium, eye level, Minho at the laptop end of the table"
    art: >
      Minho at the right end of the table (guro_pit) has flipped his rugged laptop open: its screen is a dark slab with a few pale plotted
      lines ending in a flat bar (plain shapes, no letters). Talking to Taeo without looking at him, he thumbs the radio on his LEFT chest for
      the second line: a survey lead who trusts his plot, testing the one who disagrees with it. Haein, beyond him, watches the relay's
      status lamps. Shade under the canopy.
      Crop Minho at the waist on the right, with Haein behind him on the left.
    calm: top-left
    lines:
      - {who: minho, type: speech, side: r, text: "MY MOTHER SIGNED THE SURVEY CONTRACT."}
      - {who: minho, type: speech, side: r, text: "NIB. MY MAP SAYS SOLID ROCK BEHIND THAT WALL."}
    notes: "Ryu Seonhee runs Ryu Survey's books (ch 10) and signs its contracts (ch 30). The radio is half-duplex: Nib hears only what is said with a key pressed."

  - id: P11
    shape: inset-l
    gap: short
    bg: white
    camera: "close, three-quarter from above, the relay case's speaker grille"
    art: >
      The grey rugged relay case on the folding table (guro_pit), its speaker grille filling most of the frame, a row of small white status
      lamps lit beside it, one stub antenna. The navy canvas jacket's frayed cuff at the frame's edge. Flat light under the canopy.
    calm: right
    lines:
      - {who: "offpanel:nib", type: phone, side: l, text: "THEN YOUR MAP IS OLD."}
    sfx:
      - {text: "KSSH", style: quiet, at: [0.30, 0.34], size: S, rot: -4}

  - id: P12
    shape: wide
    gap: short
    bg: white
    camera: "over Minho's left shoulder, toward Taeo"
    art: >
      Over Minho's left shoulder (his brown jacket and red-orange vest fill the left foreground; the grey streak at his LEFT temple at the frame
      edge). Taeo has turned to face him across the table's corner, the handset lowered in his LEFT hand, and speaks quietly: scared but steady,
      brows drawn together, eyes up to Minho's. Behind Taeo, the gate's violet slit small in the shade, 8 m off.
      Taeo is on the right, Minho's shoulder on the left; frame from the waist up.
    calm: top-right
    lines:
      - {who: taeo, type: speech, side: r, text: "AT THE YARD, YOU TOLD ME TO LET NIB FINISH LOOKING."}
      - {who: taeo, type: speech, side: r, text: "LET NIB FINISH LOOKING NOW."}
    notes: "Callback: Minho said 'LET HIM FINISH LOOKING.' to Taeo in ch 7; ch 14 P32 notes that nobody said it then. Taeo backs Nib's judgement with Minho's own rule."

  - id: P13
    shape: inset-r
    gap: short
    bg: white
    silent: true
    camera: "close-up, front, Minho's face"
    art: >
      Minho, caught by his own words: jaw set, lips pressed thin, his eyes sliding from Taeo to the gate and back. A long breath held through
      the nose. The grey streak at his LEFT temple under the hard hat. Plain background with a bar of strut shadow across his shoulder.
    calm: none

  - id: P14
    shape: wide
    gap: short
    bg: white
    camera: "medium, side-on at table height, Taeo leaning into the relay"
    art: >
      Side-on along the table (guro_pit): Taeo leans in to the relay case's speaker grille with the handset at his mouth, thumb on the key, his
      head bowed: an apology and a question at once. Haein, at the left end, watches him with one headphone cup lifted, a small approving
      look. The navy canvas jacket on the table between them. Shade under the canopy, the gravel bright beyond.
      Taeo is on the right, Haein on the left; frame both at the waist.
    calm: top
    lines:
      - {who: taeo, type: speech, side: r, text: "NIB. AT STAKE FOURTEEN, YOU HEARD SOMETHING."}
      - {who: taeo, type: speech, side: r, text: "SORRY I CUT YOU OFF. TELL ME WHAT YOU HEARD."}
    notes: "Ch 14 P33–P34: at stake 14 Nib said 'AND I HEARD—' and Taeo keyed over him with 'FINISH THE LINE, NIB.' Now he lets him finish (ch 7's title, 'Let Him Finish')."

  - id: P15
    shape: wide
    gap: short
    bg: white
    camera: "inside, close side view at the rubble wall, Nib's ear to the crack"
    art: >
      Inside the gate at the rubble wall (guro_gate_inside). Nib (nib, default: V-notch in the top of his LEFT ear, one small lower fang on the
      left, torn pinkish-tan wrap top, torn charcoal shorts, brown rope belt, pouch on the RIGHT hip with a small dinosaur sticker on its flap,
      knife in a brown wooden sheath on the LEFT hip, barefoot, white drilled Ryu hard hat with chin strap) has his RIGHT ear pressed to the dark crack between two enormous
      pale slabs at his face height, eyes half closed, listening; the radio at his mouth in his LEFT hand; the fingers of his right hand rest on
      a wedge stone jammed in the crack that will not move. A thin ribbon of dust drifts out past his cheek. Green-dusk light, violet shadow on
      the slab. Weathered adult, never cute.
      Nib's face and ear are on the left, the crack on the right; frame from his chest up.
    calm: top-left
    lines:
      - {who: nib, type: speech, side: l, text: "A WHISTLE IN THE STONE. IT STOPS. THEN IT COMES BACK."}
      - {who: nib, type: speech, side: l, text: "SOUNDS LIKE SOMEONE STRUGGLING TO BREATHE. I HEAR THE SAME WHISTLE THROUGH THIS WALL."}
    notes: "Nib's evidence: rhythm. Wind through a crack does not stop to rest. He heard it at stake 14's passage (ch 14) and hears it now under the draught at the wall. The jammed wedge is why he cannot go through alone (P30–P32)."

  - id: P16
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up, Sejin, a half-eaten kimbap lowered"
    art: >
      Sejin outside at the table (guro_pit), the half-eaten triangle kimbap lowered from her mouth, her tired eyes suddenly sharp and very
      still: a medic hearing a symptom. Plain background, a bar of strut shadow.
      Sejin's face is in the left third.
    calm: right
    lines:
      - {who: sejin, type: speech, side: l, text: "THAT WHISTLE SOUNDS LIKE WHEEZING."}
    notes: "Kwak has asthma and no inhaler (ch 13–14)."

  - id: P17
    shape: tall
    gap: short
    bg: white
    camera: "medium, side-on, Minho at the end of the table"
    art: >
      Minho (guro_pit) keeps his white hard hat and red-orange vest on, straps a headlamp round the helmet and takes up his telescoping steel survey pole with a hooked head, already moving; he checks the watch on his LEFT wrist (a plain
      face, no numbers). His face is hard and decided: he has made it his own call. The radio stays clipped high on his LEFT chest. Behind him,
      Haein at the relay. Shade under the canopy.
      Minho stands fully visible on the right; Haein remains seated on the left.
    calm: top-left
    lines:
      - {who: minho, type: speech, side: r, text: "NIB GETS THIRTY MINUTES TO SEARCH OFF THE LINE."}
      - {who: minho, type: speech, side: r, text: "I'M THE LICENSED LEAD. I'M GOING WITH HIM."}
      - {who: haein, type: speech, side: l, text: "I'LL KEEP THE RELAY RUNNING."}
    notes: "Beat: Minho gives Nib 30 minutes off the line and comes too, as the licensed team. Gate kit as ch 16 (headlamp band round his white hard hat, the hooked survey pole). He never answers 'TAKE IT FROM MY DEPOSIT' in words; ch 17's invoice is his answer."

  - id: P18
    shape: tall
    gap: short
    bg: white
    camera: "low, from beside the relay case, looking up at Minho with Haein in the foreground"
    art: >
      Low from beside the relay case (guro_pit): in the near foreground Haein, both hands on the relay's dials, headphones pulled up over one ear.
      Above and beyond her, Minho keys the radio on his LEFT chest, the hooked pole on his shoulder, headlamp band on, looking toward the gate.
      The struts grid the pale sky behind him.
      Haein sits on the left, Minho stands on the right; give his pole and full figure room.
    calm: top-right
    lines:
      - {who: minho, type: speech, side: r, text: "NIB. WAIT AT THE WALL."}
      - {who: "offpanel:nib", type: phone, side: r, text: "THEN WALK FAST."}
    sfx:
      - {text: "KSSH", style: quiet, at: [0.50, 0.40], size: S, rot: 4}

  - id: P19
    shape: tall
    gap: short
    bg: white
    camera: "medium close-up, Sejin at her aid station"
    art: >
      At the aid station by the ramp foot (guro_pit), Sejin swings a trauma bag onto her back, pulls nitrile gloves on with a snap and fits a headlamp band round her white hard hat, deadpan, already walking. A water bottle clipped to the bag. Plain background.
      Sejin's full figure is on the right, walking toward the gate with space around her trauma bag.
    calm: left
    lines:
      - {who: sejin, type: speech, side: r, text: "AND THIS IS WHY I WANT A CLINIC."}
    notes: "Beat: Sejin follows. Her want (STORY_BIBLE §6): a clinic with predictable hours. Kit as ch 16."

  - id: P20
    shape: tall
    gap: long
    bg: white
    camera: "eye level at the threshold frame, Dami stepping out between Minho and Sejin"
    art: >
      At the threshold frame (guro_pit). Dami (dami, default: lime-yellow porter vest over a grey hoodie, scuffed white hard hat, cargo straps,
      worn gloves, an empty shoulder frame on her back) has walked over from the radio table and stops beside Minho (headlamp
      band, hooked pole) and Sejin (trauma bag), who are walking in. Her face turns from one to the other: wary, then afraid to hope. The cold
      rim lights the three of them; the white cable with blue bands runs through the frame's lower LEFT corner.
      Minho stands left, Dami centre, Sejin right. Show all three at natural full height.
    calm: top
    lines:
      - {who: dami, type: speech, side: c, text: "WHERE ARE YOU GOING?"}
      - {who: minho, type: speech, side: l, text: "TO GET KWAK."}
    notes: "Dami returned at ch 14 P42 (1:55 PM) and has stayed outside since. This is not another crossing."

  - id: P21
    shape: tall
    gap: short
    bg: white
    camera: "over Dokgo's shoulder toward the porters rising"
    art: >
      Over Dokgo's shoulder at his staging (guro_pit), the porter-app phone raised in his fist like a stopwatch (back of the case to us): he
      shouts at the porters, who rise from their plastic stools with groans and shoulder frames loaded with crates and battery packs. Two of
      them exchange a look. Dust kicked up; strut-shadow bars on the gravel; hard sun.
      Dokgo occupies the left foreground; give the porters' standing figures and their loads room on the right.
    calm: top
    lines:
      - {who: dokgo, type: shout, side: l, text: "DOUBLE RUNS! MY PORTERS MUST BE OUT BY THREE!"}
      - {who: dokgo, type: speech, side: l, text: "IF THE HANDOVER'S LATE, RYU PAYS THE PENALTY."}
    notes: "PAYOFF P08: the clause decides the boss's orders. He drives his porters harder so any lateness lands on Ryu Survey's crew, not his (he falsely reports EIGHT OF EIGHT at 3:00 PM in ch 16 P38; ch 17 fines him anyway)."

  - id: P22
    shape: tall
    gap: short
    bg: white
    camera: "tall, from behind Taeo's chair at the radio table, looking across the gravel to the gate"
    art: >
      Tall panel (guro_pit). In the low foreground: the back of Taeo's folding chair with his olive backpack hanging on it, the faded orange
      shield-and-open-door patch facing us; Taeo standing beside it, his back to us, the handset in his hand, the too-big hard hat. Across 8 m of
      gravel, Minho (headlamp band, hooked pole) and Sejin (trauma bag, headlamp) step through the black-violet slit inside the threshold frame,
      into a wedge of green-dusk light from inside; as each crosses, a small pale return mark (cold white, faint violet edge) lights on the
      inside of the right wrist. Just outside the frame, Dami's gloved hands are unbuckling her shoulder frame and it is dropping to the gravel.
      The cold white-cyan rim flares round their silhouettes; a few sharp particles at the rim only. Strut-shadow bars on the ground.
    calm: top
    lines:
      - {who: taeo, type: float, text: "I'M STILL THE ONE WHO STAYS OUTSIDE."}
    sfx:
      - {text: "VMMMM", style: gate, at: [0.70, 0.44], size: L, rot: 90}
    notes: "Return marks (STORY_BIBLE §5; colour as ch 13). Taeo stays outside (ch 12: 'YOU STAY OUTSIDE'). Motif: the team patch watches people go back for a porter."

  - id: P23
    shape: tall
    gap: short
    bg: white
    camera: "medium, eye level, Dami sitting down at the end of the radio table"
    art: >
      At the radio table (guro_pit). Dami drags an upturned crate to the end of the table beside Taeo's chair and sits on it hard, Kwak's navy canvas
      jacket pulled off the table into her lap, her arms folded over it. She stares across the gravel at Dokgo: chin up, eyes wet and furious,
      done obeying. Taeo, standing, looks down at her, startled. Haein at the relay glances over. Shade under the canopy.
      Dami sits on the left; Taeo stands to the right, Haein behind. Allow full height for Taeo.
    calm: top
    lines:
      - {who: dami, type: intense, side: l, text: "DOCK MY PAY, DOKGO. I'M STAYING HERE."}
    notes: "Dami refuses the double run: her day rate is ₩90,000 and she owes ₩2,100,000 on her draw loan (ch 13). Now the bottom of the chain says no, as Nib does. She stays on this crate into ch 16."

  - id: P24
    shape: inset-l
    gap: short
    bg: white
    silent: true
    camera: "close-up, Dokgo across the gravel"
    art: >
      Dokgo (guro_pit), across the gravel, meets Dami's stare. The phone in his chest pocket buzzes against the windbreaker (a pale glow through
      the fabric, no screen). He looks at her, then down at the porter-app phone in his hand, and turns his back: he cannot afford the time this
      fight would cost. The unlit cigarette. Plain dusty background.
    calm: none

  - id: P25
    shape: wide
    gap: short
    bg: white
    camera: "low two-shot at the end of the table, Dami on her crate, Taeo sitting back down"
    art: >
      At the radio table (guro_pit). Taeo lowers himself back into his chair; Dami, on her crate beside him with the navy canvas jacket in her lap,
      looks up at him hard, searching his face for the catch. She is small and fierce; he is tall, tired, a little embarrassed. He answers simply.
      The relay case's status lamps between them. Shade under the canopy.
      Dami sits left, Taeo right. Frame the two seated figures from the waist up.
    calm: top
    lines:
      - {who: dami, type: speech, side: l, text: "YOU DON'T EVEN KNOW KWAK."}
      - {who: taeo, type: speech, side: r, text: "SORRY. I KNOW NIB."}

  - id: P26
    shape: full
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag (2.5 heads tall; colours, outfits and props identical to the full models: the too-big white hard hat, the red-orange vest).
      Chibi Taeo sits bolt upright on his folding chair clutching the relay handset to his chest, waterfall tears pouring, sweat drops flying.
      Above his head floats a big rounded counter panel like a giant price display, empty and white (leave it blank: the letterer adds the
      figure). Beside him, a tiny chibi Dami on her crate stares at him with a flat deadpan face. Flat pale-blue background with screentone dots.
      Taeo sits on the right, Dami on the left, both fully visible beneath the counter.
    calm: left
    ui:
      - {kind: label, text: "₩4,916,667", at: [0.5, 0.2], size: 54, color: "#2B2523", rot: 0, notes: "centre it on the blank counter panel once the art exists"}
    lines:
      - {who: taeo, type: float, text: "EIGHTY-THREE THOUSAND WON A MINUTE."}
      - {who: taeo, type: float, text: "GRANDMA WILL KILL ME."}
    notes: "Runner: Taeo's on-screen won counter. ₩5,000,000 ÷ 60 = ₩83,333 a minute. Nothing is charged yet (the late-handover clause bites only after 16:00): he is pricing his own panic. The handset remains in his LEFT hand (as ch 14 and ch 16)."

  # ---------------- INSIDE ----------------
  - id: P27
    shape: full
    gap: long
    bg: black
    camera: "establishing, high angle along the terrace path"
    art: >
      Inside the Guro gate (guro_gate_inside): a vast terraced quarry of pale bone-grey stone under a saturated GREEN DUSK sky that fades to a
      yellow-green glow at the horizon; giant terrace steps descending into the distance, rectangular gallery mouths cut into the terrace walls,
      violet shadows; the whole scene leans about ten degrees down to the LEFT. Along a terrace path about 3 m wide runs Ryu Survey's white cable
      with a blue band every metre, beside orange-tipped steel stakes. Minho and Sejin jog along it, headlamps on, small, leaning into the slope.
      Further on, the two Ryu crew (extras.crew) at their tripod by a stake look up as they pass. Grey relay tripods carry the radios through the threshold; the crew keep the cable intact. Far ahead, where the terrace ends against a
      wall of enormous pale slabs, a tiny Nib waits. Drawn, not painted; no haze; no creatures.
    calm: top
    lines:
      - {who: narr, type: tag, text: "INSIDE THE GURO GATE · 2:19 PM"}

  - id: P28
    shape: strip
    gap: short
    bg: black
    silent: true
    camera: "low, close, at knee height beside the side-passage mouth at stake 14"
    art: >
      Low and close at stake 14 (guro_gate_inside): the black mouth of the side passage with its fan of fresh pale dust on the path, and, scratched
      into the stone beside it at knee height, a small pale three-line fork (Kett's mark). Minho's boots and Sejin's run past through the frame in
      a blur of motion lines; the orange tip of the stake at one edge. Green-dusk light, violet shadow.
    calm: none
    notes: "Motif: Kett's mark, scratched by Nib in ch 14 on a place he meant to come back to. Nobody comments on it."

  - id: P29
    shape: tall
    gap: short
    bg: black
    camera: "eye level at the rubble wall: Nib facing the camera, the two arriving from the left"
    art: >
      At the rubble wall (guro_gate_inside). Nib stands with his arms folded and his weight on one leg, deadpan, the radio hooked in his LEFT hand,
      as Minho and Sejin arrive from the left, breathing hard. Minho presses a button on the watch on his LEFT wrist (a plain face, no numbers).
      Behind Nib the enormous pale slabs rise out of frame, the dark crack at his face height; the green-dusk sky darkens toward violet at this end.
      Minho stands left, Sejin centre, Nib right. Give all three full figures clear space.
    calm: top
    lines:
      - {who: nib, type: speech, side: r, text: "TOOK YOU LONG ENOUGH."}
      - {who: minho, type: speech, side: l, text: "THIRTY MINUTES. FROM NOW."}
    sfx:
      - {text: "BEEP", style: quiet, at: [0.30, 0.62], size: S, rot: 0}
    notes: "Nib's line reuses his ch 7 line. Minho's window runs 2:24 to 2:54 PM."

  - id: P30
    shape: wide
    gap: short
    bg: black
    camera: "over Nib's right shoulder, looking at the crack and Minho"
    art: >
      Over Nib's right shoulder (spiky black hair and the long right ear in the near foreground) at the crack (guro_gate_inside): Minho fits the
      hooked head of his survey pole into the crack and looks down at Nib for direction. Nib's right arm reaches forward into the frame, pointing
      at one particular stone: a small, fist-sized wedge jammed low among the rubble packed into the crack. Green-dusk light, violet shadow in the
      seam between the giant slabs.
      Use a waist-up view: Nib's shoulder left, Minho right, with the wedge clearly visible between them.
    calm: top-right
    lines:
      - {who: minho, type: speech, side: r, text: "WHICH STONE DO I PULL?"}
      - {who: nib, type: speech, side: l, text: "THE FIST-SIZED WEDGE AT THE BOTTOM."}
    notes: "Minho asks first now (the lesson of ch 7). The arc in small: backing someone else's eyes."

  - id: P31
    shape: inset-l
    gap: short
    bg: black
    camera: "close-up, front, Minho"
    art: >
      A comedy face in NORMAL style (guro_gate_inside): Minho stares down at the tiny wedge, then at Nib: deadpan disbelief, one eye twitching, a
      single big sweat drop at the edge of his headlamp band. Plain green-tinted background.
      Minho's face fills the left third; Nib is off-panel to his right.
    calm: right
    lines:
      - {who: minho, type: speech, side: l, text: "THE TINY WEDGE?"}
      - {who: "offpanel:nib", type: speech, side: r, text: "THE TINY WEDGE."}

  - id: P32
    shape: tall
    gap: short
    bg: black
    camera: "medium, side-on and slightly low, the crack opening"
    art: >
      At the crack (guro_gate_inside). Minho has levered the little wedge out with the pole's hook, and all the rubble packed in the crack
      pours away inward in one neat rush, leaving a squeeze-gap a body wide between the two giant slabs, about a metre off the ground. Cold air
      gusts out: drawn drift lines of dust stream past them. Minho leans back with a blank comedy face (still normal style); Sejin raises a
      forearm against the dust; Nib, unimpressed, already has one foot up on the slab's lip. At the edge of the opened crack, embedded in the
      broken stone, a thumb-sized dark glassy shard: unremarked, just visible, not glowing.
      Minho stands left, Sejin centre, Nib right, all fully visible at the opening.
    calm: top
    sfx:
      - {text: "KRRSSHH", style: impact, at: [0.55, 0.60], size: L, rot: -6}
      - {text: "FWOOO", style: quiet, at: [0.28, 0.36], size: M, rot: -12}
    notes: "The dark shard at the crack's edge is the fragment Nib pockets in ch 16 (it glows cyan at Taeo's touch in ch 18): do NOT light it. The crack is the only way in; ch 16 finds it choked."

  - id: P33
    shape: tall
    gap: short
    bg: black
    camera: "full figure, side-on, Nib crouched in the mouth of the crack"
    art: >
      Nib crouches in the low black mouth of the opened crack (guro_gate_inside), his LEFT hand on its broken edge with the radio hooked in his
      fingers, looking back over his shoulder at the two humans who will have to squeeze. Deadpan. The gap is exactly his size. Pale slab, green
      light on his back, darkness ahead. Adult and wiry, never cute.
      Nib's crouched full figure fills the left third with clear space around his feet and hard hat.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "ME FIRST."}
      - {who: nib, type: speech, side: l, text: "I FIT."}
    notes: "Motif turned round: Nib goes first because he is better at it."

  - id: P34
    shape: full
    gap: long
    bg: black
    silent: true
    camera: "from inside the dark chamber, looking back at the bright crack"
    art: >
      Borderless vignette whose edges fade into the black page. Inside the collapsed side gallery (guro_side_gallery): a low chamber of fractured
      pale stone, nearly dark. Two thin, hard-edged bars of green-dusk light fall from fissures in the ceiling. Across the chamber the crack glows
      green with Nib's small silhouette coming through it. In the near foreground on the dusty floor lies a dented white porter's hard hat on its
      side, its small headlamp still on and flickering weakly. Violet-black shadow.
    calm: none
    notes: "Kwak's hard hat (ch 16: it lies beside him). Its lamp is dying."

  - id: P35
    shape: strip
    gap: short
    bg: black
    camera: "extreme close-up, Nib's left ear in profile"
    art: >
      In the gallery (guro_side_gallery). An extreme close-up of Nib's LEFT ear in profile, the V-notch clear in its top edge, swivelling toward a
      sound in the dark; the tip twitches. A thin edge of white headlamp light from behind (Minho has squeezed through) and one bar of green
      fissure light. Everything else dark.
    calm: none
    focus: [0.5, 0.45]
    sfx:
      - {text: "HHHK... HHHK...", style: quiet, at: [0.78, 0.50], size: S, rot: 0}
    notes: "The whistle Nib heard, now close: a wheeze."

  - id: P36
    shape: tall
    gap: short
    bg: black
    camera: "tall, high angle from Minho's headlamp, the light falling on Kwak"
    art: >
      Tall reveal (guro_side_gallery). Minho, stooping under the low ceiling, throws his headlamp's white cone onto Kwak Mansu (mansu, default:
      heavy-set, short grey hair, stubble, back brace over his work clothes, lime-yellow porter vest; no jacket), who half sits on the rubble
      near the middle of the chamber, propped on his elbows. A great pale slab lies tilted over his legs, its high edge on rubble and its low edge
      across both his shins, pinning them. His lips are grey, his face sweat-streaked and floured with dust; one hand claws at the front of his vest; his shoulders heave
      for air. He squints up into the light with a small, embarrassed attempt at a smile. Round him lie his split crate and three short
      telescopic steel shoring props (grey posts with base plates, head plates and threaded collars), and his dented hard hat. A bar of green
      fissure light crosses his chest. Nib is already crouched at his side. Dust hangs as a few flat drawn shapes, not haze.
      Kwak is centred below the slab, Nib crouches at his right, Minho is at the left edge.
    calm: top
    lines:
      - {who: mansu, type: whisper, side: c, text: "IT'S FINE."}
    notes: "Beat: Kwak pinned under a slab, wheezing. 'IT'S FINE' echoes his ch 13–14 line ('MY INHALER'S IN MY JACKET. IT'S FINE.'). The props are his porter load; ch 16 uses one (P44–P46 here)."

  - id: P37
    shape: wide
    gap: short
    bg: black
    camera: "low, close two-shot, Nib kneeling at Kwak's shoulder"
    art: >
      In the gallery (guro_side_gallery). Nib kneels at Kwak's shoulder and lays his RIGHT palm flat on Kwak's heaving chest, gently, feeling the
      breaths: unexpectedly kind with his hands while his face stays unchanged. Kwak looks down at the small green hand on his chest, then at Nib.
      Headlamp light from above right, hard-edged; a bar of green fissure light; violet-black shadow.
      Frame from the knees up: Kwak left, Nib right, both faces clearly visible.
    calm: top-left
    lines:
      - {who: nib, type: speech, side: r, text: "YOU SAID 'IT'S FINE' THIS MORNING."}
      - {who: mansu, type: whisper, side: l, text: "I SAY IT A LOT."}

  - id: P38
    shape: inset-r
    gap: short
    bg: black
    camera: "close, Sejin's fingers at Kwak's wrist, her face above"
    art: >
      In the gallery (guro_side_gallery). Sejin kneels at Kwak's side with two gloved fingers on the inside of his right wrist for a pulse; under
      them a small, faint, dormant return mark glows palely (cold white, faint violet edge). Her face above, lit by her own headlamp: flat,
      professional, grim.
      Sejin's face occupies the right third above Kwak's wrist.
    calm: left
    lines:
      - {who: sejin, type: speech, side: r, text: "KWAK'S RETURN MARK WORKS."}
      - {who: sejin, type: speech, side: r, text: "HIS LUNGS ARE STRUGGLING."}
    notes: "Ch 14 P20's warning that four o'clock is too long in the dust, made flesh. Marks do not heal or revive anyone."

  - id: P39
    shape: wide
    gap: short
    bg: black
    camera: "medium two-shot at floor level, Kwak left and Nib right"
    art: >
      In the gallery (guro_side_gallery). Kwak in left profile, his face visible: his big dusty hand closes round Nib's thin wrist, and Nib lets him. Kwak's eyes
      search Nib's face with the only question he has. Nib answers plainly, steady. Headlamp light, hard shadow.
      Nib's face is fully visible on the right. Frame both from the chest up.
    calm: top
    lines:
      - {who: mansu, type: whisper, side: l, text: "IS DAMI SAFE?"}
      - {who: nib, type: speech, side: r, text: "OUTSIDE. SAFE."}
    notes: "Nib does not mention the inhaler: Kwak learns where it came from in ch 16 P19 ('DAMI.')."

  - id: P40
    shape: full
    gap: long
    bg: white
    camera: "wide, eye level, the radio table outside"
    art: >
      BIG REACTION, outside at the radio table (guro_pit). As the relay speaks, Dami, on her crate, folds forward over Kwak's navy canvas jacket in her lap,
      both gloved hands over her mouth, eyes squeezed shut and streaming, her shoulders shaking. Taeo sags back in his folding chair with the
      handset (in his LEFT hand now) pressed to his forehead, eyes closed, the breath going out of him. Haein, one headphone cup to her ear, grins
      at the relay case. Behind them, porters with shoulder frames stop mid-step to listen. The gate's violet slit 8 m off. Strut-shadow bars.
      Dami left, Taeo centre, Haein right. Frame the foreground group from the waist up.
    calm: top
    lines:
      - {who: "offpanel:minho", type: phone, side: r, text: "WE'VE FOUND KWAK. HE'S ALIVE."}
      - {who: "offpanel:minho", type: phone, side: r, text: "KWAK'S LEGS ARE PINNED UNDER A SLAB. SEJIN'S TREATING HIM."}
    sfx:
      - {text: "KSSH", style: quiet, at: [0.62, 0.42], size: S, rot: 0}
    notes: "Minho says the porter's name on the air (ch 18: the news never does). About 2:30 PM."

  - id: P41
    shape: inset-l
    gap: short
    bg: white
    silent: true
    camera: "close-up, Dokgo at his staging"
    art: >
      Dokgo at his staging (guro_pit) has heard it too: for one second his whole face loosens with relief, eyes closing, the unlit cigarette
      trembling at his lip. Then the porter-app phone in his hand lights up against his palm (a plain pale glow, no screen content) and drags his
      eyes back down. Plain dusty background.
    calm: none
    notes: "Every antagonist believes he is being reasonable (STORY_BIBLE §4): he is glad Kwak is alive, and he is still counting."

  - id: P42
    shape: wide
    gap: long
    bg: black
    camera: "from behind Minho's shoulder toward the side wall of the chamber"
    art: >
      Back inside (guro_side_gallery). From behind Minho's shoulder (headlamp band, the beam swinging): he has turned toward a dry clicking from a
      black fissure low in the side wall. At the edge of the beam, one long, thin whip feeler slides out of the fissure and tastes the air; behind
      it, the edge of one slate-violet armour plate catches the light, then withdraws. Nothing else of the creature: no eyes, no mouth, no red.
    calm: top-left
    sfx:
      - {text: "TIK TIK TIK TIK", style: quiet, at: [0.72, 0.30], size: S, rot: -4}
    notes: "Beat: a scuttling thing moves in the dark. Match ch 16's scuttler (no eyes); it bursts from this fissure in ch 16 P16."

  - id: P43
    shape: tall
    gap: short
    bg: black
    camera: "low angle from the chamber floor by Kwak, looking up at Minho"
    art: >
      Low angle from the floor (guro_side_gallery): Minho, stooped under the low ceiling, plants himself between the fissure and the others with the
      telescoping survey pole levelled in both hands, its hooked head toward the hole, his headlamp's hard white cone fixed on it. Calm, scared,
      steady. Behind him, Sejin kneels at Kwak; Nib at the slab. Green fissure light, violet-black shadow.
      Minho stands hunched on the left, Sejin and Kwak centre, Nib right. Preserve natural proportions under the ceiling.
    calm: top-right
    lines:
      - {who: minho, type: speech, side: l, text: "SEJIN. TREAT KWAK."}
      - {who: minho, type: speech, side: l, text: "I'LL WATCH THE CREATURE'S FISSURE."}

  - id: P44
    shape: wide
    gap: short
    bg: black
    camera: "high angle, three-quarter, over the slab and Kwak"
    art: >
      In the gallery (guro_side_gallery). Nib's fingers have gone to the flap of his pouch (the small dinosaur sticker), but Sejin, eyes on the
      ceiling, points up: from a crack in the ceiling above the slab, a thin stream of grit is trickling down onto it. Nib sets his radio down on a
      flat rock beside the slab, its small status light lit, and reaches for one of Kwak's spilled props. Kwak follows the trickle with his eyes.
      Headlamp light, green fissure bars, violet-black shadow.
      Sejin kneels left, Kwak centre, Nib right. Frame from the knees up around the slab.
    calm: top
    lines:
      - {who: sejin, type: speech, side: l, text: "THE CEILING'S MOVING. GET KWAK OUT FIRST."}
      - {who: nib, type: speech, side: r, text: "I LIFT THE SLAB. YOU PULL KWAK."}
    notes: "Triage: the weight and the ceiling first, the inhaler after (ch 16 P19). The radio on the rock is where ch 16 P01 finds it, and where the slab crushes it in ch 16 P04."

  - id: P45
    shape: wide
    gap: short
    bg: black
    camera: "medium, eye level, from across the slab toward Nib and Sejin"
    art: >
      In the gallery (guro_side_gallery), seen from across the slab. Nib, kneeling at Kwak's hip, plants the base plate of a short telescopic steel
      prop on the loose pale grit beside Kwak's knees and fits its head plate under the slab's low edge, spinning the threaded collar by hand; his
      radio sits on the flat rock just right of the prop. Sejin kneels at Kwak's side with one fist bunched in his vest's shoulder strap, ready to
      pull. Kwak, propped on his elbows, grits his teeth. Headlamp light, a bar of green fissure light, violet-black shadow, pale grit.
      Sejin kneels left, Kwak centre, Nib right; use knees-up framing.
    calm: top
    lines:
      - {who: sejin, type: speech, side: l, text: "RAISE THE SLAB A HAND'S WIDTH. THEN WE PULL KWAK."}
    notes: "Staged for ch 16 P01–P03: Nib's hands on the prop, Sejin at Kwak's side with a fist in his vest strap, about to count. The prop's foot sits on loose grit: that is what slips in P47."

  - id: P46
    shape: full
    gap: short
    bg: black
    camera: "low angle under the slab's raised edge, dramatic"
    art: >
      In the gallery (guro_side_gallery). Nib, kneeling, both hands locked round the prop's shaft, has wrenched the collar round: every tendon in
      his thin arms stands out, teeth bared (the small lower fang on the left), sweat on his brow, amber eyes fierce. The slab's low edge has risen a
      finger's width off Kwak's shins; dust and grit pour off it in drawn streams. Sejin leans back on the vest strap; Kwak's face twists. In the
      background, Minho's back and his headlamp cone toward the fissure. Speed lines on the falling grit, hard shadows. Adult, wiry, straining:
      never cute.
      Sejin is left, Kwak centre, Nib right; Minho guards the fissure in the background.
    calm: top
    lines:
      - {who: sejin, type: speech, side: l, text: "HIGHER. KWAK'S LEGS ARE STILL PINNED."}
    sfx:
