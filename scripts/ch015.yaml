chapter: 15
title: Air Through a Wall
when: "Thursday in spring, the Guro pit job day (ch 12: 'THURSDAY'; chapters 13–17 are this one day). From about 1:59 PM, straight on from ch 14's hook, to about 2:31 PM. The general contractor's hourly call comes at 2:00 PM; Minho and Sejin cross at about 2:05 PM and reach the wall at 2:15 PM; Minho's thirty minutes run 2:15–2:45 PM. The clear team is booked to kill the boss at 4:00 PM."
story_beats: PART_ONE_BEATS.md#15
cast:
  taeo: outdoor     # navy zip jacket over the black hoodie, black cargo trousers, black sneakers with one white stripe. Backpack OFF, on an upturned crate by the radio table, patch facing out. Holds the base radio's handset in his LEFT hand; the link palm is his RIGHT (as in ch 7). He stays OUTSIDE the gate all chapter (ch 12: 'YOU STAY OUTSIDE')
  nib: default      # inside the gate all chapter. Barefoot; V-notch LEFT ear; small lower fang on the left; pouch RIGHT hip (Kwak's blue inhaler is in it, sent in by Taeo in ch 14); brown wooden sheath LEFT hip; the small yard radio in his LEFT hand, tucked into his rope belt from P40
  minho: default    # grey streak at the LEFT temple, radio clipped high on his LEFT chest, watch on his LEFT wrist. From P26: a white hard hat with a headlamp and a long steel pry bar
  sejin: default    # field medic: medic chest rig, cropped hair, tired eyes. From P27: medic bag on her back and a headlamp
  dami: default     # hi-vis porter vest over a hoodie, hard hat, worn gloves, cargo straps. From P29: an aluminium A-frame carrier (a modern jige) for her runs. From P31: Kwak's jacket knotted round her waist
  mansu: default    # Kwak Mansu, 58 (PART_ONE_BEATS ch 13): heavy-set, hi-vis porter vest over a grey thermal top, a back brace. No jacket (it is outside) and no hard hat (it fell). Seen from P43
  dokgo: default    # windbreaker, clipboard tablet under his LEFT arm, TWO phones (the call phone in his RIGHT hand, the porter-app phone in his LEFT), an unlit cigarette he never lights
extras:
  gc_director: "the general contractor's site director: a voice on Dokgo's call phone only, never seen in this chapter (his sedan arrives in ch 17)"
  porters: "Dokgo Contracting porters, men and women from their twenties to their sixties, in the same cheap hi-vis vests and hard hats as Dami, with aluminium A-frame carriers; tired, sunburnt, quiet"
  scuttler: "a gate creature, only ever seen in part in this chapter: dog-sized and low, many pale jointed legs, overlapping grey chitin plates like a giant woodlouse, two small red eye-glints. Minho fights it in ch 16"
locations: [guro_pit, guro_gate, guro_side_gallery]
location_notes:
  guro_pit: "No key yet; decided here (match ch 13–14 wherever they drew it first). A rectangular construction excavation in Guro-gu, about 12 m deep: walls of steel H-piles with timber lagging, braced across by horizontal steel struts; a gravel truck ramp down one side; an idle tower crane above; a parked excavator, bucket down; bundles of rebar on the floor. The gate stands upright on a gravel pad in the middle of the pit floor: a door-height black-violet slit with a cold white-cyan rim, inside a bolted steel scaffold frame (two uprights and a crossbar, sandbags on the feet), with a guide rope and a grey cable running into it. Ryu Survey's folding radio table (a chunky base radio with a coiled handset, a clipboard) stands 1.5 m from the frame's nearer upright, one step away. Sejin's blue medic tarp is behind the table. Dokgo's porter staging is beyond the frame: stacked plastic crates, a rack of adjustable steel shoring props, A-frame carriers, water bottles, porters sitting on crates. Beyond the rim: the backs of Guro office towers and apartment blocks, simplified, no readable signs."
  guro_gate: "No key yet; decided here (follow ch 13–14 if they fixed the interior, especially the sky colour). A sunken maze of roofless pale-grey stone galleries with broken arches overhead and violet shadows, under a flat, sunless sulphur-yellow sky. The survey line: white stakes with a reflective band and a small warm-white clip lamp, about every 20 m, from the threshold to the line's end. At a fork partway along, the porters' staging point (crates, props). The line ends at a rubble wall about 3 m high of fresh-broken blocks (clean sharp faces, no dust on top, unlike the dust-furred old stone around them) that fills the mouth of a roofed side gallery."
  guro_side_gallery: "Decided here. The roofed side gallery behind the rubble wall: a low stone tunnel about 2.2 m high and 3 m wide, partly collapsed, with fallen roof slabs and a dust-thick floor; total darkness except headlamps, which throw hard white cones. Kwak lies about 15 m in, half-propped against a rubble heap, a broken roof slab across his thighs. The dark goes on beyond him (the scuttler). The hole opened in P39 (about 1 m high, at the foot of the wall) is the only way back; ch 16 blocks it."
palette_notes: "Pit (outside): bright afternoon sun from the upper right, short hard shadows; dusty ochre earth, grey steel and concrete, warm brown shadows; hi-vis vests as on Dami's model sheet, dulled by dust; the gate's violet-black with its cold white-cyan rim is the strongest colour. Inside the gate: the flat sulphur-yellow sky lights the top planes of things; shadows violet. Side gallery: violet-black darkness and hard white headlamp cones; the scuttler's two red eye-glints (P49) are the only red inside the gate. Nib's link amber #F2A93B appears only in Taeo's RIGHT palm (P17, P54, P55) and in Nib's eyes. No operator-interface windows and no interface cyan anywhere: the interface stays dark until ch 19. Page background: black for the cold open, the inside-the-gate stretches and the last three panels; white outside."

panels:

  # ---------------- COLD OPEN ----------------
  - id: P01
    shape: strip
    gap: none
    bg: black
    silent: true
    camera: "extreme close-up, eye level, into a finger-wide gap between two stones"
    art: >
      Inside the Guro gate (guro_gate). An extreme close-up of a finger-wide gap between two freshly broken blocks of pale grey stone
      in a rubble wall. The broken faces are sharp and clean, with no dust on them; around the gap, the older stone is furred with grey dust.
      Out of the black gap a thin stream of grit and dust is being blown OUTWARD toward the camera, drawn as a few wavy drift lines,
      as if the wall were breathing out. Flat sulphur-yellow light from above on the top edges of the stones, deep violet shadow inside the gap.
      Nothing else in frame: no hands, no people, no glow, no decorative particles beyond the drifting grit itself.
    calm: none
    focus: [0.5, 0.5]
    notes: "Straight on from ch 14's hook: at the far end of the survey line, Nib feels cold air from a crack in a rubble wall. The moving dust is story-critical (the draught), not decoration."

  - id: P02
    shape: wide
    gap: short
    bg: black
    camera: "medium-wide, side-on and slightly low, Nib in profile at the rubble wall"
    art: >
      The far end of the survey line inside the Guro gate (guro_gate). On the right half of the frame, a three-metre heap of fallen
      pale-grey blocks fills the mouth of a roofed side gallery. Nib (nib, default: V-notch in the top of his LEFT ear, one small lower fang
      on the left, torn pinkish-tan wrap top, torn charcoal shorts, brown rope belt, leather pouch on the RIGHT hip, knife in a brown wooden
      sheath on the LEFT hip, barefoot) stands at its foot facing right, the small yard radio at his mouth in his LEFT hand with the button
      pressed, his RIGHT palm flat on a fresh-broken block, reading it. Acting: total focus, eyes narrowed, nostrils flared at the draught,
      the spiky hair at his temple lifted by the moving air. Beside him stands the last stake of the line: a white stake with a reflective
      band and a small clip lamp glowing warm white. Behind him, receding to the LEFT along the open gallery floor, the line of stakes and
      lamps runs back toward the far threshold. Above the roofless gallery: a flat, sunless sulphur-yellow sky. Pale stone, violet shadows.
      The fresh-broken blocks have clean sharp faces and no dust on their tops; the old stone around them is dusty: make the difference
      visible. Nib is a weathered adult soldier, never cute. No other people.
    calm: top-left
    lines:
      - {who: nib, type: speech, side: r, text: "SHARP EDGES. NO DUST ON TOP."}
      - {who: nib, type: speech, side: r, text: "THIS WALL FELL TODAY."}
    notes: "Nib's radio stays in his LEFT hand (his right is his knife hand), as in ch 7. Lock the wall for P35–P40: fresh-broken blocks closing the mouth of a roofed side gallery."

  - id: P03
    shape: inset-r
    gap: short
    bg: black
    camera: "medium close-up, three-quarter, Minho outside at the radio table"
    art: >
      Outside at Ryu Survey's folding radio table on the gravel of the Guro pit (guro_pit). Minho (minho, default: brown work jacket,
      grey T-shirt, grey streak at his LEFT temple, radio clipped high on his LEFT chest) keys his chest radio with one thumb and frowns down
      at a pencil survey sheet on his clipboard: a drawn line of small stake marks that ends in a hatched block. Acting: sceptical and tired,
      not unkind; a survey man who trusts his paper. Behind him, simplified: one steel upright of the threshold frame and the black-violet
      edge of the gate slit with its cold rim. Bright afternoon sun, warm brown shadows. Only lines and hatching on the sheet, no letters.
    calm: left
    lines:
      - {who: minho, type: speech, side: r, text: "MY SHEET SAYS THAT'S SOLID ROCK."}

  - id: P04
    shape: strip
    gap: short
    bg: black
    camera: "extreme close-up, front, Nib's face"
    art: >
      Back inside the gate. An extreme close-up strip of Nib's face from the brow to the chin, the edge of the radio at the corner of his mouth.
      Amber eyes (#F2A93B) level and flat; the small lower fang on the left just showing. Deadpan certainty, not anger. The draught lifts
      the spiky black hair across his brow. Sulphur-yellow light on the top planes of his face, violet shadow below. Plain dark background.
    calm: right
    focus: [0.45, 0.5]
    lines:
      - {who: nib, type: speech, side: l, text: "THEN YOUR SHEET IS OLD."}

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 15 · AIR THROUGH A WALL"

  # ---------------- THE CLOCK ----------------
  - id: P06
    shape: full
    gap: long
    bg: white
    camera: "establishing, high angle from the pit rim, looking down and across the pit floor"
    art: >
      The Guro construction pit (guro_pit) from its rim. A deep rectangular excavation: walls of steel H-piles with timber lagging, braced
      across by horizontal steel struts; a gravel truck ramp down one side; an idle tower crane above; an excavator parked with its bucket down;
      bundles of rebar abandoned on the floor. Centre-left on the gravel floor stands the gate: a door-height black-violet slit with a cold
      white-cyan rim, upright inside a bolted steel scaffold frame (two uprights and a crossbar, sandbags on the feet), with a guide rope and a
      grey cable running into it. Left of the frame: the folding radio table, with Taeo (taeo, outdoor) standing at it, small, his olive backpack
      on an upturned crate beside him; Minho next to him; a blue medic tarp behind with Sejin (sejin) kneeling at her bags; Dami (dami) at the
      end of the table. Right of the frame: the porter staging area, with stacked plastic crates, a rack of adjustable steel shoring props,
      aluminium A-frame carriers and porters (extras.porters) sitting on crates with water bottles. Lower right, apart from everyone: Dokgo
      (dokgo) with a ringing phone in his hand. Beyond the rim, the backs of Guro office towers and apartment blocks, simplified. Bright
      afternoon sun from the upper right, short hard shadows; dusty ochre earth, grey steel and concrete, warm brown shadows; the gate's
      violet is the strongest colour. No readable text or signs anywhere.
    calm: top
    lines:
      - {who: narr, type: tag, text: "GURO-GU · CONSTRUCTION PIT · 2:00 PM"}
    sfx:
      - {text: "BRRRR", style: phone, at: [0.82, 0.72], size: S, rot: -6}
    notes: "Locks the pit layout for ch 15–17: the radio table one step from the frame's nearer upright (Taeo reaches it in P16 and P55). Ch 16 has Taeo fold onto this gravel."

  - id: P07
    shape: wide
    gap: short
    bg: white
    camera: "medium, eye level, side view of Dokgo on the phone"
    art: >
      At the porter staging area (guro_pit). Dokgo (dokgo, default: windbreaker, clipboard tablet clamped under his LEFT arm, an unlit cigarette
      in the corner of his mouth) answers the call phone in his RIGHT hand with a quick reflex bow to nobody, heels together: a man who bows to
      his boss's voice. His face is grey with tiredness, eyes down on the gravel, polite and afraid. The porter-app phone hangs in his LEFT hand
      at his side, its screen turned against his leg. Behind him, porters on their crates watch without expression. Hard afternoon sun from
      the upper right, warm brown shadows, dusty ochre ground.
    calm: top-right
    lines:
      - {who: gc_director, type: phone, side: l, text: "TWO O'CLOCK, DOKGO. I'M COUNTING."}
      - {who: dokgo, type: speech, side: l, text: "YES, DIRECTOR. ON SCHEDULE. EVERY MINUTE."}
    notes: "The hourly call from the general contractor, counting minutes (set up in ch 13). It is the clock behind the penalty clause."

  - id: P08
    shape: narrow-r
    gap: short
    bg: white
    camera: "close on Dokgo's porter-app phone, held upright, straight on"
    art: >
      Dokgo's LEFT hand lifting his second phone upright in portrait, screen toward us. Screen: green (a flat, evenly lit #00FF00 area with
      crisp edges, taller than it is wide). A cheap rugged phone in a scuffed black case; a cracked, dirty thumbnail; a nicotine-stained
      fingertip. The edge of a crate and gravel behind, simplified.
    calm: none
    ui:
      - kind: phone.quickhaul_order
        on: screen
        header: "DOKGO CONTRACTING"
        destination: "GURO PIT · READY FOR CLEAR 4:00 PM"
        timer: "01:59:40"
        rating: "CLIENT PENALTY CLAUSE"
        penalty: "LATE −₩5,000,000 / HOUR OR PART"
        button: "LOG RUN"
        clock: "14:00"
        text: "GURO PIT · READY FOR CLEAR 4:00 PM · 01:59:40 · LATE −₩5,000,000 / HOUR OR PART"
    notes: "PAYOFF P08: the client contract's lateness penalty, on Dokgo's porter app (planted ch 13). The app uses the gig-app kit blank with its header field overridden; keep the green screen portrait so the letterer picks the kit blank. 'Or part': one minute late is charged as a whole hour."

  - id: P09
    shape: wide
    gap: short
    bg: white
    camera: "from beside the threshold frame, looking out over the radio table at the group"
    art: >
      At the radio table (guro_pit), seen from beside the gate: in the near foreground, one steel upright of the frame and a sliver of the
      black-violet slit with its cold rim, which throws cold violet-white light across the table. Taeo (taeo, outdoor) stands at the table holding
      the base radio's coiled handset in his LEFT hand, frozen, looking at nobody. Minho beside him taps the survey sheet with a pencil,
      reasonable and firm. Sejin (sejin, default: medic chest rig, cropped hair, tired eyes) kneels at the blue medic tarp behind them, listening,
      one hand on her bag. At the table's end Dami (dami, default: hi-vis porter vest over a hoodie, hard hat, worn gloves) leans on both fists,
      staring at the radio as if she could climb into it. On the table: the chunky base radio, the clipboard, and a folded, worn grey padded
      work jacket with a brown corduroy collar (Kwak's). Taeo's olive backpack sits on an upturned crate by the table. Afternoon sun behind them.
    calm: top
    lines:
      - {who: minho, type: speech, side: c, text: "IT'S A HAZARD. WE MARK IT FOR THE CLEAR TEAM."}
      - {who: dami, type: speech, side: r, text: "MANSU-AJEOSSI IS BEHIND IT."}
      - {who: minho, type: speech, side: c, text: "WE DON'T KNOW THAT."}
    notes: "Kwak's jacket: Dami brought it to Taeo in ch 14 for the inhaler, which went in to Nib with the next porter run. If ch 14 drew the jacket differently, match ch 14."

  - id: P10
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up, slight low angle, Dokgo leaning in"
    art: >
      Dokgo (guro_pit) leans into frame toward the table with the call phone pressed flat against his windbreaker to muffle it: the director
      is still on the line. He hisses: eyes wide and hard, a vein at his temple, the unlit cigarette bobbing. Not a villain: a man doing sums with
      his whole body. Plain dusty background.
    calm: right
    lines:
      - {who: dokgo, type: whisper, side: l, text: "NOBODY GOES PAST THAT WALL."}
    notes: "PAYOFF P08: the penalty clause decides the boss's order."

  - id: P11
    shape: wide
    gap: short
    bg: white
    camera: "medium, eye level, Dokgo facing the table, the porters behind him"
    art: >
      The call over, Dokgo (guro_pit) faces the table and holds up the porter-app phone like evidence, its screen turned toward himself (we see
      only the back of the case). He reasons with them, almost pleading: brows up, the other palm open. Behind him, porters on their crates eat
      kimbap out of foil and watch, tired. Taeo at the left edge in profile, the handset in his LEFT hand. Hard sun, short shadows.
    calm: top
    lines:
      - {who: dokgo, type: speech, side: r, text: "THE CLEAR TEAM KILLS IT AT FOUR."}
      - {who: dokgo, type: speech, side: r, text: "THE MARKS BRING EVERYONE OUT. EVERYONE."}
    notes: "Dokgo's ch 14 logic, restated. It sounds reasonable, if Kwak is fine."

  - id: P12
    shape: inset-r
    gap: short
    bg: white
    camera: "high angle, looking down at Sejin kneeling at her bag"
    art: >
      Sejin kneels at the blue tarp (guro_pit) and zips her medic bag shut with one hard pull, not looking up: cropped hair, tired eyes,
      mouth flat. Dry and certain. Only the tarp, the bag and gravel in frame.
    calm: left
    lines:
      - {who: sejin, type: speech, side: r, text: "A MARK BRINGS HIM OUT AT FOUR."}
      - {who: sejin, type: speech, side: r, text: "IT DOESN'T BRING HIM OUT BREATHING."}
    notes: "World rule (STORY_BIBLE §5): return marks bring their bearer out, and do not heal or revive anyone."

  - id: P13
    shape: wide
    gap: short
    bg: white
    camera: "low angle from the gravel, Dokgo foreshortened toward us"
    art: >
      Low angle (guro_pit): Dokgo rounds on Sejin and Taeo and flings his RIGHT arm back toward the porters on their crates and toward Dami at
      the table's end. His face is angry and ashamed at once, the unlit cigarette clamped hard in his teeth. Behind him, the rack of steel
      shoring props and the A-frames; above him, the pit's steel struts cross a pale sky. Hard shadows.
    calm: top-right
    lines:
      - {who: dokgo, type: speech, side: l, text: "WE'RE ALREADY TIGHT. IF WE'RE LATE, NOBODY HERE GETS PAID."}
      - {who: dokgo, type: speech, side: l, text: "NOT HER. NOT ANY OF THEM."}
    notes: "The clause would come out of the porters' ₩90,000 day rates (ch 13). Dokgo argues from his own squeeze and is partly right (STORY_BIBLE §4 rule 3). 'HER' is Dami."

  - id: P14
    shape: strip
    gap: long
    bg: white
    camera: "extreme close-up, Taeo's eyes"
    art: >
      An extreme close-up strip of Taeo's eyes and brow: wide, wet at the rims, fixed on the radio; a bead of sweat at the temple; the single
      small mole under his RIGHT eye at the lower edge. Fear and guilt. Cold violet light from the gate on one side of his face, warm daylight
      on the other. Nothing else in frame.
    calm: none
    lines:
      - {who: taeo, type: float, text: "I TOLD HIM TO FINISH THE LINE."}
      - {who: taeo, type: float, text: "HE FINISHED IT."}
    notes: "Ch 14: Taeo, scared, said 'FINISH THE LINE, NIB.' and Nib obeyed, angry."

  - id: P15
    shape: inset-l
    gap: short
    bg: white
    camera: "close, three-quarter from above, the base radio on the table"
    art: >
      The chunky base radio on the folding table (guro_pit), its speaker grille centred; one small signal light glows on its face (a plain dot).
      Taeo's RIGHT hand rests flat on the table beside it, very still; the coiled cord runs up out of frame to the handset in his other hand.
      The corner of Kwak's folded grey jacket at the edge of frame. Afternoon light, a hard shadow under the radio.
    calm: right
    lines:
      - {who: nib, type: phone, side: l, text: "TAEO."}
      - {who: nib, type: phone, side: l, text: "LET ME LOOK."}
    sfx:
      - {text: "KSSH", style: quiet, at: [0.30, 0.40], size: S, rot: -4}
    notes: "Nib asks rather than going on his own. Echo of ch 7's 'LET HIM FINISH LOOKING.'"

  - id: P16
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "close, side-on at the steel upright of the threshold frame"
    art: >
      At the threshold frame (guro_pit). Taeo's RIGHT hand, knuckles raised a centimetre from the steel upright, about to knock: the hand
      trembles, the knuckles white. Beside the upright, the black-violet edge of the gate slit and its cold rim. Hard shadows. Nothing else
      in frame.
    calm: none
    notes: "Motif: the knock (ch 10–11). Two knocks on the frame from outside mean 'come back'. He nearly calls Nib back."

  - id: P17
    shape: inset-r
    gap: short
    bg: white
    silent: true
    camera: "extreme close-up, top-down on Taeo's right palm"
    art: >
      The same RIGHT hand, turned palm up and opening, fingers half curled. In the centre of the palm a thin ring of amber light (#F2A93B)
      pulses under the skin: faint and steady, like a thumb pressing from the other side. Below, the gravel of the pit, simplified and
      dark-toned. No other glow anywhere in the panel.
    calm: none
    notes: "The amber pulse: inside, Nib has pressed his palm to the wall again and lets Taeo feel it (echo of ch 6's hook). The link crosses a threshold for seconds at a time (ch 13). It lands in the hand that was about to knock. The link palm is the RIGHT, as in ch 7."

  - id: P18
    shape: wide
    gap: short
    bg: white
    camera: "over Minho's left shoulder, toward Taeo"
    art: >
      Over Minho's left shoulder (his brown jacket fills the left foreground; the grey streak at his LEFT temple at the frame edge). Taeo has
      turned to face him, the handset lowered in his LEFT hand, his RIGHT hand closed into a fist around what he just felt. He speaks quietly:
      scared but steady, brows drawn together, mouth tight, eyes up to Minho's. Behind Taeo, the frame and the gate's violet edge (guro_pit).
    calm: top-right
    lines:
      - {who: taeo, type: speech, side: r, text: "YOU TOLD ME, AT THE YARD."}
      - {who: taeo, type: speech, side: r, text: "LET HIM FINISH LOOKING."}
    notes: "Callback to ch 7, where Minho told Taeo 'LET HIM FINISH LOOKING.' about Nib in the maze. Taeo backs Nib's judgement with Minho's own rule."

  - id: P19
    shape: inset-l
    gap: short
    bg: white
    silent: true
    camera: "close-up, front, Minho's face"
    art: >
      Minho, caught by his own words: jaw set, lips pressed thin, his eyes sliding from Taeo to the gate and back. A long breath held through
      the nose. The grey streak at his LEFT temple. The gate's cold violet-white light on one cheek; plain background.
    calm: none

  - id: P20
    shape: wide
    gap: short
    bg: white
    camera: "low angle from the gravel, Taeo at the radio table with the gate behind him"
    art: >
      Low angle (guro_pit): Taeo lifts the handset to his mouth in his LEFT hand and presses the button, decided while still afraid: brows
      together, eyes bright, knuckles white on the handset, his RIGHT fist still closed. Behind and above him rise the black-violet slit with
      its cold rim, the steel frame, and the pit's struts crossing the sky. A breath of air from the slit lifts the front of his hair.
    calm: top-left
    lines:
      - {who: taeo, type: speech, side: r, text: "GO."}
      - {who: taeo, type: speech, side: r, text: "I'LL PAY THE PENALTY."}
    notes: "Beat line ('GO. I'LL PAY THE PENALTY.'). Arc beat (STORY_BIBLE §6): he backs someone else's judgement at a cost. He speaks over the licence-holder's head; P21 checks him."

  - id: P21
    shape: wide
    gap: short
    bg: white
    camera: "over Taeo's shoulder toward Minho, the reverse of P18"
    art: >
      Over Taeo's shoulder (navy jacket and messy near-black hair in the left foreground): Minho has rounded on him, close, one hand flat on
      the clipboard against his chest, the other pointing at the gravel between them. Angry, and frightened for his family's business; not cruel.
      Behind Minho, Dokgo and the porters turn to look (guro_pit). Afternoon light.
    calm: top-right
    lines:
      - {who: minho, type: intense, side: r, text: "IT'S NOT YOUR PENALTY, IT'S MY CONTRACT."}
      - {who: minho, type: speech, side: r, text: "I'VE GOT TWO VANS LEFT, TAEO."}
    notes: "Beat line. Ryu Survey had three vans in ch 7 and Bluebird towed one in ch 12; the second goes in ch 23, the last in ch 28."

  - id: P22
    shape: strip
    gap: short
    bg: white
    camera: "close-up, front, Taeo's face"
    art: >
      A close strip of Taeo's face, front-on: pale, sweating, apologetic and immovable at the same time; the rare stubbornness under the
      politeness. The small mole under his RIGHT eye. The gate's cold light on his left cheek, daylight on his right. Plain background.
    calm: none
    lines:
      - {who: taeo, type: speech, side: c, text: "THEN TAKE IT FROM MY DEPOSIT."}
      - {who: taeo, type: float, text: "IT'S THE ONLY MONEY I'VE NEVER SENT HOME."}
    notes: "Beat line. His flat's ₩5,000,000 rental deposit (world/LOCATIONS.md, taeo_flat: ₩450,000 a month on a ₩5,000,000 deposit). Sets up ch 17 (₩3,400,000 signed away) and ch 21 (balance ₩1,600,000)."

  - id: P23
    shape: full
    gap: short
    bg: white
    camera: "wide, eye level, from the medic tarp's side: the whole group turning to Taeo"
    art: >
      BIG REACTION at the radio table (guro_pit). Everyone at the threshold turns to Taeo at once: Minho with his eyes wide and his mouth open;
      Sejin half-risen from her tarp; Dami frozen with both hands lifting off the table; Dokgo's unlit cigarette falling from his open mouth,
