chapter: 12
title: Three Beams
when: "The night after ch 11's survey, then the following day. 2:46 AM in the flat; 9:15 AM at the yard fence; the training gate from 10:40 to about 11:40 AM; the Bluebird tow at 2:40 PM; Minho's news at 6:40 PM in low sun. The weekday is not lettered: the Guro job is 'THURSDAY', later this week."
story_beats: PART_ONE_BEATS.md#12
cast:
  taeo: outdoor        # P02: default (black hoodie, in bed). P06 onward: outdoor (navy zip jacket over the black hoodie, black cargo trousers, black low sneakers with one white stripe, olive backpack with the faded orange shield-and-door patch). From P36: blood from his LEFT nostril; from P45: a paper napkin, then a twist of it in his LEFT nostril, dried blood on his upper lip
  nib: default         # barefoot; V-notch LEFT ear; lower fang LEFT; brown rope belt; leather pouch RIGHT hip (Haru's small dinosaur sticker on its flap, ch 8; Eunchae's carved pencil inside, ch 5); brown wooden sheath LEFT hip. No binoculars yet (ch 19)
  haein: default       # work overalls, tool belt, clear safety glasses pushed up on her head; today also a stub of white chalk, a plain black stopwatch and a clipboard
  minho: default       # grey streak at the LEFT temple; radio clipped high on his LEFT chest; watch on his LEFT wrist
  park_doyun: default  # on video only (P01, voice in P04): about 30, tailored dark coat, slim map-case. First appearance; no nameplate (see P01 notes)
extras:
  audience: "lecture-hall audience in the video only: rows of dark silhouetted heads and shoulders seen from behind, no faces"
  doyun_constructs: "Park Doyun's seven constructs (first seen here; ch 48–49 use them again): seven identical slender, faceless constructs about 175 cm tall, smooth pale-grey bodies with fine dark joint lines, finer and more elegant than the common wooden mannequins; each carries a slim surveyor's ranging pole banded dark blue and white"
  crew_man: "the stocky Ryu Survey crew man from ch 7: forties, stubble, a red-orange safety vest over work clothes, hard hat clipped to his belt; good-natured and exasperated"
  mule: "the Ryu crew's construct mule from ch 10 (match ch 10's design if it has one; otherwise a squat four-legged wooden pack construct about 1.2 m at the shoulder with a featureless block head, a canvas harness and panniers); slow, literal, nonverbal"
  snail: "the training gate's boss: a pale lavender-grey snail the size of a loaf of bread, with a translucent pearly spiral shell and two slow eye stalks; harmless, eats lichen off the stone; never threatening, never glowing"
  repo_man: "Bluebird Capital tow-crew lead: forties, a bright-blue windbreaker with a small white bird silhouette on the chest (no letters), a lanyard, a rugged tablet in a blue case; polite, tired, doing his job; NOT a thug"
  repo_driver: "the tow driver: twenties, the same bright-blue windbreaker, work gloves; works the winch and never looks at anyone"
locations: [taeo_flat, doyun_lecture, ryu_yard_street, ryu_yard, ryu_training_gate, ryu_training_gate_inside]
location_notes:
  taeo_flat: "LOCATIONS.md entry. Night look: the desk lamp on at its lowest (warm orange on the desk side, deep blue-grey elsewhere), the curtain closed. Nib sleeps sitting by the door with a blanket over his head, as in ch 6 P01."
  doyun_lecture: "video only, no key: a dark lecture hall with a low stage, one cool white overhead spot and a large projection screen behind (a plain grid of pale lines and one circle; no letters or numbers)"
  ryu_yard_street: "as ch 7 (no key yet): the pavement outside the yard fence: chain-link with orange safety mesh, a plane tree, parked scooters, low buildings, overhead wires. The yard's pedestrian gate is a chain-link door in the fence."
  ryu_yard: "LOCATIONS.md id (Taeo's flat to the yard: 12 minutes' walk). The same lot ch 7 drew as ryu_practice_yard (LOCATION_BRIEF key): use that key image until ryu_yard has its own. Packed dusty-ochre dirt; the plywood maze in the middle; the scaffold observation platform; the white site-office container on the LEFT as seen from the pedestrian gate, with a short metal wheelchair ramp to its door (decided here; Minho's father uses a wheelchair, ch 10); Haein's equipment bench with the radio charging rack and a stack of pallets; three white vans along the far fence with plain shield logos, the MIDDLE one carrying ch 7's bright blue Bluebird sticker and red seizure strip; the sliding vehicle gate in the far fence; the training-gate cage in the back RIGHT corner (decided here)."
  ryu_training_gate: "decided here. In the yard's back right corner, a 3 × 3 m chain-link cage with a padlocked mesh door. Inside it, near the back fence and facing the door, the training gate: a squat black-violet slit about 1.3 m tall and 40 cm wide, hanging a few centimetres above the dirt, with a cold white-cyan rim and a thin green light (the sky inside) leaking from its edges. Nib-sized: an adult must crouch to use it. It stays open because nobody kills its boss (the snail); killing a boss closes its gate. Ryu Survey holds a GMA training licence for it and rents it to an academy by the hour. For this chapter: two upturned blue plastic crates just inside the cage door, about 2.5 m from the slit, and a white chalk line scraped across the dirt 2 m from the slit (P20)."
  ryu_training_gate_inside: "decided here. A stone hollow about 4 m across, like the bottom of a dry well, open to a GREEN DUSK sky with no sun (the wrong colour, saturated); grey stone walls streaked with pale lichen; violet shadows; the way out is a thin slit of cold rim light in one wall. Haein's rig against the far wall: a stout scaffold plank about 2 m long loaded with three grey sandbags, held up at about 1.2 m by THREE IDENTICAL pale timber beams standing upright in a row, each on a small steel foot block with a steel pin through it; chalk tally strokes near the top of each beam (one, two and three strokes, left to right; strokes only). The snail lives on the floor by the right end of the rig."
palette_notes: "Flat at night (A4): the desk lamp low, warm orange on the desk side, deep blue-grey elsewhere, the phone's cold white glow on Taeo's face. Lecture video: slate-blue dark, one cool white spot, pale-grey constructs; the dark-blue-and-white pole bands are the only accent. Yard (A4 survey yard): dusty ochre ground, warm brown shadows, sky-blue sky, red-orange safety vests (never the link amber). Training-gate cage: ochre and chain-link grey; the gate's violet-black core, cold white-cyan rim and a thin green spill on the dirt. Inside the gate: green dusk sky, grey stone, violet shadows, pale timber; no red. Tow: Bluebird's bright blue is the accent. Dusk (P54–P61): low golden-orange sun and long brown shadows; the gate's rim is the only cold colour. Amber #F2A93B appears only in Taeo's palm (P24, P26, P28, P35, P38) and in Nib's eyes. Red appears only as Taeo's nosebleed (P36 onward) and the van's seizure strip. No operator-interface windows: the interface stays dark until ch 19."

panels:

  # ---------------- COLD OPEN: the same night ----------------
  - id: P01
    shape: full
    gap: none
    bg: black
    camera: "the panel IS the lecture video: a wide shot of the stage from the middle rows of the hall"
    art: >
      The frame of a recorded public lecture (doyun_lecture), drawn full panel with no player chrome.
      Foreground: the backs of a few rows of audience heads and shoulders in silhouette (extras.audience).
      On a low stage under one cool white overhead spot, Park Doyun (park_doyun, default: about 30, a tailored dark charcoal coat,
      a slim map-case at his hip) stands at the left edge of the stage, perfectly still, one hand raised at shoulder height with two
      fingers extended. His face is calm and exact: a man who wastes nothing, expressions included.
      Centre stage, his seven constructs (extras.doyun_constructs) have just planted their banded ranging poles at the same instant,
      in a perfect hexagon with one construct at its centre: seven identical poses, like one figure drawn seven times.
      Behind them a big projection screen shows a plain grid of thin pale lines and one circle (no letters, no numbers).
      Palette: slate-blue dark, cool white spot, pale-grey constructs; the dark-blue-and-white bands of the poles are the only accent.
      Hard cel shadows pooled under each construct. No haze, no lens flare, no glow.
    calm: top
    lines:
      - {who: park_doyun, type: phone, side: l, text: "A CONSTRUCT FEELS NOTHING. FEARS NOTHING."}
      - {who: park_doyun, type: phone, side: l, text: "SEND ONE IN, AND NO ONE ELSE HAS TO GO."}
    sfx:
      - {text: "TAK", style: impact, at: [0.60, 0.70], size: M, rot: 0}
    notes: "Park Doyun's first appearance, on video only. No intro nameplate: his name rides on the lecture card in P04; keep the nameplate for his entrance in person (ch 48 hook: 'the man in Taeo's training videos'). Seven constructs, as in ch 49. Phone bubbles because we hear him through Taeo's phone (revealed in P02). His case is reasonable and partly right (STORY_BIBLE §4 rule 3): constructs can take risks so people don't have to."

  - id: P02
    shape: wide
    gap: short
    bg: black
    camera: "low, at mattress level, across the pillow toward Taeo's face"
    art: >
      Taeo's studio flat (taeo_flat key), the bed against the window wall, 2:46 AM. Taeo (taeo, default: black hoodie, hood down) lies on
      his side under the grey duvet, one arm crooked under the pillow, holding his phone close to his face with the other hand.
      The SCREEN FACES HIM, away from us: we see the back of the phone (dark grey, clear case, the small green dinosaur sticker).
      Its cold white light falls hard on his face: eyes wide open and red-rimmed, lower lids heavy, jaw set. Exhausted and unable to stop.
      The desk lamp at the bed end is on at its lowest: warm orange on that side of the frame, deep blue-grey everywhere else.
      The grey-blue curtain behind his head is closed. Hard-edged shadow shapes; no glow haze.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "2:46 AM"}
      - {who: taeo, type: float, text: "IN THE TUNNEL, I COULDN'T FEEL HIM. NOT ONCE."}
    notes: "The same night as ch 11's hook (the late news about the Dokgo porter). No green screen: the screen faces away."

  - id: P03
    shape: narrow-r
    gap: short
    bg: black
    camera: "from the bed, looking down the dark room to the door"
    art: >
      The far end of the flat by the door, deep blue-grey; the lamp's warm light dies a metre short of it. Nib (nib, default: V-notch in
      the LEFT ear, brown rope belt, pouch on the RIGHT hip, brown wooden sheath on the LEFT hip, barefoot) sits on the floor with his back
      to the wall by the door, a blanket over his shoulders and head like a hood, knees up, as in ch 6. One amber eye is open and turned
      toward the light across the room: flat, deadpan, a soldier woken for nothing. Adult and weathered, never cute.
      The door's lever handle and the grey shoe cabinet as dark simple shapes.
    calm: none
    lines:
      - {who: nib, type: speech, side: r, text: "TURN OFF THE SHOUTING BRICK."}
      - {who: "offpanel:taeo", type: whisper, side: l, text: "SORRY. ONE MORE."}
    notes: "Runner: Nib calls Taeo's phone 'the shouting brick'. His sleeping place by the door follows ch 6 P01."

  - id: P04
    shape: inset-l
    gap: short
    bg: black
    camera: "Taeo's point of view over his own hand (kit hand)"
    art: "KIT HAND"
    focus: [0.5, 0.45]
    calm: none
    ui:
      - {kind: phone.info_card, on: screen, hand: taeo_pov_ots, title: "AAO OPEN LECTURES", text: "THE CARTOGRAPHER'S BASICS: ATTENTION AND CONTROL · Lecture 9 of 12 · Park Doyun, S-rank summoner · Now playing: audience questions"}
    lines:
      - {who: park_doyun, type: phone, side: l, text: "IF IT SEEMS TO WANT SOMETHING, ASK WHAT **YOU** WANT."}
      - {who: "offpanel:nib", type: speech, side: r, text: "I WANT SLEEP."}
    notes: "Kit art taeo_pov_ots: Taeo's hand holding his phone in a dark bedroom with a lamp. The series title is the beats' title. 'AAO Open Lectures', the public library that hosts it, is decided here. Doyun is answering an audience question: he believes a construct that seems to want things is a mirror (he holds this view until ch 89)."

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 12 · THREE BEAMS"

  # ---------------- STUDY: the next morning ----------------
  - id: P06
    shape: full
    gap: long
    bg: white
    camera: "establishing, eye level along the pavement, the pair walking toward us"
    art: >
      The pavement outside the Ryu Survey yard (ryu_yard_street): chain-link fence with orange safety mesh on the right, a plane tree in new
      spring leaf, a row of parked scooters, low buildings and tangled overhead wires; over the fence, the tops of the yard's plywood screens
      and the roof of a white van. Morning sun from the left; crisp hard shadows.
      Nib (nib, default) walks on the LEFT at his even scout's pace, looking up at Taeo with a question.
      Taeo (taeo, outdoor: navy zip jacket over the black hoodie, black cargo trousers, black low sneakers with one white stripe, the olive
      backpack with the faded orange shield-and-door patch) walks on the RIGHT with dark circles under his eyes and one earbud in, looking
      down at his phone (screen turned toward him, not visible).
      Palette: muted daylight greys, blue-grey asphalt, the orange mesh, sky-blue sky.
    calm: top
    lines:
      - {who: narr, type: tag, text: "9:15 AM"}
      - {who: nib, type: speech, side: l, text: "THE PORTER ON THE NEWS. DID THEY FIND HIM?"}
      - {who: taeo, type: speech, side: r, text: "NO UPDATE. THE COMPANY SAYS HE LEFT 'VOLUNTARILY'."}
    notes: "ch 11's hook: 'Porter missing after Dokgo Contracting job in Guro; company says he left the site voluntarily.' Taeo has not slept."

  - id: P07
    shape: inset-l
    gap: short
    bg: white
    camera: "low, at Nib's eye level, looking up past him at Taeo"
    art: >
      Nib in the left foreground, head tilted, working through a new word with total seriousness. Behind and above him, Taeo has lowered the
      phone, caught by the question. Fence and orange mesh simplified behind them; a strip of sky.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "WHAT'S 'VOLUNTARILY'?"}
      - {who: taeo, type: speech, side: r, text: "ON HIS OWN."}
      - {who: nib, type: speech, side: l, text: "THEN SOMEBODY SAW HIM GO. WHO?"}

  - id: P08
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up, side-on: Taeo's eyes over the top edge of his phone"
    art: >
      Taeo's tired eyes and brow over the top edge of his phone: he scrolls, and there is nothing to find. The look sinks.
      Flat pale background; one hard shadow under the brow.
    calm: left
    lines:
      - {who: taeo, type: speech, side: r, text: "...IT DOESN'T SAY."}
      - {who: "offpanel:nib", type: speech, side: l, text: "THEN NOBODY SAW."}
    notes: "Nib's watchman logic: if he walked off, someone watched him go. Arc II issue: porters erased."

  - id: P09
    shape: wide
    gap: short
    bg: white
    camera: "from inside the yard, looking out through the pedestrian gate as they come in"
    art: >
      The yard's pedestrian gate, a chain-link door in the fence. Taeo holds it open with one hand and Nib walks through first.
      Nib, passing, delivers his piece without looking up: matter-of-fact. Taeo stops with his hand still on the gate, struck.
      Ochre dirt begins at their feet; the street behind them in morning sun.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "IN THERE, I PRESSED THE WALL. LIKE AT YOUR STORE."}
      - {who: taeo, type: speech, side: r, text: "...I DIDN'T FEEL ANYTHING."}
      - {who: nib, type: speech, side: l, text: "THEN FIND OUT."}
    notes: "'In there': inside the ch 10–11 tunnel gate. 'Like at your store': ch 6's hook, when Nib pressed his palm to the Hanbit Mart break-room wall and Taeo felt it in the stockroom. 'THEN FIND OUT.' is Nib's ch 2 line. Motif: Taeo holds the door and Nib goes first. Point none of this out."

  - id: P10
    shape: full
    gap: long
    bg: white
    camera: "establishing, high angle from the scaffold observation platform over the yard"
    art: >
      The Ryu Survey yard (ryu_yard; the lot ch 7 drew as ryu_practice_yard): packed dusty-ochre dirt; the plywood maze of movable screens
      in the middle; the white site-office container on the left with a short metal wheelchair ramp up to its door; Haein's equipment bench
      with the radio charging rack and a stack of pallets; along the far fence, three white vans with plain shield logos (no letters), the
      MIDDLE one still carrying the bright blue Bluebird sticker across its side door and the red paper seizure strip from ch 7.
      In the back right corner, small in this shot: a chain-link cage with something low inside it glowing faintly violet and green.
      Middle ground: the crew's construct mule (extras.mule) walks steadily, stupidly, into a plywood screen, again and again, while the crew
      man (extras.crew_man) hauls on its harness. Taeo and Nib come in at the lower edge.
      Sun from the upper left; dusty ochre, warm brown shadows, sky-blue sky, the red-orange vest. No readable signs anywhere.
    calm: top-right
    sfx:
      - {text: "BONK", style: comic, at: [0.56, 0.52], size: S, rot: -6}
      - {text: "BONK", style: comic, at: [0.62, 0.58], size: S, rot: 8}
    notes: "Locks for this chapter: the training-gate cage in the back right corner; the stickered van is the MIDDLE of three. The ramp is for Minho's father (ch 10); he is not shown."

  - id: P11
    shape: wide
    gap: short
    bg: white
    camera: "medium, side-on, at the mule's shoulder height"
    art: >
      The crew man (extras.crew_man) hauls on the mule's harness with both hands, red-faced and exasperated, while the mule (extras.mule)
      leans its block head against a plywood screen and keeps walking on the spot, legs scrabbling in the dust.
      Taeo, beside them, raises one finger politely, apologising before he has said anything; his earbud is still in.
      Nib watches the mule from a step back with a professional's disdain. Hard sun, ochre dirt, plywood grain.
    calm: top
    lines:
      - {who: crew_man, type: shout, side: l, text: "I SAID 'GO AROUND AND STOP'!"}
      - {who: taeo, type: speech, side: r, text: "SORRY, UM. ONE WORD AT A TIME. JUST 'STOP.'"}
      - {who: crew_man, type: speech, side: l, text: "...STOP."}
    sfx:
      - {text: "SKRITCH SKRITCH", style: comic, at: [0.24, 0.84], size: S, rot: 0}
    notes: "Beats: Doyun's lectures help with constructs. One verb at a time."

  - id: P12
    shape: wide
    gap: short
    bg: white
    camera: "over Haein's shoulder at her bench, toward Taeo"
    art: >
      Haein (haein, default: work overalls, tool belt, clear safety glasses pushed up on her head) sits at her equipment bench in the right
      foreground with a soldering iron in one hand and a radio board in the other, looking up at Taeo with flat amusement.
      Across the bench on the left, Taeo rubs one eye with the heel of his hand, the earbud out now and dangling. Nib, at bench height, eyes
      the dish of tiny screws. In the background the mule stands frozen exactly where it stopped, its head an inch from the screen, the crew
      man blinking at it. Sun, ochre, warm brown shadows.
    calm: top
    lines:
      - {who: haein, type: speech, side: r, text: "YOU'VE BEEN WATCHING PARK DOYUN."}
      - {who: taeo, type: speech, side: l, text: "ALL TWELVE LECTURES."}
      - {who: haein, type: speech, side: r, text: "IT SHOWS. YOU LOOK TERRIBLE."}

  - id: P13
    shape: inset-r
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag. Chibi Taeo (navy jacket, olive backpack with the orange patch) strikes Park Doyun's pose at chibi Nib: one hand raised, two
      fingers extended, eyes squeezed into intense concentration lines, little sparkles fizzing at his fingertips.
      Chibi Nib (dot eyes, flat line mouth; V-notch LEFT ear, brown rope belt, pouch RIGHT hip, brown wooden sheath LEFT hip, barefoot)
      stands with his arms folded, completely unaffected: one big flat stare. Flat pale ochre background with screentone dots.
    calm: left
    lines:
      - {who: taeo, type: speech, side: l, text: "LECTURE FOUR. 'HOLD YOUR CONSTRUCT IN ONE POINT OF ATTENTION.'"}
      - {who: nib, type: speech, side: r, text: "I'M NOT IN LECTURE FOUR."}
    notes: "Beats: the lectures explain nothing about Nib. 'One point' returns in P26, where it helps Taeo's half of the link."

  - id: P14
    shape: wide
    gap: short
    bg: white
    camera: "eye level across the bench, two-shot: Taeo left, Haein right"
    art: >
      Normal style. Taeo, serious now, leans both hands on the bench toward Haein, voice low. She has set the soldering iron in its stand and
      listens properly, eyes narrowing with interest. Nib, at the bench's end, looks up at Taeo.
      Simplified background: the radio rack and a strip of sky-blue.
    calm: top
    lines:
      - {who: taeo, type: speech, side: l, text: "IN THE TUNNEL, IT WENT DARK AT THE THRESHOLD."}
      - {who: haein, type: speech, side: r, text: "DARK HOW? ALL AT ONCE, OR FADING?"}
      - {who: taeo, type: speech, side: l, text: "...I WAS TOO SCARED TO NOTICE."}
    notes: "ch 10's hook: the amber pulse went dark at the threshold. Haein sat with him at the radio table in ch 11."

  - id: P15
    shape: strip
    gap: short
    bg: white
    camera: "close-up on Haein, slightly low"
    art: >
      Haein pushes her safety glasses down onto her nose with one finger: a slow, delighted, faintly alarming engineer's grin.
      One crisp highlight on the lenses. Plain sky-blue behind.
    calm: left
    lines:
      - {who: haein, type: speech, side: c, text: "THEN WE MEASURE IT."}

  - id: P16
    shape: wide
    gap: short
    bg: white
    camera: "low angle from bench height, looking up at Minho as he arrives"
    art: >
      Minho (minho, default: brown work jacket, grey T-shirt, olive cargo trousers with black knee pads, brown work boots; the grey streak at
      his LEFT temple; radio clipped high on his LEFT chest; watch on his LEFT wrist) strides over from the container with his phone at his
      ear, finishing a call he hated: jaw hard, eyes on the ground. At the frame edges Taeo (left) and Haein (right) turn toward him from the
      bench; Nib is already watching him. Sky-blue sky behind; hard sun on one shoulder.
    calm: top
    lines:
      - {who: minho, type: speech, side: c, text: "NO. NOT A C-GRADE AT THAT RATE. NO."}
      - {who: haein, type: speech, side: r, text: "WE NEED THE TRAINING GATE."}
    sfx:
      - {text: "BIP", style: phone, at: [0.60, 0.18], size: S, rot: 0}
    notes: "Plants the job Minho takes after the tow (P54: 'THAT WAS THIS MORNING'). Do not name Guro here."

  - id: P17
    shape: inset-r
    gap: short
    bg: white
    camera: "medium close-up on Minho, three-quarter"
    art: >
      Minho lowers the phone and looks from Haein to Taeo to Nib: a short, tired calculation, then a decision. The grey streak at his LEFT
      temple catches the sun. Simple background.
    calm: left
    lines:
      - {who: minho, type: speech, side: r, text: "A RADIO TELLS ME WHERE MY SCOUT IS."}
      - {who: minho, type: speech, side: r, text: "NOT THAT THE PROP HE'S HOLDING IS SLIPPING."}
      - {who: minho, type: speech, side: r, text: "ONE HOUR. THE ACADEMY PAYS FOR IT BY THE HOUR."}
    notes: "Why Minho cares (v3 power ladder, 10–20: radios report positions but cannot say a support is about to slip). Sets up ch 15. Lending the gate costs him rental income; nobody else uses the cage today, so the chalk line and Taeo's footprints are still there at dusk (P60)."

  # ---------------- THE TRAINING GATE ----------------
  - id: P18
    shape: full
    gap: long
    bg: white
    camera: "establishing, eye level outside the cage, the slit small in the centre"
    art: >
      The yard's back right corner (ryu_training_gate). Inside a 3 × 3 m chain-link cage stands the training gate: a squat black-violet slit only
      about 1.3 m tall and 40 cm wide, hanging a few centimetres above the dirt, with a cold white-cyan rim; a thin green light leaks from its
      edges onto the ground. It is Nib-sized: an adult would have to crouch.
      Haein has just swung the mesh door open, the padlock hanging open on its hasp and her keys on a carabiner. Nib has already walked in and
      stands squarely in front of the slit at full height, its top a hand's width above his head, looking the gate up and down like a man
      trying on a coat. Taeo stays in the cage doorway, uneasy, shoulders up. Minho behind him with folded arms. Two blue plastic crates
      stacked by the cage door.
      Ochre dirt and chain-link grey; the gate's violet, its cold rim and the green spill are the only saturated colours. No signs.
    calm: top
    lines:
      - {who: narr, type: tag, text: "10:40 AM"}
      - {who: haein, type: speech, side: l, text: "THE SMALLEST GATE IN MAPO. TRAINING LICENCE."}
      - {who: nib, type: speech, side: r, text: "IT'S A GOOD SIZE."}
    sfx:
      - {text: "VMMMM", style: gate, at: [0.53, 0.40], size: M, rot: 90}
    notes: "New place, decided here (see location_notes). Haein built the rig inside during the past hour."

  - id: P19
    shape: wide
    gap: short
    bg: white
    camera: "over Minho's shoulder toward Taeo, the cage door open"
    art: >
      Minho, in the left foreground with his back three-quarters to us, holds up one finger: the rule. Taeo, centre, blinks.
      Haein, right, holds the open mesh door and explains with a shrug, as if it were obvious. The slit's green-violet glow sits low behind them.
    calm: top
    lines:
      - {who: minho, type: speech, side: l, text: "ONE RULE. NOBODY STEPS ON THE BOSS."}
      - {who: taeo, type: nervous, side: c, text: "THE... BOSS?"}
      - {who: haein, type: speech, side: r, text: "A SNAIL. IF IT DIES, THE GATE CLOSES AND WE LOSE THE LICENCE."}
