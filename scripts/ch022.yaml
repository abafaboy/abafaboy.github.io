chapter: 22
title: The Zone
when: "The day after ch 21's notice: Monday in spring (no date is lettered). 5:40 AM at Taeo's building; 8:30 AM the landlord's call in the piloti; 2:05 PM Hanbit Mart; 2:20 to about 2:55 PM Eunchae's gosiwon and the street below it; 3:50 to about 4:25 PM the survey in Seongsan-dong; 7:20 PM the Ryu yard roof at sunset."
story_beats: PART_ONE_BEATS.md#22
cast:
  taeo: default     # black hoodie, black cargo trousers, black low sneakers with one white stripe; one small mole under his RIGHT eye; the olive backpack with the faded orange shield-and-open-door patch from P06 on; the dark grey phone (hairline crack top-left, clear case, small green dinosaur sticker). No Hanbit Mart vest: he works weekend days only. Sneakers off inside the gosiwon (P12–P26). At the survey (P31–P44) a borrowed red-orange Ryu Survey safety vest over the hoodie and his trainee's clipboard log (ch 10–11); vest off again on the roof (P45 on). The link pulse is always in his RIGHT palm; the RIGHT-palm gravel graze remains under the square plaster from ch 17; no active nosebleed
  nib: default      # barefoot; V-notch in the LEFT ear; one small lower fang on the left; brown rope belt; leather pouch on the RIGHT hip with Haru's small green dinosaur sticker on its flap (ch 8); knife in the brown wooden sheath on the LEFT hip; Eunchae's carved pencil in the pouch (ch 5). In EVERY panel his binoculars (ch 19 props.binoculars): compact 8x30 porro-prism binoculars in matte black rubber armour, a plain black woven neck strap knotted at the LEFT side of his neck so they ride high on his chest, Kett's three-line fork scratched on the hinge plate; healing RIGHT shoulder-blade graze from ch 17. Pale-blue ID card and Eunchae's cobalt-blue pencil (pink eraser, silver ferrule, chewed end, Kett's fork near the eraser) remain in the RIGHT-hip pouch; the original folded PAPER post drawing stays at the flat; Kwak's knee pads are stored by the entry step; Nib uses his denim-blue fleece blanket from ch 2 (the foil blanket is stored at the mart)
  eunchae: work     # P10–P11: high ponytail, cream shirt with rolled sleeves, grey-green Hanbit Mart vest with a BLANK name tag, black trousers, black-and-white canvas sneakers. From P12: the same without the vest (folded over her arm), in socks. Her dog-eared food-hygiene workbook with sticky tabs
  manager: default  # Manager Oh, P10 only, background: black polo, clipboard
  minho: default    # brown work jacket, grey T-shirt, olive cargo trousers with black knee pads, brown work boots; grey streak at the LEFT temple; radio clipped high on the LEFT chest; watch on the LEFT wrist; a headlamp on a strap for the survey (P31–P44)
  haein: default    # work overalls, tool belt, clear safety glasses pushed up on her head; Minho's family look. Her homemade sensor rig in P45–P58: two wrist fobs on wires and a battered analogue gauge
extras:
  neighbour_403: "the north neighbour on Taeo's floor: a young father in his early thirties, grey T-shirt and track trousers, bed hair, a sleeping toddler of about two slumped on his shoulder"
  gma_crew: "two GMA contractors in navy coveralls with reflective stripes and yellow hard hats; a small white utility truck with an amber beacon and a short ladder"
  landlord: "Taeo's landlord, voice only on the phone, never drawn: a man in his sixties, tired, hurried, polite"
  gosiwon_resident: "a man in his fifties in a white singlet and track trousers, a cup of instant noodles in one hand; only his face, shoulder and hand show at a door gap of about 10 cm"
  eunchae_parents: "memory only (P19–P20): her father, fifties, thin, glasses, a grey cardigan; her mother, fifties, short permed hair, an apron in P19 and a padded jacket in P20"
  crew: "the two Ryu Survey crew members of ch 7: a stocky man in his forties and a young woman, red-orange safety vests over work clothes, hard hats with headlamps"
  mannequin: "The existing ch 10–11 wooden construct mule: jointed wooden body, WEDGE head, TWO dark dot eyes, canvas harness and survey packs; nonverbal. No featureless oval or block head, and no new steel animal design."
  candidate: "the far figure in the contact window (P52, P55): an adult, slender and upright, with long wings folded close like a cloak; a silhouette at great distance. No face, no species detail beyond the wings. Never cute"
  boss: "the salt-iron boss, never seen whole: a buried mass of rust-red iron spikes, each as tall as a man, that rise out of the salt like hackles; their tips glint hard red"
locations: [taeo_building, taeo_street, hanbit_mart, eunchae_gosiwon, gosiwon_street, seongsan_redevelopment, salt_iron_cave, ryu_practice_yard, ryu_yard_roof]
location_notes:
  taeo_building: "LOCATIONS.md sub-key: the stairs, the open-air corridors and the ground-floor piloti. Twelve studios, three to a floor on 2F–5F; on 4F, 401 is the south neighbour, 402 Taeo, 403 the north neighbour toward the stairs (world/floorplans/taeo_flat). The corridors face the bus street (west), each with a waist-high rail. The piloti holds the glass street door, a bank of twelve mailboxes and the foot of the stairs. The flat's interior is NOT shown in this chapter (LOCATIONS.md: ch 22 'mentioned, not shown')."
  taeo_street: "LOCATIONS.md sub-key: the two-lane bus street and the corner bus stop 30 m south of the street door. From this chapter a GMA advisory-zone sign is bolted to the lamp post by the bus stop: a yellow field, a black-and-yellow hazard border, a simple violet pictogram of a door-shaped slit, no letters. Keep it in every later shot of that corner. The zone is hapjeong_gate_zone (LOCATIONS.md)."
  hanbit_mart: "LOCATIONS.md, day look: daylight cream through the south glass, fluorescent green-white behind; the counter across the northwest rear, facing south, cigarette shelves on the north wall, the small TV high above the north end of the cigarette shelves; the red two-for-one tag on the promo end cap."
  eunchae_gosiwon: "no key yet (decided here). A gosiwon on the third floor above a PC bang, about 5 minutes' walk from Hapjeong station and 8 from Hanbit Mart. A shoe rack at the head of a long, narrow corridor; beige plywood doors set close together with blank number plates; grey-green linoleum; an LED strip light; ducting overhead; a shared kitchen nook at the far end (a big rice cooker, a kimchi tub, instant-noodle packs, one laminated rules sheet). Eunchae's room: about 1.8 × 2.8 m (5 m²), NO window. Along the left wall a raised single bed with a grey quilt and a shelf above it (folded clothes, a small rice cooker, a small framed photo of her with her parents); at the bed's foot a built-in desk with a stool, a mini-fridge under the desk, a small wall fan; one LED ceiling panel. Every wall is papered with handwritten food-hygiene flashcards and pale-yellow sticky notes except one bare square above the pillow, where Nib's drawing hangs from P26 on. ₩350,000 a month, no deposit."
  gosiwon_street: "no key yet. The commercial side street outside the gosiwon building: on its ground floor a small real-estate agency with listing cards in the window, a fried-chicken shop beside it, a PC bang sign above; plane trees, a bus route, overhead wires."
  seongsan_redevelopment: "no key yet (decided here). A fictional redevelopment block in Seongsan-dong, Mapo-gu, no real address: a short street of emptied four-storey red-brick villas due for demolition, windows crossed with tape or boarded, abandoned furniture in a car park, one red spray-painted circle-and-cross on the nearest wall, a blue hoarding and a parked excavator at the far end. The gate opened in the basement storeroom of the middle villa: basement steps behind orange GMA barriers, then a bare concrete corridor with pipes; at its end the storeroom's steel door stands open and the slit stands inside its steel frame. No survey cable is laid through this short cave job; radios cannot cross the threshold, and the two/three knock code is the fallback. Child-height pencil marks climb that frame. Haein's radio table stands against the corridor's left wall, a tripod work lamp behind it."
  salt_iron_cave: "inside the D-grade gate (decided here): a vast cave of white and pale-grey salt crystal veined with rust-red iron, black-green brine pools, orange-flagged survey pins; a sinkhole high overhead opens on a saturated acid lime-yellow noon sky with a small hard white sun (brighter and far yellower than the green-dusk gates of ch 12–17, and unlike ch 11's lavender noon); violet shadows. The boss territory is a field of iron spikes in the salt."
  ryu_practice_yard: "Drawn ryu_practice_yard key: 18 x 26 m, south-centred double vehicle gate, grey corrugated office container southwest, its keyed step plus a removable wheelchair ramp, one visible white van southeast facing west, plywood maze in the centre, three targets at the north fence, equipment trestle west of maze. Fleet total TWO after ch 12's tow: the other van is in the adjoining northwest service bay, outside the key's main view. A low workshop stands beyond that northwest boundary; its WEST stair leads to ryu_yard_roof, the workshop roof introduced in ch 20. The office container is not the party roof. No new repossession marks until ch 22. In ch 22 a fresh blue Bluebird sticker and red seizure strip mark the older southeast van; its bumper bears ch 21's Kett mark."
  ryu_yard_roof: "Decided here (reconcile when LOCATIONS.md adds ryu_practice_yard): the flat concrete roof of that workshop, about 8 x 6 m, coated in the green waterproof paint of Seoul rooftops, with a knee-high parapet topped by a galvanised pipe rail. An outside steel stair with a handrail climbs the workshop's WEST wall to the roof's north-west corner. A blue plastic water tank on a steel stand in the north-east corner; a row of white styrofoam planters with lettuce and chilli seedlings along the east parapet (Minho's mother's); two poles carrying a string of bare bulbs across the roof. The south parapet overlooks the street and the city: low Mapo roofs, lit apartment towers, and far off to the south-west the lit span of a Han River bridge. The southeast side looks down into the keyed yard.  Same workshop roof as ch 20; the party table and chairs have been cleared. Tonight only Taeo, Nib, Minho and Haein gather around four upturned crates, a camping lantern and cup noodles. The sun sets west. No second roof or moved office container."
palette_notes: "Dawn at Taeo's building: the west facade in cool blue-grey shadow under a pale peach sky; the twelve white notices bright; the new sign's yellow the one accent. Piloti in the morning: flat cool daylight on grey concrete; the flyers' gold the accent. Hanbit Mart by day: daylight cream at the front, fluorescent green-white behind; the red sale tag. Gosiwon: cold white LED light, beige plywood, grey-green linoleum, a grey quilt; the pale yellow of the flashcards is the accent. Memories (P19–P20): desaturated and cooler, the buttercream wallpaper the one warm colour. Street by the gosiwon: warm afternoon sun, blue sky, a blue bus. Seongsan block: dusty grey concrete and faded brick in low warm sun; the one red spray mark is the only red. Basement: hard white work-lamp light on grey concrete; the gate's violet-black #1A1026 with a cold white-cyan rim and a sour lime spill. Salt-iron cave: white and pale-grey salt, rust-red iron, black-green brine, a saturated lime-yellow sky, violet shadows; danger red only on the spike tips (P40). Ryu yard roof: orange horizon to pink to deep blue, a camping lantern's warm light. Interface cyan #3FE3F2 only on the fragment at Taeo's touch (P48–P50), the contact-window aperture (P52, P55) and window light on Taeo's face; the navy #0B1530 page only for P51–P55. Nib's amber #F2A93B only in his eyes and in Taeo's palm (P34, P37, P41, P42)."

panels:

  # ---------------- COLD OPEN: the morning after the notice ----------------
  - id: P01
    shape: tall
    gap: none
    bg: white
    camera: "exterior, low, from the far pavement of the bus street at dawn, looking up at the west face of Taeo's block"
    focus: [0.5, 0.45]
    art: >
      Taeo's building (taeo_building and taeo_street keys) at dawn, seen from the far pavement of the two-lane bus street: the five-storey
      red-brick studio block with its dark grey roof parapet; the ground-floor open piloti car park with the glass street door; above it,
      four floors of open-air access corridors (2F to 5F) under their roofs, each with a waist-high metal rail and three flat slate-grey
      steel doors. On EVERY one of the twelve doors, at eye height, the same white A4 sheet is taped: twelve small white rectangles in a
      grid, the brightest things on the facade.
      On the 4F corridor, small: Taeo (taeo, default: black hoodie) stands at the rail outside the middle door with a white sheet in his
      hand; Nib (nib, default) sits on the corridor floor beside him with his back to the rail, only his spiky hair and long ears showing
      above it.
      Street level, lower right: at the corner bus stop (its ad screen dark), a small white GMA utility truck with an amber beacon; two GMA
      contractors (extras.gma_crew) on a short ladder bolt a new rectangular sign to the lamp post: a yellow field with a black-and-yellow
      hazard border and a simple violet pictogram of a door-shaped slit, no letters. Overhead wires; a cat on the wall of the next building.
      The sun is rising behind the building (east), so the west facade sits in cool blue-grey shadow while a pale peach sky glows over the
      roof line; the sodium street lamps are just switching off. Palette: cool blue-grey shadow, pale peach sky, white notices, the sign's
      yellow as the one accent. No gate anywhere and no violet light except the small pictogram. No letters or numbers in the art.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "5:40 AM"}
      - {who: taeo, type: float, text: "NOTHING OPENED ON OUR STREET."}
    ui:
      - {kind: label, text: "GATE ADVISORY ZONE", at: [0.80, 0.84], size: 24, rot: 0, color: "#1d1917", notes: "move onto the new lamp-post sign once the art exists"}
    notes: "Starts where ch 21's hook left off (the notice on Taeo's door), a few hours later. ch 21 showed one door; this pulls back to all twelve. The zone is hapjeong_gate_zone (LOCATIONS.md)."

  - id: P02
    shape: tall
    gap: short
    bg: white
    camera: "on the 4F corridor, eye level, looking north along the doors toward the stairs"
    art: >
      Taeo stands right, Nib sits left by the rail; the neighbour and toddler are farther back on the right.
      The 4F open-air corridor (taeo_building key) at dawn: the cold white tube lights still on under the corridor roof, the waist-high
      metal rail on the LEFT with the street below, the slate-grey steel doors on the RIGHT, the stairs at the far end.
      Near foreground: Taeo (taeo, default: black hoodie, black cargo trousers, socks, his sneakers trodden down at the heel; tired lower
      lids; one small mole under his RIGHT eye) leans his shoulders back against his own door, holding the peeled-off white notice in both
      hands, looking down the corridor rather than at the paper: a man who has not slept and is too tired to be scared yet.
      Nib (nib, default: binoculars on their strap round his neck) sits on the corridor floor at his feet with his back against the rail,
      knees up, looking out through the rail bars at the street below like a sentry on a wall. Two empty canned-coffee cans stand side by
      side on the floor by his bare foot.
      Further along at the next door (403), the neighbour (extras.neighbour_403), a sleeping toddler slumped on his shoulder, holds his own
      identical white sheet at arm's length, frozen. Pale peach dawn beyond the end of the corridor; blue-grey shadow; the white sheets bright.
      No letters or numbers in the art.
    calm: top
    lines:
      - {who: taeo, type: float, text: "SOMEONE MOVED A LINE ON A MAP."}
    notes: "The two cans are ch 21's canned coffees ('YOU FIRST.'). Nib's binoculars: ch 19, worn always. 403 is the north neighbour; 401 (south, behind the camera) keeps its sheet taped."

  - id: P03
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up over Taeo's thumbs onto the notice"
    art: >
      Extreme close-up: Taeo's two hands hold the white A4 notice taut, thumbs on its lower edge, knuckles pale in the cold. The sheet is
      drawn as a printed form: a solid black header bar, below it two clean empty bands where large type would be, smaller grey squiggle
      lines for the body, and a round blue stamp in the lower corner. One corner is torn where the tape came away, a curl of tape still on
      it. Cool dawn light from the left. Nothing else in frame. No letters or numbers in the art.
    calm: none
    ui:
      - {kind: label, text: "NOTICE · GATE ADVISORY ZONE", at: [0.50, 0.24], size: 34, rot: 0, color: "#ffffff", notes: "white, on the black header bar"}
      - {kind: label, text: "RENT +40% FROM NEXT MONTH, OR VACATE WITHIN 30 DAYS.", at: [0.50, 0.52], size: 30, rot: 0, color: "#1d1917", notes: "on the two blank bands"}
    notes: "The same notice as ch 21's hook. Rent ₩450,000 (ch 5) + 40% = ₩630,000."

  - id: P04
    shape: inset-r
    gap: short
    bg: white
    camera: "high angle from Taeo's eye line down at Nib on the corridor floor"
    art: >
      Crop Nib from the waist up in the right third; Taeo stands off frame to the left.
      From Taeo's eye line, looking down: Nib (nib, default: V-notch in the LEFT ear, one small lower fang on the left, brown rope belt,
      pouch on the RIGHT hip with Haru's dinosaur sticker on its flap, brown wooden sheath on the LEFT hip, barefoot, binoculars on his chest)
      has taken the notice and holds it close in both hands, one olive-green finger under a line, sounding it out with total concentration,
      brow knotted: an adult soldier working through a dispatch in a script he learned last month. Not cute.
      Blue-grey concrete floor and the rail's shadow bars behind him.
    calm: left
    lines:
      - {"who": "nib", "type": "speech", "text": "THIR-TY. DAYS.", "side": "r"}
      - {"who": "offpanel:taeo", "type": "speech", "text": "YOU CAN READ THE NOTICE.", "side": "l"}
      - {"who": "nib", "type": "speech", "text": "THEN WE HAVE THIRTY DAYS.", "side": "r"}
    notes: "Nib reads numbers and some Hangul from Eunchae's flashcards (ch 9). 'WE': after ch 21 he stays, as a partner, for the door. He ignores the compliment."

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 22 · THE ZONE"

  # ---------------- THE LANDLORD ----------------
  - id: P06
    shape: tall
    gap: long
    bg: white
    camera: "establishing, eye level inside the ground-floor piloti, from beside the stair foot toward the street door"
    art: >
      Taeo stands right, phone at his right ear. Nib sits left by the stairs. The landlord is heard only through the phone.
      The ground-floor piloti of Taeo's building (taeo_building key) in the morning: a low concrete ceiling on square columns, two parked
      cars and a scooter, oil stains, the glass street door on the right with the bright bus street beyond.
      On the left wall, a bank of twelve grey steel mailboxes (four rows of three), and out of EVERY slot juts the same glossy black-and-gold
      flyer (blank).
      Taeo (taeo, default, the olive backpack on one shoulder with its faded orange shield-and-open-door patch facing us) stands by the
      mailboxes with his phone at his RIGHT ear (screen not visible) and one of the flyers crumpled in his left hand: polite listening
      posture, shoulders hunched, eyes on the floor.
      In the foreground corner, Nib sits on the bottom step of the stairs, elbows on knees, binoculars raised at the street door, watching
      the traffic.
      Flat cool daylight from the street side; grey concrete with one blue-grey shadow tone; the flyers' gold the one accent.
      No letters or numbers in the art.
    calm: top
    lines:
      - {"who": "narr", "type": "tag", "text": "8:30 AM"}
      - {"who": "offpanel:landlord", "type": "phone", "text": "MR. YOON. YES. I'M SORRY ABOUT THE NOTICE.", "side": "r"}
      - {"who": "offpanel:landlord", "type": "phone", "text": "MY INSURER DROPPED THE BUILDING THE DAY THE MAP CHANGED.", "side": "r"}
    ui:
      - {kind: label, text: "WE BUY GATE-ZONE BUILDINGS\nCASH IN 7 DAYS", at: [0.16, 0.50], size: 20, rot: -6, color: "#b8902e", notes: "on one flyer jutting from a mailbox slot"}
    notes: "The landlord is a voice only (extras.landlord): squeezed, not a villain (STORY_BIBLE §4 rule 3). Cash buyers circling by morning is why he can sell fast."

  - id: P07
    shape: wide
    gap: short
    bg: white
    camera: "medium waist-up, three-quarter front on Taeo against the mailboxes"
    art: >
      Taeo is on the right, phone at the right side of his face; frame him from the waist up.
      Closer on Taeo by the mailbox bank, phone at his RIGHT ear, the crumpled gold flyer in his left fist at his side. His face shifts as
      he listens: the polite neutral of a man taking bad news from someone older, one corner of his mouth pinned; a bead of sweat at the
      temple. Behind him the grey mailbox doors in a grid, the flyers' gold edges cut off by the frame. Flat cool daylight; one shadow tone.
      No letters or numbers in the art.
    calm: top-right
    lines:
      - {"who": "offpanel:landlord", "type": "phone", "text": "NO INSURANCE, THE BANK CALLS IN MY LOAN. SO I'M SELLING.", "side": "r"}
      - {"who": "offpanel:landlord", "type": "phone", "text": "BUYERS WANT THE BUILDING AT THE NEW RENT. OR EMPTY.", "side": "r"}
      - {"who": "taeo", "type": "speech", "text": "AND MY DEPOSIT?", "side": "r"}

  - id: P08
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up, side profile on Taeo and the phone"
    art: >
      Taeo's profile and phone occupy the left third. The landlord is heard through that phone.
      Side-profile close-up: Taeo with the phone pressed to his ear, eyes shut for one second, jaw tight, asking the question he does not
      want answered. A plain grey concrete column behind him.
    calm: right
    lines:
      - {"who": "offpanel:landlord", "type": "phone", "text": "YOU'LL GET YOUR DEPOSIT WHEN THE BUILDING SELLS.", "side": "l"}
      - {"who": "taeo", "type": "speech", "text": "AND IF THE BUILDING DOESN'T SELL?", "side": "l"}
    notes: "Twelve units (P01), so eleven other tenants. Taeo's deposit balance is ₩1,600,000 (ch 17: ₩3,400,000 of the ₩5,000,000 signed away; ch 21 hook)."

  - id: P08a
    shape: inset-r
    gap: short
    bg: white
    camera: "front close-up on Taeo holding the phone at his ear"
    art: >
      Taeo's face fills the right third beside a grey piloti column (taeo_building), cool morning daylight.
      He keeps his dark grey phone against his right ear as his polite expression tightens. The landlord is not drawn.
      Show the mole under Taeo's RIGHT eye and the olive backpack strap. No text in the art.
    calm: left
    lines:
      - {who: "offpanel:landlord", type: phone, side: r, text: "I HAVE ELEVEN MORE TENANTS TO CALL, MR. YOON."}
    sfx:
      - {text: "TUK", style: phone, at: [0.78, 0.30], size: S, rot: 0}
    notes: "The landlord ends the call without answering when the deposit will be returned."

  - id: P09
    shape: tall
    gap: short
    bg: white
    camera: "full figure from low: Nib on the bottom stair, Taeo's legs at the frame edge"
    art: >
      Nib is fully visible right; Taeo's legs and lowered phone are at the left edge.
      Nib (nib, default) on the bottom stair, full figure from low: he has lowered the binoculars to his chest and looks up at Taeo, of whom
      we see only the black trousers, the sneakers and the hand hanging at his side with the dead phone. A practical question on Nib's face,
      nothing more: ears level, head tilted. Concrete step and the stair's steel rail. Cool daylight.
    calm: none
    lines:
      - {who: nib, type: speech, side: r, text: "FORTY PERCENT. IS THAT A LOT?"}
      - {who: "offpanel:taeo", type: speech, side: l, text: "₩630,000 A MONTH. MORE THAN I EARN."}
      - {who: narr, type: footnote, text: "*₩630,000 ≈ US$460"}
    notes: "Nib's 'IS THAT A LOT?' (ch 5). Taeo works weekend days only since the construct stocker took nights (ch 5, ch 18), so the new rent is more than his pay."

  # ---------------- HANBIT MART ----------------
  - id: P10
    shape: full
    gap: long
    bg: white
    camera: "establishing, inside Hanbit Mart from the north end of aisle 2 toward the counter and the glass front"
    art: >
      Eunchae stands right behind the counter, Manager Oh beside her at centre; Taeo and Nib enter left.
      Hanbit Mart (hanbit_mart key) at two in the afternoon: daylight cream through the south glass front makes warm patches on the front
      strip while the aisles stay fluorescent green-white.
      At the counter across the northwest rear, facing south, with cigarette shelves on the north wall, Eunchae (eunchae, work: high ponytail,
      cream shirt with rolled sleeves, grey-green Hanbit Mart vest with its BLANK name tag, her dog-eared food-hygiene workbook with sticky
      tabs under her arm) is mid-handover, unzipping her vest with one hand while Manager Oh (manager: black polo, clipboard, harried) takes
      over the till beside her.
      High on its bracket above the north end of the cigarette shelves, the small TV angled at the counter: screen: green.
      Just west of the glass door, between the basket stack and the low drinks display, stands ch 18's self-checkout kiosk (a slim pale-grey
      pillar about 150 cm tall, its tilted screen dark).
      The glass door has just swung open, the little bell above it swinging: Taeo (taeo, default, backpack with the patch) steps in, Nib at
      his hip with the binoculars on his chest. Eunchae's eyes have gone from the TV to Taeo's face.
      The red two-for-one tag on the promo end cap is the one saturated note. No letters or numbers anywhere in the art.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "HANBIT MART · 2:05 PM"}
      - {who: eunchae, type: speech, side: r, text: "YOUR STREET'S ON THE NEWS."}
    ui:
      - {kind: tv.lowerthird, on: screen, text: "GMA REDRAWS GATE ADVISORY MAP: HAPJEONG, MANGWON ADDED", ticker: "INSURERS SUSPEND BUILDING COVER IN NEW ZONES · RENTS EXPECTED TO RISE · KNN 24"}
    sfx:
      - {text: "JINGLE", style: quiet, at: [0.30, 0.18], size: S, rot: 8}
    notes: "This is Eunchae's FIRST Monday morning shift, from 6 AM, announced in ch 18; her shift ends at 2 PM (decided here). The store is unstaffed 22:00–06:00 (ch 18). The TV gives the city-wide scale of P01–P08."

  - id: P11
    shape: wide
    gap: short
    bg: white
    camera: "over Eunchae's shoulder across the counter at Taeo"
    art: >
      Frame the standing figures from the waist up: Eunchae left, Taeo right, Nib just left of him.
      Over Eunchae's shoulder (her ponytail and the vest half off one arm in the near foreground, left), across the counter at Taeo, who
      stands with one hand on his backpack strap giving a small, tired shrug that is trying to be a joke and is not. Nib beside him at
      counter height, his eyes on Eunchae.
      A sliver of Eunchae's profile at the frame edge: her face has gone very still, the brisk shift-lead look switched off and something old
      and hard showing underneath.
      Fluorescent light behind them, daylight on the counter top; snack shelves simplified.
    calm: top
    lines:
      - {who: taeo, type: speech, side: r, text: "MY DOOR GOT A NOTICE TOO."}
