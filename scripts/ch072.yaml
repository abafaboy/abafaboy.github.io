  ambulance_medic: Adult Korean woman about 40, tied-back hair, slate rescue uniform, plain reflective
    strips, medical gloves.
  surgeon: Korean woman about 50, short greying hair under plain surgical cap, blue-grey scrubs, tired
    direct eyes.
props:
  nib_boots: 'Exact ch043 pair: matte dark-brown ankle-high leather lace-up work boots, broad round toe,
    no visible steel cap; four pairs of dull gunmetal round eyelets; dark-brown round laces in small double
    knots; plain black lug soles, low heel, heel pull tab; oat-grey short socks just inside collar. No
    logo, hooks, buckles, bright trim or exposed metal plate.

    '
locations:
- chungju_river_inside
- chungju_river_gate
- chungju_hospital
location_notes:
  topology_lock: 'ch070 master view: entry landing downstream; right-bank survey shelf runs upstream,
    current toward landing. At marker 9, A is LEFT stepped dry shelf and B RIGHT low water-covered shortcut
    past split pillar. Local waterward-left descriptions are relative to the right-bank approach, not
    an A/B swap. Muted lilac mineral seams fill hard white survey lamps. The metal frame has an exposed
    tapping plate.

    '
  chungju_river_inside: 'Continue ch071''s right-bank dry survey shelf, Channel B waterward left beneath
    low lip, high triage alcove, stone ceiling with NO SKY. White cable, blue bands every metre; grey
    tripod relay every 50 m, white lamp, speaker grille, coiled handset. Intact cable carries all cross-threshold
    radio. Near the entry landing the scaffold brace and its inside surface can be reached on foot; knocks
    are physical strikes on that brace.

    '
  chungju_river_gate: 'Continue ch071: gravel, scaffold-braced slit, white canopy radio table, clear ambulance
    access.'
  chungju_hospital: 'No drawn key. Local receiving hospital in Chungju, not Seoul: ambulance bay, blue-grey
    automatic doors, operating-area corridor with cream wall, slate vinyl floor, three linked grey seats
    and a recessed vending machine. A side service entrance admits Orrin. Door panels, wristbands and
    medicine wrappers blank for lettering. Overhead blue-white fluorescent light, A4 institutional slate
    shadows. No magical equipment.

    '
continuity_notes: 'All Nib art inherits adult proportions, V-notch LEFT ear, one lower LEFT fang, brown
  rope belt, RIGHT pouch and sticker, LEFT wooden sheath, 8x30 binoculars with LEFT strap knot and hinge
  mark, protected ID/PAPER drawing/cobalt pencil, and the exact ch043 boots. Sera''s bow is carried on
  the litter''s RIGHT side; bone flute remains secured at RIGHT hip, later in a clear effects bag with
  her quiver. The torn LEFT bracer was lost to the predator. Return rings fade outside; they are not used
  to teleport because the boss is still alive. No new link colours, load percentages or reservoir repair
  established.

  '
palette_notes: 'A4 skyless-gate variation: violet slate and hard white survey lamps, ink-dark water, controlled
  blood red. Outside morning grey; hospital clean blue-white and slate. Amber belongs only to Nib''s eyes/link;
  cyan belongs only to Taeo''s interface, unused here. No generated lettering, bloom or decorative particles.

  '
