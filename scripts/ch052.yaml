chapter: 52
title: Leaks
when: "Immediately after ch 51's two-million-view hook; that evening at Ryu Survey, the following morning and afternoon at the exhibition. No calendar date is established."
story_beats: PART_ONE_BEATS.md#52
cast:
  taeo: outdoor # Navy zip jacket, black hoodie and cargos, single-white-stripe black sneakers. One mole under RIGHT eye. Jacket off only at the night worktable.
  nib: default # Adult scout; ch 43 boots, never barefoot. Full prop lock in continuity_notes.
  orrin: default
  sera: default
  haein: default
  sejin: default
  park_doyun: default
  grandma: default # Voice through Taeo's phone only.
extras:
  attendant: "Exhibition attendant, adult woman, charcoal polo, grey trousers, blank lanyard, practical low shoes."
locations: [ryu_practice_yard, exhibition_service_corridor]
location_notes:
  ryu_practice_yard: "Use locations/ryu_practice_yard/key_wide.png and key_reverse.png: grey container southwest, white van southeast facing west, fixed central plywood maze, trestle west, three targets north. Workshop scenes use that trestle under a portable work lamp; do not relocate the container or turn the maze into an indoor room. Taeo's container home is in the same compound, off this view."
  exhibition_service_corridor: "Venue service passage beside the course: concrete floor, off-white walls, exposed grey conduit, equipment doors, waist-high queue barrier. Daylight enters from the open loading door at the far end; overhead practical strips supplement it. Public course is beyond the barrier; backstage access remains controlled. Signs and passes blank until lettered."
continuity_notes:
  nib: "105 cm, wiry weathered adult; olive skin, spiky black hair, amber eyes, V-notch LEFT ear, sole LEFT lower fang; pinkish-tan sleeveless wrap, charcoal shorts, brown rope belt, pouch RIGHT hip with green dinosaur sticker, brown wooden sheath LEFT hip. Matte-black 8x30 binoculars ride high on chest, strap knot LEFT neck, Kett's fork on hinge. ID, folded PAPER watch-post drawing and cobalt pencil remain in pouch. Boots are the pair bought in ch 43: copy that script's exact design when available; do not introduce a second pair."
  reservoir: "The same unfinished reservoir Haein introduced in ch 50; retain its housing, contact and control geometry. A force-storage device, not a battery for electricity. Its mechanical charge dissipates; no liquid leaks and no cyan magic dust. Measurements here use an external instrument, whose figures are lettered with label entries."
  power: "Nib's permitted link is amber in Taeo's RIGHT palm; Orrin's is slate-green. No new Sera link colour is established in this chapter. Mechanical impact only; no new faculty, percentage or capacity increase."
palette_notes: "Night yard: A4 ochre/brown under a cream work lamp, deep blue-grey outside its pool. Day yard: A4 dusty ochre, warm brown, sky blue. Venue: blue-white institutional practical light, light slate shadows. Amber belongs to Nib's eyes/link; interface cyan only to actual operator windows. Screens dark unless a same-panel UI fills them. Flat cel shadows, warm near-black contours; no bloom, haze or decorative particles."
