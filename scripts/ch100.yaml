chapter: 100
title: Their Name Over the Door
when: "Straight from ch99's hook: the cold blue-white first light of opening day (about 07:00). Then the name vote in the guild hall (08:00), the licence filed at 10:02, the sign unveiled at noon, the door painted in the early afternoon (about 14:30), the opening party on the roof from dusk (about 18:30), the first hook at 21:41, the white van leaving at about 21:55 and Granny Moon at the street door at about 22:10. No calendar date or weekday is lettered."
story_beats: PART_ONE_BEATS.md#100
cast:
  taeo: default # 23, 181 cm, RIGHT-eye mole. Black hoodie, black cargos, striped black sneakers, cracked dark-grey dinosaur phone in his pocket, all chapter. NO navy jacket and NO olive backpack at any point (the olive backpack hangs on the hook in his third-floor office, as in ch99 P50; the navy jacket hangs beside it). Lip clear; forearm bruises only a faint yellow-grey fade.
  nib: default # Adult scout, 105 cm, default clothes. Locks: V-notch LEFT ear, one lower LEFT fang, brown rope belt, RIGHT pouch with the dinosaur sticker, LEFT brown wooden sheath, matte black 8x30 binoculars on a black strap knotted LEFT (Kett's fork on the hinge), exact ch43 boots.
  orrin: default # Adult stoneback carrier, 2.3 m long, shell like a hill of stacked slate, slow gentle face. Too big for every door: in the hall panels only his head fills the doorway.
  sera: default # River-green layered coat, long dark braid, bow in her LEFT hand and quiver on her RIGHT shoulder when she carries them (she leaves both leaning on a pergola post at the party).
  kesh: default # Tall and slight, four grey-brown wing panels, feathered antennae, narrow grey-tan face.
  haein: default # Slate overalls, tool belt, jaw-length black bob, clear safety glasses on her crown.
  dara: default # 42, broad square weathered face, dark short braid with grey temples, matte slate plate over oatmeal wrap, scarred bare forearms, LEFT surgical kit and RIGHT cloth roll.
  sejin: default # Sage scrubs, olive medic rig, cropped black hair, stopwatch on a cord.
  chae: default # Navy cardigan, white collar, plain safety vest, blue folio; regional safety officer (Chae Yuri, AAO).
  eunchae: default # 25, 163 cm, brown high ponytail, cream rolled-sleeve shirt, black trousers, black-and-white canvas sneakers, navy apron with a ring of index flashcards clipped to the strap.
  minho: default # 26, grey streak at the LEFT temple, brown field clothes, chest radio, LEFT wristwatch.
  seonhee: default # About 55, beige cardigan over a work shirt, sleeves rolled, reading glasses pushed up, pencil behind her ear.
  dami: default # Gu Dami, porter, 157 cm. Short low ponytail with a choppy fringe, grey hoodie under a faded sixteen-pocket ochre vest, olive cargos, brown gloves clipped to her belt, her scuffed WHITE work helmet (marker slogan MY SUMMONS GO FIRST on the shell) under one arm. NEW: the slate-blue GO FIRST patch sewn on the left chest of the vest.
  grandma: default # Kim Okja, 71, 152 cm. Short permed grey hair, glasses on a beaded cord, red-and-navy plaid shirt, beige quilted vest, loose dark trousers, a plain cooking apron over it tonight, travelling shoes (not slippers); strong work-worn hands.
  grandpa: default # Yoon Gilsu, 74, 166 cm. Thin, slightly stooped, short white hair, weathered tan, faded blue work cap, grey many-pocket work jacket; gentle crinkle-eyed smile.
  haru: default # Yoon Haru, 10, 138 cm. Messy black hair with a cowlick, missing front tooth, yellow dinosaur T-shirt under a too-big navy windbreaker (Grandma insisted), blue shorts, velcro sneakers.
  granny_moon: default # About 190 cm, grey skin, long swept-back pointed ears, silver low bun, pale sage eyes, glasses on a dark cord, moss cardigan (buttoned one button wrong), cream shirt, oatmeal apron still on, charcoal trousers, BROWN SLIPPERS (she walked here).
  dr_pyo: default # About 50, neat salt-and-pepper side part, grey temples, rimless rectangular glasses, mid-grey suit, ivory shirt, muted sage tie, black shoes, slate lanyard with a blank ivory badge.
extras:
  porter_jiho: "A young porter, about 19, 170 cm, lanky, shaved sides and a short messy top, faded mustard work vest over a grey tracksuit top, grey work trousers, boots a size too big, brown gloves in his belt; the slate-blue GO FIRST patch on the left chest of the vest; shy grin."
  porter_bora: "A young porter, about 20, 160 cm, short black bob held with a plain clip, olive work vest over a navy hoodie, dark cargo trousers, worn boots, brown gloves in her belt; the slate-blue GO FIRST patch on the left chest of the vest; serious, quick eyes."
  clinic_doctor: "Dr. Lim of the provincial clinic (ch87): Korean woman about 54, short greying hair, rectangular glasses, white coat. Voice only on the phone in this chapter; never drawn."
  neighbours: "Three gate-zone neighbours at the noon unveiling: an older woman with a shopping trolley, a delivery rider with his helmet under his arm, a man in a shop apron from next door. Unnamed, ordinary, muted clothes."
props:
  cup: "THE CUP of ch2: plain white ceramic mug, one thin green band, ordinary loop handle. No chip, face, name or replacement. Nib carries it everywhere; it is the guild's welcome cup."
  sign: "The guild sign board over the guild door: hand-painted wooden board about three metres wide on a deep slate-blue ground. At its left a cream-outlined open door seen at a slight angle, the door leaf swung toward the viewer; in the doorway ONE cream boot-sole footprint stepping out toward the right; at the right end a row of THREE round cream dots (the knock). A pale lettering band runs along the lower edge, blank in every art brief (the letterer sets GO FIRST there). A small shaded lamp on a short iron arm above the board throws a hard-edged pool of warm cream light (never amber) at night. Under a grey rope-tied tarpaulin until P16."
  patch: "The GO FIRST patch: hand-sewn rounded-rectangle patch of deep slate-blue twill, cream thread outline of the same open door, one boot-sole footprint, three dots, a blank lettering band along the lower edge; the stitching a little uneven, one corner crooked, long white thread ends. Dami, Jiho and Bora each wear one on the left chest of the vest."
  plant: "Dr. Pyo's gift: glossy-leaved rubber plant in a plain white ceramic pot wrapped at the base in ivory paper tied with a ribbon sash (blank in every art brief here; ch99 P53 letters WITH WARM CONGRATULATIONS · KANGHAN INSTITUTE on it and this chapter never shows the text again). Stands on the bare guild-hall counter from P02 on; it stays there at the end."
  wreath: "Seoryun's wreath: tall two-tier standing wreath on a white tripod stand, about 190 cm; white lilies, pale pink roses and green foliage; a wide white satin ribbon sash across the upper tier (the letterer sets COME BACK SAFE — HAN SEORYUN)."
  door_paint: "Red paint on the inside face of the guild's steel door (hinged on the WEST jamb, swings inward): two freehand lines of capitals, ANYONE CAN LEAVE. then EVERYONE COMES BACK., and a tiny three-line fork (Kett's mark) painted under the last word. The only painted-red lettering in the book. Taeo paints line one, Nib (standing on a low stool) paints line two and the fork."
locations: [go_first]
location_notes:
  go_first: "Plan world/floorplans/go_first.png. Four-storey red-brown brick former print works on a corner in Hapjeong-dong, tall washed steel-framed windows, flat roof with a rail; the long planter of sprouts shows over the rail from the street. SOUTH street is the front; looking at the front from the street WEST is the left: Eunchae's glass shopfront and her pale-wood sign board; EAST is the right: the guild's steel street door, a narrow side yard and the external goods hoist (two steel cables, 2.6 x 3.0 m deck) against the east wall. The GUILD SIGN board is mounted over the guild door. The guild hall is narrow, at the south-east corner beside the stair: swept concrete floor, a bare counter along the EAST wall (on the left when you look south from inside), a stack of unopened boxes, the stair at the back (north). The steel street door is hinged on the WEST jamb and swings INWARD; open, its leaf stands along the west side and its INNER face (the painted face) looks east into the room; from the street the leaf is edge-on and the painted words cannot be seen. Roof (the party): four raised beds north with sage sprouts, a long raised bed south-west, a timber pergola with a long plain table at the centre hung with cream paper lanterns, Orrin's slate-roofed shelter in the north-east corner, the stair hatch east, the hoist landing (with a small control box) at the east edge, a blue water tank in the south-east corner. The 100-cup camera stands at the west side of the roof looking east-south-east: the table runs away from the camera, Orrin's shelter far left, the tank far right. The south rail looks over the street and the city lights."
continuity_notes: >
  Time: opening day. Pyo at first light; name vote 08:00; licence filed 10:02; sign unveiled at noon; door painted about 14:30; roof party from about 18:30;
  Sejin's call 21:41; the van leaves about 21:55; Granny Moon about 22:10. Weather: cold, clear, wet street from the night before.
  The guild is named GO FIRST. The licence NAME line is now filled in. Vote: seven slips GO FIRST (Taeo's reads 'GO FIRST. SORRY.', Sera's is huge, Haein wrote Orrin's as he dictated), one slip YOU FIRST (Nib's: 'I GO FIRST EVERY TIME').
  Taeo's rule from that vote: the HOST DRINKS FIRST at the welcome cup. Chae filed the licence at 10:02 (registry: NAME: GO FIRST, ACCEPTED).
  Sign: see props. Emblem: open door, one footprint stepping out (anyone can leave), three dots (the knock that calls them back). Dami, Jiho and Bora wear the patch;
  the emblem drawing was on Taeo's invitation card a week earlier (no name on it); the name was already on his live mic since ch61. Dami's porters' fund VOTED to wear the patch and NOT to join the guild (P10 payoff).
  Door: red lines painted inside the guild door (see props). The red painted line is the only red lettering; interface stays cyan, lanterns warm cream.
  Pyo: came alone at first light with a rubber plant (ribbon: WITH WARM CONGRATULATIONS · KANGHAN INSTITUTE); Nib said NO to a tour of the upper floors; Pyo left with 'ANOTHER DAY, THEN';
  he saw the covered sign and said he looked forward to the name. The plant stays on the guild-hall counter; Orrin distrusts it; Nib waters it; Haein found no wires.
  Wreath: Seoryun's, delivered to the doorstep; Dami's porters carried it up on the hoist; it stands beside the pergola. Seoryun herself is not seen in this chapter.
  Family at the party: Grandma (cooking fish all afternoon, 'EVERYONE GETS FISH', adds a joke fourth rule 'EVERYONE EATS' and refuses to vote), Grandpa ('NO. IT'S GOOD.', not 'it's fine'), Haru (T. rex arms are three metres, still uncorrected).
  Photo: Sera asked Nib first; Nib said 'YES. THE MIDDLE.'; group photo on the roof, Haru counting.
  Hook 1: Dr. Lim's provincial clinic (ch87, south of Seoul, six dialysis stations): all six machines tripped at once at about 21:41, shortly after the clinic changed to a fresh canister of Venn Logistics fuel at 21:00 (Dr. Lim had Haein's test log from ch99 and had said the machines were fine);
  Ms. Han and Mr. Jang were still connected; Haein's saved traces (MS-01 from ch88 and the Yeoju depot from ch94: two short forward teeth, a flat gap, one reverse tooth) match the clinic's trace exactly. No cause or villain is stated.
  Sejin, Dara and Haein left in Ryu's plain white van (Minho tossed Sejin the keys; Sejin drives) with Haein's rig (a matte-grey hard case and a coil of cable), lowered on the goods hoist with Dami at the control box; Taeo knocked twice on the van's rear door (COME BACK) and three knocks came back from inside (COMING). Grandma passed Haein a foil parcel of grilled mackerel. Taeo stays at the building; Orrin, Kesh, Sera, Dami's porters and the family are still at the party.
  Taeo: heart check booked as the clinic's first appointment (Tuesday 09:00, as set in ch99); rhythm problem unchanged; no live-load work.
  Hook 2: Granny Moon (walked from Mangwon in her slippers) gave Nib a folded square of undyed linen with Kett's three-line fork embroidered in dark brown thread, and said ONE sentence in the scouts' speech (subtitled):
  'SOMEONE IS ASKING ON THE OLD LINE FOR THE SCOUT WHO LEFT HIS POST.' She did not say who is asking or what the old line is. Nib keeps the cloth. Nib took the door watch and does not tell Taeo; the guild door stays open all night. Nib whispered '...KETT.' and 'HE WENT LOOKING.'
  Last image: the open guild door at night, the sign lit, the plant visible inside on the counter, Nib a small backlit silhouette in the doorway with the cloth in his hand, the street otherwise empty.
  Money: none new. Building and fit-out as ch99. Nib: exact ch43 boots, LEFT notch, RIGHT pouch, LEFT sheath, binoculars with Kett's fork on the hinge; amber and slate-green pulses only; no new link colours.
palette_notes: "Morning: cold blue-white light, hard shadows, wet slate. Noon: clear sky, brick red, hard blue shadows. Afternoon hall: cold daylight bar from the door, grey steel, fresh red paint. Roof party: dusk blue with cream paper lanterns (warm cream, never amber). Night street: navy and wet slate, one cream lamp over the sign and the warm cream hall light. Cyan only for interface; amber only for Nib's link and eyes; red only for danger and the painted red door lines. Flat cel, hard shadows, no haze or bloom."
