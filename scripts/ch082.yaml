      card flat beside taeo's worn folder. Fine dust marks the paper edge. His cobalt pencil lies
      across a blank notebook. Afternoon west light, ochre/brown palette. No written copy, new stamp, glowing seal or screen.
    calm: none
    notes: "The ch81 invitation is now a practical thing on a work table."
