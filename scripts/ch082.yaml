chapter: 82
title: Meridian
when: "The next afternoon after ch81's invitation; back at the Ryu yard at dusk. No calendar date fixed."
story_beats: PART_ONE_BEATS.md#82
cast:
  taeo: outdoor
  nib: default # Adult scout; chosen ch43 boots, binoculars and all persistent props retained.
  baek: default
  minho: default
extras:
  receptionist: "Adult woman about 30, short dark bob, navy jacket with silver shoulder piping, flat shoes, blank visitor passes."
  meridian_medic: "Adult man about 40, navy field scrubs with silver shoulder piping, glasses, competent and unhurried."
  meridian_worker: "Adult woman about 45, navy utility uniform with silver yoke, one forearm in a plain temporary sling; relaxed, not a patient on display."
locations: [ryu_practice_yard, meridian_tower]
location_notes:
  ryu_practice_yard: >
    Match drawn key: south double gate, grey office southwest, single white van southeast, fixed plywood maze,
    three north targets, west trestle. Roof scene uses the grey office container's flat roof with a temporary
    secured access ladder at its west end; no added second storey, new building or relocation of the home container.
  meridian_tower: >
    No drawn key. Fictional Seoul Meridian headquarters: blue-grey glass tower, broad public entrance, plain
    silver split-bar circle emblem. Ground floor reception north, visitor lifts east, low seating west.
    A glass internal corridor overlooks a clean equipment and medical-support bay. Baek's meeting room has a
    long pale table east-west, broad south window, low files north, door west. Taeo and Nib sit north of table,
    Baek south; do not reverse the south daylight. Screens dark, signs and documents blank for lettering.
props:
  nib_locks: >
    Adult 105 cm scout, angular weathered face, LEFT-ear V-notch, one lower LEFT fang, pinkish-tan wrap,
    charcoal shorts, BROWN rope belt, RIGHT pouch/dinosaur sticker, LEFT brown WOODEN sheath. Matte-black
    8x30 binoculars high on chest, LEFT strap knot and Kett hinge mark. ID, PAPER post drawing and cobalt
    pencil secured inside pouch. Exact ch43 boots: matte dark-brown ankle-high leather work boots, broad round toes,
    four dull gunmetal eyelet pairs, dark-brown round laces in small double knots, black low-heeled lug soles,
    heel pull tabs, oat-grey socks inside collars; no hooks, buckles, logos, bright trim or visible steel caps.
  taeo_locks: >
    Navy jacket, black hoodie/cargos, one-white-stripe sneakers, one mole under RIGHT eye; olive backpack,
    faded orange OLD shield/open-door patch. Cracked dark-grey phone with green dinosaur sticker. Old recoil
    bruises hidden by sleeves; no new bleeding, load share or cardiac finding. Invitation carried in folder.
continuity_notes: >
  Begin with ch81's invitation, then the arranged visit. Baek's offer is a written, unsigned proposal.
  No money, employment, patent assignment or decision changes hands. Minho has not decided; ch90 owns his refusal.
  No numbered ledger plant/payoff due here. Keep Baek reasonable, the practical benefits real and the price explicit.
palette_notes: >
  Yard: A4 ochre/brown/sky-blue. Meridian extends A4 institutional blue-white/slate/navy, clean south daylight,
  restrained silver highlights; no gold villain lighting. Dusk roof: slate-blue sky and cool ochre reflected light.
  Flat cel shadows, no bloom. Documents/signs blank, devices dark unless ui fills a screen.
panels:
