      - {who: grandpa, type: speech, side: l, text: "I STOOD WATCH ON A COAST LIKE THIS. A CONSCRIPT. THREE YEARS OF NIGHTS."}
      - {who: nib, type: speech, side: r, text: "ALONE?"}
      - {who: grandpa, type: speech, side: l, text: "TWO HOURS AT A TIME. THEN YOUR RELIEF CAME."}
    notes: "Beat: Grandpa was a conscript at a coastal post. Army service was 36 months from 1968 to 1977 (Defense White Paper 2020), which fits a 74-year-old's early-1970s service."

  - id: P48
    shape: vignette
    gap: fade-white
    bg: white
    camera: "memory: wide, from along the cliff path"
    art: >
      A memory from about fifty years ago, desaturated cool blue-grey, soft-edged and fading into the white page. Night on a coastal cliff:
      a low sandbagged concrete guard post, a twisted pine behind it, the dark sea far below. In the centre of the frame, young Gilsu
      (extras.young_gilsu) stands at the parapet with his shoulders hunched against the cold. Along the cliff path, a second conscript (extras.relief) approaches with a lit
      flashlight: the relief. The flashlight beam is the one warm colour in the panel. The relief's face is not shown.
    calm: top
    lines:
      - {who: "offpanel:grandpa", type: speech, side: c, text: "THE COLD WASN'T THE HARD PART. THE LAST HOUR WAS."}
      - {who: "offpanel:grandpa", type: speech, side: c, text: "BUT SOMEBODY ALWAYS COMES TO TAKE OVER."}
    notes: "Beat line, verbatim: 'SOMEBODY ALWAYS COMES TO TAKE OVER.' It gives Nib the word 'relief' that he uses at the review (ch 9: 'I'M SOMEONE'S RELIEF')."

