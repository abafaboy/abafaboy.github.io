    notes: "PLANT P06 (STORY_BIBLE §8): Grandpa at the bus door, eyes on the sea gate. 'Too' points at Nib, who goes first (P33, and here up the steps). Payoff: ch 40 and ch 43–44 (the porter ID: 'Foreman says we go in first'). The patch is the one Grandpa bought him (ch 43 reveals it): do not point at it."

