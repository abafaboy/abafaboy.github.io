chapter: 8
title: "Sunday, Noon"
when: "Sunday 19 March, early spring (five days after chapter 1; the classification review is in 20 days, on 8 April). The coach arrives at 11:46 AM; the scrap yard about 12:05; the house at 12:21 PM; lunch to about 1:50; the breakwater from 2:35 to about 3:40; the bus stop at 4:31; the last coach to Seoul leaves at 4:40 PM."
story_beats: PART_ONE_BEATS.md#8
cast:
  taeo: outdoor     # navy zip jacket over the black hoodie, black cargo trousers, black low sneakers with one white stripe; olive backpack with the faded orange patch; cracked phone in his pocket all chapter (never shown). Jacket off on a peg by the sliding doors from P19; back on for the bus stop (P53–P61). Carries a white plastic bag of spicy seaweed snacks until P17
  nib: default      # barefoot; V-notch LEFT ear, lower fang LEFT; pouch RIGHT hip (still ₩13,000, Minho's receipt, his folded post drawing and Eunchae's pencil, all unchanged); brown wooden sheath LEFT hip. From P56 a small green dinosaur sticker on the pouch flap
  grandpa: default  # first full appearance: thin, slightly stooped, short white hair, weathered tan, faded blue work cap (off indoors, on the same peg), grey work jacket with many pockets, cotton work gloves; his cardboard hand cart. No chibi sheet yet: keep him out of chibi panels
  grandma: default  # first time her face is shown (ch 7 held it): short permed grey hair, reading glasses on a beaded cord, red-and-navy plaid shirt, quilted beige vest, loose dark trousers, house slippers (rubber slip-ons outdoors in P53–P61), a dish towel over one shoulder
  haru: default     # first in-person appearance: messy black hair with a cowlick, a missing front tooth, yellow T-shirt with a small dinosaur print, blue shorts, velcro sneakers (off indoors)
extras:
  passengers: "three elderly passengers on the coach with cloth-wrapped bundles on their knees, dozing (P02 only)"
  scrap_dealer: "scrap dealer, a man in his sixties: grey crew cut, a padded vest over a work shirt, cotton gloves, rubber boots, a canvas cash pouch at his waist; brisk, not unkind"
  young_gilsu: "Grandpa at about 21 (P48 memory only): thin, short army haircut, olive-drab 1970s field uniform, an M1-style steel helmet, a rifle slung on his back, a flashlight; his face recognisably Grandpa's (the same narrow, kind eyes and long jaw)"
  relief: "a second young conscript on the cliff path with a lit flashlight (P48 memory only); his face is never shown"
locations: [haeseong_bus, haeseong_port, haeseong_breakwater, grandparents_house]
location_notes:
  haeseong_bus: "No key yet (LOCATIONS.md 'Travel' names the id: Line 6 and Line 2 to the express terminal, then 3 hours). Decided here: a white intercity coach with one plain teal stripe and no lettering; inside, high-backed blue-grey fabric seats with white headrest covers and tied-back curtains. Four coaches a day to Seoul; the last leaves at 16:40 (P53)."
  haeseong_port: "Follow world/keys/haeseong_port (notes.md, key_wide, key_reverse): land to the north, water to the south; an east-west shoreline road behind a low concrete quay; the bus shelter with a dark blank timetable panel and a wooden bench on the quay-side pavement at the north-west, where Grandpa parks his cart; THREE idle small white-and-navy boats moored along the quay with ropes and floats; a blank pale warning board on the quay; low weathered houses and closed fishery sheds along the north side of the road, the wooded hill behind them; the low breakwater with tetrapods and a small white light tower; the sea gate offshore south of the harbour mouth, a narrow upright black-violet slit with its base at the waterline, about door-height against the boats, a thin cold white-cyan rim, no fog, inside a ring of SIX muted orange buoys. Added here (no key yet): a scrap dealer's yard in one of the closed fishery sheds a few minutes east along the road (corrugated iron, strapped bales of cardboard, a steel platform scale with a small red digital readout on a post), and the stepped lane that climbs the hill from the road to Grandma's house. Walk from the bus stop to the house: about 8 minutes with the cart."
  haeseong_breakwater: "Sub-key of haeseong_port (decided here; the port keys show it). The key notes put it running south from the west end of the quay. Concrete, with grey tetrapods on its seaward side, a concrete parapet along its outer edge (chest-high on Grandpa) with a flat walkway inside it, and the small white light tower at its tip. Grandpa's place is about two-thirds of the way out, where a corner of the parapet is chipped. The sea gate and its six buoys are in clear view from there. Locals call the breakwater 'the wall'."
  grandparents_house: "Follow world/keys/grandparents_house (notes.md, key_wide, key_reverse). An old single-storey house on the hill north of the road. A 3 m concrete courtyard on its south side, with three pots along the east wall, a narrow wooden bench on the west, and a plain grey metal double gate centred in the cement south wall; the stepped lane drops from the gate to the road and the harbour. The main room is 5 m east-west by 6 m north-south, with dark timber beams and a warm cone pendant over the low table. South side: glazed wooden sliding doors onto the courtyard; shoes stand on the stone step at the threshold, and there is a peg beside the doors for jackets and Grandpa's cap. North wall: the worn kitchenette (sink at the west end, two-burner hob in the centre, a small cream fridge at the north-east, a wooden cutting board, the cleaver, wall cabinets above). ch 7's kitchen corner is its east end, by the east window, with the fishing float on a hook. West wall: the small dark TV on its low cabinet with a potted plant and a few books (Haru's dinosaur books), plus ONE added prop, a small framed photo standing beside the plant (the ch 1 / ch 6 picture). North-west: the bedding alcove. East wall: one two-pane window with cream curtains. The courtyard wall blocks the sea: the gate is NOT visible from inside the house. Seating lock for P20–P41: Grandma at the WEST end (her back to the TV cabinet, nearest the sink); Grandpa at the EAST end (his back to the east window, facing the TV cabinet and the photo); Haru (next to Grandma) and Taeo (next to Grandpa) on the SOUTH side, backs to the sliding doors; Nib alone on the NORTH side, his back to the kitchenette, facing the way in (a scout's habit). He kneels upright on his cushion."
palette_notes: "Harbour, from the haeseong_port key: sky #CADCE2, sea #6C8B97 (shadow #486773), concrete #ACA99B, boat white #D4D8D2, boat navy #3C5366, buoys #B86D50 (muted, never the link amber), gate #1A1026 with a thin rim #D7F2F3. Flat, cool, clear coastal light; the gate's violet is the only saturated colour. Scrap yard: rust browns and cardboard tans; accent: the red readout. House interior, from the grandparents_house key and ART_BIBLE A4: warm key #D3AB73, walls #D2BE9B, timber #9A7750, brown shadow #7F674D, steam #E9E4D4; the daylight from the courtyard is the cool contrast. Breakwater: a bright, windy afternoon, the sea deeper blue, white spray, grey concrete; accents: the gate's violet and the white light tower. Memory (P48): ART_BIBLE A4 flashback, desaturated cool blue-grey with soft edges; one warm colour, the relief's flashlight. Bus stop: low late-afternoon gold and long blue shadows, the sea darkening, the gate's cold rim brighter; keep every gold paler and yellower than the link amber. The link amber #F2A93B appears ONLY in Nib's eyes; there is no link pulse in this chapter. No operator-interface windows (the interface stays dark until ch 19)."

panels:

  # ---------------- COLD OPEN ----------------
  - id: P01
    shape: bleed
    gap: none
    bg: white
    camera: "high aerial angle above the coast road, looking south across the harbour to the open sea"
    art: >
      Haeseong from high above, late morning (haeseong_port, matching the keys' geography). A two-lane coast road runs along the
      foot of a wooded hill; on it, small, a white intercity coach with one plain teal stripe (no lettering) heads into town past
      low weathered houses and closed fishery sheds. Below the road: the low concrete quay with three small white-and-navy fishing
      boats moored and idle, the bus shelter on the quay-side pavement, and the breakwater with its tetrapods and small white light
      tower. Out on the open water beyond the harbour mouth stands the sea gate: a narrow upright black-violet slit (#1A1026), its
      base at the waterline, door-height against the boats, like a door with no house; its thin cold white-cyan rim is sharp and its
      violet reflection lies on the water in a long broken streak. Around it, at a wide radius, six muted orange buoys. Inside their
      ring the water is empty: no boats, no gulls. Flat, clear, cool coastal light, slate-blue sea, grey concrete; the gate's violet
      is the only saturated colour. The top edge breaks the frame. Drawn and hard-edged: no fog, no particles, no lens effects,
      no readable signs.
    calm: top-left
    lines:
      - {who: narr, type: tag, text: "HAESEONG · SUNDAY · 11:46 AM"}
      - {who: taeo, type: float, text: "THREE HOURS ON THE BUS. I STILL HAVEN'T WORKED OUT WHAT TO TELL THEM."}
    sfx:
      - {text: "VMMMM", style: gate, at: [0.78, 0.66], size: S, rot: 90}
    notes: "The sea gate never closes (STORY_BIBLE §5). It stands offshore south of the harbour mouth (haeseong_port key). Taeo's want for the chapter: how to tell them."

  - id: P02
    shape: wide
    gap: short
    bg: white
    camera: "inside the coach, side-on two-shot across the pair of seats"
    art: >
      Inside the intercity coach (haeseong_bus): high-backed blue-grey fabric seats with white headrest covers, curtains tied back;
      further up the aisle, the passengers (extras) doze with bundles on their knees. In the window seat on the left, Nib (nib, default)
      kneels upright on the seat to see out, one olive-green palm flat on the glass, ears up and forward, body completely still: a
      sentry who has spotted something. (V-notch in the LEFT ear, brown rope belt, pouch on the RIGHT hip, brown wooden sheath on the
      LEFT hip, barefoot; an adult, wiry and weathered, never cute.) In the aisle seat on the right, Taeo (taeo, outdoor) holds a white
      plastic bag of snack packets on his lap (bright packet colours, no letters), the olive backpack at his feet with its patch out.
      He is not looking at the sea. He is looking at Nib, tired and a little anxious. Through the window, small: the sea and the
      upright violet slit. Cool window daylight, muted blue-grey interior; the gate's violet in the glass is the only saturated note.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "THAT DOOR IS OPEN."}
      - {who: taeo, type: speech, side: r, text: "IT NEVER CLOSES."}
    notes: "Nib names things by what they do (a phone is 'the shouting brick'): a gate is a door. Taeo's own narration calls them doors too (ch 1)."

  - id: P03
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up on Nib's eye against the window glass"
    art: >
      An extreme close-up strip: Nib's amber eye (#F2A93B) and the bridge of his long nose, very close to the window glass.
      Reflected faintly in the glass over his eye: the tiny upright violet slit on the water, so that the gate seems to stand inside
      his eye. His brow is level: professional attention, not fear. Cool daylight; the glass a pale grey-blue sheen with one crisp
      highlight. Nothing else in frame.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "WHO KEEPS WATCH ON IT?"}
    notes: "The question the chapter answers on the breakwater (P46: 'SOMEBODY SHOULD.'). Rhymes with the hook (P61), where the gate is reflected in the coach door over Taeo's face."

  - id: P04
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 8 · SUNDAY, NOON"

  # ---------------- THE HARBOUR ----------------
  - id: P05
    shape: full
    gap: long
    bg: white
    camera: "establishing, eye level from the north-west bus-stop kerb looking south-east (the haeseong_port wide-key angle)"
    art: >
      Haeseong harbour at midday (haeseong_port, wide key). Left foreground: the bus shelter with its dark blank timetable panel and
      the wooden bench. Beside the bench stands Grandpa (grandpa, default: thin, slightly stooped, short white hair under a faded blue
      work cap, grey work jacket with many pockets, cotton work gloves) with his cardboard hand cart (the two-wheeled cart parked by the
      shelter in the key), stacked with flattened cardboard tied with twine. He has straightened up and watches the road with a small,
      patient smile; the white coach is just pulling in at the left edge. Right: the low quay with its bollards; the three small
      white-and-navy fishing boats sit idle at their ropes, nets dry, floats stacked; on the quay beside them, the pale warning board
      on two posts (BLANK: the letterer adds the words). Beyond: the breakwater and its white light tower, and offshore the narrow
      violet slit inside its six buoys. No one on the boats, no fishing anywhere. Key palette: sky #CADCE2, sea #6C8B97, concrete
      #ACA99B; flat clear light.
    calm: top-right
    ui:
      - {kind: label, text: "FISHING PROHIBITED — GATE ZONE", at: [0.74, 0.40], size: 28, color: "#8E2B23", rot: 0, notes: "move onto the warning board on the quay once the art exists"}
    silent: true
    notes: "Beats: the fishing boats sit idle under the sign; Grandpa waits at the bus stop with his cardboard hand cart. Issue: elder poverty in a gate-closed port."

  - id: P06
    shape: wide
    gap: short
    bg: white
    camera: "low, from the kerb beside the coach's open front door"
    art: >
      The coach's front door has folded open. On the left, Nib (nib, default) has jumped down first and lands on the pavement in a
      scout's crouch-to-stand, barefoot, already looking round the harbour. Behind him on the bottom step, Taeo (outdoor) ducks out with
      the plastic bag and the backpack. On the right, facing them, Grandpa has stepped away from his cart and touches the brim of his cap to Nib with a
      small, old-fashioned nod, man to man. His eyes crinkle, curious, not startled. The bench and the cart behind him. Clear daylight,
      a hard shadow under the coach. Keep the lower-left corner plain pavement for the nameplate.
    calm: top
    intro: "YOON GILSU · GRANDPA"
    lines:
      - {who: grandpa, type: speech, side: r, text: "YOU'D BE NIB."}
      - {who: nib, type: speech, side: l, text: "YES."}
      - {who: grandpa, type: speech, side: r, text: "I'M HIS GRANDFATHER. WELCOME."}
    sfx:
      - {text: "PSSHH", style: quiet, at: [0.16, 0.22], size: S, rot: -6}
    notes: "Nib gets off first, so Grandpa greets him first. He treats Nib as a grown guest. He knows the name from Grandma (ch 7's call)."

  - id: P07
    shape: inset-l
    gap: short
    bg: white
    camera: "medium close-up on Taeo, three-quarter, Grandpa's gloved hand on the cart at the frame edge"
    art: >
      Taeo (outdoor) has bowed to Grandpa and come up from it looking at the cart: the stack of flattened cardboard, the twine, the worn
      rubber grips. ACTING: guilt that he is trying to make sound like a joke. At the right frame edge, Grandpa's gloved hand is back on
      the handle. Simplified harbour background in flat grey-blue.
    calm: right
    lines:
      - {who: taeo, type: speech, side: l, text: "GRANDPA. YOU DON'T HAVE TO DO THE CART ANYMORE."}
      - {who: grandpa, type: speech, side: r, text: "IT'S FINE. IT WAS ON THE WAY."}
    notes: "Grandpa's 'IT'S FINE', 1 of 3 (STORY_BIBLE: he says it too often; ch 44: 'YOUR FATHER SAID IT'S FINE TOO')."

  - id: P08
    shape: wide
    gap: long
    bg: white
    camera: "profile, tracking alongside them on the shoreline road, from the land side, the quay beyond them"
    art: >
      The three walk along the shoreline road with the quay and the idle boats beyond them. On the right, Grandpa wheels the hand cart;
      on the left, Nib walks at its side and steadies the tall stack of cardboard with one flat hand without being asked (unexpectedly
      kind with his hands), his head turned toward the boats. Grandpa lets him, amused. Taeo walks a step behind with the bag and glances
      back over his shoulder at the closed fishery sheds with their shutters down. Two gulls lift off a bollard. Midday light, hard short
      shadows, slate-blue water. The gate is out of frame.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "WHY ARE THE BOATS ASLEEP?"}
      - {who: grandpa, type: speech, side: r, text: "THE FISH ARE ALL INSIDE THE BUOYS."}
      - {who: grandpa, type: speech, side: r, text: "AND NOBODY'S ALLOWED INSIDE THE BUOYS."}
    notes: "The issue, said plainly by a man it happened to. No speech about policy."

  - id: P09
    shape: wide
    gap: short
    bg: white
    camera: "three-quarter, slightly high, just inside the scrap yard"
    art: >
      The scrap dealer's yard in a closed fishery shed (haeseong_port, no key yet): corrugated iron, strapped bales of cardboard, a heap
      of scrap metal, and a steel platform scale set into the concrete with a small digital readout box on a post (its display a blank,
      red-lit window). The cart stands on the scale. On the right, the scrap_dealer (extras) stoops to check the readout. Grandpa waits with his cap
      pushed back. Nib stands at the edge of the scale plate and looks down at the readout with intense interest, as if it were a map.
      Taeo behind with the bag. Rust browns, cardboard tans, grey concrete; the red readout is the one bright note.
    calm: top-left
    ui:
      - {kind: label, text: "64 KG", at: [0.70, 0.36], size: 30, color: "#E0362C", rot: 0, notes: "move onto the readout window once the art exists"}
    lines:
      - {who: scrap_dealer, type: speech, side: r, text: "SIXTY-FOUR KILOS."}
      - {who: scrap_dealer, type: speech, side: r, text: "FIFTY WON A KILO. THREE THOUSAND TWO HUNDRED."}
    sfx:
      - {text: "KLANK", style: quiet, at: [0.30, 0.80], size: S, rot: 4}
    notes: "Real rate: collectors get about ₩50 a kilo from dealers (Korea JoongAng Daily, 24 Jan 2026); a full cart is 100 kg or more, so 64 kg is a morning's part load. The Health Ministry's 2023 survey put collectors' pay at ₩1,226 an hour."

  - id: P10
    shape: strip
    gap: short
    bg: white
    camera: "extreme close-up, top-down on Grandpa's open palm"
    art: >
      Grandpa's weathered, tanned palm (the cotton glove pulled off and tucked under his arm). The dealer's gloved fingers lay three
      pale-blue ₩1,000 notes and two small silver ₩100 coins into it (no readable numerals). Deep creases, an old healed cut across one
      finger. Flat cardboard-tan background.
    calm: none
    lines:
      - {who: narr, type: footnote, text: "*₩3,200 ≈ US$2.30"}
    sfx:
      - {text: "CHK", style: quiet, at: [0.78, 0.40], size: S, rot: 0}
    notes: "Lock: these exact notes and coins go into Taeo's hand at P58. Footnote rate as ch 1, 4, 6 and 7."

  - id: P11
    shape: inset-r
    gap: short
    bg: white
    camera: "low two-shot at Nib's eye height"
    art: >
      Nib, on the left, looks up at Grandpa: plain, and a little offended on his behalf, ears level. Grandpa, on the right, folds the
      notes into his jacket's chest pocket and smiles down at him with his eyes crinkling, deflecting. Bales of cardboard behind them,
      drawn simply.
    calm: left
    lines:
      - {who: nib, type: speech, side: l, text: "I GOT TWENTY THOUSAND FOR AN HOUR OF LOOKING."}
      - {who: grandpa, type: speech, side: r, text: "THEN DON'T TAKE UP CARDBOARD."}
      - {who: taeo, type: float, text: "I SEND MONEY EVERY MONTH. HE STILL PULLS THE CART."}
    notes: "The sum the chapter leaves to the reader: Nib's ₩20,000 for an hour (ch 7) against Grandpa's ₩3,200 for a morning."

  # ---------------- THE HOUSE ----------------
  - id: P12
    shape: full
    gap: long
    bg: white
    camera: "high angle from the hillside above and behind the house, looking south over its roof to the harbour"
    art: >
      Establishing (grandparents_house). Foreground: the dark tiled roof of an old single-storey house on the hillside. Below the eave,
      its 3 m concrete courtyard: three pots along the east wall, a narrow wooden bench on the west, and the plain grey metal double gate
      in the cement south wall, just flung open. In the centre, Haru (haru, default: messy black hair with a cowlick, a missing front
      tooth, yellow T-shirt with a small dinosaur print, blue shorts, velcro sneakers) bursts out of it at full speed onto the stepped
      lane, arms up, mouth wide. A few steps below at the left, coming up: Taeo, Nib, and Grandpa bumping the empty cart up the steps. On
      the right, small, Grandma has stepped out from under the eave into the courtyard with a ladle. Beyond and below them: roofs stepping down to the shoreline road, the
      quay and the three boats, the breakwater with its white light tower, and far out the thin violet slit inside its buoys.
      Midday, hard sun; muted greys and slate-blue; the gate's violet is the accent.
    calm: top-right
    lines:
      - {who: narr, type: tag, text: "12:21 PM"}
      - {who: haru, type: shout, side: c, text: "HYUNG!!"}
      - {who: grandma, type: shout, side: r, text: "NOON, I SAID!"}
      - {who: taeo, type: speech, side: l, text: "SORRY!"}
    sfx:
      - {text: "KLANG!", style: impact, at: [0.44, 0.50], size: M, rot: -8}
    notes: "Geography: the house sits on the hill north of the road; the lane drops from its gate to the harbour. The gate (sea) is visible from up here, never from inside the house."

  - id: P13
    shape: wide
    gap: short
    bg: white
    camera: "side profile at Haru's chest height, on a flat landing of the lane"
    art: >
      Haru, on the right, skids to a stop on a flat landing of the lane in front of Nib and finds that he is looking DOWN at him: Haru
      (138 cm) is taller than the adult goblin (105 cm; Nib's head reaches Haru's chest). Haru's face: astonished delight, mouth open on
      the gap in his teeth. Nib, on the left, looks up at him with a level, deadpan, dignified stare, thumbs hooked in his rope belt.
      Behind them, Taeo covers his mouth.
      Comedy in normal style; the lane and the wall simplified on a flat sunny ground with light screentone. Keep the lower-left corner
      plain for the nameplate.
    calm: top
    intro: "YOON HARU · TAEO'S BROTHER"
    lines:
      - {who: haru, type: speech, side: r, text: "...YOU'RE SHORTER THAN ME."}
      - {who: nib, type: speech, side: l, text: "YOU'RE YOUNGER THAN ME."}
    sfx:
      - {text: "SKRRT", style: comic, at: [0.74, 0.86], size: S, rot: -10}
    notes: "Scale lock: Haru 138 cm, Nib 105 cm (ART_BIBLE A10)."

  - id: P14
    shape: wide
    gap: short
    bg: white
    camera: "low, from Nib's eye level looking up at Haru, focus lines"
    art: >
      Haru erupts: leaning down at Nib, counting questions off on his fingers at top speed, eyes shining, cowlick bouncing. Focus lines
      burst behind him on a flat yellow ground. In the near foreground at the bottom edge, the top of Nib's head (spiky black hair, the
      notched LEFT ear), unmoved.
    calm: top
    lines:
      - {who: haru, type: speech, side: r, text: "ARE GOBLINS OLDER THAN DINOSAURS? HAVE YOU SEEN A DINOSAUR? HOW FAST CAN YOU RUN?"}
      - {who: haru, type: speech, side: r, text: "WHO WOULD WIN, A GOBLIN OR A T. REX?"}
    notes: "Beat: Haru erupts with questions, goblins against dinosaurs. Nib answers only the last one; the rest stay unanswered (no lore about his side)."

  - id: P15
    shape: inset-l
    gap: short
    bg: white
    camera: "close-up on Nib, slight low angle"
    art: >
      Nib considers the question with total seriousness: chin lowered, eyes narrowed in a scout's appraisal, as if pricing the distance to
      a real T. rex. The small lower fang on the left just shows. Plain warm background.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "THE ONE WHO SEES THE OTHER FIRST."}
      - {who: "offpanel:haru", type: speech, side: r, text: "...THAT'S NOT AN ANSWER."}
      - {who: nib, type: speech, side: l, text: "IT'S THE ONLY ONE."}

  - id: P16
    shape: inset-r
    gap: short
    bg: white
    camera: "from Taeo's eye line, looking down at Haru"
    art: >
      Haru has turned on Taeo: arms folded, chin up, one eyebrow down, the full prosecuting face of a ten-year-old who has been let down
      before. Underneath it, unmistakably, he is very glad. Plain light background.
    calm: left
    lines:
      - {who: haru, type: speech, side: r, text: "YOU ACTUALLY CAME."}
      - {who: "offpanel:taeo", type: speech, side: l, text: "I SAID I WOULD, BOSS."}
      - {who: haru, type: speech, side: r, text: "YOU SAID THAT LAST TIME."}
    notes: "Callback to ch 1 P23 ('YOU SAID THAT LAST TIME.'). Taeo calls his brother 'boss' (STORY_BIBLE §6)."

  - id: P17
    shape: wide
    gap: long
    bg: white
    camera: "eye level with Haru, over Taeo's crouching shoulder"
    art: >
      Taeo, in the near foreground left, crouches to Haru's height and holds up the white plastic bag. In the centre, Haru snatches it
      with both hands, peers in, and the prosecuting
      face collapses into pure joy. Past Taeo's shoulder, Nib watches the exchange closely, studying how this family's negotiations work.
      Hard noon sun; the grey metal gate open behind them.
    calm: top
    lines:
      - {who: haru, type: speech, side: c, text: "...THE SPICY ONES?"}
      - {who: taeo, type: speech, side: l, text: "OBVIOUSLY."}
      - {who: haru, type: speech, side: c, text: "FINE. YOU CAN STAY."}
    notes: "Beat: the spicy seaweed snacks (Taeo remembered: Grandma's ch 7 message asked for them)."

  - id: P18
    shape: wide
    gap: short
    bg: white
    camera: "low angle from the courtyard, up at the open sliding doors"
    art: >
      Grandma (grandma, default: short permed grey hair, reading glasses on a beaded cord, red-and-navy plaid shirt, quilted beige vest,
      loose dark trousers, house slippers, a dish towel over one shoulder) stands on the right, on the raised wooden threshold of the
      open glazed sliding doors, with a ladle in one hand and the other fist on her hip. She looks Nib up and down: frank and appraising,
      the look she gave forty years of fish. Not hostile; deciding. On the left, Nib stands in the courtyard below and looks back up at
