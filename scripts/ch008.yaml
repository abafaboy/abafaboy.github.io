      swinging shut. In the narrowing upright gap between them (the same shape as the gate's slit) and through the glass, Taeo's face: mouth
      open to answer, one hand coming up, too late. Reflected faint but clear across the door glass, over his face: the sea behind the camera
      and the thin upright violet slit of the gate, so the gate seems to stand inside the door. Lower third: in the near foreground at the
      left, Grandpa's profile turned away toward the real sea, cap and white hair, his lined face steady, an old fear held perfectly still;
