  - id: P59
    shape: wide
    gap: short
    bg: white
    camera: "side-on from the pavement, the coach on the left, the quay and the sea on the right"
    art: >
      Nib has gone up the coach steps first and is already at the top, one bare heel on the last step, not looking back. Taeo stands on the
      bottom step, half turned, the food bundle in his arms and his fist closed on the money. Beside the door, Grandpa has just straightened
      the strap of Taeo's backpack (the faded orange shield-and-door patch beside his knuckles) and lets go. He is not looking at Taeo. He
      has half turned away toward the sea, and his eyes are on the gate, far out on the darkening water beyond the quay. His face is quiet;
      the 'it's fine' smile is gone. Gold light on one side of his face, blue shadow on the other.
    calm: top-left
    lines:
