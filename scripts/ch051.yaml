      Tight mouth and tired brown eyes, ONE mole under RIGHT eye. RIGHT hand open low, no new injury
      yet. Exhibition roof white lights, plain slate background. No chibi panic or change to his old
      backpack patch hanging behind him.
    calm: left
    lines:
