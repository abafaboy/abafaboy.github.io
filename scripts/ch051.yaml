chapter: 51
title: Faster Than Me
when: "Direct continuation of ch050's starting horn; 76.80 seconds of racing, then the same exhibition afternoon through evening as BangBang's edited clip spreads. No calendar date fixed."
story_beats: PART_ONE_BEATS.md#51
cast:
  taeo: outdoor
  nib: default # Ch043 chosen boots and all established scout kit.
  orrin: default
  sera: default
  park_doyun: default
  haein: default
  sejin: default
  minho: default
  bangbang: default
extras:
  event_marshal: "Same cropped-brown-haired woman from ch050, grey event polo, navy trousers, whistle and clipboard."
  event_announcer: "Public-address voice only; neutral professional delivery."
  constructs: "Exactly seven Doyun constructs, same ivory-grey articulated frames, faceless wedge heads, slate joints, long five-fingered hands, split flat feet. Nonverbal equipment with no emotional reactions."
locations: [exhibition_course, exhibition_concourse, ryu_practice_yard]
location_notes:
  exhibition_course: "Retain ch050 geography exactly: WEST lane A Doyun, EAST lane B Taeo, both operators OUTSIDE the lane rails in equal-sightline boxes. South starts to north finish; five stations: offset corners, padded counterweight, hinged deck, three target switches/shutter, final zigzag to cargo cradle. One orange cargo cylinder each; all active entrants and cylinder must finish. Max seven bodies, same apparatus, no rank handicap. Padded controlled sport apparatus, no dungeon gate or return marks. No opponent interference."
  exhibition_concourse: "Same roof-truss pavilion as ch050; east check-in, north course doors, broad west equipment access. Competitor recovery bench near north doors; Haein's diagnostic table safely on spectator side."
  ryu_practice_yard: "Late evening close to separate residential container doorway; keep keyed office southwest, van southeast and maze fixed whenever shown. Residential threshold and crew-rule sheets from ch045 retained; no move back to flat."
props:
  boots: "Nib's ch043 pair: matte dark-brown ankle-high leather lace-up work boots, broad round toe, four pairs of dull gunmetal round eyelets, dark-brown round laces in small double knots, plain black lug soles/low heel, heel pull tabs, oat-grey short socks inside collars. No hooks, buckles, logos, bright trim or visible steel caps."
  orrin_shell: "Preserve the existing ch037 shell injury and any subsequent established repair; this chapter adds no damage and does not heal it by omission."
  reservoir: "Ch050 prototype unchanged: hand-sized dull-steel rectangular housing, split copper band, ivory inspection window, two capped coupling ports, grey webbing strap, white mechanical indicator tab. No screen. Haein keeps it in a charcoal foam-lined case OFF COURSE. Postmatch diagnostic hand-plunger preload still leaks; no useful storage/release, measured duration or saturation payoff yet."
  nib_locks: "Weathered adult 105 cm; LEFT V-notch, single lower LEFT fang, brown rope belt, RIGHT pouch/green dinosaur sticker, LEFT brown wooden sheath, ch043 chosen boots. Matte-black 8x30 binoculars high on chest, LEFT-neck strap knot, fork on hinge; pale-blue ID, cobalt fork-marked pencil, folded PAPER watch-post drawing kept in pouch."
  taeo_locks: "ONE mole below RIGHT eye, old faded orange shield/open-door patch on olive backpack, dark-grey phone/top-left hairline crack/dinosaur sticker. Existing forearm bruises, plus one new faint pressure stripe on RIGHT inner forearm from bounded carrying in the race; Sejin examines it openly. No nosebleed or collapse."
palette_notes: "Course/concourse A4 institutional adaptation: blue-white roof work lights and glass daylight, slate shadows, navy rails, muted orange cargo and padding. Nib amber/Orrin slate-green appear only as separate permitted pulses in Taeo's RIGHT palm. Evening yard warm practical lamp against deep blue-grey/navy; private cyan interface stays absent. Red used only for public humiliation warning-style badge in composited UI, never decorative danger in course art."
panels:
  - id: P01
    shape: wide
    gap: none
    bg: white
    camera: "floor-level at the first corner, east lane B"
    art: >
      Pick up the very first strides from ch050: nib default in chosen boots clears lane B's first
      offset corner, adult scout crouch low, binoculars secured flat with one forearm. Orrin default
      follows with orange cargo cylinder balanced between his broad forefeet and chin for a low push,
      Sera default flanks. Exhibition roof work lights, blue-white/slate. No repeated starting horn,
      gate mark, levitation or blade drawn.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "SECOND TURN. RIGHT."}
    sfx:
      - {text: "TAK", style: quiet, at: [0.27, 0.78], size: S, rot: -7}
  - id: P02
    shape: strip
    gap: none
    bg: white
    camera: "close on Doyun's hand outside west rail"
    art: >
      park_doyun default in exhibition_course WEST OUTSIDE operator box turns two fingers before his
      constructs reach their second corner. Long bare hand, charcoal cuff, no control tablet or light.
      His poised stance shows as a clean coat edge behind. White roof lights, slate rail. No visible
      energy strings, clairvoyant map or altered apparatus.
    calm: none
    sfx:
      - {text: "TIK", style: quiet, at: [0.63, 0.52], size: S, rot: 0}
  - id: P03
    shape: full
    gap: short
    bg: white
    silent: true
    camera: "overhead northward across the identical second turns"
    art: >
