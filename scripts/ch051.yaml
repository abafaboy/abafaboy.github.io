      paths, two sharing the orange cylinder; EAST B Nib signals while Orrin makes a careful broad
      turn, Sera clear of his feet. Both operators visible outside opposite rails. Exhibition roof
      lights, blue-white/slate with two orange cylinders. No course shortcuts or eighth construct.
    calm: none
