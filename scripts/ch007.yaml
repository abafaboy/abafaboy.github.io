chapter: 7
title: Let Him Finish
when: "Two days in the week of the awakening (Grandma hears 'THIS WEEK'). Day 1, the morning after ch 6's hook: the yard, 9:58 to about 11:20 AM. Day 2: the job 11:00 AM to noon, noodles at 12:20 PM, the crossing at about 1:05 PM. Sunday (ch 8) is still ahead. No weekday is lettered."
story_beats: PART_ONE_BEATS.md#7
cast:
  taeo: outdoor     # navy zip jacket over the black hoodie, olive backpack with the faded orange patch, the cracked phone. Sneakers off on the noodle-shop floor (P41–P52); one half on in P53–P59
  nib: default      # barefoot; pouch RIGHT hip, brown wooden sheath LEFT hip; the yard radio in his LEFT hand (P11–P19, P30–P31)
  minho: default    # grey streak at the LEFT temple; radio clipped high on his LEFT chest; watch on his LEFT wrist
  haein: default    # first appearance (CHARACTER_BRIEF_2 lists ch 52; the beats bring her in here): work overalls, tool belt, safety glasses pushed up, Minho's family look
  grandma: default  # P47 and P50 only, seen from behind: her face is held for ch 8. Her voice is on the phone throughout
extras:
  server: "noodle-shop server, a woman in her late fifties: dark hair pulled back under a white kerchief, a floral print apron over a pale grey shirt, rubber sandals; brisk and warm. Must not resemble Grandma (no perm, no glasses)."
  rider: "delivery rider in his twenties: full-face white helmet with a dark visor (face never seen), plain grey rain jacket, black trousers, sneakers; a small grey scooter with an insulated delivery box on the back rack and a phone clamped to the handlebars, its screen dark. NOT Bae: no QuickHaul cap, no golem."
  crew: "two Ryu Survey crew members: a stocky man in his forties and a young woman, both in red-orange safety vests over work clothes, hard hats clipped to their belts"
  mannequin: "a plain wooden mannequin construct: featureless oval head, jointed wooden limbs, a canvas strap harness; slow and literal"
locations: [ryu_practice_yard, ryu_yard_street, noodle_shop, noodle_shop_crossing, grandparents_house]
location_notes:
  ryu_practice_yard: "LOCATION_BRIEF key. In this chapter it holds a maze of movable plywood screens (about 2 m tall, on steel feet), a scaffold observation platform with a rail and a ladder (deck about 2.5 m up), an equipment bench with a radio charging rack beside the maze entrance (the START apron), a white site-office container, orange safety mesh along the fence, and three white Ryu Survey vans (plain shield logo, no letters) along the far fence. The screens are rearranged overnight between Day 1 and Day 2."
  ryu_yard_street: "no key yet. The pavement outside the yard fence: chain-link with orange safety mesh, parked scooters, a plane tree, low buildings, overhead wires."
  noodle_shop: "no key yet. A small, cheap, street-facing noodle shop: a glass door straight onto the pavement; an order counter just inside it with menu photos on the wall (photos only); then a raised wooden floor (about 30 cm) with low tables, floor cushions and a shoe ledge at its edge; pendant lamps; a steamed-up front window. Seats for P41–P52: Nib on the far side toward the back wall, Taeo on the near side toward the door."
  noodle_shop_crossing: "no key yet. The shop's kerb is the head of a wide zebra crossing over a four-lane road, with a small concrete pedestrian refuge island in the middle. A bus stop and its stop line sit in the nearest lane just up the road from the crossing. A bus stopped there hides the road behind it from the shop door, while the view straight across the crossing stays clear."
  grandparents_house: "LOCATION_BRIEF key, the kitchen corner only: a worn counter, a wooden cutting board, a cleaver, a small window with grey daylight, a fishing float on a hook. Keep it minimal (ch 8 designs the house) and show no sea gate."
palette_notes: "Yard: dusty ochre ground, warm brown shadows, sky-blue sky, red-orange safety vests (never the link amber). Street: muted daylight greys, blue-grey asphalt, white zebra stripes. Noodle shop: warm golden-brown lamp light, brown shadows, steam white, kept browner and softer than the link amber. Grandma's kitchen: warm brown with cool grey window light. The link amber #F2A93B appears only in Taeo's palm (P55, P56, P59) and in Nib's eyes. Red appears only on the van's seizure strip (P02) and the red vehicle signal (P57). There are no operator-interface windows in this chapter: the interface stays dark until ch 19."

panels:

  # ---------------- COLD OPEN ----------------
  - id: P01
    shape: full
    gap: none
    bg: white
    camera: "establishing, high angle from above the yard fence, late morning"
    art: >
      The Ryu Survey west practice yard (ryu_practice_yard key) seen from above the fence: a fenced lot of packed, dusty-ochre dirt.
      In the middle stands a maze of movable plywood screens about 2 m tall on steel feet; beside it, a scaffold observation platform
      with a rail and a ladder. Orange safety mesh along one fence, a white site-office container, an equipment bench with a radio
      charging rack by the maze entrance. Along the far fence, three white panel vans with a plain shield-shaped logo (no letters);
      the middle van has a bright blue sticker slapped across its side door. A crew member in a red-orange safety vest carries a coil
      of rope; a plain wooden mannequin construct (extras.mannequin) carries a padded case across the dirt.
      In the foreground corner, small, at the pedestrian gate: Taeo (taeo, outdoor) arriving with his backpack, glancing at his phone
      (screen turned away from us), and Nib (nib, default) at his hip, already scanning the maze like a sentry.
      Bright spring sun from the upper left, short hard shadows. Palette: dusty ochre ground, warm brown shadows, sky-blue sky,
      red-orange vests (never the link amber). A drawn background with no readable text anywhere.
    calm: top-right
    lines:
      - {who: narr, type: tag, text: "RYU SURVEY · WEST PRACTICE YARD · 9:58 AM"}
      - {who: taeo, type: float, text: "TWENTY-TWO DAYS UNTIL THEY DECIDE WHAT HE IS."}
    notes: "The clock: in ch 6 Dr. Pyo says 'THE REVIEW IS IN TWENTY-THREE DAYS' the day before. The stickered middle van is the one Bluebird tows in ch 12."

  - id: P02
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "extreme close-up, side-on along the flank of the middle van"
    art: >
      The side-door seam of the middle white van, close. A bright blue sticker with a simple white bird silhouette is slapped across
      the seam so the door cannot open without tearing it, and a red paper seizure strip crosses it diagonally: the one red thing in
      the panel. Dust on the paint, a smeared handprint. Hard sun, a crisp shadow under the door handle.
      No letters or numbers on the sticker or the strip: flat blocks only.
    calm: none

  - id: P03
    shape: wide
    gap: short
    bg: white
    camera: "medium, across the equipment bench at bench height"
    art: >
      Haein (haein, default: work overalls, tool belt, clear safety glasses pushed up on her head) sits at the equipment bench in the
      foreground with a handheld radio taken apart in front of her: the casing, a dark circuit board, the battery, the antenna, tiny
      screws in a magnetic dish. She does not look up: jeweller's screwdriver in hand, eyes narrowed at the board, mouth flat and bored.
      Beyond the bench, Taeo approaches with a clear plastic folder of papers held to his chest, a polite half-bow and one hand raised,
      apologetic before anyone has said anything. Nib stands at his hip with his eyes fixed on the dish of screws, keenly interested.
      Late-morning sun from the upper left; ochre dirt; the bench throws a hard shadow. Plywood screens behind as flat shapes.
    calm: top
    lines:
      - {who: haein, type: speech, side: l, text: "IF YOU'RE FROM BLUEBIRD, THE VAN'S OVER THERE."}
      - {who: taeo, type: nervous, side: r, text: "NO— SORRY. CHAE SENT US."}
      - {who: "offpanel:minho", type: speech, side: r, text: "HAEIN. BE NICE."}
    notes: "Haein takes the polite man with a folder for a debt collector. Bluebird Capital is Ryu Survey's creditor (the debt figure stays hidden until ch 26)."

  - id: P04
    shape: wide
    gap: short
    bg: white
    camera: "low angle from behind Nib's shoulder, looking up at Minho"
    art: >
      Foreground, lower left, from low behind: the back of Nib's head and shoulders (spiky black hair; his long LEFT ear with its clear
      V-notch in the top edge). Minho (minho, default) has walked up from the maze and stands over him, clipboard under one arm, looking
      straight past Taeo and down at Nib: a level, unimpressed, measuring stare. The grey streak at his LEFT temple catches the sun;
      his radio is clipped high on his LEFT chest. At the right edge of frame, Taeo is still mid-bow, ignored.
      Sky-blue sky and the top edges of plywood screens behind Minho; hard sun from the upper left on his shoulder.
      Keep the bottom-right corner plain dirt and the foot of a screen.
    calm: bottom-right
    lines:
      - {who: minho, type: speech, side: c, text: "CHAE SAID YOU TALK."}
      - {who: minho, type: speech, side: c, text: "TALK."}

  - id: P05
    kind: title
    gap: long
    bg: white
    title_text: "CHAPTER 7 · LET HIM FINISH"

  # ---------------- THE TEST ----------------
  - id: P06
    shape: inset-l
    gap: long
    bg: white
    camera: "high angle, from Minho's eye line down at Nib"
    art: >
      Nib (nib, default: V-notch in the LEFT ear, brown rope belt, pouch on the RIGHT hip, brown wooden sheath on the LEFT hip, barefoot)
      looks straight up into the camera with his arms folded and his chin level: a flat deadpan stare. Not hostile and not cute: the
      patience of a weathered adult soldier who has been ordered about before. Amber eyes; the small lower fang on the left just showing.
      Plain ochre ground behind him.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "YOU FIRST."}
    notes: "Motif: YOU FIRST, turned on speech: whoever demands goes first."

  - id: P07
    shape: strip
    gap: short
    bg: white
    silent: true
    camera: "eye level, straight on: three reaction faces in a row"
    art: >
      A comedy reaction strip in normal style, three faces side by side. Left: Minho blinks, caught off guard, one eyebrow up.
      Centre: Haein has finally looked up from the radio, delighted, a wide sudden grin, screwdriver frozen in the air.
      Right: Taeo, still frozen mid-bow, a big sweat drop at his temple. Flat ochre background with light screentone.
    calm: none

  - id: P08
    shape: wide
    gap: short
    bg: white
    camera: "eye level, three-quarter on Minho; Haein at the bench behind him"
    art: >
      Minho, centre, turned three-quarter toward Nib at the left edge, decides it is fair: a short breath out through his nose that is
      nearly a laugh, his free hand turned toward his own chest as he introduces himself properly, to Nib. Behind him on the right,
      at the bench, Haein has gone back to the radio and does not look up. Nib, arms still folded, listens.
      Background simplified: a plywood screen, a van fender, sky.
    calm: top-right
    lines:
      - {who: minho, type: speech, side: c, text: "...FAIR. RYU MINHO. RYU SURVEY."}
      - {who: minho, type: speech, side: c, text: "WE MAP GATES BEFORE THE CLEAR TEAMS GO IN."}
      - {who: haein, type: speech, side: r, text: "CHEAPLY."}

  - id: P09
    shape: wide
    gap: short
    bg: white
    camera: "over Minho's right shoulder, looking down at Nib"
    art: >
      Over Minho's right shoulder (brown work jacket in the near foreground, right). Nib looks up at him and answers plainly, arms
      unfolded now, one hand resting near his knife hilt out of habit. Taeo stands behind Nib with his hands clasped, worried.
      A sliver of Minho's profile: serious. This is the part that matters to him. Hard sun, ochre dirt, screens simplified.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "NIB. I'M A SCOUT."}
      - {who: minho, type: speech, side: r, text: "CHAE WANTS ME TO VOUCH FOR YOU."}
      - {who: minho, type: speech, side: r, text: "I DON'T VOUCH FOR WHAT I HAVEN'T SEEN."}
    notes: "Stakes: Chae's ch 6 text asked for someone to vouch before the review."

  - id: P10
    shape: full
    gap: long
    bg: white
    camera: "top-down bird's-eye view over the plywood maze"
    art: >
      A clear overhead view of the maze, readable like a map but DRAWN (plywood grain, steel feet, hard shadows), not a diagram.
      At the bottom, the START apron: a four-wheeled flatbed trolley with a push handle and a long blue hard case strapped on it
      (about 80 cm wide), the bench beside it, Taeo and Nib next to the trolley, tiny. One entrance passage leads up to a fork.
      The LEFT branch is short and ends in a visibly narrow gap between two screens: wide enough for Nib, too narrow for the trolley.
      The RIGHT branch is longer, turns twice and ends in a wide opening. Both reach the END apron at the top, where an upturned
      plastic crate sits. Minho stands on the observation platform at the right side, pointing down.
      Sun from the upper left. No arrows, labels or painted words on the ground.
    calm: right
    lines:
      - {who: minho, type: speech, side: r, text: "ONE CASED LOAD. IN AT THAT END, OUT AT THIS ONE."}
      - {who: minho, type: speech, side: r, text: "HE WALKS AHEAD. YOU PUSH. THE SCREENS ARE TOO HIGH TO SEE OVER."}
      - {who: minho, type: speech, side: r, text: "YOU GO WHERE HE TELLS YOU. NOBODY GUESSES."}
    notes: "Lock this geometry for P12–P20: the narrow left gap, the long right branch, the crate at END, the platform on the right."

  - id: P11
    shape: wide
    gap: short
    bg: white
    camera: "medium, side-on at the bench by the START apron"
    art: >
      Haein, on the left, holds the reassembled radio down to Nib between two fingers, unceremonious; her other hand passes a second
      radio to Taeo. On the bench by her elbow, unremarked, lies ONE leftover screw.
      Nib takes the small radio in his LEFT hand, turns it over and holds it a little away from his face, deeply suspicious.
      Taeo, holding his own radio, has spotted the leftover screw and looks at it with polite worry.
      Ochre and brown tones, a strip of sky-blue.
    calm: top
    lines:
      - {who: haein, type: speech, side: l, text: "HOLD THIS TO SPEAK. LET GO TO LISTEN."}
      - {who: nib, type: speech, side: r, text: "A SMALL SHOUTING BRICK."}
      - {who: haein, type: speech, side: l, text: "...I LIKE HIM."}
    notes: "Runner: Nib calls Taeo's phone 'the shouting brick'. The radios are half-duplex: while one is talking, the other cannot be heard. Nib's radio stays in his LEFT hand (his right is his knife hand) through P19."

  - id: P12
    shape: wide
    gap: short
    bg: white
    camera: "low, over Nib's right shoulder, looking down the left passage"
    art: >
      Inside the maze. From low behind Nib's right shoulder: the left passage runs a few metres to its end, where two plywood screens
      leave a visibly narrow gap. Nib holds the radio to his mouth in his LEFT hand with the button pressed, mid-word, his free right
      hand starting to lift toward the gap to explain it. The plywood walls rise well above his head; a strip of sky above; a hard
      shadow down one wall.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "I WENT LEFT. THE GAP AT THE END—"}
    notes: "Taeo keys his own radio in P13 while Nib is still holding his, so the rest of Nib's sentence never arrives. The dash is the cut-off."

  - id: P13
    shape: wide
    gap: short
    bg: white
    camera: "low, in front of the trolley, looking back at Taeo"
    art: >
      Taeo shoves the trolley round the first corner one-handed, leaning into it, the radio at his mouth in his other hand with his
      thumb jammed on the button: eyebrows up, a small hopeful grin, the face of someone who badly wants to be good at this.
      The long blue case rattles in its straps. Motion lines; plywood walls streak past.
    calm: top-right
    lines:
      - {who: taeo, type: speech, side: c, text: "OKAY, COMING—"}
    sfx:
      - {text: "RATTLE RATTLE", style: comic, at: [0.24, 0.80], size: M, rot: -8}

  - id: P14
    shape: full
    gap: none
    bg: white
    camera: "high angle from above the screens"
    art: >
      The long blue case has jammed hard into the narrow gap at the end of the left branch; one screen wobbles on its feet.
      Taeo, jolted into the push handle, has one cheek squashed flat against the end of the case: a comedy face, eyes squeezed shut,
      mouth pressed sideways. Just beyond the gap, on the far side, Nib stands perfectly still and holds his radio up to his mouth,
      looking at Taeo from two metres away with total deadpan. Impact lines burst from the wedge.
      Hard shadows, plywood and ochre. Keep the bottom quarter of the frame plain plywood and dirt.
    calm: bottom
    lines:
      - {who: nib, type: speech, side: r, text: "I SAID I WENT LEFT."}
    sfx:
      - {text: "KLUNK!!", style: impact, at: [0.44, 0.40], size: XL, rot: -10}
      - {text: "KSSH", style: quiet, at: [0.18, 0.66], size: S, rot: 6}
    notes: "Nib uses the radio although he is two metres away: that is the joke (KSSH is his voice coming out of Taeo's radio). The trolley is light; nobody is hurt."

  - id: P15
    shape: inset-r
    gap: short
    bg: white
    camera: "close-up, eye-level side profile on Taeo"
    art: >
      Taeo rests his forehead against the end of the wedged case, eyes closed, as it lands: embarrassed, not hurt.
      The radio dangles from his hand. Simple plywood background.
    calm: left
    lines:
      - {who: taeo, type: speech, side: r, text: "...I CUT YOU OFF."}

  - id: P16
    shape: inset-l
    gap: short
    bg: white
    style: chibi
    camera: "chibi gag"
    art: >
      CHIBI gag. Chibi Minho (grey streak at his LEFT temple, brown jacket, radio on his chest) leans on the platform rail and points,
      deadpan, at ONE new white hair sprouting from his grey streak; it sparkles. Far below, a tiny chibi Taeo has turned to white stone
      against the wedged trolley. Flat ochre background with screentone dots.
    calm: right
    lines:
      - {who: minho, type: speech, side: l, text: "THAT'S YOU. THAT ONE'S YOU."}
    notes: "Starts Minho's grey-streak runner (STORY_BIBLE §9). Minho has no chibi sheet yet: derive him from his model sheet."

  - id: P17
    shape: wide
    gap: short
    bg: white
    camera: "low angle up at Minho on the observation platform"
    art: >
      Back to normal style. Minho stands at the platform rail with the clipboard under his arm, looking down into the maze: calm and
      plain, not angry. The face of a man who has seen people hurt by guessing. Sky-blue sky behind him, the sun at his left shoulder,
      a hard shadow under the platform deck.
    calm: top-left
    lines:
      - {who: minho, type: speech, side: r, text: "TAKE IT BACK."}
      - {who: minho, type: speech, side: r, text: "LET HIM FINISH LOOKING."}
    notes: "Title line."

  - id: P18
    shape: strip
    gap: long
    bg: white
    camera: "extreme close-up: Taeo's thumb, then one eye"
    art: >
      Back at START for the second run. A strip in two beats, left to right: Taeo's thumb lifting OFF the radio's talk button and
      hovering there, deliberately still; then his eye, half closed, listening. Flat plain background.
    calm: center
    lines:
      - {who: taeo, type: float, text: "WAITING IS THE HARD PART."}

  - id: P19
    shape: wide
    gap: short
    bg: white
    camera: "high angle from the observation platform down at the fork"
    art: >
      From above, past Minho's hand on the rail in the corner of frame: Nib crouches at the narrow gap with his right forearm laid across
      it like a ruler, measuring it against the trolley he remembers, his head already turned down the long right branch. The radio is
      at his mouth in his LEFT hand. Focused, unhurried, sure. Hard shadows across the passage floor; the bottom of the frame is plain dirt.
    calm: bottom
    lines:
      - {who: nib, type: speech, side: l, text: "LEFT GAP'S TOO NARROW FOR THE CART."}
      - {who: nib, type: speech, side: l, text: "TAKE THE RIGHT. THERE'S ROOM ALL THE WAY THROUGH."}
      - {who: nib, type: speech, side: l, text: "THAT'S ALL. COME."}
    notes: "'THAT'S ALL' is Nib finishing. Taeo moves only after it."

  - id: P20
    shape: full
    gap: short
    bg: white
    camera: "ground level, three-quarter, at the END apron"
    art: >
      The END apron. Nib sits on the upturned plastic crate with his back to a screen, one knee up and a forearm across it, scanning:
      the exact posture of a sentry at his wall. Taeo comes out of the wide right opening pushing the trolley slowly, the case intact,
      sweaty and relieved. Behind them Minho climbs down the platform ladder, one hand on the rail.
      Sun from the upper left, hard shadows, ochre dirt and plywood.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "TOOK YOU LONG ENOUGH."}
      - {who: minho, type: speech, side: r, text: "IT DID."}
      - {who: minho, type: speech, side: r, text: "BUT YOU STOPPED GUESSING."}
    notes: "Nib's pose quietly echoes his watch post ('WALL HERE', ch 4). Do not point it out."

  # ---------------- THE HIRE ----------------
  - id: P21
    shape: wide
    gap: short
    bg: white
    camera: "eye level with Nib, side-on two-shot"
    art: >
      Minho crouches on his heels in front of Nib's crate so that their eyes are level: he is offering the job to Nib, directly.
      Businesslike and plain. Nib listens with his ears up, attentive. Taeo stands behind with his hand still on the trolley handle,
      half cut off by the frame edge, out of the conversation.
    calm: top
    lines:
      - {who: minho, type: speech, side: r, text: "WE RESET THE SCREENS TONIGHT FOR A NEW COURSE."}
      - {who: minho, type: speech, side: r, text: "TOMORROW AT ELEVEN, WALK IT BEFORE MY CREW DOES."}
      - {who: minho, type: speech, side: r, text: "ONE HOUR. TWENTY THOUSAND WON. CASH."}

  - id: P22
    shape: inset-l
    gap: short
    bg: white
    camera: "from Taeo's eye line, looking down at Nib"
    art: >
      Nib tips his head back to look up at Taeo: a practical question, nothing more. Taeo's hand on the trolley handle at the frame edge.
    calm: right
    lines:
      - {who: nib, type: speech, side: l, text: "HOW MUCH IS TWENTY THOUSAND?"}
      - {who: taeo, type: speech, side: r, text: "...TWO OF MY LUNCHES."}
      - {who: narr, type: footnote, text: "*₩20,000 ≈ US$15"}
    notes: "Callback to ch 4's hook, 'ABOUT FIVE THOUSAND OF MY LUNCHES'. Let the reader do the sum."

  - id: P23
    shape: inset-r
    gap: short
    bg: white
    camera: "over Nib's shoulder at Minho"
    art: >
      Nib turns back to Minho and gives one short nod. Minho, still crouched, takes a small carbon receipt pad and a pen from the
      inside pocket of his jacket.
    calm: left
    lines:
      - {who: nib, type: speech, side: l, text: "THEN YES."}
      - {who: minho, type: speech, side: r, text: "I'LL WRITE YOU A RECEIPT. FOR YOUR REVIEW."}

  - id: P24
    shape: wide
    gap: short
    bg: white
    camera: "from behind Minho as he stands, toward Taeo"
    art: >
      Minho straightens up; his back and shoulder fill the near foreground on the left. Facing him on the right, Taeo has half raised
      a hand like a student, hopeful and a little too eager. Nib on the crate between them looks from one to the other.
      Minho's answer is not unkind, only true.
    calm: top-left
    lines:
      - {who: taeo, type: speech, side: r, text: "...AND ME?"}
      - {who: minho, type: speech, side: l, text: "YOU NEED MORE PRACTICE BEFORE YOU GUIDE ANYONE."}
      - {who: minho, type: speech, side: l, text: "YOU CAN WATCH."}
    notes: "Echoes Taeo's '...AND ME?' to Manager Oh in ch 1."

  - id: P25
    shape: full
    gap: short
    bg: white
    silent: true
    camera: "high crane angle over the END apron"
    art: >
      High above the apron. Minho walks Nib toward the site-office container, pointing out across the maze as he talks; Haein trails
      them with the radios. Taeo stands alone beside the trolley in the middle of the bare ochre ground, his short late-morning shadow
      pooled at his feet, the faded orange shield-and-door patch on his backpack the brightest thing on him. Still, polite, deflated.
      The screens throw long hard shadows; empty ground all round him.

  # ---------------- WALKING OUT ----------------
  - id: P26
    shape: wide
    gap: long
    bg: white
    camera: "profile, tracking alongside them on the pavement"
    art: >
      The pavement outside the yard fence (ryu_yard_street): chain-link with orange safety mesh, a row of parked scooters, a plane tree.
      Nib walks a step ahead on the left at his even scout's pace; Taeo follows on the right with his hands in his jacket pockets,
      eyes on the ground. Nib glances back and up at him. Muted daylight greys with one strip of orange mesh.
    calm: top
    lines:
      - {who: nib, type: speech, side: l, text: "YOU'RE ANNOYED."}
      - {who: taeo, type: speech, side: r, text: "A BIT."}
      - {who: nib, type: speech, side: l, text: "I DIDN'T ASK HIM TO LEAVE YOU OUT."}

  - id: P27
    shape: vignette
    gap: short
    bg: white
    camera: "close-up, slightly low, on Taeo's face"
    art: >
      Taeo's face, honest and a little raw for once: not the polite smile, only tiredness and want. His eyes on the middle distance.
      Soft daylight. The edges fade into the white page.
    calm: bottom-right
    lines:
      - {who: taeo, type: speech, side: l, text: "I KNOW."}
      - {who: taeo, type: speech, side: l, text: "I WANTED TO BE GOOD AT IT."}

  - id: P28
    shape: narrow-l
    gap: short
    bg: white
